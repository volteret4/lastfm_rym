items/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb-29575120474.jpg","rt":0.0,"sp":"","yt":"Q_NKtGTstVw","gen":["alternative rock","indie rock","post-hardcore","post-rock","Rock","Punk"],"hb":[],"da":"Rusty is the first and only full-length studio album by American math rock band Rodan. It was released in April 1994 on Quarterstick Records. The album takes its name from its engineer, Bob “Rusty” Weston. Rusty received critical acclaim and has since been cited as an influential album, often compared favorably to Slint’s 1991 album Spiderland. AllMusic writer Ned Raggett said, “this is an album to readily get lost in. The evident variety is another reason to listen, not least because everything is handled so aptly, parts of a greater overall whole.” .","dar":"There are four bands called Rodan:\n\n1) Rodan (1992) emerging from the same circle of musicians that spawned Squirrel Bait and Slint, Rodan formed in 1992 out of a failed high school rap project. Guitarists Jason Noble and Jeff Mueller enlisted Tara Jane O’Neil on bass and a couple of drummers before Kevin Coultas came aboard permanently. After a couple of 7”s and self-released cassettes, Quarterstick released the band’s first and only full-length Rusty in 1994."},{"n":155,"year":1994,"ar":"Blur","ti":"Parklife","cv":"https://dn721902.ca.archive.org/0/items/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd-27625936663.jpg","rt":0.0,"sp":"","yt":"LCp77Yf54_k","gen":["alternative rock","indie rock","britpop","rock","Pop","Alternative Rock"],"hb":["Nubis84","Rocky_stereo","alberto_gu","verygooood"],"da":"Parklife is the third studio album by the English alternative rock band blur, released on 25 April 1994 on Food Records. After disappointing sales for their previous album Modern Life is Rubbish (1993), Parklife returned Blur to prominence in the UK, helped by its four hit singles: Girls & Boys, End of a Century, Parklife and To the End. The album was certified quadruple platinum in the United Kingdom. .","dar":"Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995)."},{"n":174,"year":1994,"ar":"Frank Black","ti":"Teenager of the Year","cv":"https://ia800500.us.archive.org/9/items/mbid-179e9d26-ccd4-4a23-8cd3-1c48c5c8251a/mbid-179e9d26-ccd4-4a23-8cd3-1c48c5c8251a-23540450505.jpg","rt":0.0,"sp":"","yt":"8Qu0g5ysa4E","gen":["indie rock","Alternative Rock"],"hb":[],"da":"Released in 1994, Teenager of the Year was Frank Black’s second solo album, produced by former Pere Ubu member Eric Drew Feldman, who also played keyboards. This album is often cited as the high-point of Francis' post-Pixies catalogue, even being named to Pitchfork's \"Top 100 Albums of the 90's\". Long considered a testament to Frank Black's songwriting skills as well as his virtue as a performer, Teenager also features work by several backing musicians, including Pixies guitarist Joey Santiago and guitarist Lyle Workman. Although not originally well-received, the record is now widely praised by both critics and fans as his .","dar":"Frank Black is an American singer, songwriter, and guitarist Charles Michael Kittridge Thompson IV (born April 6, 1965). After releasing three albums with this name, he formed the band Frank Black and the Catholics. He returned to using the name Black Francis, the name he uses as vocalist of the Pixies, in 2007.\n\nLead songwriter and vocalist of the now reunited Pixies, Frank Black adopted a reversal of his former alias, Black Francis, and embarked on his solo career after the 1992 breakup of Pixies."},{"n":188,"year":1994,"ar":"Brainiac","ti":"Bonsai Superstar","cv":"https://dn711100.ca.archive.org/0/items/mbid-5a4a1117-b788-4b28-8e71-c3059257352d/mbid-5a4a1117-b788-4b28-8e71-c3059257352d-19366521630.jpg","rt":0.0,"sp":"","yt":"kqXGMUxyD4A","gen":["alternative rock","art rock","indie rock","rock","Rock","Alternative Rock"],"hb":[],"da":"Bonsai Superstar is the second album from indie rock band, Brainiac, released on November 21, 1994. It is the first album on which guitarist John Schmersal appears, who remained as the band’s lead guitarist until their break-up in 1997. Originally released through Grass Records on LP and CD formats, the album is now out-of-print. Currently, the album’s copyright is owned by The Bicycle Music Company after Grass Records merged with Wind-Up Records and subsequently sold the copyrights to the band’s music. .","dar":"Brainiac (also stylized as 3RA1N1AC), is an American indie rock band from Dayton, Ohio. It was formed in January 1992 by Tim Taylor, Juan Monasterio (Monostereo), John Schmersal and Tyler Trent. They disbanded after the sudden death of lead singer Tim Taylor in a car accident on May 23, 1997.\n\nHistory\nFormation and early albums (1992–1997)\nBrainiac was formed in Dayton, Ohio, United States in January 1992 with vocalist, guitarist and keyboard player (particularly Moog synthesizers) Tim Taylor (July 20"},{"n":53,"year":1993,"ar":"Catherine Wheel","ti":"Chrome","cv":"https://ia801002.us.archive.org/2/items/mbid-d8813dc4-e085-41b2-ab9d-2a1dac1f2299/mbid-d8813dc4-e085-41b2-ab9d-2a1dac1f2299-28257501097.jpg","rt":0.0,"sp":"","yt":"G-db6KkaXwQ","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":["verygooood"],"da":"Chrome is the second studio album by English alternative rock band Catherine Wheel, released on 20 July 1993 by Fontana Records in the United Kingdom and Mercury Records in the United States. It was produced by Gil Norton, who would later go on to produce Catherine Wheel's next album, Happy Days. The lead single, \"Crank\", reached No. 5 on Billboard's Modern Rock Tracks chart. While not all that successful commercially, Chrome has been well received by critics and fans alike. Chrome was intended by the band to be a departure into more hard rock territory when compared to their debut, .","dar":"Catherine Wheel was a four-piece shoegaze band from Great Yarmouth, England. The band was active from 1990 to 2000, experiencing fluctuating levels of commercial success, and embarking on many lengthy tours.\n\nCatherine Wheel formed in 1990, comprising singer/guitarist Rob Dickinson (cousin of Iron Maiden legend Bruce Dickinson), guitarist Brian Futter, bassist Dave Hawes, and drummer Neil Sims. Hawes had previously played in a Joy Division-influenced band called Eternal."},{"n":59,"year":1993,"ar":"PJ Harvey","ti":"Rid of Me","cv":"https://dn721608.ca.archive.org/0/items/mbid-aad52d2a-9502-4644-af00-412e264ffec0/mbid-aad52d2a-9502-4644-af00-412e264ffec0-32841758505.jpg","rt":0.0,"sp":"","yt":"8PlaNe3mXl8","gen":["alternative rock","indie rock","rock","Rock","Alternative Rock"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"Rid of Me is the second studio album by English singer-songwriter and musician PJ Harvey. It was released on May 4, 1993, via Island Records. The album marked a departure from Harvey's previous songwriting, being more raw and aggressive than its predecessor. Rid of Me was met with critical acclaim and is cited as one of the greatest albums of all time, ranking at number 153 on the 2020 version of Rolling Stone's 500 Greatest Albums of All Time (up from 406 on the list's previous edition). .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":72,"year":1993,"ar":"The Afghan Whigs","ti":"Gentlemen","cv":"https://dn710609.ca.archive.org/0/items/mbid-bbf63d9c-7d8d-4ea2-827c-ff28c35c1657/mbid-bbf63d9c-7d8d-4ea2-827c-ff28c35c1657-15193525275.jpg","rt":0.0,"sp":"","yt":"fIAXN4iF7VQ","gen":["alternative rock","indie rock","Alternative Rock"],"hb":["Nubis84","sdecandelario"],"da":null,"dar":"American band The Afghan Whigs were a soul-influenced, alternative rock band that was mainly active in the 1990s. While achieving only moderate commercial success, the Afghan Whigs attracted ample critical acclaim and deeply loyal fans, Rolling Stone described the band as spending “the bulk of their career on the brink of stardom”, yet they’ve “never quite broken beyond a substantial legion of devotees enamored of their thinly veiled sleaze.”"},{"n":104,"year":1993,"ar":"Yo La Tengo","ti":"Painful","cv":"https://ia600809.us.archive.org/24/items/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd-21480189175.jpg","rt":0.0,"sp":"","yt":"dmvXdKXi-tk","gen":["alternative rock","indie rock","rock","Alternative Rock"],"hb":[],"da":"Painful is the sixth studio album by American indie rock band Yo La Tengo, released in 1993 by record label Matador, their first for the label. The album marked a creative shift from Yo La Tengo's previous work, blending atmospheric and ambient sounds with their famous noise jams. Painful features a much more melody-driven Yo La Tengo in its hazy, dream-like songwriting. Two versions of the track \"Big Day Coming\" are present on the album and display the range of musical stylings Yo La Tengo works with; the first version features a simple organ melody accompanied by a soft bass .","dar":"Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record."},{"n":112,"year":1993,"ar":"Polvo","ti":"Today's Active Lifestyles","cv":"https://dn710308.ca.archive.org/0/items/mbid-fe43dc71-1619-4507-9b1c-771e60efc409/mbid-fe43dc71-1619-4507-9b1c-771e60efc409-21102546371.jpg","rt":0.0,"sp":"","yt":"TsD8Nwsgci8","gen":["indie rock","math rock","rock","Rock","Punk"],"hb":[],"da":"Today’s Active Lifestyles is the second studio album by American indie rock band Polvo. It was produced by Bob Weston and released on Merge Records in 1993. Early versions of the cover art featured red tigers in the yellow colour field, but these were soon removed due to a lawsuit from its painter Andy Freeburn. The album was released on Merge Records. “Tilebreaker” was released as a 7” single with the song “Chameleon” and the instrumental “Tiara Fetish” on the B-side. (“Tiara Fetish” would later appear, with lyrics, as the song “Watch the Nail” on the Merge compilation 5 Rows .","dar":"Polvo are an American indie rock band formed in Chapel Hill, North Carolina, in 1990. The band was fronted by guitarists/vocalists Ash Bowie and Dave Brylawski. Eddie Watkins played drums, and Steve Popson played bass guitar.  The band reformed in 2008 with Brian Quast assuming drum duties. Their sound, foreshadowing math rock and post-rock, is defined by angular post-punk songwriting, complex and dissonant guitar harmonies and driving rhythms, complementing cryptic lyrics. The band's name means \"dust\" in Spanish, or \"octopus\" in Portuguese."},{"n":117,"year":1993,"ar":"Grant Lee Buffalo","ti":"Fuzzy","cv":"https://dn711000.ca.archive.org/0/items/mbid-83b4d5b8-b812-4fb5-b9e0-29980162391b/mbid-83b4d5b8-b812-4fb5-b9e0-29980162391b-41018868125.jpg","rt":0.0,"sp":"","yt":"nfIaRchAdkc","gen":["alternative rock","indie rock","alternative country","Rock","Alternative Rock"],"hb":["Nubis84"],"da":null,"dar":"Grant Lee Buffalo was a Los Angeles-based rock band, consisting of Grant-Lee Phillips (vocals and guitar), Paul Kimble (bass) and Joey Peters (drums). All three were previously members of another LA band, Shiva Burlesque. As GLB, they released four albums:  Fuzzy (1993), Mighty Joe Moon  (1994), Copperopolis (1996) and Jubilee  (1998, without Kimble who had left the band the previous year). After the release of Jubilee, the band broke up and Phillips went on to pursue a solo career and is currently touring in 2025."},{"n":135,"year":1993,"ar":"Motorpsycho","ti":"Demon Box","cv":"https://dn711008.ca.archive.org/0/items/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6-15893454828.jpg","rt":0.0,"sp":"","yt":"A0DSVuYO274","gen":["psychedelic rock","alternative rock","hard rock","indie rock","rock","Rock"],"hb":[],"da":null,"dar":"Motorpsycho is a band from Trondheim in Norway, formed in 1989. Their music can generally be defined as psychedelic rock, but they also mix in elements from metal, jazz, rock, noise, pop and many other musical styles. The members of the band are Bent Sæther (bass/vocals) and Hans Magnus Ryan (guitar/vocals). Håkon Gebhardt (drums) left the band in March 2005 to concentrate on solo projects (as Gebhardt) and his other band HGH. \nDrummer Kenneth Kapstad joined Motorpsycho as a full member late in 2007."},{"n":146,"year":1993,"ar":"Girls Against Boys","ti":"Venus Luxure No. 1 Baby","cv":"https://dn710906.ca.archive.org/0/items/mbid-8a4781c1-2032-4897-a21c-037f4b4ff689/mbid-8a4781c1-2032-4897-a21c-037f4b4ff689-13364636275.jpg","rt":0.0,"sp":"","yt":"8CFiF4wY-3U","gen":["alternative rock","indie rock","post-hardcore","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Girls Against Boys are a post-hardcore band, originally forming in Washington DC in 1988 and currently based in New York City.\n\nThe group began as a side project of Eli Janney and Fugazi drummer Brendan Canty. Canty soon left the project and by 1991 Janney had gone on to recruit three former members of D.C. hardcore punk group Soulside - Scott McCloud, Johnny Temple, and Alexis Fleisig - to complete the line-up. Girls Against Boys are perhaps most notable for employing dual bass guitars"},{"n":167,"year":1993,"ar":"Blur","ti":"Modern Life Is Rubbish","cv":"https://dn710203.ca.archive.org/0/items/mbid-10f5fd34-470d-46f8-b364-7e2ddfc765e5/mbid-10f5fd34-470d-46f8-b364-7e2ddfc765e5-4454732800.jpg","rt":0.0,"sp":"","yt":"CCDzxbfCJ60","gen":["indie rock","power pop","neo-psychedelia","noise pop","britpop","rock"],"hb":[],"da":"Modern Life Is Rubbish is the second album by English alternative rock band Blur, released in May 1993. The album peaked at number 15 on the UK Album Chart and featured the singles \"For Tomorrow, \"Chemical World\" and \"Sunday Sunday\". The earlier single \"Popscene\" was added to the American release of the album. Although their debut album Leisure (1991) had been commercially successful, Blur faced a severe media backlash soon after its release, and fell out of public favour. After the group returned from an unsuccessful tour of the United States, poorly received live performances and the rising popularity of .","dar":"Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995)."},{"n":180,"year":1993,"ar":"Mercury Rev","ti":"Boces","cv":"https://dn710702.ca.archive.org/0/items/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e-16199489502.jpg","rt":0.0,"sp":"","yt":"dqcVhV8pCyA","gen":["alternative rock","blues","indie rock","dream pop","rock","Rock"],"hb":[],"da":null,"dar":"Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound"},{"n":189,"year":1993,"ar":"Swervedriver","ti":"Mezcal Head","cv":"https://dn711109.ca.archive.org/0/items/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0-12135644621.jpg","rt":0.0,"sp":"","yt":"b0DTBOQOdf4","gen":["alternative rock","indie rock","shoegaze","rock","Alternative Rock"],"hb":[],"da":"Mezcal Head is the second studio album by English alternative rock band Swervedriver. It was released on 27 September 1993 by Creation Records in the United Kingdom and on 5 October 1993 by A&M Records in the United States. .","dar":"Swervedriver is a British shoegaze band, however their heavier rock & roll style also related them to the grunge genre coming from the U.S. Pacific Northwest. Some music writers considered them to be Britain's answer to this sound. Regardless of labels, the band's mix of storming and swirling guitar experimentation often crossed into psychedelia, coupled with mystical lyrics that often praised the nihilism of sports cars, racing and the open road."},{"n":191,"year":1993,"ar":"Eric's Trip","ti":"Love Tara","cv":"https://dn721904.ca.archive.org/0/items/mbid-66f07db8-5eaa-4b09-9f0a-492852fa4060/mbid-66f07db8-5eaa-4b09-9f0a-492852fa4060-44556590426.png","rt":0.0,"sp":"","yt":"o4YDfjVin7E","gen":["alternative rock","indie rock","noise pop","indie folk","slacker rock","Alternative Rock"],"hb":[],"da":null,"dar":"Eric's Trip was a Canadian indie rock band hailing from Moncton, New Brunswick. Forming in 1990 when musicians Rick White and Christopher Thompson of The Forest joined  Julie Doiron and Ed Vaughan (who was later replaced by Mark Gaudet of Purple Knight), they took their name from a Sonic Youth song. They emulated the distorted guitar of Dinosaur Jr., the folk leanings of Neil Young, and the lo-fi aesthetic of Sebadoh. Rick White described their sound as \"sappy melodic pop music on top of thick distortion.\""},{"n":193,"year":1993,"ar":"Swirlies","ti":"Blonder Tongue Audio Baton","cv":"https://dn710006.ca.archive.org/0/items/mbid-17e02d22-03b5-48ff-bcd0-6610af01af8d/mbid-17e02d22-03b5-48ff-bcd0-6610af01af8d-32651617191.jpg","rt":0.0,"sp":"","yt":"531rtzMGh2U","gen":["indie rock","shoegaze","Rock","Alternative Rock"],"hb":[],"da":"Blonder Tongue Audio Baton (sometimes stylized Blondertongueaudiobaton) is the second studio album by American indie rock band, Swirlies, following their 1992 mini-album “What To Do About Them”. It was released on CD, LP and cassette in 1993. The band recorded the majority of the album in the summer of 1992 at Q Division Studios, Boston with engineer/co-producer Rich Costey. It is possibly their best-known and most critically praised work, with many critics citing it as a “lo-fi” answer to My Bloody Valentine’s Loveless. AllMusic would later call it “a mainstay of early-’90s indie music,” and in 2016 Pitchfork ranked the .","dar":"Swirlies is a rock band that formed in 1990 in Boston, Massachusetts, United States. The band's lineup has fluctuated heavily since formation, centered around founding members Damon Tutunjian and Andy Bernick. \n\nThe band originally consisted of  Damon Tutunjian (vocals, guitar), Seana Carmody (vocals, guitar), Andy Bernick (bass) and Ben Drucker (drums), with second bassist Morgan Andrews joining in 1992. Andrews and Drucker left in 1993, and Carmody left to form Syrup USA in 1994."},{"n":29,"year":1992,"ar":"R.E.M.","ti":"Automatic for the People","cv":"https://dn711101.ca.archive.org/0/items/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17-7646243169.jpg","rt":0.0,"sp":"","yt":"jBUjeOBzkIk","gen":["alternative rock","pop rock","acoustic rock","indie rock","jangle pop","Punk"],"hb":[],"da":"Automatic for the People is the eighth album by the American alternative rock band R.E.M., released in 1992 on Warner Bros. Records. While R.E.M. had intended to make a harder-rocking album after dealing primarily with acoustic based sounds on its previous record Out of Time (1991), the group eventually abandoned that goal and created an album that was musically subdued and dealt with mortality. Automatic for the People reached number two on the US album charts and yielded six singles. It was ranked #247 in Rolling Stone’s 500 Greatest Albums of All Time. After promotional duties for their previous album .","dar":"R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming."},{"n":42,"year":1992,"ar":"Pavement","ti":"Slanted and Enchanted","cv":"https://dn720700.ca.archive.org/0/items/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf-36814960831.jpg","rt":0.0,"sp":"","yt":"skGqpC0WYSk","gen":["alternative rock","noise rock","indie rock","noise pop","Alternative Rock"],"hb":[],"da":"Slanted and Enchanted is the debut studio album by American indie rock band Pavement, released on April 20, 1992 by Matador Records. It is the only Pavement album to feature drummer Gary Young. The album received critical acclaim and is seen as a landmark for indie rock, with Rolling Stone ranking it 199th on its 2020 edition of The 500 Greatest Albums of All Time. As of 2007, the album had sold 150,000 copies. Slanted and Enchanted was distributed to critics as early as 1991, months before its official release; the original distribution did not feature the entire band, as .","dar":"Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s."},{"n":143,"year":1992,"ar":"PJ Harvey","ti":"Dry","cv":"https://dn711009.ca.archive.org/0/items/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703-16145595354.jpg","rt":0.0,"sp":"","yt":"lABPOmNiUqY","gen":["alternative rock","indie rock","grunge","Rock","Alternative Rock"],"hb":["GabredMared","paqueradejere","sdecandelario"],"da":"Dry is the debut studio album by the band PJ Harvey, fronted by English singer-songwriter and musician PJ Harvey, released on Too Pure Records on 30 March 1992. The album was recorded at The Icehouse, a local studio in Yeovil, United Kingdom. The first 5000 LPs and first 1000 CDs included demo versions of the album's tracks, being subsequently released in the United States on Indigo Records in the US. Both versions were released in 1992. Speaking to Filter magazine in 2004, Harvey said of her debut album: \"\"Dry\" is the first chance I ever had to make a record .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":184,"year":1992,"ar":"Morrissey","ti":"Your Arsenal","cv":"https://dn710303.ca.archive.org/0/items/mbid-596071f9-a2ff-3185-a471-8fcb029625dd/mbid-596071f9-a2ff-3185-a471-8fcb029625dd-6618437694.jpg","rt":0.0,"sp":"","yt":"SX-da_xcbEQ","gen":["alternative rock","pop rock","glam rock","indie rock","indie pop","jangle pop"],"hb":[],"da":"Your Arsenal is the third studio album by English singer Morrissey, released on 27 July 1992 by record label HMV. The album received critical acclaim and reached number 4 on the UK Albums Chart. Morrissey had been rehearsing with a new band prior to the release of Your Arsenal, which was the first official album of this new line-up. Commencing with \"You're Gonna Need Someone on Your Side\", the album represents a clear change in direction for Morrissey from indie pop to a more muscular rock sound; with some elements of rockabilly. It also contains a glam rock influence, due .","dar":"Steven Patrick Morrissey, better known as Morrissey, is a British singer and lyricist of Irish descent born in Davyhulme, Manchester, United Kingdom on May 22, 1959.\n\nHe was the lead singer of The Smiths, one of the most influential alternative bands in the 1980s. The group split up in 1987 and Morrissey started a successful solo career.\n\nHis first solo album, Viva Hate was released only six months after The Smiths split, in March 1988. The album's first single \"Suedehead\" peaked at #5"},{"n":197,"year":1991,"ar":"Codeine","ti":"Frigid Stars","cv":"https://dn711200.ca.archive.org/0/items/mbid-01c518f7-7c3f-4679-9e0d-67252a737314/mbid-01c518f7-7c3f-4679-9e0d-67252a737314-15606984492.jpg","rt":0.0,"sp":"","yt":"LgdS7Lmn6_4","gen":["alternative rock","indie rock","slowcore","post-rock","rock","Alternative Rock"],"hb":[],"da":null,"dar":"American indie rock band formed in New York in 1989 by members Stephen Immerwahr (vocal, bass), Chris Brokaw (drums) and John Engle (guitar). Codeine pioneered the slowcore and sadcore subgenres of indie rock, but with a more experimental attitude than other bands in the genre, such as Low, Idaho and Red House Painters. The band's original tone, marked by slow tempos, Immerwahr's nasal and apathetic vocals, and Engle's ringing Telecaster, did not evolve much during their career."},{"n":43,"year":1991,"ar":"Screeching Weasel","ti":"My Brain Hurts","cv":"https://dn710607.ca.archive.org/0/items/mbid-41669223-0e99-4b3b-83a9-29b509ff9603/mbid-41669223-0e99-4b3b-83a9-29b509ff9603-13751836536.jpg","rt":0.0,"sp":"","yt":"EaEA2FsFrQQ","gen":["punk","punk rock","hardcore punk","pop punk","indie rock","skate punk"],"hb":["Nubis84","sdecandelario"],"da":"My Brain Hurts is the third studio album by the Chicago-based punk rock band Screeching Weasel. The album was originally released on CD, vinyl and cassette in September 1991 through Lookout Records. It was the group's first album on Lookout as well as the only release with bassist Dave Naked and the first with drummer Dan Panic, the latter of which would go on to appear on several of the band's albums. The album marked a very distinct stylistic shift for the group, fully moving toward a Ramones-inspired sound and completely abandoning their previous hardcore punk influences as a condition .","dar":"Screeching Weasel are an American punk band from Chicago, Illinois. They were formed in 1986 by Ben Weasel (aka Ben Foster who also used to be a columnist for the punk fanzine Maximum Rocknroll) and John Jughead (aka John Pierson). The band gained prominence in the early 1990s after signing to East Bay punk label, Lookout! Records and are cited to be a major influence over many bands playing that style of punk music.\n\nThrough the years, the band went through many line-up changes"},{"n":56,"year":1991,"ar":"U2","ti":"Achtung Baby","cv":"https://dn711103.ca.archive.org/0/items/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f-16544589722.jpg","rt":0.0,"sp":"","yt":"tkoEGVAHpZg","gen":["alternative rock","pop rock","post-punk","indie rock","alternative dance","dance-rock"],"hb":[],"da":"Achtung Baby is the seventh studio album by Irish rock band U2, released on 19 November 1991. The album arrived nearly two years after lead vocalist Bono announced the band would have to \"go away and dream it all up again\", following the mixed response to 1988's Rattle and Hum. While recording Achtung Baby, there was a rift between band members over the direction of the band's sound. Tensions almost prompted U2 to break-up until the band rallied around the writing of the album's hit One. The album marks a dramatic change in the band's image and sound, with the .","dar":"U2 are an Irish rock band formed in Dublin in 1976. The group comprises Paul \"Bono\" Hewson (lead vocals and rhythm guitar), David \"the Edge\" Evans (lead guitar, keyboards, and backing vocals), Adam Clayton (bass guitar), and Larry Mullen Jr. (drums and percussion). Initially rooted in post-punk, U2's musical style has evolved throughout their career, yet has maintained an anthemic quality built on Bono's expressive vocals and the Edge's chiming, effects-based guitar sounds."},{"n":109,"year":1991,"ar":"Teenage Fanclub","ti":"Bandwagonesque","cv":"https://dn710706.ca.archive.org/0/items/mbid-b597adbc-71ab-44a1-b5a0-12c4ad252894/mbid-b597adbc-71ab-44a1-b5a0-12c4ad252894-11913142700.jpg","rt":0.0,"sp":"","yt":"rqYibZeafg8","gen":["alternative rock","indie rock","power pop","jangle pop","rock","Pop"],"hb":[],"da":"'Bandwagonesque' is the third album by Scottish alternative rock band Teenage Fanclub, released in November 1991 on Creation Records. The album gave the band substantial US success when the single 'Star Sign' reached number four on the Billboard Modern Rock Tracks chart, becoming their biggest hit in that country, with \"What You Do to Me\" and \"The Concept\" also becoming top 20 hits on that chart. 'Bandwagonesque' was voted 'album of the year' for 1991 by American music magazine Spin, famously beating Nirvana's landmark album 'Nevermind' and My Bloody Valentine's epic 'Loveless'. .","dar":"Teenage Fanclub is a Scottish power pop band formed in Bellshill, Scotland in 1989 and formerly known as the Boy Hairdressers. They have two generally known humorous nicknames: \"The Fannies\" and \"The Bellshill Beach Boys\". They're revered for their devotion to chiming, The Byrds-esque guitars and harmonic vocals. The band is perhaps best known for the 1991 masterpiece 'Bandwagonesque', which presaged the later Britpop and indie pop movements, and"},{"n":122,"year":1991,"ar":"Swervedriver","ti":"Raise","cv":"https://dn710808.ca.archive.org/0/items/mbid-ddb3ca7b-fe4e-41a7-b38c-20a10900672a/mbid-ddb3ca7b-fe4e-41a7-b38c-20a10900672a-6515733451.jpg","rt":0.0,"sp":"","yt":"O8n5pEQRm84","gen":["alternative rock","indie rock","shoegaze","Alternative Rock"],"hb":[],"da":"Raise is the debut studio album by English alternative rock band Swervedriver. It was released on 30 September 1991 by Creation Records. The album contained six new songs; \"Son of Mustang Ford\", \"Rave Down\" and \"Sandblasted\" had all appeared on earlier EPs and singles released by the band between 1990 and 1991. The album received very positive reviews. Early pressings of the UK LP came with a free 7\", which included the instrumental tracks \"Surf Twang\" (a 4-track version of \"Last Train to Satansville\") and \"Deep Twang\" (a 4-track version of \"Deep Seat\"). The album was reissued as a remastered .","dar":"Swervedriver is a British shoegaze band, however their heavier rock & roll style also related them to the grunge genre coming from the U.S. Pacific Northwest. Some music writers considered them to be Britain's answer to this sound. Regardless of labels, the band's mix of storming and swirling guitar experimentation often crossed into psychedelia, coupled with mystical lyrics that often praised the nihilism of sports cars, racing and the open road."},{"n":149,"year":1991,"ar":"Superchunk","ti":"No Pocky For Kitty","cv":"https://dn721901.ca.archive.org/0/items/mbid-91c3c0fd-66d2-3d51-89e6-f08e2fe02f52/mbid-91c3c0fd-66d2-3d51-89e6-f08e2fe02f52-13615869219.jpg","rt":0.0,"sp":"","yt":"WUvUh1_4VIk","gen":["indie rock","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Superchunk is an American indie rock band formed in 1989 in Chapel Hill, North Carolina, United States. The band consists of Mac McCaughan (vocals, guitar), Laura Ballance (bass), Jim Wilbur (guitar) and Jon Wurster (drums). McCaughan and Ballance founded the indie record label Merge Records mostly to distribute the band's material, but has since grown into one of the largest indie record labels in the United States.\n\n After a pair of well-received singles, Superchunk released Superchunk in 1990, a critically-lauded LP."},{"n":151,"year":1991,"ar":"Julian Cope","ti":"Peggy Suicide","cv":"https://dn711008.ca.archive.org/0/items/mbid-9be99ebf-9486-4981-a13b-d1c960bc9ca7/mbid-9be99ebf-9486-4981-a13b-d1c960bc9ca7-6280248403.jpg","rt":0.0,"sp":"","yt":"6aYdbINegos","gen":["pop rock","post-punk","indie rock","Rock"],"hb":[],"da":"\"In the summer of 1990, I had a vision of the world. In that vision I saw the Mother Earth - an enormous goddess standing upright and proud, but throwing her head back in pain and confusion at the treatment that Mankind has chosen to mete out to her. The goddess's hair was the wind around the world and her left arm was outstretched, the moon spinning on the index finger of her left hand. She was bruised from chemical dumping, and her expression one of ecstatic and religious/spiritual sadness. There were rays of blazing light piercing the centre of .","dar":"Julian Cope (born Julian David Cope, on 21 October 1957, in Deri, Mid Glamorgan) was raised in Tamworth, Staffordshire.  He came to prominence as the singer of the Liverpool pop band The Teardrop Explodes in 1978. Cope has since released many solo albums and is a founding member of the bands Queen Elizabeth and Brain Donor. In addition to his musical career, Cope has written several books of non-fiction and autobiography.\n\nCope grew up in Tamworth, Staffordshire in the English Midlands."},{"n":174,"year":1991,"ar":"Sebadoh","ti":"III","cv":"https://ia601504.us.archive.org/2/items/mbid-6905095d-fb73-41dc-b11d-e5d875312d33/mbid-6905095d-fb73-41dc-b11d-e5d875312d33-26948702571.jpg","rt":0.0,"sp":"","yt":"uL5oNtrA-h0","gen":["indie rock","Alternative Rock"],"hb":[],"da":"III (or Sebadoh III) is the third album by the American indie rock band, Sebadoh. It was released by Homestead Records in 1991. III was the first full length Sebadoh album to feature Jason Loewenstein, who joined the band's two founding members Lou Barlow and Eric Gaffney in 1989, and debuted on the \"Gimme Indie Rock\" single earlier that year. III features songwriting contributions from all three band members, with folky, melodic material by Barlow, noisy hardcore rock by Gaffney, and songs that bridged the gap between those extremes by Loewenstein. It opens with the electric Barlow-penned \"The Freed Pig,\" .","dar":"Sebadoh is an American indie rock band originally formed in 1986 in Westfield, Massachusetts, by Dinosaur Jr. bass player Lou Barlow and Eric Gaffney. The band began as a side project, but when Barlow was kicked out of Dinosaur Jr in 1989, Sebadoh became his full-time concern.\n\nAlong with such bands as Pavement and Guided By Voices, Sebadoh helped pioneer lo-fi, a style of indie-rock characterized by low-fidelity recording techniques, often on four-track machines."},{"n":91,"year":1990,"ar":"Bitch Magnet","ti":"Ben Hur","cv":"https://dn710602.ca.archive.org/0/items/mbid-4dec6106-c522-4697-948a-a007c8f3bda1/mbid-4dec6106-c522-4697-948a-a007c8f3bda1-7455291400.jpg","rt":0.0,"sp":"","yt":"NEcn_u0FuV4","gen":["noise rock","indie rock","post-hardcore","math rock","Rock","Punk"],"hb":[],"da":"Ben Hur is the third full-length and final album released by the American post-hardcore band Bitch Magnet. It was recorded after the departure of Bitch Magnet’s added guitarist, David Gait, and features an appearance by the band’s occasional guitarist, David Grubbs. Ben Hur was recorded by Louisville, Kentucky producer Howie Gano who had engineered albums by Grubbs’ previous band, Squirrel Bait. .","dar":"Bitch Magnet was a Post-Hardcore band that formed at Oberlin College in Ohio in 1986; later moving to North Carolina.\n\nThey released their first album, Umber, in 1989; a Post-Hardcore album that would later be considered one of the genre's early exemplars. In 1990, the band released their second and final album, Ben Hur, which would push the boundaries of the genre by blending it with Noise Rock.\n\nThe band's vocalist, Sooyoung Park, and Lexi Mitchell agreed with Superchunk member Mac McCaughan to form the band Seam."},{"n":133,"year":1990,"ar":"Sonic Youth","ti":"Goo","cv":"https://ia800309.us.archive.org/13/items/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060-13523354678.jpg","rt":0.0,"sp":"","yt":"k_1rqDKM_0E","gen":["experimental rock","alternative rock","noise rock","no wave","new wave","indie rock"],"hb":[],"da":"Goo is the sixth full-length studio album by American alternative rock band Sonic Youth, released on June 26, 1990 by DGC Records. For this album, the band sought to expand upon its trademark alternating guitar arrangements and the layered sound of their previous album Daydream Nation (1988) with songwriting on that was more topical than past works, exploring themes of female empowerment and pop culture. Coming off the success of Daydream Nation, Nick Sansano returned to engineer Goo, but veteran producer Ron Saint Germain was chosen by Sonic Youth to finish mixing the album following Sansano's dismissal. Goo was a .","dar":"Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups"},{"n":155,"year":1990,"ar":"Helmet","ti":"Strap It On","cv":"https://dn721604.ca.archive.org/0/items/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e-31574430576.jpg","rt":0.0,"sp":"","yt":"_IE0TrzBYzY","gen":["hard rock","indie rock","heavy metal","metal","post-hardcore","alternative metal"],"hb":[],"da":"Strap It On is the first album by Helmet. Originally released in 1990 through Amphetamine Reptile Records, it was subsequently rereleased by Interscope in November 1991. Critics considered the album innovative for its explosive, propulsive, and often staccato riff style which greatly exploited drop D tuning. It has since become a cult classic in underground metal/ post-hardcore. The moody, atmospheric \"Sinatra\" differed from most of the fast-paced, metal-influenced songs on the album; its lyrics featured a paraphrasing of Dean Martin's famous line about the crooner, \"It's Sinatra's world/ We just live in it.\" Accolades Year ↓ Publication ↓ Country ↓ .","dar":"Helmet is an alternative metal band hailing from New York City, with its roots dating back to 1989 when vocalist and lead guitarist Page Hamilton established the group. Throughout its existence, Helmet has undergone numerous lineup changes, yet Hamilton remains the sole consistent member. Since 2010, the band has been comprised of Hamilton, drummer Kyle Stevenson, guitarist Dan Beeman, and bassist Dave Case.\n\nThe discography of Helmet boasts eight studio albums and two compilation albums."},{"n":156,"year":1990,"ar":"Cop Shoot Cop","ti":"Consumer Revolt","cv":"https://dn711204.ca.archive.org/0/items/mbid-efff648d-2083-42df-b081-8d610d6d7e9e/mbid-efff648d-2083-42df-b081-8d610d6d7e9e-22855152309.png","rt":0.0,"sp":"","yt":"O03w6HDAod0","gen":["alternative rock","noise rock","punk","indie rock","industrial rock","Rock"],"hb":["Nubis84"],"da":null,"dar":"Cop Shoot Cop was a rock music group founded in New York, NY in 1987 and disbanded in 1996.\n\nThey were frequently classified as industrial rock, but were often quite different from many bands so dubbed. Tod A.'s lyrics were clever, snide and evocative (Art Black and David Sprague suggest that \"Black humor beats black metal any day\") and their \"weirdly catchy\" music which drew \"on hot jazz and swing as much as clanging rock, emphasizing the group's stand-apart attitude.\""},{"n":179,"year":1990,"ar":"Pixies","ti":"Bossanova","cv":"https://ia601509.us.archive.org/23/items/mbid-7cc0bcbf-eb04-479c-bbf5-ca237021c492/mbid-7cc0bcbf-eb04-479c-bbf5-ca237021c492-33166933465.png","rt":0.0,"sp":"","yt":"V27ISDEbZ_Y","gen":["alternative rock","indie rock","surf rock","Rock","Alternative Rock"],"hb":[],"da":"Bossanova is the third album by the American alternative rock band Pixies, released in August 1990 on the English independent record label 4AD. All of Bossanova's original material was written by the band's frontman Black Francis; it marked the point where his artistic control over the band became absolute. The album's sound, inspired by surf and space rock, complements its lyrical focus on outer space, which references subjects such as aliens and unidentified flying objects. Because of 4AD's independent status, major label Elektra Records handled distribution in the United States; however, Bossanova only reached #70 on the Billboard 200. It .","dar":"Pixies is an American alternative rock band which formed in Boston, Massachusetts, United States in 1986. The band consists of Charles (Black Francis) Thompson IV (vocals, guitar; also known as ''Frank Black''), Joey Santiago (lead guitar),   David Lovering (drums) and Emma Richardson (bass, vocals). Until 2013, the band also featured  Kim Deal on bass and vocals. From 2016 until 2024 the band also featured Paz Lechantin on bass and vocals.   The band officially split in 1993  and reunited in 2004."}];

  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
