<head>

<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":181,"year":2023,"ar":"Svalbard","ti":"The Weight of the Mask","cv":"https://dn721600.ca.archive.org/0/items/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb-36919906357.jpg","rt":0.0,"sp":"","yt":"3wHl7suYkAM","gen":["metal","post-hardcore","shoegaze","post-rock","post-metal","Metal"],"hb":[],"da":null,"dar":"There are several bands called Svalbard.\n\n1)  An English hardcore punk band from Bristol, formed in 2011\n2) a metal band from Silesia, Poland\n3) a martial/darkwave band from Homel, Belarus.\n\n1] Svalbard are an English hardcore punk band from Bristol, formed in 2011. Following early material (compiled on the album Discography 2012–2014) they have released four studio albums: One Day All This Will End (2015), It's Hard to Have Hope (2018), When I Die, Will I Get Better? (2020), The Weight of The Mask (2023)."},{"n":161,"year":2014,"ar":"Grouper","ti":"Ruins","cv":"https://cdn2.albumoftheyear.org/600x0/album/2014/18864-ruins.jpg","rt":0.0,"sp":"","yt":"GJgXdSVFnJE","gen":["folk","dream pop","post-rock","minimalism","impressionism","rain sounds"],"hb":[],"da":"\"Ruins\" was made in Aljezur, Portugal in 2011 on a residency set up by Galeria Zé dos Bois. I recorded everything there except the last song, which I did at mother's house in 2004. I'm still surprised by what I wound up with. It was the first time I'd sat still for a few years; processed a lot of political anger and emotional garbage. Recorded pretty simply, with a portable 4-track, Sony stereo mic and an upright piano. When I wasn't recording songs I was hiking several miles to the beach. The path wound through the ruins of several old .","dar":"Grouper is the solo project of American musician, artist and producer Liz Harris (born July 15, 1980). She has released material on her own label and other independent labels since 2005. Grouper released the critically acclaimed Dragging a Dead Deer Up a Hill in 2008, followed by six more records, including a two-part album, A I A, and the piano-led album Ruins. Her twelfth album, Shade, was released in 2021.\n\nHarris was born July 15, 1980, in Northern California and grew up around the San Francisco Bay area."},{"n":49,"year":2013,"ar":"Deafheaven","ti":"Sunbather","cv":"https://dn710105.ca.archive.org/0/items/mbid-22f1d5cc-61a7-4976-975b-bf123e685fb9/mbid-22f1d5cc-61a7-4976-975b-bf123e685fb9-6186723462.jpg","rt":0.0,"sp":"","yt":"GfbLWHT7vUU","gen":["shoegaze","post-rock","post-metal","blackgaze","screamo","Metal"],"hb":["EliasJ72","Frikomid","Nubis84","Rocky_stereo","paqueradejere","sdecandelario","verygooood"],"da":"'Sunbather' is the second studio album by the American Blackgaze band Deafheaven. The Jack Shirley-produced album was released on June 11, 2013 through Deathwish Inc. 'Sunbather' was recorded in January 2013. The cover artwork for 'Sunbather' was designed by Nick Steinhardt of Touché Amoré who also designed the band's 2011 debut album Roads to Judah. The pink and orange colors on the cover are meant to resemble the color seen on the inside of one's eyelids when laying in the sun. The inspiration to have the title \"Sunbather\" written out in a simple, block formation was drawn from Pulp's 2001 .","dar":"Deafheaven are an American Blackgaze band formed in 2010. Originally based in San Francisco, the group began as a two-piece with singer George Clarke and guitarist Kerry McCoy, who recorded and self-released a demo album together. Following its release, Deafheaven recruited three new members and began to tour. Before the end of 2010, the band signed to Deathwish Inc. and later released their debut album Roads to Judah, in April 2011. They established a unique style blending black metal, shoegaze, and post-rock, among other influences."},{"n":79,"year":2008,"ar":"La Dispute","ti":"Somewhere at the Bottom of the River Between Vega and Altair","cv":"https://dn710001.ca.archive.org/0/items/mbid-6c91ff0c-d946-49c4-b4cc-d24b51da9ada/mbid-6c91ff0c-d946-49c4-b4cc-d24b51da9ada-38786027640.jpg","rt":0.0,"sp":"","yt":"ESWuv5x7vsA","gen":["progressive rock","spoken word","punk","post-hardcore","post-rock","emo"],"hb":[],"da":"Somewhere at the Bottom of the River Between Vega and Altair is La Dispute's debut album. Supported by three release shows, it was released on November 11, 2008, simultaneously along with Here, Hear II. through No Sleep Records on both CD and vinyl. The album's title is derived from an Asian folktale, which the album's lyrics loosely follow. The release received positive reviews from notable critics and maintains a legacy in the post-hardcore scene. .","dar":"La Dispute is an American post-hardcore band from Grand Rapids, Michigan, formed in 2004. The current lineup is vocalist Jordan Dreyer, drummer Brad Vander Lugt, guitarist Chad Morgan-Sterenberg, guitarist Corey Stroffolino and bass guitarist Adam Vass. With a firm passion for the concept of music and art as a medium for making new friends, La Dispute makes music that is both artistically, technically, and emotionally engaging in hopes of establishing legitimate connections with any and all interested people"},{"n":36,"year":2002,"ar":"Broken Social Scene","ti":"You Forgot It in People","cv":"https://dn711301.ca.archive.org/0/items/mbid-f461c619-5c8e-4263-8dbb-2c005d6d25fb/mbid-f461c619-5c8e-4263-8dbb-2c005d6d25fb-34299338672.jpg","rt":0.0,"sp":"","yt":"V6BLuIm872I","gen":["indie rock","post-rock","Alternative Rock"],"hb":[],"da":"You Forgot It in People is a 2002 album by Broken Social Scene. It won the Alternative Album of the Year Juno Award in 2003. It followed Feel Good Lost, and was the band's commercial and artistic breakthrough. Many of the songs that didn't make it onto the album were featured in a B-sides compilation titled Bee Hives released in 2004. You Forgot It in People features intricate, experimental production techniques and a large number of instruments coinciding with the band's vastly expanded size. Music videos were made for a number of tracks, including singles \"Stars and Sons\", \"Almost Crimes\", .","dar":"Broken Social Scene are a Canadian indie rock collective formed in 1999 in Toronto, Ontario. The band's core members were Kevin Drew and Brendan Canning. This duo recorded and released the band's ambient debut album Feel Good Lost, in 2001, with contributions from Ohad Benchetrit (also known as Years), Evan Cranley, Leslie Feist, Justin Peroff, Bill Priddle, and Charles Spearin. All of these musicians would emerge as key members of Broken Social Scene in future endeavors."},{"n":2,"year":2000,"ar":"Radiohead","ti":"Kid A","cv":"https://dn710905.ca.archive.org/0/items/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5-29475045164.png","rt":0.0,"sp":"","yt":"NUnXxh5U25Y","gen":["experimental rock","avant-garde","alternative rock","art rock","electronica","post-rock"],"hb":["BipolarMuzik","verygooood"],"da":"Kid A is the fourth studio album by the English rock band Radiohead, released on 2 October 2000 by Parlophone. On the verge of a breakdown after promoting Radiohead's 1997 album OK Computer, songwriter Thom Yorke envisioned a radical change in direction. Radiohead replaced their rock sound with synthesisers, drum machines, the ondes Martenot, string orchestras and brass instruments, incorporating influences from genres such as electronic music, krautrock, jazz, and 20th-century classical music. They recorded Kid A with OK Computer producer Nigel Godrich in Paris, Copenhagen, Gloucestershire and their hometown Oxford, England. The sessions produced over 20 tracks; Radiohead saved .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":77,"year":1999,"ar":"Boredoms","ti":"Vision Creation Newsun","cv":"https://cdn2.albumoftheyear.org/600x0/album/1141-vision-creation-newsun_162301.jpg","rt":0.0,"sp":"","yt":"lFsnPQ6JoQA","gen":["leftfield","post-rock","Rock"],"hb":[],"da":"Vision Creation Newsun finds Boredoms moving even further away from the random noise that marked their early output and settling into a loose, jam-oriented aesthetic. The first two tracks (no song titles here, only symbols) find Boredoms further investigating pounding tribal rock with propulsive drumming, energetic guitar work, and vocal chants. The overall feel bears some similarity to Super æ, with tracks that draw from Krautrock and psychedelia, but Vision Creation Newsun adds a folk element, including softer instrumental textures like hand percussion, lengthy cymbal washes, and acoustic guitars. Some passages even flirt with new age, as they weave bird .","dar":"Boredoms (sometimes known as V∞redoms) is a psychedelic/ noise rock group from Osaka, Japan. The band was officially formed in 1986, although some date the band to bedroom tape experiments from 1982. \nIn a career spanning around 30 years the group has undergone multiple changes in line-up, sound and philosophy. Beginning as a dada ‘no-core’ noise-punk outfit, transmuting into psychedelic krautrockers, their more recent records have been largely based around repetitive minimalism"},{"n":164,"year":1999,"ar":"Yume Bitsu","ti":"Yume Bitsu","cv":"https://dn710305.ca.archive.org/0/items/mbid-c89b6132-20c7-42c8-8989-71f464095adb/mbid-c89b6132-20c7-42c8-8989-71f464095adb-21700318951.jpg","rt":0.0,"sp":"","yt":"gfOSvunYXc0","gen":["space rock","indie rock","post-rock","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"Yume Bitsu (meaning \"dream beats\" in Japanese), is a psychedelic rock band. Most of the band members live along the Pacific Coast in California and Oregon. Vocalist/guitarist Adam Forkner is active as White Rainbow and is also part of Surface of Eceon, a supergroup that also features members of Landing, an ambient, psychedelic rock unit and has moonlighted as a guitarist for Devendra Banhart and Jackie-O Motherfucker.\n\nAccording to Forkner, the band's name is pronounced \"YOU may BEET suu.\""},{"n":131,"year":1998,"ar":"Tortoise","ti":"TNT","cv":"https://dn710805.ca.archive.org/0/items/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1-22029271309.jpg","rt":0.0,"sp":"","yt":"2WGb_9UW6EU","gen":["electronica","post-rock","rock","instrumental","Electronic","Alternative Rock"],"hb":["Frikomid","GabredMared","Nubis84","paqueradejere","sdecandelario","verygooood"],"da":"Expected by many to continue leading the post-rock brigade into a new fusion with dub and electronics, Tortoise instead turned yet another corner with their third album, TNT. Adding guitarist Jeff Parker to cement their musicianship as well as their connections to Chicago's fertile jazz/avant-garde scene, the band returned with a record of post-modern cool jazz, only slightly informed by the dub, Krautrock, and electronics of Millions Now Living Will Never Die. It shows from the first few seconds -- a lazy, slightly free drum solo frames a few tentative guitar chords and some teased effects, before the band kicks .","dar":"Tortoise's almost entirely instrumental music defies easy categorization.  The group gained significant attention from their early career. The members have roots in Chicago's fertile music scene, playing in various indie rock and punk groups.  Formed in 1990, Tortoise was among the first American indie rock bands to incorporate styles closer to Krautrock, dub, minimalism, electronica and various jazz styles, rather than the standard rock and roll and punk that had dominated indie rock for years."},{"n":174,"year":1998,"ar":"Dirty Three","ti":"Ocean Songs","cv":"https://dn710005.ca.archive.org/0/items/mbid-0db0f38d-61cd-402e-af98-bbc1428e82f1/mbid-0db0f38d-61cd-402e-af98-bbc1428e82f1-40092346011.jpg","rt":0.0,"sp":"","yt":"KCvgkDjUR24","gen":["post-rock","Alternative Rock"],"hb":[],"da":"This album was released in 1998 on Bella Union, the Dirty Three toured this whilst supporting a solo Nick Cave, Warren Ellis played on the solo Caveset too. .","dar":"Dirty Three is an Australian instrumental rock band, consisting of Warren Ellis (violin and bass guitar), Mick Turner (electric and bass guitars) and Jim White (drums). They formed in Melbourne, Australia in 1992.\n\nDuring their career the group have spent much of their time overseas, when not performing together Turner is based in Melbourne, White lives in New York, and Ellis in Paris.\n\nThe trio released their debut 'Sad & Dangerous', and eponymous album in 1995"},{"n":60,"year":1997,"ar":"Mogwai","ti":"Young Team","cv":"https://dn720305.ca.archive.org/0/items/mbid-fe0dfba6-4868-3ede-a3f6-f6f6d7f5fb27/mbid-fe0dfba6-4868-3ede-a3f6-f6f6d7f5fb27-8197918956.jpg","rt":0.0,"sp":"","yt":"du4JbfK5okA","gen":["noise rock","post-rock","rock","Alternative Rock"],"hb":[],"da":"Mogwai Young Team (also known as Young Team) is the debut studio album by Scottish post-rock band Mogwai. Mogwai Young Team was recorded in Summer 1997 at MCM Studios (now known as Gargleblast Studios) in Hamilton, Scotland, and was produced by Paul Savage and Andy Miller. It is largely instrumental, with one notable exception (\"R U Still in 2 It\", which features vocals from Aidan Moffat of Arab Strap), although many songs feature recordings of various individuals speaking, whether over the phone (\"Tracy\"), reading (\"Yes! I Am a Long Way from Home\"), or just rambling (\"Katrien\"). It features limited instrumentation, .","dar":"Mogwai is a Scottish post-rock/instrumental band from Glasgow formed in 1995. \nThey compose lengthy, mostly instrumental guitar-based pieces in the style of post-rock, usually focused around the elaboration of a single theme, and are known traditionally for their quiet/loud dynamic, defined bass riffs, and an eminent ambient sound, sometimes dark and sometimes grand. Although frequently referred to as post-rock, the band have revealed in interviews that they despise this categorization"},{"n":138,"year":1996,"ar":"Stereolab","ti":"Emperor Tomato Ketchup","cv":"https://ia800301.us.archive.org/13/items/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de-24086681893.jpg","rt":0.0,"sp":"","yt":"GLYu0allKgs","gen":["experimental rock","art pop","indie rock","post-rock","indie pop","indietronica"],"hb":["Nubis84","verygooood"],"da":"Emperor Tomato Ketchup is the fourth studio album by English-French rock band Stereolab. It was released on 18 March 1996 and was issued by Duophonic Records and Elektra Records. The album is named after the 1971 experimental film Emperor Tomato Ketchup by Japanese author and director Shūji Terayama. Emperor Tomato Ketchup was released on 18 March 1996 in the United Kingdom by Duophonic Records, and on 9 April 1996 in the United States by Elektra Records. The artwork for the album was inspired by the LP cover sleeve of a 1964 recording of composer Béla Bartók's Concerto for Orchestra by .","dar":"Stereolab is an Anglo-French avant-pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements."},{"n":141,"year":1996,"ar":"Bardo Pond","ti":"Amanita","cv":"https://dn710304.ca.archive.org/0/items/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3-12048716483.jpg","rt":0.0,"sp":"","yt":"YawEsEiIbqA","gen":["psychedelic rock","space rock","indie rock","shoegaze","dream pop","post-rock"],"hb":[],"da":null,"dar":"Bardo Pond are an American psychedelic rock band formed in Philadelphia, PA, United States in 1991. They are currently signed to London based label Fire Records. The current members are Michael Gibbons (guitar), John Gibbons (guitar), Isobel Sollenberger (flute and vocals), Clint Takeda (bass guitar), Jason Kourkonis (drums), and Aaron Igler (synth/electronics). Bardo Pond's drug-inspired music is often classified as space rock, acid rock, post-rock, shoegaze or noise rock."},{"n":150,"year":1996,"ar":"Tortoise","ti":"Millions Now Living Will Never Die","cv":"https://dn710804.ca.archive.org/0/items/mbid-08da1a27-a2d1-3eae-a5b0-74a935619800/mbid-08da1a27-a2d1-3eae-a5b0-74a935619800-21103719601.jpg","rt":0.0,"sp":"","yt":"gDt4_n6xP0M","gen":["experimental rock","post-rock","instrumental","Electronic","Alternative Rock"],"hb":[],"da":"Tortoise's production expertise hit an early peak with Millions Now Living Will Never Die, a work that not only references studio-centric forms like dub and electronica, but actively welds them to the group's aesthetic of sturdily constructed indie rock. The centerpiece is the 21-minute opener \"Djed,\" a multi-part track which brought Tortoise's already impressive compositional abilities to a grand scale. It's almost a history of influences in miniature, first referencing tape music and dub for several minutes, then moving on to Krautrock with a chugging section incorporating wheezing organ and understated guitar chords. Halfway through, the band takes on minimalism .","dar":"Tortoise's almost entirely instrumental music defies easy categorization.  The group gained significant attention from their early career. The members have roots in Chicago's fertile music scene, playing in various indie rock and punk groups.  Formed in 1990, Tortoise was among the first American indie rock bands to incorporate styles closer to Krautrock, dub, minimalism, electronica and various jazz styles, rather than the standard rock and roll and punk that had dominated indie rock for years."},{"n":169,"year":1996,"ar":"Dirty Three","ti":"Horse Stories","cv":"https://dn710902.ca.archive.org/0/items/mbid-5eb49fb8-f7e9-340c-b2d6-2c2a7dda10f7/mbid-5eb49fb8-f7e9-340c-b2d6-2c2a7dda10f7-19653581823.jpg","rt":0.0,"sp":"","yt":"z1Lh06y6Z1Q","gen":["alternative rock","post-rock","Alternative Rock"],"hb":[],"da":null,"dar":"Dirty Three is an Australian instrumental rock band, consisting of Warren Ellis (violin and bass guitar), Mick Turner (electric and bass guitars) and Jim White (drums). They formed in Melbourne, Australia in 1992.\n\nDuring their career the group have spent much of their time overseas, when not performing together Turner is based in Melbourne, White lives in New York, and Ellis in Paris.\n\nThe trio released their debut 'Sad & Dangerous', and eponymous album in 1995"},{"n":38,"year":1994,"ar":"Bark Psychosis","ti":"Hex","cv":"https://dn711001.ca.archive.org/0/items/mbid-6c13438f-0179-3d15-b6c8-03da5231d3fa/mbid-6c13438f-0179-3d15-b6c8-03da5231d3fa-10191158066.jpg","rt":0.0,"sp":"","yt":"jtFgAisNn1A","gen":["post-rock","Electronic","Alternative Rock"],"hb":[],"da":"Hex is the debut studio album by English post-rock band Bark Psychosis. It was released on February 14, 1994 by Circa Records in the United Kingdom and on 11 March 1994 by Caroline Records in the United States. The term \"post-rock\" was coined by music journalist Simon Reynolds in his review of the album for Mojo magazine. Reception to Hex was generally positive. Melody Maker described Hex as \"the work of a band nourished by constant evolution and is unquestionably divine\" and \"a gorgeously intense 50 minutes\". The NME referred to the band as \"nothing less than completely captivating\" and .","dar":"Bark Psychosis are a band from east London, England formed in 1986. Graham Sutton is the core of the group, supported by a dynamic roster of musicians. The line up for the seminal album \"Hex\" was Graham Sutton, Daniel Gish, John Ling, and Mark Simnett. Current members include Sutton, Colin Bradley, Lee Harris (formerly with Talk Talk), and others. Formed as a Napalm Death cover band when Sutton, Ling and Simnett were in their teens, they released several singles and EPs from 1988 to 1994."},{"n":70,"year":1994,"ar":"Unwound","ti":"New Plastic Ideas","cv":"https://dn721608.ca.archive.org/0/items/mbid-03a4f93c-ef8d-4a5a-882b-e1a8515a9768/mbid-03a4f93c-ef8d-4a5a-882b-e1a8515a9768-27704563597.jpg","rt":0.0,"sp":"","yt":"VOloYTXAU_U","gen":["noise rock","post-hardcore","post-rock","emo","emocore","rock"],"hb":[],"da":"New Plastic Ideas is the third recorded studio album by the American post-hardcore band Unwound, (though second released). The album was released on March 21, 1994 by Kill Rock Stars. The album was recorded in between from November 26–28 and December 13, 1993 at Avast! Studios in Seattle, Washington. As pointed out in The Vinyl Factory’s review for the album, New Plastic Ideas is a somewhat a step away from the feedback-ridden sound of its predecessor Fake Train and focuses more on melody and odd time signatures, although the band has stated that this was unintentional. The album's title was .","dar":"Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s"},{"n":101,"year":1994,"ar":"Rodan","ti":"Rusty","cv":"https://dn710705.ca.archive.org/0/items/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb-29575120474.jpg","rt":0.0,"sp":"","yt":"Q_NKtGTstVw","gen":["alternative rock","indie rock","post-hardcore","post-rock","Rock","Punk"],"hb":[],"da":"Rusty is the first and only full-length studio album by American math rock band Rodan. It was released in April 1994 on Quarterstick Records. The album takes its name from its engineer, Bob “Rusty” Weston. Rusty received critical acclaim and has since been cited as an influential album, often compared favorably to Slint’s 1991 album Spiderland. AllMusic writer Ned Raggett said, “this is an album to readily get lost in. The evident variety is another reason to listen, not least because everything is handled so aptly, parts of a greater overall whole.” .","dar":"There are four bands called Rodan:\n\n1) Rodan (1992) emerging from the same circle of musicians that spawned Squirrel Bait and Slint, Rodan formed in 1992 out of a failed high school rap project. Guitarists Jason Noble and Jeff Mueller enlisted Tara Jane O’Neil on bass and a couple of drummers before Kevin Coultas came aboard permanently. After a couple of 7”s and self-released cassettes, Quarterstick released the band’s first and only full-length Rusty in 1994."},{"n":194,"year":1994,"ar":"Pram","ti":"Helium","cv":"https://ia600405.us.archive.org/7/items/mbid-a67f5968-90d0-479e-bf06-5ffcf3170de4/mbid-a67f5968-90d0-479e-bf06-5ffcf3170de4-18480804864.jpg","rt":0.0,"sp":"","yt":"V2nJhk9pzh0","gen":["post-rock","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"Pram is a band formed in Birmingham, England in 1990.\n\nThe band originally consisted of vocalist Rosie Cuckston,  guitarist Matt Eaton,  Sam Owen on bass, and drummer Andy Weir. Their first album \"Gash\" was self-released and sold by mail order and at gigs. The band attracted the attention of Too Pure Records (already home to Stereolab, Mouse on Mars and PJ Harvey), and between 1993 and 1995 the label released several increasingly sophisticated albums and EPs."},{"n":197,"year":1991,"ar":"Codeine","ti":"Frigid Stars","cv":"https://dn711200.ca.archive.org/0/items/mbid-01c518f7-7c3f-4679-9e0d-67252a737314/mbid-01c518f7-7c3f-4679-9e0d-67252a737314-15606984492.jpg","rt":0.0,"sp":"","yt":"LgdS7Lmn6_4","gen":["alternative rock","indie rock","slowcore","post-rock","rock","Alternative Rock"],"hb":[],"da":null,"dar":"American indie rock band formed in New York in 1989 by members Stephen Immerwahr (vocal, bass), Chris Brokaw (drums) and John Engle (guitar). Codeine pioneered the slowcore and sadcore subgenres of indie rock, but with a more experimental attitude than other bands in the genre, such as Low, Idaho and Red House Painters. The band's original tone, marked by slow tempos, Immerwahr's nasal and apathetic vocals, and Engle's ringing Telecaster, did not evolve much during their career."},{"n":3,"year":1991,"ar":"Talk Talk","ti":"Laughing Stock","cv":"https://dn720709.ca.archive.org/0/items/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42-7497588359.jpg","rt":0.0,"sp":"","yt":"ARehbaKm4U0","gen":["experimental rock","avant-garde","post-rock","rock","Jazz","Pop"],"hb":[],"da":"Laughing Stock is the fifth and final LP from Talk Talk, released on November 19, 1991 from Polydor records. It marks the pinnacle of the band's transformation from synth-pop into an experimental, impressionistic sound that would later share characteristics with what music critics called post-rock; as such, it is the quintessential document of a proto-post-rock sound from this incredibly creative group, and it serves as a touchstone record for the era. Since it's release, many years later it has been hailed as a lost classic of the grunge-era nineties. Talk Talk had been steadily gestating a sound transformation from records .","dar":"Talk Talk were an English band formed in 1981 by Mark Hollis (vocals, guitar, piano), Lee Harris (drums), Paul Webb (bass), and Simon Brenner (keyboards). The band initially performed as a synth-pop group, and their first two albums, \"The Party's Over\" (1982) and \"It's My Life\" (1984), reached the top 40 in the UK and produced international singles including \"Talk Talk\", \"Today\", \"It's My Life\", and \"Such a Shame\".\n\nThe band's third album, \"The Colour of Spring\" (1986)"},{"n":4,"year":1991,"ar":"Slint","ti":"Spiderland","cv":"https://dn711203.ca.archive.org/0/items/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e-11175053947.jpg","rt":0.0,"sp":"","yt":"FAApF-FDkoY","gen":["alternative rock","post-hardcore","post-rock","math rock","Rock","Punk"],"hb":["alberto_gu"],"da":"Spiderland is the second and final studio album by the American rock band Slint. It contains six songs played over 40 minutes, and was released by Touch and Go Records on March 27, 1991. Slint's lineup at the time of recording comprised Brian McMahan on vocals and guitar, David Pajo on guitar, Todd Brashear on bass guitar and Britt Walford on drums. Spiderland was engineered by Brian Paulson and recorded over four days in August 1990. The music and vocal melodies were composed throughout the summer of 1990, while lyrics were written in-studio. Forming in 1986 in Louisville, Kentucky, Slint .","dar":"Slint was an American post-hardcore band consisting of Brian McMahan (guitar and vocals), David Pajo (guitar), Britt Walford (drums), Todd Brashear (bass on Spiderland) and Ethan Buckler (bass on Tweez). They formed in Louisville, Kentucky, United States in 1986. Though they disbanded circa 1991, they are considered to be a major influence on the post-hardcore, math rock, and post-rock scenes.\n\nSlint's first album Tweez was recorded by legendary sound"}];

      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
