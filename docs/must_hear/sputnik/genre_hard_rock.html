<!DOCTYPE html>

<head>
<meta charset="UTF-8">

<title>hard rock — Sputnikmusic Best Albums</title>
<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

<script>
const A = [{"n":167,"year":1996,"ar":"Marilyn Manson","ti":"Antichrist Superstar","cv":"https://dn721509.ca.archive.org/0/items/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8-21167273304.jpg","rt":0.0,"sp":"","yt":"tHI1uEQLjCk","gen":["alternative rock","hard rock","heavy metal","industrial rock","industrial metal","alternative metal"],"hb":["Frikomid","Lonsonxd"],"da":"Antichrist Superstar is the second studio album by American rock band Marilyn Manson, released on October 8, 1996, by Nothing and Interscope Records. It was recorded at Nothing Studios in New Orleans and produced by the band's eponymous vocalist along with Sean Beavan, former Skinny Puppy producer Dave Ogilvie and Trent Reznor of Nine Inch Nails. The recording of the album was marred by excessive drug use, which provoked a high level of antagonism between band members. Consequently, it was their last release to feature contributions from founding guitarist Daisy Berkowitz, who acrimoniously quit partway through recording. .","dar":"Marilyn Manson is an American rock band formed in Fort Lauderdale, Florida, in 1989 by vocalist Marilyn Manson and guitarist Daisy Berkowitz. Initially performing under the name Marilyn Manson & the Spooky Kids, the group gained a local following in South Florida during the early 1990s through their theatrical and provocative live performances. In 1993, they became the first act signed to Trent Reznor’s Nothing Records label. Until 1996, each band"},{"n":7,"year":1994,"ar":"Kyuss","ti":"Welcome To Sky Valley","cv":"https://dn710903.ca.archive.org/0/items/mbid-6205da21-55a9-457d-aa85-2f1262e25694/mbid-6205da21-55a9-457d-aa85-2f1262e25694-8267363147.jpg","rt":0.0,"sp":"","yt":"RxOTKRoPhIo","gen":["hard rock","heavy metal","stoner rock","alternative metal","stoner metal","desert rock"],"hb":[],"da":"Welcome to Sky Valley is the third studio album by American stoner rock/metal band Kyuss, originally released on June 28, 1994. Kyuss was recorded in early 1993 and scheduled for release in January 1994. They sneak-previewed the completed album at Foundations Forum 93 and contributed the song \"Demon Cleaner\" to the sampler disc. Due to mild success from their previous album, Kyuss had been promoted from their subsidiary record label \"Dali\" to the main label \"Chameleon.\" On November 11, 1993 Chameleon Records abruptly shut down. Their joint-venture partner Elektra quickly picked up the band and scheduled the album for release .","dar":"Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\"."},{"n":12,"year":1994,"ar":"Manic Street Preachers","ti":"The Holy Bible","cv":"https://dn710902.ca.archive.org/0/items/mbid-04c6af71-bb83-4791-922b-66a7091102ab/mbid-04c6af71-bb83-4791-922b-66a7091102ab-23548633118.jpg","rt":0.0,"sp":"","yt":"tettEqBvpqc","gen":["alternative rock","hard rock","post-punk","punk rock","Rock","Punk"],"hb":[],"da":"The Holy Bible is the third studio album by the Welsh rock band Manic Street Preachers. It was released on August 30, 1994 by Epic Records, a subsidiary of Sony Records, unlike their two previous albums which had been released on the Columbia Records imprint. It peaked at number 6 on the UK Albums Chart. The first single from the album, \"Faster\", was released on June 6 and peaked at #16 on the British singles chart. The single marked a new chapter for the band as the material was both lyrically and sonically different than their previous release, the Life .","dar":"Manic Street Preachers are an alternative rock band from Blackwood, Wales, formed in 1986. Often referred to as \"the Manics\", they are James Dean Bradfield (vocals, guitars), Nicky Wire (bass, occasional vocals) and Sean Moore (drums, backing vocals, occasional trumpet). The band were originally a quartet: lyricist and rhythm guitarist Richey Edwards mysteriously vanished on 1 February 1995. He was declared presumed deceased in November 2008.\n\nThe Manics released their debut album Generation Terrorists in 1992."},{"n":13,"year":1994,"ar":"Soundgarden","ti":"Superunknown","cv":"https://dn720709.ca.archive.org/0/items/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c-2236678397.jpg","rt":0.0,"sp":"","yt":"fELbXTDl5Ao","gen":["psychedelic rock","alternative rock","hard rock","stoner rock","grunge","alternative metal"],"hb":["Frikomid","Lonsonxd","sdecandelario"],"da":"Superunknown is the fourth album by the American grunge band Soundgarden. It was released on March 8, 1994 through A&M Records. The band began work on the album after touring in support of its previous album, Badmotorfinger. The resulting album captured the creativity and heaviness of the band's earlier releases while displaying a more diverse range of influences. The album was a critical and commercial success and became the band's breakout album. It peaked at number one on the Billboard 200 and reached high positions on charts worldwide. Five singles were released from the album: The Day I Tried to .","dar":"Soundgarden was an American rock band formed in Seattle, Washington, in 1984 by singer and drummer Chris Cornell, lead guitarist Kim Thayil, and bassist Hiro Yamamoto. Cornell switched to rhythm guitar in 1985, and the drum position was taken over first by Scott Sundquist and then by Matt Cameron in 1986. Yamamoto departed in 1989 and was replaced briefly by Jason Everman before Ben Shepherd joined later that year. Soundgarden disbanded in 1997 and reunited in 2010."},{"n":92,"year":1994,"ar":"The Offspring","ti":"Smash","cv":"https://dn710908.ca.archive.org/0/items/mbid-b50d155a-5cde-3600-b768-5a6fc0ce57eb/mbid-b50d155a-5cde-3600-b768-5a6fc0ce57eb-31844265343.jpg","rt":0.0,"sp":"","yt":"WanovkthKcA","gen":["alternative rock","hard rock","punk","punk rock","rock","Punk"],"hb":["sdecandelario"],"da":"Smash is the third studio album by American punk rock band The Offspring, released on April 8, 1994 through Epitaph Records. The album was the band's last collaboration with record producer Thom Wilson, who produced their previous two albums, and also their last release on Epitaph (however, that label released their next album in Europe). Smash met high critical reception upon its release, and is now considered a classic punk rock album by fans, critics, and the band members themselves alike. The album was also responsible for bringing The Offspring to the attention of a mainstream punk audience. Smash was .","dar":"The Offspring is a punk rock band formed in Huntington Beach, California, United States in 1984. From 1987 to 2003, the band's line-up included Dexter Holland (lead vocals, guitar), Noodles (lead and rhythm guitars, back vocals), Greg K. (bass, back vocals), and Ron Welty (drums, percussion), who was fired in 2003. Their current drummer is Brandon Pertzborn of Marilyn Manson who has been with the band since 2023. Greg K was fired from the band in 2018 and was replaced by Todd Morse."},{"n":131,"year":1994,"ar":"Stone Temple Pilots","ti":"Purple","cv":"https://dn721909.ca.archive.org/0/items/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016-24373460607.jpg","rt":0.0,"sp":"","yt":"6EM6Uk1BICc","gen":["alternative rock","hard rock","acoustic rock","grunge","rock","Rock"],"hb":[],"da":"Purple is the second album released by the American rock band Stone Temple Pilots, on June 7, 1994, by Atlantic Records. It contains several of the band's biggest hit songs, including \"Vasoline,\" \"Interstate Love Song,\" and \"Big Empty,\" which was also featured on The Crow soundtrack. The album was a big success for STP, debuting at #1 (for three weeks, longer than any stay at the top by Nirvana, Alice In Chains, or Soundgarden) and being certified 6x platinum. In 2006, the album was ranked number 73 on Guitar World magazine's list of the greatest 100 guitar albums of all .","dar":"Stone Temple Pilots (also known by STP) is an American grunge band from San Diego, California, that originally consisted of Scott Weiland (lead vocals), brothers Dean (guitar) and Robert DeLeo (bass, backing vocals), and Eric Kretz (drums). The band's lineup remained unchanged from its formation in 1989 until the firing of Weiland in February 2013. Linkin Park vocalist Chester Bennington joined the band in May 2013 but left amicably in November 2015."},{"n":135,"year":1993,"ar":"Motorpsycho","ti":"Demon Box","cv":"https://dn711008.ca.archive.org/0/items/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6-15893454828.jpg","rt":0.0,"sp":"","yt":"A0DSVuYO274","gen":["psychedelic rock","alternative rock","hard rock","indie rock","rock","Rock"],"hb":[],"da":null,"dar":"Motorpsycho is a band from Trondheim in Norway, formed in 1989. Their music can generally be defined as psychedelic rock, but they also mix in elements from metal, jazz, rock, noise, pop and many other musical styles. The members of the band are Bent Sæther (bass/vocals) and Hans Magnus Ryan (guitar/vocals). Håkon Gebhardt (drums) left the band in March 2005 to concentrate on solo projects (as Gebhardt) and his other band HGH. \nDrummer Kenneth Kapstad joined Motorpsycho as a full member late in 2007."},{"n":2,"year":1992,"ar":"Alice in Chains","ti":"Dirt","cv":"https://dn710800.ca.archive.org/0/items/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf-9835602113.jpg","rt":0.0,"sp":"","yt":"19CXYQhqVu0","gen":["alternative rock","hard rock","heavy metal","doom metal","metal","grunge"],"hb":["Lonsonxd","sdecandelario","verygooood"],"da":"Dirt is the second studio album by the American rock band Alice in Chains and was released on September 29, 1992 through Columbia Records. Peaking at number six on the Billboard 200, the album was well received by music critics and has since been certified four-times platinum by the RIAA. It is nowadays considered as one of the best grunge/heavy metal albums and is usually on many \"Must have\" lists. The album spawned five singles: \"Would?\", \"Them Bones\", \"Angry Chair\", \"Rooster\", and \"Down in a Hole\". The songs on the album focused on depression, drug use, war, death, and other .","dar":"Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style"},{"n":4,"year":1992,"ar":"Faith No More","ti":"Angel Dust","cv":"https://dn711100.ca.archive.org/0/items/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18-25332359916.jpg","rt":0.0,"sp":"","yt":"k0tUb-87kP8","gen":["experimental rock","alternative rock","hard rock","alternative metal","funk metal","avant-garde metal"],"hb":[],"da":"Angel Dust is the fourth studio album by American rock band Faith No More, first released through Slash on June 8, 1992 in Europe and the United States. It's the final studio album with long time guitarist Jim Martin and the second to feature Mike Patton on vocals however it is the first album in which he had an influence on the band's sound, as Patton hadn't previously had input on the musical composition of the albums predecessor, The Real Thing, as it had all been composed and recorded prior to his joining. It remains as Faith No More's highest-selling .","dar":"Faith No More was an American rock band from San Francisco, California, formed in 1979. Before September 1983, the band performed under the names Sharp Young Men and later Faith No Man. Bassist Billy Gould, keyboardist and rhythm guitarist Roddy Bottum, and drummer Mike Bordin were the longest-tenured members of the band, having been involved since its inception. The band underwent several lineup changes over the years. The final lineup consisted of Gould, Bordin, Bottum, lead guitarist Jon Hudson, and vocalist and lyricist Mike Patton."},{"n":22,"year":1992,"ar":"Kyuss","ti":"Blues For The Red Sun","cv":"https://dn720708.ca.archive.org/0/items/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be-11039555984.jpg","rt":0.0,"sp":"","yt":"gZxPm06Dhn4","gen":["alternative rock","hard rock","heavy metal","stoner rock","alternative metal","stoner metal"],"hb":[],"da":null,"dar":"Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\"."},{"n":9,"year":1991,"ar":"Pearl Jam","ti":"Ten","cv":"https://dn721905.ca.archive.org/0/items/mbid-4816047b-5a40-462a-81e7-2f6eb6687fda/mbid-4816047b-5a40-462a-81e7-2f6eb6687fda-26843414237.jpg","rt":0.0,"sp":"","yt":"JqYIwJDsinM","gen":["alternative rock","hard rock","grunge","Rock","Alternative Rock"],"hb":[],"da":"\"Ten\" is the debut album by the Pearl Jam, released on August 27, 1991 through Epic Records. Following the disbanding of bassist Jeff Ament and guitarist Stone Gossard's previous group Mother Love Bone, the two recruited vocalist Eddie Vedder, guitarist Mike McCready, and drummer Dave Krusen to form Pearl Jam in 1990. Most of the songs began as instrumental jams, to which Vedder added lyrics about topics such as depression, homelessness, and abuse. \"Ten\" was not an immediate success, but by late 1992 it had reached number two on the Billboard 200 chart. The album produced three hit singles: \"Alive\", .","dar":"Pearl Jam is an American grunge/alternative rock band formed in Seattle, Washington, in 1990. The band's lineup consists of founding members Jeff Ament (bass guitar), Stone Gossard (rhythm guitar), Mike McCready (lead guitar), and Eddie Vedder (lead vocals, guitar), as well as Matt Cameron (drums), who joined in 1998. Keyboardist Boom Gaspar has also been a touring/session member with the band since 2002. Drummers Jack Irons, Dave Krusen, Matt Chamberlain, and Dave Abbruzzese are former members of the band."},{"n":138,"year":1990,"ar":"The Black Crowes","ti":"Shake Your Money Maker","cv":"https://dn721808.ca.archive.org/0/items/mbid-23202256-c660-4070-a44c-d2c0cc739a9b/mbid-23202256-c660-4070-a44c-d2c0cc739a9b-32484241116.jpg","rt":0.0,"sp":"","yt":"2ADblE3sVok","gen":["blues rock","hard rock","roots rock","southern rock","Rock"],"hb":[],"da":"Shake Your Money Maker is the debut album by the American blues-rock band The Black Crowes, released in January 1990 (see 1990 in music). It's the only album by the band to feature guitarist Jeff Cease. The album is named after a classic blues song written by Elmore James. The Black Crowes have played the song live many times over the years, but it is not included on this album. Shake Your Money Maker peaked at #4 on Billboard's Top 200 album chart, and two of its singles, \"Hard to Handle\" and \"She Talks to Angels\", reached #1 on the .","dar":"The Black Crowes is a blues-oriented hard rock jam band formed 1989 in Atlanta, Georgia, United States that has sold over 15 million albums and were hailed by Melody Maker as \"The Most Rock N' Roll Rock N' Roll Band In The World\" The band has toured with acts such as Aerosmith, ZZ Top, Jimmy Page, Tom Petty and the Heartbreakers, Oasis and Lenny Kravitz. The Crowes are listed at #92 on VH1's \"100 Greatest Artists of Hard Rock\".\n\nAt the time of their 1990 debut, the kind of rock & roll the Black Crowes specialize in was out of style."},{"n":155,"year":1990,"ar":"Helmet","ti":"Strap It On","cv":"https://dn721604.ca.archive.org/0/items/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e-31574430576.jpg","rt":0.0,"sp":"","yt":"_IE0TrzBYzY","gen":["hard rock","indie rock","heavy metal","metal","post-hardcore","alternative metal"],"hb":[],"da":"Strap It On is the first album by Helmet. Originally released in 1990 through Amphetamine Reptile Records, it was subsequently rereleased by Interscope in November 1991. Critics considered the album innovative for its explosive, propulsive, and often staccato riff style which greatly exploited drop D tuning. It has since become a cult classic in underground metal/ post-hardcore. The moody, atmospheric \"Sinatra\" differed from most of the fast-paced, metal-influenced songs on the album; its lyrics featured a paraphrasing of Dean Martin's famous line about the crooner, \"It's Sinatra's world/ We just live in it.\" Accolades Year ↓ Publication ↓ Country ↓ .","dar":"Helmet is an alternative metal band hailing from New York City, with its roots dating back to 1989 when vocalist and lead guitarist Page Hamilton established the group. Throughout its existence, Helmet has undergone numerous lineup changes, yet Hamilton remains the sole consistent member. Since 2010, the band has been comprised of Hamilton, drummer Kyle Stevenson, guitarist Dan Beeman, and bassist Dave Case.\n\nThe discography of Helmet boasts eight studio albums and two compilation albums."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
