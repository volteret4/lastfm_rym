<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":35,"year":2024,"ar":"Oranssi Pazuzu","ti":"Muuntautuja","cv":"https://dn710001.ca.archive.org/0/items/mbid-79b5d528-ced7-4a0d-9978-7992bf65ebdd/mbid-79b5d528-ced7-4a0d-9978-7992bf65ebdd-39532311992.jpg","rt":0.0,"sp":"","yt":"ptWbrHlufCY","gen":["psychedelic","metal","black metal","avant-garde metal","Metal","Rock"],"hb":["Lonsonxd","Nubis84","sdecandelario"],"da":null,"dar":"Oranssi Pazuzu is a Finnish psychedelic black metal band formed in 2007. The band consists of Juho \"Jun-His\" Vanhanen (vocals, guitar), Korjak (drums), Moit (guitar), Evil (keyboards, percussion) and Ontto (bass guitar). The band takes its name from \"oranssi\", the Finnish word for \"orange\" and Pazuzu, a wind demon from Babylonian mythology.\n\nThe band recorded their debut album, Muukalainen Puhuu in 2008 in Korjak's family cabin. It was released via Violent Journey Records in 2009 and followed in 2010 by a split LP with Candy Cane."},{"n":12,"year":2013,"ar":"Kayo Dot","ti":"Hubardo","cv":"https://dn710007.ca.archive.org/0/items/mbid-9cf7e62d-d3fb-487e-be7e-228820567536/mbid-9cf7e62d-d3fb-487e-be7e-228820567536-30118066947.jpg","rt":0.0,"sp":"","yt":"KEVzKUhXNso","gen":["avant-garde","psychedelic","avant-garde metal","Metal"],"hb":[],"da":"Hubardo is the sixth album, a concept double album, by Kayo Dot, self-released and funded through pre-orders on frontman Toby Driver's Ice Level Records in 2013. It is the follow up to Gamma Knife, which was released in 2012. It is Kayo Dot's longest album and its first double album, and contains aspects of black metal, post-rock, jazz fusion, and chamber music. It is considered a throwback to maudlin of the Well and early Kayo Dot recordings, containing much more metal-style harsh vocals by Driver and collaborator Jason Byron than any Kayo Dot album. It also contains much more repetition, .","dar":"Kayo Dot is an avant-rock group originally from Boston, Massachusetts, United States (now based in Brooklyn, New York) that was formed in 2003 by Toby Driver after the disband of maudlin of the Well. They released their debut album Choirs of the Eye on John Zorn's Tzadik label that year.\n\nIts lineup is constantly changing, but has consisted of Toby Driver, Ron Varod, Mia Matsumiya, Keith Abrams, Tim Byrnes, David Bodie, Dan Means and Terran Olson."},{"n":173,"year":2011,"ar":"Shabazz Palaces","ti":"Black Up","cv":"https://cdn2.albumoftheyear.org/600x0/album/2386-black-up_155534.jpg","rt":0.0,"sp":"","yt":"67cx9M2c51M","gen":["avant-garde","psychedelic","dub","hip hop","experimental hip hop","abstract hip hop"],"hb":[],"da":null,"dar":"Shabazz Palaces is an American hip hop group from Seattle led by Ishmael Butler, also known as Palaceer Lazaro, formerly a member of the jazz rap group Digable Planets. Much of the project’s work was developed in collaboration with multi-instrumentalist Tendai “Baba” Maraire, the son of mbira musician Dumisani Maraire. Active since 2009, Shabazz Palaces has released five studio albums on Sub Pop, following the self-release of two EPs.\n\nThe group initially released two EPs anonymously in 2009, titled \"Shabazz Palaces\" and \"Of Light\"."},{"n":49,"year":2000,"ar":"Ulver","ti":"Perdition City","cv":"https://dn710608.ca.archive.org/0/items/mbid-5bbc88d0-ccab-43e7-97fd-1bdb143c6054/mbid-5bbc88d0-ccab-43e7-97fd-1bdb143c6054-23033184531.jpg","rt":0.0,"sp":"","yt":"AUQpHPPbdCI","gen":["psychedelic","post-industrial","black metal","rock","electronic","Metal"],"hb":[],"da":"Perdition City (subtitled Music to an Interior Film) is the fifth studio album by Norwegian collective Ulver, issued in March 2000, via Jester Records. The album was recorded and produced by Kristoffer Rygg and Tore Ylwizaker, mixed by Ylwizaker at Beep Jam Studio and mastered by Audun Strype at Strype Audio. Perdition City continues the experimentation heard on Themes from William Blake's The Marriage of Heaven and Hell and Metamorphosis, containing elements of trip hop, jazz, ambient music, spoken word and electronica, the combination being described as \"moody\", \"atmospheric\", and \"cinematic in scope\" .","dar":"Ulver (Norwegian for “wolves”) is a multi-disciplinary musical group founded in Oslo, Norway and currently based in London, England. The band was formed by Kristoffer \"Garm\" Rygg in 1993, and the current line-up includes Rygg (vocal, programming), Jørn H. Sværen (misc.), Tore Ylwizaker (programming, piano) and Daniel O'Sullivan (guitar, piano, various). Since their first black metal releases in 1993, Ulver’s style has ever been changing by combining elements of experimental"},{"n":146,"year":1997,"ar":"The Chemical Brothers","ti":"Dig Your Own Hole","cv":"https://dn710406.ca.archive.org/0/items/mbid-4331ea73-77e1-3213-a840-5e4e74180f93/mbid-4331ea73-77e1-3213-a840-5e4e74180f93-2609487756.jpg","rt":0.0,"sp":"","yt":"0kMfTYPzSnI","gen":["psychedelic","electronica","techno","big beat","breakbeat","funky breaks"],"hb":["BipolarMuzik","Frikomid","alberto_gu","sdecandelario"],"da":"Dig Your Own Hole is the second album by British electronica duo The Chemical Brothers, released in the UK on April 7, 1997. It features Noel Gallagher of Oasis and Beth Orton as guest vocalists. In 1998 Q magazine readers voted Dig Your Own Hole the 49th greatest album of all time. In 2000 the same magazine placed it at number 42 in its list of the 100 Greatest British Albums Ever. In 2004, the album was packaged with 1995's Exit Planet Dust in a limited edition box set as part of EMI's \"2CD Originals\" collection. It was certified platinum .","dar":"The Chemical Brothers is an English electronic music duo formed by Tom Rowlands and Ed Simons in Manchester in 1989. They were pioneers (along with the Prodigy, Fatboy Slim, the Crystal Method, and other acts) in bringing the big beat genre to the forefront of pop culture. After attracting Virgin Records, the duo achieved further success with second album Dig Your Own Hole (1997), which topped the UK charts. In the UK, they have had six No. 1 albums and 13 top-20 singles, including two chart-toppers."},{"n":5,"year":1993,"ar":"Slowdive","ti":"Souvlaki","cv":"https://dn710300.ca.archive.org/0/items/mbid-12694708-e437-4874-a5d4-c1ca0ec46313/mbid-12694708-e437-4874-a5d4-c1ca0ec46313-16656091378.jpg","rt":0.0,"sp":"","yt":"U6WnPceijEA","gen":["alternative rock","psychedelic","shoegaze","dream pop","rock","Pop"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Souvlaki is the second studio album by English shoegaze band Slowdive, released on June 1, 1993, via Creation Records. The album's title was taken from a skit by comedy duo The Jerky Boys, where one of the duo prank calls a hotel manager asking him to perform sexual acts on his wife. Upon learning the manager is Greek, the caller says: \"My wife loves that Greek shit... She'll suck your cock like souvlaki\". While touring Europe in early 1992, Slowdive began working on their next record, Souvlaki, writing and recording in mutiple sessions, a reported total of 40 songs were .","dar":"Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon replaced Scott from 1994-1995."},{"n":2,"year":1991,"ar":"My Bloody Valentine","ti":"Loveless","cv":"https://dn710703.ca.archive.org/0/items/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06-25797196285.jpg","rt":0.0,"sp":"","yt":"4nzZeUUiG2c","gen":["alternative rock","noise rock","psychedelic","noise pop","shoegaze","dream pop"],"hb":["verygooood"],"da":"loveless is the second studio album by Irish shoegaze band my bloody valentine, released on 4 November 1991 by Creation Records. The album was recorded over a two-year period between 1989 and 1991. Vocalist and guitarist Kevin Shields dominated the arduous recording process; intent on achieving a particular sound, he experimented with guitar tremolo techniques and tuning systems, unorthodox production methods, obscured vocals, and sampled percussion and feedback. The group cycled through nineteen studios and a larger number of engineers during the album's two-year creation, with total recording costs rumoured to have reached £250,000. While loveless did not achieve great .","dar":"my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s."},{"n":169,"year":1990,"ar":"Pale Saints","ti":"The Comforts of Madness","cv":"https://dn710902.ca.archive.org/0/items/mbid-2de02df3-e26d-37dd-812e-133469478e2d/mbid-2de02df3-e26d-37dd-812e-133469478e2d-13921439233.jpg","rt":0.0,"sp":"","yt":"V6_eO6rOQA8","gen":["psychedelic","shoegaze","dream pop","Pop","Alternative Rock"],"hb":[],"da":"The Comforts of Madness is the debut studio album by English alternative rock band Pale Saints. It was released on 12 February 1990 by 4AD. The Comforts of Madness peaked at number 40 on the UK Albums Chart. On 17 January 2020, 4AD released a remastered and expanded reissue of the album for its 30th anniversary. Reviewing The Comforts of Madness for NME, Simon Williams praised the album as an \"unnervingly multi-dimensional collage of melody and friction\" with \"at least eight Great Pop Tunes, all hooklines and absolutely no stinkers.\" The magazine later named it the 45th best album of .","dar":"Pale Saints was a British shoegaze band formed by Ian Masters (bass/vocals), Graeme Naysmith (guitar), and Chris Cooper (drums). They began as a three-piece   band based in Leeds, England, in 1987. The band was signed to 4AD records by 4AD chief Ivo after their first London show. They were amongst a number of groups in the nineties who were dubbed as shoegaze by the NME and Melody Maker. \n\nEarly band interviews showed them to be a fun-loving bunch in contrast to their dark, lyrically pessimistic pop music."},{"n":191,"year":1990,"ar":"The Shamen","ti":"En-Tact","cv":"https://dn710700.ca.archive.org/0/items/mbid-1848dabb-4604-445b-8ced-b7b02a6f8925/mbid-1848dabb-4604-445b-8ced-b7b02a6f8925-24347061403.jpg","rt":0.0,"sp":"","yt":"7qFmCxjN0m0","gen":["psychedelic","dance","electronica","acid house","techno","alternative dance"],"hb":[],"da":null,"dar":"The Shamen were an experimental acid house/techno band, initially formed in Aberdeen, Scotland by Colin Angus (b. 24 August, 1961), Derek McKenzie (b. 27 February, 1964), Keith McKenzie (b. 30 August, 1961) and Peter Stephenson (b. 1 March, 1962) in 1985 as a psychedelia-influenced indie rock act. They found underground credibility as an acid house act and a pioneer of the dance/rock crossover, before moving on to international commercial success with Ebeneezer Goode and the Boss Drum album."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
