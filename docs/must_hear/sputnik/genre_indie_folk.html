<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

iles Corey project as a collection of acoustic songs. Then, he nearly killed himself. Instead of following through with that, he started the project: a search through any, and every, piece of written word that he could find to determine if life were worth living.\nGiles Corey became a way to catalog those thoughts"},{"n":43,"year":2011,"ar":"Fleet Foxes","ti":"Helplessness Blues","cv":"https://cdn2.albumoftheyear.org/600x0/album/helplessness-blues-1.jpg","rt":0.0,"sp":"","yt":"NwfQDYKd4gE","gen":["folk rock","indie rock","indie folk"],"hb":["Frikomid","Nubis84"],"da":"Helplessness Blues is the second studio album by Seattle-based folk band Fleet Foxes (release: May 02, 2011 on Bella Union) - leaked almost six weeks prior to the release). Initially, Robin Pecknold had stated he would like the album to be released in 2009; however, the band's touring schedule had caused them some setbacks. They got together to rehearse new songs in February 2009 in a rented house outside Seattle, but the sessions were mostly scrapped. As a result of those wasted sessions, the band lost $60,000 of their own money. After their tour in support of the 2008 releases .","dar":"Fleet Foxes is an American indie folk band formed in Seattle, Washington in 2006. The band consists of Robin Pecknold (vocals, guitar), Skyler Skjelset (guitar, mandolin, backing vocals), Casey Wescott (keyboards, mandolin, backing vocals), Christian Wargo (bass, guitar, backing vocals) and Morgan Henderson (upright bass, guitar, woodwinds, violin, percussion, saxophone).\n\nLed by singer-songwriter Robin Pecknold, the band came to prominence in 2008 with the release of their second EP Sun Giant and their debut album Fleet Foxes on Sub Pop."},{"n":116,"year":2011,"ar":"Bon Iver","ti":"Bon Iver, Bon Iver","cv":"https://cdn2.albumoftheyear.org/600x0/album/2479-bon-iver-bon-iver_013505.jpg","rt":0.0,"sp":"","yt":"8bIALq5Wi-I","gen":["folk rock","folk","baroque pop","indie rock","indie folk"],"hb":[],"da":"The name ‘Bon Iver’ is derived from the French for ‘good winter.’ The album was recorded in Justin Vernon’s home town of Eau Claire in Wisconsin, where the temperature rarely rises above freezing in winter. The Calgary Songfacts reports that Vernon told UK newspaper The Sun naming it Bon Iver shows he’s accepting winter is a big part of the album. .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":167,"year":2011,"ar":"PJ Harvey","ti":"Let England Shake","cv":"https://cdn2.albumoftheyear.org/600x0/album/2087-let-england-shake_082511.jpg","rt":0.0,"sp":"","yt":"IaCsIvDLnBg","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","Nubis84","paqueradejere","sdecandelario"],"da":"Let England Shake is the eighth studio album by PJ Harvey. It was released on 14 February 2011 in the UK, and on 15 February 2011 in the US. Work on it began around the time of White Chalk's release in 2007, though it is a departure from the piano-driven introspective collection of that album. It was written between late 2007 and 2008, and recorded over a five-week period. .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":11,"year":2007,"ar":"Bon Iver","ti":"For Emma, Forever Ago","cv":"https://ia801906.us.archive.org/19/items/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51-11344065108.jpg","rt":0.0,"sp":"","yt":"AaUQ6ToaPqw","gen":["folk rock","folk","contemporary folk","baroque pop","country","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","sdecandelario"],"da":"For Emma, Forever Ago is the debut album from Wisconsin band Bon Iver. It was self-released in 2007 and received wider release on the Jagjaguwar label in February 2008 (and on the 4AD label in the UK in May 2008). The album was widely acclaimed, receiving spots on critics' end-of-the-year lists, as well as several awards. Following the break-up of his previous band DeYarmond Edison, Justin Vernon, suffering from mononucleosis, secluded himself in a cabin in Medford, Wisconsin for three months planning to \"hibernate.\" Three months of solitude resulted in the creation of For Emma, Forever Ago. \"All of his .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":6,"year":2005,"ar":"Sufjan Stevens","ti":"Illinois","cv":"https://dn710206.ca.archive.org/0/items/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1-26865127077.jpg","rt":0.0,"sp":"","yt":"ovIh2WVhbPs","gen":["folk rock","chamber folk","baroque pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","verygooood"],"da":"Illinois (or \"Sufjan Stevens Invites You To: Come On Feel The Illinoise\") is the second album in the so-called 50 States Project, which later turned out to be a stunt. The album focuses on Illinois and includes some things from Sufjan’s past as well. The artwork for the album originally included Superman but was eventually replaced (or, on some albums, flat-out removed). Contrary to popular belief, this is not because DC Comics filed a cease and desist. Rather, Asthmatic Kitty’s lawyers advised against this copyright infringement and a sticker of balloons was placed over it. They had also made other .","dar":"Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass."},{"n":68,"year":2000,"ar":"Elliott Smith","ti":"Figure 8","cv":"https://dn710605.ca.archive.org/0/items/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae-18782213344.png","rt":0.0,"sp":"","yt":"B6sYRE65QIc","gen":["folk rock","chamber pop","indie rock","indie folk","indie pop","rock"],"hb":[],"da":"Figure 8 is the fifth studio album by American singer-songwriter Elliott Smith. Released by DreamWorks Records on April 18, 2000, it became Smith's second release on a major label and the last album he would complete before his death. It was recorded at Sunset Sound in Hollywood, Sonora Studios in Los Angeles, Capitol Studios in Hollywood, and Abbey Road Studios in London (\"Stupidity Tries\", \"In the Lost and Found (Honky Bach)\" and \"Pretty Mary K\"). The album was also released on double vinyl 12\" on Bong Load Custom Records, and later rereleased by Plain Records in 2008. It is also .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":49,"year":1999,"ar":"The Magnetic Fields","ti":"69 Love Songs","cv":"https://dn710705.ca.archive.org/0/items/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d-7440735207.jpg","rt":0.0,"sp":"","yt":"5VO4R98Ti6I","gen":["synth-pop","chamber pop","indie folk","indie pop","twee pop","Alternative Rock"],"hb":[],"da":null,"dar":"The Magnetic Fields is an American indie pop band that formed in Boston, MA in 1988 by Stephin Merritt. Albums released under the name \"The Magnetic Fields\" often consist of synth-pop music in a 1980s style underlying clever lyrics which are usually heavily ironic. While synth-pop often forms the foundation of their music, The Magnetic Fields' music borrows from many other styles, notably country, folk and indie pop.\n\nThe band was originally formed in Cambridge"},{"n":78,"year":1999,"ar":"Bonnie 'Prince' Billy","ti":"I See a Darkness","cv":"https://dn720800.ca.archive.org/0/items/mbid-c9557957-1e60-3aae-ac7d-7177feffe2d2/mbid-c9557957-1e60-3aae-ac7d-7177feffe2d2-8323303553.jpg","rt":0.0,"sp":"","yt":"FC8aItkko2k","gen":["country folk","indie folk","Rock"],"hb":[],"da":null,"dar":"Will Oldham (born 15 January 1970, Louisville, Kentucky) is an American singer-songwriter, actor, and musician. His music is often (perhaps inappropriately) placed under the genre of \"alt-country\". Oldham has recorded under many names, including Palace, Palace Music, Palace Brothers, and Bonnie Billy. He often plays and records with other musicians, including David Pajo and his brothers Ned and Paul Oldham, but is generally the chief creator of the music."},{"n":7,"year":1998,"ar":"Neutral Milk Hotel","ti":"In the Aeroplane Over the Sea","cv":"https://dn710607.ca.archive.org/0/items/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e-8579764982.jpg","rt":0.0,"sp":"","yt":"hy0B4uBZaOs","gen":["folk rock","alternative rock","indie rock","noise pop","indie folk","brass band"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"In the Aeroplane Over the Sea is the second and final studio album by the American indie rock band Neutral Milk Hotel. It was released in the United States on February 10, 1998 on Merge Records and May 1998 on Blue Rose Records in the United Kingdom. Jeff Mangum moved from Athens, Georgia to Denver, Colorado to prepare the bulk of the album's material with producer Robert Schneider, this time at Schneider's newly created Pet Sounds Studio at the home of Jim McIntyre. The album was the sixth-best-selling vinyl album in 2008. NME named it the 98th greatest album of .","dar":"Neutral Milk Hotel was an American alternative rock band formed by singer, guitarist, and songwriter Jeff Mangum in 1989 in Ruston, Louisiana. On the band's full-length albums, Mangum played with a number of other musicians, notably Jeremy Barnes (drums), Scott Spillane (horns), Julian Koster (musical saw/banjo/accordion/bass guitar) and producer-instrumentalist Robert Schneider. Neutral Milk Hotel were one of the original members of the Elephant Six Collective, based in Athens, Georgia."},{"n":4,"year":1997,"ar":"Elliott Smith","ti":"Either/Or","cv":"https://dn710706.ca.archive.org/0/items/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e-18047694847.png","rt":0.0,"sp":"","yt":"UuizNQUOFCI","gen":["folk rock","indie rock","indie folk","indie pop","Rock","Alternative Rock"],"hb":[],"da":"Either/Or is the third studio album by American singer-songwriter Elliott Smith. Either/Or was recorded in several locations, mostly in Portland, Oregon – while Smith was still a member of Heatmiser – and was produced by Smith, Tom Rothrock, and Rob Schnapf. It was released on February 25, 1997, through Kill Rock Stars record label, following Heatmiser's dissolution. Book-ended by its two singles, Speed Trials and Ballad of Big Nothing, \"Either/Or\" did not chart in the US, but was acclaimed by critics. It has been described as \"a bridge between the lo-fi darkness of Roman Candle and Elliott Smith and the .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":191,"year":1993,"ar":"Eric's Trip","ti":"Love Tara","cv":"https://dn721904.ca.archive.org/0/items/mbid-66f07db8-5eaa-4b09-9f0a-492852fa4060/mbid-66f07db8-5eaa-4b09-9f0a-492852fa4060-44556590426.png","rt":0.0,"sp":"","yt":"o4YDfjVin7E","gen":["alternative rock","indie rock","noise pop","indie folk","slacker rock","Alternative Rock"],"hb":[],"da":null,"dar":"Eric's Trip was a Canadian indie rock band hailing from Moncton, New Brunswick. Forming in 1990 when musicians Rick White and Christopher Thompson of The Forest joined  Julie Doiron and Ed Vaughan (who was later replaced by Mark Gaudet of Purple Knight), they took their name from a Sonic Youth song. They emulated the distorted guitar of Dinosaur Jr., the folk leanings of Neil Young, and the lo-fi aesthetic of Sebadoh. Rick White described their sound as \"sappy melodic pop music on top of thick distortion.\""}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
