<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":60,"year":2015,"ar":"Lil Ugly Mane","ti":"Oblivion Access","cv":"https://dn710703.ca.archive.org/0/items/mbid-dd766786-c4b5-4791-acaa-1eb46bb7f84d/mbid-dd766786-c4b5-4791-acaa-1eb46bb7f84d-12298741998.jpg","rt":0.0,"sp":"","yt":"P07qfdUseKg","gen":["alternative hip hop","hip hop","industrial hip hop","Hip-Hop"],"hb":[],"da":null,"dar":"Travis Miller (born May 13, 1984) is an American rapper, singer and record producer from Richmond, Virginia. He has recorded under multiple aliases in various genres since his first known released project in 2005, including Lil Ugly Mane, Shawn Kemp, Vudmurk and Bedwetter.\n\nMiller rose to popularity in the early 2010s with an experimental approach to Southern hip hop. His debut album Mista Thug Isolation gained him notoriety in the underground hip hop scene."},{"n":50,"year":2011,"ar":"Danny Brown","ti":"XXX","cv":"https://dn710702.ca.archive.org/0/items/mbid-560d74eb-0cc2-4a02-81e6-ba0f09b298c1/mbid-560d74eb-0cc2-4a02-81e6-ba0f09b298c1-4410464955.jpg","rt":0.0,"sp":"","yt":"cVx4f9swtTQ","gen":["alternative hip hop","hip hop","experimental hip hop","conscious hip hop","hardcore hip hop"],"hb":["EliasJ72","alberto_gu"],"da":"XXX (pronounced \"triple x\" or \"30\") is the second studio album by American rapper Danny Brown. It was released on August 15, 2011, by Fool's Gold Records. The album's production was handled by Frank Dukes, Brandun DeShay, Skywlkr, Nick Speed, Quelle, Paul White, Squadda Bambino, and DJ House Shoes. The album's only guest appearances come from Brown's Bruiser Brigade cohorts Chips and Dopehead. XXX was released as a free download by Brooklyn, New York-based record label Fool's Gold Records. Brown cited XXX as his attempt at \"experimenting and seeing how far could push listeners\" with his music. Brown explains that .","dar":"Daniel Dewan Sewell (born March 16, 1981), best known by his stage name Danny Brown, is a hip-hop artist from the Dexter-Linwood area of Detroit, Michigan. He has been described by MTV as \"one of rap's most unique figures in recent memory\". Danny is an unconventional hip-hop artist who employs multiple flows and cadences, thus the moniker “The Hybrid”. His style varies from low pitched gravelly tones to a manic, high-pitched squawk. His lyrics often deal with the truth of living in Detroit: poverty, drug abuse, desperate circumstances, etc."},{"n":1,"year":2004,"ar":"Madvillain","ti":"Madvillainy","cv":"https://dn710700.ca.archive.org/0/items/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708-28231687719.jpg","rt":0.0,"sp":"","yt":"zQ0yXh_ADlQ","gen":["alternative hip hop","hip hop","experimental hip hop","instrumental hip hop","jazz rap","abstract hip hop"],"hb":[],"da":"Madvillainy is the legendary collaboration between rapper MF DOOM and producer Madlib under the group name Madvillain. It is considered one of the greatest hip-hop albums ever. It was released on March 23, 2004, on Stones Throw Records. The album was recorded between 2002 and 2004. Madlib created most of the instrumentals during a trip to Brazil in his hotel room using minimal amounts of equipment: a Boss SP-303 sampler, a turntable, and a tape deck. Fourteen months before the album was released, an unfinished demo version was stolen and leaked onto the internet. Frustrated, the duo stopped working on .","dar":"Madvillain was an American hip-hop duo consisting of two MCs and producers, MF DOOM and Madlib. Their debut album Madvillainy was met with wide critical acclaim for its unique approach. Their short songs, obscure lyrics and sparse choruses made for a sound that was generally unfriendly to commercial radio, but was lauded as a key aspect of their identity as an underground act.\n\nIn 2006, Madvillain was featured on Stones Throw Records and Adult Swim's DVD/CD Chrome Children with a new song and live performance."},{"n":15,"year":2002,"ar":"El-P","ti":"Fantastic Damage","cv":"https://dn710306.ca.archive.org/0/items/mbid-0351db35-0a3b-4268-96c4-a5c9549bf571/mbid-0351db35-0a3b-4268-96c4-a5c9549bf571-1674481996.jpg","rt":0.0,"sp":"","yt":"jksPtFY1Yyc","gen":["alternative hip hop","hip hop","Hip-Hop"],"hb":[],"da":"\"Fantastic Damage\" is the first proper full-length solo album by New York rapper and producer El-P, released on his own Definitive Jux label on May 14, 2002. The tracks \"Fantastic Damage\", \"Deep Space 9mm\", and \"The Nang, the Front, the Bush and the Shit\" were featured in the El-P-scored graffiti film \"Bomb the System\". An instrumental version of the album, \"Fandam Plus: Instrumentals, Remixes, Lyrics & Video\", was released on 1 October 2002. This double disc release included all the instrumentals of \"Fantastic Damage\" on its first disc and three remixes, the \"Fantastic Damage\" lyrics, and video footage on its .","dar":"El-P is an abbreviation of El-Producto, both pseudonyms of New York City, NY, USA, underground hip-hop producer / rapper Jaime Meline (b. 2 Mar 1975).\n\nAs a member of Company Flow, he honed his production skills alongside DJ Mr. Len and Bigg Jus. His unique style helped Company Flow gain critical, then popular success, culminating in 1997 with Funcrusher Plus. Eventual differences between the group & label Rawkus, lead to El-P & Len leaving the label in 2000."},{"n":23,"year":2000,"ar":"Quasimoto","ti":"The Unseen","cv":"https://dn710008.ca.archive.org/0/items/mbid-e696c5a3-5efa-40b3-9886-25fef200951b/mbid-e696c5a3-5efa-40b3-9886-25fef200951b-38927398439.jpg","rt":0.0,"sp":"","yt":"nWqNXuQCaWo","gen":["alternative hip hop","hip hop","jazz rap","Jazz"],"hb":[],"da":"The Unseen is the debut studio album by Quasimoto, a hip-hop duo composed of Madlib and his animated alter ego Lord Quas. It was released under Stones Throw Records on June 13, 2000. It was re-released in 2005 as a deluxe edition with a bonus CD containing the instrumental version of the album. Madlib took mushrooms for a month while creating the album. It was co-mixed by Kut Masta Kurt and Peanut Butter Wolf. The cover was designed by Jeff Jank. The song \"Low Class Conspiracy\" was on the soundtrack for the video game Tony Hawk's Underground. Nathan Rabin of .","dar":"Quasimoto is an alter ego of Madlib. Quasimoto first came to life on Madlib's personal beat tapes in the producer's early years in Oxnard CA, circa mid/late 1990s, in recordings that were meant for his own personal listening. \n\nAfter Madlib began working with Stones Throw Records, he was convinced to release Quasimoto, first as a featured MC on Peanut Butter Wolf's \"Styles Crews Flows Beats\" 1998. Finally, Madlib put out Quasimoto's debut solo album - The Unseen - in 2000."},{"n":60,"year":2000,"ar":"OutKast","ti":"Stankonia","cv":"https://dn711301.ca.archive.org/0/items/mbid-296f8a54-eff7-3c6a-9857-164c05479c09/mbid-296f8a54-eff7-3c6a-9857-164c05479c09-24569780625.jpg","rt":0.0,"sp":"","yt":"w-5HHVuQmvg","gen":["drum and bass","techno","alternative hip hop","hip hop","dirty south","southern hip hop"],"hb":[],"da":"Stankonia is the fourth studio album by American hip hop duo OutKast, released October 31, 2000 on La Face Records. The album debuted at number 2 on the U.S. Billboard 200 chart, selling over 530,000 copies the first week. Stankonia received universal acclaim from most music critics, based on an aggregate score of 95/100 from Metacritic. It received rave reviews from publications such as USA Today and the Los Angeles Times. It was also voted as the best album of the year in The Village Voice Pazz & Jop critics' poll. In 2003, the album was ranked number 359 on .","dar":"OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette."},{"n":98,"year":2000,"ar":"Common","ti":"Like Water for Chocolate","cv":"https://dn711307.ca.archive.org/0/items/mbid-0eaf3a43-f00e-4416-8ea3-759d1841e3c9/mbid-0eaf3a43-f00e-4416-8ea3-759d1841e3c9-4402657853.jpg","rt":0.0,"sp":"","yt":"ss5daRk7cMY","gen":["alternative hip hop","hip hop","neo soul","jazz rap","conscious hip hop","political hip hop"],"hb":[],"da":"Like Water for Chocolate is the fourth studio album by American hip hop rapper Common, released March 28, 2000 on MCA Records. It was a considerable critical and commercial breakthrough for Common, receiving generally favorable reviews from major magazine publications and selling 70,000 copies in its first week. The album was certified Gold on August 11, 2000 by the Recording Industry Association of America. According to Nielsen SoundScan, the album has sold 748,000 copies by March 2005. The video for \"The Light\" was frequently shown on MTV, adding to Common's exposure. The album also formally marked the formation of the .","dar":"Lonnie Rashid Lynn, Jr. (born March 13, 1972 in Chicago, Illinois), better known by his stage name Common (previously Common Sense), is a Grammy award winning rapper, author and actor known for lyrics that focus on love and spirituality. Many people describe him as being a conscious hip hop artist who makes songs that send a message. He debuted in 1992 with the album Can I Borrow a Dollar? and maintained a significant underground following into the late 90s"},{"n":15,"year":1999,"ar":"The Roots","ti":"Things Fall Apart","cv":"https://ia600605.us.archive.org/25/items/mbid-45b0cfa6-826c-4736-9c74-f0b73ec14bc7/mbid-45b0cfa6-826c-4736-9c74-f0b73ec14bc7-28128122695.jpg","rt":0.0,"sp":"","yt":"F0Pa27i42i0","gen":["alternative hip hop","hip hop","neo soul","jazz rap","Jazz","Hip-Hop"],"hb":["Frikomid","verygooood"],"da":"Things Fall Apart is the fourth studio album by American hip hop band the Roots, released on February 23, 1999, by MCA Records. Recording sessions for the album took place at Electric Lady during 1997 to 1998, coinciding with recording for other projects of the Soulquarians collective. According to Spin magazine, the album became a landmark moment for the Roots and the collective, as it \"swelled the Roots clique into a movement-style posse\". The album has been considered by music writers as the Roots' breakthrough album, earning praise from major publications and critics, while becoming the group's first record to .","dar":"The Roots, also known as The Legendary Roots Crew, The Square Roots and The Foundation, is an influential, Grammy winning hip hop group based out of Philadelphia, Pennsylvania, famed for a heavily jazzy sound and live instrumentation. Inspired by the \"hip-hop band\" concept pioneered by Stetsasonic, the Roots themselves have garnered critical acclaim and influenced later hip-hop and R&B acts.\n\nThe Roots' original lineup included Black Thought (MC vocals) and Ahmir \"?uestlove\" Thompson (drums)"},{"n":3,"year":1998,"ar":"OutKast","ti":"Aquemini","cv":"https://dn710806.ca.archive.org/0/items/mbid-63f4592c-6f58-32bb-bd9f-a431dc14e04d/mbid-63f4592c-6f58-32bb-bd9f-a431dc14e04d-6640977411.jpg","rt":0.0,"sp":"","yt":"vnnTW6WL7pw","gen":["alternative hip hop","hip hop","dirty south","Hip-Hop"],"hb":["EliasJ72","Nubis84","Rocky_stereo","alberto_gu","sdecandelario"],"da":"A vaguely futuristic, synthesizer-drenched album punctuated with anthemic choruses and bluesy beats, Aquemini addresses numerous topics such as emancipation, drug addiction and problematic relationships, while exploring the bleakest aspects of humanity. In contrast to much of hip hop music in the late 1990s, OutKast did not tone down the regional qualities, like the harmonica break on \"Rosa Parks\" and distinctive Atlanta slang and diction throughout. \"Rosa Parks\" was later nominated for the 1999 Grammy Award for Best Rap Performance by a Duo or Group. The song led to much controversy with Rosa Parks filing a defamation suit against OutKast. Aquemini .","dar":"OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette."},{"n":24,"year":1998,"ar":"Lauryn Hill","ti":"The Miseducation of Lauryn Hill","cv":"https://dn710605.ca.archive.org/0/items/mbid-c6e5d8ca-89e3-303c-b649-85f577e0cbc6/mbid-c6e5d8ca-89e3-303c-b649-85f577e0cbc6-3376969940.jpg","rt":0.0,"sp":"","yt":"c5v6s0vUbXY","gen":["soul","r&b","contemporary r&b","alternative hip hop","hip hop","neo soul"],"hb":[],"da":"\"The Miseducation of Lauryn Hill\" is the debut solo studio album by American rapper and singer-songwriter Lauryn Hill, released on August 25, 1998, by Ruffhouse Records and Columbia Records. Recorded after the Fugees went on hiatus, the album was written and produced primarily by Hill. It is a concept album centred on themes of self-education through love, exploring topics such as romantic relationships, personal growth, motherhood, and faith. Musically, it blends elements of neo soul and R&B with influences from hip-hop, reggae, and soul, and features guest appearances from Carlos Santana, Mary J. Blige, and D'Angelo. Following her time with .","dar":"Lauryn Noel Hill (born May 26, 1975 in East Orange, New Jersey) is an American musical artist, and record producer, initially establishing her reputation as the most visible and vocal member of the Fugees, then continued on to a solo career releasing The Miseducation of Lauryn Hill. Hill's works primarily in the neo-soul and alternative rap styles, among other influences from reggae and folk. After a four year hiatus, she released the controversial MTV Unplugged No."},{"n":10,"year":1996,"ar":"OutKast","ti":"ATLiens","cv":"https://cdn2.albumoftheyear.org/600x0/album/atliens-1.jpg","rt":0.0,"sp":"","yt":"CplOmO_lGco","gen":["alternative hip hop","hip hop","conscious hip hop","dirty south","abstract hip hop","southern hip hop"],"hb":["EliasJ72","Rocky_stereo","alberto_gu","sdecandelario"],"da":"ATLiens is the second studio album by American hip-hop duo OutKast, released on August 27, 1996, by LaFace Records. The duo sought to improve on their 1994 debut album Southernplayalisticadillacmuzik and gain respect for their burgeoning Southern hip-hop scene. ATLiens has been listed by several magazines and critics as one of the greatest hip-hop albums of all time. OutKast recorded ATLiens in sessions at several Atlanta studios—Bosstown Recording Studios, Doppler Recording Studios, PatchWerk Recording Studio, Purple Dragon Studios, and Studio LaCoCo—as well as Chung King Recording Studio and Sound On Sound Recording in New York City. The record features outer .","dar":"OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette."},{"n":178,"year":1994,"ar":"Soul Coughing","ti":"Ruby Vroom","cv":"https://dn710309.ca.archive.org/0/items/mbid-abc49b59-0c11-4651-9262-7316bda4c158/mbid-abc49b59-0c11-4651-9262-7316bda4c158-9825046782.jpg","rt":0.0,"sp":"","yt":"cyVUsknYmJ4","gen":["alternative rock","blues","jazz","alternative hip hop","beat poetry","jazz poetry"],"hb":[],"da":null,"dar":"Soul Coughing were a New York-based alternative rock band. The band found modest mainstream success during the mid-to-late 90's. Soul Coughing developed a devout fanbase and have garnered largely positive response from critics. Steve Huey describes the band as \"one of the most unique cult bands of the '90s ... driven by frontman  M. Doughty's stream-of-consciousness poetry, Soul Coughing's sound was a willfully idiosyncratic mix of improvisational jazz grooves"},{"n":4,"year":1993,"ar":"A Tribe Called Quest","ti":"Midnight Marauders","cv":"https://dn710707.ca.archive.org/0/items/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c-9900302771.jpg","rt":0.0,"sp":"","yt":"CVKrrs5K9v0","gen":["alternative hip hop","hip hop","jazz rap","east coast hip hop","conscious hip hop","boom bap"],"hb":["Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Midnight Marauders is the third studio album by American hip hop group A Tribe Called Quest, released on November 9, 1993, by Jive Records. It had major commercial success and is regarded as one of the greatest albums in hip hop, as well as one of the the group's best. Recording sessions for the album occurred at Battery Studios, Platinum Island Studios and Scorcerer Sound in New York City. Its production was mainly handled by Q-Tip, with contributions from Skeff Anselm, Large Professor and the group's DJ, Ali Shaheed Muhammad. .","dar":"A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998"},{"n":25,"year":1992,"ar":"The Pharcyde","ti":"Bizarre Ride II the Pharcyde","cv":"https://dn710202.ca.archive.org/0/items/mbid-1c6f2a35-4288-4f5d-9eec-97ca32e2a226/mbid-1c6f2a35-4288-4f5d-9eec-97ca32e2a226-32304157771.jpg","rt":0.0,"sp":"","yt":"hAaQDxpv5X8","gen":["alternative hip hop","hip hop","boom bap","west coast hip hop","Jazz","Hip-Hop"],"hb":[],"da":"Bizarre Ride II the Pharcyde is the debut album by alternative hip-hop group The Pharcyde, released on November 24, 1992 through Delicious Vinyl Records. The album is produced by former group member J-Swift, and features only one guest appearance, provided by little-known Los Angeles rapper Bucwheed (known then as \"Buckwheat\" from The Wascals). In the years after its release, Bizarre Ride was hailed by critics and alternative rap fans and appeared in \"best albums\" lists in several publications. Released during the dominant Gangsta rap era of West Coast hip-hop, Bizarre Ride was described as \"refreshing,\" due to its playful, light-hearted .","dar":"The Pharcyde (pronounced \"Far Side\") is an American alternative hip-hop group, formed in 1989, from South Central Los Angeles. The original four members of the group are Imani (Emandu Wilcox), Slimkid3 (Trevant Hardson), Bootie Brown (Romye Robinson), and Fatlip (Derrick Stewart). DJ Mark Luv was the group's first disc jockey (DJ), followed by producer J-Swift and then J Dilla.\n\nThe group is perhaps best known for the hit singles \"Drop\", \"Passin' Me By\" and \"Runnin''\", as well as their first album, Bizarre Ride II the Pharcyde."},{"n":28,"year":1991,"ar":"Cypress Hill","ti":"Cypress Hill","cv":"https://dn710602.ca.archive.org/0/items/mbid-5cf63bca-a3b2-3694-ad13-900809e41367/mbid-5cf63bca-a3b2-3694-ad13-900809e41367-8769285126.jpg","rt":0.0,"sp":"","yt":"iu6Wkf-y1t4","gen":["alternative hip hop","hip hop","boom bap","west coast hip hop","gangsta rap","hardcore hip hop"],"hb":[],"da":"Cypress Hill is the self titled debut album of Cypress Hill, released in August 1991. It was both critically and commercially hailed eventually allowing it to be certified double Platinum by the RIAA. It was known for its funk/rock-sampled beats as well as marijuana advocation lyrics. Steve Huey of Allmusic calls Cypress Hill's debut \"a sonic blueprint that would become one of the most widely copied in hip-hop.\" Rolling Stone calls it \"an album that is innovative and engaging in spite of its hard-core messages.\" In 1998, the album was selected as one of The Source Magazine's 100 Best Rap .","dar":"Cypress Hill is an American hip-hop group from South Gate, California. Cypress Hill was the first latino group to have platinum and multi-platinum albums and one of the first rap groups to gain a following with fans of hard rock and metal. The band was originally called DVX, but the name was changed after Mellow Man Ace left in 1988.\n\nTheir first album, which was self-titled, was released in August 1991. Its single was \"Phuncky Feel One\", but it was"},{"n":40,"year":1991,"ar":"De La Soul","ti":"De La Soul Is Dead","cv":"https://dn710309.ca.archive.org/0/items/mbid-a7f61a4b-f205-46d0-8aac-0e1ae6d64dd6/mbid-a7f61a4b-f205-46d0-8aac-0e1ae6d64dd6-2587513089.jpg","rt":0.0,"sp":"","yt":"fL_uR33mcX0","gen":["alternative hip hop","hip hop","jazz rap","conscious hip hop","boom bap","abstract hip hop"],"hb":[],"da":"De La Soul Is Dead is the second studio album by American hip-hop group De La Soul, released on May 14, 1991. It was produced by Prince Paul .","dar":"De La Soul is an American hip-hop group formed in 1988 in the Amityville area of Long Island, New York. They are best known for their eclectic sampling, quirky lyrics, and their contributions to the evolution of the jazz rap and alternative hip-hop subgenres. The members are Posdnuos, Maseo, and Trugoy (until his death in 2023). The three formed the group in high school and caught the attention of producer Prince Paul with a demo tape of the song \"Plug Tunin'\"."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
