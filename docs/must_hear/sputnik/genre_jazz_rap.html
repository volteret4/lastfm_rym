.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}

ck Lamar Duckworth (born June 17, 1987) is an American rapper. Regarded as one of the most influential hip-hop artists of his generation, he was awarded the 2018 Pulitzer Prize for Music, becoming the first musician outside of the classical and jazz genres to receive the honor.\n\nBorn in Compton, California, Lamar began releasing music under the stage name K.Dot while attending high school. He signed with Top Dawg Entertainment (TDE) in 2005, and co-founded the hip hop supergroup Black Hippy there."},{"n":1,"year":2004,"ar":"Madvillain","ti":"Madvillainy","cv":"https://dn710700.ca.archive.org/0/items/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708-28231687719.jpg","rt":0.0,"sp":"","yt":"zQ0yXh_ADlQ","gen":["alternative hip hop","hip hop","experimental hip hop","instrumental hip hop","jazz rap","abstract hip hop"],"hb":[],"da":"Madvillainy is the legendary collaboration between rapper MF DOOM and producer Madlib under the group name Madvillain. It is considered one of the greatest hip-hop albums ever. It was released on March 23, 2004, on Stones Throw Records. The album was recorded between 2002 and 2004. Madlib created most of the instrumentals during a trip to Brazil in his hotel room using minimal amounts of equipment: a Boss SP-303 sampler, a turntable, and a tape deck. Fourteen months before the album was released, an unfinished demo version was stolen and leaked onto the internet. Frustrated, the duo stopped working on .","dar":"Madvillain was an American hip-hop duo consisting of two MCs and producers, MF DOOM and Madlib. Their debut album Madvillainy was met with wide critical acclaim for its unique approach. Their short songs, obscure lyrics and sparse choruses made for a sound that was generally unfriendly to commercial radio, but was lauded as a key aspect of their identity as an underground act.\n\nIn 2006, Madvillain was featured on Stones Throw Records and Adult Swim's DVD/CD Chrome Children with a new song and live he inner city and Black nationalism. It also features guest appearances from Guru of Gang Starr, Jeru the .","dar":"Digable Planets was a jazz hip-hop group from Brooklyn, New York, United States which formed in 1992. The group consists of rappers Ishmael \"Butterfly\" Butler, Ann \"Ladybug\" Vieira and Craig \"Doodlebug\" Irving, along with DJ King Britt. They are best known for their 1993 single \"Rebirth of Slick (Cool Like Dat)\", which was a success on hip-hop, pop and alternative rock radio in the United States. The group broke up in 1995 and reunited in 2005.\n\nThe group first took shape in the early ‘90s, in New York City."},{"n":4,"year":1993,"ar":"A Tribe Called Quest","ti":"Midnight Marauders","cv":"https://dn710707.ca.archive.org/0/items/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c-9900302771.jpg","rt":0.0,"sp":"","yt":"CVKrrs5K9v0","gen":["alternative hip hop","hip hop","jazz rap","east coast hip hop","conscious hip hop","boom bap"],"hb":["Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Midnight Marauders is the third studio album by American hip hop group A Tribe Called Quest, released on November 9, 1993, by Jive Records. It had major commercial success and is regarded as one of the greatest albums in hip hop, as well as one of the the group's best. Recording sessions for the album occurred at Battery Studios, Platinum Island Studios and Scorcerer Sound in New York City. Its production was mainly handled by Q-Tip, with contributions from Skeff Anselm, Large Professor and the group's DJ, Ali Shaheed Muhammad. .","dar":"A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998"},{"n":5,"year":1991,"ar":"A Tribe Called Quest","ti":"The Low End Theory","cv":"https://dn710805.ca.archive.org/0/items/mbid-69959f4a-29fd-4867-83ec-bfb4036b30d1/mbid-69959f4a-29fd-4867-83ec-bfb4036b30d1-1672879787.jpg","rt":0.0,"sp":"","yt":"WyPwEm_lrHY","gen":["hip hop","jazz rap","east coast hip hop","conscious hip hop","boom bap","Jazz"],"hb":[],"da":"The Low End Theory is the classic second album by American hip-hop group A Tribe Called Quest. Released on September 24, 1991 through Jive Records, the album produced three singles; \"Check the Rhime\", \"Jazz (We've Got)\", and \"Scenario\", and stands as one of hip-hop’s greatest and most influential albums of all time. After A Tribe Called Quest's debut album People's Instinctive Travels and the Paths of Rhythm, Jarobi White left the group to study culinary art. Phife Dawg learned that he was diabetic a month after the album's release and after a discussion with fellow member Q-Tip, they agreed to .","dar":"A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998"},{"n":40,"year":1991,"ar":"De La Soul","ti":"De La Soul Is Dead","cv":"https://dn710309.ca.archive.org/0/items/mbid-a7f61a4b-f205-46d0-8aac-0e1ae6d64dd6/mbid-a7f61a4b-f205-46d0-8aac-0e1ae6d64dd6-2587513089.jpg","rt":0.0,"sp":"","yt":"fL_uR33mcX0","gen":["alternative hip hop","hip hop","jazz rap","conscious hip hop","boom bap","abstract hip hop"],"hb":[],"da":"De La Soul Is Dead is the second studio album by American hip-hop group De La Soul, released on May 14, 1991. It was produced by Prince Paul .","dar":"De La Soul is an American hip-hop group formed in 1988 in the Amityville area of Long Island, New York. They are best known for their eclectic sampling, quirky lyrics, and their contributions to the evolution of the jazz rap and alternative hip-hop subgenres. The members are Posdnuos, Maseo, and Trugoy (until his death in 2023). The three formed the group in high school and caught the attention of producer Prince Paul with a demo tape of the song \"Plug Tunin'\"."},{"n":74,"year":1990,"ar":"Gang Starr","ti":"Step in the Arena","cv":"https://dn710206.ca.archive.org/0/items/mbid-0e272d73-ed9d-48b0-809c-8c562be52bd7/mbid-0e272d73-ed9d-48b0-809c-8c562be52bd7-41681726940.jpg","rt":0.0,"sp":"","yt":"3lw8FPmBxBk","gen":["hip hop","jazz rap","east coast hip hop","boom bap","Jazz","Hip-Hop"],"hb":["Nubis84","verygooood"],"da":null,"dar":"Gang Starr was an influential American hip-hop duo, composed of late rapper Guru (Backronym for Gifted Unlimited Rhymes Universal, real name Keith Elam) and DJ Premier (real name Chris Martin). Premier originally from Houston and Guru from Boston, but they were based in and represented Brooklyn, New York, epitomizing the New York City hip-hop sound. The entirety of Gang Starr's catalog, especially Step In The Arena (1991) ,Daily Operation (1992), and Hard To Earn (1994) are well-respected among critics and hip-hop heads alike."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
