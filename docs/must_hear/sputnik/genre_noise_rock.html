<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

th frontman Kurt Cobain's reflections on his newfound fame and recent personal .","dar":"There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s."},{"n":42,"year":1994,"ar":"Drive Like Jehu","ti":"Yank Crime","cv":"https://ia800502.us.archive.org/33/items/mbid-883a8c08-4f08-4acc-b2a4-9f2d549ac696/mbid-883a8c08-4f08-4acc-b2a4-9f2d549ac696-23545562962.png","rt":0.0,"sp":"","yt":"02MAcqIvX7w","gen":["noise rock","post-hardcore","math rock","emo","Rock","Punk"],"hb":[],"da":null,"dar":"Drive Like Jehu was an American post-hardcore band from San Diego, California founded in 1990 by Rick Froberg (guitar, vocals), John Reis (guitar), Mike Kennedy (bass), and Mark Trombino (drums). \n\nFroberg and Reis had originally played in Pitchfork, but despite musical similarities, there were some significant changes in the lineup of Drive Like Jehu. Froberg, no longer just a vocalist, picked up a guitar, while Kennedy and Trombino formed the rhythm section of the new band after having played together in Night Soil Man"},{"n":68,"year":1994,"ar":"Cherubs","ti":"Heroin Man","cv":"https://ia600604.us.archive.org/34/items/mbid-0b14fdcd-6bf2-414f-8182-fe0abfbd579b/mbid-0b14fdcd-6bf2-414f-8182-fe0abfbd579b-19300498945.jpg","rt":0.0,"sp":"","yt":"yTpb0E4PMBU","gen":["noise rock","Rock","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"CHERUBS is a noise rock band from Austin, TX. Formed in 1991 by Ed Hall expatriate drummer Kevin Whitley, Owen McMahon (bass), and Brent Prager (drums), the Cherubs emerged on the Austin, TX, LSD punk scene with a based in Olympia throughout the 1990s"},{"n":42,"year":1992,"ar":"Pavement","ti":"Slanted and Enchanted","cv":"https://dn720700.ca.archive.org/0/items/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf-36814960831.jpg","rt":0.0,"sp":"","yt":"skGqpC0WYSk","gen":["alternative rock","noise rock","indie rock","noise pop","Alternative Rock"],"hb":[],"da":"Slanted and Enchanted is the debut studio album by American indie rock band Pavement, released on April 20, 1992 by Matador Records. It is the only Pavement album to feature drummer Gary Young. The album received critical acclaim and is seen as a landmark for indie rock, with Rolling Stone ranking it 199th on its 2020 edition of The 500 Greatest Albums of All Time. As of 2007, the album had sold 150,000 copies. Slanted and Enchanted was distributed to critics as early as 1991, months before its official release; the original distribution did not feature the entire band, as .","dar":"Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s."},{"n":164,"year":1992,"ar":"Cows","ti":"Cunning Stunts","cv":"https://dn721605.ca.archive.org/0/items/mbid-96ee5e4f-0fc0-423b-b84e-9b57b15b8350/mbid-96ee5e4f-0fc0-423b-b84e-9b57b15b8350-28836082821.jpg","rt":0.0,"sp":"","yt":"m0KQnu22sFc","gen":["noise rock","hardcore punk","post-hardcore","pigfuck","Rock","Punk"],"hb":[],"da":null,"dar":"Cows was an American noise rock band from Minneapolis, Minnesota, formed in 1987 and disbanded in 1998, notorious for their raucous live performances.\n\nThe original line-up consisted of lead singer Shannon Selberg, who later took up the bugle, guitarist Thor Eisentrager, bass guitarist Kevin Rutmanis, and drummer Sandris Rutmanis (soon to be replaced by Norm Rogers). The band had a hardcore sound characterized by blurred guitars, however the Cows took the formula a step further, creating a unique and unconventional style."},{"n":2,"year":1991,"ar":"My Bloody Valentine","ti":"Loveless","cv":"https://dn710703.ca.archive.org/0/items/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06-25797196285.jpg","rt":0.0,"sp":"","yt":"4nzZeUUiG2c","gen":["alternative rock","noise rock","psychedelic","noise pop","shoegaze","dream pop"],"hb":["verygooood"],"da":"loveless is the second studio album by Irish shoegaze band my bloody valentine, released on 4 November 1991 by Creation Records. The album was recorded over a two-year period between 1989 and 1991. Vocalist and guitarist Kevin Shields dominated the arduous recording process; intent on achieving a particular sound, he experimented with guitar tremolo techniques and tuning systems, unorthodox production methods, obscured vocals, and sampled percussion and feedback. The group cycled through nineteen studios and a larger number of engineers during the album's two-year creation, with total recording costs rumoured to have reached £250,000. While loveless did not achieve great .","dar":"my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s."},{"n":129,"year":1991,"ar":"Unsane","ti":"Unsane","cv":"https://dn711107.ca.archive.org/0/items/mbid-df5745b3-5d86-3933-8c62-81c2ae60c836/mbid-df5745b3-5d86-3933-8c62-81c2ae60c836-13458263996.jpg","rt":0.0,"sp":"","yt":"61Xm7hAR-fM","gen":["noise rock","post-hardcore","pigfuck","Metal","Rock","Punk"],"hb":[],"da":null,"dar":"Unsane is a noise rock music trio from New York City. They are generally classified as noise rock, but their music also touches on elements of hardcore punk and metal. The band's self-titled début was released in 1991 and was known for its harsh music and gruesome cover art: a photo of a decapitated man on a New York city subway track, his body still wearing a Members Only jacket.\n\nFinding limited mainstream success, Unsane are nonetheless hugely"},{"n":178,"year":1991,"ar":"Oxbow","ti":"King of the Jews","cv":"https://dn711005.ca.archive.org/0/items/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023-4100308832.jpg","rt":0.0,"sp":"","yt":"EUfvCYLscro","gen":["avant-garde","art rock","noise rock","jazz","rock","Rock"],"hb":[],"da":null,"dar":"Oxbow is a long-lived avant-garde band formed in 1988 in San Francisco, California that is notable for their prolific touring and unique sound. Oxbow plays a blend of noise rock, avant-garde jazz, musique concrète (AMG), and blues, creating soundscapes caustic, or plangent, with overtones of paranoia, revulsion, exaltation.\n\nThe first album in 1989 combining the squall of bands like The Birthday Party with elements of free jazz and musique concrète from Oxbow"},{"n":91,"year":1990,"ar":"Bitch Magnet","ti":"Ben Hur","cv":"https://dn710602.ca.archive.org/0/items/mbid-4dec6106-c522-4697-948a-a007c8f3bda1/mbid-4dec6106-c522-4697-948a-a007c8f3bda1-7455291400.jpg","rt":0.0,"sp":"","yt":"NEcn_u0FuV4","gen":["noise rock","indie rock","post-hardcore","math rock","Rock","Punk"],"hb":[],"da":"Ben Hur is the third full-length and final album released by the American post-hardcore band Bitch Magnet. It was recorded after the departure of Bitch Magnet’s added guitarist, David Gait, and features an appearance by the band’s occasional guitarist, David Grubbs. Ben Hur was recorded by Louisville, Kentucky producer Howie Gano who had engineered albums by Grubbs’ previous band, Squirrel Bait. .","dar":"Bitch Magnet was a Post-Hardcore band that formed at Oberlin College in Ohio in 1986; later moving to North Carolina.\n\nThey released their first album, Umber, in 1989; a Post-Hardcore album that would later be considered one of the genre's early exemplars. In 1990, the band released their second and final album, Ben Hur, which would push the boundaries of the genre by blending it with Noise Rock.\n\nThe band's vocalist, Sooyoung Park, and Lexi Mitchell agreed with Superchunk member Mac McCaughan to form the band Seam."},{"n":116,"year":1990,"ar":"Cows","ti":"Effete And Impudent Snobs","cv":"https://dn710700.ca.archive.org/0/items/mbid-cd2ce77a-5702-4b56-8c0f-6b7dbd50844a/mbid-cd2ce77a-5702-4b56-8c0f-6b7dbd50844a-41161662011.jpg","rt":0.0,"sp":"","yt":"MF_ZZJ3EAWU","gen":["noise rock","punk","post-hardcore","Rock","Punk"],"hb":[],"da":"Effete and Impudent Snobs is the third album by the Minneapolis-based noise rock band Cows. It was released on March 23, 1990, by Amphetamine Reptile Records. .","dar":"Cows was an American noise rock band from Minneapolis, Minnesota, formed in 1987 and disbanded in 1998, notorious for their raucous live performances.\n\nThe original line-up consisted of lead singer Shannon Selberg, who later took up the bugle, guitarist Thor Eisentrager, bass guitarist Kevin Rutmanis, and drummer Sandris Rutmanis (soon to be replaced by Norm Rogers). The band had a hardcore sound characterized by blurred guitars, however the Cows took the formula a step further, creating a unique and unconventional style."},{"n":133,"year":1990,"ar":"Sonic Youth","ti":"Goo","cv":"https://ia800309.us.archive.org/13/items/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060-13523354678.jpg","rt":0.0,"sp":"","yt":"k_1rqDKM_0E","gen":["experimental rock","alternative rock","noise rock","no wave","new wave","indie rock"],"hb":[],"da":"Goo is the sixth full-length studio album by American alternative rock band Sonic Youth, released on June 26, 1990 by DGC Records. For this album, the band sought to expand upon its trademark alternating guitar arrangements and the layered sound of their previous album Daydream Nation (1988) with songwriting on that was more topical than past works, exploring themes of female empowerment and pop culture. Coming off the success of Daydream Nation, Nick Sansano returned to engineer Goo, but veteran producer Ron Saint Germain was chosen by Sonic Youth to finish mixing the album following Sansano's dismissal. Goo was a .","dar":"Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups"},{"n":156,"year":1990,"ar":"Cop Shoot Cop","ti":"Consumer Revolt","cv":"https://dn711204.ca.archive.org/0/items/mbid-efff648d-2083-42df-b081-8d610d6d7e9e/mbid-efff648d-2083-42df-b081-8d610d6d7e9e-22855152309.png","rt":0.0,"sp":"","yt":"O03w6HDAod0","gen":["alternative rock","noise rock","punk","indie rock","industrial rock","Rock"],"hb":["Nubis84"],"da":null,"dar":"Cop Shoot Cop was a rock music group founded in New York, NY in 1987 and disbanded in 1996.\n\nThey were frequently classified as industrial rock, but were often quite different from many bands so dubbed. Tod A.'s lyrics were clever, snide and evocative (Art Black and David Sprague suggest that \"Black humor beats black metal any day\") and their \"weirdly catchy\" music which drew \"on hot jazz and swing as much as clanging rock, emphasizing the group's stand-apart attitude.\""}];

let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}
