<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":178,"year":2017,"ar":"Lorde","ti":"Melodrama","cv":"https://dn711306.ca.archive.org/0/items/mbid-0024c5d8-8b54-459f-ab43-afeab54030a8/mbid-0024c5d8-8b54-459f-ab43-afeab54030a8-17054895075.png","rt":0.0,"sp":"","yt":"gp3T60xhvBw","gen":["art pop","synth-pop","electropop","indie pop","pop","Pop"],"hb":["Frikomid","GabredMared","alberto_gu","verygooood"],"da":"Melodrama is the second studio album by New Zealand singer Lorde, released on June 16, 2017, through Lava and Republic Records and distributed through Universal. Following the breakthrough success of her debut album Pure Heroine, Lorde retreated from the spotlight, and travelled between New Zealand and the United States to examine the world around her. Initially inspired by her disillusionment with fame, she wrote Melodrama to capture heartbreak and solitude after her first breakup. \"Melodrama\" has been described by critics as a loose concept album that explores the theme of solitude, in the framework of a single house party with the events and moods that entail it. Lorde wrote .","dar":"Ella Marija Lani Yelich-O'Connor, known professionally as Lorde (born 7 November 1996 in Takapuna, Auckland, New Zealand), is a New Zealand singer-songwriter. Taking inspiration from aristocracy for her stage name, she is known for her unconventional musical styles and introspective songwriting.\n\nLorde expressed interest in performing at local venues in her early teens. She signed with Universal Music Group (UMG) in 2009 and collaborated with producer Joel Little in 2011 to start recording music."},{"n":191,"year":2012,"ar":"Beach House","ti":"Bloom","cv":"https://dn721808.ca.archive.org/0/items/mbid-37cfdc1a-2a7a-4e5c-b8e3-83e2b0e8093b/mbid-37cfdc1a-2a7a-4e5c-b8e3-83e2b0e8093b-40091714027.jpg","rt":0.0,"sp":"","yt":"-3frA_rj918","gen":["indie rock","shoegaze","dream pop","indie pop","Pop","Alternative Rock"],"hb":[],"da":"Bloom is the fourth studio album Beach House. It was released on May 15, 2012, through Sub Pop Records. The entire album was arranged and performed by the duo, with Daniel Franz handling live drums and percussion, and lead vocalist Victoria Legrand handling the songwriting on all of the tracks. Alongside the duo, the album was produced by Chris Coady, who works with them for the second time, following his contributions on their third studio album, Teen Dream (2010), which had been considered as their breakthrough album. The album was written in a period of two years of touring and .","dar":"Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":105,"year":2011,"ar":"Destroyer","ti":"Kaputt","cv":"https://cdn2.albumoftheyear.org/600x0/album/2009-kaputt_053314.jpg","rt":0.0,"sp":"","yt":"qe4sbwI41-E","gen":["art rock","indie rock","indie pop","sophisti-pop"],"hb":[],"da":"Kaputt is the ninth album by Canadian indie rock band Destroyer. It was released on January 25, 2011 by Merge Records and Dead Oceans Records. The album was leaked towards the end of 2010. The vinyl edition of the album features bonus material on side three written largely by frequent Destroyer collaborator Ted Bois. This material is also included in the European CD version of the album credited as 'The Laziest River'. The album was named as a shortlisted (one of 10) nominee for the 2011 Polaris Music Prize award. Kaputt received widespread acclaim from music critics upon its release. .","dar":"Destroyer is a Canadian indie rock band from Vancouver, British Columbia fronted by singer-songwriter Dan Bejar and formed in 1995. Destroyer songs are characterized by abstract, poetic lyrics and idiosyncratic vocals. The band's discography draws on a variety of musical influences, resulting in albums that can sound markedly distinct from one another; in Bejar's words, \"That's kind of my goal: to start from scratch every time.\"\n\n1996–2001\nWe'll Build Them a Golden Bridge, Destroyer's 1996 debut, is made up of sixteen lo-fi home-recordings."},{"n":124,"year":2011,"ar":"St. Vincent","ti":"Strange Mercy","cv":"https://cdn2.albumoftheyear.org/600x0/album/2567-strange-mercy_184357.jpg","rt":0.0,"sp":"","yt":"5jv4lgFrL7U","gen":["art rock","baroque pop","indie rock","indie pop"],"hb":["Frikomid","paqueradejere"],"da":"Strange Mercy is the third studio album by musician St. Vincent. The album's cover art was designed by St. Vincent and was photographed by Tina Tyrell. The album peaked at #19 on the Billboard 200, making it St. Vincent's highest charting album yet, only to be surpassed by her next solo album, St. Vincent. In addition, Strange Mercy also received significant critical acclaim. .","dar":"A pseudonym of Annie Clark (b. 28 Sept 1982), a USA multi-instrumentalist singer-songwriter. She was a member of The Polyphonic Spree and Sufjan Stevens' touring band. Born in Tulsa, Oklahoma, she began playing the guitar at the age of 12 and as a teenager worked as the tour manager for her uncle's band Tuck & Patti. She grew up in Dallas and attended Lake Highlands High School, graduating in 2001. Following this, she went on to attend Berklee College of Music, dropping out 3 years later."},{"n":189,"year":2010,"ar":"Beach House","ti":"Teen Dream","cv":"https://dn710701.ca.archive.org/0/items/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8-41237078188.png","rt":0.0,"sp":"","yt":"_4mLcQl-45Q","gen":["indie rock","dream pop","indie pop","rock"],"hb":[],"da":"Teen Dream is the third studio album by American dream pop duo Beach House. It was released on January 27, 2010 as the band's debut album on the record label Sub Pop. Internationally, the album was released by Bella Union in Europe, Mistletone Records in Australia, and Arts & Crafts in Mexico. The album was produced by the band and Chris Coady. The album received universal acclaim from music critics, who hailed it as one of the best albums of 2010. NME included it in their 2013 edition of the 500 Greatest Albums of All Time. The album was also .","dar":"Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":68,"year":2000,"ar":"Elliott Smith","ti":"Figure 8","cv":"https://dn710605.ca.archive.org/0/items/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae-18782213344.png","rt":0.0,"sp":"","yt":"B6sYRE65QIc","gen":["folk rock","chamber pop","indie rock","indie folk","indie pop","rock"],"hb":[],"da":"Figure 8 is the fifth studio album by American singer-songwriter Elliott Smith. Released by DreamWorks Records on April 18, 2000, it became Smith's second release on a major label and the last album he would complete before his death. It was recorded at Sunset Sound in Hollywood, Sonora Studios in Los Angeles, Capitol Studios in Hollywood, and Abbey Road Studios in London (\"Stupidity Tries\", \"In the Lost and Found (Honky Bach)\" and \"Pretty Mary K\"). The album was also released on double vinyl 12\" on Bong Load Custom Records, and later rereleased by Plain Records in 2008. It is also .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":49,"year":1999,"ar":"The Magnetic Fields","ti":"69 Love Songs","cv":"https://dn710705.ca.archive.org/0/items/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d-7440735207.jpg","rt":0.0,"sp":"","yt":"5VO4R98Ti6I","gen":["synth-pop","chamber pop","indie folk","indie pop","twee pop","Alternative Rock"],"hb":[],"da":null,"dar":"The Magnetic Fields is an American indie pop band that formed in Boston, MA in 1988 by Stephin Merritt. Albums released under the name \"The Magnetic Fields\" often consist of synth-pop music in a 1980s style underlying clever lyrics which are usually heavily ironic. While synth-pop often forms the foundation of their music, The Magnetic Fields' music borrows from many other styles, notably country, folk and indie pop.\n\nThe band was originally formed in Cambridge"},{"n":60,"year":1998,"ar":"Eels","ti":"Electro-Shock Blues","cv":"https://dn710303.ca.archive.org/0/items/mbid-439b88b6-fe90-4f47-839f-06d337544166/mbid-439b88b6-fe90-4f47-839f-06d337544166-3780798685.jpg","rt":0.0,"sp":"","yt":"7Pvn7Aj9kpA","gen":["alternative rock","indie pop","Alternative Rock"],"hb":["verygooood"],"da":"Electro-Shock Blues is the second studio album by American rock band Eels. It was released in the United Kingdom on September 21, 1998 and October 20 in the United States by record label DreamWorks. Electro-Shock Blues was written largely in response to frontman Mark Oliver Everett's (more commonly known as E) sister's suicide and his mother's terminal lung cancer. The title refers to the electroconvulsive therapy received by Elizabeth Everett when she was institutionalized. Many of the songs deal with their decline, his response to loss and coming to terms with suddenly becoming the only living member of his family .","dar":"Eels (often typeset as eels or EELS) is an American rock band, formed in Los Angeles, California, in 1991 by singer/songwriter and multi-instrumentalist Mark Oliver Everett, known by the stage name E. Band members have changed over the years, both in the studio and on stage, making Everett the only official member for most of the band's work. Eels' music is often filled with themes of family, death, and unrequited love. Since 1996, Eels has released fourteen studio albums, seven of which charted in the Billboard 200."},{"n":4,"year":1997,"ar":"Elliott Smith","ti":"Either/Or","cv":"https://dn710706.ca.archive.org/0/items/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e-18047694847.png","rt":0.0,"sp":"","yt":"UuizNQUOFCI","gen":["folk rock","indie rock","indie folk","indie pop","Rock","Alternative Rock"],"hb":[],"da":"Either/Or is the third studio album by American singer-songwriter Elliott Smith. Either/Or was recorded in several locations, mostly in Portland, Oregon – while Smith was still a member of Heatmiser – and was produced by Smith, Tom Rothrock, and Rob Schnapf. It was released on February 25, 1997, through Kill Rock Stars record label, following Heatmiser's dissolution. Book-ended by its two singles, Speed Trials and Ballad of Big Nothing, \"Either/Or\" did not chart in the US, but was acclaimed by critics. It has been described as \"a bridge between the lo-fi darkness of Roman Candle and Elliott Smith and the .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":125,"year":1996,"ar":"Belle and Sebastian","ti":"Tigermilk","cv":"https://dn710909.ca.archive.org/0/items/mbid-ae871d82-4914-4338-b2db-f91d723f9b18/mbid-ae871d82-4914-4338-b2db-f91d723f9b18-6748490069.png","rt":0.0,"sp":"","yt":"soMbZ7eLKlM","gen":["chamber pop","indie rock","indie pop","twee pop","Alternative Rock"],"hb":[],"da":"Tigermilk is the 1996 debut album from Scottish pop group Belle & Sebastian. Originally given a limited release (1,000 copies) by Electric Honey, the album was subsequently re-released in 1999 by Jeepster Records. The cover photograph was taken by Stuart Murdoch, and features Joanne Kenney - the same model who appeared on the cover of the Dog on Wheels EP. The album is named after a song that didn't end up making the cut – an instrumental that was later performed numerous times on Belle & Sebastian's early tours. All of the songs on the album were written by Stuart .","dar":"Belle and Sebastian are a Scottish indie pop band that formed in 1994 in Glasgow, Scotland. Led by guitarist/vocalist Stuart Murdoch, the seven-piece band have an intimate, majestic sound that is equal parts folk-rock and '60s pop. Murdoch has a gift not only for whimsy and surrealism, but also for odd, unsettling lyrical detail which keeps the songs grounded in a tangible reality. \n\nBelle and Sebastian released their first two albums in 1996: Tigermilk"},{"n":138,"year":1996,"ar":"Stereolab","ti":"Emperor Tomato Ketchup","cv":"https://ia800301.us.archive.org/13/items/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de-24086681893.jpg","rt":0.0,"sp":"","yt":"GLYu0allKgs","gen":["experimental rock","art pop","indie rock","post-rock","indie pop","indietronica"],"hb":["Nubis84","verygooood"],"da":"Emperor Tomato Ketchup is the fourth studio album by English-French rock band Stereolab. It was released on 18 March 1996 and was issued by Duophonic Records and Elektra Records. The album is named after the 1971 experimental film Emperor Tomato Ketchup by Japanese author and director Shūji Terayama. Emperor Tomato Ketchup was released on 18 March 1996 in the United Kingdom by Duophonic Records, and on 9 April 1996 in the United States by Elektra Records. The artwork for the album was inspired by the LP cover sleeve of a 1964 recording of composer Béla Bartók's Concerto for Orchestra by .","dar":"Stereolab is an Anglo-French avant-pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements."},{"n":96,"year":1993,"ar":"James","ti":"Laid","cv":"https://dn710603.ca.archive.org/0/items/mbid-bd3229d9-af7e-4a7b-a9ff-fc560e34eca5/mbid-bd3229d9-af7e-4a7b-a9ff-fc560e34eca5-3813580057.jpg","rt":0.0,"sp":"","yt":"0trh9Y598fM","gen":["alternative rock","indie pop","Pop","Alternative Rock"],"hb":["Frikomid","Lonsonxd","Nubis84","alberto_gu","sdecandelario","verygooood"],"da":"Laid is the fifth studio album by British alternative rock band James. It was released on 5 October 1993. It was the first of several collaborations between the group and Brian Eno, who produced all but one of the album's tracks – in Stuart Maconie's authorised biography of the group, Folklore, they admitted that Eno didn't like the song \"One of the Three\" so they recorded it when he took a day off. The sessions also resulted in the experimental Wah Wah album. .","dar":"There are several artists in this entry:\n\n1) a British alternative rock band formed in 1981 in Manchester\n2) the vocalist of popular Bangladeshi band Nagar Baul\n3) a Dutch rapper connected to the Fakkelteitgroep. \n4) James, South Korean Musician\n\n1) James is an indie rock band formed 1981 in Manchester, England\n\nThe band's sound is mostly defined by their lead singer Tim Booth's resonating vocals and emotional lyrics, as well as a spirit of experimentation that they held onto throughout their active career."},{"n":141,"year":1993,"ar":"Saint Etienne","ti":"So Tough","cv":"https://dn710709.ca.archive.org/0/items/mbid-f407323c-2332-3168-bf36-3b810cec0624/mbid-f407323c-2332-3168-bf36-3b810cec0624-3475192363.jpg","rt":0.0,"sp":"","yt":"j21pUaInxWo","gen":["synth-pop","indie pop","alternative dance","house","Electronic","Alternative Rock"],"hb":[],"da":"So Tough is the second studio album by British band Saint Etienne, released on Heavenly in 1993. It is their highest-charting album to date, reaching No. 7 on the UK Album Chart. So Tough is the first Saint Etienne album to feature Sarah Cracknell as an official member of the band. It was originally intended as a concept album which starts at \"Mario's Cafe\" in London then travels around the world, but it ultimately came to be viewed as a solely London album. One of the distinctive features of the album is the use of samples between the songs. The .","dar":"Saint Etienne is an indie dance/indie pop trio which formed in Croydon, England in 1990. The band was founded by journalist Bob Stanley (born December 25, 1964) and Pete Wiggs (born May 15, 1966) in Croydon, UK, January 1990. After recording 2 singles with guest singers, Sarah Cracknell (born April 12, 1967, Chelmsford, Essex) joined as a full member. The band is named after a French football team.\n\nSaint Etienne are one of the bands who defined the early 90s indie dance genre"},{"n":184,"year":1992,"ar":"Morrissey","ti":"Your Arsenal","cv":"https://dn710303.ca.archive.org/0/items/mbid-596071f9-a2ff-3185-a471-8fcb029625dd/mbid-596071f9-a2ff-3185-a471-8fcb029625dd-6618437694.jpg","rt":0.0,"sp":"","yt":"SX-da_xcbEQ","gen":["alternative rock","pop rock","glam rock","indie rock","indie pop","jangle pop"],"hb":[],"da":"Your Arsenal is the third studio album by English singer Morrissey, released on 27 July 1992 by record label HMV. The album received critical acclaim and reached number 4 on the UK Albums Chart. Morrissey had been rehearsing with a new band prior to the release of Your Arsenal, which was the first official album of this new line-up. Commencing with \"You're Gonna Need Someone on Your Side\", the album represents a clear change in direction for Morrissey from indie pop to a more muscular rock sound; with some elements of rockabilly. It also contains a glam rock influence, due .","dar":"Steven Patrick Morrissey, better known as Morrissey, is a British singer and lyricist of Irish descent born in Davyhulme, Manchester, United Kingdom on May 22, 1959.\n\nHe was the lead singer of The Smiths, one of the most influential alternative bands in the 1980s. The group split up in 1987 and Morrissey started a successful solo career.\n\nHis first solo album, Viva Hate was released only six months after The Smiths split, in March 1988. The album's first single \"Suedehead\" peaked at #5"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
