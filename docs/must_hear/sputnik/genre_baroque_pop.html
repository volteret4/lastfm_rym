<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

a51-11344065108.jpg","rt":0.0,"sp":"","yt":"AaUQ6ToaPqw","gen":["folk rock","folk","contemporary folk","baroque pop","country","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","sdecandelario"],"da":"For Emma, Forever Ago is the debut album from Wisconsin band Bon Iver. It was self-released in 2007 and received wider release on the Jagjaguwar label in February 2008 (and on the 4AD label in the UK in May 2008). The album was widely acclaimed, receiving spots on critics' end-of-the-year lists, as well as several awards. Following the break-up of his previous band DeYarmond Edison, Justin Vernon, suffering from mononucleosis, secluded himself in a cabin in Medford, Wisconsin for three months planning to \"hibernate.\" Three months of solitude resulted in the creation of For Emma, Forever Ago. \"All of his .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":10,"year":2006,"ar":"Joanna Newsom","ti":"Ys","cv":"https://dn711106.ca.archive.org/0/items/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16-9262812691.jpg","rt":0.0,"sp":"","yt":"cJ1yFhjRnNc","gen":["avant-garde","folk","alternative rock","chamber folk","baroque pop","country"],"hb":[],"da":"Ys is the second studio album by American musician Joanna Newsom. It was released by Drag City on November 6, 2006. The album was produced by Newsom and Van Dyke Parks, recorded by Steve Albini, mixed by Jim O'Rourke, with accompanying orchestral arrangements by Van Dyke Parks. It features guest vocals from Bill Callahan and Emily Newsom. The vocals and harp were recorded at The Village Recording Studio in Los Angeles in December 2005, with the orchestration being recorded between May and June 2006 at the Entourage Studios in Los Angeles. The album consists of five tracks with song durations .","dar":"Joanna Caroline Newsom is an American singer, songwriter, musician and actress. Born and raised in Northern California, Newsom was classically trained on the harp in her youth and began her musical career as a keyboardist in the San Francisco-based indie band The Pleased.\n\nAfter recording and self-releasing two EPs in 2002, Newsom was signed to the independent label Drag City. Her debut album, The Milk-Eyed Mender, was released in 2004 to critical acclaim and garnered Newsom an underground following."},{"n":6,"year":2005,"ar":"Sufjan Stevens","ti":"Illinois","cv":"https://dn710206.ca.archive.org/0/items/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1-26865127077.jpg","rt":0.0,"sp":"","yt":"ovIh2WVhbPs","gen":["folk rock","chamber folk","baroque pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","verygooood"],"da":"Illinois (or \"Sufjan Stevens Invites You To: Come On Feel The Illinoise\") is the second album in the so-called 50 States Project, which later turned out to be a stunt. The album focuses on Illinois and includes some things from Sufjan’s past as well. The artwork for the album originally included Superman but was eventually replaced (or, on some albums, flat-out removed). Contrary to popular belief, this is not because DC Comics filed a cease and desist. Rather, Asthmatic Kitty’s lawyers advised against this copyright infringement and a sticker of balloons was placed over it. They had also made other .","dar":"Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass."},{"n":180,"year":2005,"ar":"Andrew Bird","ti":"The Mysterious Production Of Eggs","cv":"https://dn710706.ca.archive.org/0/items/mbid-14ef3f91-7994-44a5-a55d-60f512ed7641/mbid-14ef3f91-7994-44a5-a55d-60f512ed7641-12985446912.jpg","rt":0.0,"sp":"","yt":"sUakffHAZh0","gen":["baroque pop","chamber pop","indie rock","neofolk","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"Andrew Bird (born July 11, 1973) is an American musician. He was born in Lake Bluff, Illinois but currently resides in the Los Angeles area. Bird is a singer, a violinist and, since 2004, a guitarist. He is also an accomplished whistler.\n\nHis early work, which echoed gypsy jazz and traditional folk, has led into his current sound, which mixes rock with more broad compositions. His years of solo song-craft have now enabled him to produce a sound that is uniquely his own."},{"n":10,"year":2004,"ar":"Arcade Fire","ti":"Funeral","cv":"https://dn711006.ca.archive.org/0/items/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1-31589070944.jpg","rt":0.0,"sp":"","yt":"qg7XMMAuCJo","gen":["art rock","baroque pop","art pop","chamber pop","indie rock","alternative punk"],"hb":[],"da":"Funeral is the debut full-length album by Canadian indie rock band Arcade Fire, released on September 14, 2004 in North America by Merge Records and on February 28, 2005 in Europe by Rough Trade Records. It was given its title because several band members had recently lost members of their families: Régine Chassagne's grandmother died in June 2003, Win and William Butler's grandfather (swing musician Alvino Rey) in March 2004, and Richard Reed Parry's aunt in April 2004. Preliminary recordings for Funeral were made during the course of a week in August 2003 at the Hotel2Tango in Montreal, Quebec, and .","dar":"Arcade Fire is a Canadian indie rock band formed in Montreal, Quebec, Canada in 2001. The band consists of Win Butler (vocals, guitar, piano), Régine Chassagne (vocals, accordion, keyboards, hurdy gurdy, drums), Richard Reed Parry (bass, guitar), Tim Kingsbury (bass), and Jeremy Gara (drums). Montreal percussionist Dane Mills performed on the EP and in early live shows.  Will Butler (keyboards, guitar) left the band in 2022 to focus on his solo career. The touring band includes horn players and violinists."},{"n":114,"year":2000,"ar":"Goldfrapp","ti":"Felt Mountain","cv":"https://dn710906.ca.archive.org/0/items/mbid-d5b80206-c691-400d-95d7-830311451af9/mbid-d5b80206-c691-400d-95d7-830311451af9-2919147114.jpg","rt":0.0,"sp":"","yt":"iKAsuvwDP_Q","gen":["baroque pop","art pop","chamber pop","trip hop","ambient pop","alternative pop"],"hb":[],"da":"Felt Mountain is the debut album by English electronic duo Goldfrapp. It was released by Mute Records on 11 September 2000 in the United Kingdom. The album features Alison Goldfrapp's synthesized vocals in cinematic scope, and takes influence from a variety of music styles such as 1960s pop, cabaret, folk, and electronica. Felt Mountain was a top seventy-five album in Goldfrapp's native United Kingdom, and was certified gold in October 2001. It was generally well received by music critics, and it was described as \"simultaneously smarmy and seductive, yet elegant and graceful\". In 2001, the album was shortlisted for the .","dar":"Goldfrapp are an English electronic band from London, formed in 1999 which consists of Alison Goldfrapp (vocals, synthesizer) and Will Gregory (synthesizer). Despite favourable reviews and a short-listing for the Mercury Prize, the début studio album Felt Mountain did not chart highly. Goldfrapp's second album Black Cherry, which incorporated glam rock and synthpop sounds, was released in 2003. The album influenced the same dance-oriented sound of their third album Supernature."},{"n":40,"year":1996,"ar":"The Divine Comedy","ti":"Casanova","cv":"https://ia800806.us.archive.org/13/items/mbid-cc4082a7-e79a-4c05-a6aa-f74695f2081c/mbid-cc4082a7-e79a-4c05-a6aa-f74695f2081c-41225734673.jpg","rt":0.0,"sp":"","yt":"I4J0gOonfh8","gen":["baroque pop","chamber pop","indie rock","britpop","lounge","cocktail nation"],"hb":[],"da":"Casanova is The Divine Comedy's fourth album. It was the band's commercial breakthrough. It was released on Setanta and certified gold in the UK in July 1997. This was helped by the release of The Divine Comedy's first single \"Something for the Weekend\" which reached number 13 on the charts. There were two other singles released from the album \"Becoming More Like Alfie\" and \"The Frog Princess\" which charted at 27 and 15 respectively. The album is also less classical sounding than Promenade and adopts more of a Britpop feel. An instrumental version of \"Songs of Love\" was used as .","dar":"The Divine Comedy is a baroque pop band now based in Dublin, Ireland, fronted by Neil Hannon.\n\nNeil Hannon, Originally from Derry, has been the only ever-present member of the band, being its founder in 1989 when he was joined by John McCullagh and Kevin Traynor. Their first album, the heavily R.E.M.-influenced and now-deleted Fanfare for the Comic Muse, enjoyed little success though. A couple of equally unsuccessful EPs - Timewatch (1991); Europop (1992) - were to follow"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
