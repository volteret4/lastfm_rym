<!DOCTYPE html>

<head>

<title>electronica — Sputnikmusic Best Albums</title>
<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

<script>
const A = [{"n":44,"year":2013,"ar":"Jon Hopkins","ti":"Immunity","cv":"https://cdn2.albumoftheyear.org/600x0/album/2013/7574-immunity-1.jpg","rt":0.0,"sp":"","yt":"sVefn-AXoZw","gen":["electro","electronica","idm","techno","tech house","microhouse"],"hb":["Frikomid","Nubis84","sdecandelario","verygooood"],"da":"A powerful, multi-faceted beast, packed with the most aggressively dancefloor-focused music Hopkins has ever made, \"Immunity\" is about achieving euphoric states through music. Inspired by the arc of an epic night out, the album peaks with \"Collider\", a huge, apocalyptic, techno monster and dissolves with the quiet, heartbreakingly beautiful closer, \"Immunity\", a track featuring vocals from King Creosote which could sit comfortably alongside the gems of their Mercury-nominated collaboration, \"Diamond Mine\". Immunity is a confident, dramatic record defined by an acute sense of physicality and place.  It feels like the hypnotic accompaniment to a journey of creativity, a trip inside .","dar":"Jonathan Julian \"Jon\" Hopkins (born 15 August 1979) is an English producer and musician who writes and performs electronic music. He began his career playing keyboard for Imogen Heap, and has produced or contributed to albums by Brian Eno, Coldplay, David Holmes and others.\n\nHopkins composed the soundtrack for the 2010 film Monsters, which was nominated for an Ivor Novello Award for Best Original Score. His third solo album, Insides, reached no. 15 on the Dance/Electronic Album Chart in 2009."},{"n":2,"year":2000,"ar":"Radiohead","ti":"Kid A","cv":"https://dn710905.ca.archive.org/0/items/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5-29475045164.png","rt":0.0,"sp":"","yt":"NUnXxh5U25Y","gen":["experimental rock","avant-garde","alternative rock","art rock","electronica","post-rock"],"hb":["BipolarMuzik","verygooood"],"da":"Kid A is the fourth studio album by the English rock band Radiohead, released on 2 October 2000 by Parlophone. On the verge of a breakdown after promoting Radiohead's 1997 album OK Computer, songwriter Thom Yorke envisioned a radical change in direction. Radiohead replaced their rock sound with synthesisers, drum machines, the ondes Martenot, string orchestras and brass instruments, incorporating influences from genres such as electronic music, krautrock, jazz, and 20th-century classical music. They recorded Kid A with OK Computer producer Nigel Godrich in Paris, Copenhagen, Gloucestershire and their hometown Oxford, England. The sessions produced over 20 tracks; Radiohead saved .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":14,"year":2000,"ar":"The Avalanches","ti":"Since I Left You","cv":"https://dn710202.ca.archive.org/0/items/mbid-0fbb1443-86b4-4fd5-829a-4620386e1ff7/mbid-0fbb1443-86b4-4fd5-829a-4620386e1ff7-28243512694.jpg","rt":0.0,"sp":"","yt":"OyUBL2-Qifk","gen":["art pop","dance","electronica","alternative dance","plunderphonics","sampledelia"],"hb":["EliasJ72","Frikomid","GabredMared","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Since I Left You is the debut studio album by Australian electronic dance music group The Avalanches, which was released on 27 November 2000. Produced by The Avalanches' members Robbie Chater and Darren Seltmann (under the pseudonym Bobbydazzler), it was issued on Modular Recordings. The album was created in two separate near-identical studios by Chater and Seltmann, passing audio mixes of records they sampled. The album contains about 3500 vinyl samples of various genres of music. As it was not originally intended for international release, the duo did not worry about copyright restrictions nor attempt to keep track of which .","dar":"There are two artists who go by The Avalanches:\n\n1. The Avalanches are an electronic music collective from Melbourne, Australia. The band is known for the use of eclectic sampling, having created their debut album, Since I Left You (2000), entirely out of over 3,500 samples of obscure records, movies, and television shows. This is famously demonstrated on their hit single \"Frontier Psychiatrist\".\n\nBefore this, they were a hip-hop group with the single album, Rock City and the EP, El Producto."},{"n":177,"year":1999,"ar":"Moby","ti":"Play","cv":"https://dn710305.ca.archive.org/0/items/mbid-1cc63af7-ff3c-4ec5-a6c5-1bc5563e80d9/mbid-1cc63af7-ff3c-4ec5-a6c5-1bc5563e80d9-10778255429.jpg","rt":0.0,"sp":"","yt":"FrSd1_kn-fQ","gen":["electronica","Electronic"],"hb":[],"da":"\"Play\" is the sixth studio album by the music artist Moby. While some of Moby's earlier work garnered critical and commercial success within the electronic dance music scene, \"Play\" was his first true pop success. The album introduced Moby to a worldwide mainstream audience, not only through hit singles, but also through unprecedented licensing of his music in films, television and commercial advertisements. One of the notable aspects of \"Play\", as opposed to other electronic albums of the time, was the way in which it combined old gospel and folk music rhythms with modern house sensibilities. Moby sampled heavily from .","dar":"Richard Melville Hall (born September 11, 1965), known professionally as Moby, is an American musician, songwriter, singer, producer, and animal rights activist. He has sold 20 million records worldwide. AllMusic considers him to be \"among the most important dance music figures of the early 1990s, helping bring dance music to a mainstream audience both in the United States and the United Kingdom.\" After taking up guitar and piano at age nine, he played"},{"n":6,"year":1998,"ar":"Massive Attack","ti":"Mezzanine","cv":"https://dn710600.ca.archive.org/0/items/mbid-6e512ec0-1316-4abb-b6b6-07dbd8b005ed/mbid-6e512ec0-1316-4abb-b6b6-07dbd8b005ed-12203062606.png","rt":0.0,"sp":"","yt":"fQtyrAEjHAU","gen":["dub","electronica","leftfield","trip hop","post-industrial","alternative dance"],"hb":["BipolarMuzik","Frikomid","GabredMared","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Mezzanine is the third studio album by English electronic music group Massive Attack, released on 20 April 1998 by Circa and Virgin Records. Produced by Massive Attack and Neil Davidge, it saw the duo expanding their trip hop sound to electronica stylings, with diverse influences from new wave, rock, hip hop, and dub music. Mezzanine topped the charts in the United Kingdom, Australia, Ireland, and New Zealand, becoming the group's most commercially successful album to date. It spawned four singles: Risingson, Teardrop, Angel, and Inertia Creeps. Background The production of Mezzanine was a stressful process. With tensions arising within the .","dar":"Massive Attack is an English trip hop collective formed in 1988 in Bristol by Robert \"3D\" Del Naja, Grant \"Daddy G\" Marshall, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles. The group consists of Del Naja and Marshall.\n\nTheir debut album, \"Blue Lines\" (1991), is frequently cited as the first major work of the trip hop genre. The single \"Unfinished Sympathy\" achieved chart success in Europe, including reaching number one on the Dutch Top 40. Their second album"},{"n":99,"year":1998,"ar":"Air","ti":"Moon Safari","cv":"https://dn710301.ca.archive.org/0/items/mbid-793d98c5-b54f-407c-ba79-788a1d7f685a/mbid-793d98c5-b54f-407c-ba79-788a1d7f685a-2484782079.jpg","rt":0.0,"sp":"","yt":"3XTV6pkQne0","gen":["electronica","ambient pop","Electronic"],"hb":[],"da":"Moon Safari is the first full-length studio album by the French band Air, released in 1998. The album is considered a classic of the chillout genre. It scored hits with the tracks \"Sexy Boy\", \"Kelly Watch the Stars\" and \"All I Need\" (which features vocals by Beth Hirsch). Moon Safari debuted at number five in the UK album charts mainly due to almost universally glowing reviews by the British music press and the success of the single \"Sexy Boy\". On April 14, 2008 Virgin Records released a reissue of Moon Safari to mark the album's 10-year anniversary. The limited edition .","dar":"There are at least five artists with this name:\n1. A popular electronic music duo from France\n2. A jazz trio from the United States\n3. A noise rock band from Japan\n4. An alias of ambient musician Pete Namlook\n5. A pop group from the Philippines \n\n1) The French band Air is a duo consisting of Nicolas Godin and Jean-Benoit Dunckel. They went to school in Versailles, (Lycée Jules Ferry) before forming the band in 1995 . Their critically acclaimed first album Premiers Symptômes was followed by the release of Moon Safari"},{"n":131,"year":1998,"ar":"Tortoise","ti":"TNT","cv":"https://dn710805.ca.archive.org/0/items/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1-22029271309.jpg","rt":0.0,"sp":"","yt":"2WGb_9UW6EU","gen":["electronica","post-rock","rock","instrumental","Electronic","Alternative Rock"],"hb":["Frikomid","GabredMared","Nubis84","paqueradejere","sdecandelario","verygooood"],"da":"Expected by many to continue leading the post-rock brigade into a new fusion with dub and electronics, Tortoise instead turned yet another corner with their third album, TNT. Adding guitarist Jeff Parker to cement their musicianship as well as their connections to Chicago's fertile jazz/avant-garde scene, the band returned with a record of post-modern cool jazz, only slightly informed by the dub, Krautrock, and electronics of Millions Now Living Will Never Die. It shows from the first few seconds -- a lazy, slightly free drum solo frames a few tentative guitar chords and some teased effects, before the band kicks .","dar":"Tortoise's almost entirely instrumental music defies easy categorization.  The group gained significant attention from their early career. The members have roots in Chicago's fertile music scene, playing in various indie rock and punk groups.  Formed in 1990, Tortoise was among the first American indie rock bands to incorporate styles closer to Krautrock, dub, minimalism, electronica and various jazz styles, rather than the standard rock and roll and punk that had dominated indie rock for years."},{"n":146,"year":1997,"ar":"The Chemical Brothers","ti":"Dig Your Own Hole","cv":"https://dn710406.ca.archive.org/0/items/mbid-4331ea73-77e1-3213-a840-5e4e74180f93/mbid-4331ea73-77e1-3213-a840-5e4e74180f93-2609487756.jpg","rt":0.0,"sp":"","yt":"0kMfTYPzSnI","gen":["psychedelic","electronica","techno","big beat","breakbeat","funky breaks"],"hb":["BipolarMuzik","Frikomid","alberto_gu","sdecandelario"],"da":"Dig Your Own Hole is the second album by British electronica duo The Chemical Brothers, released in the UK on April 7, 1997. It features Noel Gallagher of Oasis and Beth Orton as guest vocalists. In 1998 Q magazine readers voted Dig Your Own Hole the 49th greatest album of all time. In 2000 the same magazine placed it at number 42 in its list of the 100 Greatest British Albums Ever. In 2004, the album was packaged with 1995's Exit Planet Dust in a limited edition box set as part of EMI's \"2CD Originals\" collection. It was certified platinum .","dar":"The Chemical Brothers is an English electronic music duo formed by Tom Rowlands and Ed Simons in Manchester in 1989. They were pioneers (along with the Prodigy, Fatboy Slim, the Crystal Method, and other acts) in bringing the big beat genre to the forefront of pop culture. After attracting Virgin Records, the duo achieved further success with second album Dig Your Own Hole (1997), which topped the UK charts. In the UK, they have had six No. 1 albums and 13 top-20 singles, including two chart-toppers."},{"n":1,"year":1996,"ar":"DJ Shadow","ti":"Endtroducing.....","cv":"https://dn710007.ca.archive.org/0/items/mbid-40d8f956-ec2b-4e48-a430-2aeafffa0153/mbid-40d8f956-ec2b-4e48-a430-2aeafffa0153-37970502090.jpg","rt":0.0,"sp":"","yt":"EEV2EqVe9vU","gen":["electronica","trip hop","hip hop","experimental hip hop","instrumental hip hop","plunderphonics"],"hb":[],"da":"Endtroducing..... is the debut studio album by American hip hop artist DJ Shadow. It was released on November 19, 1996 by Mo' Wax Records. The album was conceived as an effort by Shadow to make an album completely based around sampling. It is structured almost entirely out of sampled elements from genres ranging from hip hop, jazz, funk, psychedelia, as well as samples from films and interviews. All sampling on the album was done on an Akai MPC60 MKII sampler. DJ Shadow released Endtroducing..... when he was 24 years old. Frequenting record stores to find music, he would often bring .","dar":"Joshua Paul Davis (born June 29, 1972), known professionally as DJ Shadow, is an American DJ and record producer. He first gained attention with his debut studio album \"Endtroducing.....\" (1996), noted for its extensive use of samples and layered production. He was also a member of the band UNKLE from 1996 to 1999.\n\nDJ Shadow began experimenting with a four-track recorder while in high school in Davis, California, and started his career as a disc jockey for the University of California, Davis, campus radio station KDVS."},{"n":44,"year":1996,"ar":"Orbital","ti":"In Sides","cv":"https://dn710302.ca.archive.org/0/items/mbid-e7170832-d2d7-4f4b-802c-34e9c13da59b/mbid-e7170832-d2d7-4f4b-802c-34e9c13da59b-33883938491.jpg","rt":0.0,"sp":"","yt":"K7E2Q0vBK0c","gen":["electronica","trance","techno","breakbeat","Electronic"],"hb":[],"da":"In Sides is the fourth album recorded by Orbital, released in 1996. The name is a reference to the fact that the album was originally available as a 3-LP vinyl box set, with one track per \"side\" of each LP. \"The Girl with the Sun in Her Head\" was dedicated to the memory of Volume magazine photographer Sally Harding who died in 1995. The track was recorded using electricity from a Greenpeace solar power generator. It opens with the sound of a heartbeat which serves as bass and develops into a cyclopean soundscape which many critics hold as one of .","dar":"Orbital is an electronic music duo consisting of brothers Phil Hartnoll and Paul Hartnoll formed in Sevenoaks, Kent, England in 1989.  Orbital take their name from Greater London's orbital motorway, the M25, which was central to the early rave scene and party network in the South East during the early days of acid house. One of the biggest names in British electronica during the 1990s, Orbital were both critically and commercially successful, being particularly known for an element of live improvisation during their shows"},{"n":92,"year":1996,"ar":"Aphex Twin","ti":"Richard D. James Album","cv":"https://cdn2.albumoftheyear.org/600x0/album/4013-richard-d-james-album_020556.jpg","rt":0.0,"sp":"","yt":"LAFazXZKZwQ","gen":["art pop","electronica","idm","jungle","drill and bass","Electronic"],"hb":[],"da":"Richard D. James Album is the eponymous fourth studio album by British electronic musician Richard D. James, under his pseudonym Aphex Twin. In the United Kingdom, the album was released on 4 November 1996 through Warp. In the United States, it was released on 28 January 1997 by Sire Records, with the Girl/Boy EP included as bonus tracks. A reissue on vinyl was released on 18 September 2012. Richard D. James Album was composed by James on his Macintosh computer, and took longer to complete than his previous efforts. The album features faster breakbeats and intricate drum programming which draw .","dar":"Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music."},{"n":75,"year":1994,"ar":"Global Communication","ti":"76:14","cv":"https://dn710007.ca.archive.org/0/items/mbid-105055e1-085a-49ed-a7cd-c2746b50d0d5/mbid-105055e1-085a-49ed-a7cd-c2746b50d0d5-33660385968.jpg","rt":0.0,"sp":"","yt":"w7-PD2oBvyY","gen":["electronica","electronic","ambient","downtempo","Electronic"],"hb":[],"da":null,"dar":"Global Communication is an ambient techno/ambient house duo, formed in 1992 in the United Kingdom, comprised of Tom Middleton and Mark Pritchard. They are best known for 76:14, an ambient album that sits alongside the likes of FSOL's Lifeforms and Aphex Twin's Selected Ambient Works 85-92, as one of the high-points of ambient composition within UK '90s electronic music scene.\n\nAs Global Communication they have released two studio albums. The first"},{"n":75,"year":1991,"ar":"Massive Attack","ti":"Blue Lines","cv":"https://dn711308.ca.archive.org/0/items/mbid-3a25785e-50ec-383c-89cf-fd512181449c/mbid-3a25785e-50ec-383c-89cf-fd512181449c-2233107692.jpg","rt":0.0,"sp":"","yt":"W5UIf9CRXNI","gen":["alternative rock","dub","electronica","trip hop","hip hop","alternative dance"],"hb":["BipolarMuzik","GabredMared","Rocky_stereo","paqueradejere","sdecandelario","verygooood"],"da":"Blue Lines is the debut studio album by English electronic music group Massive Attack, released on April 8, 1991 by Wild Bunch and Virgin Records. Generally regarded as the first \"trip hop\" album, Blue Lines blended elements of hip hop (such as breakbeats, sampling and rapping) with dub, soul, reggae and electronic music. The recording was led by members Grantley \"Daddy G\" Marshall, Robert \"3D\" Del Naja, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles, with co-production by Jonny Dollar. It also features contributions by singers Shara Nelson and Horace Andy. Blue Lines was named the 21st greatest album of all .","dar":"Massive Attack is an English trip hop collective formed in 1988 in Bristol by Robert \"3D\" Del Naja, Grant \"Daddy G\" Marshall, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles. The group consists of Del Naja and Marshall.\n\nTheir debut album, \"Blue Lines\" (1991), is frequently cited as the first major work of the trip hop genre. The single \"Unfinished Sympathy\" achieved chart success in Europe, including reaching number one on the Dutch Top 40. Their second album"},{"n":106,"year":1991,"ar":"The KLF","ti":"The White Room","cv":"https://ia600208.us.archive.org/30/items/mbid-74b206e1-38d6-3131-b8fb-b5aa910012f5/mbid-74b206e1-38d6-3131-b8fb-b5aa910012f5-10480607188.jpg","rt":0.0,"sp":"","yt":"kjqb9_OEySY","gen":["dance","electronica","acid house","alternative dance","breakbeat","house"],"hb":[],"da":"The White Room is the fourth and final studio album by British electronic music group The KLF, released on 3 March 1991. The album features versions of the band's hit singles, including \"What Time Is Love?\", \"3 a.m. Eternal\", and \"Last Train to Trancentral\". Originally scheduled for 1989 as the soundtrack to a film of the same name, the album's direction was changed after both the film and the original soundtrack LP were cancelled. Most tracks on the original album version are present in the final 1991 release, though in significantly remixed form. The White Room was supposed to be .","dar":"The KLF (also known as The Justified Ancients of Mu Mu, The Timelords, Kopyright Liberation Front and other names) were one of the seminal bands of the British acid house movement during the late 1980s and early 1990s, best known worldwide for their various stunts such as burning copies of their album \"1987: What The Fuck is Going On?\" on a bonfire in a Swedish field, firing machine gun blanks into the audience, writing a book on how to make a number one hit"},{"n":191,"year":1990,"ar":"The Shamen","ti":"En-Tact","cv":"https://dn710700.ca.archive.org/0/items/mbid-1848dabb-4604-445b-8ced-b7b02a6f8925/mbid-1848dabb-4604-445b-8ced-b7b02a6f8925-24347061403.jpg","rt":0.0,"sp":"","yt":"7qFmCxjN0m0","gen":["psychedelic","dance","electronica","acid house","techno","alternative dance"],"hb":[],"da":null,"dar":"The Shamen were an experimental acid house/techno band, initially formed in Aberdeen, Scotland by Colin Angus (b. 24 August, 1961), Derek McKenzie (b. 27 February, 1964), Keith McKenzie (b. 30 August, 1961) and Peter Stephenson (b. 1 March, 1962) in 1985 as a psychedelia-influenced indie rock act. They found underground credibility as an acid house act and a pioneer of the dance/rock crossover, before moving on to international commercial success with Ebeneezer Goode and the Boss Drum album."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
