<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>AOTY Must Hear — 2020s</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="icon" type="image/png" href="/images/discount.png" />
        <script
            defer
            src="https://cloud.umami.is/script.js"
            data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"
        ></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0a0a0a;
                --surface: #111;
                --border: #1e1e1e;
                --accent: #e8ff47;
                --heard: #e8ff47;
                --pending: #ff4747;
                --text: #e0e0e0;
                --muted: #555;
                --gap: 6px;
                --panel: 390px;
                --header-h: 58px;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                min-height: 100vh;
            }
            header {
                position: fixed;
                top: 0;
                left: 0;
                right: var(--panel);
                height: var(--header-h);
                z-index: 100;
                background: rgba(10, 10, 10, 0.97);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
                border-right: 1px solid var(--border);
                padding: 0 18px;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .back-link {
                font-family: "DM Mono", monospace;
                font-size: 0.68rem;
                color: var(--muted);
                text-decoration: none;
            }
            .back-link:hover {
                color: var(--text);
            }
            .header-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.5rem;
                letter-spacing: 0.08em;
                color: var(--accent);
                white-space: nowrap;
            }
            .dec-wrap {
                position: relative;
            }
            .dec-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--accent);
                background: rgba(232, 255, 71, 0.06);
                color: var(--accent);
                cursor: pointer;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 4px;
                white-space: nowrap;
            }
            .dec-btn:hover {
                background: rgba(232, 255, 71, 0.12);
            }
            .dec-dropdown {
                display: none;
                position: fixed;
                background: #161616;
                border: 1px solid var(--border);
                border-radius: 4px;
                z-index: 9999;
                min-width: 160px;
                padding: 4px 0;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            }
            .dec-dropdown.open {
                display: block;
            }
            .dec-dh {
                padding: 5px 10px 4px;
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
                margin-bottom: 3px;
            }
            .dec-item {
                display: block;
                padding: 6px 14px;
                font-family: "DM Mono", monospace;
                font-size: 0.68rem;
                color: var(--text);
                text-decoration: none;
                transition: background 0.1s;
            }
            .dec-item:hover {
                background: var(--surface);
            }
            .dec-item.active {
                color: var(--accent);
            }
            .controls {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-left: auto;
                flex-shrink: 0;
            }
            .filter-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
            }
            .filter-btn:hover {
                border-color: var(--muted);
                color: var(--text);
            }
            .filter-btn.active {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(232, 255, 71, 0.06);
            }
            .search-box {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                padding: 4px 9px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 3px;
                color: var(--text);
                width: 130px;
                outline: none;
                transition: border-color 0.15s;
            }
            .search-box:focus {
                border-color: var(--accent);
            }
            .search-box::placeholder {
                color: var(--muted);
            }
            .genre-wrap {
                position: relative;
            }
            .genre-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .genre-btn:hover,
            .genre-btn.active {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(232, 255, 71, 0.06);
            }
            .genre-btn .badge {
                background: var(--accent);
                color: #000;
                border-radius: 10px;
                padding: 1px 5px;
                font-size: 0.52rem;
                font-weight: 700;
            }
            .genre-dropdown {
                display: none;
                position: fixed;
                background: #161616;
                border: 1px solid var(--border);
                border-radius: 4px;
                z-index: 9999;
                min-width: 200px;
                max-height: 320px;
                overflow-y: auto;
                padding: 4px 0;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            }
            .genre-dropdown.open {
                display: block;
            }
            .genre-dh {
                padding: 5px 10px 4px;
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
                margin-bottom: 3px;
                display: flex;
                justify-content: space-between;
            }
            .genre-clear {
                color: var(--pending);
                cursor: pointer;
            }
            .genre-item {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 4px 10px;
                cursor: pointer;
                transition: background 0.1s;
            }
            .genre-item:hover {
                background: var(--surface);
            }
            .genre-item input {
                accent-color: var(--accent);
                cursor: pointer;
                flex-shrink: 0;
            }
            .genre-item label {
                font-family: "DM Mono", monospace;
                font-size: 0.65rem;
                color: var(--text);
                cursor: pointer;
                flex: 1;
                display: flex;
                justify-content: space-between;
            }
            .genre-item label span {
                color: var(--muted);
                font-size: 0.56rem;
            }
            .user-wrap {
                position: relative;
            }
            .user-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--accent);
                background: rgba(232, 255, 71, 0.06);
                color: var(--accent);
                cursor: pointer;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 5px;
                white-space: nowrap;
            }
            .user-btn:hover {
                background: rgba(232, 255, 71, 0.12);
            }
            .user-btn .u-name {
                max-width: 90px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .user-dropdown {
                display: none;
                position: fixed;
                background: #161616;
                border: 1px solid var(--border);
                border-radius: 4px;
                z-index: 9999;
                min-width: 164px;
                padding: 4px 0;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            }
            .user-dropdown.open {
                display: block;
            }
            .user-dh {
                padding: 5px 10px 4px;
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
                margin-bottom: 3px;
            }
            .user-item {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 5px 10px;
                cursor: pointer;
                transition: background 0.1s;
                font-family: "DM Mono", monospace;
                font-size: 0.68rem;
                color: var(--text);
            }
            .user-item:hover {
                background: var(--surface);
            }
            .user-item.active {
                color: var(--accent);
            }
            .user-item .u-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                flex-shrink: 0;
                background: var(--border);
            }
            .user-item.active .u-dot {
                background: var(--accent);
            }
            #main {
                margin-top: var(--header-h);
                margin-right: var(--panel);
                padding: 14px 18px 60px;
            }
            .count-bar {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                color: var(--muted);
                margin-bottom: 10px;
                display: flex;
                gap: 14px;
            }
            .count-bar b {
                color: var(--text);
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(10, 1fr);
                gap: var(--gap);
            }
            .card {
                position: relative;
                aspect-ratio: 1;
                border-radius: 3px;
                overflow: hidden;
                cursor: pointer;
                transition: transform 0.15s;
            }
            .card:hover {
                transform: scale(1.05);
                z-index: 10;
            }
            .card.hidden {
                display: none;
            }
            .card.active-card {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
                z-index: 11;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                background: var(--surface);
            }
            .heard-dot {
                position: absolute;
                top: 4px;
                right: 4px;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                z-index: 3;
                background: var(--heard);
                box-shadow: 0 0 5px var(--heard);
            }
            .card-overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.92) 0%,
                    rgba(0, 0, 0, 0) 55%
                );
                opacity: 0;
                transition: opacity 0.18s;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 6px;
                z-index: 2;
            }
            .card:hover .card-overlay {
                opacity: 1;
            }
            .card-scores {
                display: flex;
                gap: 3px;
                margin-bottom: 2px;
            }
            .card-score {
                font-family: "DM Mono", monospace;
                font-size: 0.58rem;
                font-weight: 700;
                padding: 1px 4px;
                border-radius: 2px;
            }
            .card-score.c {
                background: rgba(108, 184, 250, 0.2);
                color: #6cb8fa;
            }
            .card-score.u {
                background: rgba(191, 143, 255, 0.2);
                color: #bf8fff;
            }
            .card-title {
                font-size: 0.56rem;
                font-weight: 500;
                color: #fff;
                line-height: 1.25;
                overflow: hidden;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }
            .card-artist {
                font-size: 0.52rem;
                color: var(--muted);
                margin-top: 1px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .card::before {
                content: "";
                position: absolute;
                top: 4px;
                right: 4px;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                z-index: 3;
            }
            .card.heard-user::before {
                background: var(--heard);
                box-shadow: 0 0 5px var(--heard);
            }
            .card.unheard-user::before {
                background: var(--pending);
                box-shadow: 0 0 5px var(--pending);
            }
            #panel {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: var(--panel);
                background: #0c0c0c;
                border-left: 1px solid var(--border);
                z-index: 50;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .panel-topbar {
                height: var(--header-h);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 15px;
                flex-shrink: 0;
            }
            .panel-topbar-label {
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .panel-cover {
                width: 100%;
                aspect-ratio: 1;
                flex-shrink: 0;
                position: relative;
                background: var(--surface);
                max-height: 200px;
                overflow: hidden;
            }
            .panel-cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .panel-scores {
                display: flex;
                gap: 6px;
                position: absolute;
                bottom: 8px;
                left: 8px;
            }
            .panel-score {
                padding: 3px 8px;
                border-radius: 3px;
                font-family: "DM Mono", monospace;
                font-size: 0.72rem;
                font-weight: 700;
            }
            .panel-score.c {
                background: rgba(0, 0, 0, 0.7);
                color: #6cb8fa;
                border: 1px solid #6cb8fa44;
            }
            .panel-score.u {
                background: rgba(0, 0, 0, 0.7);
                color: #bf8fff;
                border: 1px solid #bf8fff44;
            }
            .panel-body {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
            .panel-body::-webkit-scrollbar {
                width: 3px;
            }
            .panel-body::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }
            .panel-empty {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100%;
                gap: 8px;
                font-family: "DM Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
                text-align: center;
            }
            .panel-empty-icon {
                font-size: 2rem;
                opacity: 0.3;
            }
            .panel-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.4rem;
                letter-spacing: 0.04em;
                color: var(--text);
                line-height: 1.05;
                margin-bottom: 2px;
            }
            .panel-artist {
                font-size: 0.78rem;
                color: var(--muted);
                margin-bottom: 1px;
            }
            .panel-year {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                color: var(--muted);
                margin-bottom: 10px;
            }
            .panel-genres {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-bottom: 10px;
            }
            .panel-genre-tag {
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                padding: 2px 6px;
                border-radius: 2px;
                background: rgba(232, 255, 71, 0.07);
                border: 1px solid rgba(232, 255, 71, 0.18);
                color: rgba(232, 255, 71, 0.65);
            }
            .panel-heard-by {
                font-family: "DM Mono", monospace;
                font-size: 0.6rem;
                color: var(--muted);
                margin-bottom: 9px;
            }
            .panel-heard-by b {
                color: var(--heard);
            }
            .panel-divider {
                height: 1px;
                background: var(--border);
                margin: 9px 0;
            }
            .panel-section-label {
                font-family: "DM Mono", monospace;
                font-size: 0.54rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 5px;
            }
            .panel-bio {
                font-size: 0.72rem;
                color: #aaa;
                line-height: 1.6;
                max-height: 120px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
            .panel-bio::-webkit-scrollbar {
                width: 3px;
            }
            .panel-bio::-webkit-scrollbar-thumb {
                background: var(--border);
            }
            .desc-block {
                margin-bottom: 9px;
            }
            .desc-source-label {
                font-family: "DM Mono", monospace;
                font-size: 0.5rem;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 2px;
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .desc-source-label::before {
                content: "";
                display: inline-block;
                width: 5px;
                height: 5px;
                border-radius: 50%;
                background: currentColor;
                flex-shrink: 0;
            }
            .desc-source-label.lfm {
                color: #d51007;
            }
            .desc-source-label.mb {
                color: #ba478f;
            }
            .desc-source-label.artist {
                color: #6a9fb5;
            }
            .desc-source-text {
                font-size: 0.7rem;
                color: #aaa;
                line-height: 1.55;
            }
            .panel-links {
                display: flex;
                gap: 5px;
                flex-wrap: wrap;
                margin-top: 9px;
            }
            .panel-link {
                font-family: "DM Mono", monospace;
                font-size: 0.58rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 3px 8px;
                border-radius: 3px;
                border: 1px solid var(--border);
                color: var(--muted);
                text-decoration: none;
                transition: all 0.15s;
            }
            .panel-link:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .panel-link.aoty {
                border-color: #e87c2e;
                color: #e87c2e;
            }
            .panel-link.aoty:hover {
                background: rgba(232, 124, 46, 0.08);
            }
            .panel-link.yt {
                border-color: #f00;
                color: #f00;
            }
            .panel-link.yt:hover {
                background: rgba(255, 0, 0, 0.08);
            }
            .panel-link.rym {
                border-color: #5baadb;
                color: #5baadb;
            }
            .panel-link.rym:hover {
                background: rgba(91, 170, 219, 0.08);
            }
            .panel-yt-wrap {
                margin-top: 11px;
                border-radius: 4px;
                overflow: hidden;
                background: var(--surface);
                border: 1px solid var(--border);
            }
            .panel-yt-wrap iframe {
                display: block;
                width: 100%;
                height: 145px;
                border: none;
            }
            .panel-yt-placeholder {
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                color: var(--muted);
            }
            #empty {
                display: none;
                text-align: center;
                padding: 50px 0;
                font-family: "DM Mono", monospace;
                color: var(--muted);
                font-size: 0.7rem;
            }
            @media (max-width: 800px) {
                :root {
                    --panel: 100vw;
                    --header-h: 50px;
                }
                header {
                    right: 0;
                }
                #main {
                    margin-right: 0;
                }
                #panel {
                    top: auto;
                    bottom: 0;
                    height: 55vh;
                    border-left: none;
                    border-top: 1px solid var(--border);
                }
                .dec-wrap {
                    display: none;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <a href="index.html" class="back-link">←</a>
            <span class="header-title">AOTY Must Hear</span>
            <div class="dec-wrap">
                <button class="dec-btn" id="dec-btn" onclick="toggleDecDD()">
                    2020s &#x25BE;
                </button>
            </div>
            <div class="controls">
                <button
                    class="filter-btn active"
                    id="btn-all"
                    onclick="setFilter('all')"
                >
                    All
                </button>
                <button
                    class="filter-btn"
                    id="btn-heard"
                    onclick="setFilter('heard')"
                >
                    Heard
                </button>
                <button
                    class="filter-btn"
                    id="btn-unheard"
                    onclick="setFilter('unheard')"
                >
                    Unheard
                </button>
                <input
                    class="search-box"
                    id="search"
                    placeholder="Search..."
                    oninput="applyFilters()"
                />
                <div class="genre-wrap">
                    <button
                        class="genre-btn"
                        id="genre-btn"
                        onclick="toggleGenreDD()"
                    >
                        Genre
                        <span
                            class="badge"
                            id="genre-badge"
                            style="display: none"
                            >0</span
                        >
                        &#x25BE;
                    </button>
                </div>
                <div class="user-wrap">
                    <button
                        class="user-btn"
                        id="user-btn"
                        onclick="toggleUserDD()"
                    >
                        <span class="u-name" id="user-btn-label"
                            >All users</span
                        >
                        &#x25BE;
                    </button>
                </div>
            </div>
        </header>
        <main id="main">
            <div class="count-bar">
                <span>Showing <b id="vis-count">683</b> of 683</span>
                <span><b id="vis-heard">0</b> heard</span>
            </div>
            <div id="grid"></div>
            <div id="empty">No albums match your filters.</div>
        </main>
        <aside id="panel">
            <div class="panel-topbar">
                <span class="panel-topbar-label">Album detail</span>
            </div>
            <div
                id="panel-cover-wrap"
                class="panel-cover"

            const imgObs = new IntersectionObserver(
                (entries) => {
                    entries.forEach((e) => {
                        if (e.isIntersecting && e.target.dataset.src) {
                            e.target.src = e.target.dataset.src;
                            e.target.removeAttribute("data-src");
                            imgObs.unobserve(e.target);

            function buildGenreList() {
                const list = document.getElementById("genre-list");
                list.innerHTML = "";
                GENRE_OPTS.forEach(([genre, count]) => {
                    const div = document.createElement("div");
                    div.className = "genre-item";
                    const id = "g-" + genre.replace(/[^a-z0-9]/g, "_");
                    div.innerHTML =
                        '<input type="checkbox" id="' +
                        id +
                        '" value="' +
                        genre +
                        '" onchange="toggleGenre(\'' +
                        genre +
                        '\',this.checked)"><label for="' +
                        id +
                        '">' +
                        genre +
                        "<span>" +
                        count +
                        "</span></label>";
                    list.appendChild(div);
                });
            }

            function toggleGenreDD() {
                const dd = document.getElementById("genre-dd");
                const btn = document.getElementById("genre-btn");
                const open = !dd.classList.contains("open");
                dd.classList.toggle("open", open);
                btn.classList.toggle("active", open || selectedGenres.size > 0);
                if (open) {
                    const r = btn.getBoundingClientRect();
                    dd.style.top = r.bottom + 4 + "px";
                    dd.style.left = Math.max(4, r.right - 200) + "px";
                }
            }

            function toggleGenre(g, checked) {
                if (checked) selectedGenres.add(g);
                else selectedGenres.delete(g);
                const badge = document.getElementById("genre-badge");
                const btn = document.getElementById("genre-btn");
                if (selectedGenres.size > 0) {
                    badge.textContent = selectedGenres.size;
                    badge.style.display = "";
                    btn.classList.add("active");
                } else {
                    badge.style.display = "none";
                    btn.classList.remove("active");
                }
                applyFilters();
            }

            function clearGenres() {
                selectedGenres.clear();
                document
                    .querySelectorAll("#genre-list input")
                    .forEach((i) => (i.checked = false));
                document.getElementById("genre-badge").style.display = "none";
                document.getElementById("genre-btn").classList.remove("active");
                applyFilters();
            }

            function toggleDecDD() {
                const dd = document.getElementById("dec-dd");
                const btn = document.getElementById("dec-btn");

                dd.classList.toggle("open", open);

                    dd.style.top = r.bottom + 4 + "px";
                    dd.style.left = r.left + "px";

            function buildUserList() {
                const list = document.getElementById("user-list");
                list.innerHTML = "";

                allDiv.className =
                    "user-item" + (!selectedUser ? " active" : "");
                allDiv.innerHTML = '<span class="u-dot"></span>All users';
                allDiv.onclick = () => setUser(null);
                list.appendChild(allDiv);
                USERS.forEach((u) => {
                    const div = document.createElement("div");
                    div.className =
                        "user-item" + (selectedUser === u ? " active" : "");
                    const n = ALBUMS.filter((a) =>
                        a.heard_by.includes(u),
                    ).length;
                    div.innerHTML =
                        '<span class="u-dot"></span>' +
                        u +
                        '<span style="color:var(--muted);font-size:.58rem;margin-left:auto">' +
                        n +
                        "</span>";
                    div.onclick = () => setUser(u);
                    list.appendChild(div);
                });
            }

            function toggleUserDD() {
                const dd = document.getElementById("user-dd");
                const btn = document.getElementById("user-btn");
                const open = !dd.classList.contains("open");
                dd.classList.toggle("open", open);
                if (open) {
                    const r = btn.getBoundingClientRect();
                    dd.style.top = r.bottom + 4 + "px";
                    dd.style.left = Math.max(4, r.right - 164) + "px";
                }
            }

            function setUser(u) {
                selectedUser = u;
                document.getElementById("user-btn-label").textContent =
                    u || "All users";
                document.getElementById("user-dd").classList.remove("open");
                buildUserList();
                document.querySelectorAll(".card").forEach((card) => {
                    const n = parseInt(card.dataset.num);
                    const a = ALBUMS.find((x) => x.n === n);
                    if (!a) return;
                    const heard = isHeard(a);
                    card.dataset.heard = heard ? "1" : "0";
                    card.classList.toggle("heard-user", heard);
                    card.classList.toggle("unheard-user", !heard);
                });
                applyFilters();
            }

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".genre-wrap"))
                    document
                        .getElementById("genre-dd")
                        .classList.remove("open");
                if (!e.target.closest(".user-wrap"))
                    document.getElementById("user-dd").classList.remove("open");
                if (!e.target.closest(".dec-wrap"))
                    document.getElementById("dec-dd").classList.remove("open");
            });

            function buildGrid() {
                const grid = document.getElementById("grid");
                grid.innerHTML = "";
                ALBUMS.forEach((a) => {
                    const card = document.createElement("div");
                    const heard = isHeard(a);
                    card.className =
                        "card " + (heard ? "heard-user" : "unheard-user");
                    card.dataset.artist = (a.artist || "").toLowerCase();
                    card.dataset.title = (a.title || "").toLowerCase();
                    card.dataset.genres = (a.genres || []).join(",");
                    card.dataset.heard = heard ? "1" : "0";
                    card.dataset.num = a.n;
                    const img = document.createElement("img");
                    img.dataset.src = a.cover || COVER_PH;
                    img.src = COVER_PH;
                    img.alt = a.n;
                    img.onerror = function () {
                        this.onerror = null;
                        this.src = COVER_PH;
                    };
                    card.appendChild(img);
                    const cs =
                        a.aoty_critic_score != null
                            ? '<span class="card-score c">' +
                              a.aoty_critic_score +
                              "</span>"
                            : "";
                    const us =
                        a.aoty_user_score != null
                            ? '<span class="card-score u">' +
                              a.aoty_user_score +
                              "</span>"
                            : "";
                    card.insertAdjacentHTML(
                        "beforeend",
                        '<div class="card-overlay">' +
                            '<div class="card-scores">' +
                            cs +
                            us +
                            "</div>" +
                            '<div class="card-title">' +
                            a.title +
                            "</div>" +
                            '<div class="card-artist">' +
                            a.artist +
                            (a.year ? " · " + a.year : "") +
                            "</div>" +
                            "</div>",
                    );
                    card.addEventListener("click", () => openPanel(a, card));
                    grid.appendChild(card);
                });
                document
                    .querySelectorAll("img[data-src]")
                    .forEach((img) => imgObs.observe(img));
                applyFilters();
            }

            function openPanel(a, cardEl) {
                document
                    .querySelectorAll(".card.active-card")
                    .forEach((c) => c.classList.remove("active-card"));
                cardEl.classList.add("active-card");

                const coverWrap = document.getElementById("panel-cover-wrap");
                coverWrap.style.display = "";
                document.getElementById("p-cover").src = a.cover || COVER_PH;
                document.getElementById("p-cover").onerror = function () {
                    this.src = COVER_PH;
                };

                const cs =
                    a.aoty_critic_score != null
                        ? '<span class="panel-score c">' +
                          a.aoty_critic_score +
                          " critic</span>"
                        : "";
                const us =
                    a.aoty_user_score != null
                        ? '<span class="panel-score u">' +
                          a.aoty_user_score +
                          " user</span>"
                        : "";
                document.getElementById("p-scores").innerHTML = cs + us;

                const links = [];
                if (a.aoty_url)
                    links.push(
                        '<a class="panel-link aoty" href="' +
                            a.aoty_url +
                            '" target="_blank">AOTY</a>',
                    );
                if (a.rym)
                    links.push(
                        '<a class="panel-link rym"  href="' +
                            a.rym +
                            '"      target="_blank">RYM</a>',
                    );
                if (a.mbid)
                    links.push(
                        '<a class="panel-link"      href="https://musicbrainz.org/release-group/' +
                            a.mbid +
                            '" target="_blank">MusicBrainz</a>',
                    );
                if (a.yt_id)
                    links.push(
                        '<a class="panel-link yt"   href="https://youtu.be/' +
                            a.yt_id +
                            '" target="_blank">YouTube</a>',
                    );

                let ytBlock = "";
                if (a.yt_id) {
                    ytBlock =
                        '<iframe src="https://www.youtube.com/embed/' +
                        a.yt_id +
                        '" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
                } else {
                    const q = encodeURIComponent(
                        a.artist + " " + a.title + " full album",
                    );
                    ytBlock =
                        '<div class="panel-yt-placeholder"><a href="https://www.youtube.com/results?search_query=' +
                        q +
                        '" target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a></div>';
                }

                const genreTags = (a.genres || [])
                    .map(
                        (g) => '<span class="panel-genre-tag">' + g + "</span>",
                    )
                    .join("");
                const heardLine =
                    a.heard_by.length > 0
                        ? '<div class="panel-heard-by">Heard by <b>' +
                          a.heard_by.join(", ") +
                          "</b></div>"
                        : "";

                const descSrcs = [
                    {
                        key: "desc_lfm_album",
                        cls: "lfm",
                        lbl: "💿 Album · Last.fm",
                    },
                    {
                        key: "desc_lfm_artist",
                        cls: "artist",
                        lbl: "🎤 Artist · Last.fm",
                    },
                    {
                        key: "desc_mb_album",
                        cls: "mb",
                        lbl: "💿 Album · MusicBrainz",
                    },
                    {
                        key: "desc_mb_artist",
                        cls: "mb artist",
                        lbl: "🎤 Artist · MusicBrainz",
                    },
                ];
                const descBlocks = descSrcs
                    .filter((s) => a[s.key] && a[s.key].length > 40)
                    .map(
                        (s) =>
                            '<div class="desc-block"><div class="desc-source-label ' +
                            s.cls +
                            '">' +
                            s.lbl +
                            '</div><div class="desc-source-text">' +

                    )

                    (a.year || "") +

                    (genreTags
                        ? '<div class="panel-genres">' + genreTags + "</div>"
                        : "") +
                    heardLine +

                    links.join("") +
                    "</div>" +
                    '<div class="panel-divider"></div>' +
                    '<div class="panel-section-label">Listen on YouTube</div>' +
                    '<div class="panel-yt-wrap">' +
                    ytBlock +
                    "</div>" +

                    '<div class="panel-section-label">About</div>' +
                    '<div class="panel-bio" id="p-bio">' +
                    bioHtml +

            async function fetchBio(artist, title, mbid) {
                const bioEl = document.getElementById("p-bio");
                if (!bioEl) return;
                const KEY = "key";
                const clean = (t) =>
                    t
                        .replace(
                            /<a href="[^"]*last\.fm[^"]*"[^>]*>[^<]*<\/a>/g,
                            "",
                        )
                        .replace(/<[^>]+>/g, "")
                        .replace(/ {2,}/g, " ")
                        .trim()
                        .slice(0, 800);
                const blocks = [];
                try {
                    const d = await fetch(
                        "https://ws.audioscrobbler.com/2.0/?method=album.getinfo&artist=" +
                            encodeURIComponent(artist) +
                            "&album=" +
                            encodeURIComponent(title) +
                            "&format=json&api_key=" +
                            KEY,
                    ).then((r) => r.json());
                    const wiki = clean(
                        d?.album?.wiki?.summary ||
                            d?.album?.wiki?.content ||
                            "",
                    );
                    if (wiki.length > 40)
                        blocks.push(
                            '<div class="desc-block"><div class="desc-source-label lfm">💿 Album · Last.fm</div><div class="desc-source-text">' +
                                wiki +
                                "</div></div>",
                        );
                    const d2 = await fetch(
                        "https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=" +
                            encodeURIComponent(artist) +
                            "&format=json&api_key=" +
                            KEY,
                    ).then((r) => r.json());
                    const bio = clean(d2?.artist?.bio?.summary || "");
                    if (bio.length > 40)
                        blocks.push(
                            '<div class="desc-block"><div class="desc-source-label artist">🎤 Artist · Last.fm</div><div class="desc-source-text">' +
                                bio +
                                "</div></div>",
                        );
                } catch (e) {}
                try {
                    if (mbid) {
                        const mb = await fetch(
                            "https://musicbrainz.org/ws/2/release-group/" +
                                mbid +
                                "?inc=annotation&fmt=json",
                        ).then((r) => r.json());
                        const ann = (mb?.annotation?.text || "").trim();
                        if (ann.length > 20)
                            blocks.push(
                                '<div class="desc-block"><div class="desc-source-label mb">💿 Album · MusicBrainz</div><div class="desc-source-text">' +
                                    ann.slice(0, 800) +
                                    "</div></div>",
                            );
                    }
                } catch (e) {}
                if (bioEl)
                    bioEl.innerHTML = blocks.length
                        ? blocks.join("")
                        : "No info available.";
            }

            function setFilter(f) {
                filter = f;
                ["all", "heard", "unheard"].forEach((x) => {
                    const btn = document.getElementById("btn-" + x);
                    if (!btn) return;
                    btn.classList.toggle("active", x === f);
                    if (x === "unheard") {
                        btn.style.borderColor =
                            f === "unheard" ? "var(--pending)" : "";
                        btn.style.color =
                            f === "unheard" ? "var(--pending)" : "";
                        btn.style.background =
                            f === "unheard" ? "rgba(255,71,71,.06)" : "";
                    }
                });
                applyFilters();
            }

            function applyFilters() {
                const q = document
                    .getElementById("search")
                    .value.toLowerCase()
                    .trim();
                let vis = 0,
                    visH = 0;
                document.querySelectorAll(".card").forEach((c) => {
                    const mf =
                        filter === "all" ||
                        (filter === "heard" && c.dataset.heard === "1") ||
                        (filter === "unheard" && c.dataset.heard === "0");
                    const ms =
                        !q ||
                        c.dataset.title.includes(q) ||
                        c.dataset.artist.includes(q);
                    const cg = c.dataset.genres
                        ? c.dataset.genres.split(",")
                        : [];
                    const mg =
                        selectedGenres.size === 0 ||
                        [...selectedGenres].some((g) => cg.includes(g));
                    const show = mf && ms && mg;
                    c.classList.toggle("hidden", !show);
                    if (show) {
                        vis++;
                        if (c.dataset.heard === "1") visH++;
                    }
                });
                document.getElementById("vis-count").textContent = vis;
                const uLabel = selectedUser ? " (" + selectedUser + ")" : "";
                document.getElementById("vis-heard").textContent =
                    visH + " heard" + uLabel;
                document.getElementById("empty").style.display =
                    vis === 0 ? "block" : "none";
            }

            buildGenreList();
            buildUserList();
            buildGrid();
            setTimeout(() => {
                const first = document.querySelector(".card:not(.hidden)");
                if (first) {
                    const a = ALBUMS.find(
                        (x) => x.n === parseInt(first.dataset.num),
                    );
                    if (a) openPanel(a, first);
                }
            }, 100);
