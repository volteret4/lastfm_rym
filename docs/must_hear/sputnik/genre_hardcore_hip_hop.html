<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

e two released three studio albums and a number of mixtapes, and had hit singles including \"Grindin'\" and \"When the Last Time\" (both 2002).\n\nIn September 2010, Pusha T signed to Kanye West's GOOD Music imprint, under the aegis of Def Jam Recordings."},{"n":32,"year":2014,"ar":"Run the Jewels","ti":"Run the Jewels 2","cv":"https://dn710906.ca.archive.org/0/items/mbid-957d62f4-8eb4-4636-afb9-07d92e0b5ace/mbid-957d62f4-8eb4-4636-afb9-07d92e0b5ace-10297290692.png","rt":0.0,"sp":"","yt":"nnbyzr9Wbqs","gen":["hip hop","experimental hip hop","hardcore hip hop","Hip-Hop"],"hb":["verygooood"],"da":"Run the Jewels 2 is the second studio album by American hip hop duo Run the Jewels, which consists of Killer Mike and El-P. The album was released early for free on October 24, 2014, and the following day on iTunes. It was made available on CD and LP by Mass Appeal Records and RBC Records on October 28, 2014. Run the Jewels 2 received widespread acclaim from critics for its darker and more layered production, Killer Mike and El-P's lyricism and chemistry and its guest contributions. Several publications also ranked it as the best album of 2014, including Pitchfork, .","dar":"Run the Jewels is an American hip-hop duo that consists of emcee/producer El-P and emcee Killer Mike.\n\nIn 2012, El-P produced Killer Mike's critically acclaimed album R.A.P. Music. The following week, Killer Mike appeared on the track \"Tougher Colder Killer\", from El-P's album Cancer 4 Cure. \n\nBoth won the acclaim of media and fans across the globe and led to 2012′s legendary, hugely successful “Into The Wild” tour. One year later, the duo return to satisfy fan demand"},{"n":1,"year":2012,"ar":"Kendrick Lamar","ti":"good kid, m.A.A.d city","cv":"https://dn710809.ca.archive.org/0/items/mbid-d5bcadc9-d6b2-4119-bf50-af1b9dca834c/mbid-d5bcadc9-d6b2-4119-bf50-af1b9dca834c-22057643526.png","rt":0.0,"sp":"","yt":"QyRmI1a6NCA","gen":["hip hop","conscious hip hop","west coast hip hop","gangsta rap","hardcore hip hop","Jazz"],"hb":["EliasJ72","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"good kid, m.A.A.d city is the second studio album by American hip-hop recording artist Kendrick Lamar. The album was released on October 22, 2012, by Top Dawg Entertainment, Aftermath Entertainment, and distributed by Interscope Records. The album serves as Lamar's major label debut, after his signing to Aftermath and Interscope in early 2012. It was preceded by the release of Kendrick's first studio album Section.80, released exclusively through iTunes independently. The album was recorded mostly at several studios in California with producers such as, Dr. Dre, Just Blaze, Pharrell Williams, Hit-Boy, Scoop DeVille, Jack Splash and T-Minus, among others. Billed .","dar":"Kendrick Lamar Duckworth (born June 17, 1987) is an American rapper. Regarded as one of the most influential hip-hop artists of his generation, he was awarded the 2018 Pulitzer Prize for Music, becoming the first musician outside of the classical and jazz genres to receive the honor.\n\nBorn in Compton, California, Lamar began releasing music under the stage name K.Dot while attending high school. He signed with Top Dawg Entertainment (TDE) in 2005, and co-founded the hip hop supergroup Black Hippy there."},{"n":122,"year":2012,"ar":"Billy Woods","ti":"History Will Absolve Me","cv":"https://dn710709.ca.archive.org/0/items/mbid-d13a81a8-3982-44b0-861e-6792a29c590d/mbid-d13a81a8-3982-44b0-861e-6792a29c590d-40533296369.jpg","rt":0.0,"sp":"","yt":"Q4AwIlNVxyQ","gen":["hip hop","experimental hip hop","east coast hip hop","conscious hip hop","hardcore hip hop","abstract hip hop"],"hb":[],"da":"History Will Absolve Me is the classic 2012 full-length album from billy woods, the Zimbabwean-Jamaican-by-way-of-Brooklyn rapper, who delivers a fragmentation grenade of an album. An explosive riot of bitter invective, evocative lyricism, and daisycutter beats, \"History Will Absolve Me\" is s a hip-hop artist from the Dexter-Linwood area of Detroit, Michigan. He has been described by MTV as \"one of rap's most unique figures in recent memory\". Danny is an unconventional hip-hop artist who employs multiple flows and cadences, thus the moniker “The Hybrid”. His style varies from low pitched gravelly tones to a manic, high-pitched squawk. His lyrics often deal with the truth of living in Detroit: poverty, drug abuse, desperate circumstances, etc."},{"n":13,"year":2000,"ar":"Eminem","ti":"The Marshall Mathers LP","cv":"https://dn720706.ca.archive.org/0/items/mbid-e13db7c6-7291-45bc-9ce9-3a4f9c9b5f55/mbid-e13db7c6-7291-45bc-9ce9-3a4f9c9b5f55-37454953221.jpg","rt":0.0,"sp":"","yt":"0NmsogZClfM","gen":["hip hop","pop rap","hardcore hip hop","horrorcore","Pop"],"hb":["BipolarMuzik"],"da":"The Marshall Mathers LP is the third studio album by American rapper Eminem, released on May 23, 2000, by Aftermath Entertainment and Interscope Records. The album was produced mostly by Dr. Dre and Eminem, along with The 45 King, the Bass Brothers, and Mel-Man. Recorded over a two-month period in several studios around Detroit, the album features more introspective lyricism, including Eminem's thoughts on his rise from rags to riches, the criticism of his music, and his estrangement from his family and wife. A transgressive work, it incorporates horrorcore and hardcore hip-hop, while also featuring satirical songs. Featured appearances include .","dar":"Marshall Bruce Mathers III (born October 17, 1972 in St. Joseph, MO), known professionally as Eminem (stylized as EMINƎM), is an American rapper, songwriter, and record producer. He is credited with popularizing hip-hop in Middle America and is regarded as one of the greatest rappers of all time. His success is considered to have broken racial barriers to the acceptance of white rappers in popular music. While much of his transgressive work during the late 1990s and early 2000s made him a controversial figure"},{"n":20,"year":2000,"ar":"Ghostface Killah","ti":"Supreme Clientele","cv":"https://dn710604.ca.archive.org/0/items/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90-955219996.jpg","rt":0.0,"sp":"","yt":"QZfdJx8Z1yw","gen":["hip hop","east coast hip hop","boom bap","hardcore hip hop","abstract hip hop"],"hb":[],"da":"Supreme Clientele is the second studio album of American rapper and Wu-Tang Clan member Ghostface Killah, released February 8, 2000 on Epic Records. The album showcases Ghostface's signature up-tempo, stream-of-consciousness rhyme style, and features guest appearances from Cappadonna, GZA, Masta Killa, Method Man, Raekwon, Redman, RZA, U-God, and others. If features members of what would become affiliates Theodore Unit and T.M.F. Supreme Clientele contains a large amount of production from group member RZA, who also re-worked and remixed beats from other producers involved, as a means to create a unified and cohesive sound for the album. Supreme Clientele debuted at .","dar":"Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele"},{"n":120,"year":1999,"ar":"Eminem","ti":"The Slim Shady LP","cv":"https://dn710109.ca.archive.org/0/items/mbid-ede60c69-29d1-48dd-a10b-169ae99dee92/mbid-ede60c69-29d1-48dd-a10b-169ae99dee92-27043383600.jpg","rt":0.0,"sp":"","yt":"TJP__WuRUzU","gen":["hip hop","boom bap","hardcore hip hop","horrorcore","Hip-Hop","Pop"],"hb":[],"da":"The Slim Shady LP is the second studio album and the major-label debut by American rapper Eminem. It was released on February 23, 1999, by Aftermath Entertainment and Interscope Records. Recorded in Ferndale, Michigan following Eminem's recruitment by Dr. Dre and Jimmy Iovine, the album features production from Dr. Dre, Bass Brothers, and Eminem himself. Featuring West Coast hip hop, G-funk and horrorcore musical styles, the majority of The Slim Shady LP's lyrical content is written from the perspective of Eminem's alter ego, named Slim Shady, whom he created on the Slim Shady EP (1997). The Slim Shady LP contains .","dar":"Marshall Bruce Mathers III (born October 17, 1972 in St. Joseph, MO), known professionally as Eminem (stylized as EMINƎM), is an American rapper, songwriter, and record producer. He is credited with popularizing hip-hop in Middle America and is regarded as one of the greatest rappers of all time. His success is considered to have broken racial barriers to the acceptance of white rappers in popular music. While much of his transgressive work during the late 1990s and early 2000s made him a controversial figure"},{"n":66,"year":1996,"ar":"Ghostface Killah","ti":"Ironman","cv":"https://cdn2.albumoftheyear.org/600x0/album/7984-ironman_172609.jpg","rt":0.0,"sp":"","yt":"a74LEdZawLo","gen":["hip hop","east coast hip hop","conscious hip hop","boom bap","hardcore hip hop","abstract hip hop"],"hb":[],"da":"Ironman is the solo debut album by American hip hop artist and Wu-Tang Clan member Ghostface Killah, released October 29, 1996, on Epic Records. Though mainly produced by fellow group member RZA, the LP is slightly different to that of other first generation solo Wu-Tang albums, owing much of its thematic scope, mythology and samples from classic 1960s and 1970s blaxploitation films, as well as a wider range of soul samples. It is also notable for being considerably more open in its references to the Nation of Gods and Earths and the group's beliefs. Upon its release, Ironman debuted at .","dar":"Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele"},{"n":1,"year":1994,"ar":"Nas","ti":"Illmatic","cv":"https://dn710902.ca.archive.org/0/items/mbid-f00af81c-9249-49d0-b3f5-8b6725bd1900/mbid-f00af81c-9249-49d0-b3f5-8b6725bd1900-28008351580.jpg","rt":0.0,"sp":"","yt":"Ufc81wjxOyE","gen":["hip hop","jazz rap","east coast hip hop","conscious hip hop","boom bap","hardcore hip hop"],"hb":[],"da":"\"Illmatic\" is the debut studio album by American rapper Nas, released on April 19, 1994, through Columbia Records. Nas signed with the label with the assistance of MC Serch and recorded the album in 1992 and 1993 at Chung King Studios, D&D Recording, Battery Studios, and Unique Recording Studios in New York City. Production was handled by DJ Premier, Large Professor, Pete Rock, Q-Tip, L.E.S., and Nas himself. The album is characterized as a hardcore hip-hop record, featuring multi-syllabic internal rhymes and narratives inspired by Nas’ upbringing in the Queensbridge Houses in Queens, New York. Nas began writing lyrics for .","dar":"Nasir bin Olu Dara Jones, more commonly known as Nas (formerly Nasty Nas and Escobar), born September 14, 1973 in Crown Heights, Brooklyn, New York, is a prominent American MC. The son of jazz musician Olu Dara, he was raised in the infamous Queensbridge housing projects in Queensbridge, New York. According to the Nasty Songfacts, as a teenager rapper, Nasir  first went by the nickname Kid Wave before adopting his more commonly known alias of Nasty Nas."},{"n":3,"year":1994,"ar":"The Notorious B.I.G.","ti":"Ready to Die", ion solo Wu-Tang projects, Tical was mainly produced by group member RZA, who provided a dark, murky and rugged sound. The album features guest appearances from RZA, Raekwon, Inspectah Deck, as well as several affiliates, who would later appeared on the future group projects. The album's title \"Tical\" is a slang term for a .","dar":"Clifford Smith Jr. (born March 2, 1971), known professionally as Method Man, is an American rapper, singer, record producer, and actor. He is a member of the East Coast hip hop collective Wu-Tang Clan and one half of the hip hop duo Method Man & Redman.\n\nMethod Man released his debut solo album, \"Tical,\" in 1994. The album reached number four on the Billboard 200 and produced the hit single \"I'll Be There for You/You're All I Need to Get By\" featuring Mary J."},{"n":84,"year":1992,"ar":"Ice Cube","ti":"The Predator","cv":"https://dn721606.ca.archive.org/0/items/mbid-c9950c2d-0f35-48cc-8a59-afa7933d0ddf/mbid-c9950c2d-0f35-48cc-8a59-afa7933d0ddf-10031621370.jpg","rt":0.0,"sp":"","yt":"bZP7ssNDsHY","gen":["hip hop","conscious hip hop","west coast hip hop","gangsta rap","hardcore hip hop","political hip hop"],"hb":[],"da":"The Predator is the third studio album by Ice Cube. Released within months of the 1992 Los Angeles riots, many songs comment on the racial tensions. The title is in part reference to the movie Predator 2, and the album itself includes samples from the film. Though not his most critically successful album, commercially The Predator is Ice Cube's most successful album, reaching double platinum status in the United States, and it contains his most well-known single, \"It Was a Good Day.\" The Predator is his only number one album on the Billboard 200 to date, selling 193,000 copies in .","dar":"O'Shea Jackson Sr. (born June 15, 1969), known professionally as Ice Cube, is an American rapper and actor. He began his career as a member of the hip-hop group C.I.A. and later joined the seminal rap group N.W.A (Niggaz Wit Attitudes). After leaving N.W.A in December 1989, he began both a successful solo music career and an acting career which included roles in films such as Boyz n the Hood (1991), Friday (1995), for which he also co-wrote the screenplay, and Barbershop (2002)."},{"n":28,"year":1991,"ar":"Cypress Hill","ti":"Cypress Hill","cv":"https://dn710602.ca.archive.org/0/items/mbid-5cf63bca-a3b2-3694-ad13-900809e41367/mbid-5cf63bca-a3b2-3694-ad13-900809e41367-8769285126.jpg","rt":0.0,"sp":"","yt":"iu6Wkf-y1t4","gen":["alternative hip hop","hip hop","boom bap","west coast hip hop","gangsta rap","hardcore hip hop"],"hb":[],"da":"Cypress Hill is the self titled debut album of Cypress Hill, released in August 1991. It was both critically and commercially hailed eventually allowing it to be certified double Platinum by the RIAA. It was known for its funk/rock-sampled beats as well as marijuana advocation lyrics. Steve Huey of Allmusic calls Cypress Hill's debut \"a sonic blueprint that would become one of the most widely copied in hip-hop.\" Rolling Stone calls it \"an album that is innovative and engaging in spite of its hard-core messages.\" In 1998, the album was selected as one of The Source Magazine's 100 Best Rap .","dar":"Cypress Hill is an American hip-hop group from South Gate, California. Cypress Hill was the first latino group to have platinum and multi-platinum albums and one of the first rap groups to gain a following with fans of hard rock and metal. The band was originally called DVX, but the name was changed after Mellow Man Ace left in 1988.\n\nTheir first album, which was self-titled, was released in August 1991. Its single was \"Phuncky Feel One\", but it was"},{"n":37,"year":1991,"ar":"Ice Cube","ti":"Death Certificate","cv":"https://cdn2.albumoftheyear.org/600x0/album/14020-death-certificate.jpg","rt":0.0,"sp":"","yt":"eDZtBm52Xmo","gen":["hip hop","west coast hip hop","gangsta rap","hardcore hip hop","Hip-Hop"],"hb":[],"da":"Death Certificate is the second studio album by rapper Ice Cube, released October 31, 1991 on Priority Records. Highly anticipated with over a million advance orders, the album was certified platinum in sales on December 20, 1991. The album debuted on the Top R&B/Hip-Hop Albums chart at #1 and on the Billboard 200 chart at #2, while it went on to sell over two million copies to date. It is considered one of the greatest hip hop albums of all time. It was also the source of much controversy due to some of its racially charged content, and Ice Cube's .","dar":"O'Shea Jackson Sr. (born June 15, 1969), known professionally as Ice Cube, is an American rapper and actor. He began his career as a member of the hip-hop group C.I.A. and later joined the seminal rap group N.W.A (Niggaz Wit Attitudes). After leaving N.W.A in December 1989, he began both a successful solo music career and an acting career which included roles in films such as Boyz n the Hood (1991), Friday (1995), for which he also co-wrote the screenplay, and Barbershop (2002)."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
