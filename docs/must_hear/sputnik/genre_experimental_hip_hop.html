<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

ic, on October 22, 2013 via Backwoodz Studioz."},{"n":7,"year":2022,"ar":"Billy Woods","ti":"Aethiopes","cv":"https://dn721608.ca.archive.org/0/items/mbid-f1afbb29-a149-40af-86a0-8e16f4cf5f4c/mbid-f1afbb29-a149-40af-86a0-8e16f4cf5f4c-32274129167.jpg","rt":0.0,"sp":"","yt":"xsbZ0CvlA74","gen":["experimental hip hop","jazz rap","conscious hip hop","hardcore hip hop","abstract hip hop","drumless hip hop"],"hb":[],"da":"Aethiopes is the tenth studio album by the prolific Brooklyn rapper billy woods. It sees him collaborating with producer Preservation, both of whom previously teamed up on woods' Terror Management and also on Preservation’s own Eastern Medicine, Western Illness. The album was released on April 8, 2022, through backwoodz studioz. In an interview with FADER, billy stated that this is his largest and most broad album conceptually. This is reflected in the album’s title “aethiopes,” a word with an uncertain definition. Historically, the word referred to dark-skinned people living in certain areas (specifically the south of the Sahara but also .","dar":"Born in Washington, DC, Billy Woods (stylized as billy woods) is a rapper based out of New York City. He has also lived in Zimbabwe, Jamaica, and Maryland. Billy Woods is a member of the Super Chron Flight Brothers with Priviledge, Armand Hammer with Elucid, and The Reavers supergroup.\n\nHis mother was an English literature professor from Jamaica. His father was a Ph.D. Marxist writer, active in the Zimbabwe War of Liberation and then a member of the government in Zimbabwe."},{"n":32,"year":2014,"ar":"Run the Jewels","ti":"Run the Jewels 2","cv":"https://dn710906.ca.archive.org/0/items/mbid-957d62f4-8eb4-4636-afb9-07d92e0b5ace/mbid-957d62f4-8eb4-4636-afb9-07d92e0b5ace-10297290692.png","rt":0.0,"sp":"","yt":"nnbyzr9Wbqs","gen":["hip hop","experimental hip hop","hardcore hip hop","Hip-Hop"],"hb":["verygooood"],"da":"Run the Jewels 2 is the second studio album by American hip hop duo Run the Jewels, which consists of Killer Mike and El-P. The album was released early for free on October 24, 2014, and the following day on iTunes. It was made available on CD and LP by Mass Appeal Records and RBC Records on October 28, 2014. Run the Jewels 2 received widespread acclaim from critics for its darker and more layered production, Killer Mike and El-P's lyricism and chemistry and its guest contributions. Several publications also ranked it as the best album of 2014, including Pitchfork, .","dar":"Run the Jewels is an American hip-hop duo that consists of emcee/producer El-P and emcee Killer Mike.\n\nIn 2012, El-P produced Killer Mike's critically acclaimed album R.A.P. Music. The following week, Killer Mike appeared on the track \"Tougher Colder Killer\", from El-P's album Cancer 4 Cure. \n\nBoth won the acclaim of media and fans across the globe and led to 2012′s legendary, hugely successful “Into The Wild” tour. One year later, the duo return to satisfy fan demand"},{"n":57,"year":2012,"ar":"Death Grips","ti":"The Money Store","cv":"https://i.discogs.com/Kt8YtYoud2bKdlxIT-nuC10j6xVCYz31BrODde-yvDk/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTM1NTU3/ODQtMTQyNzM4Mjg2/My05OTE0LmpwZWc.jpeg","rt":0.0,"sp":"","yt":"kxWlXxTM0yI","gen":["industrial","hip hop","experimental hip hop","Hip-Hop"],"hb":[],"da":"The Money Store is the debut studio album by the group Death Grips. It was officially released on April 24, 2012, but was leaked to YouTube on April 14 and made available on vinyl on April 21 to celebrate Record Store Day. It was announced along with a second album, which would be titled No Love Deep Web. It is the follow-up to their debut mixtape Exmilitary. The album was first hinted at with the release of a music video for a track titled \"Blackjack\" on February 7, 2012. The album was later announced along with the release of another .","dar":"Death Grips is an American experimental hip-hop band formed in 2010 in Sacramento, California. The group consists of producers Zach Hill (drums) and Andy Morin (keyboard), and vocalist Stefan Burnett, also known as MC Ride. Although not the frontman, Hill has often been regarded as the primary creative force behind the project. Drawing from hip-hop, punk rock, electronic, noise, and industrial music, the band developed a distinctive and hard-to-classify sound that earned critical acclaim and a cult following"},{"n":122,"year":2012,"ar":"Billy Woods","ti":"History Will Absolve Me","cv":"https://dn710709.ca.archive.org/0/items/mbid-d13a81a8-3982-44b0-861e-6792a29c590d/mbid-d13a81a8-3982-44b0-861e-6792a29c590d-40533296369.jpg","rt":0.0,"sp":"","yt":"Q4AwIlNVxyQ","gen":["hip hop","experimental hip hop","east coast hip hop","conscious hip hop","hardcore hip hop","abstract hip hop"],"hb":[],"da":"History Will Absolve Me is the classic 2012 full-length album from billy woods, the Zimbabwean-Jamaican-by-way-of-Brooklyn rapper, who delivers a fragmentation grenade of an album. An explosive riot of bitter invective, evocative lyricism, and daisycutter beats, \"History Will Absolve Me\" is a solid hour of hardboiled anti-nostalgia. The album features guest appearances by established stars like Roc Marciano, Vordul Mega (Cannibal Ox), MarQ Spekt, and Masai Bey, but also features up-and-coming talents Elucid and junclassic. Willie Green, A.M. Breakups, Marmaduke, Nasa (Def Jux/Uncommon Music), and Man Mantis handle the beats and provide a backdrop that matches the intensity of woods’ labyrinthine .","dar":"Born in Washington, DC, Billy Woods (stylized as billy woods) is a rapper based out of New York City. He has also lived in Zimbabwe, Jamaica, and Maryland. Billy Woods is a member of the Super Chron Flight Brothers with Priviledge, Armand Hammer with Elucid, and The Reavers supergroup.\n\nHis mother was an English literature professor from Jamaica. His father was a Ph.D. Marxist writer, active in the Zimbabwe War of Liberation and then a member of the government in Zimbabwe."},{"n":50,"year":2011,"ar":"Danny Brown","ti":"XXX","cv":"https://dn710702.ca.archive.org/0/items/mbid-560d74eb-0cc2-4a02-81e6-ba0f09b298c1/mbid-560d74eb-0cc2-4a02-81e6-ba0f09b298c1-4410464955.jpg","rt":0.0,"sp":"","yt":"cVx4f9swtTQ","gen":["alternative hip hop","hip hop","experimental hip hop","conscious hip hop","hardcore hip hop"],"hb":["EliasJ72","alberto_gu"],"da":"XXX (pronounced \"triple x\" or \"30\") is the second studio album by American rapper Danny Brown. It was released on August 15, 2011, by Fool's Gold Records. The album's production was handled by Frank Dukes, Brandun DeShay, Skywlkr, Nick Speed, Quelle, Paul White, Squadda Bambino, and DJ House Shoes. The album's only guest appearances come from Brown's Bruiser Brigade cohorts Chips and Dopehead. XXX was released as a free download by Brooklyn, New York-based record label Fool's Gold Records. Brown cited XXX as his attempt at \"experimenting and seeing how far could push listeners\" with his music. Brown explains that .","dar":"Daniel Dewan Sewell (born March 16, 1981), best known by his stage name Danny Brown, is a hip-hop artist from the Dexter-Linwood area of Detroit, Michigan. He has been described by MTV as \"one of rap's most unique figures in recent memory\". Danny is an unconventional hip-hop artist who employs multiple flows and cadences, thus the moniker “The Hybrid”. His style varies from low pitched gravelly tones to a manic, high-pitched squawk. His lyrics often deal with the truth of living in Detroit: poverty, drug abuse, desperate circumstances, etc."},{"n":173,"year":2011,"ar":"Shabazz Palaces","ti":"Black Up","cv":"https://cdn2.albumoftheyear.org/600x0/album/2386-black-up_155534.jpg","rt":0.0,"sp":"","yt":"67cx9M2c51M","gen":["avant-garde","psychedelic","dub","hip hop","experimental hip hop","abstract hip hop"],"hb":[],"da":null,"dar":"Shabazz Palaces is an American hip hop group from Seattle led by Ishmael Butler, also known as Palaceer Lazaro, formerly a member of the jazz rap group Digable Planets. Much of the project’s work was developed in collaboration with multi-instrumentalist Tendai “Baba” Maraire, the son of mbira musician Dumisani Maraire. Active since 2009, Shabazz Palaces has released five studio albums on Sub Pop, following the self-release of two EPs.\n\nThe group initially released two EPs anonymously in 2009, titled \"Shabazz Palaces\" and \"Of Light\"."},{"n":55,"year":2006,"ar":"Clipse","ti":"Hell Hath No Fury","cv":"https://dn721903.ca.archive.org/0/items/mbid-ebf053c4-758b-4aa8-81eb-11b8bb55c6cf/mbid-ebf053c4-758b-4aa8-81eb-11b8bb55c6cf-42331702924.jpg","rt":0.0,"sp":"","yt":"h2DihwLVAbU","gen":["hip hop","experimental hip hop","gangsta rap","southern hip hop","Hip-Hop"],"hb":[],"da":"Hell Hath No Fury is the third studio album by hip hop duo Clipse. The album was released on November 28, 2006 in the United States by Re-Up, Star Trak and Jive. Recording sessions for the album took place over a period of several years, and suffered numerous delays prior to release. Production was handled by The Neptunes. .","dar":"Clipse are a critically acclaimed hip hop duo that formed in Virginia Beach, Virginia in 1992.  They announced the end of their career together at a live show in 2010 and remained firm on this stance, up until 2024 when Pharrell announced a new album with them.\nThe duo is made up of brothers Gene \"No Malice\" Thornton and Terrence \"Pusha T\" Thornton, who is also currently signed to Kanye West's G.O.O.D Music label. They met Pharrell of the producing duo The Neptunes"},{"n":1,"year":2004,"ar":"Madvillain","ti":"Madvillainy","cv":"https://dn710700.ca.archive.org/0/items/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708-28231687719.jpg","rt":0.0,"sp":"","yt":"zQ0yXh_ADlQ","gen":["alternative hip hop","hip hop","experimental hip hop","instrumental hip hop","jazz rap","abstract hip hop"],"hb":[],"da":"Madvillainy is the legendary collaboration between rapper MF DOOM and producer Madlib under the group name Madvillain. It is considered one of the greatest hip-hop albums ever. It was released on March 23, 2004, on Stones Throw Records. The album was recorded between 2002 and 2004. Madlib created most of the instrumentals during a trip to Brazil in his hotel room using minimal amounts of equipment: a Boss SP-303 sampler, a turntable, and a tape deck. Fourteen months before the album was released, an unfinished demo version was stolen and leaked onto the internet. Frustrated, the duo stopped working on .","dar":"Madvillain was an American hip-hop duo consisting of two MCs and producers, MF DOOM and Madlib. Their debut album Madvillainy was met with wide critical acclaim for its unique approach. Their short songs, obscure lyrics and sparse choruses made for a sound that was generally unfriendly to commercial radio, but was lauded as a key aspect of their identity as an underground act.\n\nIn 2006, Madvillain was featured on Stones Throw Records and Adult Swim's DVD/CD Chrome Children with a new song and live performance."},{"n":78,"year":2004,"ar":"Dalek","ti":"Absence","cv":"https://dn721607.ca.archive.org/0/items/mbid-9f5a5b67-41d4-4671-8ee2-c2be2742aace/mbid-9f5a5b67-41d4-4671-8ee2-c2be2742aace-36796348316.jpg","rt":0.0,"sp":"","yt":"tXgM9T4mFbQ","gen":["industrial","dark ambient","hip hop","experimental hip hop","conscious hip hop","industrial hip hop"],"hb":[],"da":null,"dar":"This is an incorrect tag for Dälek. If this non-artist appears in your tags, please fix them."},{"n":1,"year":1996,"ar":"DJ Shadow","ti":"Endtroducing.....","cv":"https://dn710007.ca.archive.org/0/items/mbid-40d8f956-ec2b-4e48-a430-2aeafffa0153/mbid-40d8f956-ec2b-4e48-a430-2aeafffa0153-37970502090.jpg","rt":0.0,"sp":"","yt":"EEV2EqVe9vU","gen":["electronica","trip hop","hip hop","experimental hip hop","instrumental hip hop","plunderphonics"],"hb":[],"da":"Endtroducing..... is the debut studio album by American hip hop artist DJ Shadow. It was released on November 19, 1996 by Mo' Wax Records. The album was conceived as an effort by Shadow to make an album completely based around sampling. It is structured almost entirely out of sampled elements from genres ranging from hip hop, jazz, funk, psychedelia, as well as samples from films and interviews. All sampling on the album was done on an Akai MPC60 MKII sampler. DJ Shadow released Endtroducing..... when he was 24 years old. Frequenting record stores to find music, he would often bring .","dar":"Joshua Paul Davis (born June 29, 1972), known professionally as DJ Shadow, is an American DJ and record producer. He first gained attention with his debut studio album \"Endtroducing.....\" (1996), noted for its extensive use of samples and layered production. He was also a member of the band UNKLE from 1996 to 1999.\n\nDJ Shadow began experimenting with a four-track recorder while in high school in Davis, California, and started his career as a disc jockey for the University of California, Davis, campus radio station KDVS."},{"n":25,"year":1996,"ar":"Dr. Octagon","ti":"Dr. Octagonecologyst","cv":"https://dn711308.ca.archive.org/0/items/mbid-cddbf21f-9cd8-4665-a015-3cdc50cdcc72/mbid-cddbf21f-9cd8-4665-a015-3cdc50cdcc72-2925311149.jpg","rt":0.0,"sp":"","yt":"NebOetHhffU","gen":["hip hop","experimental hip hop","east coast hip hop","abstract hip hop","nerdcore","Hip-Hop"],"hb":["paqueradejere"],"da":"Dr. Octagonecologyst is the debut solo album of American rapper Keith Thornton and the first album he released under the alias Dr. Octagon. It was released May 6, 1996, on Bulk Recordings in the United States and Mo' Wax in the United Kingdom, and re-released in the US on DreamWorks Records in 1997. Dr. Octagonecologyst was produced by Dan \"The Automator\" Nakamura and featured the work of turntablist DJ Qbert. KutMasta Kurt provided additional production work. The artwork for Dr. Octagonecologyst was drawn by Brian \"Pushead\" Schroeder. Dr. Octagonecologyst introduces the character of Dr. Octagon, a homicidal, extraterrestrial, time-traveling gynecologist .","dar":"Dr. Octagon is one of Kool Keith's many alter egos.  His initial release as Dr. Octagon was 1996's Dr. Octagonecologyst, on which he collaborated with Dan The Automator Nakamura and DJ QBert. After the name was dropped in favour of Dr. Dooom, it was widely believed that it wouldn't be used again until the release of 2006's The Return of Dr. Octagon, which Keith maintains was changed and released without his consent.\n\nThe original album achieved critical acclaim and was a springboard for Dan The Automator's young career"},{"n":128,"year":1994,"ar":"Beastie Boys","ti":"Ill Communication","cv":"https://dn710608.ca.archive.org/0/items/mbid-39a6464c-3131-41a7-b44e-cb19416678e0/mbid-39a6464c-3131-41a7-b44e-cb19416678e0-35289827554.jpg","rt":0.0,"sp":"","yt":"u6bW7p3STQk","gen":["hardcore punk","funk","hip hop","experimental hip hop","instrumental hip hop","east coast hip hop"],"hb":[],"da":"Ill Communication is the fourth studio album by the American hip hop group Beastie Boys. It was released on May 31, 1994 by Grand Royal Records. Co-produced by Beastie Boys and Mario C., the album is among the band's most varied releases, drawing from hip-hop, punk rock, jazz and funk. Ill Communication features musical contributions from Money Mark, Eric Bobo and Amery \"AWOL\" Smith and vocal contributions from Q-Tip and Biz Markie. The Beastie Boys were influenced by Miles Davis' jazz rock albums Agharta and On the Corner while recording Ill Communication. Mike D and Adam Yauch collaborated with Gibran .","dar":"Beastie Boys were an American hip-hop trio from New York City, United States: Brooklyn and Manhattan. Originally formed as a four-piece hardcore punk band, The Young Aborigines, in 1978 by Michael Diamond (vocals), John Berry (guitar; died May 2016), Adam Yauch (bass) and Kate Schellenbach (drums), for the majority of its career the group consisted of Mike D (real name Michael Diamond),  Ad-Rock (Adam Horovitz) and, until his death in May 2012, MCA (Adam Yauch)."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
