<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":18,"year":2017,"ar":"Mount Eerie","ti":"A Crow Looked at Me","cv":"https://cdn2.albumoftheyear.org/600x0/album/70612-a-crow-looked-at-me_113109.jpg","rt":0.0,"sp":"","yt":"tPzkNS4rits","gen":["folk rock","folk","Alternative Rock"],"hb":["Frikomid","GabredMared","alberto_gu","verygooood"],"da":"WRITTEN AND RECORDED August 31st to Dec. 6th, 2016 in the same room where Geneviève died, using mostly her instruments, her guitar, her bass, her pick, her amp, her old family accordion, writing the words on her paper, looking out the same window. Why share this much? Why open up like this? Why tell you, stranger, about these personal moments, the devastation and the hanging love? Our little family bubble was so sacred for so long. We carefully held it behind a curtain of privacy when we’d go out and do our art and music selves, too special to share, .","dar":"Mount Eerie represents the latest evolution of Phil Elverum's musical vision.  Formerly known as The Microphones, Elverum began Mount Eerie in 2003,  maintaining his previous project's subtle, lo-fi, and lyrically dense fuzz-folk aesthetic.  \n\nElverum explained this change in an 2003 interview with Discorder, asserting that \"Mount Eerie is a new project. The Microphones was completed, or at least at a good stopping point. I did it because I am ready for new things. I am new.\""},{"n":71,"year":2016,"ar":"Leonard Cohen","ti":"You Want It Darker","cv":"https://cdn2.albumoftheyear.org/600x0/album/62251-you-want-it-darker_162620.jpg","rt":0.0,"sp":"","yt":"XQOpeJ8YHrE","gen":["folk rock","chamber folk","pop rock","art pop","Rock"],"hb":["Frikomid","Nubis84","alberto_gu","paqueradejere"],"da":"You Want It Darker is the fourteenth studio album by Leonard Cohen, released on October 21, 2016, by Columbia Records, seventeen days before Cohen's death. The album was created towards the end of his life and focuses on death, God, and humor. .","dar":"Leonard Norman Cohen (September 21, 1934 – November 7, 2016) was 600x0/album/helplessness-blues-1.jpg","rt":0.0,"sp":"","yt":"NwfQDYKd4gE","gen":["folk rock","indie rock","indie folk"],"hb":["Frikomid","Nubis84"],"da":"Helplessness Blues is the second studio album by Seattle-based folk band Fleet Foxes (release: May 02, 2011 on Bella Union) - leaked almost six weeks prior to the release). Initially, Robin Pecknold had stated he would like the album to be released in 2009; however, the band's touring schedule had caused them some setbacks. They got together to rehearse new songs in February 2009 in a rented house outside Seattle, but the sessions were mostly scrapped. As a result of those wasted sessions, the band lost $60,000 of their own money. After their tour in support of the 2008 releases .","dar":"Fleet Foxes is an American indie folk band formed in Seattle, Washington in 2006. The band consists of Robin Pecknold (vocals, guitar), Skyler Skjelset (guitar, mandolin, backing vocals), Casey Wescott (keyboards, mandolin, backing vocals), Christian Wargo (bass, guitar, backing vocals) and Morgan Henderson (upright bass, guitar, woodwinds, violin, percussion, saxophone).\n\nLed by singer-songwriter Robin Pecknold, the band came to prominence in 2008 with the release of their second EP Sun Giant and their debut album Fleet Foxes on Sub Pop."},{"n":116,"year":2011,"ar":"Bon Iver","ti":"Bon Iver, Bon Iver","cv":"https://cdn2.albumoftheyear.org/600x0/album/2479-bon-iver-bon-iver_013505.jpg","rt":0.0,"sp":"","yt":"8bIALq5Wi-I","gen":["folk rock","folk","baroque pop","indie rock","indie folk"],"hb":[],"da":"The name ‘Bon Iver’ is derived from the French for ‘good winter.’ The album was recorded in Justin Vernon’s home town of Eau Claire in Wisconsin, where the temperature rarely rises above freezing in winter. The Calgary Songfacts reports that Vernon told UK newspaper The Sun naming it Bon Iver shows he’s accepting winter is a big part of the album. .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":11,"year":2007,"ar":"Bon Iver","ti":"For Emma, Forever Ago","cv":"https://ia801906.us.archive.org/19/items/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51-11344065108.jpg","rt":0.0,"sp":"","yt":"AaUQ6ToaPqw","gen":["folk rock","folk","contemporary folk","baroque pop","country","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","sdecandelario"],"da":"For Emma, Forever Ago is the debut album from Wisconsin band Bon Iver. It was self-released in 2007 and received wider release on the Jagjaguwar label in February 2008 (and on the 4AD label in the UK in May 2008). The album was widely acclaimed, receiving spots on critics' end-of-the-year lists, as well as several awards. Following the break-up of his previous band DeYarmond Edison, Justin Vernon, suffering from mononucleosis, secluded himself in a cabin in Medford, Wisconsin for three months planning to \"hibernate.\" Three months of solitude resulted in the creation of For Emma, Forever Ago. \"All of his .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":6,"year":2005,"ar":"Sufjan Stevens","ti":"Illinois","cv":"https://dn710206.ca.archive.org/0/items/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1-26865127077.jpg","rt":0.0,"sp":"","yt":"ovIh2WVhbPs","gen":["folk rock","chamber folk","baroque pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","verygooood"],"da":"Illinois (or \"Sufjan Stevens Invites You To: Come On Feel The Illinoise\") is the second album in the so-called 50 States Project, which later turned out to be a stunt. The album focuses on Illinois and includes some things from Sufjan’s past as well. The artwork for the album originally included Superman but was eventually replaced (or, on some albums, flat-out removed). Contrary to popular belief, this is not because DC Comics filed a cease and desist. Rather, Asthmatic Kitty’s lawyers advised against this copyright infringement and a sticker of balloons was placed over it. They had also made other .","dar":"Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass."},{"n":141,"year":2002,"ar":"Beck","ti":"Sea Change","cv":"https://dn710605.ca.archive.org/0/items/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006-990718896.jpg","rt":0.0,"sp":"","yt":"JB2CvfMY6SM","gen":["folk rock","alternative rock","contemporary folk","chamber pop","indie rock","alternative country"],"hb":[],"da":"Beck has always been known for his ever-changing moods -- particularly since they often arrived one after another on one album, sometimes within one song -- yet the shift between the neon glitz of Midnite Vultures and the lush, somber Sea Change is startling, and not just because it finds him in full-on singer/songwriter mode, abandoning all of the postmodern pranksterism of its predecessor. What's startling about Sea Change is how it brings everything that's run beneath the surface of Beck's music to the forefront, as if he's unafraid to not just reveal emotions, but to elliptically examine them in .","dar":"Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist)."},{"n":68,"year":2000,"ar":"Elliott Smith","ti":"Figure 8","cv":"https://dn710605.ca.archive.org/0/items/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae-18782213344.png","rt":0.0,"sp":"","yt":"B6sYRE65QIc","gen":["folk rock","chamber pop","indie rock","indie folk","indie pop","rock"],"hb":[],"da":"Figure 8 is the fifth studio album by American singer-songwriter Elliott Smith. Released by DreamWorks Records on April 18, 2000, it became Smith's second release on a major label and the last album he would complete before his death. It was recorded at Sunset Sound in Hollywood, Sonora Studios in Los Angeles, Capitol Studios in Hollywood, and Abbey Road Studios in London (\"Stupidity Tries\", \"In the Lost and Found (Honky Bach)\" and \"Pretty Mary K\"). The album was also released on double vinyl 12\" on Bong Load Custom Records, and later rereleased by Plain Records in 2008. It is also .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":7,"year":1998,"ar":"Neutral Milk Hotel","ti":"In the Aeroplane Over the Sea","cv":"https://dn710607.ca.archive.org/0/items/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e-8579764982.jpg","rt":0.0,"sp":"","yt":"hy0B4uBZaOs","gen":["folk rock","alternative rock","indie rock","noise pop","indie folk","brass band"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"In the Aeroplane Over the Sea is the second and final studio album by the American indie rock band Neutral Milk Hotel. It was released in the United States on February 10, 1998 on Merge Records and May 1998 on Blue Rose Records in the United Kingdom. Jeff Mangum moved from Athens, Georgia to Denver, Colorado to prepare the bulk of the album's material with producer Robert Schneider, this time at Schneider's newly created Pet Sounds Studio at the home of Jim McIntyre. The album was the sixth-best-selling vinyl album in 2008. NME named it the 98th greatest album of .","dar":"Neutral Milk Hotel was an American alternative rock band formed by singer, guitarist, and songwriter Jeff Mangum in 1989 in Ruston, Louisiana. On the band's full-length albums, Mangum played with a number of other musicians, notably Jeremy Barnes (drums), Scott Spillane (horns), Julian Koster (musical saw/banjo/accordion/bass guitar) and producer-instrumentalist Robert Schneider. Neutral Milk Hotel were one of the original members of the Elephant Six Collective, based in Athens, Georgia."},{"n":168,"year":1998,"ar":"Cat Power","ti":"Moon Pix","cv":"https://dn710308.ca.archive.org/0/items/mbid-d8bfb0c6-4d82-41c4-8567-a2823525aade/mbid-d8bfb0c6-4d82-41c4-8567-a2823525aade-6010113367.jpg","rt":0.0,"sp":"","yt":"6fw7KZ3v8fc","gen":["folk rock","country rock","slowcore","rock","Alternative Rock"],"hb":[],"da":"Moon Pix is the fourth album by American singer-songwriter Cat Power (a.k.a. Chan Marshall). It was released in September 1998 on Matador Records. Prior to recording Moon Pix, Marshall had planned to retire from the music business, relocating to Portland, Oregon and Prosperity, South Carolina; however, after experiencing a hallucinatory nightmare while staying in a rural farmhouse, Marshall wrote the bulk of Moon Pix in a single night. In January 1998, Marshall traveled to Melbourne, Australia, to record the album with Mick Turner and Jim White, of the Australian instrumental band Dirty Three, on guitar and drums, respectively. .","dar":"Cat Power is an American singer, songwriter, musician, actress, and model. Charlyn Marie Marshall (also known as Chan, pronounced \"Shawn\")  was born in Atlanta, Georgia, U.S. on 21 January 1972. Cat Power was originally the name of Marshall's first band, but has become her stage name as a solo artist.\n\nAfter dropping out of high school, Marshall started performing under the name Cat Power, while in Atlanta, backed by musicians Glen Thrasher, Mark Moore, and others."},{"n":4,"year":1997,"ar":"Elliott Smith","ti":"Either/Or","cv":"https://dn710706.ca.archive.org/0/items/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e-18047694847.png","rt":0.0,"sp":"","yt":"UuizNQUOFCI","gen":["folk rock","indie rock","indie folk","indie pop","Rock","Alternative Rock"],"hb":[],"da":"Either/Or is the third studio album by American singer-songwriter Elliott Smith. Either/Or was recorded in several locations, mostly in Portland, Oregon – while Smith was still a member of Heatmiser – and was produced by Smith, Tom Rothrock, and Rob Schnapf. It was released on February 25, 1997, through Kill Rock Stars record label, following Heatmiser's dissolution. Book-ended by its two singles, Speed Trials and Ballad of Big Nothing, \"Either/Or\" did not chart in the US, but was acclaimed by critics. It has been described as \"a bridge between the lo-fi darkness of Roman Candle and Elliott Smith and the .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":121,"year":1997,"ar":"Bob Dylan","ti":"Time Out of Mind","cv":"https://dn710805.ca.archive.org/0/items/mbid-3e812af9-b0e0-3bb8-9738-b51470797d92/mbid-3e812af9-b0e0-3bb8-9738-b51470797d92-22279139173.jpg","rt":0.0,"sp":"","yt":"5y_VTtGujPI","gen":["blues rock","folk rock","classic rock","Rock"],"hb":[],"da":"Time Out of Mind is Bob Dylan's 30th studio album, released in 1997 by Columbia Records. For fans and critics, the album marked Dylan's artistic comeback after he struggled with his musical identity throughout the 1980s, and hadn't released any original material since the release of Under the Red Sky in 1990. Upon release, Time Out of Mind was hailed as one of the singer-songwriter's best albums, and it went on to win three Grammy awards, including Album of the Year in 1998. It also made Uncut magazine's Album of the Year. The album features a particularly atmospheric sound, the .","dar":"Bob Dylan (born Robert Allen Zimmerman on May 24, 1941 in Duluth, Minnesota, United States)  is an American songwriter, poet, guitarist, and singer. Often regarded as one of the greatest songwriters of all time, Dylan has been a major figure in popular culture during a career spanning more than 60 years.\n\nDylan started his musical odyssey in 1959 when he began playing in Dinkytown, Minneapolis while attending the University of Minnesota. Shortly after starting to play he changed his stage name to Bob Dylan"},{"n":128,"year":1997,"ar":"Jim O'Rourke","ti":"Bad Timing","cv":"https://dn710901.ca.archive.org/0/items/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418-27073926441.jpg","rt":0.0,"sp":"","yt":"g4KSE4oo9d8","gen":["experimental rock","avant-garde","folk rock","pop rock","american primitive guitar","rock"],"hb":["Nubis84"],"da":"Bad Timing is an album by American musician Jim O'Rourke, released on Drag City in 1997. It is an instrumental album, consisting largely of Jim O'Rourke's acoustic guitar playing (much in the style of John Fahey), sometimes with additional instrumentation. The album is named after the 1980 film Bad Timing: A Sensual Obsession, directed by Nicolas Roeg. It is one of a trio of O'Rourke albums, along with Eureka and Insignificance, to be named after Roeg films from the 1980s. This album is a favorite of Wilco's Jeff Tweedy. .","dar":"American indie rock and avant-garde musician, composer and producer Jim O'Rourke (born January 18, 1969, in Chicago) has been a key component in the increasing overlap of the American and European experimental music avant-garde, working in everything from jazz and rock to ambient and electro-acoustic and building many a bridge in between. He currently resides in Yamanashi, Japan.\n\nA Chicago native, O'Rourke's work has found equal luck with experimental jazz and noise fanatics"},{"n":176,"year":1996,"ar":"Gillian Welch","ti":"Revival","cv":"https://dn710202.ca.archive.org/0/items/mbid-769578b3-5603-407e-93d6-c689e2d43e5a/mbid-769578b3-5603-407e-93d6-c689e2d43e5a-6211960520.jpg","rt":0.0,"sp":"","yt":"0pHnbDFeezA","gen":["folk rock","folk","country rock","alternative country","Rock"],"hb":[],"da":"Revival is the first album by American singer-songwriter Gillian Welch, released on April 9, 1996. Revival was nominated for the 1997 Grammy Award for Best Contemporary Folk Album. .","dar":"Gillian Howard Welch (born October 2, 1967) is an American singer-songwriter. She performs with her musical partner, guitarist David Rawlings. Their sparse and dark musical style, which combines elements of Appalachian music, bluegrass, country and Americana, is described by The New Yorker as \"at once innovative and obliquely reminiscent of past rural forms.\"\n\nWelch and Rawlings have collaborated on seven critically acclaimed albums, five released under her name, and two released under the name Dave Rawlings Machine."},{"n":5,"year":1994,"ar":"Jeff Buckley","ti":"Grace","cv":"https://dn710600.ca.archive.org/0/items/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1-24008507233.jpg","rt":0.0,"sp":"","yt":"ywEByqEVQRk","gen":["folk rock","alternative rock","classic rock","pop rock","Rock","Alternative Rock"],"hb":["BipolarMuzik","Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"\"Grace\" is the first and only complete studio album by Jeff Buckley, released on August 23, 1994. The album is named after the title track, \"Grace\", co-written by Buckley and Gary Lucas. While the album initially had poor sales, only peaking at #149 in the U.S., it received wide critical acclaim. It has now sold over 2 million copies worldwide. An extended version of the album (subtitled Legacy Edition) celebrating its tenth anniversary was released in 2004, and it peaked at #44 in the UK. Musicians such as Thom Yorke of Radiohead and Matthew Bellamy of Muse list Buckley among .","dar":"Jeffrey Scott \"Jeff\" Buckley (raised Scott Moorhead; November 17, 1966 – May 29, 1997) was an American musician. After spending approximately a decade as a session guitarist in Los Angeles, he began performing in the early 1990s at venues in Manhattan’s East Village, where he developed a following. Buckley signed with Columbia Records and released his only studio album, \"Grace\", in 1994. He toured internationally to promote the album, performing in the United States, Europe, Japan, and Australia."},{"n":71,"year":1994,"ar":"Tom Petty","ti":"Wildflowers","cv":"https://dn711000.ca.archive.org/0/items/mbid-6a87e042-f9d6-437d-a218-263aceaa209b/mbid-6a87e042-f9d6-437d-a218-263aceaa209b-39501014993.jpg","rt":0.0,"sp":"","yt":"c_m1EO_vRWw","gen":["folk rock","rock and roll","classic rock","pop rock","heartland rock","Rock"],"hb":["paqueradejere","sdecandelario"],"da":"Released in 1994, Wildflowers is the second solo album by Rock Icon Tom Petty. .","dar":"Thomas Earl Petty (20 October 1950 - 2 October 2017) was an American musician, singer, composer and songwriter best known for fronting Tom Petty and the Heartbreakers. Apart from the band, he released three solo albums: \"Full Moon Fever\" (1989), \"Wildflowers\" (1994) and \"Highway Companion\" (2006). \n \nAfter working with his early bands The Sundowners, The Epics, and Mudcrutch (which also included future Heartbreakers members Mike Campbell and Benmont"},{"n":197,"year":1993,"ar":"Sarah McLachlan","ti":"Fumbling Towards Ecstasy","cv":"https://dn711309.ca.archive.org/0/items/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd-4534872028.jpg","rt":0.0,"sp":"","yt":"vf727y_HsOE","gen":["folk rock","alternative rock","pop rock","soft rock","dream pop","Rock"],"hb":[],"da":"Fumbling Towards Ecstasy is Sarah McLachlan's critically-acclaimed third studio album. It was produced by Pierre Marchand in Montreal, and released in 1993. The album was an immediate hit in Canada, where McLachlan was already an established star. Over the next two years, it became her breakthrough album internationally as well. However, in some countries, most notably the United States, the album was a steady seller that stayed in the middle ranges of the pop charts for almost two years, rather than the #1 smash that McLachlan would achieve with 1997's Surfacing. It is often considered by critics, though, her most .","dar":"Sarah McLachlan (born Sarah Ann McLachlan January 28, 1968 in Halifax, Nova Scotia, Canada) is a Grammy-winning musician, singer and songwriter. \n\nShe is known for the emotional sound of her ballads. Some of her most popular songs include \"Angel\", \"Building a Mystery\", \"Adia\", \"Possession\", \"Fallen\", \"I Will Remember You\", and \"World on Fire\". Her best-selling album to date is Surfacing, for which she won two Grammy Awards and four Juno Awards.\n\nHer first album Touch was released in September 28, 1988, recorded in 1987-1988, Vancouver, Canada."},{"n":45,"year":1992,"ar":"Red House Painters","ti":"Down Colorful Hill","cv":"https://dn721501.ca.archive.org/0/items/mbid-04ea0a76-af21-4da4-9a0f-6e1c5681aecc/mbid-04ea0a76-af21-4da4-9a0f-6e1c5681aecc-42391723213.jpg","rt":0.0,"sp":"","yt":"19I9V5NnbvA","gen":["folk rock","dream pop","slowcore","Rock","Alternative Rock"],"hb":["Nubis84","verygooood"],"da":"Not a proper debut as such, Down Colorful Hill instead comprises the demo recordings which won Red House Painters their contract with the 4AD label, released here with minimal overdubbing. Regardless, the group has already reached full maturity; these lengthy, ponderous songs are remarkably evocative portraits of a distinctly tortured psyche -- Mark Kozelek forgoes the camouflage of metaphor to lay his soul on the line, and the honesty of his craft is both beautiful and disturbing. .","dar":"Red House Painters was a slowcore band from San Francisco, CA, United States, formed in 1988 by singer/songwriter Mark Kozelek, who is currently active in the band Sun Kil Moon, with part of the original RHP line-up.\n\nThe band is described, along with Low and American Music Club, as one of the linchpins of the slowcore movement, a subgenre of Indie Rock characterized by downbeat melodies, slow tempos, and often minimalist arrangements. The genre was shaped by musical influences like Folk Rock"},{"n":64,"year":1990,"ar":"Paul Simon","ti":"The Rhythm of the Saints","cv":"https://dn710605.ca.archive.org/0/items/mbid-fa1d8308-47d4-33af-b377-ecb27483fb2d/mbid-fa1d8308-47d4-33af-b377-ecb27483fb2d-24020454806.jpg","rt":0.0,"sp":"","yt":"pIjjy1BxA4s","gen":["folk rock","folk","pop rock","Rock","Pop"],"hb":[],"da":"The Rhythm of the Saints is the eighth solo studio album by American singer-songwriter Paul Simon, released on October 16, 1990 on Warner Bros. Following the success of 1986's Graceland, on which he worked principally with South African musicians, Simon broadened his interests in diverse forms of music from around the world. He turned to Latin America for the musicians and rhythms which characterize much of this album, partnering with Afro-Brazilian superstars Grupo Cultural Olodum, masters of the heavily percussive sub-style of samba called Batuque or Batucada. The group's drumming is featured on the opening song and first single, \"The .","dar":"Paul Frederic Simon (born October 13, 1941) is an American singer-songwriter. One of the most celebrated artists of the twentieth century, Simon's career has spanned six decades. Born in New Jersey, Simon grew up in the borough of Queens in New York City and developed an interest in rock music in his teens.\n\nHe began performing with his schoolfriend Art Garfunkel in 1956; together the two came to prominence in the 1960s as Simon & Garfunkel. The duo's blend of folk and rock music in hits like \"The Sound of Silence\", \"Mrs."}];

  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
