<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

<script>
const A = [{"n":122,"year":2012,"ar":"Billy Woods","ti":"History Will Absolve Me","cv":"https://dn710709.ca.archive.org/0/items/mbid-d13a81a8-3982-44b0-861e-6792a29c590d/mbid-d13a81a8-3982-44b0-861e-6792a29c590d-40533296369.jpg","rt":0.0,"sp":"","yt":"Q4AwIlNVxyQ","gen":["hip hop","experimental hip hop","east coast hip hop","conscious hip hop","hardcore hip hop","abstract hip hop"],"hb":[],"da":"History Will Absolve Me is the classic 2012 full-length album from billy woods, the Zimbabwean-Jamaican-by-way-of-Brooklyn rapper, who delivers a fragmentation grenade of an album. An explosive riot of bitter invective, evocative lyricism, and daisycutter beats, \"History Will Absolve Me\" is a solid hour of hardboiled anti-nostalgia. The album features guest appearances by established stars like Roc Marciano, Vordul Mega (Cannibal Ox), MarQ Spekt, and Masai Bey, but also features up-and-coming talents Elucid and junclassic. Willie Green, A.M. Breakups, Marmaduke, Nasa (Def Jux/Uncommon Music), and Man Mantis handle the beats and provide a backdrop that matches the intensity of woods’ labyrinthine .","dar":"Born in Washington, DC, Billy Woods (stylized as billy woods) is a rapper based out of New York City. He has also lived in Zimbabwe, Jamaica, and Maryland. Billy Woods is a member of the Super Chron Flight Brothers with Priviledge, Armand Hammer with Elucid, and The Reavers supergroup.\n\nHis mother was an English literature professor from Jamaica. His father was a Ph.D. Marxist writer, active in the Zimbabwe War of Liberation and then a member of the government in Zimbabwe."},{"n":20,"year":2000,"ar":"Ghostface Killah","ti":"Supreme Clientele","cv":"https://dn710604.ca.archive.org/0/items/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90-955219996.jpg","rt":0.0,"sp":"","yt":"QZfdJx8Z1yw","gen":["hip hop","east coast hip hop","boom bap","hardcore hip hop","abstract hip hop"],"hb":[],"da":"Supreme Clientele is the second studio album of American rapper and Wu-Tang Clan member Ghostface Killah, released February 8, 2000 on Epic Records. The album showcases Ghostface's signature up-tempo, stream-of-consciousness rhyme style, and features guest appearances from Cappadonna, GZA, Masta Killa, Method Man, Raekwon, Redman, RZA, U-God, and others. If features members of what would become affiliates Theodore Unit and T.M.F. Supreme Clientele contains a large amount of production from group member RZA, who also re-worked and remixed beats from other producers involved, as a means to create a unified and cohesive sound for the album. Supreme Clientele debuted at .","dar":"Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele"},{"n":22,"year":1999,"ar":"Mos Def","ti":"Black on Both Sides","cv":"https://dn721508.ca.archive.org/0/items/mbid-c53be6c2-1a17-4a4a-97e3-d40f61630236/mbid-c53be6c2-1a17-4a4a-97e3-d40f61630236-22927827729.png","rt":0.0,"sp":"","yt":"7e1wFEJx7PM","gen":["hip hop","east coast hip hop","conscious hip hop","Hip-Hop"],"hb":[],"da":"Black on Both Sides is the debut solo album of American rapper Mos Def, released October 12, 1999 on Rawkus Records. Black on Both Sides features an emphasis on live instrumentation and socially-conscious lyrics. On February 2, 2000, the album was certified Gold in sales by the Recording Industry Association of America (RIAA), following sales in excess of 500,000 copies. Talib Kweli (one-half of Black Star with Mos Def) and Busta Rhymes are the only main rappers to be featured on the album. nd hip-hop heads alike."},{"n":122,"year":1997,"ar":"The Notorious B.I.G.","ti":"Life After Death","cv":"https://dn711202.ca.archive.org/0/items/mbid-03aa0355-70d2-4032-9985-f9a040978520/mbid-03aa0355-70d2-4032-9985-f9a040978520-3409750467.jpg","rt":0.0,"sp":"","yt":"rCyWFj0nLyk","gen":["hip hop","east coast hip hop","boom bap","gangsta rap","mafioso rap","coke rap"],"hb":[],"da":"Released as scheduled two weeks after his murder in Los Angeles, California, Life After Death, the ambitious diamond-certified double-disc sophomore album by The Notorious B.I.G., topped the Billboard 200 for 4 weeks and was Grammy-nominated for best rap album in 1997. Life After Death documents the extraordinary and ultimately tragic final chapter in the life of an ascending star. Recorded over 18 months between Los Angeles, New York, and Maraval, Trinidad, the sessions were interrupted by B.I.G.’s arrest for marijuana and gun possession, and a car accident that shattered his left leg, forcing him to stay seated for the majority .","dar":"Christopher George Latore Wallace (May 21, 1972 – March 9, 1997), known professionally as The Notorious B.I.G., Biggie Smalls, or Biggie, was an American rapper. He is widely considered to be one of the greatest hip-hop artists of all time.\n\nWallace was born and raised in the Brooklyn borough of New York City. His debut album Ready to Die (1994) made him a central figure in East Coast hip hop and increased New York City's visibility in the genre at a time when West Coast hip hop dominated the mainstream."},{"n":25,"year":1996,"ar":"Dr. Octagon","ti":"Dr. Octagonecologyst","cv":"https://dn711308.ca.archive.org/0/items/mbid-cddbf21f-9cd8-4665-a015-3cdc50cdcc72/mbid-cddbf21f-9cd8-4665-a015-3cdc50cdcc72-2925311149.jpg","rt":0.0,"sp":"","yt":"NebOetHhffU","gen":["hip hop","experimental hip hop","east coast hip hop","abstract hip hop","nerdcore","Hip-Hop"],"hb":["paqueradejere"],"da":"Dr. Octagonecologyst is the debut solo album of American rapper Keith Thor  New York City. Its production was mainly handled by Q-Tip, with contributions from Skeff Anselm, Large Professor and the group's DJ, Ali Shaheed Muhammad. .","dar":"A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998"},{"n":97,"year":1992,"ar":"Beastie Boys","ti":"Check Your Head","cv":"https://ia801803.us.archive.org/22/items/mbid-8df53a98-da10-4084-a5af-b9b3b64bcb33/mbid-8df53a98-da10-4084-a5af-b9b3b64bcb33-2433557710.jpg","rt":0.0,"sp":"","yt":"RSJmWKNsU2Q","gen":["alternative rock","punk rock","funk","hip hop","east coast hip hop","rap rock"],"hb":[],"da":"Check Your Head is the third album by the Beastie Boys, released on April 21, 1992. Three years elapsed between the release of Paul's Boutique (the band's second album) and their recording of this album. Check Your Head was recorded at the G-Son Studios in Atwater Village, California in 1991. The album features the popular hits \"So Whatcha Want\" and \"Pass the Mic\"; the music videos for both songs are available on the Criterion Collection Beastie Boys Video Anthology DVD set. The album was re-released in 2009 in a number of formats and featured 16 b-sides and rarities as well .","dar":"Beastie Boys were an American hip-hop trio from New York City, United States: Brooklyn and Manhattan. Originally formed as a four-piece hardcore punk band, The Young Aborigines, in 1978 by Michael Diamond (vocals), John Berry (guitar; died May 2016), Adam Yauch (bass) and Kate Schellenbach (drums), for the majority of its career the group consisted of Mike D (real name Michael Diamond),  Ad-Rock (Adam Horovitz) and, until his const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
