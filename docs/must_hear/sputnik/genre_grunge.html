<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

<script>
const A = [{"n":48,"year":1994,"ar":"Nirvana","ti":"In Utero","cv":"https://dn710700.ca.archive.org/0/items/mbid-7d13c434-1c49-4d7f-b164-a5247108af01/mbid-7d13c434-1c49-4d7f-b164-a5247108af01-19918667556.jpg","rt":0.0,"sp":"","yt":"GrLUUVfKeUw","gen":["alternative rock","noise rock","punk","post-hardcore","grunge","pigfuck"],"hb":[],"da":"In Utero is the third and final studio album by the American alternative rock band Nirvana, released on September 21, 1993 by DGC Records. Following the success of the group's 1991 breakthrough album Nevermind, Nirvana sought to avoid that album's polished production and hired recording engineer Steve Albini to produce the record. The band recorded In Utero with Albini in two weeks in February 1993, capturing an abrasive and naturalistic sound for the record. While some of the songs had been written years prior, the lyrics largely dealt with frontman Kurt Cobain's reflections on his newfound fame and recent personal .","dar":"There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s."},{"n":13,"year":1994,"ar":"Soundgarden","ti":"Superunknown","cv":"https://dn720709.ca.archive.org/0/items/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c-2236678397.jpg","rt":0.0,"sp":"","yt":"fELbXTDl5Ao","gen":["psychedelic rock","alternative rock","hard rock","stoner rock","grunge","alternative metal"],"hb":["Frikomid","Lonsonxd","sdecandelario"],"da":"Superunknown is the fourth album by the American grunge band Soundgarden. It was released on March 8, 1994 through A&M Records. The band began work on the album after touring in support of its previous album, Badmotorfinger. The resulting album captured the creativity and heaviness of the band's earlier releases while displaying a more diverse range of influences. The album was a critical and commercial success and became the band's breakout album. It peaked at number one on the Billboard 200 and reached high positions on charts worldwide. Five singles were released from the album: The Day I Tried to .","dar":"Soundgarden was an American rock band formed in Seattle, Washington, in 1984 by singer and drummer Chris Cornell, lead guitarist Kim Thayil, and bassist Hiro Yamamoto. Cornell switched to rhythm guitar in 1985, and the drum position was taken over first by Scott Sundquist and then by Matt Cameron in 1986. Yamamoto departed in 1989 and was replaced briefly by Jason Everman before Ben Shepherd joined later that year. Soundgarden disbanded in 1997 and reunited in 2010."},{"n":131,"year":1994,"ar":"Stone Temple Pilots","ti":"Purple","cv":"https://dn721909.ca.archive.org/0/items/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016-24373460607.jpg","rt":0.0,"sp":"","yt":"6EM6Uk1BICc","gen":["alternative rock","hard rock","acoustic rock","grunge","rock","Rock"],"hb":[],"da":"Purple is the second album released by the American rock band Stone Temple Pilots, on June 7, 1994, by Atlantic Records. It contains several of the band's biggest hit songs, including \"Vasoline,\" \"Interstate Love Song,\" and \"Big Empty,\" which was also featured on The Crow soundtrack. The album was a big success for STP, debuting at #1 (for three weeks, longer than any stay at the top by Nirvana, Alice In Chains, or Soundgarden) and being certified 6x platinum. In 2006, the album was ranked number 73 on Guitar World magazine's list of the greatest 100 guitar albums of all .","dar":"Stone Temple Pilots (also known by STP) is an American grunge band from San Diego, California, that originally consisted of Scott Weiland (lead vocals), brothers Dean (guitar) and Robert DeLeo (bass, backing vocals), and Eric Kretz (drums). The band's lineup remained unchanged from its formation in 1989 until the firing of Weiland in February 2013. Linkin Park vocalist Chester Bennington joined the band in May 2013 but left amicably in November 2015."},{"n":2,"year":1992,"ar":"Alice in Chains","ti":"Dirt","cv":"https://dn710800.ca.archive.org/0/items/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf-9835602113.jpg","rt":0.0,"sp":"","yt":"19CXYQhqVu0","gen":["alternative rock","hard rock","heavy metal","doom metal","metal","grunge"],"hb":["Lonsonxd","sdecandelario","verygooood"],"da":"Dirt is the second studio album by the American rock band Alice in Chains and was released on September 29, 1992 through Columbia Records. Peaking at number six on the Billboard 200, the album was well received by music critics and has since been certified four-times platinum by the RIAA. It is nowadays considered as one of the best grunge/heavy metal albums and is usually on many \"Must have\" lists. The album spawned five singles: \"Would?\", \"Them Bones\", \"Angry Chair\", \"Rooster\", and \"Down in a Hole\". The songs on the album focused on depression, drug use, war, death, and other .","dar":"Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style"},{"n":143,"year":1992,"ar":"PJ Harvey","ti":"Dry","cv":"https://dn711009.ca.archive.org/0/items/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703-16145595354.jpg","rt":0.0,"sp":"","yt":"lABPOmNiUqY","gen":["alternative rock","indie rock","grunge","Rock","Alternative Rock"],"hb":["GabredMared","paqueradejere","sdecandelario"],"da":"Dry is the debut studio album by the band PJ Harvey, fronted by English singer-songwriter and musician PJ Harvey, released on Too Pure Records on 30 March 1992. The album was recorded at The Icehouse, a local studio in Yeovil, United Kingdom. The first 5000 LPs and first 1000 CDs included demo versions of the album's tracks, being subsequently released in the United States on Indigo Records in the US. Both versions were released in 1992. Speaking to Filter magazine in 2004, Harvey said of her debut album: \"\"Dry\" is the first chance I ever had to make a record .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":194,"year":1992,"ar":"L7","ti":"Bricks Are Heavy","cv":"https://dn710700.ca.archive.org/0/items/mbid-b9c52cf2-9f23-4986-8ce2-5e0015cdef27/mbid-b9c52cf2-9f23-4986-8ce2-5e0015cdef27-8559192703.jpg","rt":0.0,"sp":"","yt":"fWvV3ycGdtQ","gen":["punk","grunge","alternative metal","Metal","Punk","Alternative Rock"],"hb":[],"da":"Bricks Are Heavy is the third album by the Los Angeles band L7, released in April 1992 through Slash Records. Backed by the single \"Pretend We're Dead\", the album became a breakthrough hit and the band became the \"poster girls\" of grunge music. The album was released shortly after grunge had broken into the mainstream with the surprise success of Nirvana's Nevermind. In July 1992, the song \"Pretend We're Dead\" gained popularity among American rock radio stations, where it received regular airplay. By late August, the album had reached #1 on Billboard's Heatseekers album chart, and two weeks later it .","dar":"L7 are an American punk rock band founded in Los Angeles, California, first active from 1985 to 2001 and re-formed in 2014. Their longest standing lineup consists of Suzi Gardner, Donita Sparks, Jennifer Finch, and Dee Plakas. \n\nBursting onto the Los Angeles punk scene in 1985, L7 were a fierce all-female force of rock rebellion that shook up the music world and shattered stereotypes. Founded by Suzi Gardner and Donita Sparks, and later joined by Jennifer Finch on bass and Demetra \"Dee\"  Plakas on drums"},{"n":9,"year":1991,"ar":"Pearl Jam","ti":"Ten","cv":"https://dn721905.ca.archive.org/0/items/mbid-4816047b-5a40-462a-81e7-2f6eb6687fda/mbid-4816047b-5a40-462a-81e7-2f6eb6687fda-26843414237.jpg","rt":0.0,"sp":"","yt":"JqYIwJDsinM","gen":["alternative rock","hard rock","grunge","Rock","Alternative Rock"],"hb":[],"da":"\"Ten\" is the debut album by the Pearl Jam, released on August 27, 1991 through Epic Records. Following the disbanding of bassist Jeff Ament and guitarist Stone Gossard's previous group Mother Love Bone, the two recruited vocalist Eddie Vedder, guitarist Mike McCready, and drummer Dave Krusen to form Pearl Jam in 1990. Most of the songs began as instrumental jams, to which Vedder added lyrics about topics such as depression, homelessness, and abuse. \"Ten\" was not an immediate success, but by late 1992 it had reached number two on the Billboard 200 chart. The album produced three hit singles: \"Alive\", .","dar":"Pearl Jam is an American grunge/alternative rock band formed in Seattle, Washington, in 1990. The band's lineup consists of founding members Jeff Ament (bass guitar), Stone Gossard (rhythm guitar), Mike McCready (lead guitar), and Eddie Vedder (lead vocals, guitar), as well as Matt Cameron (drums), who joined in 1998. Keyboardist Boom Gaspar has also been a touring/session member with the band since 2002. Drummers Jack Irons, Dave Krusen, Matt Chamberlain, and Dave Abbruzzese are former members of the band."},{"n":64,"year":1991,"ar":"Nirvana","ti":"Nevermind","cv":"https://dn721803.ca.archive.org/0/items/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b-30501372565.jpg","rt":0.0,"sp":"","yt":"V0hDhjO3AwM","gen":["alternative rock","punk rock","grunge","rock","censored album cover","Rock"],"hb":["BipolarMuzik","Lonsonxd","alberto_gu","verygooood"],"da":"Nevermind is the second studio album by the American grunge band Nirvana, released on September 24, 1991. Produced by Butch Vig, Nevermind was the group's first release on Geffen Records, which signaled its move away from Seattle-based independent record label Sub Pop. Front man Kurt Cobain sought to make music outside of the restrictive confines of the Seattle grunge scene, drawing influence from groups such as the Pixies and its use of loud/quiet song dynamics. Nevermind was a surprise success by late 1991, largely due to the success of its lead single \"Smells Like Teen Spirit\". By January 1992 it .","dar":"There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s."},{"n":165,"year":1991,"ar":"Mudhoney","ti":"Every Good Boy Deserves Fudge","cv":"https://dn710804.ca.archive.org/0/items/mbid-ec6d4409-a112-3f1f-a880-6d1c9d56746c/mbid-ec6d4409-a112-3f1f-a880-6d1c9d56746c-9637263179.jpg","rt":0.0,"sp":"","yt":"1tbJZoRiOWc","gen":["psychedelic rock","garage rock","grunge","pigfuck","garage punk","Punk"],"hb":[],"da":"Every Good Boy Deserves Fudge is the second studio album by the grunge band Mudhoney. It was recorded in 1991, at a time when the band was thinking of signing to a major record label, but decided to release the album on Sub Pop. Guitarist Steve Turner has said that the album is his \"favorite Mudhoney album as a whole\" and many critics agree that the band reached a peak on Every Good Boy Deserves Fudge. The album is named after a mnemonic used by music students to recall the notes (EGBDF) on the lines of the treble clef. Along .","dar":"Mudhoney is an American Grunge band formed in Seattle, Washington in 1988, following the demise of Green River. Mudhoney's members are singer and rhythm guitarist Mark Arm, lead guitarist Steve Turner, bassist Guy Maddison and drummer Dan Peters. Original bassist Matt Lukin left the band in 1999.\n\nMudhoney's early releases on the Sub Pop label, particularly their debut single \"Touch Me I'm Sick\" and the Superfuzz Bigmuff EP, were massively influential on the Seattle music scene."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
