<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

cking vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":51,"year":2010,"ar":"Deerhunter","ti":"Halcyon Digest","cv":"https://dn711300.ca.archive.org/0/items/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c-2094844395.jpg","rt":0.0,"sp":"","yt":"Lx57to-9mGw","gen":["alternative rock","indie rock","dream pop","rock"],"hb":[],"da":"Halcyon Digest is the fourth studio album by American indie rock band Deerhunter. It was released September 28, 2010 to very enthusiastic reviews. It was the band's first album distributed exclusively by 4AD worldwide (previously 4AD only handled overseas distribution while Kranky Records handled it within the U.S) The album was self-produced with assistance from Ben Allen and was recorded at Chase Park Transduction studios in Athens, Georgia. The final track, \"He Would Have Laughed\" was recorded separately by Bradford Cox at Notown Sound in Marietta, GA and is a tribute to the late Jay Reatard. Writing on his Facebook .","dar":"Deerhunter is an American indie rock band formed in 2001 in Atlanta, Georgia, United States. The band consists of Bradford Cox (vocals, guitar, piano), Moses Archuleta (drums, synths), Lockett Pundt (guitar, organ, vocals), and Josh McKay (bass, vocals).\n\nThe group began with the ambition of fusing the lulling hypnotic states induced by ambient and minimalist music with the klang and propulsion of garage rock. The band has weathered chaotic line-up changes and the death of a member."},{"n":189,"year":2010,"ar":"Beach House","ti":"Teen Dream","cv":"https://dn710701.ca.archive.org/0/items/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8-41237078188.png","rt":0.0,"sp":"","yt":"_4mLcQl-45Q","gen":["indie rock","dream pop","indie pop","rock"],"hb":[],"da":"Teen Dream is the third studio album by American dream pop duo Beach House. It was released on January 27, 2010 as the band's debut album on the record label Sub Pop. Internationally, the album was released by Bella Union in Europe, Mistletone Records in Australia, and Arts & Crafts in Mexico. The album was produced by the band and Chris Coady. The album received universal acclaim from music critics, who hailed it as one of the best albums of 2010. NME included it in their 2013 edition of the 500 Greatest Albums of All Time. The album was also .","dar":"Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":3,"year":2007,"ar":"Radiohead","ti":"In Rainbows","cv":"https://dn710801.ca.archive.org/0/items/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30-6689244510.jpg","rt":0.0,"sp":"","yt":"Al1o33CRXsU","gen":["alternative rock","art rock","krautrock","art pop","indie rock","dream pop"],"hb":[],"da":"In Rainbows is the seventh studio album by the English alternative rock band Radiohead. It was first released on October 10, 2007 as a digital download that customers could order for whatever price they saw fit, followed by a standard CD release in most countries during the last week of 2007. The album was released in North America on January 1, 2008. In Rainbows was Radiohead's first release after the end of their contract with EMI and the end of the longest gap between studio albums in their career. \"In Rainbows\" was recorded in London, Somerset, Wiltshire, and Oxfordshire with .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":57,"year":2002,"ar":"The Flaming Lips","ti":"Yoshimi Battles the Pink Robots","cv":"https://dn710707.ca.archive.org/0/items/mbid-5ee8b734-e29a-36d9-9913-3319e21b5444/mbid-5ee8b734-e29a-36d9-9913-3319e21b5444-2572175401.jpg","rt":0.0,"sp":"","yt":"eITvHa3YB2E","gen":["experimental rock","alternative rock","psychedelic pop","neo-psychedelia","dream pop","space rock revival"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","sdecandelario","verygooood"],"da":"Yoshimi Battles the Pink Robots is the tenth studio album by The Flaming Lips, released by Warner Bros. Records on July 16, 2002, in the United Kingdom and the following day in the United States. It is characterized by electronic-influenced, psychedelic-tinged indie rock compositions. It has been certified Gold by the RIAA. Yoshimi was well-received critically and commercially, helping the band break into the mainstream. The album was adapted into a musical in 2012. It was announced in March 2007 that the album is to be made into a Broadway musical by The West Wing creator Aaron Sorkin and director .","dar":"The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals)."},{"n":141,"year":1996,"ar":"Bardo Pond","ti":"Amanita","cv":"https://dn710304.ca.archive.org/0/items/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3-12048716483.jpg","rt":0.0,"sp":"","yt":"YawEsEiIbqA","gen":["psychedelic rock","space rock","indie rock","shoegaze","dream pop","post-rock"],"hb":[],"da":null,"dar":"Bardo Pond are an American psychedelic rock band formed in Philadelphia, PA, United States in 1991. They are currently signed to London based label Fire Records. The current members are Michael Gibbons (guitar), John Gibbons (guitar), Isobel Sollenberger (flute and vocals), Clint Takeda (bass guitar), Jason Kourkonis (drums), and Aaron Igler (synth/electronics). Bardo Pond's drug-inspired music is often classified as space rock, acid rock, post-rock, shoegaze or noise rock."},{"n":5,"year":1993,"ar":"Slowdive","ti":"Souvlaki","cv":"https://dn710300.ca.archive.org/0/items/mbid-12694708-e437-4874-a5d4-c1ca0ec46313/mbid-12694708-e437-4874-a5d4-c1ca0ec46313-16656091378.jpg","rt":0.0,"sp":"","yt":"U6WnPceijEA","gen":["alternative rock","psychedelic","shoegaze","dream pop","rock","Pop"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Souvlaki is the second studio album by English shoegaze band Slowdive, released on June 1, 1993, via Creation Records. The album's title was taken from a skit by comedy duo The Jerky Boys, where one of the duo prank calls a hotel manager asking him to perform sexual acts on his wife. Upon learning the manager is Greek, the caller says: \"My wife loves that Greek shit... She'll suck your cock like souvlaki\". While touring Europe in early 1992, Slowdive began working on their next record, Souvlaki, writing and recording in mutiple sessions, a reported total of 40 songs were .","dar":"Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon replaced Scott from 1994-1995."},{"n":155,"year":1993,"ar":"Mazzy Star","ti":"So Tonight That I Might See","cv":"https://ia803100.us.archive.org/29/items/mbid-f3686430-4792-4e0f-b105-45f68c459c64/mbid-f3686430-4792-4e0f-b105-45f68c459c64-37044044892.jpg","rt":0.0,"sp":"","yt":"gYbBL_3XLEM","gen":["psychedelic rock","alternative rock","psychedelic folk","shoegaze","dream pop","slowcore"],"hb":["Frikomid","paqueradejere","sdecandelario","verygooood"],"da":"So Tonight That I Might See is the second studio album by American alternative rock band Mazzy Star, released on October 5, 1993. The album's first track, \"Fade into You\", became the band's first and only single to make the Billboard Hot 100 chart, peaking at number 44 and charting at number 48 on the UK Singles Chart. In a highly positive review, Steve Hochman of the Los Angeles Times called So Tonight That I Might See \"far more narcotic and hypnotic than anything the whole techno-trance universe has digitally blipped up to date.\" NME described it as an \"even .","dar":"Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band"},{"n":180,"year":1993,"ar":"Mercury Rev","ti":"Boces","cv":"https://dn710702.ca.archive.org/0/items/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e-16199489502.jpg","rt":0.0,"sp":"","yt":"dqcVhV8pCyA","gen":["alternative rock","blues","indie rock","dream pop","rock","Rock"],"hb":[],"da":null,"dar":"Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound"},{"n":197,"year":1993,"ar":"Sarah McLachlan","ti":"Fumbling Towards Ecstasy","cv":"https://dn711309.ca.archive.org/0/items/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd-4534872028.jpg","rt":0.0,"sp":"","yt":"vf727y_HsOE","gen":["folk rock","alternative rock","pop rock","soft rock","dream pop","Rock"],"hb":[],"da":"Fumbling Towards Ecstasy is Sarah McLachlan's critically-acclaimed third studio album. It was produced by Pierre Marchand in Montreal, and released in 1993. The album was an immediate hit in Canada, where McLachlan was already an established star. Over the next two years, it became her breakthrough album internationally as well. However, in some countries, most notably the United States, the album was a steady seller that stayed in the middle ranges of the pop charts for almost two years, rather than the #1 smash that McLachlan would achieve with 1997's Surfacing. It is often considered by critics, though, her most .","dar":"Sarah McLachlan (born Sarah Ann McLachlan January 28, 1968 in Halifax, Nova Scotia, Canada) is a Grammy-winning musician, singer and songwriter. \n\nShe is known for the emotional sound of her ballads. Some of her most popular songs include \"Angel\", \"Building a Mystery\", \"Adia\", \"Possession\", \"Fallen\", \"I Will Remember You\", and \"World on Fire\". Her best-selling album to date is Surfacing, for which she won two Grammy Awards and four Juno Awards.\n\nHer first album Touch was released in September 28, 1988, recorded in 1987-1988, Vancouver, Canada."},{"n":45,"year":1992,"ar":"Red House Painters","ti":"Down Colorful Hill","cv":"https://dn721501.ca.archive.org/0/items/mbid-04ea0a76-af21-4da4-9a0f-6e1c5681aecc/mbid-04ea0a76-af21-4da4-9a0f-6e1c5681aecc-42391723213.jpg","rt":0.0,"sp":"","yt":"19I9V5NnbvA","gen":["folk rock","dream pop","slowcore","Rock","Alternative Rock"],"hb":["Nubis84","verygooood"],"da":"Not a proper debut as such, Down Colorful Hill instead comprises the demo recordings which won Red House Painters their contract with the 4AD label, released here with minimal overdubbing. Regardless, the group has already reached full maturity; these lengthy, ponderous songs are remarkably evocative portraits of a distinctly tortured psyche -- Mark Kozelek forgoes the camouflage of metaphor to lay his soul on the line, and the honesty of his craft is both beautiful and disturbing. .","dar":"Red House Painters was a slowcore band from San Francisco, CA, United States, formed in 1988 by singer/songwriter Mark Kozelek, who is currently active in the band Sun Kil Moon, with part of the original RHP line-up.\n\nThe band is described, along with Low and American Music Club, as one of the linchpins of the slowcore movement, a subgenre of Indie Rock characterized by downbeat melodies, slow tempos, and often minimalist arrangements. The genre was shaped by musical influences like Folk Rock"},{"n":90,"year":1992,"ar":"Spiritualized","ti":"Lazer Guided Melodies","cv":"https://dn710709.ca.archive.org/0/items/mbid-a9c40936-e6e9-4d1e-8e57-a213e2a47d78/mbid-a9c40936-e6e9-4d1e-8e57-a213e2a47d78-23521509945.png","rt":0.0,"sp":"","yt":"gkPPxLm50V0","gen":["space rock","dream pop","Rock","Pop","Alternative Rock"],"hb":[],"da":".","dar":"Spiritualized are an English rock band formed in 1990 in Rugby, Warwickshire, United Kingdom by Jason Pierce, who often goes by the alias J. Spaceman, after the spectacular demise of the Spacemen 3 outfit. The membership of Spiritualized changes from album to album, with Pierce being the only constant factor.\n\nThe first Spiritualized release was a space rock-esque cover of Any Way That You Want Me in 1990, a record which heralded the official split of Spacemen 3 following contractual wrangles over the band's name."},{"n":102,"year":1992,"ar":"Ride","ti":"Going Blank Again","cv":"https://cdn2.albumoftheyear.org/600x0/album/7747-going-blank-again_222544.jpg","rt":0.0,"sp":"","yt":"01WWxRLRYhw","gen":["alternative rock","neo-psychedelia","shoegaze","dream pop","Rock","Pop"],"hb":["Frikomid","sdecandelario","verygooood"],"da":"Going Blank Again is the second studio album by British rock band Ride, released on 9 March 1992 on Creation Records. It was produced by Alan Moulder, and peaked at No. 5 in the UK Albums Chart. In October 2009 the album was certified gold by the British Phonographic Industry for sales of over 100,000 units. Following Ride's 1990 debut album Nowhere, Ride released Going Blank Again as their second full-length record, accompanied by the singles \"Leave Them All Behind\" (10 February 1992) and \"Twisterella\" (13 April 1992), the latter named in reference to a song in the 1963 kitchen .","dar":"Ride is a shoegaze band that formed in 1988 in Oxford, England, consisting of Andy Bell, Mark Gardener, Laurence Colbert, and Steve Queralt. The band were initially part of the shoegaze scene that emerged in England during the early 1990s. Their debut album Nowhere (1990) has been named one of the greatest albums of the genre. Ride has released five albums: \"Nowhere\" (1990), \"Going Blank Again\" (1992), \"Carnival of Light\" (1994), \"Tarantula\" (1996), and \"Weather Diaries\" (2017)."},{"n":2,"year":1991,"ar":"My Bloody Valentine","ti":"Loveless","cv":"https://dn710703.ca.archive.org/0/items/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06-25797196285.jpg","rt":0.0,"sp":"","yt":"4nzZeUUiG2c","gen":["alternative rock","noise rock","psychedelic","noise pop","shoegaze","dream pop"],"hb":["verygooood"],"da":"loveless is the second studio album by Irish shoegaze band my bloody valentine, released on 4 November 1991 by Creation Records. The album was recorded over a two-year period between 1989 and 1991. Vocalist and guitarist Kevin Shields dominated the arduous recording process; intent on achieving a particular sound, he experimented with guitar tremolo techniques and tuning systems, unorthodox production methods, obscured vocals, and sampled percussion and feedback. The group cycled through nineteen studios and a larger number of engineers during the album's two-year creation, with total recording costs rumoured to have reached £250,000. While loveless did not achieve great .","dar":"my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s."},{"n":10,"year":1990,"ar":"Cocteau Twins","ti":"Heaven or Las Vegas","cv":"https://dn710700.ca.archive.org/0/items/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e-7946180530.jpg","rt":0.0,"sp":"","yt":"PbbUeLkZt74","gen":["alternative rock","shoegaze","dream pop","ethereal wave","ambient pop","Punk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","sdecandelario","verygooood"],"da":"Heaven or Las Vegas is the sixth album by Scottish band Cocteau Twins, their last for the music label 4AD. In terms of chart positions, it was the most successful Cocteau Twins album, reaching No. 7 in the UK. Despite 4AD president Ivo Watts-Russell proclaiming it one of the best-ever releases on his label, he released the group from their contract at the end of 1990 because his relationship with the band had soured. The album is noteworthy for the musical evolution that the band displayed at the time. The lyrics of vocalist Elizabeth Fraser were more intelligible; many concerned .","dar":"Cocteau Twins was a Scottish rock band active from 1979 to 1997. The group was formed in Grangemouth, Scotland, by Robin Guthrie (guitar, drum machine) and Will Heggie (bass), with Elizabeth Fraser (vocals) joining in 1981. In 1983, Heggie was replaced by multi-instrumentalist Simon Raymonde, completing the lineup most associated with the band’s career. Cocteau Twins became known for their ethereal, heavily layered sound and Fraser’s distinctive soprano vocal style, often featuring lyrics that avoid conventional language."},{"n":162,"year":1990,"ar":"Mazzy Star","ti":"She Hangs Brightly","cv":"https://dn710905.ca.archive.org/0/items/mbid-d277c19d-71e9-4d70-892b-7a9fb1ff0b78/mbid-d277c19d-71e9-4d70-892b-7a9fb1ff0b78-17361517341.jpg","rt":0.0,"sp":"","yt":"5swItt732EM","gen":["alternative rock","dream pop","alternative country","Rock","Pop"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","sdecandelario","verygooood"],"da":"She Hangs Brightly is the debut studio album by American alternative rock band Mazzy Star. It was released on May 21, 1990, by Rough Trade Records and re-released by Capitol Records later in the year. \"Blue Flower\" was released as a single and reached number 29 on the Billboard Alternative Songs chart. Four years later, \"Halah\" reached number 19 on the same chart after the success of \"Fade Into You\". The album cover is a shot of the interior of Hôtel Tassel in Brussels. .","dar":"Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band"},{"n":169,"year":1990,"ar":"Pale Saints","ti":"The Comforts of Madness","cv":"https://dn710902.ca.archive.org/0/items/mbid-2de02df3-e26d-37dd-812e-133469478e2d/mbid-2de02df3-e26d-37dd-812e-133469478e2d-13921439233.jpg","rt":0.0,"sp":"","yt":"V6_eO6rOQA8","gen":["psychedelic","shoegaze","dream pop","Pop","Alternative Rock"],"hb":[],"da":"The Comforts of Madness is the debut studio album by English alternative rock band Pale Saints. It was released on 12 February 1990 by 4AD. The Comforts of Madness peaked at number 40 on the UK Albums Chart. On 17 January 2020, 4AD released a remastered and expanded reissue of the album for its 30th anniversary. Reviewing The Comforts of Madness for NME, Simon Williams praised the album as an \"unnervingly multi-dimensional collage of melody and friction\" with \"at least eight Great Pop Tunes, all hooklines and absolutely no stinkers.\" The magazine later named it the 45th best album of .","dar":"Pale Saints was a British shoegaze band formed by Ian Masters (bass/vocals), Graeme Naysmith (guitar), and Chris Cooper (drums). They began as a three-piece   band based in Leeds, England, in 1987. The band was signed to 4AD records by 4AD chief Ivo after their first London show. They were amongst a number of groups in the nineties who were dubbed as shoegaze by the NME and Melody Maker. \n\nEarly band interviews showed them to be a fun-loving bunch in contrast to their dark, lyrically pessimistic pop music."}];

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
