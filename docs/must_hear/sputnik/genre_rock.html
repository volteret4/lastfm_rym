<script>
const A = [{"n":173,"year":2019,"ar":"Lana Del Rey","ti":"Norman Fucking Rockwell!","cv":"https://dn710306.ca.archive.org/0/items/mbid-e759b293-5a6f-48cc-808f-38f0b977e00c/mbid-e759b293-5a6f-48cc-808f-38f0b977e00c-23717138029.jpg","rt":0.0,"sp":"","yt":"bnl4hHNvOv0","gen":["rock","pop","Pop","Alternative Rock"],"hb":["Frikomid","GabredMared","Rocky_stereo","alberto_gu","sdecandelario"],"da":"Norman Fucking Rockwell! is the sixth studio album by Lana Del Rey, released on August 30, 2019, via Interscope and Polydor Records. It features a soft rock sound with psych-rock songs and piano ballads, and includes references to various classic rock artists. The title is a nod to painter and illustrator Norman Rockwell. To promote the album, five singles were released: \"Mariners Apartment Complex\", \"Venice Bitch\", \"hope is a dangerous thing for a woman like me to have - but i have it\", \"Doin' Time\" and \"The greatest\". Del Rey supported the album with her fifth concert tour, The Norman .","dar":"Elizabeth Woolridge Grant (born June 21, 1985), known professionally as Lana Del Rey, is an American singer-songwriter. Her music often explores themes of romance and nostalgia, with references to popular culture and mid-20th century Americana. She has received multiple awards, including an MTV Video Music Award, three MTV Europe Music Awards, two Brit Awards, two Billboard Women in Music awards, and a Satellite Award, along with nominations for eleven Grammy Awards and a Golden Globe Award."},{"n":8,"year":2018,"ar":"Rolo Tomassi","ti":"Time Will Die And Love Will Bury It","cv":"https://dn710706.ca.archive.org/0/items/mbid-d137d1b7-bbb2-43a1-aa95-9ada8c48f170/mbid-d137d1b7-bbb2-43a1-aa95-9ada8c48f170-18242474276.jpg","rt":0.0,"sp":"","yt":"2IES-R0zZno","gen":["post-hardcore","mathcore","rock","Metal","Punk"],"hb":[],"da":null,"dar":"Rolo Tomassi is a British experimental mathcore band from Stocksbridge, Sheffield.\n\nFormed in 2005, they set their local scene alight by playing a synth-driven technical mix of styles and genres difficult to define in a single word. The band's name was taken from the movie L.A. Confidential. They are known for their strong DIY ethic and chaotic live performances. \n\nThe band is currently signed to MNRK Heavy. They released two albums on Hassle Records: Hysterics (2008) and the Diplo-produced Cosmology (2010)."},{"n":10,"year":2018,"ar":"Daughters","ti":"You Won't Get What You Want","cv":"https://dn710700.ca.archive.org/0/items/mbid-1390ceef-1a9f-4540-b701-170318a7b868/mbid-1390ceef-1a9f-4540-b701-170318a7b868-20740540258.jpg","rt":0.0,"sp":"","yt":"uH9yNhNytOE","gen":["noise rock","industrial","post-hardcore","post-industrial","rock","Rock"],"hb":[],"da":"You Won't Get What You Want is the fourth studio album by American rock band Daughters. It was released on October 26, 2018, through Ipecac Recordings. It is the band's first album since they broke up in late 2009. The album was released to universal critical acclaim, with many critics naming it one of the best albums of 2018. It marks a significant departure from the band's earlier style, moving away from mathcore towards a more industrial and noise rock influenced sound. The album was met with widespread critical acclaim. At Metacritic, which assigns a normalized rating out of 100 .","dar":"Daughters was an American Mathgrind  (early) / noise rock  (recent) band formed in 2002, in Providence, Rhode Island after the break-up of As the Sun Sets. The band's current line-up consists of vocalist Alexis S.F. Marshall, guitarist Nicholas Andrew Sadler, drummer Jon Syverson, and bassist Samuel Moorehouse Walker. \n\nDaughters' early material was primarily described as grindcore while their later material has been described as noise rock. Sadler"},{"n":4,"year":2016,"ar":"Vektor","ti":"Terminal Redux","cv":"https://dn711000.ca.archive.org/0/items/mbid-655c7505-eef3-462c-b39e-13d8a9b619df/mbid-655c7505-eef3-462c-b39e-13d8a9b619df-44538383065.jpg","rt":0.0,"sp":"","yt":"qMCsv-zj56s","gen":["metal","progressive metal","technical thrash metal","thrash metal","rock","Metal"],"hb":[],"da":"Terminal Redux is the third album by the American progressive thrash metal band Vektor, released on May 6, 2016. It is the band's first album released on Earache Records. .","dar":"Vektor is a progressive thrash metal band, originally formed in Arizona in 2004 but relocated to Philadelphia in mid-2012 and currently based there. They released their debut full length \"Black Future\" in November 2009, and the follow up \"Outer Isolation\" in December 2011 (both on Heavy Artillery Records, now defunct). These albums were re-released when the band joined Earache Records, and the band continued sporadically performing and touring in 2012 and 2013 with the likes of Napalm Death"},{"n":197,"year":2015,"ar":"Mid-Air Thief","ti":"Gongjoong Doduk","cv":"https://i.discogs.com/pj0c8Sk1uwIy4QdN9AFW7OCcw-HKVX7Is-4S_CyB7eI/rs:fit/g:sm/q:90/h:580/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTIyNTg2/MjczLTE3NTUxMzM0/ODYtMTQxOC5qcGVn.jpeg","rt":0.0,"sp":"","yt":"tzTkB46kPjo","gen":["rock","pop","Rock","Pop"],"hb":[],"da":null,"dar":"Mid-Air Thief (Korean: 공중도둑) is one of the projects of an enigmatic folktronica musician based in South Korea. Despite having some success, he has no social media presence and has never performed live.\n\nMr Thief started started his musical career in 2012 using the stage name Hyoo (Korean: 휴). In 2015, he changed his stage name to Public Morality (Korean: 공중도덕) and released his self-titled debut album, which was nominated for Best Modern Rock Album at the 2016 Korean Music Awards."},{"n":51,"year":2010,"ar":"Deerhunter","ti":"Halcyon Digest","cv":"https://dn711300.ca.archive.org/0/items/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c-2094844395.jpg","rt":0.0,"sp":"","yt":"Lx57to-9mGw","gen":["alternative rock","indie rock","dream pop","rock"],"hb":[],"da":"Halcyon Digest is the fourth studio album by American indie rock band Deerhunter. It was released September 28, 2010 to very enthusiastic reviews. It was the band's first album distributed exclusively by 4AD worldwide (previously 4AD only handled overseas distribution while Kranky Records handled it within the U.S) The album was self-produced with assistance from Ben Allen and was recorded at Chase Park Transduction studios in Athens, Georgia. The final track, \"He Would Have Laughed\" was recorded separately by Bradford Cox at Notown Sound in Marietta, GA and is a tribute to the late Jay Reatard. Writing on his Facebook .","dar":"Deerhunter is an American indie rock band formed in 2001 in Atlanta, Georgia, United States. The band consists of Bradford Cox (vocals, guitar, piano), Moses Archuleta (drums, synths), Lockett Pundt (guitar, organ, vocals), and Josh McKay (bass, vocals).\n\nThe group began with the ambition of fusing the lulling hypnotic states induced by ambient and minimalist music with the klang and propulsion of garage rock. The band has weathered chaotic line-up changes and the death of a member."},{"n":189,"year":2010,"ar":"Beach House","ti":"Teen Dream","cv":"https://dn710701.ca.archive.org/0/items/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8-41237078188.png","rt":0.0,"sp":"","yt":"_4mLcQl-45Q","gen":["indie rock","dream pop","indie pop","rock"],"hb":[],"da":"Teen Dream is the third studio album by American dream pop duo Beach House. It was released on January 27, 2010 as the band's debut album on the record label Sub Pop. Internationally, the album was released by Bella Union in Europe, Mistletone Records in Australia, and Arts & Crafts in Mexico. The album was produced by the band and Chris Coady. The album received universal acclaim from music critics, who hailed it as one of the best albums of 2010. NME included it in their 2013 edition of the 500 Greatest Albums of All Time. The album was also .","dar":"Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":7,"year":2006,"ar":"Cult of Luna","ti":"Somewhere Along the Highway","cv":"https://dn721200.ca.archive.org/0/items/mbid-1fde8540-59cf-4c8d-8429-eb076d03fb05/mbid-1fde8540-59cf-4c8d-8429-eb076d03fb05-21557052063.png","rt":0.0,"sp":"","yt":"5eqnHb1XEHM","gen":["atmospheric sludge metal","post-metal","sludge metal","rock","Metal"],"hb":[],"da":null,"dar":"Cult of Luna is an atmospheric sludge/doom metal/post-metal/post-hardcore band formed in 1998 in Umeå, Sweden by guitarist/vocalist Johannes Persson and vocalist Klas Rydberg, after the Swedish hardcore band Eclipse broke up. It began as a traditional sludge band and has slowly integrated greater degrees of post-rock into its sound.  After some member hunting and rehearsals CoL had its first line-up consisting of: Klas Rydberg, Johannes Persson, Magnus Lindberg, Erik Olofsson and Fredrik Renstrom."},{"n":157,"year":2006,"ar":"Liars","ti":"Drum's Not Dead","cv":"https://dn710703.ca.archive.org/0/items/mbid-207d66ce-3699-30b2-99c0-4fa60daaf01c/mbid-207d66ce-3699-30b2-99c0-4fa60daaf01c-11044411925.jpg","rt":0.0,"sp":"","yt":"sQWvgOHlMew","gen":["experimental rock","rock","electronic","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Liars is an experimental electro/rock band formed in 2000. Australian-born Angus Andrew is the founding and only constant member, with Aaron Hemphill (percussion, guitar, synth) leaving the project in 2017 and Julian Gross (drums) being no longer able to perform due to personal reasons. The band has released 8 studio albums since forming and remains one of the few bands still consistently active from the post-punk revival scene in New York of 2000s."},{"n":27,"year":2004,"ar":"Mastodon","ti":"Leviathan","cv":"https://dn710904.ca.archive.org/0/items/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0-25054292616.png","rt":0.0,"sp":"","yt":"4Kp0LxKTZhk","gen":["heavy metal","doom metal","progressive metal","sludge metal","rock","Metal"],"hb":[],"da":"Leviathan is the sophomore full-length studio album by American metal band Mastodon. It was released on August 31, 2004 via Relapse Records. Leviathan was conceived as a concept album based on Herman Melville's 1851 novel Moby-Dick; or, the Whale, with the tracks \"Iron Tusk\", \"Blood and Thunder\" and \"Seabeast\" released as singles. Magazines Revolver, Kerrang! and Terrorizer awarded the record with \"Album of the Year\" in 2004. Leviathan was also released with an audio DVD in a limited edition set with a black and gold slipcase. The album brought Mastodon great critical acclaim and, thanks to the ensuing tour, a .","dar":"Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound."},{"n":12,"year":2002,"ar":"Interpol","ti":"Turn on the Bright Lights","cv":"https://dn711202.ca.archive.org/0/items/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30-2981501643.jpg","rt":0.0,"sp":"","yt":"3QiQZj6cfDM","gen":["alternative rock","post-punk","indie rock","post-punk revival","rock","Punk"],"hb":["Frikomid","sdecandelario"],"da":"Turn On the Bright Lights is the debut album of New York City rock band Interpol. It was released in 2002 on Matador Records to a great deal of critical acclaim and sold exceptionally well for an indie release; it has sold 499,000 copies in the U.S. so far. It was also ranked highly on the yearly lists of many music critics, and has to date sold 86,000 in the UK despite only charting as high as #101. Musically, many have pointed out the similarities between Turn On the Bright Lights and the bands Joy Division and The Chameleons. \"PDA\", .","dar":"Interpol is an American post-punk band formed in Manhattan, New York, in 1997. They played an important part in the post-punk revival of the 2000s. The band consists of Paul Banks (vocals and guitar), Sam Fogarino (drums), and Daniel Kessler (guitar and backing vocals).\n\nThe band's sound is generally a mix of staccato bass and rhythmic, harmonized guitar, with a snare heavy mix, drawing comparisons to post-punk bands such as Joy Division and The Chameleons."},{"n":3,"year":2000,"ar":"Immolation","ti":"Close to a World Below","cv":"https://dn721908.ca.archive.org/0/items/mbid-cc408040-36b1-3379-9ebf-32cf13966267/mbid-cc408040-36b1-3379-9ebf-32cf13966267-33742460910.jpg","rt":0.0,"sp":"","yt":"vqUUA1I25aw","gen":["metal","death metal","rock","Metal"],"hb":["Lonsonxd"],"da":"Close to a World Below is the fourth album by Immolation. It was released via Metal Blade Records in 2000. Since its release, Close to a World Below has received universal acclaim. Todd Nief of AllMusic gave the Close to a World Below four and a half stars, calling the album a late-career classic. He stated that with Close to a World Below, Immolation released one of the most profound and creative death metal albums of the 2000s which gave a new voice to a genre deluged with cookie-cutter clones. Metal Storm gave Close to a World Below a near-perfect .","dar":"Immolation is a death metal band from Yonkers, New York. They were formed in 1986 as Rigor Mortis. The name was changed to Immolation in late 1987, between the \"Warriors of Doom\" demo which was done as Rigor Mortis and \"Demo I\" which was done as Immolation. The band recorded 4 songs on the \"Demo II\" 1989 sessions, but only 3 were finally released: \"Internal decadence\", \"Burial Ground\" and \"Despondent Souls\". The remaining song is \"Infectious Blood\" (later re-named \"Fall in Disease\" on the \"Dawn of Possession\" Album)."},{"n":11,"year":2000,"ar":"Electric Wizard","ti":"Dopethrone","cv":"https://dn710302.ca.archive.org/0/items/mbid-aec7ca73-36ff-41aa-9ad1-57b2d4cc41bb/mbid-aec7ca73-36ff-41aa-9ad1-57b2d4cc41bb-10614867040.png","rt":0.0,"sp":"","yt":"eaMbKZPBruU","gen":["doom metal","stoner rock","rock","Metal","Rock"],"hb":["Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"Dopethrone is the third studio album by English doom metal band Electric Wizard. It was released on 28 November 2000 through Rise Above Records and re-released by the same label in 2004 and 2007 with an extra song. Jus Oborn late spoke about the development of Dopethrone as being part of trilogy with Come My Fanatics…, and Supercoven, noting that he looked upon these albums with fondness and that \"With those albums, I believe we really found our mark as a band. When we did our first album, none of us had ever been into the studio before – and .","dar":"Electric Wizard is a band from Dorset, UK. They have a distinct, yet traditional doom metal sound that incorporates stoner and sludge traits, with lyrics typically involving the occult, witchcraft, H.P. Lovecraft, horror films and marijuana. During 2003, founding members Tim Bagshaw and Mark Greening left to form the band Ramesses, leaving guitarist/vocalist Jus Oborn the only remaining founding member.\n\nThe oblivion and ecstasy of crushing doom and high grade marijuana"},{"n":49,"year":2000,"ar":"Ulver","ti":"Perdition City","cv":"https://dn710608.ca.archive.org/0/items/mbid-5bbc88d0-ccab-43e7-97fd-1bdb143c6054/mbid-5bbc88d0-ccab-43e7-97fd-1bdb143c6054-23033184531.jpg","rt":0.0,"sp":"","yt":"AUQpHPPbdCI","gen":["psychedelic","post-industrial","black metal","rock","electronic","Metal"],"hb":[],"da":"Perdition City (subtitled Music to an Interior Film) is the fifth studio album by Norwegian collective Ulver, issued in March 2000, via Jester Records. The album was recorded and produced by Kristoffer Rygg and Tore Ylwizaker, mixed by Ylwizaker at Beep Jam Studio and mastered by Audun Strype at Strype Audio. Perdition City continues the experimentation heard on Themes from William Blake's The Marriage of Heaven and Hell and Metamorphosis, containing elements of trip hop, jazz, ambient music, spoken word and electronica, the combination being described as \"moody\", \"atmospheric\", and \"cinematic in scope\" .","dar":"Ulver (Norwegian for “wolves”) is a multi-disciplinary musical group founded in Oslo, Norway and currently based in London, England. The band was formed by Kristoffer \"Garm\" Rygg in 1993, and the current line-up includes Rygg (vocal, programming), Jørn H. Sværen (misc.), Tore Ylwizaker (programming, piano) and Daniel O'Sullivan (guitar, piano, various). Since their first black metal releases in 1993, Ulver’s style has ever been changing by combining elements of experimental"},{"n":68,"year":2000,"ar":"Elliott Smith","ti":"Figure 8","cv":"https://dn710605.ca.archive.org/0/items/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae-18782213344.png","rt":0.0,"sp":"","yt":"B6sYRE65QIc","gen":["folk rock","chamber pop","indie rock","indie folk","indie pop","rock"],"hb":[],"da":"Figure 8 is the fifth studio album by American singer-songwriter Elliott Smith. Released by DreamWorks Records on April 18, 2000, it became Smith's second release on a major label and the last album he would complete before his death. It was recorded at Sunset Sound in Hollywood, Sonora Studios in Los Angeles, Capitol Studios in Hollywood, and Abbey Road Studios in London (\"Stupidity Tries\", \"In the Lost and Found (Honky Bach)\" and \"Pretty Mary K\"). The album was also released on double vinyl 12\" on Bong Load Custom Records, and later rereleased by Plain Records in 2008. It is also .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":137,"year":2000,"ar":"Lambchop","ti":"Nixon","cv":"https://ia600501.us.archive.org/10/items/mbid-058e013c-9cee-4e2d-a3a7-2c643b0aef37/mbid-058e013c-9cee-4e2d-a3a7-2c643b0aef37-4558030091.jpg","rt":0.0,"sp":"","yt":"zB-m9YfEkJg","gen":["rock","electronic","Rock","Alternative Rock"],"hb":[],"da":"Nixon is a 2000 album by Lambchop. The album was a critical and commercial breakthrough for the band, especially in the United Kingdom where it polled highly in several year end polls in music magazines, among them Uncut magazine. The song Up with People was subsequently remixed by Zero 7. The sleeve is a painting by Wayne White, a childhood friend of Kurt Wagner who also provided cover art for Thriller, Aw Cmon and No You Cmon by the band. .","dar":"Lambchop is an American alt-country band from Nashville, Tennessee, the capital of country music. Originally called Posterchild, the band (which formed in 1986) cannot easily be classified into a genre and certainly not into that of traditional country music. The collective around frontman Kurt Wagner has a fluid membership, at times including as many 18 musicians, and is frequently associated with alternative country. Lambchop’s music combines"},{"n":8,"year":1998,"ar":"Gorguts","ti":"Obscura","cv":"https://dn710701.ca.archive.org/0/items/mbid-8ce52599-4faa-438e-bc7b-6a0a23a67596/mbid-8ce52599-4faa-438e-bc7b-6a0a23a67596-25471215852.jpg","rt":0.0,"sp":"","yt":"ugTuSqeL3XM","gen":["technical death metal","rock","Metal"],"hb":["Lonsonxd","Nubis84"],"da":"Third full length album, released 1998 by Olympic Recordings. Produced & Engineered by Pierre Rémillard (also worked on Quo Vadis). Artwork by Alain Cloutier and Luc Lemay. Lineup: Steve Cloutier - Bass Patrick Robert - Drums Luc Lemay - Guitars, Vocals, Viola (track 2) Steeve Hurdle - Guitars, Vocals .","dar":"Gorguts is a technical death metal/avant-garde metal band that formed in 1989 in Sherbrooke, Quebec, Canada.  They have released five full-length albums to date, and released their first EP 'Pleiades' Dust' in 2016, which consists of a single 33-minute song. The band has experienced numerous lineup changes and musical transformations since their inception, with founding guitarist/vocalist Luc Lemay being the only remaining founding member. In 2005, following the suicide of drummer Steve MacDonald, the band broke up."},{"n":131,"year":1998,"ar":"Tortoise","ti":"TNT","cv":"https://dn710805.ca.archive.org/0/items/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1/mbid-db2b85d1-912d-3965-bd5e-7c9dc18e2af1-22029271309.jpg","rt":0.0,"sp":"","yt":"2WGb_9UW6EU","gen":["electronica","post-rock","rock","instrumental","Electronic","Alternative Rock"],"hb":["Frikomid","GabredMared","Nubis84","paqueradejere","sdecandelario","verygooood"],"da":"Expected by many to continue leading the post-rock brigade into a new fusion with dub and electronics, Tortoise instead turned yet another corner with their third album, TNT. Adding guitarist Jeff Parker to cement their musicianship as well as their connections to Chicago's fertile jazz/avant-garde scene, the band returned with a record of post-modern cool jazz, only slightly informed by the dub, Krautrock, and electronics of Millions Now Living Will Never Die. It shows from the first few seconds -- a lazy, slightly free drum solo frames a few tentative guitar chords and some teased effects, before the band kicks .","dar":"Tortoise's almost entirely instrumental music defies easy categorization.  The group gained significant attention from their early career. The members have roots in Chicago's fertile music scene, playing in various indie rock and punk groups.  Formed in 1990, Tortoise was among the first American indie rock bands to incorporate styles closer to Krautrock, dub, minimalism, electronica and various jazz styles, rather than the standard rock and roll and punk that had dominated indie rock for years."},{"n":168,"year":1998,"ar":"Cat Power","ti":"Moon Pix","cv":"https://dn710308.ca.archive.org/0/items/mbid-d8bfb0c6-4d82-41c4-8567-a2823525aade/mbid-d8bfb0c6-4d82-41c4-8567-a2823525aade-6010113367.jpg","rt":0.0,"sp":"","yt":"6fw7KZ3v8fc","gen":["folk rock","country rock","slowcore","rock","Alternative Rock"],"hb":[],"da":"Moon Pix is the fourth album by American singer-songwriter Cat Power (a.k.a. Chan Marshall). It was released in September 1998 on Matador Records. Prior to recording Moon Pix, Marshall had planned to retire from the music business, relocating to Portland, Oregon and Prosperity, South Carolina; however, after experiencing a hallucinatory nightmare while staying in a rural farmhouse, Marshall wrote the bulk of Moon Pix in a single night. In January 1998, Marshall traveled to Melbourne, Australia, to record the album with Mick Turner and Jim White, of the Australian instrumental band Dirty Three, on guitar and drums, respectively. .","dar":"Cat Power is an American singer, songwriter, musician, actress, and model. Charlyn Marie Marshall (also known as Chan, pronounced \"Shawn\")  was born in Atlanta, Georgia, U.S. on 21 January 1972. Cat Power was originally the name of Marshall's first band, but has become her stage name as a solo artist.\n\nAfter dropping out of high school, Marshall started performing under the name Cat Power, while in Atlanta, backed by musicians Glen Thrasher, Mark Moore, and others."},{"n":33,"year":1997,"ar":"Yo La Tengo","ti":"I Can Hear the Heart Beating as One","cv":"https://dn710607.ca.archive.org/0/items/mbid-dc5ee2df-7e5b-4a43-b67b-b9551e65c361/mbid-dc5ee2df-7e5b-4a43-b67b-b9551e65c361-3592364273.jpg","rt":0.0,"sp":"","yt":"Jp1MDdMDCno","gen":["indie rock","rock","Alternative Rock"],"hb":[],"da":"I Can Hear the Heart Beating as One is an album by Yo La Tengo released on Matador in 1997. It was recorded in Nashville, Tennessee and mixed in New York City. The album's sound is a blend of various genres, such as folk (\"One PM Again\"), rock (\"Moby Octopad\"), shoegazing (\"Deeper Into Movies\"), noise pop (\"Sugarcube\"), long noise jams (\"Spec Bebop\"), ambient (\"Green Arrow\"), and bossa nova (\"Center of Gravity\"), with a few songs showing electronic music influences (\"Autumn Sweater\"). The album also contains two cover songs: \"Little Honda,\" a Beach Boys tune by Brian Wilson and Mike Love, .","dar":"Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record."},{"n":60,"year":1997,"ar":"Mogwai","ti":"Young Team","cv":"https://dn720305.ca.archive.org/0/items/mbid-fe0dfba6-4868-3ede-a3f6-f6f6d7f5fb27/mbid-fe0dfba6-4868-3ede-a3f6-f6f6d7f5fb27-8197918956.jpg","rt":0.0,"sp":"","yt":"du4JbfK5okA","gen":["noise rock","post-rock","rock","Alternative Rock"],"hb":[],"da":"Mogwai Young Team (also known as Young Team) is the debut studio album by Scottish post-rock band Mogwai. Mogwai Young Team was recorded in Summer 1997 at MCM Studios (now known as Gargleblast Studios) in Hamilton, Scotland, and was produced by Paul Savage and Andy Miller. It is largely instrumental, with one notable exception (\"R U Still in 2 It\", which features vocals from Aidan Moffat of Arab Strap), although many songs feature recordings of various individuals speaking, whether over the phone (\"Tracy\"), reading (\"Yes! I Am a Long Way from Home\"), or just rambling (\"Katrien\"). It features limited instrumentation, .","dar":"Mogwai is a Scottish post-rock/instrumental band from Glasgow formed in 1995. \nThey compose lengthy, mostly instrumental guitar-based pieces in the style of post-rock, usually focused around the elaboration of a single theme, and are known traditionally for their quiet/loud dynamic, defined bass riffs, and an eminent ambient sound, sometimes dark and sometimes grand. Although frequently referred to as post-rock, the band have revealed in interviews that they despise this categorization"},{"n":128,"year":1997,"ar":"Jim O'Rourke","ti":"Bad Timing","cv":"https://dn710901.ca.archive.org/0/items/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418-27073926441.jpg","rt":0.0,"sp":"","yt":"g4KSE4oo9d8","gen":["experimental rock","avant-garde","folk rock","pop rock","american primitive guitar","rock"],"hb":["Nubis84"],"da":"Bad Timing is an album by American musician Jim O'Rourke, released on Drag City in 1997. It is an instrumental album, consisting largely of Jim O'Rourke's acoustic guitar playing (much in the style of John Fahey), sometimes with additional instrumentation. The album is named after the 1980 film Bad Timing: A Sensual Obsession, directed by Nicolas Roeg. It is one of a trio of O'Rourke albums, along with Eureka and Insignificance, to be named after Roeg films from the 1980s. This album is a favorite of Wilco's Jeff Tweedy. .","dar":"American indie rock and avant-garde musician, composer and producer Jim O'Rourke (born January 18, 1969, in Chicago) has been a key component in the increasing overlap of the American and European experimental music avant-garde, working in everything from jazz and rock to ambient and electro-acoustic and building many a bridge in between. He currently resides in Yamanashi, Japan.\n\nA Chicago native, O'Rourke's work has found equal luck with experimental jazz and noise fanatics"},{"n":153,"year":1997,"ar":"Lungfish","ti":"Indivisible","cv":"https://dn711200.ca.archive.org/0/items/mbid-69446457-af5d-429a-966a-88100370447c/mbid-69446457-af5d-429a-966a-88100370447c-18975811993.jpg","rt":0.0,"sp":"","yt":"G6CJ5x6YMCw","gen":["alternative rock","indie rock","post-hardcore","rock","Rock","Punk"],"hb":[],"da":null,"dar":"Lungfish is a post-hardcore band formed in 1987 in Baltimore, Maryland, United States. All of their music has been released by the Washington, D.C. punk label Dischord except for their first LP, Necklace of Heads which was released by Simple Machines (it was later added to the CD release of Talking Songs for Walking by Dischord).\n\nTheir lineup as of 2005 consists of Daniel Higgs (vocals), Asa Osborne (guitars and vocals), Sean Meadows (bass guitar), and Mitchell Feldstein (drums). Previous bass guitar players are John Chriest and Nathan Bell."},{"n":156,"year":1996,"ar":"Polvo","ti":"Exploded Drawing","cv":"https://dn721807.ca.archive.org/0/items/mbid-a958cbed-4b67-4b6d-8d67-771ad7cf1a99/mbid-a958cbed-4b67-4b6d-8d67-771ad7cf1a99-27224994207.jpg","rt":0.0,"sp":"","yt":"nXO0upZzdbs","gen":["indie rock","rock","Rock","Punk"],"hb":[],"da":"Exploded Drawing is the third studio album by American indie rock band Polvo. It was released in 1996 as a CD and double-LP on Touch and Go Records. The album was engineered by Bob Weston. In 1999, Pitchfork ranked it at #68 on their original “Top 100 Favorite Records of the 1990s” list, though it was later excluded from the updated version published in 2003. In the years following the band’s reunion, the album has been viewed in a much more positive light, and has often been called their best. The Line of Best Fit called it a “sprawling double .","dar":"Polvo are an American indie rock band formed in Chapel Hill, North Carolina, in 1990. The band was fronted by guitarists/vocalists Ash Bowie and Dave Brylawski. Eddie Watkins played drums, and Steve Popson played bass guitar.  The band reformed in 2008 with Brian Quast assuming drum duties. Their sound, foreshadowing math rock and post-rock, is defined by angular post-punk songwriting, complex and dissonant guitar harmonies and driving rhythms, complementing cryptic lyrics. The band's name means \"dust\" in Spanish, or \"octopus\" in Portuguese."},{"n":197,"year":1996,"ar":"Eels","ti":"Beautiful Freak","cv":"https://i.discogs.com/ZHrSfEqb8SkM2nUonf5pUuBotSFr-hfQfyAjzJlfTKQ/rs:fit/g:sm/q:90/h:600/w:600/czM6Ly9kaXNjb2dz/LWRhdGFiYXNlLWlt/YWdlcy9SLTc2NjU4/MDYtMTQ0NjI4Njkz/OC00ODMyLmpwZWc.jpeg","rt":0.0,"sp":"","yt":"V2yy141q8HQ","gen":["rock","Alternative Rock"],"hb":["Frikomid","Nubis84","alberto_gu"],"da":null,"dar":"Eels (often typeset as eels or EELS) is an American rock band, formed in Los Angeles, California, in 1991 by singer/songwriter and multi-instrumentalist Mark Oliver Everett, known by the stage name E. Band members have changed over the years, both in the studio and on stage, making Everett the only official member for most of the band's work. Eels' music is often filled with themes of family, death, and unrequited love. Since 1996, Eels has released fourteen studio albums, seven of which charted in the Billboard 200."},{"n":19,"year":1994,"ar":"Pavement","ti":"Crooked Rain, Crooked Rain","cv":"https://ia800607.us.archive.org/5/items/mbid-8684f971-08a2-3551-8e5c-a87440408725/mbid-8684f971-08a2-3551-8e5c-a87440408725-23540686482.jpg","rt":0.0,"sp":"","yt":"4IED3Q5VLeg","gen":["alternative rock","indie rock","noise pop","rock","Alternative Rock"],"hb":[],"da":"Crooked Rain, Crooked Rain is an album released by Pavement in 1994. With this album, the band abandoned the lo-fi sound displayed on Slanted and Enchanted (as well as their drummer, Gary Young). During the tour for Slanted, the band added percussionist Bob Nastanovich and bassist Mark Ibold; partway through this album's recording sessions, Gary Young was replaced by Steve West. The album featured the band at its most easily accessible, and the single \"Cut Your Hair\" was the band's closest brush with mainstream success. As of 2007, the album has sold almost 500,000 copies and was a UK Top .","dar":"Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s."},{"n":70,"year":1994,"ar":"Unwound","ti":"New Plastic Ideas","cv":"https://dn721608.ca.archive.org/0/items/mbid-03a4f93c-ef8d-4a5a-882b-e1a8515a9768/mbid-03a4f93c-ef8d-4a5a-882b-e1a8515a9768-27704563597.jpg","rt":0.0,"sp":"","yt":"VOloYTXAU_U","gen":["noise rock","post-hardcore","post-rock","emo","emocore","rock"],"hb":[],"da":"New Plastic Ideas is the third recorded studio album by the American post-hardcore band Unwound, (though second released). The album was released on March 21, 1994 by Kill Rock Stars. The album was recorded in between from November 26–28 and December 13, 1993 at Avast! Studios in Seattle, Washington. As pointed out in The Vinyl Factory’s review for the album, New Plastic Ideas is a somewhat a step away from the feedback-ridden sound of its predecessor Fake Train and focuses more on melody and odd time signatures, although the band has stated that this was unintentional. The album's title was .","dar":"Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s"},{"n":80,"year":1994,"ar":"Elliott Smith","ti":"Roman Candle","cv":"https://dn710602.ca.archive.org/0/items/mbid-2a3dbf29-e1d5-40c6-85d5-4c9611da9c9b/mbid-2a3dbf29-e1d5-40c6-85d5-4c9611da9c9b-5003037508.jpg","rt":0.0,"sp":"","yt":"DCZbnvzRUjQ","gen":["indie rock","rock","Rock","Alternative Rock"],"hb":[],"da":"Roman Candle was Elliott Smith's debut album as a solo artist, even though he was still a singer and guitarist for the band Heatmiser. The album has a raw, homemade sound (see Lo-fi music), with Smith playing each instrument and recording it on his four-track recorder. Kid Tulsa (Pete Krebs) played snare and cymbal on tracks \"No Name #1\" and \"Kiwi Maddog 20/20\". According to the Elliott Smith biography, Elliott Smith and the Big Nothing, Elliott recorded the album in the basement of the home of then-girlfriend and Heatmiser manager J.J. Gonson. The album was never intended for release, as .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":92,"year":1994,"ar":"The Offspring","ti":"Smash","cv":"https://dn710908.ca.archive.org/0/items/mbid-b50d155a-5cde-3600-b768-5a6fc0ce57eb/mbid-b50d155a-5cde-3600-b768-5a6fc0ce57eb-31844265343.jpg","rt":0.0,"sp":"","yt":"WanovkthKcA","gen":["alternative rock","hard rock","punk","punk rock","rock","Punk"],"hb":["sdecandelario"],"da":"Smash is the third studio album by American punk rock band The Offspring, released on April 8, 1994 through Epitaph Records. The album was the band's last collaboration with record producer Thom Wilson, who produced their previous two albums, and also their last release on Epitaph (however, that label released their next album in Europe). Smash met high critical reception upon its release, and is now considered a classic punk rock album by fans, critics, and the band members themselves alike. The album was also responsible for bringing The Offspring to the attention of a mainstream punk audience. Smash was .","dar":"The Offspring is a punk rock band formed in Huntington Beach, California, United States in 1984. From 1987 to 2003, the band's line-up included Dexter Holland (lead vocals, guitar), Noodles (lead and rhythm guitars, back vocals), Greg K. (bass, back vocals), and Ron Welty (drums, percussion), who was fired in 2003. Their current drummer is Brandon Pertzborn of Marilyn Manson who has been with the band since 2023. Greg K was fired from the band in 2018 and was replaced by Todd Morse."},{"n":131,"year":1994,"ar":"Stone Temple Pilots","ti":"Purple","cv":"https://dn721909.ca.archive.org/0/items/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016-24373460607.jpg","rt":0.0,"sp":"","yt":"6EM6Uk1BICc","gen":["alternative rock","hard rock","acoustic rock","grunge","rock","Rock"],"hb":[],"da":"Purple is the second album released by the American rock band Stone Temple Pilots, on June 7, 1994, by Atlantic Records. It contains several of the band's biggest hit songs, including \"Vasoline,\" \"Interstate Love Song,\" and \"Big Empty,\" which was also featured on The Crow soundtrack. The album was a big success for STP, debuting at #1 (for three weeks, longer than any stay at the top by Nirvana, Alice In Chains, or Soundgarden) and being certified 6x platinum. In 2006, the album was ranked number 73 on Guitar World magazine's list of the greatest 100 guitar albums of all .","dar":"Stone Temple Pilots (also known by STP) is an American grunge band from San Diego, California, that originally consisted of Scott Weiland (lead vocals), brothers Dean (guitar) and Robert DeLeo (bass, backing vocals), and Eric Kretz (drums). The band's lineup remained unchanged from its formation in 1989 until the firing of Weiland in February 2013. Linkin Park vocalist Chester Bennington joined the band in May 2013 but left amicably in November 2015."},{"n":155,"year":1994,"ar":"Blur","ti":"Parklife","cv":"https://dn721902.ca.archive.org/0/items/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd-27625936663.jpg","rt":0.0,"sp":"","yt":"LCp77Yf54_k","gen":["alternative rock","indie rock","britpop","rock","Pop","Alternative Rock"],"hb":["Nubis84","Rocky_stereo","alberto_gu","verygooood"],"da":"Parklife is the third studio album by the English alternative rock band blur, released on 25 April 1994 on Food Records. After disappointing sales for their previous album Modern Life is Rubbish (1993), Parklife returned Blur to prominence in the UK, helped by its four hit singles: Girls & Boys, End of a Century, Parklife and To the End. The album was certified quadruple platinum in the United Kingdom. .","dar":"Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995)."},{"n":165,"year":1994,"ar":"Morrissey","ti":"Vauxhall and I","cv":"https://dn711301.ca.archive.org/0/items/mbid-bb348a27-9dfd-463c-a40d-84acfb420bdc/mbid-bb348a27-9dfd-463c-a40d-84acfb420bdc-23543783058.png","rt":0.0,"sp":"","yt":"7fQXSYqr8ZY","gen":["rock","Punk","Alternative Rock"],"hb":[],"da":"Vauxhall and I is the fourth studio album by English alternative rock musician Morrissey. It was released on 14 March 1994, by the record label Parlophone in the UK and Sire/Reprise in the US. The album's title may be a reference to the 1987 film Withnail and I. Vauxhall is an area of London noted for its gay clubs, and there is also a British car manufacturer of the same name. \"Spring Heeled Jim\" contains bits of dialogue from We Are the Lambeth Boys, a 1959 documentary that follows the lives of members of a south London youth club. The .","dar":"Steven Patrick Morrissey, better known as Morrissey, is a British singer and lyricist of Irish descent born in Davyhulme, Manchester, United Kingdom on May 22, 1959.\n\nHe was the lead singer of The Smiths, one of the most influential alternative bands in the 1980s. The group split up in 1987 and Morrissey started a successful solo career.\n\nHis first solo album, Viva Hate was released only six months after The Smiths split, in March 1988. The album's first single \"Suedehead\" peaked at #5"},{"n":188,"year":1994,"ar":"Brainiac","ti":"Bonsai Superstar","cv":"https://dn711100.ca.archive.org/0/items/mbid-5a4a1117-b788-4b28-8e71-c3059257352d/mbid-5a4a1117-b788-4b28-8e71-c3059257352d-19366521630.jpg","rt":0.0,"sp":"","yt":"kqXGMUxyD4A","gen":["alternative rock","art rock","indie rock","rock","Rock","Alternative Rock"],"hb":[],"da":"Bonsai Superstar is the second album from indie rock band, Brainiac, released on November 21, 1994. It is the first album on which guitarist John Schmersal appears, who remained as the band’s lead guitarist until their break-up in 1997. Originally released through Grass Records on LP and CD formats, the album is now out-of-print. Currently, the album’s copyright is owned by The Bicycle Music Company after Grass Records merged with Wind-Up Records and subsequently sold the copyrights to the band’s music. .","dar":"Brainiac (also stylized as 3RA1N1AC), is an American indie rock band from Dayton, Ohio. It was formed in January 1992 by Tim Taylor, Juan Monasterio (Monostereo), John Schmersal and Tyler Trent. They disbanded after the sudden death of lead singer Tim Taylor in a car accident on May 23, 1997.\n\nHistory\nFormation and early albums (1992–1997)\nBrainiac was formed in Dayton, Ohio, United States in January 1992 with vocalist, guitarist and keyboard player (particularly Moog synthesizers) Tim Taylor (July 20"},{"n":5,"year":1993,"ar":"Slowdive","ti":"Souvlaki","cv":"https://dn710300.ca.archive.org/0/items/mbid-12694708-e437-4874-a5d4-c1ca0ec46313/mbid-12694708-e437-4874-a5d4-c1ca0ec46313-16656091378.jpg","rt":0.0,"sp":"","yt":"U6WnPceijEA","gen":["alternative rock","psychedelic","shoegaze","dream pop","rock","Pop"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Souvlaki is the second studio album by English shoegaze band Slowdive, released on June 1, 1993, via Creation Records. The album's title was taken from a skit by comedy duo The Jerky Boys, where one of the duo prank calls a hotel manager asking him to perform sexual acts on his wife. Upon learning the manager is Greek, the caller says: \"My wife loves that Greek shit... She'll suck your cock like souvlaki\". While touring Europe in early 1992, Slowdive began working on their next record, Souvlaki, writing and recording in mutiple sessions, a reported total of 40 songs were .","dar":"Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon replaced Scott from 1994-1995."},{"n":44,"year":1993,"ar":"Ozric Tentacles","ti":"Jurassic Shift","cv":"https://dn721900.ca.archive.org/0/items/mbid-b60ce7da-e361-49f6-a742-1867a0612762/mbid-b60ce7da-e361-49f6-a742-1867a0612762-35772621734.jpg","rt":0.0,"sp":"","yt":"KAVzL4Q6lRw","gen":["space rock","rock","electronic","Rock"],"hb":["Lonsonxd"],"da":"The music style of this album is very hard to categorize: it is a brilliant mix of progressive space rock, hard rock, fusion, techno, New Age with TONS of state-of-the-art keyboards. ALL the instruments steal the show. The VERY varied, atmospheric, weird and colorful keyboards, combined with the incisive hard rock guitar a la Steve Hillage create absolutely \"out of this world\" dynamic spacescapes. Easily comparable to the Gong space-era stuff, \"Jurassic Shift\" however has more crystal clear textures with ultra modern keyboards. The drums and bass are NEVER bland nor repetitive; they are VERY elaborated and clearly contribute to .","dar":"Ozric Tentacles is an instrumental band from Somerset, England, whose music can loosely be described as psychedelic rock. Formed in 1984, the band has released well over twenty albums as of 2005, and has become a cottage industry selling around a million albums worldwide despite never having major label backing.\n\nThe original line up met on the 21st June 1984 at the Stonehenge Free Festival; their name came from discussions of hypothetical cereal brands (Malcolm Segments"},{"n":59,"year":1993,"ar":"PJ Harvey","ti":"Rid of Me","cv":"https://dn721608.ca.archive.org/0/items/mbid-aad52d2a-9502-4644-af00-412e264ffec0/mbid-aad52d2a-9502-4644-af00-412e264ffec0-32841758505.jpg","rt":0.0,"sp":"","yt":"8PlaNe3mXl8","gen":["alternative rock","indie rock","rock","Rock","Alternative Rock"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"Rid of Me is the second studio album by English singer-songwriter and musician PJ Harvey. It was released on May 4, 1993, via Island Records. The album marked a departure from Harvey's previous songwriting, being more raw and aggressive than its predecessor. Rid of Me was met with critical acclaim and is cited as one of the greatest albums of all time, ranking at number 153 on the 2020 version of Rolling Stone's 500 Greatest Albums of All Time (up from 406 on the list's previous edition). .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":80,"year":1993,"ar":"Suede","ti":"Suede","cv":"https://dn721902.ca.archive.org/0/items/mbid-de944158-01ca-4270-8549-a9b8317264e5/mbid-de944158-01ca-4270-8549-a9b8317264e5-33797584686.jpg","rt":0.0,"sp":"","yt":"nzLUgakW-zQ","gen":["alternative rock","glam rock","neo-psychedelia","britpop","rock","Pop"],"hb":[],"da":"Suede is the debut album by English alternative rock band Suede, released in 1993 on Nude Records. At the time the fastest-selling debut album in British history, Suede debuted at the top of the UK Album Chart, won the 1993 Mercury Music Prize, and is often credited with starting the Britpop movement. The sound of the album has been compared to The Smiths and the early David Bowie era. .","dar":"Suede, known as The London Suede in the United States, is an English rock band formed in London in 1989 by singer Brett Anderson, guitarist Justine Frischmann, and bassist Mat Osman. Drawing on glam rock and post-punk influences, the band gained early attention from the British music press and were labelled \"The Best New Band in Britain\" by Melody Maker in 1992. Their debut album, \"Suede\" (1993), reached number one on the UK Albums Chart, becoming the fastest-selling debut album in nearly a decade."},{"n":104,"year":1993,"ar":"Yo La Tengo","ti":"Painful","cv":"https://ia600809.us.archive.org/24/items/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd-21480189175.jpg","rt":0.0,"sp":"","yt":"dmvXdKXi-tk","gen":["alternative rock","indie rock","rock","Alternative Rock"],"hb":[],"da":"Painful is the sixth studio album by American indie rock band Yo La Tengo, released in 1993 by record label Matador, their first for the label. The album marked a creative shift from Yo La Tengo's previous work, blending atmospheric and ambient sounds with their famous noise jams. Painful features a much more melody-driven Yo La Tengo in its hazy, dream-like songwriting. Two versions of the track \"Big Day Coming\" are present on the album and display the range of musical stylings Yo La Tengo works with; the first version features a simple organ melody accompanied by a soft bass .","dar":"Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record."},{"n":112,"year":1993,"ar":"Polvo","ti":"Today's Active Lifestyles","cv":"https://dn710308.ca.archive.org/0/items/mbid-fe43dc71-1619-4507-9b1c-771e60efc409/mbid-fe43dc71-1619-4507-9b1c-771e60efc409-21102546371.jpg","rt":0.0,"sp":"","yt":"TsD8Nwsgci8","gen":["indie rock","math rock","rock","Rock","Punk"],"hb":[],"da":"Today’s Active Lifestyles is the second studio album by American indie rock band Polvo. It was produced by Bob Weston and released on Merge Records in 1993. Early versions of the cover art featured red tigers in the yellow colour field, but these were soon removed due to a lawsuit from its painter Andy Freeburn. The album was released on Merge Records. “Tilebreaker” was released as a 7” single with the song “Chameleon” and the instrumental “Tiara Fetish” on the B-side. (“Tiara Fetish” would later appear, with lyrics, as the song “Watch the Nail” on the Merge compilation 5 Rows .","dar":"Polvo are an American indie rock band formed in Chapel Hill, North Carolina, in 1990. The band was fronted by guitarists/vocalists Ash Bowie and Dave Brylawski. Eddie Watkins played drums, and Steve Popson played bass guitar.  The band reformed in 2008 with Brian Quast assuming drum duties. Their sound, foreshadowing math rock and post-rock, is defined by angular post-punk songwriting, complex and dissonant guitar harmonies and driving rhythms, complementing cryptic lyrics. The band's name means \"dust\" in Spanish, or \"octopus\" in Portuguese."},{"n":115,"year":1993,"ar":"Satyricon","ti":"Dark Medieval Times","cv":"https://ia600109.us.archive.org/22/items/mbid-af0a36c6-e171-4d61-b3f9-8c635e15706e/mbid-af0a36c6-e171-4d61-b3f9-8c635e15706e-43471622568.jpg","rt":0.0,"sp":"","yt":"ff_uv337yIE","gen":["black metal","rock","Metal","Rock"],"hb":["Nubis84"],"da":"Dark Medieval Times 1993, Moonfog “Dark Medieval Times” struck the scene like lightning. People didn’t really know what to expect from us. Unlike a lot of other bands we hadn’t spent five years underground releasing demos and 7 inches. We released a couple of demos before the debut - they sold really well – but we didn’t do it so much to promote the band, or to ”get down with the scene”. It was more a case of showing people what we were capable of and finding someone who would be interested in releasing records with us. We had a .","dar":"Satyricon is a Norwegian black metal band formed in Oslo in 1991. Satyr and Frost have been the band's core members since 1993. The band's first three albums typify the Norwegian black metal style. Since its fourth album in 1999, the band has strayed from this style and included elements of traditional heavy metal in their sound. Satyricon was the first Norwegian black metal band to join a multi-national record label (EMI).\n\nThe band were formed in 1990 as Eczema by the bassist Wargod and drummer Exhurtum."},{"n":135,"year":1993,"ar":"Motorpsycho","ti":"Demon Box","cv":"https://dn711008.ca.archive.org/0/items/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6-15893454828.jpg","rt":0.0,"sp":"","yt":"A0DSVuYO274","gen":["psychedelic rock","alternative rock","hard rock","indie rock","rock","Rock"],"hb":[],"da":null,"dar":"Motorpsycho is a band from Trondheim in Norway, formed in 1989. Their music can generally be defined as psychedelic rock, but they also mix in elements from metal, jazz, rock, noise, pop and many other musical styles. The members of the band are Bent Sæther (bass/vocals) and Hans Magnus Ryan (guitar/vocals). Håkon Gebhardt (drums) left the band in March 2005 to concentrate on solo projects (as Gebhardt) and his other band HGH. \nDrummer Kenneth Kapstad joined Motorpsycho as a full member late in 2007."},{"n":167,"year":1993,"ar":"Blur","ti":"Modern Life Is Rubbish","cv":"https://dn710203.ca.archive.org/0/items/mbid-10f5fd34-470d-46f8-b364-7e2ddfc765e5/mbid-10f5fd34-470d-46f8-b364-7e2ddfc765e5-4454732800.jpg","rt":0.0,"sp":"","yt":"CCDzxbfCJ60","gen":["indie rock","power pop","neo-psychedelia","noise pop","britpop","rock"],"hb":[],"da":"Modern Life Is Rubbish is the second album by English alternative rock band Blur, released in May 1993. The album peaked at number 15 on the UK Album Chart and featured the singles \"For Tomorrow, \"Chemical World\" and \"Sunday Sunday\". The earlier single \"Popscene\" was added to the American release of the album. Although their debut album Leisure (1991) had been commercially successful, Blur faced a severe media backlash soon after its release, and fell out of public favour. After the group returned from an unsuccessful tour of the United States, poorly received live performances and the rising popularity of .","dar":"Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995)."},{"n":180,"year":1993,"ar":"Mercury Rev","ti":"Boces","cv":"https://dn710702.ca.archive.org/0/items/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e-16199489502.jpg","rt":0.0,"sp":"","yt":"dqcVhV8pCyA","gen":["alternative rock","blues","indie rock","dream pop","rock","Rock"],"hb":[],"da":null,"dar":"Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound"},{"n":189,"year":1993,"ar":"Swervedriver","ti":"Mezcal Head","cv":"https://dn711109.ca.archive.org/0/items/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0-12135644621.jpg","rt":0.0,"sp":"","yt":"b0DTBOQOdf4","gen":["alternative rock","indie rock","shoegaze","rock","Alternative Rock"],"hb":[],"da":"Mezcal Head is the second studio album by English alternative rock band Swervedriver. It was released on 27 September 1993 by Creation Records in the United Kingdom and on 5 October 1993 by A&M Records in the United States. .","dar":"Swervedriver is a British shoegaze band, however their heavier rock & roll style also related them to the grunge genre coming from the U.S. Pacific Northwest. Some music writers considered them to be Britain's answer to this sound. Regardless of labels, the band's mix of storming and swirling guitar experimentation often crossed into psychedelia, coupled with mystical lyrics that often praised the nihilism of sports cars, racing and the open road."},{"n":200,"year":1993,"ar":"Cop Shoot Cop","ti":"Ask Questions Later","cv":"https://dn721601.ca.archive.org/0/items/mbid-8b3f08aa-06b9-4ca4-b779-56e6c893cf77/mbid-8b3f08aa-06b9-4ca4-b779-56e6c893cf77-42402071646.png","rt":0.0,"sp":"","yt":"nHiB-I2QAvw","gen":["alternative rock","punk","industrial","rock","Rock","Punk"],"hb":[],"da":null,"dar":"Cop Shoot Cop was a rock music group founded in New York, NY in 1987 and disbanded in 1996.\n\nThey were frequently classified as industrial rock, but were often quite different from many bands so dubbed. Tod A.'s lyrics were clever, snide and evocative (Art Black and David Sprague suggest that \"Black humor beats black metal any day\") and their \"weirdly catchy\" music which drew \"on hot jazz and swing as much as clanging rock, emphasizing the group's stand-apart attitude.\""},{"n":55,"year":1992,"ar":"Pantera","ti":"Vulgar Display of Power","cv":"https://dn710300.ca.archive.org/0/items/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5-7967409791.jpg","rt":0.0,"sp":"","yt":"8hu6xDPcNlE","gen":["heavy metal","metal","alternative metal","groove metal","thrash metal","rock"],"hb":[],"da":"Vulgar Display of Power is the sixth studio album by the American heavy metal band Pantera, released on February 25, 1992 through Atco Records. One of the most influential heavy metal albums of the 1990s, Vulgar Display of Power has been described as \"one of the defining albums of the groove-metal genre.\" Several songs from this release have become some of the band's best known, such as \"Mouth for War,\" \"A New Level,\" \"Walk,\" \"Fucking Hostile,\" \"This Love,\" and \"No Good (Attack the Radical).\" Background: The band's 1990 major label debut, Cowboys from Hell, demonstrated a change in their musical .","dar":"Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre"},{"n":65,"year":1992,"ar":"Catherine Wheel","ti":"Ferment","cv":"https://dn721806.ca.archive.org/0/items/mbid-053f988e-2b6d-4384-8dec-74bde963de4e/mbid-053f988e-2b6d-4384-8dec-74bde963de4e-43303137864.jpg","rt":0.0,"sp":"","yt":"c6ipG9YDHEI","gen":["shoegaze","rock","Rock","Alternative Rock"],"hb":["verygooood"],"da":"Ferment is the debut studio album by English alternative rock band Catherine Wheel, released in 1992 by Fontana Records. Produced by Tim Friese-Greene and John Lee, the album combined aspects of shoegazing, alternative rock and neo psychedelia. Ferment is the only album to contain the neo psychedelia element of the band's discography. Their next album, Chrome, produced with famed alternative rock producer Gil Norton, shifted the musical direction of the band. While Ferment was originally not all that successful in the charts, the album continues to be well received by critics and fans, even 30 years after its release. Four .","dar":"Catherine Wheel was a four-piece shoegaze band from Great Yarmouth, England. The band was active from 1990 to 2000, experiencing fluctuating levels of commercial success, and embarking on many lengthy tours.\n\nCatherine Wheel formed in 1990, comprising singer/guitarist Rob Dickinson (cousin of Iron Maiden legend Bruce Dickinson), guitarist Brian Futter, bassist Dave Hawes, and drummer Neil Sims. Hawes had previously played in a Joy Division-influenced band called Eternal."},{"n":92,"year":1992,"ar":"Godflesh","ti":"Pure","cv":"https://dn721804.ca.archive.org/0/items/mbid-93ad6ea1-6be8-4541-8d1d-524c83fc7aeb/mbid-93ad6ea1-6be8-4541-8d1d-524c83fc7aeb-32957764185.jpg","rt":0.0,"sp":"","yt":"oYA_eDX4Bbs","gen":["industrial","industrial metal","post-metal","sludge metal","dark ambient","rock"],"hb":["paqueradejere","sdecandelario"],"da":null,"dar":"Godflesh is an industrial metal band from Birmingham, England, formed in 1988 by Justin Karl Broadrick (guitar, vocals, and programming) and G. C. Green (bass). They are highly regarded as one of the founders of industrial metal. The group disbanded in 2002 but reformed in 2010, appearing in few festivals and starting to produce a new studio album.\n\nIn 1988, Broadrick contacted Green about reforming Fall of Because, who fell apart in 1987. Justin decided to take over on guitars"},{"n":197,"year":1991,"ar":"Codeine","ti":"Frigid Stars","cv":"https://dn711200.ca.archive.org/0/items/mbid-01c518f7-7c3f-4679-9e0d-67252a737314/mbid-01c518f7-7c3f-4679-9e0d-67252a737314-15606984492.jpg","rt":0.0,"sp":"","yt":"LgdS7Lmn6_4","gen":["alternative rock","indie rock","slowcore","post-rock","rock","Alternative Rock"],"hb":[],"da":null,"dar":"American indie rock band formed in New York in 1989 by members Stephen Immerwahr (vocal, bass), Chris Brokaw (drums) and John Engle (guitar). Codeine pioneered the slowcore and sadcore subgenres of indie rock, but with a more experimental attitude than other bands in the genre, such as Low, Idaho and Red House Painters. The band's original tone, marked by slow tempos, Immerwahr's nasal and apathetic vocals, and Engle's ringing Telecaster, did not evolve much during their career."},{"n":3,"year":1991,"ar":"Talk Talk","ti":"Laughing Stock","cv":"https://dn720709.ca.archive.org/0/items/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42-7497588359.jpg","rt":0.0,"sp":"","yt":"ARehbaKm4U0","gen":["experimental rock","avant-garde","post-rock","rock","Jazz","Pop"],"hb":[],"da":"Laughing Stock is the fifth and final LP from Talk Talk, released on November 19, 1991 from Polydor records. It marks the pinnacle of the band's transformation from synth-pop into an experimental, impressionistic sound that would later share characteristics with what music critics called post-rock; as such, it is the quintessential document of a proto-post-rock sound from this incredibly creative group, and it serves as a touchstone record for the era. Since it's release, many years later it has been hailed as a lost classic of the grunge-era nineties. Talk Talk had been steadily gestating a sound transformation from records .","dar":"Talk Talk were an English band formed in 1981 by Mark Hollis (vocals, guitar, piano), Lee Harris (drums), Paul Webb (bass), and Simon Brenner (keyboards). The band initially performed as a synth-pop group, and their first two albums, \"The Party's Over\" (1982) and \"It's My Life\" (1984), reached the top 40 in the UK and produced international singles including \"Talk Talk\", \"Today\", \"It's My Life\", and \"Such a Shame\".\n\nThe band's third album, \"The Colour of Spring\" (1986)"},{"n":38,"year":1991,"ar":"Melvins","ti":"Bullhead","cv":"https://dn710709.ca.archive.org/0/items/mbid-67d450b3-9f16-43e7-a819-019e6e54e074/mbid-67d450b3-9f16-43e7-a819-019e6e54e074-12107471021.jpg","rt":0.0,"sp":"","yt":"8NUPV_LdJFM","gen":["alternative rock","sludge metal","rock","Metal","Rock"],"hb":[],"da":"The Melvins' third proper full-length. It features longer songs than their earlier releases and a more metallic, sludgy sound. .","dar":"Melvins is a sludge metal band that formed in Montesano, Washington, United States in 1983. The band currently consists of Buzz Osborne (vocals, guitar), Steven Shane McDonald (bass), and Dale Crover (drums). Osborne is the only remaining original member, although Crover has been a member since early in the band's career.\n\nIn the early days of their career. . . their dark, heavy, oppressively slow sound made them innovators of genres like sludge, grunge, and doom metal."},{"n":64,"year":1991,"ar":"Nirvana","ti":"Nevermind","cv":"https://dn721803.ca.archive.org/0/items/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b-30501372565.jpg","rt":0.0,"sp":"","yt":"V0hDhjO3AwM","gen":["alternative rock","punk rock","grunge","rock","censored album cover","Rock"],"hb":["BipolarMuzik","Lonsonxd","alberto_gu","verygooood"],"da":"Nevermind is the second studio album by the American grunge band Nirvana, released on September 24, 1991. Produced by Butch Vig, Nevermind was the group's first release on Geffen Records, which signaled its move away from Seattle-based independent record label Sub Pop. Front man Kurt Cobain sought to make music outside of the restrictive confines of the Seattle grunge scene, drawing influence from groups such as the Pixies and its use of loud/quiet song dynamics. Nevermind was a surprise success by late 1991, largely due to the success of its lead single \"Smells Like Teen Spirit\". By January 1992 it .","dar":"There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s."},{"n":109,"year":1991,"ar":"Teenage Fanclub","ti":"Bandwagonesque","cv":"https://dn710706.ca.archive.org/0/items/mbid-b597adbc-71ab-44a1-b5a0-12c4ad252894/mbid-b597adbc-71ab-44a1-b5a0-12c4ad252894-11913142700.jpg","rt":0.0,"sp":"","yt":"rqYibZeafg8","gen":["alternative rock","indie rock","power pop","jangle pop","rock","Pop"],"hb":[],"da":"'Bandwagonesque' is the third album by Scottish alternative rock band Teenage Fanclub, released in November 1991 on Creation Records. The album gave the band substantial US success when the single 'Star Sign' reached number four on the Billboard Modern Rock Tracks chart, becoming their biggest hit in that country, with \"What You Do to Me\" and \"The Concept\" also becoming top 20 hits on that chart. 'Bandwagonesque' was voted 'album of the year' for 1991 by American music magazine Spin, famously beating Nirvana's landmark album 'Nevermind' and My Bloody Valentine's epic 'Loveless'. .","dar":"Teenage Fanclub is a Scottish power pop band formed in Bellshill, Scotland in 1989 and formerly known as the Boy Hairdressers. They have two generally known humorous nicknames: \"The Fannies\" and \"The Bellshill Beach Boys\". They're revered for their devotion to chiming, The Byrds-esque guitars and harmonic vocals. The band is perhaps best known for the 1991 masterpiece 'Bandwagonesque', which presaged the later Britpop and indie pop movements, and"},{"n":146,"year":1991,"ar":"Cathedral","ti":"Forest Of Equilibrium","cv":"https://ia600505.us.archive.org/17/items/mbid-9e05c979-f5b0-4629-93f9-f21955e82dcb/mbid-9e05c979-f5b0-4629-93f9-f21955e82dcb-7731721936.jpg","rt":0.0,"sp":"","yt":"EZkufellkew","gen":["doom metal","rock","Metal","Rock"],"hb":["Nubis84"],"da":"Forest of Equilibrium is the debut studio album by British doom metal band Cathedral, released on 14 October 1991 through Earache Records. It is considered a classic of its genre, doom metal. Forest of Equilibrium was notably inducted into Decibel magazine's Hall of Fame in February 2006 being the 12th inductee for the Decibel Hall of Fame. In 2009, Earache Records reissued the album along with four \"bonus\" songs that comprise the long-out-of-print 1992 Soul Sacrifice EP. This deluxe digipak reissue also includes a poster of Dave Patchett's cover art and a new 40-minute documentary entitled \"Return to the Forest\" .","dar":"There is more than one artist with this name.\n\n1) Doom metal band from Coventry, England. The group was formed in 1989 by Lee Dorrian (formerly vocalist of Napalm Death), Mark 'Griff' Griffiths (a Carcass roadie) and Gary 'Gaz' Jennings (previously a member of UK thrashers Acid Reign). The band forged a link between early doom metal and a 1990s extreme metal aesthetic, making doom slower and heavier. Their debut album, Forest Of Equilibrium, is considered a classic of the genre"},{"n":178,"year":1991,"ar":"Oxbow","ti":"King of the Jews","cv":"https://dn711005.ca.archive.org/0/items/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023-4100308832.jpg","rt":0.0,"sp":"","yt":"EUfvCYLscro","gen":["avant-garde","art rock","noise rock","jazz","rock","Rock"],"hb":[],"da":null,"dar":"Oxbow is a long-lived avant-garde band formed in 1988 in San Francisco, California that is notable for their prolific touring and unique sound. Oxbow plays a blend of noise rock, avant-garde jazz, musique concrète (AMG), and blues, creating soundscapes caustic, or plangent, with overtones of paranoia, revulsion, exaltation.\n\nThe first album in 1989 combining the squall of bands like The Birthday Party with elements of free jazz and musique concrète from Oxbow"},{"n":63,"year":1990,"ar":"They Might Be Giants","ti":"Flood","cv":"https://dn710600.ca.archive.org/0/items/mbid-cbae1727-1126-4281-8b0e-36f039bff450/mbid-cbae1727-1126-4281-8b0e-36f039bff450-13886730763.jpg","rt":0.0,"sp":"","yt":"ki1niksBxJE","gen":["alternative rock","blues","comedy rock","rock","Punk","Alternative Rock"],"hb":[],"da":"Flood is They Might Be Giants' third studio album, released in 1990. It was the band's first release on a major label; Elektra Records. Following the success of their second album, Lincoln, the band made the move from the independent label Bar/None Records. .","dar":"They Might Be Giants (TMBG) is an American alternative rock band formed in 1982 in Brooklyn, New York, United States by John Flansburgh (vocals, guitar) and John Linnell (vocals, keyboards, accordion, bass clarinet). During TMBG's early years Flansburgh and Linnell were frequently accompanied by a drum machine. In the early nineties, TMBG became a full band. Currently, the members of TMBG are Flansburgh, Linnell, Marty Beller, Dan Miller, and Danny Weinkauf."},{"n":71,"year":1990,"ar":"Daniel Johnston","ti":"1990","cv":"https://dn721801.ca.archive.org/0/items/mbid-131a1adc-7b82-4ae2-b0e0-178968d63505/mbid-131a1adc-7b82-4ae2-b0e0-178968d63505-24083988632.jpg","rt":0.0,"sp":"","yt":"TcW7VotMwXY","gen":["rock","Electronic","Pop","Alternative Rock"],"hb":[],"da":null,"dar":"Daniel Johnston (born Daniel Dale Johnston in Sacramento, CA, on 22 January 1961; died in Waller, TX, on 10 September 2019) was an American singer-songwriter and visual artist regarded as a significant figure in outsider, lo-fi, and alternative music scenes. Most of his work consisted of cassettes recorded alone in his home, and his music was frequently cited for its \"pure\" and \"childlike\" qualities. His music has been acclaimed by many artists including David Bowie, Sonic Youth, and Simpsons creator Matt Groening."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
