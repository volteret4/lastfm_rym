<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

hrough Ipecac Recordings. It is the band's first album since they broke up in late 2009. The album was released to universal critical acclaim, with many critics naming it one of the best albums of 2018. It marks a significant departure from the band's earlier style, moving away from mathcore towards a more industrial and noise rock influenced sound. The album was met with widespread critical acclaim. At Metacritic, which assigns a normalized rating out of 100 .","dar":"Daughters was an American Mathgrind  (early) / noise rock  (recent) band formed in 2002, in Providence, Rhode Island after the break-up of As the Sun Sets. The band's current line-up consists of vocalist Alexis S.F. Marshall, guitarist Nicholas Andrew Sadler, drummer Jon Syverson, and bassist Samuel Moorehouse Walker. \n\nDaughters' early material was primarily described as grindcore while their later material has been described as noise rock. Sadler"},{"n":79,"year":2008,"ar":"La Dispute","ti":"Somewhere at the Bottom of the River Between Vega and Altair","cv":"https://dn710001.ca.archive.org/0/items/mbid-6c91ff0c-d946-49c4-b4cc-d24b51da9ada/mbid-6c91ff0c-d946-49c4-b4cc-d24b51da9ada-38786027640.jpg","rt":0.0,"sp":"","yt":"ESWuv5x7vsA","gen":["progressive rock","spoken word","punk","post-hardcore","post-rock","emo"],"hb":[],"da":"Somewhere at the Bottom of the River Between Vega and Altair is La Dispute's debut album. Supported by three release shows, it was released on November 11, 2008, simultaneously along with Here, Hear II. through No Sleep Records on both CD and vinyl. The album's title is derived from an Asian folktale, which the album's lyrics loosely follow. The release received positive reviews from notable critics and maintains a legacy in the post-hardcore scene. .","dar":"La Dispute is an American post-hardcore band from Grand Rapids, Michigan, formed in 2004. The current lineup is vocalist Jordan Dreyer, drummer Brad Vander Lugt, guitarist Chad Morgan-Sterenberg, guitarist Corey Stroffolino and bass guitarist Adam Vass. With a firm passion for the concept of music and art as a medium for making new friends, La Dispute makes music that is both artistically, technically, and emotionally engaging in hopes of establishing legitimate connections with any and all interested people"},{"n":5,"year":2000,"ar":"Deftones","ti":"White Pony","cv":"https://dn721900.ca.archive.org/0/items/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679-18321083736.png","rt":0.0,"sp":"","yt":"v1npHeOskdQ","gen":["metal","post-hardcore","shoegaze","alternative metal","post-metal","nu metal"],"hb":[],"da":"White Pony is the third studio album by American alternative metal band Deftones, released on June 20, 2000, through Maverick Records. It was produced by Terry Date, who produced the band's first two albums, Adrenaline and Around the Fur. Recording sessions took place between August and December 1999 at Larrabee Sound Studios in West Hollywood and The Plant Recording Studios in Sausalito, California. The album marked a significant growth in the band's sound, incorporating influences from post-hardcore, trip-hop, shoegaze, progressive rock, and post-rock into the alternative metal sound which they had become known for. White Pony was also the first .","dar":"Deftones is an American metal band from Sacramento, California, formed in 1988, consisting of Chino Moreno (lead vocals and guitar), Stephen Carpenter (guitar), Frank Delgado (keyboards and turntables), and Abe Cunningham (drums and percussion). Vega (formerly of Quicksand) took on bass duties from mid-2009 to ca. 2021 in substitution for Chi Cheng, who was seriously injured in an automobile accident in Santa Clara, California on November 4, 2008."},{"n":7,"year":1998,"ar":"Modest Mouse","ti":"The Lonesome Crowded West","cv":"https://dn710703.ca.archive.org/0/items/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f-33419350946.jpg","rt":0.0,"sp":"","yt":"G33AcZzZ0pM","gen":["alternative rock","indie rock","post-hardcore","midwest emo","Alternative Rock"],"hb":[],"da":"The Lonesome Crowded West is the third album recorded by American indie rock band Modest Mouse (the second released, but Sad Sappy Sucker was recorded before The Lonesome Crowded West and This Is a Long Drive for Someone with Nothing to Think About). The album was released on Up Records on November 18, 1997, on both compact disc and vinyl LP. Many consider the album to be one of the best indie rock albums of the 90s: Pitchfork Media ranked it #29 in their list 100 Greatest Albums of the 1990s, and the song \"Trailer Trash\" number 63 in their .","dar":"Modest Mouse is an American alternative rock band which formed in 1993 in Issaquah, Washington, United States. The band's original lineup consisted of guitarist Isaac Brock, drummer Jeremiah Green and bassist Eric Judy. Since being signed to Sony's Epic Records in 2000, Modest Mouse has attained significant popular success with songs such as \"Float On\" and \"Dashboard.\"\n\nThe band's current configuration is Isaac Brock (vocals, guitar), Tom Peloso (strings, horns, bass, keyboards), Jim Fairchild (guitar), and Eric Judy (bass))."},{"n":153,"year":1997,"ar":"Lungfish","ti":"Indivisible","cv":"https://dn711200.ca.archive.org/0/items/mbid-69446457-af5d-429a-966a-88100370447c/mbid-69446457-af5d-429a-966a-88100370447c-18975811993.jpg","rt":0.0,"sp":"","yt":"G6CJ5x6YMCw","gen":["alternative rock","indie rock","post-hardcore","rock","Rock","Punk"],"hb":[],"da":null,"dar":"Lungfish is a post-hardcore band formed in 1987 in Baltimore, Maryland, United States. All of their music has been released by the Washington, D.C. punk label Dischord except for their first LP, Necklace of Heads which was released by Simple Machines (it was later added to the CD release of Talking Songs for Walking by Dischord).\n\nTheir lineup as of 2005 consists of Daniel Higgs (vocals), Asa Osborne (guitars and vocals), Sean Meadows (bass guitar), and Mitchell Feldstein (drums). Previous bass guitar players are John Chriest and Nathan Bell."},{"n":68,"year":1996,"ar":"Unwound","ti":"Repetition","cv":"https://dn710103.ca.archive.org/0/items/mbid-3af9fdd9-0f7d-41fb-86ea-de388eb18a04/mbid-3af9fdd9-0f7d-41fb-86ea-de388eb18a04-27704596213.jpg","rt":0.0,"sp":"","yt":"xAERndXV0yw","gen":["noise rock","post-punk","punk rock","hardcore punk","post-hardcore","Rock"],"hb":[],"da":"Repetition is the fifth studio album by the American post-hardcore band Unwound, released on April 9, 1996 by Kill Rock Stars. It was recorded in January 1996 at John and Stu's Place in Seattle, Washington and produced by Steve Fisk and John Goodmanson. The album received positive reviews from critics. Repetition was recorded in January 1996 at John and Stu's Place in Seattle, Washington and produced by Steve Fisk and John Goodmanson. The band sought a more \"studio-oriented\" approach than their previous albums and experimented new sounds with keyboards. The word \"Repetition\" was chosen as the album's title because, according .","dar":"Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s"},{"n":48,"year":1994,"ar":"Nirvana","ti":"In Utero","cv":"https://dn710700.ca.archive.org/0/items/mbid-7d13c434-1c49-4d7f-b164-a5247108af01/mbid-7d13c434-1c49-4d7f-b164-a5247108af01-19918667556.jpg","rt":0.0,"sp":"","yt":"GrLUUVfKeUw","gen":["alternative rock","noise rock","punk","post-hardcore","grunge","pigfuck"],"hb":[],"da":"In Utero is the third and final studio album by the American alternative rock band Nirvana, released on September 21, 1993 by DGC Records. Following the success of the group's 1991 breakthrough album Nevermind, Nirvana sought to avoid that album's polished production and hired recording engineer Steve Albini to produce the record. The band recorded In Utero with Albini in two weeks in February 1993, capturing an abrasive and naturalistic sound for the record. While some of the songs had been written years prior, the lyrics largely dealt with frontman Kurt Cobain's reflections on his newfound fame and recent personal .","dar":"There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s."},{"n":42,"year":1994,"ar":"Drive Like Jehu","ti":"Yank Crime","cv":"https://ia800502.us.archive.org/33/items/mbid-883a8c08-4f08-4acc-b2a4-9f2d549ac696/mbid-883a8c08-4f08-4acc-b2a4-9f2d549ac696-23545562962.png","rt":0.0,"sp":"","yt":"02MAcqIvX7w","gen":["noise rock","post-hardcore","math rock","emo","Rock","Punk"],"hb":[],"da":null,"dar":"Drive Like Jehu was an American post-hardcore band from San Diego, California founded in 1990 by Rick Froberg (guitar, vocals), John Reis (guitar), Mike Kennedy (bass), and Mark Trombino (drums). \n\nFroberg and Reis had originally played in Pitchfork, but despite musical similarities, there were some significant changes in the lineup of Drive Like Jehu. Froberg, no longer just a vocalist, picked up a guitar, while Kennedy and Trombino formed the rhythm section of the new band after having played together in Night Soil Man"},{"n":70,"year":1994,"ar":"Unwound","ti":"New Plastic Ideas","cv":"https://dn721608.ca.archive.org/0/items/mbid-03a4f93c-ef8d-4a5a-882b-e1a8515a9768/mbid-03a4f93c-ef8d-4a5a-882b-e1a8515a9768-27704563597.jpg","rt":0.0,"sp":"","yt":"VOloYTXAU_U","gen":["noise rock","post-hardcore","post-rock","emo","emocore","rock"],"hb":[],"da":"New Plastic Ideas is the third recorded studio album by the American post-hardcore band Unwound, (though second released). The album was released on March 21, 1994 by Kill Rock Stars. The album was recorded in between from November 26–28 and December 13, 1993 at Avast! Studios in Seattle, Washington. As pointed out in The Vinyl Factory’s review for the album, New Plastic Ideas is a somewhat a step away from the feedback-ridden sound of its predecessor Fake Train and focuses more on melody and odd time signatures, although the band has stated that this was unintentional. The album's title was .","dar":"Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s"},{"n":101,"year":1994,"ar":"Rodan","ti":"Rusty","cv":"https://dn710705.ca.archive.org/0/items/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb-29575120474.jpg","rt":0.0,"sp":"","yt":"Q_NKtGTstVw","gen":["alternative rock","indie rock","post-hardcore","post-rock","Rock","Punk"],"hb":[],"da":"Rusty is the first and only full-length studio album by American math rock band Rodan. It was released in April 1994 on Quarterstick Records. The album takes its name from its engineer, Bob “Rusty” Weston. Rusty received critical acclaim and has since been cited as an influential album, often compared favorably to Slint’s 1991 album Spiderland. AllMusic writer Ned Raggett said, “this is an album to readily get lost in. The evident variety is another reason to listen, not least because everything is handled so aptly, parts of a greater overall whole.” .","dar":"There are four bands called Rodan:\n\n1) Rodan (1992) emerging from the same circle of musicians that spawned Squirrel Bait and Slint, Rodan formed in 1992 out of a failed high school rap project. Guitarists Jason Noble and Jeff Mueller enlisted Tara Jane O’Neil on bass and a couple of drummers before Kevin Coultas came aboard permanently. After a couple of 7”s and self-released cassettes, Quarterstick released the band’s first and only full-length Rusty in 1994."},{"n":146,"year":1993,"ar":"Girls Against Boys","ti":"Venus Luxure No. 1 Baby","cv":"https://dn710906.ca.archive.org/0/items/mbid-8a4781c1-2032-4897-a21c-037f4b4ff689/mbid-8a4781c1-2032-4897-a21c-037f4b4ff689-13364636275.jpg","rt":0.0,"sp":"","yt":"8CFiF4wY-3U","gen":["alternative rock","indie rock","post-hardcore","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Girls Against Boys are a post-hardcore band, originally forming in Washington DC in 1988 and currently based in New York City.\n\nThe group began as a side project of Eli Janney and Fugazi drummer Brendan Canty. Canty soon left the project and by 1991 Janney had gone on to recruit three former members of D.C. hardcore punk group Soulside - Scott McCloud, Johnny Temple, and Alexis Fleisig - to complete the line-up. Girls Against Boys are perhaps most notable for employing dual bass guitars"},{"n":165,"year":1993,"ar":"Unwound","ti":"Fake Train","cv":"https://dn711104.ca.archive.org/0/items/mbid-a83e740b-8e53-4391-b50a-1bd08b7d06ee/mbid-a83e740b-8e53-4391-b50a-1bd08b7d06ee-27044971526.jpg","rt":0.0,"sp":"","yt":"4EPWEVlSo7Q","gen":["noise rock","post-hardcore","emocore","Rock","Punk"],"hb":[],"da":"Fake Train is the second recorded studio album by the American post-hardcore band Unwound, (the first released, as the self-titled album, Unwound, was recorded first). The album was released on July 7, 1993 by Kill Rock Stars. The album marks the debut of Sara Lund, who became the band’s longest serving and last drummer. While being the first studio album in the band's catalog to be released, and the first LP on Kill Rock Stars, it is actually the second album by the group to be recorded. Their first full-length was recorded in 1992 with drummer Brandt Sandeno, who left .","dar":"Unwound is an American post-hardcore band. Formed in 1988 in Tumwater and Olympia, Washington, the band currently consists of Justin Trosper (vocals, guitar), Jared Warren (bass guitar), Sara Lund (drums), and Scott Seckington (guitar).\n\nOriginally founded by Trosper, bassist Vern Rumsey and drummer Brandt Sandeno under the name \"Giant Henry,\" Sandeno was replaced in 1992 by Lund who performed on their debut album in 1993. Largely based in Olympia throughout the 1990s"},{"n":164,"year":1992,"ar":"Cows","ti":"Cunning Stunts","cv":"https://dn721605.ca.archive.org/0/items/mbid-96ee5e4f-0fc0-423b-b84e-9b57b15b8350/mbid-96ee5e4f-0fc0-423b-b84e-9b57b15b8350-28836082821.jpg","rt":0.0,"sp":"","yt":"m0KQnu22sFc","gen":["noise rock","hardcore punk","post-hardcore","pigfuck","Rock","Punk"],"hb":[],"da":null,"dar":"Cows was an American noise rock band from Minneapolis, Minnesota, formed in 1987 and disbanded in 1998, notorious for their raucous live performances.\n\nThe original line-up consisted of lead singer Shannon Selberg, who later took up the bugle, guitarist Thor Eisentrager, bass guitarist Kevin Rutmanis, and drummer Sandris Rutmanis (soon to be replaced by Norm Rogers). The band had a hardcore sound characterized by blurred guitars, however the Cows took the formula a step further, creating a unique and unconventional style."},{"n":4,"year":1991,"ar":"Slint","ti":"Spiderland","cv":"https://dn711203.ca.archive.org/0/items/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e-11175053947.jpg","rt":0.0,"sp":"","yt":"FAApF-FDkoY","gen":["alternative rock","post-hardcore","post-rock","math rock","Rock","Punk"],"hb":["alberto_gu"],"da":"Spiderland is the second and final studio album by the American rock band Slint. It contains six songs played over 40 minutes, and was released by Touch and Go Records on March 27, 1991. Slint's lineup at the time of recording comprised Brian McMahan on vocals and guitar, David Pajo on guitar, Todd Brashear on bass guitar and Britt Walford on drums. Spiderland was engineered by Brian Paulson and recorded over four days in August 1990. The music and vocal melodies were composed throughout the summer of 1990, while lyrics were written in-studio. Forming in 1986 in Louisville, Kentucky, Slint .","dar":"Slint was an American post-hardcore band consisting of Brian McMahan (guitar and vocals), David Pajo (guitar), Britt Walford (drums), Todd Brashear (bass on Spiderland) and Ethan Buckler (bass on Tweez). They formed in Louisville, Kentucky, United States in 1986. Though they disbanded circa 1991, they are considered to be a major influence on the post-hardcore, math rock, and post-rock scenes.\n\nSlint's first album Tweez was recorded by legendary sound"},{"n":111,"year":1991,"ar":"Drive Like Jehu","ti":"Drive Like Jehu","cv":"https://dn711109.ca.archive.org/0/items/mbid-5425e2d6-004b-40fb-93e6-04c123c04903/mbid-5425e2d6-004b-40fb-93e6-04c123c04903-26755627965.jpg","rt":0.0,"sp":"","yt":"cnSkGoHEmOo","gen":["punk rock","post-hardcore","math rock","Rock","Punk"],"hb":[],"da":null,"dar":"Drive Like Jehu was an American post-hardcore band from San Diego, California founded in 1990 by Rick Froberg (guitar, vocals), John Reis (guitar), Mike Kennedy (bass), and Mark Trombino (drums). \n\nFroberg and Reis had originally played in Pitchfork, but despite musical similarities, there were some significant changes in the lineup of Drive Like Jehu. Froberg, no longer just a vocalist, picked up a guitar, while Kennedy and Trombino formed the rhythm section of the new band after having played together in Night Soil Man"},{"n":129,"year":1991,"ar":"Unsane","ti":"Unsane","cv":"https://dn711107.ca.archive.org/0/items/mbid-df5745b3-5d86-3933-8c62-81c2ae60c836/mbid-df5745b3-5d86-3933-8c62-81c2ae60c836-13458263996.jpg","rt":0.0,"sp":"","yt":"61Xm7hAR-fM","gen":["noise rock","post-hardcore","pigfuck","Metal","Rock","Punk"],"hb":[],"da":null,"dar":"Unsane is a noise rock music trio from New York City. They are generally classified as noise rock, but their music also touches on elements of hardcore punk and metal. The band's self-titled début was released in 1991 and was known for its harsh music and gruesome cover art: a photo of a decapitated man on a New York city subway track, his body still wearing a Members Only jacket.\n\nFinding limited mainstream success, Unsane are nonetheless hugely"},{"n":42,"year":1990,"ar":"Fugazi","ti":"Repeater","cv":"https://dn711108.ca.archive.org/0/items/mbid-ba7338bd-58d5-46cf-b015-255b7491674b/mbid-ba7338bd-58d5-46cf-b015-255b7491674b-8289434727.jpg","rt":0.0,"sp":"","yt":"TEwxwyjTeSw","gen":["post-hardcore","Rock","Punk"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","alberto_gu","sdecandelario"],"da":"Repeater is the debut studio album by American post-hardcore band Fugazi, released on April 19, 1990, via Dischord Records. It was recorded at Inner Ear Studios in Arlington, Virginia, and produced and engineered by Don Zientara and Ted Niceley. .","dar":"Fugazi was an American post-hardcore band formed in Washington, D.C., in 1986. The band consists of guitarists and vocalists Ian MacKaye and Guy Picciotto, bassist Joe Lally, and drummer Brendan Canty. They are noted for their style-transcending music, DIY ethical stance, manner of business practice and contempt for the music industry.\n\nSince its inception, Fugazi has been self-managed and have released almost all their material through Dischord Records, an independent label founded by MacKaye and partner Jeff Nelson in 1980."},{"n":91,"year":1990,"ar":"Bitch Magnet","ti":"Ben Hur","cv":"https://dn710602.ca.archive.org/0/items/mbid-4dec6106-c522-4697-948a-a007c8f3bda1/mbid-4dec6106-c522-4697-948a-a007c8f3bda1-7455291400.jpg","rt":0.0,"sp":"","yt":"NEcn_u0FuV4","gen":["noise rock","indie rock","post-hardcore","math rock","Rock","Punk"],"hb":[],"da":"Ben Hur is the third full-length and final album released by the American post-hardcore band Bitch Magnet. It was recorded after the departure of Bitch Magnet’s added guitarist, David Gait, and features an appearance by the band’s occasional guitarist, David Grubbs. Ben Hur was recorded by Louisville, Kentucky producer Howie Gano who had engineered albums by Grubbs’ previous band, Squirrel Bait. .","dar":"Bitch Magnet was a Post-Hardcore band that formed at Oberlin College in Ohio in 1986; later moving to North Carolina.\n\nThey released their first album, Umber, in 1989; a Post-Hardcore album that would later be considered one of the genre's early exemplars. In 1990, the band released their second and final album, Ben Hur, which would push the boundaries of the genre by blending it with Noise Rock.\n\nThe band's vocalist, Sooyoung Park, and Lexi Mitchell agreed with Superchunk member Mac McCaughan to form the band Seam."},{"n":116,"year":1990,"ar":"Cows","ti":"Effete And Impudent Snobs","cv":"https://dn710700.ca.archive.org/0/items/mbid-cd2ce77a-5702-4b56-8c0f-6b7dbd50844a/mbid-cd2ce77a-5702-4b56-8c0f-6b7dbd50844a-41161662011.jpg","rt":0.0,"sp":"","yt":"MF_ZZJ3EAWU","gen":["noise rock","punk","post-hardcore","Rock","Punk"],"hb":[],"da":"Effete and Impudent Snobs is the third album by the Minneapolis-based noise rock band Cows. It was released on March 23, 1990, by Amphetamine Reptile Records. .","dar":"Cows was an American noise rock band from Minneapolis, Minnesota, formed in 1987 and disbanded in 1998, notorious for their raucous live performances.\n\nThe original line-up consisted of lead singer Shannon Selberg, who later took up the bugle, guitarist Thor Eisentrager, bass guitarist Kevin Rutmanis, and drummer Sandris Rutmanis (soon to be replaced by Norm Rogers). The band had a hardcore sound characterized by blurred guitars, however the Cows took the formula a step further, creating a unique and unconventional style."},{"n":155,"year":1990,"ar":"Helmet","ti":"Strap It On","cv":"https://dn721604.ca.archive.org/0/items/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e-31574430576.jpg","rt":0.0,"sp":"","yt":"_IE0TrzBYzY","gen":["hard rock","indie rock","heavy metal","metal","post-hardcore","alternative metal"],"hb":[],"da":"Strap It On is the first album by Helmet. Originally released in 1990 through Amphetamine Reptile Records, it was subsequently rereleased by Interscope in November 1991. Critics considered the album innovative for its explosive, propulsive, and often staccato riff style which greatly exploited drop D tuning. It has since become a cult classic in underground metal/ post-hardcore. The moody, atmospheric \"Sinatra\" differed from most of the fast-paced, metal-influenced songs on the album; its lyrics featured a paraphrasing of Dean Martin's famous line about the crooner, \"It's Sinatra's world/ We just live in it.\" Accolades Year ↓ Publication ↓ Country ↓ .","dar":"Helmet is an alternative metal band hailing from New York City, with its roots dating back to 1989 when vocalist and lead guitarist Page Hamilton established the group. Throughout its existence, Helmet has undergone numerous lineup changes, yet Hamilton remains the sole consistent member. Since 2010, the band has been comprised of Hamilton, drummer Kyle Stevenson, guitarist Dan Beeman, and bassist Dave Case.\n\nThe discography of Helmet boasts eight studio albums and two compilation albums."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
