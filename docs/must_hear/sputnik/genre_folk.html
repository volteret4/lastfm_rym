<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

<script>
const A = [{"n":185,"year":2023,"ar":"Kara Jackson","ti":"Why Does the Earth Give Us People to Love?","cv":"https://ia801603.us.archive.org/13/items/mbid-36a8798d-9e17-4939-ac21-9a498237f652/mbid-36a8798d-9e17-4939-ac21-9a498237f652-36003907210.png","rt":0.0,"sp":"","yt":"E5_JZrqUWXM","gen":["folk","Rock"],"hb":[],"da":"Why Does The Earth Give Us People To Love? is the debut studio album by American poet, singer, and songwriter Kara Jackson, released on April 14th, 2023 by September Recordings. This is what Kara said about the album: cannot believe this is real and that i get to share it with you all. ive been thinking about music my whole life, been dreaming of doing it since i could conceptualize what it is on this earth i would do. for so much of my life this is a dream i shared with my best friend Maya who is no longer .","dar":"Kara Jackson is an American poet, singer, and songwriter. She is from Oak Park, Illinois. Jackson was named the United States National Youth Poet Laureate from 2019 to 2020. Her work has appeared in POETRY, Frontier Poetry, Rookie Mag, Nimrod Literary Journal, The Lily, and Saint Heron."},{"n":18,"year":2017,"ar":"Mount Eerie","ti":"A Crow Looked at Me","cv":"https://cdn2.albumoftheyear.org/600x0/album/70612-a-crow-looked-at-me_113109.jpg","rt":0.0,"sp":"","yt":"tPzkNS4rits","gen":["folk rock","folk","Alternative Rock"],"hb":["Frikomid","GabredMared","alberto_gu","verygooood"],"da":"WRITTEN AND RECORDED August 31st to Dec. 6th, 2016 in the same room where Geneviève died, using mostly her instruments, her guitar, her bass, her pick, her amp, her old family accordion, writing the words on her paper, looking out the same window. Why share this much? Why open up like this? Why tell you, stranger, about these personal moments, the devastation and the hanging love? Our little family bubble was so sacred for so long. We carefully held it behind a curtain of privacy when we’d go out and do our art and music selves, too special to share, .","dar":"Mount Eerie represents the latest evolution of Phil Elverum's musical vision.  Formerly known as The Microphones, Elverum began Mount Eerie in 2003,  maintaining his previous project's subtle, lo-fi, and lyrically dense fuzz-folk aesthetic.  \n\nElverum explained this change in an 2003 interview with Discorder, asserting that \"Mount Eerie is a new project. The Microphones was completed, or at least at a good stopping point. I did it because I am ready for new things. I am new.\""},{"n":137,"year":2015,"ar":"Hop Along","ti":"Painted Shut","cv":"https://cdn2.albumoftheyear.org/600x0/album/2015/29100-painted-shut.jpg","rt":0.0,"sp":"","yt":"9gTRzFmwy-8","gen":["folk","indie rock","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Hop Along are an American rock band from Philadelphia, Pennsylvania, formerly known as Hop Along, Queen Ansleis. \n\nThe band began as an acoustic freak-folk solo project Hop Along, Queen Ansleis in 2004, during Frances Quinlan's senior year in high school. The album Freshman Year was released in the summer of 2005. Three years later, in 2008, drummer Mark Quinlan (Frances Quinlan's brother) joined the project, followed by bassist Tyler Long in 2009."},{"n":161,"year":2014,"ar":"Grouper","ti":"Ruins","cv":"https://cdn2.albumoftheyear.org/600x0/album/2014/18864-ruins.jpg","rt":0.0,"sp":"","yt":"GJgXdSVFnJE","gen":["folk","dream pop","post-rock","minimalism","impressionism","rain sounds"],"hb":[],"da":"\"Ruins\" was made in Aljezur, Portugal in 2011 on a residency set up by Galeria Zé dos Bois. I recorded everything there except the last song, which I did at mother's house in 2004. I'm still surprised by what I wound up with. It was the first time I'd sat still for a few years; processed a lot of political anger and emotional garbage. Recorded pretty simply, with a portable 4-track, Sony stereo mic and an upright piano. When I wasn't recording songs I was hiking several miles to the beach. The path wound through the ruins of several old .","dar":"Grouper is the solo project of American musician, artist and producer Liz Harris (born July 15, 1980). She has released material on her own label and other independent labels since 2005. Grouper released the critically acclaimed Dragging a Dead Deer Up a Hill in 2008, followed by six more records, including a two-part album, A I A, and the piano-led album Ruins. Her twelfth album, Shade, was released in 2021.\n\nHarris was born July 15, 1980, in Northern California and grew up around the San Francisco Bay area."},{"n":99,"year":2013,"ar":"Chelsea Wolfe","ti":"Pain Is Beauty","cv":"https://dn710907.ca.archive.org/0/items/mbid-8425af95-054b-4342-9e9c-33407f25a3fd/mbid-8425af95-054b-4342-9e9c-33407f25a3fd-9426683785.jpg","rt":0.0,"sp":"","yt":"puM-dX__pK0","gen":["experimental rock","avant-garde","folk","gothic rock","dark wave","ethereal wave"],"hb":[],"da":null,"dar":"Chelsea Wolfe (born Chelsea Joy Wolfe on November 14, 1983) is an American singer-songwriter and musician from Roseville, California. Her work blends elements of gothic rock, doom metal, folk, and darkwave, often described as \"doom folk\" and \"drone-metal-art-folk.\" Growing up in Northern California with a country musician father who owned a home studio, Wolfe began writing poetry at age 7 and recording songs by age 9, which she later described as \"basically Casio-based gothy R&B songs.\""},{"n":116,"year":2011,"ar":"Bon Iver","ti":"Bon Iver, Bon Iver","cv":"https://cdn2.albumoftheyear.org/600x0/album/2479-bon-iver-bon-iver_013505.jpg","rt":0.0,"sp":"","yt":"8bIALq5Wi-I","gen":["folk rock","folk","baroque pop","indie rock","indie folk"],"hb":[],"da":"The name ‘Bon Iver’ is derived from the French for ‘good winter.’ The album was recorded in Justin Vernon’s home town of Eau Claire in Wisconsin, where the temperature rarely rises above freezing in winter. The Calgary Songfacts reports that Vernon told UK newspaper The Sun naming it Bon Iver shows he’s accepting winter is a big part of the album. .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":200,"year":2011,"ar":"Jenny Hval","ti":"Viscera","cv":"https://dn710705.ca.archive.org/0/items/mbid-6bf70e0f-0b90-43d3-8463-42f033c7e471/mbid-6bf70e0f-0b90-43d3-8463-42f033c7e471-2410128207.jpg","rt":0.0,"sp":"","yt":"ai1ZS4GCDUU","gen":["folk"],"hb":[],"da":null,"dar":"Jenny Hval (b. 1980) has in recent years made a name for herself as a writer, journalist, recording artist and sound artist both in Norway and abroad. Her first two albums were released as Rockettothesky. When her third record Viscera was released in 2011, Italian Vogue described her as: “an artist of significant competence, both musically and intellectually.” Multidisciplinary and transgressive are words often employed to describe her art, but Jenny Hval’s polyphonic artistry is in fact seamlessly interwoven between musical"},{"n":11,"year":2007,"ar":"Bon Iver","ti":"For Emma, Forever Ago","cv":"https://ia801906.us.archive.org/19/items/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51/mbid-f2d4a53b-0612-48e2-a09c-02489ae27a51-11344065108.jpg","rt":0.0,"sp":"","yt":"AaUQ6ToaPqw","gen":["folk rock","folk","contemporary folk","baroque pop","country","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","sdecandelario"],"da":"For Emma, Forever Ago is the debut album from Wisconsin band Bon Iver. It was self-released in 2007 and received wider release on the Jagjaguwar label in February 2008 (and on the 4AD label in the UK in May 2008). The album was widely acclaimed, receiving spots on critics' end-of-the-year lists, as well as several awards. Following the break-up of his previous band DeYarmond Edison, Justin Vernon, suffering from mononucleosis, secluded himself in a cabin in Medford, Wisconsin for three months planning to \"hibernate.\" Three months of solitude resulted in the creation of For Emma, Forever Ago. \"All of his .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":10,"year":2006,"ar":"Joanna Newsom","ti":"Ys","cv":"https://dn711106.ca.archive.org/0/items/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16-9262812691.jpg","rt":0.0,"sp":"","yt":"cJ1yFhjRnNc","gen":["avant-garde","folk","alternative rock","chamber folk","baroque pop","country"],"hb":[],"da":"Ys is the second studio album by American musician Joanna Newsom. It was released by Drag City on November 6, 2006. The album was produced by Newsom and Van Dyke Parks, recorded by Steve Albini, mixed by Jim O'Rourke, with accompanying orchestral arrangements by Van Dyke Parks. It features guest vocals from Bill Callahan and Emily Newsom. The vocals and harp were recorded at The Village Recording Studio in Los Angeles in December 2005, with the orchestration being recorded between May and June 2006 at the Entourage Studios in Los Angeles. The album consists of five tracks with song durations .","dar":"Joanna Caroline Newsom is an American singer, songwriter, musician and actress. Born and raised in Northern California, Newsom was classically trained on the harp in her youth and began her musical career as a keyboardist in the San Francisco-based indie band The Pleased.\n\nAfter recording and self-releasing two EPs in 2002, Newsom was signed to the independent label Drag City. Her debut album, The Milk-Eyed Mender, was released in 2004 to critical acclaim and garnered Newsom an underground following."},{"n":24,"year":2006,"ar":"Natural Snow Buildings","ti":"The Dance of the Moon and the Sun","cv":"https://cdn2.albumoftheyear.org/600x0/album/25188-the-dance-of-the-moon-and-the-sun_215349.jpg","rt":0.0,"sp":"","yt":"eu4EZJ3SAqM","gen":["avant-garde","folk","drone","Metal","Rock"],"hb":[],"da":"The Dance of the Moon and the Sun is the third studio album by French Avant-Folk duo Natural Snow Buildings, released in 2006 as a limited-edition CD-R on their Students of Decay imprint. The Dance of the Moon and the Sun includes heavily processed guitar tones, haunting vocals, and subtle field recordings. The album is usually noted as being emotionally sombre. Since its release, the album has developed a small but devoted cult following among music forums, with original CD-R copies fetching high prices on resell sites. .","dar":"Natural Snow Buildings is a duo from Vitré, France, consisting of artists Mehdi Ameziane and Solange Gularte. They play music which can be classified as experimental,  psychedelic folk with drone elements and ambient influences. Formed in 1997, they have released numerous albums, many of them in extremely limited quantities. \n\nBoth members of Natural Snow Buildings record as solo artists: Mehdi Ameziane as TwinSisterMoon and Solange Gularte as Isengrind."},{"n":112,"year":2002,"ar":"Neko Case","ti":"Blacklisted","cv":"https://dn710607.ca.archive.org/0/items/mbid-42dc5167-670f-4454-bfdb-709264c7e1c2/mbid-42dc5167-670f-4454-bfdb-709264c7e1c2-19556935488.png","rt":0.0,"sp":"","yt":"Dlg_yXziyLU","gen":["folk","country rock","alternative rock","country","indie rock","Rock"],"hb":[],"da":null,"dar":"Neko Case (born September 8, 1970, in Alexandria, Virginia) is an American singer and songwriter, best known for her solo career and her contributions as a member of the Canadian indie rock group The New Pornographers.\n\nCase moved around often as a child, spending the largest part of her youth in Tacoma, Washington. She left her parents at age 15 and three years later she started playing drums for several bands around the Northwest's punk rock scene."},{"n":116,"year":1998,"ar":"Lucinda Williams","ti":"Car Wheels on a Gravel Road","cv":"https://dn710807.ca.archive.org/0/items/mbid-386ec7ec-d3de-42d4-b5ac-71a0b547d384/mbid-386ec7ec-d3de-42d4-b5ac-71a0b547d384-2259638888.jpg","rt":0.0,"sp":"","yt":"PnZpumPCgBE","gen":["folk","country","Rock"],"hb":[],"da":"Car Wheels on a Gravel Road is the fifth studio album by Lucinda Williams. It was recorded and co-produced by Williams in Nashville, Tennessee and Canoga Park, California, before being released on June 30, 1998, by Mercury Records. The album features guest appearances by Steve Earle and Emmylou Harris. .","dar":"Lucinda Williams (born January 26, 1953) is an American rock, folk, and alt-country songwriter and singer. A three-time Grammy Award winner, she was named \"America's best songwriter\" by TIME magazine in 2002.\n\nWilliams has garnered considerable critical acclaim but her commercial success has been moderate. She has a reputation as a perfectionist and as a slow worker when it comes to recording; six years passed between the release of her second and third albums."},{"n":155,"year":1998,"ar":"Manu Chao","ti":"Clandestino","cv":"https://dn710909.ca.archive.org/0/items/mbid-14dd5d50-34b9-4488-b87f-a79b5a6b52f5/mbid-14dd5d50-34b9-4488-b87f-a79b5a6b52f5-6051149256.jpg","rt":0.0,"sp":"","yt":"DOs5lmxDo74","gen":["folk","latin","latin rock","pop","pachanga","Alternative Rock"],"hb":["GabredMared","Nubis84","alberto_gu","sdecandelario"],"da":"Clandestino is the first full-length solo album by Manu Chao, released in 1998. The album contains many soundbites throughout, two of which are bits of a speech by Subcomandante Marcos. The French edition of Rolling Stone magazine named this album the 67th greatest French rock album (out of 100). The album was also included in the book 1001 Albums You Must Hear Before You Die. Tracklist 01. Clandestino (Spanish) 2:30 02. Desaparecido (Spanish) 3:47 03. Bongo Bong (English) 2:38 04. Je ne t'aime plus (French) 2:02 05. Mentira ... (Spanish) 4:37 06. Lágrimas de Oro (Spanish) 2:57 07. Mama Call .","dar":"Manu Chao, born José-Manuel Thomas Arthur Chao on June 21, 1961, in Paris, France, is a multifaceted musician celebrated for his eclectic musical style and socially conscious lyrics. Chao's musical journey began in the vibrant Parisian music scene, where he immersed himself in diverse influences ranging from punk and rock to reggae and salsa. Co-founding the band Mano Negra in 1987, Chao showcased his knack for blending genres, resulting in international acclaim with albums like \"Patchanka\" (1988) and \"Casa Babylon\" (1994)."},{"n":184,"year":1997,"ar":"Paul McCartney","ti":"Flaming Pie","cv":"https://dn710103.ca.archive.org/0/items/mbid-3dec33d8-f1fd-473a-a49a-1f2a35af6820/mbid-3dec33d8-f1fd-473a-a49a-1f2a35af6820-43733776847.png","rt":0.0,"sp":"","yt":"tmQruAOp0T4","gen":["folk","pop rock","Rock","Pop"],"hb":[],"da":"Flaming Pie is an album by Paul McCartney, first released in 1997. His first studio album in over four years, it was mostly recorded following McCartney's involvement in the highly successful The Beatles Anthology project. In Flaming Pie's liner notes Mc Cartney said: \"(Anthology) reminded me of The Beatles' standards and the standards that we reached with the songs. So in a way it was a refresher course that set the framework for this album.\" Beginning in February 1995, McCartney teamed up with Jeff Lynne, Electric Light Orchestra lead singer and guitarist, an ardent Beatles fan who had previously worked .","dar":"Sir James Paul McCartney CH MBE (born 18 June 1942) is an English singer, songwriter, musician, and record and film producer who gained worldwide fame as co-lead vocalist and bassist for the Beatles. His songwriting partnership with John Lennon remains the most successful in history. After the group disbanded in 1970, he pursued a solo career and formed the band Wings with his first wife, Linda, and Denny Laine.\n\nA self-taught musician, McCartney is proficient on bass, guitar, keyboards, and drums."},{"n":176,"year":1996,"ar":"Gillian Welch","ti":"Revival","cv":"https://dn710202.ca.archive.org/0/items/mbid-769578b3-5603-407e-93d6-c689e2d43e5a/mbid-769578b3-5603-407e-93d6-c689e2d43e5a-6211960520.jpg","rt":0.0,"sp":"","yt":"0pHnbDFeezA","gen":["folk rock","folk","country rock","alternative country","Rock"],"hb":[],"da":"Revival is the first album by American singer-songwriter Gillian Welch, released on April 9, 1996. Revival was nominated for the 1997 Grammy Award for Best Contemporary Folk Album. .","dar":"Gillian Howard Welch (born October 2, 1967) is an American singer-songwriter. She performs with her musical partner, guitarist David Rawlings. Their sparse and dark musical style, which combines elements of Appalachian music, bluegrass, country and Americana, is described by The New Yorker as \"at once innovative and obliquely reminiscent of past rural forms.\"\n\nWelch and Rawlings have collaborated on seven critically acclaimed albums, five released under her name, and two released under the name Dave Rawlings Machine."},{"n":64,"year":1990,"ar":"Paul Simon","ti":"The Rhythm of the Saints","cv":"https://dn710605.ca.archive.org/0/items/mbid-fa1d8308-47d4-33af-b377-ecb27483fb2d/mbid-fa1d8308-47d4-33af-b377-ecb27483fb2d-24020454806.jpg","rt":0.0,"sp":"","yt":"pIjjy1BxA4s","gen":["folk rock","folk","pop rock","Rock","Pop"],"hb":[],"da":"The Rhythm of the Saints is the eighth solo studio album by American singer-songwriter Paul Simon, released on October 16, 1990 on Warner Bros. Following the success of 1986's Graceland, on which he worked principally with South African musicians, Simon broadened his interests in diverse forms of music from around the world. He turned to Latin America for the musicians and rhythms which characterize much of this album, partnering with Afro-Brazilian superstars Grupo Cultural Olodum, masters of the heavily percussive sub-style of samba called Batuque or Batucada. The group's drumming is featured on the opening song and first single, \"The .","dar":"Paul Frederic Simon (born October 13, 1941) is an American singer-songwriter. One of the most celebrated artists of the twentieth century, Simon's career has spanned six decades. Born in New Jersey, Simon grew up in the borough of Queens in New York City and developed an interest in rock music in his teens.\n\nHe began performing with his schoolfriend Art Garfunkel in 1956; together the two came to prominence in the 1960s as Simon & Garfunkel. The duo's blend of folk and rock music in hits like \"The Sound of Silence\", \"Mrs."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
