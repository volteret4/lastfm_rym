<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

y of producers, including DJ Quik, Johnny \"J\", Dr. Dre, Rick Rock, Daz Dillinger, DJ Pooh, DeVante Swing, among others. The album includes the Billboard .","dar":"Tupac Amaru Shakur (born Lesane Parish Crooks; June 16, 1971 – September 13, 1996), known professionally as 2Pac and later as Makaveli, was an American rapper and actor. He is regarded as one of the most influential and successful rappers of all time and as a prominent political and cultural figure in late 20th-century America. Shakur sold more than 75 million records worldwide, making him one of the best-selling music artists in history. His work often addressed themes of social injustice"},{"n":25,"year":1992,"ar":"The Pharcyde","ti":"Bizarre Ride II the Pharcyde","cv":"https://dn710202.ca.archive.org/0/items/mbid-1c6f2a35-4288-4f5d-9eec-97ca32e2a226/mbid-1c6f2a35-4288-4f5d-9eec-97ca32e2a226-32304157771.jpg","rt":0.0,"sp":"","yt":"hAaQDxpv5X8","gen":["alternative hip hop","hip hop","boom bap","west coast hip hop","Jazz","Hip-Hop"],"hb":[],"da":"Bizarre Ride II the Pharcyde is the debut album by alternative hip-hop group The Pharcyde, released on November 24, 1992 through Delicious Vinyl Records. The album is produced by former group member J-Swift, and features only one guest appearance, provided by little-known Los Angeles rapper Bucwheed (known then as \"Buckwheat\" from The Wascals). In the years after its release, Bizarre Ride was hailed by critics and alternative rap fans and appeared in \"best albums\" lists in several publications. Released during the dominant Gangsta rap era of West Coast hip-hop, Bizarre Ride was described as \"refreshing,\" due to its playful, light-hearted .","dar":"The Pharcyde (pronounced \"Far Side\") is an American alternative hip-hop group, formed in 1989, from South Central Los Angeles. The original four members of the group are Imani (Emandu Wilcox), Slimkid3 (Trevant Hardson), Bootie Brown (Romye Robinson), and Fatlip (Derrick Stewart). DJ Mark Luv was the group's first disc jockey (DJ), followed by producer J-Swift and then J Dilla.\n\nThe group is perhaps best known for the hit singles \"Drop\", \"Passin' Me By\" and \"Runnin''\", as well as their first album, Bizarre Ride II the Pharcyde."},{"n":37,"year":1992,"ar":"Dr. Dre","ti":"The Chronic","cv":"https://ia800305.us.archive.org/6/items/mbid-0001a90e-252d-3af0-8e1c-173c1c4835c3/mbid-0001a90e-252d-3af0-8e1c-173c1c4835c3-38739120180.jpg","rt":0.0,"sp":"","yt":"lFz7oEmabnE","gen":["hip hop","west coast hip hop","g-funk","gangsta rap","Hip-Hop"],"hb":[],"da":"\"The Chronic\" is the solo debut album of American hip hop artist Dr. Dre, released December 15, 1992, on his own record label Death Row Records, and distributed by Priority Records. Recording sessions for the album took place in June 1992 at Death Row Studios in Los Angeles and at Bernie Grundman Mastering in Hollywood. The album is named after a slang term for high-grade marijuana, and its cover is an homage to Zig-Zag rolling papers. It was recorded by Dr. Dre following his departure from hip hop group N.W.A in April of 1991 and its label Ruthless Records over .","dar":"André Romelle Young (born February 18, 1965 in Los Angeles, California), better known by his stage name Dr. Dre, is an American record producer, rapper, actor and record executive. He is the founder and current CEO of Aftermath Entertainment and a former co-owner and artist of Death Row Records, also having produced albums for and overseeing the careers of many rappers signed to those record labels. As a producer he is credited as a key figure in the popularization of West Coast G-funk"},{"n":84,"year":1992,"ar":"Ice Cube","ti":"The Predator","cv":"https://dn721606.ca.archive.org/0/items/mbid-c9950c2d-0f35-48cc-8a59-afa7933d0ddf/mbid-c9950c2d-0f35-48cc-8a59-afa7933d0ddf-10031621370.jpg","rt":0.0,"sp":"","yt":"bZP7ssNDsHY","gen":["hip hop","conscious hip hop","west coast hip hop","gangsta rap","hardcore hip hop","political hip hop"],"hb":[],"da":"The Predator is the third studio album by Ice Cube. Released within months of the 1992 Los Angeles riots, many songs comment on the racial tensions. The title is in part reference to the movie Predator 2, and the album itself includes samples from the film. Though not his most critically successful album, commercially The Predator is Ice Cube's most successful album, reaching double platinum status in the United States, and it contains his most well-known single, \"It Was a Good Day.\" The Predator is his only number one album on the Billboard 200 to date, selling 193,000 copies in .","dar":"O'Shea Jackson Sr. (born June 15, 1969), known professionally as Ice Cube, is an American rapper and actor. He began his career as a member of the hip-hop group C.I.A. and later joined the seminal rap group N.W.A (Niggaz Wit Attitudes). After leaving N.W.A in December 1989, he began both a successful solo music career and an acting career which included roles in films such as Boyz n the Hood (1991), Friday (1995), for which he also co-wrote the screenplay, and Barbershop (2002)."},{"n":28,"year":1991,"ar":"Cypress Hill","ti":"Cypress Hill","cv":"https://dn710602.ca.archive.org/0/items/mbid-5cf63bca-a3b2-3694-ad13-900809e41367/mbid-5cf63bca-a3b2-3694-ad13-900809e41367-8769285126.jpg","rt":0.0,"sp":"","yt":"iu6Wkf-y1t4","gen":["alternative hip hop","hip hop","boom bap","west coast hip hop","gangsta rap","hardcore hip hop"],"hb":[],"da":"Cypress Hill is the self titled debut album of Cypress Hill, released in August 1991. It was both critically and commercially hailed eventually allowing it to be certified double Platinum by the RIAA. It was known for its funk/rock-sampled beats as well as marijuana advocation lyrics. Steve Huey of Allmusic calls Cypress Hill's debut \"a sonic blueprint that would become one of the most widely copied in hip-hop.\" Rolling Stone calls it \"an album that is innovative and engaging in spite of its hard-core messages.\" In 1998, the album was selected as one of The Source Magazine's 100 Best Rap .","dar":"Cypress Hill is an American hip-hop group from South Gate, California. Cypress Hill was the first latino group to have platinum and multi-platinum albums and one of the first rap groups to gain a following with fans of hard rock and metal. The band was originally called DVX, but the name was changed after Mellow Man Ace left in 1988.\n\nTheir first album, which was self-titled, was released in August 1991. Its single was \"Phuncky Feel One\", but it was"},{"n":37,"year":1991,"ar":"Ice Cube","ti":"Death Certificate","cv":"https://cdn2.albumoftheyear.org/600x0/album/14020-death-certificate.jpg","rt":0.0,"sp":"","yt":"eDZtBm52Xmo","gen":["hip hop","west coast hip hop","gangsta rap","hardcore hip hop","Hip-Hop"],"hb":[],"da":"Death Certificate is the second studio album by rapper Ice Cube, released October 31, 1991 on Priority Records. Highly anticipated with over a million advance orders, the album was certified platinum in sales on December 20, 1991. The album debuted on the Top R&B/Hip-Hop Albums chart at #1 and on the Billboard 200 chart at #2, while it went on to sell over two million copies to date. It is considered one of the greatest hip hop albums of all time. It was also the source of much controversy due to some of its racially charged content, and Ice Cube's .","dar":"O'Shea Jackson Sr. (born June 15, 1969), known professionally as Ice Cube, is an American rapper and actor. He began his career as a member of the hip-hop group C.I.A. and later joined the seminal rap group N.W.A (Niggaz Wit Attitudes). After leaving N.W.A in December 1989, he began both a successful solo music career and an acting career which included roles in films such as Boyz n the Hood (1991), Friday (1995), for which he also co-wrote the screenplay, and Barbershop (2002)."},{"n":99,"year":1990,"ar":"Digital Underground","ti":"Sex Packets","cv":"https://dn711105.ca.archive.org/0/items/mbid-34c8e525-24fa-332a-a439-25e0f46fa59a/mbid-34c8e525- const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
