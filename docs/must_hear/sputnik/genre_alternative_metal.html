<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

nd Meshuggah. It was released on 9 November 1998 by Nuclear Blast, and is the only studio album to feature bassist Gustaf Hielm. Chaosphere's sound shows the band toning down some of the thrash style of their previous releases in favor of the technical, polyrhythmic, groove-oriented sound they would continue to explore on subsequent albums. A video was made for \"New Millennium Cyanide Christ\". Jens Kidman – vocals Fredrik Thordendal – lead guitar, keyboards Mårten Hagström – rhythm guitar Gustaf Hielm – bass Tomas Haake – drums, vocals (tracks 6–7, .","dar":"Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records."},{"n":42,"year":1996,"ar":"Eyehategod","ti":"Dopesick","cv":"https://dn710602.ca.archive.org/0/items/mbid-72e57b50-67a3-4689-ac55-342e4341f697/mbid-72e57b50-67a3-4689-ac55-342e4341f697-19427677722.jpg","rt":0.0,"sp":"","yt":"tN-kUW39jWM","gen":["punk","heavy metal","doom metal","alternative metal","sludge metal","Metal"],"hb":[],"da":"Dopesick is the third studio album by New Orleans sludgecore band Eyehategod, released on April 2, 1996. It was reissued in 2006 as part of Century Media's 20th Anniversary series with three bonus tracks that were recorded during the original Dopesick recording sessions. The recording sessions were infamously chaotic, and involved the studio owner reportedly calling Century Media to ask if the band was mentally unstable, and threatening to kick them out. This particular incident occurred after Mike Williams had attempted to record the sound of smashing glass for the introduction to the album, by smashing a bottle on the .","dar":"Eyehategod (also abbreviated and often referred to as EHG) is an American sludge band from New Orleans, Louisiana, which formed in 1988.  The band is known for their dark, sludgy riffs combined with equally dark lyrics. Along with Melvins and Crowbar they are often considered one of the pioneers of the sludge metal genre.\n\nEyehategod have noted Melvins, Black Sabbath, Black Flag, Saint Vitus, Carnivore, Swans and Flipper as key influences to their sound."},{"n":167,"year":1996,"ar":"Marilyn Manson","ti":"Antichrist Superstar","cv":"https://dn721509.ca.archive.org/0/items/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8-21167273304.jpg","rt":0.0,"sp":"","yt":"tHI1uEQLjCk","gen":["alternative rock","hard rock","heavy metal","industrial rock","industrial metal","alternative metal"],"hb":["Frikomid","Lonsonxd"],"da":"Antichrist Superstar is the second studio album by American rock band Marilyn Manson, released on October 8, 1996, by Nothing and Interscope Records. It was recorded at Nothing Studios in New Orleans and produced by the band's eponymous vocalist along with Sean Beavan, former Skinny Puppy producer Dave Ogilvie and Trent Reznor of Nine Inch Nails. The recording of the album was marred by excessive drug use, which provoked a high level of antagonism between band members. Consequently, it was their last release to feature contributions from founding guitarist Daisy Berkowitz, who acrimoniously quit partway through recording. .","dar":"Marilyn Manson is an American rock band formed in Fort Lauderdale, Florida, in 1989 by vocalist Marilyn Manson and guitarist Daisy Berkowitz. Initially performing under the name Marilyn Manson & the Spooky Kids, the group gained a local following in South Florida during the early 1990s through their theatrical and provocative live performances. In 1993, they became the first act signed to Trent Reznor’s Nothing Records label. Until 1996, each band"},{"n":4,"year":1994,"ar":"Nine Inch Nails","ti":"The Downward Spiral","cv":"https://ia601606.us.archive.org/7/items/mbid-2d410836-5add-3661-b0b0-168ba1696611/mbid-2d410836-5add-3661-b0b0-168ba1696611-2546761764.jpg","rt":0.0,"sp":"","yt":"fnw_UbJmmbY","gen":["alternative rock","art rock","industrial","industrial rock","industrial metal","alternative metal"],"hb":["BipolarMuzik","EliasJ72","Frikomid","GabredMared","Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"The Downward Spiral (also known as Halo 8) is Nine Inch Nails' second studio album, though it is largely considered the third major release after the Broken EP, which consisted of entirely new material. It was released on March 8, 1994. It is likely the most acclaimed and well-known of the band's discography, and is said to have brought \"industrial\" music to the mainstream. A collection featuring remixes from The Downward Spiral was released as Further Down The Spiral on June 1, 1995. Inspiration Trent Reznor has stated in various interviews some of the ideas and inspiration behind the album: .","dar":"Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated"},{"n":7,"year":1994,"ar":"Kyuss","ti":"Welcome To Sky Valley","cv":"https://dn710903.ca.archive.org/0/items/mbid-6205da21-55a9-457d-aa85-2f1262e25694/mbid-6205da21-55a9-457d-aa85-2f1262e25694-8267363147.jpg","rt":0.0,"sp":"","yt":"RxOTKRoPhIo","gen":["hard rock","heavy metal","stoner rock","alternative metal","stoner metal","desert rock"],"hb":[],"da":"Welcome to Sky Valley is the third studio album by American stoner rock/metal band Kyuss, originally released on June 28, 1994. Kyuss was recorded in early 1993 and scheduled for release in January 1994. They sneak-previewed the completed album at Foundations Forum 93 and contributed the song \"Demon Cleaner\" to the sampler disc. Due to mild success from their previous album, Kyuss had been promoted from their subsidiary record label \"Dali\" to the main label \"Chameleon.\" On November 11, 1993 Chameleon Records abruptly shut down. Their joint-venture partner Elektra quickly picked up the band and scheduled the album for release .","dar":"Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\"."},{"n":13,"year":1994,"ar":"Soundgarden","ti":"Superunknown","cv":"https://dn720709.ca.archive.org/0/items/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c-2236678397.jpg","rt":0.0,"sp":"","yt":"fELbXTDl5Ao","gen":["psychedelic rock","alternative rock","hard rock","stoner rock","grunge","alternative metal"],"hb":["Frikomid","Lonsonxd","sdecandelario"],"da":"Superunknown is the fourth album by the American grunge band Soundgarden. It was released on March 8, 1994 through A&M Records. The band began work on the album after touring in support of its previous album, Badmotorfinger. The resulting album captured the creativity and heaviness of the band's earlier releases while displaying a more diverse range of influences. The album was a critical and commercial success and became the band's breakout album. It peaked at number one on the Billboard 200 and reached high positions on charts worldwide. Five singles were released from the album: The Day I Tried to .","dar":"Soundgarden was an American rock band formed in Seattle, Washington, in 1984 by singer and drummer Chris Cornell, lead guitarist Kim Thayil, and bassist Hiro Yamamoto. Cornell switched to rhythm guitar in 1985, and the drum position was taken over first by Scott Sundquist and then by Matt Cameron in 1986. Yamamoto departed in 1989 and was replaced briefly by Jason Everman before Ben Shepherd joined later that year. Soundgarden disbanded in 1997 and reunited in 2010."},{"n":32,"year":1993,"ar":"Type O Negative","ti":"Bloody Kisses","cv":"https://dn710802.ca.archive.org/0/items/mbid-5efc784b-f2af-4ee4-81af-1217b9ab39e0/mbid-5efc784b-f2af-4ee4-81af-1217b9ab39e0-8508508162.jpg","rt":0.0,"sp":"","yt":"mVvtm52_0IA","gen":["gothic rock","heavy metal","gothic metal","alternative metal","Metal"],"hb":["Nubis84","sdecandelario"],"da":"\"Bloody Kisses\" is the third album by Brooklyn band Type O Negative. It marked significant stylistic growth for the band in terms of songwriting and production values, and it is also the last recording to feature Sal Abruscato on drums. The album further established Type O Negative motifs, such as including cover songs restylized into gloomy gothic doom, featuring sample-heavy soundscapes in between songs, and dry, satirical humor. This album includes a cover of the Seals and Crofts song \"Summer Breeze\". The most successful single from \"Bloody Kisses\" was the song \"Black No.1 (Little Miss Scare-All)\", which poked fun at .","dar":"Type O Negative was a gothic metal / doom metal band formed in Brooklyn, New York, US in 1990. They are well known for their dry, morbid and ironic sense of humor and their often slow and brooding music. \"The Drab Four\" (the nickname Type O Negative gave themselves) always succeeded in keeping their own unique style, mixing melodic, classic rock 'n' roll with slow, doom-like vibes, and down-tuned heavy metal guitar riffs with dark soundscapes. They were also known for doom metal riffs"},{"n":171,"year":1993,"ar":"Primus","ti":"Pork Soda","cv":"https://dn710800.ca.archive.org/0/items/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d-28985005149.png","rt":0.0,"sp":"","yt":"K8WGVYxG5Ng","gen":["alternative rock","funk rock","heavy metal","alternative metal","funk metal","Alternative Rock"],"hb":[],"da":"Pork Soda is the third album by Primus. Released in 1993, \"Pork Soda\" is considerably darker than any of the band's earlier efforts, dealing with murder (\"My Name Is Mud\"), dissatisfaction with the human race (\"Nature Boy\", \"Welcome to This World\"), suicide (\"Bob\"), and inconvenient realities of life (\"DMV\"). It was a certified Gold record shortly after its release and is currently certified Platinum; it is Primus' largest seller to date. Track listing # Title Length 1. \"Pork Chop's Little Ditty\" 0:21 2. \"My Name Is Mud\" 4:48 3. \"Welcome to This World\" 3:40 4. \"Bob\" 4:40 5. \"DMV\" 4:58 .","dar":"Primus is a San Francisco-based alternative rock band formed in the mid-1980s by bassist Les Claypool and guitarist Todd Huth. Les (vocals and bass guitar) has been the only constant member. They have had two guitar players (although Larry has held onto the role for the past 30 years) and many different drummers (although Tim Alexander, Bryan Mantia and Jay Lane were the only ones who recorded with the band) in the past. \n\nTheir music has proven difficult to define; while usually considered by critics to be funk metal or alternative metal"},{"n":17,"year":1992,"ar":"Sepultura","ti":"Arise","cv":"https://dn710907.ca.archive.org/0/items/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057-19192586880.jpg","rt":0.0,"sp":"","yt":"XLaArdvo9-U","gen":["heavy metal","metal","alternative metal","progressive metal","death metal","thrash metal"],"hb":["Lonsonxd","sdecandelario"],"da":"Arise is the fourth studio album by Brazilian thrash metal band Sepultura, released in 1991 through Roadrunner Records. Upon its release, the album received top reviews from heavy metal magazines such as Rock Hard, Kerrang! and Metal Forces. Arise is considered Sepultura's finest hour among longtime fans. While the music on Arise was mostly in the same death/thrash style as their previous album, Beneath the Remains, it was clear that the Sepultura sound was acquiring an experimental edge. The album presented their first incursions with industrial music, hardcore punk and latin percussion. The tour (1990-1992) that supports the album has .","dar":"Sepultura (Portuguese word for \"Grave\") is a Brazilian metal band from Belo Horizonte. Formed in 1984 by brothers Max and Igor Cavalera, the band was a major force in the groove metal, thrash metal, and death metal genres during the late 1980s and early 1990s, with their later experiments drawing influence from alternative metal, world music, nu metal, hardcore punk, and industrial metal. Sepultura has also been credited as one of the second wave of thrash metal acts from the late 1980s and early-to-mid 1990s."},{"n":3,"year":1992,"ar":"Rage Against the Machine","ti":"Rage Against the Machine","cv":"https://dn710909.ca.archive.org/0/items/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7-33270800624.jpg","rt":0.0,"sp":"","yt":"MAnsR_7VYKQ","gen":["alternative rock","metal","alternative metal","funk metal","rap metal","political hip hop"],"hb":[],"da":"Rage Against the Machine is the debut album by rock band Rage Against the Machine, released November 3, 1992. The songs on Rage Against the Machine tend to feature political mantras with the vocals rapped. The album peaked at #1 on Billboard's Heatseekers chart, and at #45 on the Billboard Top 200 chart. Tom Morello's guitar soloing is somewhat traditional on this album, taking influence more from heavy metal music, in comparison to later releases where it is more experimental and geared toward emulation of DJs and hip hop. In 2001 Q magazine named Rage Against the Machine as one .","dar":"Rage Against the Machine was an American rock band from Los Angeles, California. Formed in 1991, the group consisted of vocalist Zack de la Rocha, bassist and backing vocalist Tim Commerford, guitarist Tom Morello, and drummer Brad Wilk. Their songs express revolutionary left-wing political views. As of 2010, they had sold over 16 million records worldwide. In 2023, the band was inducted into the Rock and Roll Hall of Fame.\n\nRage Against the Machine released its eponymous debut album in 1992 to commercial and critical success"},{"n":4,"year":1992,"ar":"Faith No More","ti":"Angel Dust","cv":"https://dn711100.ca.archive.org/0/items/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18-25332359916.jpg","rt":0.0,"sp":"","yt":"k0tUb-87kP8","gen":["experimental rock","alternative rock","hard rock","alternative metal","funk metal","avant-garde metal"],"hb":[],"da":"Angel Dust is the fourth studio album by American rock band Faith No More, first released through Slash on June 8, 1992 in Europe and the United States. It's the final studio album with long time guitarist Jim Martin and the second to feature Mike Patton on vocals however it is the first album in which he had an influence on the band's sound, as Patton hadn't previously had input on the musical composition of the albums predecessor, The Real Thing, as it had all been composed and recorded prior to his joining. It remains as Faith No More's highest-selling .","dar":"Faith No More was an American rock band from San Francisco, California, formed in 1979. Before September 1983, the band performed under the names Sharp Young Men and later Faith No Man. Bassist Billy Gould, keyboardist and rhythm guitarist Roddy Bottum, and drummer Mike Bordin were the longest-tenured members of the band, having been involved since its inception. The band underwent several lineup changes over the years. The final lineup consisted of Gould, Bordin, Bottum, lead guitarist Jon Hudson, and vocalist and lyricist Mike Patton."},{"n":22,"year":1992,"ar":"Kyuss","ti":"Blues For The Red Sun","cv":"https://dn720708.ca.archive.org/0/items/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be-11039555984.jpg","rt":0.0,"sp":"","yt":"gZxPm06Dhn4","gen":["alternative rock","hard rock","heavy metal","stoner rock","alternative metal","stoner metal"],"hb":[],"da":null,"dar":"Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\"."},{"n":55,"year":1992,"ar":"Pantera","ti":"Vulgar Display of Power","cv":"https://dn710300.ca.archive.org/0/items/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5-7967409791.jpg","rt":0.0,"sp":"","yt":"8hu6xDPcNlE","gen":["heavy metal","metal","alternative metal","groove metal","thrash metal","rock"],"hb":[],"da":"Vulgar Display of Power is the sixth studio album by the American heavy metal band Pantera, released on February 25, 1992 through Atco Records. One of the most influential heavy metal albums of the 1990s, Vulgar Display of Power has been described as \"one of the defining albums of the groove-metal genre.\" Several songs from this release have become some of the band's best known, such as \"Mouth for War,\" \"A New Level,\" \"Walk,\" \"Fucking Hostile,\" \"This Love,\" and \"No Good (Attack the Radical).\" Background: The band's 1990 major label debut, Cowboys from Hell, demonstrated a change in their musical .","dar":"Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre"},{"n":194,"year":1992,"ar":"L7","ti":"Bricks Are Heavy","cv":"https://dn710700.ca.archive.org/0/items/mbid-b9c52cf2-9f23-4986-8ce2-5e0015cdef27/mbid-b9c52cf2-9f23-4986-8ce2-5e0015cdef27-8559192703.jpg","rt":0.0,"sp":"","yt":"fWvV3ycGdtQ","gen":["punk","grunge","alternative metal","Metal","Punk","Alternative Rock"],"hb":[],"da":"Bricks Are Heavy is the third album by the Los Angeles band L7, released in April 1992 through Slash Records. Backed by the single \"Pretend We're Dead\", the album became a breakthrough hit and the band became the \"poster girls\" of grunge music. The album was released shortly after grunge had broken into the mainstream with the surprise success of Nirvana's Nevermind. In July 1992, the song \"Pretend We're Dead\" gained popularity among American rock radio stations, where it received regular airplay. By late August, the album had reached #1 on Billboard's Heatseekers album chart, and two weeks later it .","dar":"L7 are an American punk rock band founded in Los Angeles, California, first active from 1985 to 2001 and re-formed in 2014. Their longest standing lineup consists of Suzi Gardner, Donita Sparks, Jennifer Finch, and Dee Plakas. \n\nBursting onto the Los Angeles punk scene in 1985, L7 were a fierce all-female force of rock rebellion that shook up the music world and shattered stereotypes. Founded by Suzi Gardner and Donita Sparks, and later joined by Jennifer Finch on bass and Demetra \"Dee\"  Plakas on drums"},{"n":12,"year":1990,"ar":"Primus","ti":"Frizzle Fry","cv":"https://dn721901.ca.archive.org/0/items/mbid-3330b3f4-06ff-3beb-9d89-d40294d8563b/mbid-3330b3f4-06ff-3beb-9d89-d40294d8563b-27029909293.jpg","rt":0.0,"sp":"","yt":"-zn5i_1xTlY","gen":["alternative rock","heavy metal","alternative metal","funk metal","Alternative Rock"],"hb":["EliasJ72","Nubis84"],"da":"Frizzle Fry is the first studio album recorded by the band Primus. Suck on This, a live album, preceded its release. Released in 1990 on Caroline Records, it features the band's first single and minor radio hit \"John the Fisherman\". It was remastered in 2002, after the original had been out of print for years, and was released on Prawn Song Records. The remaster includes an extra track, named \"Hello Skinny/Constantinople\", a cover of the tracks \"Hello Skinny\" and \"Constantinople\" by The Residents. \"You Can't Kill Michael Malloy\" is an excerpt from the Spent Poets song of the same name. .","dar":"Primus is a San Francisco-based alternative rock band formed in the mid-1980s by bassist Les Claypool and guitarist Todd Huth. Les (vocals and bass guitar) has been the only constant member. They have had two guitar players (although Larry has held onto the role for the past 30 years) and many different drummers (although Tim Alexander, Bryan Mantia and Jay Lane were the only ones who recorded with the band) in the past. \n\nTheir music has proven difficult to define; while usually considered by critics to be funk metal or alternative metal"},{"n":155,"year":1990,"ar":"Helmet","ti":"Strap It On","cv":"https://dn721604.ca.archive.org/0/items/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e-31574430576.jpg","rt":0.0,"sp":"","yt":"_IE0TrzBYzY","gen":["hard rock","indie rock","heavy metal","metal","post-hardcore","alternative metal"],"hb":[],"da":"Strap It On is the first album by Helmet. Originally released in 1990 through Amphetamine Reptile Records, it was subsequently rereleased by Interscope in November 1991. Critics considered the album innovative for its explosive, propulsive, and often staccato riff style which greatly exploited drop D tuning. It has since become a cult classic in underground metal/ post-hardcore. The moody, atmospheric \"Sinatra\" differed from most of the fast-paced, metal-influenced songs on the album; its lyrics featured a paraphrasing of Dean Martin's famous line about the crooner, \"It's Sinatra's world/ We just live in it.\" Accolades Year ↓ Publication ↓ Country ↓ .","dar":"Helmet is an alternative metal band hailing from New York City, with its roots dating back to 1989 when vocalist and lead guitarist Page Hamilton established the group. Throughout its existence, Helmet has undergone numerous lineup changes, yet Hamilton remains the sole consistent member. Since 2010, the band has been comprised of Hamilton, drummer Kyle Stevenson, guitarist Dan Beeman, and bassist Dave Case.\n\nThe discography of Helmet boasts eight studio albums and two compilation albums."}];

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

function setUser(u) {

  render();

}

function heard(a) {

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
