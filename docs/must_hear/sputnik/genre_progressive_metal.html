<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

by the band as \"adult contemporary progressive death metal\", the album runs together as a 64-minute epic split up into 8 tracks. In its first week it sold approximately 12,600 copies, reaching 57th on the Billboard 200--the first time the band cracked the top 100 on that list. Mike Portnoy of Dream Theater recently named Colors his album of the year, whilst Ultimate-Guitar.com also named it Album of the Year in their annual This Year in Metal. On the inside .","dar":"Between the Buried and Me is a progressive metal band from Raleigh, North Carolina, comprised of former members of metalcore acts Prayer For Cleansing and Glass Casket. They have recorded eleven albums in addition to a covers album and an EP. Their style is diverse, with influences ranging from thrash, death metal, jazz, math rock and melodic hardcore, to progressive or experimental artists such as Dream Theater, Mike Patton, King Crimson, Queen, and The Mars Volta."},{"n":61,"year":2005,"ar":"Gojira","ti":"From Mars to Sirius","cv":"https://dn710603.ca.archive.org/0/items/mbid-a430ab40-b6ad-3add-98fe-276d5251a42b/mbid-a430ab40-b6ad-3add-98fe-276d5251a42b-22928954741.jpg","rt":0.0,"sp":"","yt":"z70ch7cE8ak","gen":["heavy metal","progressive metal","death metal","Metal"],"hb":["Lonsonxd","sdecandelario"],"da":"From Mars to Sirius is the third studio album by the French progressive death metal band Gojira. A concept album, From Mars to Sirius relates the resurrection of a dead planet through an interplanetary quest, tackling environmental issues as well as broader themes of life, death, and rebirth. Explaining the meaning behind the album title, Joe Duplantier said in an interview that \"In some cultures, Mars symbolizes war and Sirius peace. I'm simplifying! It is a journey of a state of war, even if in France we are preserved, but it can be a war within us, in our flesh, .","dar":"There are multiple artists called Gojira;\n\n1) Gojira is a metal band from Bayonne, France. Their lyrics focus on life, ecology, and spiritual themes. They were formed in 1996 by brothers Joe Duplantier (vocals and lead guitar) and Mario Duplantier (drums), Christian Andreu (guitar) and Alexandre Cornillon (bass guitar). Cornillon left the band in 2001 and Jean-Michel Labadie became their bass player. Genres that they have been associated with over their career include death metal, progressive metal, thrash metal and groove metal."},{"n":105,"year":2005,"ar":"Between the Buried and Me","ti":"Alaska","cv":"https://dn710709.ca.archive.org/0/items/mbid-470507f1-c04b-4401-b6db-33ef1ad2d0f7/mbid-470507f1-c04b-4401-b6db-33ef1ad2d0f7-27965748643.jpg","rt":0.0,"sp":"","yt":"YVl6eOMyOKU","gen":["heavy metal","alternative metal","progressive metal","death metal","metalcore","mathcore"],"hb":[],"da":null,"dar":"Between the Buried and Me is a progressive metal band from Raleigh, North Carolina, comprised of former members of metalcore acts Prayer For Cleansing and Glass Casket. They have recorded eleven albums in addition to a covers album and an EP. Their style is diverse, with influences ranging from thrash, death metal, jazz, math rock and melodic hardcore, to progressive or experimental artists such as Dream Theater, Mike Patton, King Crimson, Queen, and The Mars Volta."},{"n":27,"year":2004,"ar":"Mastodon","ti":"Leviathan","cv":"https://dn710904.ca.archive.org/0/items/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0-25054292616.png","rt":0.0,"sp":"","yt":"4Kp0LxKTZhk","gen":["heavy metal","doom metal","progressive metal","sludge metal","rock","Metal"],"hb":[],"da":"Leviathan is the sophomore full-length studio album by American metal band Mastodon. It was released on August 31, 2004 via Relapse Records. Leviathan was conceived as a concept album based on Herman Melville's 1851 novel Moby-Dick; or, the Whale, with the tracks \"Iron Tusk\", \"Blood and Thunder\" and \"Seabeast\" released as singles. Magazines Revolver, Kerrang! and Terrorizer awarded the record with \"Album of the Year\" in 2004. Leviathan was also released with an audio DVD in a limited edition set with a black and gold slipcase. The album brought Mastodon great critical acclaim and, thanks to the ensuing tour, a .","dar":"Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound."},{"n":45,"year":2004,"ar":"Meshuggah","ti":"I","cv":"https://dn710809.ca.archive.org/0/items/mbid-4960ba68-776f-4597-8f1f-91c9914ddaa6/mbid-4960ba68-776f-4597-8f1f-91c9914ddaa6-34748543865.jpg","rt":0.0,"sp":"","yt":"7m7AGT80VQk","gen":["metal","alternative metal","progressive metal","death metal","djent","Metal"],"hb":["BipolarMuzik"],"da":"I is the one-song-EP which runs for 21 minutes. Meshuggah followed up I with Catch Thirty-Three which is also a single song (this time clocking in at over 45 minutes) but separated into 13 different tracks. The song can be split into three definite sections, each representing a different style of Meshuggah’s past playing. The use of breakdowns separates the song into heavier and less heavy parts. By using this method the song can change style very often. .","dar":"Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records."},{"n":133,"year":1998,"ar":"Meshuggah","ti":"Chaosphere","cv":"https://dn710604.ca.archive.org/0/items/mbid-772ad8a8-f3fe-3a06-8d82-d6d529b5a785/mbid-772ad8a8-f3fe-3a06-8d82-d6d529b5a785-7846820494.jpg","rt":0.0,"sp":"","yt":"dOlezV7TOnA","gen":["heavy metal","math rock","alternative metal","progressive metal","death metal","groove metal"],"hb":[],"da":"Chaosphere is the third studio album by Swedish extreme metal band Meshuggah. It was released on 9 November 1998 by Nuclear Blast, and is the only studio album to feature bassist Gustaf Hielm. Chaosphere's sound shows the band toning down some of the thrash style of their previous releases in favor of the technical, polyrhythmic, groove-oriented sound they would continue to explore on subsequent albums. A video was made for \"New Millennium Cyanide Christ\". Jens Kidman – vocals Fredrik Thordendal – lead guitar, keyboards Mårten Hagström – rhythm guitar Gustaf Hielm – bass Tomas Haake – drums, vocals (tracks 6–7, .","dar":"Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records."},{"n":139,"year":1996,"ar":"Opeth","ti":"Morningrise","cv":"https://dn721301.ca.archive.org/0/items/mbid-f6503dd6-26ff-40b3-a48b-748320de8694/mbid-f6503dd6-26ff-40b3-a48b-748320de8694-2326427744.jpg","rt":0.0,"sp":"","yt":"Lb63bHjJJko","gen":["acoustic rock","progressive metal","death metal","melodic death metal","dark folk","melodic black metal"],"hb":[],"da":"Morningrise is the Swedish death metal band Opeth's second studio album. The album exemplifies Opeth's signature style, exploring the dynamics between the combination of heavy death metal vocals and guitar parts with lighter progressive and acoustic elements. The bridge depicted on the album cover is a Palladian bridge, located in Prior Park in Bath, England. The album was released in Europe by Candlelight Records in 1996 with a sticker on a jewel case, and in the United States by Century Black, Century Media Records' black metal off-shoot a year later. It was reissued by Candlelight Records in 2000. The 2000 .","dar":"Opeth is a Swedish progressive metal band from Stockholm, formed in 1990. The band incorporates elements of folk, blues, classical, and jazz into its compositions, alongside influences from death metal, particularly in their early works. Their music often includes acoustic guitar passages, Mellotron use, death growls, and dynamic shifts.\n\nOpeth has experienced several lineup changes, with every original member eventually replaced. Mikael Åkerfeldt"},{"n":66,"year":1994,"ar":"Dream Theater","ti":"Awake","cv":"https://dn710702.ca.archive.org/0/items/mbid-7de6eb90-a8b2-4c00-80f7-c95e45929b27/mbid-7de6eb90-a8b2-4c00-80f7-c95e45929b27-1118674713.jpg","rt":0.0,"sp":"","yt":"5NwUSzllMpw","gen":["art rock","progressive rock","heavy metal","progressive metal","Metal","Rock"],"hb":["BipolarMuzik","Lonsonxd","Nubis84"],"da":"Awake is the third studio album by American progressive metal band Dream Theater, released in 1994. The record holds the distinction of being the last Dream Theater album to feature keyboardist Kevin Moore, and is the band's second-highest selling effort to date behind 1992's Images and Words. History After the relative commercial success of Images and Words, the band went back to the studio in 1994 with the first timetable and most pressure they had experienced going into recording. Shortly before the album's mixing, keyboardist Kevin Moore decided to quit the band to follow his own musical endeavors. Fans were .","dar":"Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy."},{"n":9,"year":1993,"ar":"Cynic","ti":"Focus","cv":"https://dn711104.ca.archive.org/0/items/mbid-4bb360cf-e4d0-4f19-b19b-2c09422d408d/mbid-4bb360cf-e4d0-4f19-b19b-2c09422d408d-3106066004.jpg","rt":0.0,"sp":"","yt":"JohAktU71fQ","gen":["jazz fusion","progressive metal","death metal","technical death metal","Metal"],"hb":[],"da":"Focus is the debut album by Cynic, released September 14, 1993 through Roadrunner Records. A remastered version of the album was released in 2004. After years of being hailed as promising in Florida's death metal scene, Cynic recorded Focus. The result was an album combining their love of death metal with other influences, notably jazz. Instead of choosing the brutal and hard-hitting approach to metal like most of their contemporaries, Focus takes an experimental stance to music. The album features a hoarse, guttural, growling vocal style, provided by keyboardist Tony Teegarden. Lead singer Paul Masvidal said he was in danger .","dar":"There are three artists called Cynic.\n\n1. Formed in Florida, United States in 1987, Cynic is a progressive metal band that recorded a few thrash metal demos before moving to a highly complex form of jazz-fusion influenced experimental/avant-garde death metal, manifested in their seminal album, 1993's Focus, which for over a decade was the band's only official release.\n\nCynic disbanded in 1994 due to artistic differences while working on their second album, but regrouped in 2007 to perform a series of shows."},{"n":17,"year":1992,"ar":"Sepultura","ti":"Arise","cv":"https://dn710907.ca.archive.org/0/items/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057-19192586880.jpg","rt":0.0,"sp":"","yt":"XLaArdvo9-U","gen":["heavy metal","metal","alternative metal","progressive metal","death metal","thrash metal"],"hb":["Lonsonxd","sdecandelario"],"da":"Arise is the fourth studio album by Brazilian thrash metal band Sepultura, released in 1991 through Roadrunner Records. Upon its release, the album received top reviews from heavy metal magazines such as Rock Hard, Kerrang! and Metal Forces. Arise is considered Sepultura's finest hour among longtime fans. While the music on Arise was mostly in the same death/thrash style as their previous album, Beneath the Remains, it was clear that the Sepultura sound was acquiring an experimental edge. The album presented their first incursions with industrial music, hardcore punk and latin percussion. The tour (1990-1992) that supports the album has .","dar":"Sepultura (Portuguese word for \"Grave\") is a Brazilian metal band from Belo Horizonte. Formed in 1984 by brothers Max and Igor Cavalera, the band was a major force in the groove metal, thrash metal, and death metal genres during the late 1980s and early 1990s, with their later experiments drawing influence from alternative metal, world music, nu metal, hardcore punk, and industrial metal. Sepultura has also been credited as one of the second wave of thrash metal acts from the late 1980s and early-to-mid 1990s."},{"n":12,"year":1992,"ar":"Dream Theater","ti":"Images And Words","cv":"https://dn710704.ca.archive.org/0/items/mbid-42caac42-c876-4f22-8f3f-ebcccad8cf8b/mbid-42caac42-c876-4f22-8f3f-ebcccad8cf8b-15251537725.jpg","rt":0.0,"sp":"","yt":"wUn2OMmP9BQ","gen":["progressive rock","heavy metal","progressive metal","Metal","Rock"],"hb":[],"da":"Images and Words is the second studio album by influential American progressive metal band Dream Theater, released in 1992. It was recorded in late 1991 at BearTracks Studios in New York City. The album is the first album to feature James LaBrie on vocals. The album maintains its position as the band's most commercially successful album to date, and the song Pull Me Under's status as the only Top 10 hit the band has ever had. This song has also had some very recent success as it has appeared in the video game Guitar Hero: World Tour. Many critics and .","dar":"Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy."},{"n":1,"year":1991,"ar":"Death","ti":"Human","cv":"https://dn721602.ca.archive.org/0/items/mbid-3101ec0b-94c8-4cc2-8079-ae786ba5e838/mbid-3101ec0b-94c8-4cc2-8079-ae786ba5e838-31324237474.jpg","rt":0.0,"sp":"","yt":"EzvtfbqJeIY","gen":["metal","progressive metal","death metal","technical death metal","Metal"],"hb":["Lonsonxd","Nubis84","sdecandelario"],"da":"This album, released in 1991, was a major step up for this rapidly evolving death metal outfit. Rich with complicated riffs and beats Human's emphasis is really on technique. Paul Masvidal (guitar) and Sean Reinert (drums) from Cynic surely helped on creating the unique sound of this album. .","dar":"There are multiple artists sharing the name Death; \n\n1) A pioneering death metal band from Altamonte Springs, Florida, U.S. \n2) A protopunk band from Detroit, Michigan, U.S. \n3) A horrorcore rapper from New Orleans, Louisiana, U.S. \n4) A hard techno producer from Germany. \n\n1)  Death was an American death metal band formed in Altamonte Springs, Florida in 1984 by guitarist and vocalist Chuck Schuldiner. Death is considered to be among the most influential"},{"n":6,"year":1991,"ar":"Atheist","ti":"Unquestionable Presence","cv":"https://dn710909.ca.archive.org/0/items/mbid-78a38814-d0cf-4f9a-9b64-9b89f8d80821/mbid-78a38814-d0cf-4f9a-9b64-9b89f8d80821-2571757705.jpg","rt":0.0,"sp":"","yt":"fkoe074iiaw","gen":["progressive metal","death metal","technical death metal","technical thrash metal","thrash metal","Metal"],"hb":["Lonsonxd","Nubis84","sdecandelario"],"da":"Unquestionable Presence is the second album by the death metal band Atheist. It was released in 1991 and added a new sound by using jazz-like harmonies, subtle Latin rhythms and unusual time signatures. It is considered a landmark album in the genre of technical death metal. .","dar":"Atheist is a death metal band from Florida, USA, founded in 1984 by vocalist/guitarist Kelly Shaefer, guitarist Rand Burkey, bassist Roger Patterson, and drummer Steve Flynn. The band is known for their technical playing style. Their album Unquestionable Presence (1991) is regarded as a landmark of the death metal genre. After dissolving in 1994, the band reformed in 2006.\n\nDiscography:\n1989 - Piece of Time\n1991 - Unquestionable Presence\n1993 - Elements\n2009 - Unquestionable Presence: Live at Wacken\n2010 - Jupiter"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
