<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":64,"year":2024,"ar":"Judas Priest","ti":"Invincible Shield","cv":"https://cdn2.albumoftheyear.org/600x0/album/765203-invicible-shield_2042.jpg","rt":0.0,"sp":"","yt":"GpK5P7hCKA8","gen":["heavy metal","metal","Metal","Rock"],"hb":["Lonsonxd","sdecandelario"],"da":"Invincible Shield is the nineteenth studio album by English heavy metal band Judas Priest, released on 8 March 2024 through Epic Records. It was produced by the band's touring guitarist Andy Sneap. The first single, \"Panic Attack\", was released on 13 October 2023. The band will embark on a world tour from the month of the album's release. \"Invincible Shield\" track listing: 01. Panic Attack 02. The Serpent And The King 03. Invincible Shield 04. Devil In Disguise 05. Gates Of Hell 06. Crown Of Horns 07. As God Is My Witness 08. Trial By Fire 09. Escape From Reality .","dar":"Judas Priest is an English heavy metal band formed in Birmingham in 1969. They have sold over 50 million albums and are considered a significant influence within the heavy metal genre. The band has been associated with the new wave of British heavy metal movement and has influenced various metal subgenres, including speed metal, thrash metal, and power metal, as well as aspects of the hard rock and glam metal scenes of the 1980s. Despite producing innovative music in the latter half of the 1970s"},{"n":45,"year":2018,"ar":"Imperial Triumphant","ti":"Vile Luxury","cv":"https://ia800905.us.archive.org/25/items/mbid-70eb44ae-23c3-430a-a101-f744ee39386e/mbid-70eb44ae-23c3-430a-a101-f744ee39386e-20386921091.jpg","rt":0.0,"sp":"","yt":"ZkisK98J5i8","gen":["avant-garde","classical","heavy metal","black metal","avant-garde metal","dissonant death metal"],"hb":[],"da":"\"Vile Luxury\" is the third full-length studio album by New York-based black metal/avant-garde metal band Imperial Triumphant. The album was produced by Colin Marston (Gorguts, Krallice, etc) with artwork from Andrew Tremblay. According to the band, the album \"embodies the most austere side of the New York underground. Chaos, menagerie, and the perils of the city clash with its reputation for majesty and extravagance. The band aim to portray the juxtaposition between high society and urban decay.\" .","dar":"Born in the metropolis: Imperial Triumphant embodies the sounds of New York. The chaos, the menagerie, the perils and majesty of the greatest city on earth. We portray this great juxtaposition between high society homoeroticism coexisting with absolute filth and urban decay. Our city is like the corpse of a giant. What was once so bright, grand and spectacular, is now filled with greedy maggots writhing towards their share of 'success'. We don't support it nor are we against. We only play the sounds of the New York City as we hear them."},{"n":61,"year":2005,"ar":"Gojira","ti":"From Mars to Sirius","cv":"https://dn710603.ca.archive.org/0/items/mbid-a430ab40-b6ad-3add-98fe-276d5251a42b/mbid-a430ab40-b6ad-3add-98fe-276d5251a42b-22928954741.jpg","rt":0.0,"sp":"","yt":"z70ch7cE8ak","gen":["heavy metal","progressive metal","death metal","Metal"],"hb":["Lonsonxd","sdecandelario"],"da":"From Mars to Sirius is the third studio album by the French progressive death metal band Gojira. A concept album, From Mars to Sirius relates the resurrection of a dead planet through an interplanetary quest, tackling environmental issues as well as broader themes of life, death, and rebirth. Explaining the meaning behind the album title, Joe Duplantier said in an interview that \"In some cultures, Mars symbolizes war and Sirius peace. I'm simplifying! It is a journey of a state of war, even if in France we are preserved, but it can be a war within us, in our flesh, .","dar":"There are multiple artists called Gojira;\n\n1) Gojira is a metal band from Bayonne, France. Their lyrics focus on life, ecology, and spiritual themes. They were formed in 1996 by brothers Joe Duplantier (vocals and lead guitar) and Mario Duplantier (drums), Christian Andreu (guitar) and Alexandre Cornillon (bass guitar). Cornillon left the band in 2001 and Jean-Michel Labadie became their bass player. Genres that they have been associated with over their career include death metal, progressive metal, thrash metal and groove metal."},{"n":105,"year":2005,"ar":"Between the Buried and Me","ti":"Alaska","cv":"https://dn710709.ca.archive.org/0/items/mbid-470507f1-c04b-4401-b6db-33ef1ad2d0f7/mbid-470507f1-c04b-4401-b6db-33ef1ad2d0f7-27965748643.jpg","rt":0.0,"sp":"","yt":"YVl6eOMyOKU","gen":["heavy metal","alternative metal","progressive metal","death metal","metalcore","mathcore"],"hb":[],"da":null,"dar":"Between the Buried and Me is a progressive metal band from Raleigh, North Carolina, comprised of former members of metalcore acts Prayer For Cleansing and Glass Casket. They have recorded eleven albums in addition to a covers album and an EP. Their style is diverse, with influences ranging from thrash, death metal, jazz, math rock and melodic hardcore, to progressive or experimental artists such as Dream Theater, Mike Patton, King Crimson, Queen, and The Mars Volta."},{"n":27,"year":2004,"ar":"Mastodon","ti":"Leviathan","cv":"https://dn710904.ca.archive.org/0/items/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0-25054292616.png","rt":0.0,"sp":"","yt":"4Kp0LxKTZhk","gen":["heavy metal","doom metal","progressive metal","sludge metal","rock","Metal"],"hb":[],"da":"Leviathan is the sophomore full-length studio album by American metal band Mastodon. It was released on August 31, 2004 via Relapse Records. Leviathan was conceived as a concept album based on Herman Melville's 1851 novel Moby-Dick; or, the Whale, with the tracks \"Iron Tusk\", \"Blood and Thunder\" and \"Seabeast\" released as singles. Magazines Revolver, Kerrang! and Terrorizer awarded the record with \"Album of the Year\" in 2004. Leviathan was also released with an audio DVD in a limited edition set with a black and gold slipcase. The album brought Mastodon great critical acclaim and, thanks to the ensuing tour, a .","dar":"Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound."},{"n":119,"year":1999,"ar":"Red Hot Chili Peppers","ti":"Californication","cv":"https://dn721604.ca.archive.org/0/items/mbid-058dcfa5-4921-4055-87b0-f541eb4adb08/mbid-058dcfa5-4921-4055-87b0-f541eb4adb08-15837297520.jpg","rt":0.0,"sp":"","yt":"iiupU-K_TKE","gen":["alternative rock","pop rock","blues","funk","funk rock","heavy metal"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","sdecandelario","verygooood"],"da":"Californication is the seventh studio album by American alternative rock band Red Hot Chili Peppers, released on June 8, 1999 on Warner Bros. Records. Produced by Rick Rubin, Californication marked the return of John Frusciante, who had previously appeared on Mother's Milk and Blood Sugar Sex Magik, to replace Dave Navarro as the band's guitarist. Frusciante's return was credited with changing the band's sound altogether. The record was a notable shift in style from what was produced with Navarro. The album's subject material incorporated various sexual innuendos commonly associated with the band, and introduced themes of lust, death, contemplations of .","dar":"Red Hot Chili Peppers is an American rock band formed in Los Angeles in 1982, consisting of Anthony Kiedis (vocals), Flea (bass), John Frusciante (guitar), and Chad Smith (drums). Their music blends elements of alternative rock, funk, punk rock, hard rock, hip hop, and psychedelic rock, and they have influenced genres such as funk metal, rap metal, rap rock, and nu metal. With over 120 million records sold worldwide, the Red Hot Chili Peppers are among the best-selling bands in history."},{"n":133,"year":1998,"ar":"Meshuggah","ti":"Chaosphere","cv":"https://dn710604.ca.archive.org/0/items/mbid-772ad8a8-f3fe-3a06-8d82-d6d529b5a785/mbid-772ad8a8-f3fe-3a06-8d82-d6d529b5a785-7846820494.jpg","rt":0.0,"sp":"","yt":"dOlezV7TOnA","gen":["heavy metal","math rock","alternative metal","progressive metal","death metal","groove metal"],"hb":[],"da":"Chaosphere is the third studio album by Swedish extreme metal band Meshuggah. It was released on 9 November 1998 by Nuclear Blast, and is the only studio album to feature bassist Gustaf Hielm. Chaosphere's sound shows the band toning down some of the thrash style of their previous releases in favor of the technical, polyrhythmic, groove-oriented sound they would continue to explore on subsequent albums. A video was made for \"New Millennium Cyanide Christ\". Jens Kidman – vocals Fredrik Thordendal – lead guitar, keyboards Mårten Hagström – rhythm guitar Gustaf Hielm – bass Tomas Haake – drums, vocals (tracks 6–7, .","dar":"Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records."},{"n":42,"year":1996,"ar":"Eyehategod","ti":"Dopesick","cv":"https://dn710602.ca.archive.org/0/items/mbid-72e57b50-67a3-4689-ac55-342e4341f697/mbid-72e57b50-67a3-4689-ac55-342e4341f697-19427677722.jpg","rt":0.0,"sp":"","yt":"tN-kUW39jWM","gen":["punk","heavy metal","doom metal","alternative metal","sludge metal","Metal"],"hb":[],"da":"Dopesick is the third studio album by New Orleans sludgecore band Eyehategod, released on April 2, 1996. It was reissued in 2006 as part of Century Media's 20th Anniversary series with three bonus tracks that were recorded during the original Dopesick recording sessions. The recording sessions were infamously chaotic, and involved the studio owner reportedly calling Century Media to ask if the band was mentally unstable, and threatening to kick them out. This particular incident occurred after Mike Williams had attempted to record the sound of smashing glass for the introduction to the album, by smashing a bottle on the .","dar":"Eyehategod (also abbreviated and often referred to as EHG) is an American sludge band from New Orleans, Louisiana, which formed in 1988.  The band is known for their dark, sludgy riffs combined with equally dark lyrics. Along with Melvins and Crowbar they are often considered one of the pioneers of the sludge metal genre.\n\nEyehategod have noted Melvins, Black Sabbath, Black Flag, Saint Vitus, Carnivore, Swans and Flipper as key influences to their sound."},{"n":167,"year":1996,"ar":"Marilyn Manson","ti":"Antichrist Superstar","cv":"https://dn721509.ca.archive.org/0/items/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8-21167273304.jpg","rt":0.0,"sp":"","yt":"tHI1uEQLjCk","gen":["alternative rock","hard rock","heavy metal","industrial rock","industrial metal","alternative metal"],"hb":["Frikomid","Lonsonxd"],"da":"Antichrist Superstar is the second studio album by American rock band Marilyn Manson, released on October 8, 1996, by Nothing and Interscope Records. It was recorded at Nothing Studios in New Orleans and produced by the band's eponymous vocalist along with Sean Beavan, former Skinny Puppy producer Dave Ogilvie and Trent Reznor of Nine Inch Nails. The recording of the album was marred by excessive drug use, which provoked a high level of antagonism between band members. Consequently, it was their last release to feature contributions from founding guitarist Daisy Berkowitz, who acrimoniously quit partway through recording. .","dar":"Marilyn Manson is an American rock band formed in Fort Lauderdale, Florida, in 1989 by vocalist Marilyn Manson and guitarist Daisy Berkowitz. Initially performing under the name Marilyn Manson & the Spooky Kids, the group gained a local following in South Florida during the early 1990s through their theatrical and provocative live performances. In 1993, they became the first act signed to Trent Reznor’s Nothing Records label. Until 1996, each band"},{"n":7,"year":1994,"ar":"Kyuss","ti":"Welcome To Sky Valley","cv":"https://dn710903.ca.archive.org/0/items/mbid-6205da21-55a9-457d-aa85-2f1262e25694/mbid-6205da21-55a9-457d-aa85-2f1262e25694-8267363147.jpg","rt":0.0,"sp":"","yt":"RxOTKRoPhIo","gen":["hard rock","heavy metal","stoner rock","alternative metal","stoner metal","desert rock"],"hb":[],"da":"Welcome to Sky Valley is the third studio album by American stoner rock/metal band Kyuss, originally released on June 28, 1994. Kyuss was recorded in early 1993 and scheduled for release in January 1994. They sneak-previewed the completed album at Foundations Forum 93 and contributed the song \"Demon Cleaner\" to the sampler disc. Due to mild success from their previous album, Kyuss had been promoted from their subsidiary record label \"Dali\" to the main label \"Chameleon.\" On November 11, 1993 Chameleon Records abruptly shut down. Their joint-venture partner Elektra quickly picked up the band and scheduled the album for release .","dar":"Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\"."},{"n":66,"year":1994,"ar":"Dream Theater","ti":"Awake","cv":"https://dn710702.ca.archive.org/0/items/mbid-7de6eb90-a8b2-4c00-80f7-c95e45929b27/mbid-7de6eb90-a8b2-4c00-80f7-c95e45929b27-1118674713.jpg","rt":0.0,"sp":"","yt":"5NwUSzllMpw","gen":["art rock","progressive rock","heavy metal","progressive metal","Metal","Rock"],"hb":["BipolarMuzik","Lonsonxd","Nubis84"],"da":"Awake is the third studio album by American progressive metal band Dream Theater, released in 1994. The record holds the distinction of being the last Dream Theater album to feature keyboardist Kevin Moore, and is the band's second-highest selling effort to date behind 1992's Images and Words. History After the relative commercial success of Images and Words, the band went back to the studio in 1994 with the first timetable and most pressure they had experienced going into recording. Shortly before the album's mixing, keyboardist Kevin Moore decided to quit the band to follow his own musical endeavors. Fans were .","dar":"Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy."},{"n":32,"year":1993,"ar":"Type O Negative","ti":"Bloody Kisses","cv":"https://dn710802.ca.archive.org/0/items/mbid-5efc784b-f2af-4ee4-81af-1217b9ab39e0/mbid-5efc784b-f2af-4ee4-81af-1217b9ab39e0-8508508162.jpg","rt":0.0,"sp":"","yt":"mVvtm52_0IA","gen":["gothic rock","heavy metal","gothic metal","alternative metal","Metal"],"hb":["Nubis84","sdecandelario"],"da":"\"Bloody Kisses\" is the third album by Brooklyn band Type O Negative. It marked significant stylistic growth for the band in terms of songwriting and production values, and it is also the last recording to feature Sal Abruscato on drums. The album further established Type O Negative motifs, such as including cover songs restylized into gloomy gothic doom, featuring sample-heavy soundscapes in between songs, and dry, satirical humor. This album includes a cover of the Seals and Crofts song \"Summer Breeze\". The most successful single from \"Bloody Kisses\" was the song \"Black No.1 (Little Miss Scare-All)\", which poked fun at .","dar":"Type O Negative was a gothic metal / doom metal band formed in Brooklyn, New York, US in 1990. They are well known for their dry, morbid and ironic sense of humor and their often slow and brooding music. \"The Drab Four\" (the nickname Type O Negative gave themselves) always succeeded in keeping their own unique style, mixing melodic, classic rock 'n' roll with slow, doom-like vibes, and down-tuned heavy metal guitar riffs with dark soundscapes. They were also known for doom metal riffs"},{"n":171,"year":1993,"ar":"Primus","ti":"Pork Soda","cv":"https://dn710800.ca.archive.org/0/items/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d-28985005149.png","rt":0.0,"sp":"","yt":"K8WGVYxG5Ng","gen":["alternative rock","funk rock","heavy metal","alternative metal","funk metal","Alternative Rock"],"hb":[],"da":"Pork Soda is the third album by Primus. Released in 1993, \"Pork Soda\" is considerably darker than any of the band's earlier efforts, dealing with murder (\"My Name Is Mud\"), dissatisfaction with the human race (\"Nature Boy\", \"Welcome to This World\"), suicide (\"Bob\"), and inconvenient realities of life (\"DMV\"). It was a certified Gold record shortly after its release and is currently certified Platinum; it is Primus' largest seller to date. Track listing # Title Length 1. \"Pork Chop's Little Ditty\" 0:21 2. \"My Name Is Mud\" 4:48 3. \"Welcome to This World\" 3:40 4. \"Bob\" 4:40 5. \"DMV\" 4:58 .","dar":"Primus is a San Francisco-based alternative rock band formed in the mid-1980s by bassist Les Claypool and guitarist Todd Huth. Les (vocals and bass guitar) has been the only constant member. They have had two guitar players (although Larry has held onto the role for the past 30 years) and many different drummers (although Tim Alexander, Bryan Mantia and Jay Lane were the only ones who recorded with the band) in the past. \n\nTheir music has proven difficult to define; while usually considered by critics to be funk metal or alternative metal"},{"n":17,"year":1992,"ar":"Sepultura","ti":"Arise","cv":"https://dn710907.ca.archive.org/0/items/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057-19192586880.jpg","rt":0.0,"sp":"","yt":"XLaArdvo9-U","gen":["heavy metal","metal","alternative metal","progressive metal","death metal","thrash metal"],"hb":["Lonsonxd","sdecandelario"],"da":"Arise is the fourth studio album by Brazilian thrash metal band Sepultura, released in 1991 through Roadrunner Records. Upon its release, the album received top reviews from heavy metal magazines such as Rock Hard, Kerrang! and Metal Forces. Arise is considered Sepultura's finest hour among longtime fans. While the music on Arise was mostly in the same death/thrash style as their previous album, Beneath the Remains, it was clear that the Sepultura sound was acquiring an experimental edge. The album presented their first incursions with industrial music, hardcore punk and latin percussion. The tour (1990-1992) that supports the album has .","dar":"Sepultura (Portuguese word for \"Grave\") is a Brazilian metal band from Belo Horizonte. Formed in 1984 by brothers Max and Igor Cavalera, the band was a major force in the groove metal, thrash metal, and death metal genres during the late 1980s and early 1990s, with their later experiments drawing influence from alternative metal, world music, nu metal, hardcore punk, and industrial metal. Sepultura has also been credited as one of the second wave of thrash metal acts from the late 1980s and early-to-mid 1990s."},{"n":2,"year":1992,"ar":"Alice in Chains","ti":"Dirt","cv":"https://dn710800.ca.archive.org/0/items/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf-9835602113.jpg","rt":0.0,"sp":"","yt":"19CXYQhqVu0","gen":["alternative rock","hard rock","heavy metal","doom metal","metal","grunge"],"hb":["Lonsonxd","sdecandelario","verygooood"],"da":"Dirt is the second studio album by the American rock band Alice in Chains and was released on September 29, 1992 through Columbia Records. Peaking at number six on the Billboard 200, the album was well received by music critics and has since been certified four-times platinum by the RIAA. It is nowadays considered as one of the best grunge/heavy metal albums and is usually on many \"Must have\" lists. The album spawned five singles: \"Would?\", \"Them Bones\", \"Angry Chair\", \"Rooster\", and \"Down in a Hole\". The songs on the album focused on depression, drug use, war, death, and other .","dar":"Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style"},{"n":12,"year":1992,"ar":"Dream Theater","ti":"Images And Words","cv":"https://dn710704.ca.archive.org/0/items/mbid-42caac42-c876-4f22-8f3f-ebcccad8cf8b/mbid-42caac42-c876-4f22-8f3f-ebcccad8cf8b-15251537725.jpg","rt":0.0,"sp":"","yt":"wUn2OMmP9BQ","gen":["progressive rock","heavy metal","progressive metal","Metal","Rock"],"hb":[],"da":"Images and Words is the second studio album by influential American progressive metal band Dream Theater, released in 1992. It was recorded in late 1991 at BearTracks Studios in New York City. The album is the first album to feature James LaBrie on vocals. The album maintains its position as the band's most commercially successful album to date, and the song Pull Me Under's status as the only Top 10 hit the band has ever had. This song has also had some very recent success as it has appeared in the video game Guitar Hero: World Tour. Many critics and .","dar":"Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy."},{"n":22,"year":1992,"ar":"Kyuss","ti":"Blues For The Red Sun","cv":"https://dn720708.ca.archive.org/0/items/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be-11039555984.jpg","rt":0.0,"sp":"","yt":"gZxPm06Dhn4","gen":["alternative rock","hard rock","heavy metal","stoner rock","alternative metal","stoner metal"],"hb":[],"da":null,"dar":"Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\"."},{"n":55,"year":1992,"ar":"Pantera","ti":"Vulgar Display of Power","cv":"https://dn710300.ca.archive.org/0/items/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5-7967409791.jpg","rt":0.0,"sp":"","yt":"8hu6xDPcNlE","gen":["heavy metal","metal","alternative metal","groove metal","thrash metal","rock"],"hb":[],"da":"Vulgar Display of Power is the sixth studio album by the American heavy metal band Pantera, released on February 25, 1992 through Atco Records. One of the most influential heavy metal albums of the 1990s, Vulgar Display of Power has been described as \"one of the defining albums of the groove-metal genre.\" Several songs from this release have become some of the band's best known, such as \"Mouth for War,\" \"A New Level,\" \"Walk,\" \"Fucking Hostile,\" \"This Love,\" and \"No Good (Attack the Radical).\" Background: The band's 1990 major label debut, Cowboys from Hell, demonstrated a change in their musical .","dar":"Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre"},{"n":21,"year":1991,"ar":"Red Hot Chili Peppers","ti":"Blood Sugar Sex Magik","cv":"https://dn710804.ca.archive.org/0/items/mbid-23767d15-3b52-4298-9b6b-32a4a2684618/mbid-23767d15-3b52-4298-9b6b-32a4a2684618-15240926872.jpg","rt":0.0,"sp":"","yt":"kziGsq8reTc","gen":["alternative rock","funk","funk rock","heavy metal","funk metal","rap rock"],"hb":["Lonsonxd","sdecandelario"],"da":"Blood Sugar Sex Magik is the fifth studio album by American alternative rock band Red Hot Chili Peppers, released on September 24, 1991. Produced by Rick Rubin, it was the band's first record released on Warner Bros. Records. The musical styles of Blood Sugar Sex Magik differed notably from the techniques employed on the band's preceding album, Mother's Milk (1989), and featured little use of heavy metal guitar riffs. The album's subject matter incorporated sexual innuendos and references to drugs and death as well as themes of lust and exuberance. The album has sold over seven million copies in the .","dar":"Red Hot Chili Peppers is an American rock band formed in Los Angeles in 1982, consisting of Anthony Kiedis (vocals), Flea (bass), John Frusciante (guitar), and Chad Smith (drums). Their music blends elements of alternative rock, funk, punk rock, hard rock, hip hop, and psychedelic rock, and they have influenced genres such as funk metal, rap metal, rap rock, and nu metal. With over 120 million records sold worldwide, the Red Hot Chili Peppers are among the best-selling bands in history."},{"n":1,"year":1990,"ar":"Megadeth","ti":"Rust in Peace","cv":"https://dn710907.ca.archive.org/0/items/mbid-e68c6a5e-0773-4b5c-bb66-b6f032bb2db4/mbid-e68c6a5e-0773-4b5c-bb66-b6f032bb2db4-12663594543.jpg","rt":0.0,"sp":"","yt":"Ti_imhKBjXA","gen":["heavy metal","metal","technical thrash metal","thrash metal","Metal"],"hb":["Lonsonxd","Nubis84","sdecandelario"],"da":"Rust in Peace is the fourth studio album by American thrash metal band Megadeth. It was released by Capitol Records in 1990. A remixed and remastered version, featuring several bonus tracks, was released in 2004. Singles featured on the album include \"Holy Wars...The Punishment Due\", and \"Hangar 18\", both of which were made into music videos. This was the first Megadeth album to feature Marty Friedman and Nick Menza. Production After being released from a twelve-step program, Megadeth frontman Dave Mustaine had hired drummer Nick Menza and guitarist Marty Friedman to record Rust in Peace, creating what would become the .","dar":"Megadeth is an American thrash metal band formed in Los Angeles in 1983 by vocalist and guitarist Dave Mustaine. The group is known for complex guitar work and precise musicianship and is regarded as one of the big four bands of American thrash metal along with Slayer, Anthrax and Metallica. Its music features fast rhythm sections, dual lead guitars and lyrics addressing topics such as war, politics, religion, mortality and personal relationships."},{"n":12,"year":1990,"ar":"Primus","ti":"Frizzle Fry","cv":"https://dn721901.ca.archive.org/0/items/mbid-3330b3f4-06ff-3beb-9d89-d40294d8563b/mbid-3330b3f4-06ff-3beb-9d89-d40294d8563b-27029909293.jpg","rt":0.0,"sp":"","yt":"-zn5i_1xTlY","gen":["alternative rock","heavy metal","alternative metal","funk metal","Alternative Rock"],"hb":["EliasJ72","Nubis84"],"da":"Frizzle Fry is the first studio album recorded by the band Primus. Suck on This, a live album, preceded its release. Released in 1990 on Caroline Records, it features the band's first single and minor radio hit \"John the Fisherman\". It was remastered in 2002, after the original had been out of print for years, and was released on Prawn Song Records. The remaster includes an extra track, named \"Hello Skinny/Constantinople\", a cover of the tracks \"Hello Skinny\" and \"Constantinople\" by The Residents. \"You Can't Kill Michael Malloy\" is an excerpt from the Spent Poets song of the same name. .","dar":"Primus is a San Francisco-based alternative rock band formed in the mid-1980s by bassist Les Claypool and guitarist Todd Huth. Les (vocals and bass guitar) has been the only constant member. They have had two guitar players (although Larry has held onto the role for the past 30 years) and many different drummers (although Tim Alexander, Bryan Mantia and Jay Lane were the only ones who recorded with the band) in the past. \n\nTheir music has proven difficult to define; while usually considered by critics to be funk metal or alternative metal"},{"n":26,"year":1990,"ar":"Bathory","ti":"Hammerheart","cv":"https://dn710908.ca.archive.org/0/items/mbid-d6dbc518-3ad6-39a5-ab01-1b24f87e2e45/mbid-d6dbc518-3ad6-39a5-ab01-1b24f87e2e45-19434936368.jpg","rt":0.0,"sp":"","yt":"dvCHHYwGjfY","gen":["heavy metal","metal","viking metal","Metal","Rock"],"hb":[],"da":"Hammerheart is the fifth album released by Bathory. It continued Blood Fire Death's transition away from black metal to what would become recognized as viking metal, and is considered a cornerstone work of the genre. .","dar":"Bathory was a Swedish black metal band formed in Vällingby in 1983 and named after the infamous Hungarian countess Elizabeth Báthory. The band's frontman and main songwriter was Quorthon (Tomas Forsberg). Bathory's first four albums were \"the blueprint for Scandinavian black metal\". The band departed from this style on their fifth album, Hammerheart (1990), which is often cited as the first Viking metal album. Bathory continued in the Viking metal style throughout the 1990s and early 2000s"},{"n":155,"year":1990,"ar":"Helmet","ti":"Strap It On","cv":"https://dn721604.ca.archive.org/0/items/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e-31574430576.jpg","rt":0.0,"sp":"","yt":"_IE0TrzBYzY","gen":["hard rock","indie rock","heavy metal","metal","post-hardcore","alternative metal"],"hb":[],"da":"Strap It On is the first album by Helmet. Originally released in 1990 through Amphetamine Reptile Records, it was subsequently rereleased by Interscope in November 1991. Critics considered the album innovative for its explosive, propulsive, and often staccato riff style which greatly exploited drop D tuning. It has since become a cult classic in underground metal/ post-hardcore. The moody, atmospheric \"Sinatra\" differed from most of the fast-paced, metal-influenced songs on the album; its lyrics featured a paraphrasing of Dean Martin's famous line about the crooner, \"It's Sinatra's world/ We just live in it.\" Accolades Year ↓ Publication ↓ Country ↓ .","dar":"Helmet is an alternative metal band hailing from New York City, with its roots dating back to 1989 when vocalist and lead guitarist Page Hamilton established the group. Throughout its existence, Helmet has undergone numerous lineup changes, yet Hamilton remains the sole consistent member. Since 2010, the band has been comprised of Hamilton, drummer Kyle Stevenson, guitarist Dan Beeman, and bassist Dave Case.\n\nThe discography of Helmet boasts eight studio albums and two compilation albums."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
