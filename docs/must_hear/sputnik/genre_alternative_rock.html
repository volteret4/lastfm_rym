<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":26,"year":2024,"ar":"Chelsea Wolfe","ti":"She Reaches Out to She Reaches Out to She","cv":"https://cdn2.albumoftheyear.org/600x0/album/778140-she-reaches-out-to-she-reaches-out-to-she_1020.jpg","rt":0.0,"sp":"","yt":"RkPx5yyD570","gen":["alternative rock","doom metal","dark wave","post-industrial","Rock"],"hb":[],"da":"Chelsea Wolfe’s latest album, She Reaches Out To She Reaches Out To She, is a rebirth in process. It’s a powerfully cathartic statement about cutting ties, as well as an important reminder that healing is cyclical and circular, and not a simple linear process. released February 9, 2024 .","dar":"Chelsea Wolfe (born Chelsea Joy Wolfe on November 14, 1983) is an American singer-songwriter and musician from Roseville, California. Her work blends elements of gothic rock, doom metal, folk, and darkwave, often described as \"doom folk\" and \"drone-metal-art-folk.\" Growing up in Northern California with a country musician father who owned a home studio, Wolfe began writing poetry at age 7 and recording songs by age 9, which she later described as \"basically Casio-based gothy R&B songs.\""},{"n":21,"year":2022,"ar":"Ethel Cain","ti":"Preacher's Daughter","cv":"https://dn721805.ca.archive.org/0/items/mbid-02e76b0a-b9c6-4f28-97cd-f09e93c5490c/mbid-02e76b0a-b9c6-4f28-97cd-f09e93c5490c-42933266015.jpg","rt":0.0,"sp":"","yt":"8Efh7tKNliU","gen":["alternative rock","shoegaze","dream pop","slowcore","ethereal wave","dark ambient"],"hb":[],"da":"MISTAGGED: See Preacher’s Daughter for correct tag. \"Preacher's Daughter\" is the debut album from American singer-songwriter Ethel Cain, released on May 12, 2022 through her own label Daughters of Cain. On March 17, 2022, Cain released the single \"Gibson Girl\", subsequently announcing her debut album release. In an interview with Alternative Press, Ethel said: “The story centers around three generations of women, and it starts with the youngest, the daughter. It’s pretty much just a classic American tale. A common theme that I like to write about is intergenerational trauma. Things that have been passed down through generations and how .","dar":"Ethel Cain is a musical project of American singer-songwriter, record producer, and model Hayden Silas Anhedönia (born March 24, 1998). This project is noted for lyrics focused on nostalgic and Southern Gothic themes, while the music has been associated with the ambient, indie rock, and contemporary folk genres. \n\nWhile Ethel Cain is her most notable project to-date, Anhedönia has other projects under different monikers, such as ΛTLΛS, Miss Anhedönia, Tommy, White Silas, and אשמדאי."},{"n":16,"year":2019,"ar":"Purple Mountains","ti":"Purple Mountains","cv":"https://cdn2.albumoftheyear.org/600x0/album/2019/155745-purple-mountains.jpg","rt":0.0,"sp":"","yt":"IoyA5i-xuQo","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":[],"da":"In 2019, ten years after retiring Silver Jews and retreating from public life, David Berman triumphantly returned as Purple Mountains .","dar":"Purple Mountains was the creation of American musician, singer, poet and cartoonist David Cloud Berman (born David Craig Berman on 4 January 1967; died August 7, 2019). \n\nIn 2019, 10 years since retiring Silver Jews and retreating from public life, Berman returned as Purple Mountains with the eponymous album released on 12 July 2019 on the Drag City label.\n\nBerman is best remembered for his work with indie-rock band the Silver Jews. Although the band primarily existed as a recording project for most of its existence"},{"n":6,"year":2017,"ar":"Gang of Youths","ti":"Go Farther in Lightness","cv":"https://dn711106.ca.archive.org/0/items/mbid-05a13538-a9c8-45cc-87b1-6fe51bce08f7/mbid-05a13538-a9c8-45cc-87b1-6fe51bce08f7-20244359129.jpg","rt":0.0,"sp":"","yt":"quv_XFtVJ3A","gen":["alternative rock","post-punk","indie rock","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Gang of Youths are an Australian rock band based out of Sydney, New South Wales. The band is the brainchild of vocalist/guitarist/lyricist David Le'aupepe, who formed the band in 2012. Their debut album, The Positions, was released in 2015."},{"n":36,"year":2016,"ar":"Radiohead","ti":"A Moon Shaped Pool","cv":"https://cdn2.albumoftheyear.org/600x0/album/54767-a-moon-shaped-pool_090450.jpg","rt":0.0,"sp":"","yt":"0506r4BGs7M","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","ambient pop"],"hb":[],"da":"A Moon Shaped Pool is the ninth studio album by the English rock band Radiohead, released as a download on 8 May 2016. The album's first two singles were \"Burn the Witch\" and \"Daydreaming\". CD and LP editions will be released by XL Recordings on 17 June 2016, followed in September by a \"special edition\" containing additional artwork and two bonus tracks. The album was produced by Nigel Godrich. Radiohead began work on A Moon Shaped Pool intermittently after finishing the 2012 tour for their previous album, 2011's The King of Limbs. Several songs on the album date back to .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":101,"year":2015,"ar":"Father John Misty","ti":"I Love You, Honeybear","cv":"https://cdn2.albumoftheyear.org/600x0/album/2015/22669-i-love-you-honeybear.jpg","rt":0.0,"sp":"","yt":"caMfvhKIgBo","gen":["folk rock","alternative rock","indie rock","indie folk","Rock","Alternative Rock"],"hb":["Frikomid","sdecandelario"],"da":"I Love You, Honeybear is the second studio album by American folk musician Josh Tillman under his pseudonym Father John Misty. It was released on February 9, 2015, in the United Kingdom and Europe by Bella Union, and in the rest of the world on February 10, 2015, by Sub Pop. Produced by both Tillman and Jonathan Wilson, this is Tillman's second studio album since his departure from Fleet Foxes. The album was also mixed by Phil Ek, and mastered by Greg Calbi at Sterling Sound. According to Tillman, the release is a concept album. I Love You, Honeybear received .","dar":"Father John Misty, or J. Tillman, has been recording/releasing solo albums since 2003. Josh also played drums for Seattle’s Fleet Foxes from 2008-2011.\n\nOn January 31st 2012, he released the first single, 'Hollywood Forever Cemetery Sings', for his debut album under the Father John Misty moniker, \"Fear Fun\". The Phil Ek mixed and Jonathan Wilson produced LP was released on May 1st 2012 through Sub Pop (U.S.) and Bella Union (U.K.)\n\nTo date, Father John Misty has released 6 studio albums: Fear Fun (2012)"},{"n":54,"year":2014,"ar":"Bent Knee","ti":"Shiny Eyed Babies","cv":"https://dn711004.ca.archive.org/0/items/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0-12550985966.jpg","rt":0.0,"sp":"","yt":"o2aBQclnk0M","gen":["experimental rock","avant-garde","alternative rock","synth-pop","indie rock","Rock"],"hb":[],"da":null,"dar":"Bent Knee is an American art rock band formed in Boston, Massachusetts in 2009. The band performs in multiple genres and draws from multiple influences, including pop, industrial rock, hip hop, and avant-garde. The band is known for unpredictable dynamic contrast and the wide vocal range of singer Courtney Swain."},{"n":167,"year":2011,"ar":"PJ Harvey","ti":"Let England Shake","cv":"https://cdn2.albumoftheyear.org/600x0/album/2087-let-england-shake_082511.jpg","rt":0.0,"sp":"","yt":"IaCsIvDLnBg","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","Nubis84","paqueradejere","sdecandelario"],"da":"Let England Shake is the eighth studio album by PJ Harvey. It was released on 14 February 2011 in the UK, and on 15 February 2011 in the US. Work on it began around the time of White Chalk's release in 2007, though it is a departure from the piano-driven introspective collection of that album. It was written between late 2007 and 2008, and recorded over a five-week period. .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":51,"year":2010,"ar":"Deerhunter","ti":"Halcyon Digest","cv":"https://dn711300.ca.archive.org/0/items/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c-2094844395.jpg","rt":0.0,"sp":"","yt":"Lx57to-9mGw","gen":["alternative rock","indie rock","dream pop","rock"],"hb":[],"da":"Halcyon Digest is the fourth studio album by American indie rock band Deerhunter. It was released September 28, 2010 to very enthusiastic reviews. It was the band's first album distributed exclusively by 4AD worldwide (previously 4AD only handled overseas distribution while Kranky Records handled it within the U.S) The album was self-produced with assistance from Ben Allen and was recorded at Chase Park Transduction studios in Athens, Georgia. The final track, \"He Would Have Laughed\" was recorded separately by Bradford Cox at Notown Sound in Marietta, GA and is a tribute to the late Jay Reatard. Writing on his Facebook .","dar":"Deerhunter is an American indie rock band formed in 2001 in Atlanta, Georgia, United States. The band consists of Bradford Cox (vocals, guitar, piano), Moses Archuleta (drums, synths), Lockett Pundt (guitar, organ, vocals), and Josh McKay (bass, vocals).\n\nThe group began with the ambition of fusing the lulling hypnotic states induced by ambient and minimalist music with the klang and propulsion of garage rock. The band has weathered chaotic line-up changes and the death of a member."},{"n":3,"year":2007,"ar":"Radiohead","ti":"In Rainbows","cv":"https://dn710801.ca.archive.org/0/items/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30-6689244510.jpg","rt":0.0,"sp":"","yt":"Al1o33CRXsU","gen":["alternative rock","art rock","krautrock","art pop","indie rock","dream pop"],"hb":[],"da":"In Rainbows is the seventh studio album by the English alternative rock band Radiohead. It was first released on October 10, 2007 as a digital download that customers could order for whatever price they saw fit, followed by a standard CD release in most countries during the last week of 2007. The album was released in North America on January 1, 2008. In Rainbows was Radiohead's first release after the end of their contract with EMI and the end of the longest gap between studio albums in their career. \"In Rainbows\" was recorded in London, Somerset, Wiltshire, and Oxfordshire with .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":55,"year":2007,"ar":"LCD Soundsystem","ti":"Sound of Silver","cv":"https://dn710805.ca.archive.org/0/items/mbid-7461ca27-65e8-4106-a75e-de068dc3a619/mbid-7461ca27-65e8-4106-a75e-de068dc3a619-38184302649.jpg","rt":0.0,"sp":"","yt":"4kPyjUMmCL4","gen":["alternative rock","dance-punk","alternative dance","indietronica","post-punk revival","new rave"],"hb":["EliasJ72","Frikomid","GabredMared","alberto_gu","sdecandelario","verygooood"],"da":"Sound of Silver is the second studio album by American rock band LCD Soundsystem. The album was released jointly through DFA and Capitol Records in the United States and EMI elsewhere, first on March 12, 2007, in the United Kingdom. Sound of Silver was produced by the DFA and recorded during 2006 at Long View Farm in North Brookfield, Massachusetts and DFA Studios in New York, New York. Upon release, Sound of Silver received acclaim from music critics, and it was later nominated for the Grammy Award for Best Electronic/Dance Album at the 50th Annual Grammy Awards. .","dar":"LCD Soundsystem is the musical project of producer James Murphy, co-founder of dance-punk label DFA Records. Formed in 2001 in New York City, New York, United States, the music of LCD Soundsystem can also be described as a mix of alternative dance and post punk, along with elements of disco and other styles. \n\nDuring the band's final years, Murphy was accompanied by Al Doyle (guitar, percussion -- also of Hot Chip), Tyler Pope (!!! / Out Hud) (bass), Nancy Whang (keyboards) and Pat Mahoney (drums)."},{"n":10,"year":2006,"ar":"Joanna Newsom","ti":"Ys","cv":"https://dn711106.ca.archive.org/0/items/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16-9262812691.jpg","rt":0.0,"sp":"","yt":"cJ1yFhjRnNc","gen":["avant-garde","folk","alternative rock","chamber folk","baroque pop","country"],"hb":[],"da":"Ys is the second studio album by American musician Joanna Newsom. It was released by Drag City on November 6, 2006. The album was produced by Newsom and Van Dyke Parks, recorded by Steve Albini, mixed by Jim O'Rourke, with accompanying orchestral arrangements by Van Dyke Parks. It features guest vocals from Bill Callahan and Emily Newsom. The vocals and harp were recorded at The Village Recording Studio in Los Angeles in December 2005, with the orchestration being recorded between May and June 2006 at the Entourage Studios in Los Angeles. The album consists of five tracks with song durations .","dar":"Joanna Caroline Newsom is an American singer, songwriter, musician and actress. Born and raised in Northern California, Newsom was classically trained on the harp in her youth and began her musical career as a keyboardist in the San Francisco-based indie band The Pleased.\n\nAfter recording and self-releasing two EPs in 2002, Newsom was signed to the independent label Drag City. Her debut album, The Milk-Eyed Mender, was released in 2004 to critical acclaim and garnered Newsom an underground following."},{"n":118,"year":2006,"ar":"John Mayer","ti":"Continuum","cv":"https://dn721902.ca.archive.org/0/items/mbid-763e1543-64eb-41be-87bf-4239a07a3627/mbid-763e1543-64eb-41be-87bf-4239a07a3627-29227495127.jpg","rt":0.0,"sp":"","yt":"pquX7Ya4-wE","gen":["blues rock","alternative rock","pop rock","blues","indie rock","Rock"],"hb":[],"da":"Continuum is the third studio album by American musician John Mayer, released September 12, 2006 on Columbia Records. Recording sessions for the album took place during November 2005 to September 2006 at The Village Recorder in Los Angeles, California, Avatar Studios and Right Track/Sound on Sound in New York City, and Royal Studios in Memphis, Tennessee. Production was handled primarily by Mayer and Steve Jordan. It marked a change in Mayer's musical style, and incorporated musical elements of blues and soul more heavily than in his previous work with pop-rock. The album debuted at number 2 on the U.S. Billboard .","dar":"John Clayton Mayer was born October 16, 1977, in Fairfield, Connecticut, USA, and started playing guitar at 13 after being inspired by a Stevie Ray Vaughan tape his neighbor gave him. In 1998 he moved to Atlanta, Georgia where he refined his skills and gained a following.\n\nIn 2003, he won the Grammy Award for Best Male Pop Vocal Performance for the 2002 single \"Your Body Is a Wonderland\" from the album Room for Squares.\n\nIn February 2005, he was awarded the Song of the Year Grammy for his song Daughters"},{"n":165,"year":2004,"ar":"Dead Meadow","ti":"Feathers","cv":"https://ia800703.us.archive.org/33/items/mbid-2d16e351-34ae-4722-9166-bc8512d5907a/mbid-2d16e351-34ae-4722-9166-bc8512d5907a-19351955710.jpg","rt":0.0,"sp":"","yt":"IGoTfJ2ae5k","gen":["psychedelic rock","alternative rock","indie rock","stoner rock","neo-psychedelia","Rock"],"hb":[],"da":null,"dar":"Dead Meadow is an American stoner rock band, formed in Washington, D.C. in 1998 and currently composed of vocalist and guitarist Jason Simon, bassist Steve Kille, and drummer Mark Laughlin.\n\nThe band members met in the DC punk/indie scene, though their music draws from more faraway sources. The band formed in the fall of 1998 from the ashes of local bands The Impossible Five and Colour, when singer-guitarist Jason Simon, bassist Steve Kille, and drummer"},{"n":12,"year":2002,"ar":"Interpol","ti":"Turn on the Bright Lights","cv":"https://dn711202.ca.archive.org/0/items/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30-2981501643.jpg","rt":0.0,"sp":"","yt":"3QiQZj6cfDM","gen":["alternative rock","post-punk","indie rock","post-punk revival","rock","Punk"],"hb":["Frikomid","sdecandelario"],"da":"Turn On the Bright Lights is the debut album of New York City rock band Interpol. It was released in 2002 on Matador Records to a great deal of critical acclaim and sold exceptionally well for an indie release; it has sold 499,000 copies in the U.S. so far. It was also ranked highly on the yearly lists of many music critics, and has to date sold 86,000 in the UK despite only charting as high as #101. Musically, many have pointed out the similarities between Turn On the Bright Lights and the bands Joy Division and The Chameleons. \"PDA\", .","dar":"Interpol is an American post-punk band formed in Manhattan, New York, in 1997. They played an important part in the post-punk revival of the 2000s. The band consists of Paul Banks (vocals and guitar), Sam Fogarino (drums), and Daniel Kessler (guitar and backing vocals).\n\nThe band's sound is generally a mix of staccato bass and rhythmic, harmonized guitar, with a snare heavy mix, drawing comparisons to post-punk bands such as Joy Division and The Chameleons."},{"n":57,"year":2002,"ar":"The Flaming Lips","ti":"Yoshimi Battles the Pink Robots","cv":"https://dn710707.ca.archive.org/0/items/mbid-5ee8b734-e29a-36d9-9913-3319e21b5444/mbid-5ee8b734-e29a-36d9-9913-3319e21b5444-2572175401.jpg","rt":0.0,"sp":"","yt":"eITvHa3YB2E","gen":["experimental rock","alternative rock","psychedelic pop","neo-psychedelia","dream pop","space rock revival"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","sdecandelario","verygooood"],"da":"Yoshimi Battles the Pink Robots is the tenth studio album by The Flaming Lips, released by Warner Bros. Records on July 16, 2002, in the United Kingdom and the following day in the United States. It is characterized by electronic-influenced, psychedelic-tinged indie rock compositions. It has been certified Gold by the RIAA. Yoshimi was well-received critically and commercially, helping the band break into the mainstream. The album was adapted into a musical in 2012. It was announced in March 2007 that the album is to be made into a Broadway musical by The West Wing creator Aaron Sorkin and director .","dar":"The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals)."},{"n":112,"year":2002,"ar":"Neko Case","ti":"Blacklisted","cv":"https://dn710607.ca.archive.org/0/items/mbid-42dc5167-670f-4454-bfdb-709264c7e1c2/mbid-42dc5167-670f-4454-bfdb-709264c7e1c2-19556935488.png","rt":0.0,"sp":"","yt":"Dlg_yXziyLU","gen":["folk","country rock","alternative rock","country","indie rock","Rock"],"hb":[],"da":null,"dar":"Neko Case (born September 8, 1970, in Alexandria, Virginia) is an American singer and songwriter, best known for her solo career and her contributions as a member of the Canadian indie rock group The New Pornographers.\n\nCase moved around often as a child, spending the largest part of her youth in Tacoma, Washington. She left her parents at age 15 and three years later she started playing drums for several bands around the Northwest's punk rock scene."},{"n":141,"year":2002,"ar":"Beck","ti":"Sea Change","cv":"https://dn710605.ca.archive.org/0/items/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006-990718896.jpg","rt":0.0,"sp":"","yt":"JB2CvfMY6SM","gen":["folk rock","alternative rock","contemporary folk","chamber pop","indie rock","alternative country"],"hb":[],"da":"Beck has always been known for his ever-changing moods -- particularly since they often arrived one after another on one album, sometimes within one song -- yet the shift between the neon glitz of Midnite Vultures and the lush, somber Sea Change is startling, and not just because it finds him in full-on singer/songwriter mode, abandoning all of the postmodern pranksterism of its predecessor. What's startling about Sea Change is how it brings everything that's run beneath the surface of Beck's music to the forefront, as if he's unafraid to not just reveal emotions, but to elliptically examine them in .","dar":"Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist)."},{"n":2,"year":2000,"ar":"Radiohead","ti":"Kid A","cv":"https://dn710905.ca.archive.org/0/items/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5-29475045164.png","rt":0.0,"sp":"","yt":"NUnXxh5U25Y","gen":["experimental rock","avant-garde","alternative rock","art rock","electronica","post-rock"],"hb":["BipolarMuzik","verygooood"],"da":"Kid A is the fourth studio album by the English rock band Radiohead, released on 2 October 2000 by Parlophone. On the verge of a breakdown after promoting Radiohead's 1997 album OK Computer, songwriter Thom Yorke envisioned a radical change in direction. Radiohead replaced their rock sound with synthesisers, drum machines, the ondes Martenot, string orchestras and brass instruments, incorporating influences from genres such as electronic music, krautrock, jazz, and 20th-century classical music. They recorded Kid A with OK Computer producer Nigel Godrich in Paris, Copenhagen, Gloucestershire and their hometown Oxford, England. The sessions produced over 20 tracks; Radiohead saved .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":82,"year":2000,"ar":"Morphine","ti":"The Night","cv":"https://dn711408.ca.archive.org/0/items/mbid-c023c90d-0ae2-45ed-811d-048fa9222489/mbid-c023c90d-0ae2-45ed-811d-048fa9222489-24820716545.jpg","rt":0.0,"sp":"","yt":"Q889itJ4Lr8","gen":["alternative rock","Jazz","Alternative Rock"],"hb":["Frikomid","sdecandelario"],"da":null,"dar":"Morphine was formed in Cambridge, Massachusetts, United States in 1990 by Mark Sandman (vocals, bass) and Dana Colley (saxophone). Jerome Dupree became the group's drummer in 1991 prior to the release of their debut album, Good. \"Low Rock\" is Morphine's unique combination of jazz, blues and pop/rock, sung with darkly comic and ironic lyrics.  Their guitarless sound relied on an unusual combination of baritone/tenor sax, percussion and a two string slide bass."},{"n":105,"year":2000,"ar":"Joseph Arthur","ti":"Come To Where I'm From","cv":"https://dn721509.ca.archive.org/0/items/mbid-a56fe1d4-278f-4bc6-ba29-d109d8f52556/mbid-a56fe1d4-278f-4bc6-ba29-d109d8f52556-15415531924.jpg","rt":0.0,"sp":"","yt":"uTlCvnfcL4s","gen":["alternative rock","Alternative Rock"],"hb":[],"da":null,"dar":"Joseph Arthur (born September 28, 1971) is an American contemporary singer-songwriter from Akron, Ohio. He is known for his melodic compositions combined with swirling choruses. He was discovered by Peter Gabriel in the mid-'90s and signed to Gabriel's Real World label in 1996. Arthur's first album, Big City Secrets, was released in 1997 to critical acclaim.\n\nIn 2006, Arthur's song \"In the Sun\" was covered by Michael Stipe (of R.E.M.) and Coldplay singer Chris Martin."},{"n":20,"year":1999,"ar":"The Flaming Lips","ti":"The Soft Bulletin","cv":"https://dn721501.ca.archive.org/0/items/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa-23592292976.png","rt":0.0,"sp":"","yt":"MBH-169OHNg","gen":["alternative rock","psychedelic pop","art pop","chamber pop","indie rock","neo-psychedelia"],"hb":[],"da":"The Soft Bulletin is the ninth album released by The Flaming Lips on May 17, 1999 in the UK, with a US release following on June 22, 1999. It was released to wide critical acclaim and hailed by critics as a departure from their previous guitar-heavy alternative rock sound, into a more layered and intricately arranged work. The album was considered to mark a change in the course for the band, with more traditional catchy melodies and accessible-sounding music (their previous album, 1997's Zaireeka, was a quadruple album of experimental sounds meant to be played on four separate stereo systems .","dar":"The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals)."},{"n":25,"year":1999,"ar":"American Football","ti":"American Football","cv":"https://cdn2.albumoftheyear.org/600x0/album/16001-american-football_234525.jpg","rt":0.0,"sp":"","yt":"QZNYVt87y60","gen":["alternative rock","emo","Rock","Punk","Alternative Rock"],"hb":[],"da":"American Football is the debut studio album by American rock band American Football. After the break-up of The One Up Downstairs, drummer Steve Lamos started jamming with guitarist Steve Holmes. With the addition of vocalist/guitarist Mike Kinsella, the trio formed American Football. In October 1998 they released a self-titled EP through Polyvinyl. With Brendan Gamble taking producer duties, the group recorded a self-titled album at Private Studios in Urbana, Illinois. The album's sound is a throwback to early Joan of Arc, a band which Kinsella previously played drums in. American Football focused on the interaction between two guitars after listening .","dar":"American Football are an American midwest emo band from Urbana, Illinois, originally active from 1997 to 2000.\nThe band was formed by guitarist and singer Mike Kinsella (formerly of Cap'n Jazz,  The One Up Downstairs, Joan of Arc, Owls and currently of Owen) and drummer Steve Lamos (formerly of The One Up Downstairs and currently of The Geese), and also included guitar player Steve Holmes.\n\nThe band had few live performances and disbanded less than a year after releasing their self-titled album; still"},{"n":31,"year":1999,"ar":"Matthew Good Band","ti":"Beautiful Midnight","cv":"https://dn711003.ca.archive.org/0/items/mbid-5d7684f7-e198-4217-97d2-8e8d3737b45f/mbid-5d7684f7-e198-4217-97d2-8e8d3737b45f-16059919185.jpg","rt":0.0,"sp":"","yt":"k3-l1EqfTLM","gen":["alternative rock","Alternative Rock"],"hb":[],"da":"With this bold and distinct album Matthew Good Band have established their calling cards. They include lyrics that openly ravage society's current focus of materialism, dead end spirituality and other immoral but obvious societal ills, a tight hard rocking sound, and pained vocals. This album is not just a showcase to what the band can do well, rock out with the best of them, but also what the band thinks and feels deeply about. In creating their sound they've successfully created their own niche within the crazy universe of music. One of the few bands where the musical description of .","dar":"Matthew Good Band was an alternative rock band from Vancouver, British Columbia, Canada, active from 1995 until 2002. During their career, they released 4 LPs (Last of the Ghetto Astronauts, Underdogs, Beautiful Midnight and The Audio of Being) as well as  3 EPs (Lo-Fi B-Sides, Raygun and Loser Anthems). At the time the band broke up, it was composed of guitarist and vocalist Matthew Good, drummer Ian Browne, guitarist/keyboardist Dave Genn and bassist Rich Priske (Priske had replaced original bassist Geoff Lloyd)."},{"n":96,"year":1999,"ar":"Wilco","ti":"Summerteeth","cv":"https://cdn2.albumoftheyear.org/600x0/album/summerteeth-1.jpg","rt":0.0,"sp":"","yt":"-XRLxtmGzxk","gen":["alternative rock","pop rock","chamber pop","indie rock","Rock","Alternative Rock"],"hb":["Frikomid","Nubis84"],"da":"Summerteeth is the third studio album by Chicago alternative rock band Wilco. Released through Reprise Records on March 9, 1999, the album was heavily influenced lyrically by twentieth century literature, as well as singer Jeff Tweedy's marital problems. Unlike previous albums, Summerteeth was heavily overdubbed in the studio with Pro Tools. Tweedy and Jay Bennett created most of the album in the studio, a contrast to the band's previous albums, which were rehearsed live and recorded almost at once. Despite critical acclaim from numerous outlets, including Allmusic, The Chicago Tribune, and The Village Voice, Summerteeth sold approximately 200,000 copies—a modest .","dar":"Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche."},{"n":119,"year":1999,"ar":"Red Hot Chili Peppers","ti":"Californication","cv":"https://dn721604.ca.archive.org/0/items/mbid-058dcfa5-4921-4055-87b0-f541eb4adb08/mbid-058dcfa5-4921-4055-87b0-f541eb4adb08-15837297520.jpg","rt":0.0,"sp":"","yt":"iiupU-K_TKE","gen":["alternative rock","pop rock","blues","funk","funk rock","heavy metal"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","sdecandelario","verygooood"],"da":"Californication is the seventh studio album by American alternative rock band Red Hot Chili Peppers, released on June 8, 1999 on Warner Bros. Records. Produced by Rick Rubin, Californication marked the return of John Frusciante, who had previously appeared on Mother's Milk and Blood Sugar Sex Magik, to replace Dave Navarro as the band's guitarist. Frusciante's return was credited with changing the band's sound altogether. The record was a notable shift in style from what was produced with Navarro. The album's subject material incorporated various sexual innuendos commonly associated with the band, and introduced themes of lust, death, contemplations of .","dar":"Red Hot Chili Peppers is an American rock band formed in Los Angeles in 1982, consisting of Anthony Kiedis (vocals), Flea (bass), John Frusciante (guitar), and Chad Smith (drums). Their music blends elements of alternative rock, funk, punk rock, hard rock, hip hop, and psychedelic rock, and they have influenced genres such as funk metal, rap metal, rap rock, and nu metal. With over 120 million records sold worldwide, the Red Hot Chili Peppers are among the best-selling bands in history."},{"n":7,"year":1998,"ar":"Modest Mouse","ti":"The Lonesome Crowded West","cv":"https://dn710703.ca.archive.org/0/items/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f-33419350946.jpg","rt":0.0,"sp":"","yt":"G33AcZzZ0pM","gen":["alternative rock","indie rock","post-hardcore","midwest emo","Alternative Rock"],"hb":[],"da":"The Lonesome Crowded West is the third album recorded by American indie rock band Modest Mouse (the second released, but Sad Sappy Sucker was recorded before The Lonesome Crowded West and This Is a Long Drive for Someone with Nothing to Think About). The album was released on Up Records on November 18, 1997, on both compact disc and vinyl LP. Many consider the album to be one of the best indie rock albums of the 90s: Pitchfork Media ranked it #29 in their list 100 Greatest Albums of the 1990s, and the song \"Trailer Trash\" number 63 in their .","dar":"Modest Mouse is an American alternative rock band which formed in 1993 in Issaquah, Washington, United States. The band's original lineup consisted of guitarist Isaac Brock, drummer Jeremiah Green and bassist Eric Judy. Since being signed to Sony's Epic Records in 2000, Modest Mouse has attained significant popular success with songs such as \"Float On\" and \"Dashboard.\"\n\nThe band's current configuration is Isaac Brock (vocals, guitar), Tom Peloso (strings, horns, bass, keyboards), Jim Fairchild (guitar), and Eric Judy (bass))."},{"n":7,"year":1998,"ar":"Neutral Milk Hotel","ti":"In the Aeroplane Over the Sea","cv":"https://dn710607.ca.archive.org/0/items/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e-8579764982.jpg","rt":0.0,"sp":"","yt":"hy0B4uBZaOs","gen":["folk rock","alternative rock","indie rock","noise pop","indie folk","brass band"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"In the Aeroplane Over the Sea is the second and final studio album by the American indie rock band Neutral Milk Hotel. It was released in the United States on February 10, 1998 on Merge Records and May 1998 on Blue Rose Records in the United Kingdom. Jeff Mangum moved from Athens, Georgia to Denver, Colorado to prepare the bulk of the album's material with producer Robert Schneider, this time at Schneider's newly created Pet Sounds Studio at the home of Jim McIntyre. The album was the sixth-best-selling vinyl album in 2008. NME named it the 98th greatest album of .","dar":"Neutral Milk Hotel was an American alternative rock band formed by singer, guitarist, and songwriter Jeff Mangum in 1989 in Ruston, Louisiana. On the band's full-length albums, Mangum played with a number of other musicians, notably Jeremy Barnes (drums), Scott Spillane (horns), Julian Koster (musical saw/banjo/accordion/bass guitar) and producer-instrumentalist Robert Schneider. Neutral Milk Hotel were one of the original members of the Elephant Six Collective, based in Athens, Georgia."},{"n":60,"year":1998,"ar":"Eels","ti":"Electro-Shock Blues","cv":"https://dn710303.ca.archive.org/0/items/mbid-439b88b6-fe90-4f47-839f-06d337544166/mbid-439b88b6-fe90-4f47-839f-06d337544166-3780798685.jpg","rt":0.0,"sp":"","yt":"7Pvn7Aj9kpA","gen":["alternative rock","indie pop","Alternative Rock"],"hb":["verygooood"],"da":"Electro-Shock Blues is the second studio album by American rock band Eels. It was released in the United Kingdom on September 21, 1998 and October 20 in the United States by record label DreamWorks. Electro-Shock Blues was written largely in response to frontman Mark Oliver Everett's (more commonly known as E) sister's suicide and his mother's terminal lung cancer. The title refers to the electroconvulsive therapy received by Elizabeth Everett when she was institutionalized. Many of the songs deal with their decline, his response to loss and coming to terms with suddenly becoming the only living member of his family .","dar":"Eels (often typeset as eels or EELS) is an American rock band, formed in Los Angeles, California, in 1991 by singer/songwriter and multi-instrumentalist Mark Oliver Everett, known by the stage name E. Band members have changed over the years, both in the studio and on stage, making Everett the only official member for most of the band's work. Eels' music is often filled with themes of family, death, and unrequited love. Since 1996, Eels has released fourteen studio albums, seven of which charted in the Billboard 200."},{"n":63,"year":1998,"ar":"Silver Jews","ti":"American Water","cv":"https://cdn2.albumoftheyear.org/600x0/album/american-water-1.jpg","rt":0.0,"sp":"","yt":"CvdpFcNUnKc","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":[],"da":"American Water is the third full-length studio album by indie rock group Silver Jews. Released in 1998 as an LP and CD on Drag City (DC149) in America and Domino (WIG56) in Europe, American Water was recorded at The Rare Book Room in Brooklyn and mastered at Abbey Road Studios. The album features musicians Tim Barnes, David Berman, Mike Fellows, Stephen Malkmus, Chris Stroffolino, and artwork by Chris Kysor. Berman was struggling with drug addiction during the recording of American Water. Lyrically, this is expressed in a sense of solidarity with the downtrodden. He described the album's sessions saying: \"I .","dar":"Silver Jews were an American indie rock band formed in Hoboken, New Jersey, in 1989. The band's earliest incarnation was the college band Ectoslavia, formed by future Pavement founders Bob Nastanovich, Stephen Malkmus and frontman David Berman at the University of Virginia in 1985. An exercise in joyous noise, the band disbanded after graduation and the three friends moved to New York to take up various jobs - Nastanovich, a bus driver, and Berman and Malkmus, art museum security guards."},{"n":77,"year":1998,"ar":"Sunny Day Real Estate","ti":"How It Feels To Be Something On","cv":"https://ia801901.us.archive.org/30/items/mbid-d28b1565-137e-475b-b554-a4a9cde3810b/mbid-d28b1565-137e-475b-b554-a4a9cde3810b-15145525545.jpg","rt":0.0,"sp":"","yt":"BjVTp9aPvog","gen":["alternative rock","indie rock","emo","Punk","Alternative Rock"],"hb":["Frikomid","sdecandelario"],"da":"How It Feels to Be Something On is the third studio album by American emo band Sunny Day Real Estate, and the first since their 1997 comeback. It was released September 8, 1998. .","dar":"Sunny Day Real Estate is an American alternative rock band formed in Seattle, Washington in 1992. The band helped bring the emo subgenre from an underground musical phenomenon to a wider audience. The band's lineup is Jeremy Enigk (vocals, guitars), Dan Hoerner (guitar), Nate Mendel (bass) and William Goldsmith (drums).\n\nThe core of Sunny Day Real Estate formed in 1992, originally under the name Empty Set. Empty Set consisted of Dan Hoerner (guitar, vocals), Nate Mendel (bass), and William Goldsmith (drums)."},{"n":82,"year":1998,"ar":"Sparklehorse","ti":"Good Morning Spider","cv":"https://dn710008.ca.archive.org/0/items/mbid-726bbe45-8dee-45da-823a-fe999a151b22/mbid-726bbe45-8dee-45da-823a-fe999a151b22-27684278459.jpg","rt":0.0,"sp":"","yt":"XqD_mqGiWFQ","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":[],"da":"Good Morning Spider is the second album by Sparklehorse. The album’s title came from a sound that Sparklehorse singer-songwriter Mark Linkous once heard from an old pump organ that reminded him of a spider building a web. He was later told about an old folk superstition in which seeing a spider in the morning is an omen for a sad day. Following the release of its first album Vivadixiesubmarinetransmissionplot, Sparklehorse embarked on a European tour opening for Radiohead, who praised Sparklehorse as their favorite new band.It was during this tour in 1996 that Mark Linkous suffered a near-fatal overdose that .","dar":"Sparklehorse was an American indie rock band formed in 1995 in Richmond, Virginia and led by Mark Linkous (September 9, 1962 - March 6, 2010), a Richmond, Virginia native and last of a long line of southern coalminers. Linkous recorded much of Sparklehorse's material in his home studio, and his Southern Gothic vision guided Sparklehorse. Drummer and multi-instrumentalist Scott Minor was a frequent collaborator.\n\nBefore his suicide in March 2010, Linkous"},{"n":1,"year":1997,"ar":"Radiohead","ti":"OK Computer","cv":"https://dn720706.ca.archive.org/0/items/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d-43287476628.png","rt":0.0,"sp":"","yt":"jNY_wLukVW0","gen":["experimental rock","alternative rock","art rock","indie rock","space rock revival","post-britpop"],"hb":[],"da":"OK Computer is the third album by the English rock band Radiohead, released in 1997. It reached #1 on the UK Albums Chart and marked Radiohead's highest entry into the American market at the time, where it debuted at #21. OK Computer expanded the band's worldwide popularity, becoming the last Radiohead album to have a delayed release outside of the United Kingdom. As of 2007, it has been certified triple platinum in the UK and double platinum in the US. OK Computer included the singles \"Paranoid Android\", \"Karma Police\" and \"No Surprises\". The album was recorded in rural Oxfordshire and .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":25,"year":1997,"ar":"Spiritualized","ti":"Ladies and Gentlemen We Are Floating in Space","cv":"https://dn711205.ca.archive.org/0/items/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7-19716414556.jpg","rt":0.0,"sp":"","yt":"_eCGu2Te3ZA","gen":["psychedelic rock","alternative rock","art rock","space rock","neo-psychedelia","space rock revival"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Ladies and Gentlemen We Are Floating in Space is the third studio album by English space rock band Spiritualized, released on 16 June 1997. The album features guest appearances from the Balanescu Quartet, The London Community Gospel Choir and Dr. John. The title comes from the philosophical novel Sophie's World by Jostein Gaarder, the context being: “Only philosophers embark on this perilous expedition to the outermost reaches of language and existence. Some of them fall off, but others cling on desperately and yell at the people nestling deep in the snug softness, stuffing themselves with delicious food and drink. 'Ladies .","dar":"Spiritualized are an English rock band formed in 1990 in Rugby, Warwickshire, United Kingdom by Jason Pierce, who often goes by the alias J. Spaceman, after the spectacular demise of the Spacemen 3 outfit. The membership of Spiritualized changes from album to album, with Pierce being the only constant factor.\n\nThe first Spiritualized release was a space rock-esque cover of Any Way That You Want Me in 1990, a record which heralded the official split of Spacemen 3 following contractual wrangles over the band's name."},{"n":85,"year":1997,"ar":"The Verve","ti":"Urban Hymns","cv":"https://dn710203.ca.archive.org/0/items/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034-29045897897.jpg","rt":0.0,"sp":"","yt":"GQNxSTFf6zQ","gen":["alternative rock","chamber pop","indie rock","neo-psychedelia","britpop","post-britpop"],"hb":[],"da":"Urban Hymns is the third album by English rock band The Verve, released on 29 September 1997. It earned nearly unanimous critical praise upon its release and went on to become the band's best-selling release and one of the biggest-selling albums of the year. The album received nearly unanimous critical praise upon its release, with Melody Maker naming Urban Hymns as the number-one album of 1997 in its year-end list. The album is featured in the book \"1001 Albums You Must Hear Before You Die\". In the years following its release, Urban Hymns received much acclaim. In 1998, it won .","dar":"The Verve were an English rock band formed in Wigan in 1990 by lead vocalist Richard Ashcroft, guitarist Nick McCabe, bass guitarist Simon Jones, and drummer Peter Salisbury. Guitarist and keyboardist Simon Tong joined the band during its first reunion.\n\nThe band initially developed a psychedelic and shoegaze sound, showcased on their debut album \"A Storm in Heaven.\" By 1997, The Verve had released three EPs and three studio albums. Throughout their career"},{"n":127,"year":1997,"ar":"Super Furry Animals","ti":"Radiator","cv":"https://dn711401.ca.archive.org/0/items/mbid-b9854978-60b5-4534-aea8-26cca7c469dc/mbid-b9854978-60b5-4534-aea8-26cca7c469dc-4137065045.jpg","rt":0.0,"sp":"","yt":"ydl8CwwdPDo","gen":["psychedelic rock","alternative rock","indie rock","Rock","Electronic","Pop"],"hb":[],"da":null,"dar":"Super Furry Animals is a Welsh rock band formed in Cardiff in 1993. The group’s long-term lineup consists of Gruff Rhys (lead vocals, guitar), Huw Bunford (lead guitar, vocals), Guto Pryce (bass guitar), Cian Ciaran (keyboards, synthesizers, electronics, occasional guitar, vocals), and Dafydd Ieuan (drums, vocals). An earlier version of the band featured actor Rhys Ifans as lead vocalist.\n\nThe band emerged as part of a wave of Welsh music in the 1990s"},{"n":153,"year":1997,"ar":"Lungfish","ti":"Indivisible","cv":"https://dn711200.ca.archive.org/0/items/mbid-69446457-af5d-429a-966a-88100370447c/mbid-69446457-af5d-429a-966a-88100370447c-18975811993.jpg","rt":0.0,"sp":"","yt":"G6CJ5x6YMCw","gen":["alternative rock","indie rock","post-hardcore","rock","Rock","Punk"],"hb":[],"da":null,"dar":"Lungfish is a post-hardcore band formed in 1987 in Baltimore, Maryland, United States. All of their music has been released by the Washington, D.C. punk label Dischord except for their first LP, Necklace of Heads which was released by Simple Machines (it was later added to the CD release of Talking Songs for Walking by Dischord).\n\nTheir lineup as of 2005 consists of Daniel Higgs (vocals), Asa Osborne (guitars and vocals), Sean Meadows (bass guitar), and Mitchell Feldstein (drums). Previous bass guitar players are John Chriest and Nathan Bell."},{"n":33,"year":1996,"ar":"Cardiacs","ti":"Sing to God","cv":"https://dn711203.ca.archive.org/0/items/mbid-80772eda-3097-34c2-87a4-78ad9ae87edb/mbid-80772eda-3097-34c2-87a4-78ad9ae87edb-19153390465.jpg","rt":0.0,"sp":"","yt":"ax9yT3t1jSI","gen":["experimental rock","avant-prog","alternative rock","art rock","progressive rock","art punk"],"hb":[],"da":"Sing to God is the fourth studio album by English rock band Cardiacs. Their first album with drummer Bob Leith and their second as a four-piece, it was recorded throughout 1995, breaking a hiatus by the band that had lasted since the band's previous album Heaven Born and Ever Bright (1992). During writing and recording, Jon Poole took a greater role than before, contributing to many songs written by band leader Tim Smith, and writing some of his own. The band decided to create a double album to encompass the great wealth of material written after their previous album. As .","dar":"Cardiacs, originally called Cardiac Arrest, were an English band formed in 1977 and led by Tim Smith (1961-2020). Noted for their complex, varied and intense compositional style and for their eccentric, theatrical stage shows, they have been hailed as an influence by many newer groups and artists.\n\nAs well as Smith, around 23 musicians were part of the Cardiacs over the years, including Smith's brother, Jim, and multi-instrumentalist, Sarah Cutts, who married Tim Smith in 1983."},{"n":82,"year":1996,"ar":"Beck","ti":"Odelay","cv":"https://dn710302.ca.archive.org/0/items/mbid-804b7f78-0bbc-3479-887a-ab28390357d4/mbid-804b7f78-0bbc-3479-887a-ab28390357d4-4507123240.jpg","rt":0.0,"sp":"","yt":"RQ6EnfFGDiM","gen":["alternative rock","contemporary folk","indie rock","neo-psychedelia","hip hop","alternative country"],"hb":[],"da":"Odelay is the second major-label studio album (and fourth album overall) recorded by alternative rock artist Beck, originally released June 18, 1996. It was produced by the Dust Brothers. After the mainstream success of \"Loser\", Odelay featured several hit singles, including \"Where It's At\", \"Devils Haircut,\" and \"The New Pollution.\" The album peaked at #16 on the Billboard 200 chart and eventually sold over 2 million copies in the United States. It was also Beck's first hit album in the United Kingdom, making #17; it has since gone platinum in the UK. On January 29, 2008, Odelay was reissued as .","dar":"Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist)."},{"n":114,"year":1996,"ar":"Manic Street Preachers","ti":"Everything Must Go","cv":"https://dn711109.ca.archive.org/0/items/mbid-dfaaddd9-622e-4e46-a572-4a6363abb1fb/mbid-dfaaddd9-622e-4e46-a572-4a6363abb1fb-14359140360.jpg","rt":0.0,"sp":"","yt":"CM_R2p9GDbk","gen":["alternative rock","power pop","post-grunge","britpop","Rock","Punk"],"hb":["Nubis84","verygooood"],"da":"Everything Must Go is the fourth studio album by Welsh alternative rock band Manic Street Preachers. It was released on 20 May 1996, through Epic Records, and was the first record released by the band following the disappearance of lyricist and rhythm guitarist Richey Edwards. Released at the height of Britpop in the mid-1990s, the album was a commercial and critical success, it reached its peak in the UK on separate occasions, debuting and peaking at number 2 in the UK Albums Chart and earned the band accolades in the 1997 Brit Awards. It represented a shift in the group's .","dar":"Manic Street Preachers are an alternative rock band from Blackwood, Wales, formed in 1986. Often referred to as \"the Manics\", they are James Dean Bradfield (vocals, guitars), Nicky Wire (bass, occasional vocals) and Sean Moore (drums, backing vocals, occasional trumpet). The band were originally a quartet: lyricist and rhythm guitarist Richey Edwards mysteriously vanished on 1 February 1995. He was declared presumed deceased in November 2008.\n\nThe Manics released their debut album Generation Terrorists in 1992."},{"n":167,"year":1996,"ar":"Marilyn Manson","ti":"Antichrist Superstar","cv":"https://dn721509.ca.archive.org/0/items/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8/mbid-807ccf9e-0d14-4f5e-ab09-ae944fdf58a8-21167273304.jpg","rt":0.0,"sp":"","yt":"tHI1uEQLjCk","gen":["alternative rock","hard rock","heavy metal","industrial rock","industrial metal","alternative metal"],"hb":["Frikomid","Lonsonxd"],"da":"Antichrist Superstar is the second studio album by American rock band Marilyn Manson, released on October 8, 1996, by Nothing and Interscope Records. It was recorded at Nothing Studios in New Orleans and produced by the band's eponymous vocalist along with Sean Beavan, former Skinny Puppy producer Dave Ogilvie and Trent Reznor of Nine Inch Nails. The recording of the album was marred by excessive drug use, which provoked a high level of antagonism between band members. Consequently, it was their last release to feature contributions from founding guitarist Daisy Berkowitz, who acrimoniously quit partway through recording. .","dar":"Marilyn Manson is an American rock band formed in Fort Lauderdale, Florida, in 1989 by vocalist Marilyn Manson and guitarist Daisy Berkowitz. Initially performing under the name Marilyn Manson & the Spooky Kids, the group gained a local following in South Florida during the early 1990s through their theatrical and provocative live performances. In 1993, they became the first act signed to Trent Reznor’s Nothing Records label. Until 1996, each band"},{"n":169,"year":1996,"ar":"Dirty Three","ti":"Horse Stories","cv":"https://dn710902.ca.archive.org/0/items/mbid-5eb49fb8-f7e9-340c-b2d6-2c2a7dda10f7/mbid-5eb49fb8-f7e9-340c-b2d6-2c2a7dda10f7-19653581823.jpg","rt":0.0,"sp":"","yt":"z1Lh06y6Z1Q","gen":["alternative rock","post-rock","Alternative Rock"],"hb":[],"da":null,"dar":"Dirty Three is an Australian instrumental rock band, consisting of Warren Ellis (violin and bass guitar), Mick Turner (electric and bass guitars) and Jim White (drums). They formed in Melbourne, Australia in 1992.\n\nDuring their career the group have spent much of their time overseas, when not performing together Turner is based in Melbourne, White lives in New York, and Ellis in Paris.\n\nThe trio released their debut 'Sad & Dangerous', and eponymous album in 1995"},{"n":188,"year":1996,"ar":"Wilco","ti":"Being There","cv":"https://dn710309.ca.archive.org/0/items/mbid-d18b273a-4987-4594-a4db-419454c7e113/mbid-d18b273a-4987-4594-a4db-419454c7e113-2013460549.jpg","rt":0.0,"sp":"","yt":"Vn7ZSbZhKVE","gen":["country rock","alternative rock","country","alternative country","Rock","Alternative Rock"],"hb":[],"da":"Being There is the second album by Chicago-based rock band Wilco. Despite its release as a nineteen-song double album, Being There was sold at a single album price due to a deal between lead singer Jeff Tweedy and Reprise Records. Released on October 29, 1996, the album was an improvement for the band in both sales and critical reception as compared with their first album, A.M.. Taking its name from the 1979 film Being There, the self-produced effort featured more surrealistic and introspective writing than their previous album. This was due in part to several significant changes in Tweedy's life, .","dar":"Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche."},{"n":48,"year":1994,"ar":"Nirvana","ti":"In Utero","cv":"https://dn710700.ca.archive.org/0/items/mbid-7d13c434-1c49-4d7f-b164-a5247108af01/mbid-7d13c434-1c49-4d7f-b164-a5247108af01-19918667556.jpg","rt":0.0,"sp":"","yt":"GrLUUVfKeUw","gen":["alternative rock","noise rock","punk","post-hardcore","grunge","pigfuck"],"hb":[],"da":"In Utero is the third and final studio album by the American alternative rock band Nirvana, released on September 21, 1993 by DGC Records. Following the success of the group's 1991 breakthrough album Nevermind, Nirvana sought to avoid that album's polished production and hired recording engineer Steve Albini to produce the record. The band recorded In Utero with Albini in two weeks in February 1993, capturing an abrasive and naturalistic sound for the record. While some of the songs had been written years prior, the lyrics largely dealt with frontman Kurt Cobain's reflections on his newfound fame and recent personal .","dar":"There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s."},{"n":4,"year":1994,"ar":"Nine Inch Nails","ti":"The Downward Spiral","cv":"https://ia601606.us.archive.org/7/items/mbid-2d410836-5add-3661-b0b0-168ba1696611/mbid-2d410836-5add-3661-b0b0-168ba1696611-2546761764.jpg","rt":0.0,"sp":"","yt":"fnw_UbJmmbY","gen":["alternative rock","art rock","industrial","industrial rock","industrial metal","alternative metal"],"hb":["BipolarMuzik","EliasJ72","Frikomid","GabredMared","Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"The Downward Spiral (also known as Halo 8) is Nine Inch Nails' second studio album, though it is largely considered the third major release after the Broken EP, which consisted of entirely new material. It was released on March 8, 1994. It is likely the most acclaimed and well-known of the band's discography, and is said to have brought \"industrial\" music to the mainstream. A collection featuring remixes from The Downward Spiral was released as Further Down The Spiral on June 1, 1995. Inspiration Trent Reznor has stated in various interviews some of the ideas and inspiration behind the album: .","dar":"Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated"},{"n":5,"year":1994,"ar":"Jeff Buckley","ti":"Grace","cv":"https://dn710600.ca.archive.org/0/items/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1-24008507233.jpg","rt":0.0,"sp":"","yt":"ywEByqEVQRk","gen":["folk rock","alternative rock","classic rock","pop rock","Rock","Alternative Rock"],"hb":["BipolarMuzik","Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"\"Grace\" is the first and only complete studio album by Jeff Buckley, released on August 23, 1994. The album is named after the title track, \"Grace\", co-written by Buckley and Gary Lucas. While the album initially had poor sales, only peaking at #149 in the U.S., it received wide critical acclaim. It has now sold over 2 million copies worldwide. An extended version of the album (subtitled Legacy Edition) celebrating its tenth anniversary was released in 2004, and it peaked at #44 in the UK. Musicians such as Thom Yorke of Radiohead and Matthew Bellamy of Muse list Buckley among .","dar":"Jeffrey Scott \"Jeff\" Buckley (raised Scott Moorhead; November 17, 1966 – May 29, 1997) was an American musician. After spending approximately a decade as a session guitarist in Los Angeles, he began performing in the early 1990s at venues in Manhattan’s East Village, where he developed a following. Buckley signed with Columbia Records and released his only studio album, \"Grace\", in 1994. He toured internationally to promote the album, performing in the United States, Europe, Japan, and Australia."},{"n":11,"year":1994,"ar":"Weezer","ti":"Weezer","cv":"https://dn710605.ca.archive.org/0/items/mbid-73698ebd-069e-4bed-9fd6-9b196be45e0d/mbid-73698ebd-069e-4bed-9fd6-9b196be45e0d-26316341371.jpg","rt":0.0,"sp":"","yt":"b45rzwIBS_Y","gen":["alternative rock","pop punk","power pop","emo","alternative pop","geek rock"],"hb":["Nubis84"],"da":"\"Weezer\" may refer to: the May 1994 Blue Album (seen here) the May 2001 Green Album the June 2008 Red Album the April 2016 White Album the January 2019 Teal Album the March 2019 Black Album Weezer is the debut studio album by American rock band Weezer, released on May 10, 1994, by DGC Records. It was produced by Ric Ocasek. Weezer formed in Los Angeles in 1992, and initially struggled to engage audiences, who were more interested in grunge. Weezer (Green Album) , Weezer (Red Album), and Weezer (Deluxe Edition) were all renamed to \"Weezer\" in February 2023. .","dar":"Weezer is an American alternative rock band formed in Los Angeles, California in 1992. They have released 15 full length albums, 1 cover album, six EPs, and a DVD. Their latest album, titled 'Van Weezer', came out on May 7th, 2021, Although, they released 4 EPs in 2022, known as SZNZ. They've sold over ten million records in the United States to date, and 35 million worldwide. They play music influenced by alternative bands and power pop artists among others."},{"n":12,"year":1994,"ar":"Manic Street Preachers","ti":"The Holy Bible","cv":"https://dn710902.ca.archive.org/0/items/mbid-04c6af71-bb83-4791-922b-66a7091102ab/mbid-04c6af71-bb83-4791-922b-66a7091102ab-23548633118.jpg","rt":0.0,"sp":"","yt":"tettEqBvpqc","gen":["alternative rock","hard rock","post-punk","punk rock","Rock","Punk"],"hb":[],"da":"The Holy Bible is the third studio album by the Welsh rock band Manic Street Preachers. It was released on August 30, 1994 by Epic Records, a subsidiary of Sony Records, unlike their two previous albums which had been released on the Columbia Records imprint. It peaked at number 6 on the UK Albums Chart. The first single from the album, \"Faster\", was released on June 6 and peaked at #16 on the British singles chart. The single marked a new chapter for the band as the material was both lyrically and sonically different than their previous release, the Life .","dar":"Manic Street Preachers are an alternative rock band from Blackwood, Wales, formed in 1986. Often referred to as \"the Manics\", they are James Dean Bradfield (vocals, guitars), Nicky Wire (bass, occasional vocals) and Sean Moore (drums, backing vocals, occasional trumpet). The band were originally a quartet: lyricist and rhythm guitarist Richey Edwards mysteriously vanished on 1 February 1995. He was declared presumed deceased in November 2008.\n\nThe Manics released their debut album Generation Terrorists in 1992."},{"n":13,"year":1994,"ar":"Soundgarden","ti":"Superunknown","cv":"https://dn720709.ca.archive.org/0/items/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c-2236678397.jpg","rt":0.0,"sp":"","yt":"fELbXTDl5Ao","gen":["psychedelic rock","alternative rock","hard rock","stoner rock","grunge","alternative metal"],"hb":["Frikomid","Lonsonxd","sdecandelario"],"da":"Superunknown is the fourth album by the American grunge band Soundgarden. It was released on March 8, 1994 through A&M Records. The band began work on the album after touring in support of its previous album, Badmotorfinger. The resulting album captured the creativity and heaviness of the band's earlier releases while displaying a more diverse range of influences. The album was a critical and commercial success and became the band's breakout album. It peaked at number one on the Billboard 200 and reached high positions on charts worldwide. Five singles were released from the album: The Day I Tried to .","dar":"Soundgarden was an American rock band formed in Seattle, Washington, in 1984 by singer and drummer Chris Cornell, lead guitarist Kim Thayil, and bassist Hiro Yamamoto. Cornell switched to rhythm guitar in 1985, and the drum position was taken over first by Scott Sundquist and then by Matt Cameron in 1986. Yamamoto departed in 1989 and was replaced briefly by Jason Everman before Ben Shepherd joined later that year. Soundgarden disbanded in 1997 and reunited in 2010."},{"n":19,"year":1994,"ar":"Pavement","ti":"Crooked Rain, Crooked Rain","cv":"https://ia800607.us.archive.org/5/items/mbid-8684f971-08a2-3551-8e5c-a87440408725/mbid-8684f971-08a2-3551-8e5c-a87440408725-23540686482.jpg","rt":0.0,"sp":"","yt":"4IED3Q5VLeg","gen":["alternative rock","indie rock","noise pop","rock","Alternative Rock"],"hb":[],"da":"Crooked Rain, Crooked Rain is an album released by Pavement in 1994. With this album, the band abandoned the lo-fi sound displayed on Slanted and Enchanted (as well as their drummer, Gary Young). During the tour for Slanted, the band added percussionist Bob Nastanovich and bassist Mark Ibold; partway through this album's recording sessions, Gary Young was replaced by Steve West. The album featured the band at its most easily accessible, and the single \"Cut Your Hair\" was the band's closest brush with mainstream success. As of 2007, the album has sold almost 500,000 copies and was a UK Top .","dar":"Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s."},{"n":37,"year":1994,"ar":"Sunny Day Real Estate","ti":"Diary","cv":"https://ia802906.us.archive.org/16/items/mbid-d4ab95e8-c07e-479b-8d6d-dadad2819195/mbid-d4ab95e8-c07e-479b-8d6d-dadad2819195-30781295626.jpg","rt":0.0,"sp":"","yt":"4FRFcE-jsQo","gen":["alternative rock","indie rock","midwest emo","emo","Punk","Alternative Rock"],"hb":[],"da":"Diary is the debut studio album by American rock band Sunny Day Real Estate, released on May 10, 1994. The album is considered by many to be a defining emo album of the second wave, and key in the development of its subgenre, Midwest emo. It has also been called the \"missing link\" between post-hardcore and the nascent emo genre. .","dar":"Sunny Day Real Estate is an American alternative rock band formed in Seattle, Washington in 1992. The band helped bring the emo subgenre from an underground musical phenomenon to a wider audience. The band's lineup is Jeremy Enigk (vocals, guitars), Dan Hoerner (guitar), Nate Mendel (bass) and William Goldsmith (drums).\n\nThe core of Sunny Day Real Estate formed in 1992, originally under the name Empty Set. Empty Set consisted of Dan Hoerner (guitar, vocals), Nate Mendel (bass), and William Goldsmith (drums)."},{"n":58,"year":1994,"ar":"Oasis","ti":"Definitely Maybe","cv":"https://dn721801.ca.archive.org/0/items/mbid-d6f68975-dc8f-4e91-ac6f-0061b2adb325/mbid-d6f68975-dc8f-4e91-ac6f-0061b2adb325-31844190146.jpg","rt":0.0,"sp":"","yt":"toHOnObXAbo","gen":["alternative rock","neo-psychedelia","shoegaze","britpop","Rock","Pop"],"hb":[],"da":"Definitely Maybe is the debut album from the British rock band Oasis, released in 1994 under the Creation label. It has received positive reviews from music magazines. The first single of the album, \"Live Forever\", was voted Best Brittish Song, by voters of the alternative rock station Xfm London. Allmusic states that in this album the best of Rock'n'Roll, from The Beatles to The Stone Roses are mixed together. It's one of the best selling debut albums ever. .","dar":"Oasis are an English rock band formed in Manchester in 1991. The original lineup consisted of Liam Gallagher on lead vocals, Paul \"Bonehead\" Arthurs on guitar, Paul \"Guigsy\" McGuigan on bass guitar, and Tony McCarroll on drums. Liam’s older brother Noel Gallagher joined later as lead guitarist and vocalist, becoming the group’s main songwriter and de facto leader. Oasis are regarded as one of the most successful and influential bands of the Britpop movement."},{"n":92,"year":1994,"ar":"The Offspring","ti":"Smash","cv":"https://dn710908.ca.archive.org/0/items/mbid-b50d155a-5cde-3600-b768-5a6fc0ce57eb/mbid-b50d155a-5cde-3600-b768-5a6fc0ce57eb-31844265343.jpg","rt":0.0,"sp":"","yt":"WanovkthKcA","gen":["alternative rock","hard rock","punk","punk rock","rock","Punk"],"hb":["sdecandelario"],"da":"Smash is the third studio album by American punk rock band The Offspring, released on April 8, 1994 through Epitaph Records. The album was the band's last collaboration with record producer Thom Wilson, who produced their previous two albums, and also their last release on Epitaph (however, that label released their next album in Europe). Smash met high critical reception upon its release, and is now considered a classic punk rock album by fans, critics, and the band members themselves alike. The album was also responsible for bringing The Offspring to the attention of a mainstream punk audience. Smash was .","dar":"The Offspring is a punk rock band formed in Huntington Beach, California, United States in 1984. From 1987 to 2003, the band's line-up included Dexter Holland (lead vocals, guitar), Noodles (lead and rhythm guitars, back vocals), Greg K. (bass, back vocals), and Ron Welty (drums, percussion), who was fired in 2003. Their current drummer is Brandon Pertzborn of Marilyn Manson who has been with the band since 2023. Greg K was fired from the band in 2018 and was replaced by Todd Morse."},{"n":99,"year":1994,"ar":"Shellac","ti":"At Action Park","cv":"https://dn711004.ca.archive.org/0/items/mbid-13cb27a3-a149-4aa3-93e3-47b2cc6e0ab7/mbid-13cb27a3-a149-4aa3-93e3-47b2cc6e0ab7-26663400234.jpg","rt":0.0,"sp":"","yt":"AC7Pkwmllow","gen":["alternative rock","noise rock","industrial","indie rock","math rock","Rock"],"hb":[],"da":"At Action Park is the debut studio album by American rock band Shellac, released on October 24th, 1994 via Touch and Go Records. .","dar":"Shellac (sometimes referred to as 'Shellac of North America') was an American rock music group formed in Chicago, Illinois, in 1992 by Steve Albini (guitar and vocals), Bob Weston (bass guitar vocals) and Todd Trainer (drums). They have been classified as post-hardcore, noise rock and math rock. Albini has claimed they refer to themselves as 'Shellac of North America', \"when we're being pretentious.\"\n\nThey have a distinctive, minimalist sound based on unusual and urgent time signatures"},{"n":101,"year":1994,"ar":"Rodan","ti":"Rusty","cv":"https://dn710705.ca.archive.org/0/items/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb/mbid-9830d183-e96a-4ee0-bc14-cb0b58b39dcb-29575120474.jpg","rt":0.0,"sp":"","yt":"Q_NKtGTstVw","gen":["alternative rock","indie rock","post-hardcore","post-rock","Rock","Punk"],"hb":[],"da":"Rusty is the first and only full-length studio album by American math rock band Rodan. It was released in April 1994 on Quarterstick Records. The album takes its name from its engineer, Bob “Rusty” Weston. Rusty received critical acclaim and has since been cited as an influential album, often compared favorably to Slint’s 1991 album Spiderland. AllMusic writer Ned Raggett said, “this is an album to readily get lost in. The evident variety is another reason to listen, not least because everything is handled so aptly, parts of a greater overall whole.” .","dar":"There are four bands called Rodan:\n\n1) Rodan (1992) emerging from the same circle of musicians that spawned Squirrel Bait and Slint, Rodan formed in 1992 out of a failed high school rap project. Guitarists Jason Noble and Jeff Mueller enlisted Tara Jane O’Neil on bass and a couple of drummers before Kevin Coultas came aboard permanently. After a couple of 7”s and self-released cassettes, Quarterstick released the band’s first and only full-length Rusty in 1994."},{"n":114,"year":1994,"ar":"Green Day","ti":"Dookie","cv":"https://dn720706.ca.archive.org/0/items/mbid-20fef8d3-72b5-369a-9712-ad0b1ee6d226/mbid-20fef8d3-72b5-369a-9712-ad0b1ee6d226-7378765590.png","rt":0.0,"sp":"","yt":"koyYZc6hS-s","gen":["alternative rock","punk","punk rock","pop punk","skate punk","alternative punk"],"hb":[],"da":"Dookie is the third studio album and the major label debut by American Alternative rock band Green Day. The album was the band's first collaboration with producer Rob Cavallo. Released on February 1st, 1994 through Reprise Records, Dookie became a worldwide commercial success, reaching number two on the U.S. Billboard 200 and charting in seven countries. The album helped to propel Green Day into mainstream popularity, amid claims from the punk rock community that the band had \"sold out\". Dookie produced five singles for the band: \"Longview\", the re-recorded \"Welcome to Paradise\", \"Basket Case\", the radio-only single \"She\" and \"When .","dar":"Green Day is an American rock band formed in Rodeo, California, in 1987, by lead singer and guitarist Billie Joe Armstrong and bassist and backing vocalist Mike Dirnt, with drummer Tré Cool joining in 1990. The band’s major-label debut, \"Dookie,\" released through Reprise Records in 1994, achieved commercial success, eventually shipping over 20 million copies in the United States, and has been credited with renewing mainstream interest in punk rock."},{"n":121,"year":1994,"ar":"Lisa Germano","ti":"Geek The Girl","cv":"https://dn710305.ca.archive.org/0/ite
