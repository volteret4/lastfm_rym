<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

th album from billy woods, the Zimbabwean-Jamaican-by-way-of-Brooklyn rapper, who delivers a fragmentation grenade of an album. An explosive riot of bitter invective, evocative lyricism, and daisycutter beats, \"History Will Absolve Me\" is a solid hour of hardboiled anti-nostalgia. The album features guest appearances by established stars like Roc Marciano, Vordul Mega (Cannibal Ox), MarQ Spekt, and Masai Bey, but also features up-and-coming talents Elucid and junclassic. Willie Green, A.M. Breakups, Marmaduke, Nasa (Def Jux/Uncommon Music), and Man Mantis handle the beats and provide a backdrop that matches the intensity of woods’ labyrinthine .","dar":"Born in Washington, DC, Billy Woods (stylized as billy woods) is a rapper based out of New York City. He has also lived in Zimbabwe, Jamaica, and Maryland. Billy Woods is a member of the Super Chron Flight Brothers with Priviledge, Armand Hammer with Elucid, and The Reavers supergroup.\n\nHis mother was an English literature professor from Jamaica. His father was a Ph.D. Marxist writer, active in the Zimbabwe War of Liberation and then a member of the government in Zimbabwe."},{"n":173,"year":2011,"ar":"Shabazz Palaces","ti":"Black Up","cv":"https://cdn2.albumoftheyear.org/600x0/album/2386-black-up_155534.jpg","rt":0.0,"sp":"","yt":"67cx9M2c51M","gen":["avant-garde","psychedelic","dub","hip hop","experimental hip hop","abstract hip hop"],"hb":[],"da":null,"dar":"Shabazz Palaces is an American hip hop group from Seattle led by Ishmael Butler, also known as Palaceer Lazaro, formerly a member of the jazz rap group Digable Planets. Much of the project’s work was developed in collaboration with multi-instrumentalist Tendai “Baba” Maraire, the son of mbira musician Dumisani Maraire. Active since 2009, Shabazz Palaces has released five studio albums on Sub Pop, following the self-release of two EPs.\n\nThe group initially released two EPs anonymously in 2009, titled \"Shabazz Palaces\" and \"Of Light\"."},{"n":1,"year":2004,"ar":"Madvillain","ti":"Madvillainy","cv":"https://dn710700.ca.archive.org/0/items/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708/mbid-b88edf3d-7a88-4d1e-b51b-50022fde5708-28231687719.jpg","rt":0.0,"sp":"","yt":"zQ0yXh_ADlQ","gen":["alternative hip hop","hip hop","experimental hip hop","instrumental hip hop","jazz rap","abstract hip hop"],"hb":[],"da":"Madvillainy is the legendary collaboration between rapper MF DOOM and producer Madlib under the group name Madvillain. It is considered one of the greatest hip-hop albums ever. It was released on March 23, 2004, on Stones Throw Records. The album was recorded between 2002 and 2004. Madlib created most of the instrumentals during a trip to Brazil in his hotel room using minimal amounts of equipment: a Boss SP-303 sampler, a turntable, and a tape deck. Fourteen months before the album was released, an unfinished demo version was stolen and leaked onto the internet. Frustrated, the duo stopped working on .","dar":"Madvillain was an American hip-hop duo consisting of two MCs and producers, MF DOOM and Madlib. Their debut album Madvillainy was met with wide critical acclaim for its unique approach. Their short songs, obscure lyrics and sparse choruses made for a sound that was generally unfriendly to commercial radio, but was lauded as a key aspect of their identity as an underground act.\n\nIn 2006, Madvillain was featured on Stones Throw Records and Adult Swim's DVD/CD Chrome Children with a new song and live performance."},{"n":20,"year":2000,"ar":"Ghostface Killah","ti":"Supreme Clientele","cv":"https://dn710604.ca.archive.org/0/items/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90/mbid-55c57300-5bc4-4dec-85a3-7d8698c9bc90-955219996.jpg","rt":0.0,"sp":"","yt":"QZfdJx8Z1yw","gen":["hip hop","east coast hip hop","boom bap","hardcore hip hop","abstract hip hop"],"hb":[],"da":"Supreme Clientele is the second studio album of American rapper and Wu-Tang Clan member Ghostface Killah, released February 8, 2000 on Epic Records. The album showcases Ghostface's signature up-tempo, stream-of-consciousness rhyme style, and features guest appearances from Cappadonna, GZA, Masta Killa, Method Man, Raekwon, Redman, RZA, U-God, and others. If features members of what would become affiliates Theodore Unit and T.M.F. Supreme Clientele contains a large amount of production from group member RZA, who also re-worked and remixed beats from other producers involved, as a means to create a unified and cohesive sound for the album. Supreme Clientele debuted at .","dar":"Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele"},{"n":10,"year":1996,"ar":"OutKast","ti":"ATLiens","cv":"https://cdn2.albumoftheyear.org/600x0/album/atliens-1.jpg","rt":0.0,"sp":"","yt":"CplOmO_lGco","gen":["alternative hip hop","hip hop","conscious hip hop","dirty south","abstract hip hop","southern hip hop"],"hb":["EliasJ72","Rocky_stereo","alberto_gu","sdecandelario"],"da":"ATLiens is the second studio album by American hip-hop duo OutKast, released on August 27, 1996, by LaFace Records. The duo sought to improve on their 1994 debut album Southernplayalisticadillacmuzik and gain respect for their burgeoning Southern hip-hop scene. ATLiens has been listed by several magazines and critics as one of the greatest hip-hop albums of all time. OutKast recorded ATLiens in sessions at several Atlanta studios—Bosstown Recording Studios, Doppler Recording Studios, PatchWerk Recording Studio, Purple Dragon Studios, and Studio LaCoCo—as well as Chung King Recording Studio and Sound On Sound Recording in New York City. The record features outer .","dar":"OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette."},{"n":25,"year":1996,"ar":"Dr. Octagon","ti":"Dr. Octagonecologyst","cv":"https://dn711308.ca.archive.org/0/items/mbid-cddbf21f-9cd8-4665-a015-3cdc50cdcc72/mbid-cddbf21f-9cd8-4665-a015-3cdc50cdcc72-2925311149.jpg","rt":0.0,"sp":"","yt":"NebOetHhffU","gen":["hip hop","experimental hip hop","east coast hip hop","abstract hip hop","nerdcore","Hip-Hop"],"hb":["paqueradejere"],"da":"Dr. Octagonecologyst is the debut solo album of American rapper Keith Thornton and the first album he released under the alias Dr. Octagon. It was released May 6, 1996, on Bulk Recordings in the United States and Mo' Wax in the United Kingdom, and re-released in the US on DreamWorks Records in 1997. Dr. Octagonecologyst was produced by Dan \"The Automator\" Nakamura and featured the work of turntablist DJ Qbert. KutMasta Kurt provided additional production work. The artwork for Dr. Octagonecologyst was drawn by Brian \"Pushead\" Schroeder. Dr. Octagonecologyst introduces the character of Dr. Octagon, a homicidal, extraterrestrial, time-traveling gynecologist .","dar":"Dr. Octagon is one of Kool Keith's many alter egos.  His initial release as Dr. Octagon was 1996's Dr. Octagonecologyst, on which he collaborated with Dan The Automator Nakamura and DJ QBert. After the name was dropped in favour of Dr. Dooom, it was widely believed that it wouldn't be used again until the release of 2006's The Return of Dr. Octagon, which Keith maintains was changed and released without his consent.\n\nThe original album achieved critical acclaim and was a springboard for Dan The Automator's young career"},{"n":66,"year":1996,"ar":"Ghostface Killah","ti":"Ironman","cv":"https://cdn2.albumoftheyear.org/600x0/album/7984-ironman_172609.jpg","rt":0.0,"sp":"","yt":"a74LEdZawLo","gen":["hip hop","east coast hip hop","conscious hip hop","boom bap","hardcore hip hop","abstract hip hop"],"hb":[],"da":"Ironman is the solo debut album by American hip hop artist and Wu-Tang Clan member Ghostface Killah, released October 29, 1996, on Epic Records. Though mainly produced by fellow group member RZA, the LP is slightly different to that of other first generation solo Wu-Tang albums, owing much of its thematic scope, mythology and samples from classic 1960s and 1970s blaxploitation films, as well as a wider range of soul samples. It is also notable for being considerably more open in its references to the Nation of Gods and Earths and the group's beliefs. Upon its release, Ironman debuted at .","dar":"Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele"},{"n":40,"year":1991,"ar":"De La Soul","ti":"De La Soul Is Dead","cv":"https://dn710309.ca.archive.org/0/items/mbid-a7f61a4b-f205-46d0-8aac-0e1ae6d64dd6/mbid-a7f61a4b-f205-46d0-8aac-0e1ae6d64dd6-2587513089.jpg","rt":0.0,"sp":"","yt":"fL_uR33mcX0","gen":["alternative hip hop","hip hop","jazz rap","conscious hip hop","boom bap","abstract hip hop"],"hb":[],"da":"De La Soul Is Dead is the second studio album by American hip-hop group De La Soul, released on May 14, 1991. It was produced by Prince Paul .","dar":"De La Soul is an American hip-hop group formed in 1988 in the Amityville area of Long Island, New York. They are best known for their eclectic sampling, quirky lyrics, and their contributions to the evolution of the jazz rap and alternative hip-hop subgenres. The members are Posdnuos, Maseo, and Trugoy (until his death in 2023). The three formed the group in high school and caught the attention of producer Prince Paul with a demo tape of the song \"Plug Tunin'\"."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
