<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

by Chicago alternative rock band Wilco. Released through Reprise Records on March 9, 1999, the album was heavily influenced lyrically by twentieth century literature, as well as singer Jeff Tweedy's marital problems. Unlike previous albums, Summerteeth was heavily overdubbed in the studio with Pro Tools. Tweedy and Jay Bennett created most of the album in the studio, a contrast to the band's previous albums, which were rehearsed live and recorded almost at once. Despite critical acclaim from numerous outlets, including Allmusic, The Chicago Tribune, and The Village Voice, Summerteeth sold approximately 200,000 copies—a modest .","dar":"Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche."},{"n":119,"year":1999,"ar":"Red Hot Chili Peppers","ti":"Californication","cv":"https://dn721604.ca.archive.org/0/items/mbid-058dcfa5-4921-4055-87b0-f541eb4adb08/mbid-058dcfa5-4921-4055-87b0-f541eb4adb08-15837297520.jpg","rt":0.0,"sp":"","yt":"iiupU-K_TKE","gen":["alternative rock","pop rock","blues","funk","funk rock","heavy metal"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","sdecandelario","verygooood"],"da":"Californication is the seventh studio album by American alternative rock band Red Hot Chili Peppers, released on June 8, 1999 on Warner Bros. Records. Produced by Rick Rubin, Californication marked the return of John Frusciante, who had previously appeared on Mother's Milk and Blood Sugar Sex Magik, to replace Dave Navarro as the band's guitarist. Frusciante's return was credited with changing the band's sound altogether. The record was a notable shift in style from what was produced with Navarro. The album's subject material incorporated various sexual innuendos commonly associated with the band, and introduced themes of lust, death, contemplations of .","dar":"Red Hot Chili Peppers is an American rock band formed in Los Angeles in 1982, consisting of Anthony Kiedis (vocals), Flea (bass), John Frusciante (guitar), and Chad Smith (drums). Their music blends elements of alternative rock, funk, punk rock, hard rock, hip hop, and psychedelic rock, and they have influenced genres such as funk metal, rap metal, rap rock, and nu metal. With over 120 million records sold worldwide, the Red Hot Chili Peppers are among the best-selling bands in history."},{"n":128,"year":1997,"ar":"Jim O'Rourke","ti":"Bad Timing","cv":"https://dn710901.ca.archive.org/0/items/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418-27073926441.jpg","rt":0.0,"sp":"","yt":"g4KSE4oo9d8","gen":["experimental rock","avant-garde","folk rock","pop rock","american primitive guitar","rock"],"hb":["Nubis84"],"da":"Bad Timing is an album by American musician Jim O'Rourke, released on Drag City in 1997. It is an instrumental album, consisting largely of Jim O'Rourke's acoustic guitar playing (much in the style of John Fahey), sometimes with additional instrumentation. The album is named after the 1980 film Bad Timing: A Sensual Obsession, directed by Nicolas Roeg. It is one of a trio of O'Rourke albums, along with Eureka and Insignificance, to be named after Roeg films from the 1980s. This album is a favorite of Wilco's Jeff Tweedy. .","dar":"American indie rock and avant-garde musician, composer and producer Jim O'Rourke (born January 18, 1969, in Chicago) has been a key component in the increasing overlap of the American and European experimental music avant-garde, working in everything from jazz and rock to ambient and electro-acoustic and building many a bridge in between. He currently resides in Yamanashi, Japan.\n\nA Chicago native, O'Rourke's work has found equal luck with experimental jazz and noise fanatics"},{"n":184,"year":1997,"ar":"Paul McCartney","ti":"Flaming Pie","cv":"https://dn710103.ca.archive.org/0/items/mbid-3dec33d8-f1fd-473a-a49a-1f2a35af6820/mbid-3dec33d8-f1fd-473a-a49a-1f2a35af6820-43733776847.png","rt":0.0,"sp":"","yt":"tmQruAOp0T4","gen":["folk","pop rock","Rock","Pop"],"hb":[],"da":"Flaming Pie is an album by Paul McCartney, first released in 1997. His first studio album in over four years, it was mostly recorded following McCartney's involvement in the highly successful The Beatles Anthology project. In Flaming Pie's liner notes Mc Cartney said: \"(Anthology) reminded me of The Beatles' standards and the standards that we reached with the songs. So in a way it was a refresher course that set the framework for this album.\" Beginning in February 1995, McCartney teamed up with Jeff Lynne, Electric Light Orchestra lead singer and guitarist, an ardent Beatles fan who had previously worked .","dar":"Sir James Paul McCartney CH MBE (born 18 June 1942) is an English singer, songwriter, musician, and record and film producer who gained worldwide fame as co-lead vocalist and bassist for the Beatles. His songwriting partnership with John Lennon remains the most successful in history. After the group disbanded in 1970, he pursued a solo career and formed the band Wings with his first wife, Linda, and Denny Laine.\n\nA self-taught musician, McCartney is proficient on bass, guitar, keyboards, and drums."},{"n":86,"year":1994,"ar":"Seal","ti":"Seal","cv":"https://dn710008.ca.archive.org/0/items/mbid-d93b507b-883e-4501-825b-ae555517c021/mbid-d93b507b-883e-4501-825b-ae555517c021-33742931454.jpg","rt":0.0,"sp":"","yt":"z2su9gbRrIk","gen":["pop rock","soul","r&b","contemporary r&b","pop soul","progressive soul"],"hb":[],"da":"Seal is the debut studio album by Seal, released in 1991. It contains the singles \"Crazy\", \"Future Love Paradise\", \"The Beginning\", \"Killer\" and \"Violet\". The album debuted at number one in the UK and went on to win Best British Album at the 1992 Brit Awards. Seal's following album, released in 1994, was also named Seal. It is usually referred to as Seal II. .","dar":"Seal Henry Olusegun Olumide Adeola Samuel (born February 19, 1963 in Paddington, London) is a Grammy award winning English soul singer-songwriter of Nigerian and Brazilian descent, professionally known only by his first name, Seal. A childhood battle with discoid lupus left him with distinctive facial scarring and hair loss. He released his debut studio album Seal in 1991 and has since released 1994's Seal II, 1998's Human Being, 2003's Seal IV, 2007's System and 2010's Commitment."},{"n":5,"year":1994,"ar":"Jeff Buckley","ti":"Grace","cv":"https://dn710600.ca.archive.org/0/items/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1/mbid-ecba98a1-8831-37ec-8756-5d8e006884a1-24008507233.jpg","rt":0.0,"sp":"","yt":"ywEByqEVQRk","gen":["folk rock","alternative rock","classic rock","pop rock","Rock","Alternative Rock"],"hb":["BipolarMuzik","Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"\"Grace\" is the first and only complete studio album by Jeff Buckley, released on August 23, 1994. The album is named after the title track, \"Grace\", co-written by Buckley and Gary Lucas. While the album initially had poor sales, only peaking at #149 in the U.S., it received wide critical acclaim. It has now sold over 2 million copies worldwide. An extended version of the album (subtitled Legacy Edition) celebrating its tenth anniversary was released in 2004, and it peaked at #44 in the UK. Musicians such as Thom Yorke of Radiohead and Matthew Bellamy of Muse list Buckley among .","dar":"Jeffrey Scott \"Jeff\" Buckley (raised Scott Moorhead; November 17, 1966 – May 29, 1997) was an American musician. After spending approximately a decade as a session guitarist in Los Angeles, he began performing in the early 1990s at venues in Manhattan’s East Village, where he developed a following. Buckley signed with Columbia Records and released his only studio album, \"Grace\", in 1994. He toured internationally to promote the album, performing in the United States, Europe, Japan, and Australia."},{"n":71,"year":1994,"ar":"Tom Petty","ti":"Wildflowers","cv":"https://dn711000.ca.archive.org/0/items/mbid-6a87e042-f9d6-437d-a218-263aceaa209b/mbid-6a87e042-f9d6-437d-a218-263aceaa209b-39501014993.jpg","rt":0.0,"sp":"","yt":"c_m1EO_vRWw","gen":["folk rock","rock and roll","classic rock","pop rock","heartland rock","Rock"],"hb":["paqueradejere","sdecandelario"],"da":"Released in 1994, Wildflowers is the second solo album by Rock Icon Tom Petty. .","dar":"Thomas Earl Petty (20 October 1950 - 2 October 2017) was an American musician, singer, composer and songwriter best known for fronting Tom Petty and the Heartbreakers. Apart from the band, he released three solo albums: \"Full Moon Fever\" (1989), \"Wildflowers\" (1994) and \"Highway Companion\" (2006). \n \nAfter working with his early bands The Sundowners, The Epics, and Mudcrutch (which also included future Heartbreakers members Mike Campbell and Benmont"},{"n":197,"year":1993,"ar":"Sarah McLachlan","ti":"Fumbling Towards Ecstasy","cv":"https://dn711309.ca.archive.org/0/items/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd-4534872028.jpg","rt":0.0,"sp":"","yt":"vf727y_HsOE","gen":["folk rock","alternative rock","pop rock","soft rock","dream pop","Rock"],"hb":[],"da":"Fumbling Towards Ecstasy is Sarah McLachlan's critically-acclaimed third studio album. It was produced by Pierre Marchand in Montreal, and released in 1993. The album was an immediate hit in Canada, where McLachlan was already an established star. Over the next two years, it became her breakthrough album internationally as well. However, in some countries, most notably the United States, the album was a steady seller that stayed in the middle ranges of the pop charts for almost two years, rather than the #1 smash that McLachlan would achieve with 1997's Surfacing. It is often considered by critics, though, her most .","dar":"Sarah McLachlan (born Sarah Ann McLachlan January 28, 1968 in Halifax, Nova Scotia, Canada) is a Grammy-winning musician, singer and songwriter. \n\nShe is known for the emotional sound of her ballads. Some of her most popular songs include \"Angel\", \"Building a Mystery\", \"Adia\", \"Possession\", \"Fallen\", \"I Will Remember You\", and \"World on Fire\". Her best-selling album to date is Surfacing, for which she won two Grammy Awards and four Juno Awards.\n\nHer first album Touch was released in September 28, 1988, recorded in 1987-1988, Vancouver, Canada."},{"n":29,"year":1992,"ar":"R.E.M.","ti":"Automatic for the People","cv":"https://dn711101.ca.archive.org/0/items/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17-7646243169.jpg","rt":0.0,"sp":"","yt":"jBUjeOBzkIk","gen":["alternative rock","pop rock","acoustic rock","indie rock","jangle pop","Punk"],"hb":[],"da":"Automatic for the People is the eighth album by the American alternative rock band R.E.M., released in 1992 on Warner Bros. Records. While R.E.M. had intended to make a harder-rocking album after dealing primarily with acoustic based sounds on its previous record Out of Time (1991), the group eventually abandoned that goal and created an album that was musically subdued and dealt with mortality. Automatic for the People reached number two on the US album charts and yielded six singles. It was ranked #247 in Rolling Stone’s 500 Greatest Albums of All Time. After promotional duties for their previous album .","dar":"R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming."},{"n":184,"year":1992,"ar":"Morrissey","ti":"Your Arsenal","cv":"https://dn710303.ca.archive.org/0/items/mbid-596071f9-a2ff-3185-a471-8fcb029625dd/mbid-596071f9-a2ff-3185-a471-8fcb029625dd-6618437694.jpg","rt":0.0,"sp":"","yt":"SX-da_xcbEQ","gen":["alternative rock","pop rock","glam rock","indie rock","indie pop","jangle pop"],"hb":[],"da":"Your Arsenal is the third studio album by English singer Morrissey, released on 27 July 1992 by record label HMV. The album received critical acclaim and reached number 4 on the UK Albums Chart. Morrissey had been rehearsing with a new band prior to the release of Your Arsenal, which was the first official album of this new line-up. Commencing with \"You're Gonna Need Someone on Your Side\", the album represents a clear change in direction for Morrissey from indie pop to a more muscular rock sound; with some elements of rockabilly. It also contains a glam rock influence, due .","dar":"Steven Patrick Morrissey, better known as Morrissey, is a British singer and lyricist of Irish descent born in Davyhulme, Manchester, United Kingdom on May 22, 1959.\n\nHe was the lead singer of The Smiths, one of the most influential alternative bands in the 1980s. The group split up in 1987 and Morrissey started a successful solo career.\n\nHis first solo album, Viva Hate was released only six months after The Smiths split, in March 1988. The album's first single \"Suedehead\" peaked at #5"},{"n":56,"year":1991,"ar":"U2","ti":"Achtung Baby","cv":"https://dn711103.ca.archive.org/0/items/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f-16544589722.jpg","rt":0.0,"sp":"","yt":"tkoEGVAHpZg","gen":["alternative rock","pop rock","post-punk","indie rock","alternative dance","dance-rock"],"hb":[],"da":"Achtung Baby is the seventh studio album by Irish rock band U2, released on 19 November 1991. The album arrived nearly two years after lead vocalist Bono announced the band would have to \"go away and dream it all up again\", following the mixed response to 1988's Rattle and Hum. While recording Achtung Baby, there was a rift between band members over the direction of the band's sound. Tensions almost prompted U2 to break-up until the band rallied around the writing of the album's hit One. The album marks a dramatic change in the band's image and sound, with the .","dar":"U2 are an Irish rock band formed in Dublin in 1976. The group comprises Paul \"Bono\" Hewson (lead vocals and rhythm guitar), David \"the Edge\" Evans (lead guitar, keyboards, and backing vocals), Adam Clayton (bass guitar), and Larry Mullen Jr. (drums and percussion). Initially rooted in post-punk, U2's musical style has evolved throughout their career, yet has maintained an anthemic quality built on Bono's expressive vocals and the Edge's chiming, effects-based guitar sounds."},{"n":76,"year":1991,"ar":"Crowded House","ti":"Woodface","cv":"https://dn721208.ca.archive.org/0/items/mbid-4ef05565-c3ed-3ab2-8330-679a1c293e13/mbid-4ef05565-c3ed-3ab2-8330-679a1c293e13-23737557295.jpg","rt":0.0,"sp":"","yt":"kM_rJt8CMFo","gen":["alternative rock","pop rock","Rock","Pop","Alternative Rock"],"hb":[],"da":"“Woodface” is the third studio album by Crowded House. The album was produced by Mitchell Froom and Neil Finn and was released by Capitol Records in July 1991. It features five singles: \"Chocolate Cake\", \"Fall at Your Feet\", \"It's Only Natural\", \"Weather with You\", and \"Four Seasons in One Day\". Woodface was a major hit in Australia and New Zealand as well as giving the band their first top ten hit album in the UK. It was listed at No. 3 in the book 100 Best Australian Albums in October 2010. It was voted number 80 in the third edition .","dar":"Crowded House are a rock group formed in 1985 in Melbourne, Australia and led by New Zealand musician and singer-songwriter Neil Finn. The band were originally active from 1986 to 1996 before deciding to split up. In 2007, the band reunited to record and tour again.\n\nNeil Finn and Paul Hester decided to form a new band during the Split Enz farewell tour 'Enz with a Bang'. Nick Seymour approached Finn during the after party for the Melbourne show and asked if he could try out for this new band."},{"n":151,"year":1991,"ar":"Julian Cope","ti":"Peggy Suicide","cv":"https://dn711008.ca.archive.org/0/items/mbid-9be99ebf-9486-4981-a13b-d1c960bc9ca7/mbid-9be99ebf-9486-4981-a13b-d1c960bc9ca7-6280248403.jpg","rt":0.0,"sp":"","yt":"6aYdbINegos","gen":["pop rock","post-punk","indie rock","Rock"],"hb":[],"da":"\"In the summer of 1990, I had a vision of the world. In that vision I saw the Mother Earth - an enormous goddess standing upright and proud, but throwing her head back in pain and confusion at the treatment that Mankind has chosen to mete out to her. The goddess's hair was the wind around the world and her left arm was outstretched, the moon spinning on the index finger of her left hand. She was bruised from chemical dumping, and her expression one of ecstatic and religious/spiritual sadness. There were rays of blazing light piercing the centre of .","dar":"Julian Cope (born Julian David Cope, on 21 October 1957, in Deri, Mid Glamorgan) was raised in Tamworth, Staffordshire.  He came to prominence as the singer of the Liverpool pop band The Teardrop Explodes in 1978. Cope has since released many solo albums and is a founding member of the bands Queen Elizabeth and Brain Donor. In addition to his musical career, Cope has written several books of non-fiction and autobiography.\n\nCope grew up in Tamworth, Staffordshire in the English Midlands."},{"n":18,"year":1990,"ar":"Prefab Sprout","ti":"Jordan: The Comeback","cv":"https://dn721601.ca.archive.org/0/items/mbid-43f87b31-88ab-4ce2-b43b-ef00c845240b/mbid-43f87b31-88ab-4ce2-b43b-ef00c845240b-27014615934.jpg","rt":0.0,"sp":"","yt":"QPbaYJpK_sw","gen":["pop rock","synth-pop","Pop","Alternative Rock"],"hb":[],"da":"Jordan: The Comeback is the fifth album by Prefab Sprout, released in August 1990. The album showed Prefab Sprout continuing their musical evolution from the prickly jangle guitars of Swoon, their debut. The use of synths is more prominent, lending the album a poppier feel, and Paddy McAloon explores other genres on some songs, from samba to doo-wop. The album was critically acclaimed: it was nominated for Best Album at the BRIT Awards, and reached #7 on the charts in the UK. It was - by Prefab Sprout's admittedly modest standards - a commercial success. Their next album, 1997's Andromeda .","dar":"Prefab Sprout are an English pop band from Witton Gilbert, County Durham formed in 1976, who rose to fame during the 1980s. Though critically acclaimed, and considered by many to have released some of the best pop albums of the decade, the band never matched this acclaim with commercial success. The band's best known lineup comprised Paddy McAloon (vocals, guitar, keyboard), Wendy Smith (vocals, guitar, keyboard), Martin McAloon (bass), and Neil Conti (drums)."},{"n":64,"year":1990,"ar":"Paul Simon","ti":"The Rhythm of the Saints","cv":"https://dn710605.ca.archive.org/0/items/mbid-fa1d8308-47d4-33af-b377-ecb27483fb2d/mbid-fa1d8308-47d4-33af-b377-ecb27483fb2d-24020454806.jpg","rt":0.0,"sp":"","yt":"pIjjy1BxA4s","gen":["folk rock","folk","pop rock","Rock","Pop"],"hb":[],"da":"The Rhythm of the Saints is the eighth solo studio album by American singer-songwriter Paul Simon, released on October 16, 1990 on Warner Bros. Following the success of 1986's Graceland, on which he worked principally with South African musicians, Simon broadened his interests in diverse forms of music from around the world. He turned to Latin America for the musicians and rhythms which characterize much of this album, partnering with Afro-Brazilian superstars Grupo Cultural Olodum, masters of the heavily percussive sub-style of samba called Batuque or Batucada. The group's drumming is featured on the opening song and first single, \"The .","dar":"Paul Frederic Simon (born October 13, 1941) is an American singer-songwriter. One of the most celebrated artists of the twentieth century, Simon's career has spanned six decades. Born in New Jersey, Simon grew up in the borough of Queens in New York City and developed an interest in rock music in his teens.\n\nHe began performing with his schoolfriend Art Garfunkel in 1956; together the two came to prominence in the 1960s as Simon & Garfunkel. The duo's blend of folk and rock music in hits like \"The Sound of Silence\", \"Mrs."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
