<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":169,"year":2020,"ar":"Neptunian Maximalism","ti":"Eons","cv":"https://dn710205.ca.archive.org/0/items/mbid-14a1d5d0-5264-4832-946b-f73a1d0dc199/mbid-14a1d5d0-5264-4832-946b-f73a1d0dc199-26796753835.jpg","rt":0.0,"sp":"","yt":"Cj1B5V9bDHU","gen":["avant-garde","avant-garde jazz","free jazz","drone","avant-garde metal","brutal prog"],"hb":[],"da":null,"dar":"Belgium's NEPTUNIAN MAXIMALISM (aka NNMM) is a community of “cultural engineers” with a variable line-up, mixing drone metal with spiritual free jazz and psychedelic music. The project was initiated in 2018 by multi-instrumentalist Guillaume Cazalet (Czlt, Jenny Torse, Aksu), who brought together veteran saxophonist Jean Jacques Duerinckx (Ze Zorgs) and two drummers, Sebastien Schmit (K-Branding) and Pierre Arese (Aksu). In 2020, Stephane FDL and Lukas Bouchenot took the drums."},{"n":45,"year":2018,"ar":"Imperial Triumphant","ti":"Vile Luxury","cv":"https://ia800905.us.archive.org/25/items/mbid-70eb44ae-23c3-430a-a101-f744ee39386e/mbid-70eb44ae-23c3-430a-a101-f744ee39386e-20386921091.jpg","rt":0.0,"sp":"","yt":"ZkisK98J5i8","gen":["avant-garde","classical","heavy metal","black metal","avant-garde metal","dissonant death metal"],"hb":[],"da":"\"Vile Luxury\" is the third full-length studio album by New York-based black metal/avant-garde metal band Imperial Triumphant. The album was produced by Colin Marston (Gorguts, Krallice, etc) with artwork from Andrew Tremblay. According to the band, the album \"embodies the most austere side of the New York underground. Chaos, menagerie, and the perils of the city clash with its reputation for majesty and extravagance. The band aim to portray the juxtaposition between high society and urban decay.\" .","dar":"Born in the metropolis: Imperial Triumphant embodies the sounds of New York. The chaos, the menagerie, the perils and majesty of the greatest city on earth. We portray this great juxtaposition between high society homoeroticism coexisting with absolute filth and urban decay. Our city is like the corpse of a giant. What was once so bright, grand and spectacular, is now filled with greedy maggots writhing towards their share of 'success'. We don't support it nor are we against. We only play the sounds of the New York City as we hear them."},{"n":14,"year":2014,"ar":"Spectral Lore","ti":"III","cv":"https://dn720700.ca.archive.org/0/items/mbid-7b4058c8-5fb1-4292-ad8f-b44fdea164e7/mbid-7b4058c8-5fb1-4292-ad8f-b44fdea164e7-41934904468.jpg","rt":0.0,"sp":"","yt":"Nq2uQHd3w_g","gen":["avant-garde","black metal","atmospheric black metal","atmospheric/post/black-metal / ambient","Metal","Rock"],"hb":[],"da":null,"dar":"Spectral Lore is an ambient black metal project founded in 2005 and based in Athens, Greece.  The band is a side project of Ayloss of Divine Element, and focuses on instrumental and often experimental compositions.  Ayloss has released four albums, three EPs, and six splits."},{"n":54,"year":2014,"ar":"Bent Knee","ti":"Shiny Eyed Babies","cv":"https://dn711004.ca.archive.org/0/items/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0-12550985966.jpg","rt":0.0,"sp":"","yt":"o2aBQclnk0M","gen":["experimental rock","avant-garde","alternative rock","synth-pop","indie rock","Rock"],"hb":[],"da":null,"dar":"Bent Knee is an American art rock band formed in Boston, Massachusetts in 2009. The band performs in multiple genres and draws from multiple influences, including pop, industrial rock, hip hop, and avant-garde. The band is known for unpredictable dynamic contrast and the wide vocal range of singer Courtney Swain."},{"n":12,"year":2013,"ar":"Kayo Dot","ti":"Hubardo","cv":"https://dn710007.ca.archive.org/0/items/mbid-9cf7e62d-d3fb-487e-be7e-228820567536/mbid-9cf7e62d-d3fb-487e-be7e-228820567536-30118066947.jpg","rt":0.0,"sp":"","yt":"KEVzKUhXNso","gen":["avant-garde","psychedelic","avant-garde metal","Metal"],"hb":[],"da":"Hubardo is the sixth album, a concept double album, by Kayo Dot, self-released and funded through pre-orders on frontman Toby Driver's Ice Level Records in 2013. It is the follow up to Gamma Knife, which was released in 2012. It is Kayo Dot's longest album and its first double album, and contains aspects of black metal, post-rock, jazz fusion, and chamber music. It is considered a throwback to maudlin of the Well and early Kayo Dot recordings, containing much more metal-style harsh vocals by Driver and collaborator Jason Byron than any Kayo Dot album. It also contains much more repetition, .","dar":"Kayo Dot is an avant-rock group originally from Boston, Massachusetts, United States (now based in Brooklyn, New York) that was formed in 2003 by Toby Driver after the disband of maudlin of the Well. They released their debut album Choirs of the Eye on John Zorn's Tzadik label that year.\n\nIts lineup is constantly changing, but has consisted of Toby Driver, Ron Varod, Mia Matsumiya, Keith Abrams, Tim Byrnes, David Bodie, Dan Means and Terran Olson."},{"n":99,"year":2013,"ar":"Chelsea Wolfe","ti":"Pain Is Beauty","cv":"https://dn710907.ca.archive.org/0/items/mbid-8425af95-054b-4342-9e9c-33407f25a3fd/mbid-8425af95-054b-4342-9e9c-33407f25a3fd-9426683785.jpg","rt":0.0,"sp":"","yt":"puM-dX__pK0","gen":["experimental rock","avant-garde","folk","gothic rock","dark wave","ethereal wave"],"hb":[],"da":null,"dar":"Chelsea Wolfe (born Chelsea Joy Wolfe on November 14, 1983) is an American singer-songwriter and musician from Roseville, California. Her work blends elements of gothic rock, doom metal, folk, and darkwave, often described as \"doom folk\" and \"drone-metal-art-folk.\" Growing up in Northern California with a country musician father who owned a home studio, Wolfe began writing poetry at age 7 and recording songs by age 9, which she later described as \"basically Casio-based gothy R&B songs.\""},{"n":173,"year":2011,"ar":"Shabazz Palaces","ti":"Black Up","cv":"https://cdn2.albumoftheyear.org/600x0/album/2386-black-up_155534.jpg","rt":0.0,"sp":"","yt":"67cx9M2c51M","gen":["avant-garde","psychedelic","dub","hip hop","experimental hip hop","abstract hip hop"],"hb":[],"da":null,"dar":"Shabazz Palaces is an American hip hop group from Seattle led by Ishmael Butler, also known as Palaceer Lazaro, formerly a member of the jazz rap group Digable Planets. Much of the project’s work was developed in collaboration with multi-instrumentalist Tendai “Baba” Maraire, the son of mbira musician Dumisani Maraire. Active since 2009, Shabazz Palaces has released five studio albums on Sub Pop, following the self-release of two EPs.\n\nThe group initially released two EPs anonymously in 2009, titled \"Shabazz Palaces\" and \"Of Light\"."},{"n":10,"year":2006,"ar":"Joanna Newsom","ti":"Ys","cv":"https://dn711106.ca.archive.org/0/items/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16/mbid-894ff003-8e94-4faf-bdc0-b9a1a3349d16-9262812691.jpg","rt":0.0,"sp":"","yt":"cJ1yFhjRnNc","gen":["avant-garde","folk","alternative rock","chamber folk","baroque pop","country"],"hb":[],"da":"Ys is the second studio album by American musician Joanna Newsom. It was released by Drag City on November 6, 2006. The album was produced by Newsom and Van Dyke Parks, recorded by Steve Albini, mixed by Jim O'Rourke, with accompanying orchestral arrangements by Van Dyke Parks. It features guest vocals from Bill Callahan and Emily Newsom. The vocals and harp were recorded at The Village Recording Studio in Los Angeles in December 2005, with the orchestration being recorded between May and June 2006 at the Entourage Studios in Los Angeles. The album consists of five tracks with song durations .","dar":"Joanna Caroline Newsom is an American singer, songwriter, musician and actress. Born and raised in Northern California, Newsom was classically trained on the harp in her youth and began her musical career as a keyboardist in the San Francisco-based indie band The Pleased.\n\nAfter recording and self-releasing two EPs in 2002, Newsom was signed to the independent label Drag City. Her debut album, The Milk-Eyed Mender, was released in 2004 to critical acclaim and garnered Newsom an underground following."},{"n":24,"year":2006,"ar":"Natural Snow Buildings","ti":"The Dance of the Moon and the Sun","cv":"https://cdn2.albumoftheyear.org/600x0/album/25188-the-dance-of-the-moon-and-the-sun_215349.jpg","rt":0.0,"sp":"","yt":"eu4EZJ3SAqM","gen":["avant-garde","folk","drone","Metal","Rock"],"hb":[],"da":"The Dance of the Moon and the Sun is the third studio album by French Avant-Folk duo Natural Snow Buildings, released in 2006 as a limited-edition CD-R on their Students of Decay imprint. The Dance of the Moon and the Sun includes heavily processed guitar tones, haunting vocals, and subtle field recordings. The album is usually noted as being emotionally sombre. Since its release, the album has developed a small but devoted cult following among music forums, with original CD-R copies fetching high prices on resell sites. .","dar":"Natural Snow Buildings is a duo from Vitré, France, consisting of artists Mehdi Ameziane and Solange Gularte. They play music which can be classified as experimental,  psychedelic folk with drone elements and ambient influences. Formed in 1997, they have released numerous albums, many of them in extremely limited quantities. \n\nBoth members of Natural Snow Buildings record as solo artists: Mehdi Ameziane as TwinSisterMoon and Solange Gularte as Isengrind."},{"n":99,"year":2002,"ar":"Oxbow","ti":"An Evil Heat","cv":"https://dn710309.ca.archive.org/0/items/mbid-d7210ab9-a37c-4f9c-a723-3317ff5344d5/mbid-d7210ab9-a37c-4f9c-a723-3317ff5344d5-17473934192.jpg","rt":0.0,"sp":"","yt":"eMWTXQXEiJ8","gen":["avant-garde","blues","electric blues","Rock"],"hb":[],"da":null,"dar":"Oxbow is a long-lived avant-garde band formed in 1988 in San Francisco, California that is notable for their prolific touring and unique sound. Oxbow plays a blend of noise rock, avant-garde jazz, musique concrète (AMG), and blues, creating soundscapes caustic, or plangent, with overtones of paranoia, revulsion, exaltation.\n\nThe first album in 1989 combining the squall of bands like The Birthday Party with elements of free jazz and musique concrète from Oxbow"},{"n":2,"year":2000,"ar":"Radiohead","ti":"Kid A","cv":"https://dn710905.ca.archive.org/0/items/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5-29475045164.png","rt":0.0,"sp":"","yt":"NUnXxh5U25Y","gen":["experimental rock","avant-garde","alternative rock","art rock","electronica","post-rock"],"hb":["BipolarMuzik","verygooood"],"da":"Kid A is the fourth studio album by the English rock band Radiohead, released on 2 October 2000 by Parlophone. On the verge of a breakdown after promoting Radiohead's 1997 album OK Computer, songwriter Thom Yorke envisioned a radical change in direction. Radiohead replaced their rock sound with synthesisers, drum machines, the ondes Martenot, string orchestras and brass instruments, incorporating influences from genres such as electronic music, krautrock, jazz, and 20th-century classical music. They recorded Kid A with OK Computer producer Nigel Godrich in Paris, Copenhagen, Gloucestershire and their hometown Oxford, England. The sessions produced over 20 tracks; Radiohead saved .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":54,"year":1997,"ar":"Robert Wyatt","ti":"Shleep","cv":"https://dn711103.ca.archive.org/0/items/mbid-bcdf7dd5-a51f-4f11-a79e-ad467639ed2a/mbid-bcdf7dd5-a51f-4f11-a79e-ad467639ed2a-3186241592.jpg","rt":0.0,"sp":"","yt":"tl2MrVhsq4Q","gen":["avant-garde","art rock","progressive rock","canterbury scene","Rock","Jazz"],"hb":[],"da":"Robert Wyatt continues to follow his singular musical path with the lovely Shleep, delivering another album of considerable quirky charm and understated beauty; a less melancholy affair than much of his recent work, the record is informed by a hazy, dreamlike quality perfectly in keeping with the elements of subconsciousness implicit in the title. .","dar":"Robert Wyatt, born Robert Ellidge, in Bristol, UK on 28 January 1945, is an English musician, and a former member of the influential Canterbury scene band Soft Machine.\n\nAs a teenager, he lived with his parents in a fourteen-room Georgian guest-house, Wellington House, in Lydden near Canterbury. Here he was taught the drums by visiting American jazz drummer George Niedorf.\n\nIn 1962, Wyatt and Niedorf moved to Majorca where they stayed with the poet Robert Graves."},{"n":128,"year":1997,"ar":"Jim O'Rourke","ti":"Bad Timing","cv":"https://dn710901.ca.archive.org/0/items/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418/mbid-9d4e7cd3-2126-47b0-a0c3-7ff93570c418-27073926441.jpg","rt":0.0,"sp":"","yt":"g4KSE4oo9d8","gen":["experimental rock","avant-garde","folk rock","pop rock","american primitive guitar","rock"],"hb":["Nubis84"],"da":"Bad Timing is an album by American musician Jim O'Rourke, released on Drag City in 1997. It is an instrumental album, consisting largely of Jim O'Rourke's acoustic guitar playing (much in the style of John Fahey), sometimes with additional instrumentation. The album is named after the 1980 film Bad Timing: A Sensual Obsession, directed by Nicolas Roeg. It is one of a trio of O'Rourke albums, along with Eureka and Insignificance, to be named after Roeg films from the 1980s. This album is a favorite of Wilco's Jeff Tweedy. .","dar":"American indie rock and avant-garde musician, composer and producer Jim O'Rourke (born January 18, 1969, in Chicago) has been a key component in the increasing overlap of the American and European experimental music avant-garde, working in everything from jazz and rock to ambient and electro-acoustic and building many a bridge in between. He currently resides in Yamanashi, Japan.\n\nA Chicago native, O'Rourke's work has found equal luck with experimental jazz and noise fanatics"},{"n":183,"year":1997,"ar":"Hash Jar Tempo","ti":"Well Oiled","cv":"https://dn711303.ca.archive.org/0/items/mbid-c5f1e419-7e8b-4338-a726-d9ca1c3ecf51/mbid-c5f1e419-7e8b-4338-a726-d9ca1c3ecf51-16072079429.jpg","rt":0.0,"sp":"","yt":"0aEtkSLf9hY","gen":["avant-garde","space rock","Metal","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"In case you hadn't figured it out yourself, Hash Jar Tempo takes its name from the 70s krautrock group Ash Ra Tempel. Pretty funny, huh? This pretty much sums up the band: take that kraut sound and bring it to the future under the guise of epic-length drone, and you have Hash Jar Tempo. Despite the Hash part of the name, the music is not necessarily drug-influenced, but rather, just like with those old Germans, \"the drug was the music.\" In other words"},{"n":3,"year":1991,"ar":"Talk Talk","ti":"Laughing Stock","cv":"https://dn720709.ca.archive.org/0/items/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42/mbid-1d9d8be7-c5cf-4822-a7e9-55e665b6eb42-7497588359.jpg","rt":0.0,"sp":"","yt":"ARehbaKm4U0","gen":["experimental rock","avant-garde","post-rock","rock","Jazz","Pop"],"hb":[],"da":"Laughing Stock is the fifth and final LP from Talk Talk, released on November 19, 1991 from Polydor records. It marks the pinnacle of the band's transformation from synth-pop into an experimental, impressionistic sound that would later share characteristics with what music critics called post-rock; as such, it is the quintessential document of a proto-post-rock sound from this incredibly creative group, and it serves as a touchstone record for the era. Since it's release, many years later it has been hailed as a lost classic of the grunge-era nineties. Talk Talk had been steadily gestating a sound transformation from records .","dar":"Talk Talk were an English band formed in 1981 by Mark Hollis (vocals, guitar, piano), Lee Harris (drums), Paul Webb (bass), and Simon Brenner (keyboards). The band initially performed as a synth-pop group, and their first two albums, \"The Party's Over\" (1982) and \"It's My Life\" (1984), reached the top 40 in the UK and produced international singles including \"Talk Talk\", \"Today\", \"It's My Life\", and \"Such a Shame\".\n\nThe band's third album, \"The Colour of Spring\" (1986)"},{"n":96,"year":1991,"ar":"Mercury Rev","ti":"Yerself Is Steam","cv":"https://dn721607.ca.archive.org/0/items/mbid-7dd1e959-bb27-4a6d-8454-41ec80c3d0d9/mbid-7dd1e959-bb27-4a6d-8454-41ec80c3d0d9-15474284185.jpg","rt":0.0,"sp":"","yt":"820NtfymPhQ","gen":["avant-garde","psychedelic rock","art pop","art punk","neo-psychedelia","noise pop"],"hb":[],"da":null,"dar":"Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound"},{"n":178,"year":1991,"ar":"Oxbow","ti":"King of the Jews","cv":"https://dn711005.ca.archive.org/0/items/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023-4100308832.jpg","rt":0.0,"sp":"","yt":"EUfvCYLscro","gen":["avant-garde","art rock","noise rock","jazz","rock","Rock"],"hb":[],"da":null,"dar":"Oxbow is a long-lived avant-garde band formed in 1988 in San Francisco, California that is notable for their prolific touring and unique sound. Oxbow plays a blend of noise rock, avant-garde jazz, musique concrète (AMG), and blues, creating soundscapes caustic, or plangent, with overtones of paranoia, revulsion, exaltation.\n\nThe first album in 1989 combining the squall of bands like The Birthday Party with elements of free jazz and musique concrète from Oxbow"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
