<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":181,"year":2023,"ar":"Svalbard","ti":"The Weight of the Mask","cv":"https://dn721600.ca.archive.org/0/items/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb-36919906357.jpg","rt":0.0,"sp":"","yt":"3wHl7suYkAM","gen":["metal","post-hardcore","shoegaze","post-rock","post-metal","Metal"],"hb":[],"da":null,"dar":"There are several bands called Svalbard.\n\n1)  An English hardcore punk band from Bristol, formed in 2011\n2) a metal band from Silesia, Poland\n3) a martial/darkwave band from Homel, Belarus.\n\n1] Svalbard are an English hardcore punk band from Bristol, formed in 2011. Following early material (compiled on the album Discography 2012–2014) they have released four studio albums: One Day All This Will End (2015), It's Hard to Have Hope (2018), When I Die, Will I Get Better? (2020), The Weight of The Mask (2023)."},{"n":21,"year":2022,"ar":"Ethel Cain","ti":"Preacher's Daughter","cv":"https://dn721805.ca.archive.org/0/items/mbid-02e76b0a-b9c6-4f28-97cd-f09e93c5490c/mbid-02e76b0a-b9c6-4f28-97cd-f09e93c5490c-42933266015.jpg","rt":0.0,"sp":"","yt":"8Efh7tKNliU","gen":["alternative rock","shoegaze","dream pop","slowcore","ethereal wave","dark ambient"],"hb":[],"da":"MISTAGGED: See Preacher’s Daughter for correct tag. \"Preacher's Daughter\" is the debut album from American singer-songwriter Ethel Cain, released on May 12, 2022 through her own label Daughters of Cain. On March 17, 2022, Cain released the single \"Gibson Girl\", subsequently announcing her debut album release. In an interview with Alternative Press, Ethel said: “The story centers around three generations of women, and it starts with the youngest, the daughter. It’s pretty much just a classic American tale. A common theme that I like to write about is intergenerational trauma. Things that have been passed down through generations and how .","dar":"Ethel Cain is a musical project of American singer-songwriter, record producer, and model Hayden Silas Anhedönia (born March 24, 1998). This project is noted for lyrics focused on nostalgic and Southern Gothic themes, while the music has been associated with the ambient, indie rock, and contemporary folk genres. \n\nWhile Ethel Cain is her most notable project to-date, Anhedönia has other projects under different monikers, such as ΛTLΛS, Miss Anhedönia, Tommy, White Silas, and אשמדאי."},{"n":49,"year":2013,"ar":"Deafheaven","ti":"Sunbather","cv":"https://dn710105.ca.archive.org/0/items/mbid-22f1d5cc-61a7-4976-975b-bf123e685fb9/mbid-22f1d5cc-61a7-4976-975b-bf123e685fb9-6186723462.jpg","rt":0.0,"sp":"","yt":"GfbLWHT7vUU","gen":["shoegaze","post-rock","post-metal","blackgaze","screamo","Metal"],"hb":["EliasJ72","Frikomid","Nubis84","Rocky_stereo","paqueradejere","sdecandelario","verygooood"],"da":"'Sunbather' is the second studio album by the American Blackgaze band Deafheaven. The Jack Shirley-produced album was released on June 11, 2013 through Deathwish Inc. 'Sunbather' was recorded in January 2013. The cover artwork for 'Sunbather' was designed by Nick Steinhardt of Touché Amoré who also designed the band's 2011 debut album Roads to Judah. The pink and orange colors on the cover are meant to resemble the color seen on the inside of one's eyelids when laying in the sun. The inspiration to have the title \"Sunbather\" written out in a simple, block formation was drawn from Pulp's 2001 .","dar":"Deafheaven are an American Blackgaze band formed in 2010. Originally based in San Francisco, the group began as a two-piece with singer George Clarke and guitarist Kerry McCoy, who recorded and self-released a demo album together. Following its release, Deafheaven recruited three new members and began to tour. Before the end of 2010, the band signed to Deathwish Inc. and later released their debut album Roads to Judah, in April 2011. They established a unique style blending black metal, shoegaze, and post-rock, among other influences."},{"n":118,"year":2012,"ar":"Tame Impala","ti":"Lonerism","cv":"https://cdn2.albumoftheyear.org/600x0/album/3879-lonerism_113038.jpg","rt":0.0,"sp":"","yt":"wPUEO9mlNkI","gen":["psychedelic rock","psychedelic pop","indie rock","neo-psychedelia","shoegaze","space rock revival"],"hb":[],"da":"Lonerism is the second album by Australian psychedelic rock band Tame Impala, released by Modular Recordings on 5 October 2012. Like their previous album Innerspeaker, most of the recording was undertaken by Kevin Parker. Kevin Parker started writing and recording new material for Lonerism almost immediately after releasing Innerspeaker, saying \"I started writing songs straight after Innerspeaker, but I told myself I wouldn't get hung up with the pressure, so I kinda pretended they were for some other weird project that wasn't going to have as much consequence\". While Innerspeaker was recorded in a very structured manner with a designated .","dar":"Tame Impala is the psychedelic music project of Australian multi-instrumentalist Kevin Parker, blending rock, pop, and electronic sounds with lush production and introspective lyrics. Their discography includes Innerspeaker (2010), Lonerism (2012), Currents (2015), The Slow Rush (2020), and Deadbeat (2025). As a touring act, Tame Impala consists of Parker (guitar, vocals), Dominic Simper (guitar, synthesiser), Jay Watson (synthesiser, vocals, guitar), Cam Avery (bass guitar, vocals), and Julien Barbagallo (drums, vocals)."},{"n":191,"year":2012,"ar":"Beach House","ti":"Bloom","cv":"https://dn721808.ca.archive.org/0/items/mbid-37cfdc1a-2a7a-4e5c-b8e3-83e2b0e8093b/mbid-37cfdc1a-2a7a-4e5c-b8e3-83e2b0e8093b-40091714027.jpg","rt":0.0,"sp":"","yt":"-3frA_rj918","gen":["indie rock","shoegaze","dream pop","indie pop","Pop","Alternative Rock"],"hb":[],"da":"Bloom is the fourth studio album Beach House. It was released on May 15, 2012, through Sub Pop Records. The entire album was arranged and performed by the duo, with Daniel Franz handling live drums and percussion, and lead vocalist Victoria Legrand handling the songwriting on all of the tracks. Alongside the duo, the album was produced by Chris Coady, who works with them for the second time, following his contributions on their third studio album, Teen Dream (2010), which had been considered as their breakthrough album. The album was written in a period of two years of touring and .","dar":"Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":154,"year":2007,"ar":"Nadja","ti":"Thaumogenesis","cv":"https://ia803200.us.archive.org/27/items/mbid-bd860305-eaee-4903-930a-8f79dd2134af/mbid-bd860305-eaee-4903-930a-8f79dd2134af-26623106393.jpg","rt":0.0,"sp":"","yt":"hgl3AK8php8","gen":["doom metal","shoegaze","drone metal","Metal","Alternative Rock"],"hb":[],"da":null,"dar":"There are multiple artists named Nadja:\n\n1) Nadja is a Canadian drone doom duo featuring multi-instrumentalist Aidan Baker and bassist/vocalist Leah Buckareff. Originally formed in 2003 in Toronto, Canada as a Baker solo project, Buckareff joined in 2005 to bring the project out of the studio and into live settings. The duo combines soundscape, electronics and atmospheric vocals with slow, epic riffs and dirge-like percussion, creating a slowly moving grand wall of music that has been described as drone, ambient-doom, and shoegazer-metal."},{"n":5,"year":2000,"ar":"Deftones","ti":"White Pony","cv":"https://dn721900.ca.archive.org/0/items/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679-18321083736.png","rt":0.0,"sp":"","yt":"v1npHeOskdQ","gen":["metal","post-hardcore","shoegaze","alternative metal","post-metal","nu metal"],"hb":[],"da":"White Pony is the third studio album by American alternative metal band Deftones, released on June 20, 2000, through Maverick Records. It was produced by Terry Date, who produced the band's first two albums, Adrenaline and Around the Fur. Recording sessions took place between August and December 1999 at Larrabee Sound Studios in West Hollywood and The Plant Recording Studios in Sausalito, California. The album marked a significant growth in the band's sound, incorporating influences from post-hardcore, trip-hop, shoegaze, progressive rock, and post-rock into the alternative metal sound which they had become known for. White Pony was also the first .","dar":"Deftones is an American metal band from Sacramento, California, formed in 1988, consisting of Chino Moreno (lead vocals and guitar), Stephen Carpenter (guitar), Frank Delgado (keyboards and turntables), and Abe Cunningham (drums and percussion). Vega (formerly of Quicksand) took on bass duties from mid-2009 to ca. 2021 in substitution for Chi Cheng, who was seriously injured in an automobile accident in Santa Clara, California on November 4, 2008."},{"n":141,"year":1996,"ar":"Bardo Pond","ti":"Amanita","cv":"https://dn710304.ca.archive.org/0/items/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3-12048716483.jpg","rt":0.0,"sp":"","yt":"YawEsEiIbqA","gen":["psychedelic rock","space rock","indie rock","shoegaze","dream pop","post-rock"],"hb":[],"da":null,"dar":"Bardo Pond are an American psychedelic rock band formed in Philadelphia, PA, United States in 1991. They are currently signed to London based label Fire Records. The current members are Michael Gibbons (guitar), John Gibbons (guitar), Isobel Sollenberger (flute and vocals), Clint Takeda (bass guitar), Jason Kourkonis (drums), and Aaron Igler (synth/electronics). Bardo Pond's drug-inspired music is often classified as space rock, acid rock, post-rock, shoegaze or noise rock."},{"n":58,"year":1994,"ar":"Oasis","ti":"Definitely Maybe","cv":"https://dn721801.ca.archive.org/0/items/mbid-d6f68975-dc8f-4e91-ac6f-0061b2adb325/mbid-d6f68975-dc8f-4e91-ac6f-0061b2adb325-31844190146.jpg","rt":0.0,"sp":"","yt":"toHOnObXAbo","gen":["alternative rock","neo-psychedelia","shoegaze","britpop","Rock","Pop"],"hb":[],"da":"Definitely Maybe is the debut album from the British rock band Oasis, released in 1994 under the Creation label. It has received positive reviews from music magazines. The first single of the album, \"Live Forever\", was voted Best Brittish Song, by voters of the alternative rock station Xfm London. Allmusic states that in this album the best of Rock'n'Roll, from The Beatles to The Stone Roses are mixed together. It's one of the best selling debut albums ever. .","dar":"Oasis are an English rock band formed in Manchester in 1991. The original lineup consisted of Liam Gallagher on lead vocals, Paul \"Bonehead\" Arthurs on guitar, Paul \"Guigsy\" McGuigan on bass guitar, and Tony McCarroll on drums. Liam’s older brother Noel Gallagher joined later as lead guitarist and vocalist, becoming the group’s main songwriter and de facto leader. Oasis are regarded as one of the most successful and influential bands of the Britpop movement."},{"n":5,"year":1993,"ar":"Slowdive","ti":"Souvlaki","cv":"https://dn710300.ca.archive.org/0/items/mbid-12694708-e437-4874-a5d4-c1ca0ec46313/mbid-12694708-e437-4874-a5d4-c1ca0ec46313-16656091378.jpg","rt":0.0,"sp":"","yt":"U6WnPceijEA","gen":["alternative rock","psychedelic","shoegaze","dream pop","rock","Pop"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Souvlaki is the second studio album by English shoegaze band Slowdive, released on June 1, 1993, via Creation Records. The album's title was taken from a skit by comedy duo The Jerky Boys, where one of the duo prank calls a hotel manager asking him to perform sexual acts on his wife. Upon learning the manager is Greek, the caller says: \"My wife loves that Greek shit... She'll suck your cock like souvlaki\". While touring Europe in early 1992, Slowdive began working on their next record, Souvlaki, writing and recording in mutiple sessions, a reported total of 40 songs were .","dar":"Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon replaced Scott from 1994-1995."},{"n":155,"year":1993,"ar":"Mazzy Star","ti":"So Tonight That I Might See","cv":"https://ia803100.us.archive.org/29/items/mbid-f3686430-4792-4e0f-b105-45f68c459c64/mbid-f3686430-4792-4e0f-b105-45f68c459c64-37044044892.jpg","rt":0.0,"sp":"","yt":"gYbBL_3XLEM","gen":["psychedelic rock","alternative rock","psychedelic folk","shoegaze","dream pop","slowcore"],"hb":["Frikomid","paqueradejere","sdecandelario","verygooood"],"da":"So Tonight That I Might See is the second studio album by American alternative rock band Mazzy Star, released on October 5, 1993. The album's first track, \"Fade into You\", became the band's first and only single to make the Billboard Hot 100 chart, peaking at number 44 and charting at number 48 on the UK Singles Chart. In a highly positive review, Steve Hochman of the Los Angeles Times called So Tonight That I Might See \"far more narcotic and hypnotic than anything the whole techno-trance universe has digitally blipped up to date.\" NME described it as an \"even .","dar":"Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band"},{"n":189,"year":1993,"ar":"Swervedriver","ti":"Mezcal Head","cv":"https://dn711109.ca.archive.org/0/items/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0-12135644621.jpg","rt":0.0,"sp":"","yt":"b0DTBOQOdf4","gen":["alternative rock","indie rock","shoegaze","rock","Alternative Rock"],"hb":[],"da":"Mezcal Head is the second studio album by English alternative rock band Swervedriver. It was released on 27 September 1993 by Creation Records in the United Kingdom and on 5 October 1993 by A&M Records in the United States. .","dar":"Swervedriver is a British shoegaze band, however their heavier rock & roll style also related them to the grunge genre coming from the U.S. Pacific Northwest. Some music writers considered them to be Britain's answer to this sound. Regardless of labels, the band's mix of storming and swirling guitar experimentation often crossed into psychedelia, coupled with mystical lyrics that often praised the nihilism of sports cars, racing and the open road."},{"n":193,"year":1993,"ar":"Swirlies","ti":"Blonder Tongue Audio Baton","cv":"https://dn710006.ca.archive.org/0/items/mbid-17e02d22-03b5-48ff-bcd0-6610af01af8d/mbid-17e02d22-03b5-48ff-bcd0-6610af01af8d-32651617191.jpg","rt":0.0,"sp":"","yt":"531rtzMGh2U","gen":["indie rock","shoegaze","Rock","Alternative Rock"],"hb":[],"da":"Blonder Tongue Audio Baton (sometimes stylized Blondertongueaudiobaton) is the second studio album by American indie rock band, Swirlies, following their 1992 mini-album “What To Do About Them”. It was released on CD, LP and cassette in 1993. The band recorded the majority of the album in the summer of 1992 at Q Division Studios, Boston with engineer/co-producer Rich Costey. It is possibly their best-known and most critically praised work, with many critics citing it as a “lo-fi” answer to My Bloody Valentine’s Loveless. AllMusic would later call it “a mainstay of early-’90s indie music,” and in 2016 Pitchfork ranked the .","dar":"Swirlies is a rock band that formed in 1990 in Boston, Massachusetts, United States. The band's lineup has fluctuated heavily since formation, centered around founding members Damon Tutunjian and Andy Bernick. \n\nThe band originally consisted of  Damon Tutunjian (vocals, guitar), Seana Carmody (vocals, guitar), Andy Bernick (bass) and Ben Drucker (drums), with second bassist Morgan Andrews joining in 1992. Andrews and Drucker left in 1993, and Carmody left to form Syrup USA in 1994."},{"n":65,"year":1992,"ar":"Catherine Wheel","ti":"Ferment","cv":"https://dn721806.ca.archive.org/0/items/mbid-053f988e-2b6d-4384-8dec-74bde963de4e/mbid-053f988e-2b6d-4384-8dec-74bde963de4e-43303137864.jpg","rt":0.0,"sp":"","yt":"c6ipG9YDHEI","gen":["shoegaze","rock","Rock","Alternative Rock"],"hb":["verygooood"],"da":"Ferment is the debut studio album by English alternative rock band Catherine Wheel, released in 1992 by Fontana Records. Produced by Tim Friese-Greene and John Lee, the album combined aspects of shoegazing, alternative rock and neo psychedelia. Ferment is the only album to contain the neo psychedelia element of the band's discography. Their next album, Chrome, produced with famed alternative rock producer Gil Norton, shifted the musical direction of the band. While Ferment was originally not all that successful in the charts, the album continues to be well received by critics and fans, even 30 years after its release. Four .","dar":"Catherine Wheel was a four-piece shoegaze band from Great Yarmouth, England. The band was active from 1990 to 2000, experiencing fluctuating levels of commercial success, and embarking on many lengthy tours.\n\nCatherine Wheel formed in 1990, comprising singer/guitarist Rob Dickinson (cousin of Iron Maiden legend Bruce Dickinson), guitarist Brian Futter, bassist Dave Hawes, and drummer Neil Sims. Hawes had previously played in a Joy Division-influenced band called Eternal."},{"n":102,"year":1992,"ar":"Ride","ti":"Going Blank Again","cv":"https://cdn2.albumoftheyear.org/600x0/album/7747-going-blank-again_222544.jpg","rt":0.0,"sp":"","yt":"01WWxRLRYhw","gen":["alternative rock","neo-psychedelia","shoegaze","dream pop","Rock","Pop"],"hb":["Frikomid","sdecandelario","verygooood"],"da":"Going Blank Again is the second studio album by British rock band Ride, released on 9 March 1992 on Creation Records. It was produced by Alan Moulder, and peaked at No. 5 in the UK Albums Chart. In October 2009 the album was certified gold by the British Phonographic Industry for sales of over 100,000 units. Following Ride's 1990 debut album Nowhere, Ride released Going Blank Again as their second full-length record, accompanied by the singles \"Leave Them All Behind\" (10 February 1992) and \"Twisterella\" (13 April 1992), the latter named in reference to a song in the 1963 kitchen .","dar":"Ride is a shoegaze band that formed in 1988 in Oxford, England, consisting of Andy Bell, Mark Gardener, Laurence Colbert, and Steve Queralt. The band were initially part of the shoegaze scene that emerged in England during the early 1990s. Their debut album Nowhere (1990) has been named one of the greatest albums of the genre. Ride has released five albums: \"Nowhere\" (1990), \"Going Blank Again\" (1992), \"Carnival of Light\" (1994), \"Tarantula\" (1996), and \"Weather Diaries\" (2017)."},{"n":146,"year":1992,"ar":"Pale Saints","ti":"In Ribbons","cv":"https://dn710701.ca.archive.org/0/items/mbid-d3b53717-51b6-34f8-8960-9fba6153b159/mbid-d3b53717-51b6-34f8-8960-9fba6153b159-19631884777.jpg","rt":0.0,"sp":"","yt":"EEaCIEP0yT4","gen":["alternative rock","shoegaze","Pop","Alternative Rock"],"hb":[],"da":"In Ribbons is the second studio album from the Pale Saints, released by 4AD on 23 March 1992. The album features the single \"Throwing Back the Apple\", and was preceded by the EPs Half-Life in October 1990 and Flesh Balloon in June 1991. .","dar":"Pale Saints was a British shoegaze band formed by Ian Masters (bass/vocals), Graeme Naysmith (guitar), and Chris Cooper (drums). They began as a three-piece   band based in Leeds, England, in 1987. The band was signed to 4AD records by 4AD chief Ivo after their first London show. They were amongst a number of groups in the nineties who were dubbed as shoegaze by the NME and Melody Maker. \n\nEarly band interviews showed them to be a fun-loving bunch in contrast to their dark, lyrically pessimistic pop music."},{"n":152,"year":1992,"ar":"Curve","ti":"Doppelganger","cv":"https://dn711109.ca.archive.org/0/items/mbid-a5bf0729-51b3-49e3-a831-1da8b4f4e084/mbid-a5bf0729-51b3-49e3-a831-1da8b4f4e084-25507379555.jpg","rt":0.0,"sp":"","yt":"DmxTC4jH5IU","gen":["noise pop","shoegaze","Alternative Rock"],"hb":[],"da":null,"dar":"1. Curve was an alternative rock/electronic duo formed in 1990 in England, United Kingdom. The band members were Toni Halliday (vocals, occasionally guitar) and Dean Garcia (bass, guitar, programming). Halliday wrote also the lyrics of their songs and they both contributed to songwriting. Their sound is a blend of alternative rock, shoegaze and electronic music.\n\nHalliday and Garcia were introduced to each other by Dave Stewart of Eurythmics. Dean"},{"n":200,"year":1992,"ar":"Medicine","ti":"Shot Forth Self Living","cv":"https://dn711005.ca.archive.org/0/items/mbid-167b7105-3aef-3806-89b1-6e22ee4ee50b/mbid-167b7105-3aef-3806-89b1-6e22ee4ee50b-20351140323.jpg","rt":0.0,"sp":"","yt":"Ojf0KZ0__pQ","gen":["noise pop","shoegaze","Rock","Alternative Rock"],"hb":["verygooood"],"da":null,"dar":"Medicine is a shoegaze/dream pop band from Los Angeles, USA. They have had two distinct incarnations.  The band was first formed in 1991 by guitarist and programmer Brad Laner (aka Electric Company) and signed to Rick Rubin's American Recordings label the following year. Medicine was/is considered the American response to shoegazing bands such as My Bloody Valentine, Ride and Chapterhouse. With a signature guitar tone, created by running Brad Laner's guitar through a Yamaha 8-track recorder"},{"n":2,"year":1991,"ar":"My Bloody Valentine","ti":"Loveless","cv":"https://dn710703.ca.archive.org/0/items/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06-25797196285.jpg","rt":0.0,"sp":"","yt":"4nzZeUUiG2c","gen":["alternative rock","noise rock","psychedelic","noise pop","shoegaze","dream pop"],"hb":["verygooood"],"da":"loveless is the second studio album by Irish shoegaze band my bloody valentine, released on 4 November 1991 by Creation Records. The album was recorded over a two-year period between 1989 and 1991. Vocalist and guitarist Kevin Shields dominated the arduous recording process; intent on achieving a particular sound, he experimented with guitar tremolo techniques and tuning systems, unorthodox production methods, obscured vocals, and sampled percussion and feedback. The group cycled through nineteen studios and a larger number of engineers during the album's two-year creation, with total recording costs rumoured to have reached £250,000. While loveless did not achieve great .","dar":"my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s."},{"n":122,"year":1991,"ar":"Swervedriver","ti":"Raise","cv":"https://dn710808.ca.archive.org/0/items/mbid-ddb3ca7b-fe4e-41a7-b38c-20a10900672a/mbid-ddb3ca7b-fe4e-41a7-b38c-20a10900672a-6515733451.jpg","rt":0.0,"sp":"","yt":"O8n5pEQRm84","gen":["alternative rock","indie rock","shoegaze","Alternative Rock"],"hb":[],"da":"Raise is the debut studio album by English alternative rock band Swervedriver. It was released on 30 September 1991 by Creation Records. The album contained six new songs; \"Son of Mustang Ford\", \"Rave Down\" and \"Sandblasted\" had all appeared on earlier EPs and singles released by the band between 1990 and 1991. The album received very positive reviews. Early pressings of the UK LP came with a free 7\", which included the instrumental tracks \"Surf Twang\" (a 4-track version of \"Last Train to Satansville\") and \"Deep Twang\" (a 4-track version of \"Deep Seat\"). The album was reissued as a remastered .","dar":"Swervedriver is a British shoegaze band, however their heavier rock & roll style also related them to the grunge genre coming from the U.S. Pacific Northwest. Some music writers considered them to be Britain's answer to this sound. Regardless of labels, the band's mix of storming and swirling guitar experimentation often crossed into psychedelia, coupled with mystical lyrics that often praised the nihilism of sports cars, racing and the open road."},{"n":10,"year":1990,"ar":"Cocteau Twins","ti":"Heaven or Las Vegas","cv":"https://dn710700.ca.archive.org/0/items/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e-7946180530.jpg","rt":0.0,"sp":"","yt":"PbbUeLkZt74","gen":["alternative rock","shoegaze","dream pop","ethereal wave","ambient pop","Punk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","sdecandelario","verygooood"],"da":"Heaven or Las Vegas is the sixth album by Scottish band Cocteau Twins, their last for the music label 4AD. In terms of chart positions, it was the most successful Cocteau Twins album, reaching No. 7 in the UK. Despite 4AD president Ivo Watts-Russell proclaiming it one of the best-ever releases on his label, he released the group from their contract at the end of 1990 because his relationship with the band had soured. The album is noteworthy for the musical evolution that the band displayed at the time. The lyrics of vocalist Elizabeth Fraser were more intelligible; many concerned .","dar":"Cocteau Twins was a Scottish rock band active from 1979 to 1997. The group was formed in Grangemouth, Scotland, by Robin Guthrie (guitar, drum machine) and Will Heggie (bass), with Elizabeth Fraser (vocals) joining in 1981. In 1983, Heggie was replaced by multi-instrumentalist Simon Raymonde, completing the lineup most associated with the band’s career. Cocteau Twins became known for their ethereal, heavily layered sound and Fraser’s distinctive soprano vocal style, often featuring lyrics that avoid conventional language."},{"n":52,"year":1990,"ar":"Ride","ti":"Nowhere","cv":"https://dn721802.ca.archive.org/0/items/mbid-ebc2ee3f-3407-4f7e-8780-80deaf6cac1e/mbid-ebc2ee3f-3407-4f7e-8780-80deaf6cac1e-43289782633.jpg","rt":0.0,"sp":"","yt":"In9yq3oNqCg","gen":["shoegaze","Rock","Pop","Alternative Rock"],"hb":["Nubis84","sdecandelario","verygooood"],"da":"\"Nowhere\" by Ride is one of the seminal albums of the Shoegazing genre, even if the sound of the album is not necessarily indebted to Shoegaze. Rather, Ride's album seems to predict many genres of rock that were to be heard down the road, from Britpop to Indie. Their heavy use of distortion and hypnotic guitar figures certainly got them lumped into the Shoegaze scene, but really what we have here is a unique slice of guitar pop made by a group of immensely talented and inspired young men. The influence of this album is still being felt today through .","dar":"Ride is a shoegaze band that formed in 1988 in Oxford, England, consisting of Andy Bell, Mark Gardener, Laurence Colbert, and Steve Queralt. The band were initially part of the shoegaze scene that emerged in England during the early 1990s. Their debut album Nowhere (1990) has been named one of the greatest albums of the genre. Ride has released five albums: \"Nowhere\" (1990), \"Going Blank Again\" (1992), \"Carnival of Light\" (1994), \"Tarantula\" (1996), and \"Weather Diaries\" (2017)."},{"n":169,"year":1990,"ar":"Pale Saints","ti":"The Comforts of Madness","cv":"https://dn710902.ca.archive.org/0/items/mbid-2de02df3-e26d-37dd-812e-133469478e2d/mbid-2de02df3-e26d-37dd-812e-133469478e2d-13921439233.jpg","rt":0.0,"sp":"","yt":"V6_eO6rOQA8","gen":["psychedelic","shoegaze","dream pop","Pop","Alternative Rock"],"hb":[],"da":"The Comforts of Madness is the debut studio album by English alternative rock band Pale Saints. It was released on 12 February 1990 by 4AD. The Comforts of Madness peaked at number 40 on the UK Albums Chart. On 17 January 2020, 4AD released a remastered and expanded reissue of the album for its 30th anniversary. Reviewing The Comforts of Madness for NME, Simon Williams praised the album as an \"unnervingly multi-dimensional collage of melody and friction\" with \"at least eight Great Pop Tunes, all hooklines and absolutely no stinkers.\" The magazine later named it the 45th best album of .","dar":"Pale Saints was a British shoegaze band formed by Ian Masters (bass/vocals), Graeme Naysmith (guitar), and Chris Cooper (drums). They began as a three-piece   band based in Leeds, England, in 1987. The band was signed to 4AD records by 4AD chief Ivo after their first London show. They were amongst a number of groups in the nineties who were dubbed as shoegaze by the NME and Melody Maker. \n\nEarly band interviews showed them to be a fun-loving bunch in contrast to their dark, lyrically pessimistic pop music."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
