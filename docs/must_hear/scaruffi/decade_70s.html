<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1.0" />
        <title>Scaruffi 1970s</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="icon" type="image/png" href="/images/discount.png" />
        <!-- Umami Analytics -->
        <script>
            defer
            src="https://cloud.umami.is/script.js"
            data-website-id="5d84fd6c-0760-4a0c-a2d0-ffabb82179f5"
        </script>
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0a0a0a;
                --surface: #111;
                --border: #1e1e1e;
                --accent: #e8ff47;
                --heard: #e8ff47;
                --pending: #ff4747;
                --text: #e0e0e0;
                --muted: #555;
                --gap: 6px;
                --panel: 390px;
                --header-h: 58px;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                min-height: 100vh;
            }
            header {
                position: fixed;
                top: 0;
                left: 0;
                right: var(--panel);
                height: var(--header-h);
                z-index: 100;
                background: rgba(10, 10, 10, 0.97);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
                border-right: 1px solid var(--border);
                padding: 0 18px;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            .back-link {
                font-family: "DM Mono", monospace;
                font-size: 0.68rem;
                color: var(--muted);
                text-decoration: none;
            }
            .back-link:hover {
                color: var(--text);
            }
            .header-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.5rem;
                letter-spacing: 0.08em;
                color: var(--accent);
                white-space: nowrap;
            }
            .dec-wrap {
                position: relative;
            }
            .dec-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--accent);
                background: rgba(232, 255, 71, 0.06);
                color: var(--accent);
                cursor: pointer;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 4px;
                white-space: nowrap;
            }
            .dec-btn:hover {
                background: rgba(232, 255, 71, 0.12);
            }
            .dec-dropdown {
                display: none;
                position: fixed;
                background: #161616;
                border: 1px solid var(--border);
                border-radius: 4px;
                z-index: 9999;
                min-width: 160px;
                padding: 4px 0;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            }
            .dec-dropdown.open {
                display: block;
            }
            .dec-dh {
                padding: 5px 10px 4px;
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
                margin-bottom: 3px;
            }
            .dec-item {
                display: block;
                padding: 6px 14px;
                font-family: "DM Mono", monospace;
                font-size: 0.68rem;
                color: var(--text);
                text-decoration: none;
                transition: background 0.1s;
            }
            .dec-item:hover {
                background: var(--surface);
            }
            .dec-item.active {
                color: var(--accent);
            }
            .controls {
                display: flex;
                align-items: center;
                gap: 7px;
                margin-left: auto;
                flex-shrink: 0;
            }
            .filter-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
            }
            .filter-btn:hover {
                border-color: var(--muted);
                color: var(--text);
            }
            .filter-btn.active {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(232, 255, 71, 0.06);
            }
            .search-box {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                padding: 4px 9px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 3px;
                color: var(--text);
                width: 130px;
                outline: none;
                transition: border-color 0.15s;
            }
            .search-box:focus {
                border-color: var(--accent);
            }
            .search-box::placeholder {
                color: var(--muted);
            }
            .genre-wrap {
                position: relative;
            }
            .genre-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 4px;
            }
            .genre-btn:hover,
            .genre-btn.active {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(232, 255, 71, 0.06);
            }
            .genre-btn .badge {
                background: var(--accent);
                color: #000;
                border-radius: 10px;
                padding: 1px 5px;
                font-size: 0.52rem;
                font-weight: 700;
            }
            .genre-dropdown {
                display: none;
                position: fixed;
                top: calc(100% + 6px);
                right: 0;
                background: #161616;
                border: 1px solid var(--border);
                border-radius: 4px;
                z-index: 9999;
                min-width: 200px;
                max-height: 320px;
                overflow-y: auto;
                padding: 4px 0;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            }
            .genre-dropdown.open {
                display: block;
            }
            .genre-dh {
                padding: 5px 10px 4px;
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
                margin-bottom: 3px;
                display: flex;
                justify-content: space-between;
            }
            .genre-clear {
                color: var(--pending);
                cursor: pointer;
            }
            .genre-item {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 4px 10px;
                cursor: pointer;
                transition: background 0.1s;
            }
            .genre-item:hover {
                background: var(--surface);
            }
            .genre-item input {
                accent-color: var(--accent);
                cursor: pointer;
                flex-shrink: 0;
            }
            .genre-item label {
                font-family: "DM Mono", monospace;
                font-size: 0.65rem;
                color: var(--text);
                cursor: pointer;
                flex: 1;
                display: flex;
                justify-content: space-between;
            }
            .genre-item label span {
                color: var(--muted);
                font-size: 0.56rem;
            }
            .rating-wrap {
                display: flex;
                gap: 3px;
            }
            .rating-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.58rem;
                padding: 3px 6px;
                border-radius: 3px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
            }
            .rating-btn:hover {
                border-color: var(--muted);
                color: var(--text);
            }
            .rating-btn.active {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(232, 255, 71, 0.06);
            }
            #main {
                margin-top: var(--header-h);
                margin-right: var(--panel);
                padding: 14px 18px 60px;
            }
            .count-bar {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                color: var(--muted);
                margin-bottom: 10px;
                display: flex;
                gap: 14px;
            }
            .count-bar b {
                color: var(--text);
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(10, 1fr);
                gap: var(--gap);
            }
            .card {
                position: relative;
                aspect-ratio: 1;
                border-radius: 3px;
                overflow: hidden;
                cursor: pointer;
                transition: transform 0.15s;
            }
            .card:hover {
                transform: scale(1.05);
                z-index: 10;
            }
            .card.hidden {
                display: none;
            }
            .card.active-card {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
                z-index: 11;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                background: var(--surface);
            }
            .heard-dot {
                position: absolute;
                top: 4px;
                right: 4px;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                z-index: 3;
                background: var(--heard);
                box-shadow: 0 0 5px var(--heard);
            }
            .card-overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.9) 0%,
                    rgba(0, 0, 0, 0) 55%
                );
                opacity: 0;
                transition: opacity 0.18s;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 6px;
                z-index: 2;
            }
            .card:hover .card-overlay {
                opacity: 1;
            }
            .card-rating {
                font-family: "Bebas Neue", sans-serif;
                font-size: 0.78rem;
                color: var(--accent);
                line-height: 1;
            }
            .card-title {
                font-size: 0.56rem;
                font-weight: 500;
                color: #fff;
                line-height: 1.25;
                overflow: hidden;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }
            .card-artist {
                font-size: 0.52rem;
                color: var(--muted);
                margin-top: 1px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            #panel {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: var(--panel);
                background: #0c0c0c;
                border-left: 1px solid var(--border);
                z-index: 50;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            .panel-topbar {
                height: var(--header-h);
                border-bottom: 1px solid var(--border);
                display: flex;
                align-items: center;
                padding: 0 15px;
                flex-shrink: 0;
            }
            .panel-topbar-label {
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .panel-cover {
                width: 100%;
                aspect-ratio: 1;
                flex-shrink: 0;
                position: relative;
                background: var(--surface);
                max-height: 180px;
                overflow: hidden;
            }
            .panel-cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .panel-cover-rating {
                position: absolute;
                bottom: 8px;
                left: 8px;
                font-family: "Bebas Neue", sans-serif;
                font-size: 1rem;
                color: var(--accent);
                background: rgba(0, 0, 0, 0.7);
                padding: 2px 7px;
                border-radius: 2px;
            }
            .panel-body {
                flex: 1;
                overflow-y: auto;
                padding: 14px;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
            .panel-body::-webkit-scrollbar {
                width: 3px;
            }
            .panel-body::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }
            .panel-empty {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                height: 100%;
                gap: 8px;
                font-family: "DM Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
                text-align: center;
            }
            .panel-empty-icon {
                font-size: 2rem;
                opacity: 0.3;
            }
            .panel-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.4rem;
                letter-spacing: 0.04em;
                color: var(--text);
                line-height: 1.05;
                margin-bottom: 2px;
            }
            .panel-artist {
                font-size: 0.78rem;
                color: var(--muted);
                margin-bottom: 1px;
            }
            .panel-year {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                color: var(--muted);
                margin-bottom: 10px;
            }
            .panel-genres {
                display: flex;
                flex-wrap: wrap;
                gap: 4px;
                margin-bottom: 10px;
            }
            .panel-genre-tag {
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                padding: 2px 6px;
                border-radius: 2px;
                background: rgba(232, 255, 71, 0.07);
                border: 1px solid rgba(232, 255, 71, 0.18);
                color: rgba(232, 255, 71, 0.65);
            }
            .panel-heard-by {
                font-family: "DM Mono", monospace;
                font-size: 0.6rem;
                color: var(--muted);
                margin-bottom: 9px;
            }
            .panel-heard-by b {
                color: var(--heard);
            }
            .panel-divider {
                height: 1px;
                background: var(--border);
                margin: 9px 0;
            }
            .panel-section-label {
                font-family: "DM Mono", monospace;
                font-size: 0.54rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 5px;
            }
            .panel-bio {
                font-size: 0.72rem;
                color: #aaa;
                line-height: 1.6;
                max-height: 120px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
            .panel-bio::-webkit-scrollbar {
                width: 3px;
            }
            .panel-bio::-webkit-scrollbar-thumb {
                background: var(--border);
            }
            .panel-note {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                color: #666;
                font-style: italic;
                line-height: 1.5;
                margin-top: 6px;
            }
            .panel-links {
                display: flex;
                gap: 5px;
                flex-wrap: wrap;
                margin-top: 9px;
            }
            .panel-link {
                font-family: "DM Mono", monospace;
                font-size: 0.58rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 3px 8px;
                border-radius: 3px;
                border: 1px solid var(--border);
                color: var(--muted);
                text-decoration: none;
                transition: all 0.15s;
            }
            .panel-link:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            .panel-link.yt {
                border-color: #f00;
                color: #f00;
            }
            .panel-link.yt:hover {
                background: rgba(255, 0, 0, 0.08);
            }
            .panel-link.sp {
                border-color: #1db954;
                color: #1db954;
            }
            .panel-link.sp:hover {
                background: rgba(29, 185, 84, 0.08);
            }
            .panel-link.bc {
                border-color: #1da0c3;
                color: #1da0c3;
            }
            .panel-link.sc {
                border-color: #f50;
                color: #f50;
            }
            .panel-link.rym {
                border-color: #2f519f;
                color: #2f519f;
            }
            .panel-link.rym:hover {
                background: rgba(91, 170, 219, 0.08);
            }
            .panel-yt-wrap {
                margin-top: 11px;
                border-radius: 4px;
                overflow: hidden;
                background: var(--surface);
                border: 1px solid var(--border);
            }
            .panel-yt-wrap iframe {
                display: block;
                width: 100%;
                height: 145px;
                border: none;
            }
            .panel-yt-placeholder {
                height: 60px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                color: var(--muted);
            }
            #empty {
                display: none;
                text-align: center;
                padding: 50px 0;
                font-family: "DM Mono", monospace;
                color: var(--muted);
                font-size: 0.7rem;
            }
            @media (max-width: 800px) {
                :root {
                    --panel: 100vw;
                    --header-h: 50px;
                }
                header {
                    right: 0;
                }
                #main {
                    margin-right: 0;
                }
                #panel {
                    top: auto;
                    bottom: 0;
                    height: 55vh;
                    border-left: none;
                    border-top: 1px solid var(--border);
                }
                .dec-wrap {
                    display: none;
                }
            }
            .user-wrap {
                position: relative;
            }
            .user-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.62rem;
                letter-spacing: 0.07em;
                text-transform: uppercase;
                padding: 4px 9px;
                border-radius: 3px;
                border: 1px solid var(--accent);
                background: rgba(232, 255, 71, 0.06);
                color: var(--accent);
                cursor: pointer;
                transition: all 0.15s;
                display: flex;
                align-items: center;
                gap: 5px;
                white-space: nowrap;
            }
            .user-btn:hover {
                background: rgba(232, 255, 71, 0.12);
            }
            .user-btn .u-name {
                max-width: 90px;
                overflow: hidden;
                text-overflow: ellipsis;
            }
            .user-dropdown {
                display: none;
                position: fixed;
                background: #161616;
                border: 1px solid var(--border);
                border-radius: 4px;
                z-index: 9999;
                min-width: 164px;
                padding: 4px 0;
                box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
            }
            .user-dropdown.open {
                display: block;
            }
            .user-dh {
                padding: 5px 10px 4px;
                font-family: "DM Mono", monospace;
                font-size: 0.56rem;
                letter-spacing: 0.15em;
                text-transform: uppercase;
                color: var(--muted);
                border-bottom: 1px solid var(--border);
                margin-bottom: 3px;
            }
            .user-item {
                display: flex;
                align-items: center;
                gap: 7px;
                padding: 5px 10px;
                cursor: pointer;
                transition: background 0.1s;
                font-family: "DM Mono", monospace;
                font-size: 0.68rem;
                color: var(--text);
            }
            .user-item:hover {
                background: var(--surface);
            }
            .user-item.active {
                color: var(--accent);
            }
            .user-item .u-dot {
                width: 7px;
                height: 7px;
                border-radius: 50%;
                flex-shrink: 0;
                background: var(--border);
            }
            .user-item.active .u-dot {
                background: var(--accent);
            }
            .card::before {
                content: "";
                position: absolute;
                top: 4px;
                right: 4px;
                width: 7px;
                height: 7px;
                border-radius: 50%;
                z-index: 3;
            }
            .card.heard-user::before {
                background: var(--heard);
                box-shadow: 0 0 5px var(--heard);
            }
            .card.unheard-user::before {
                background: var(--pending);
                box-shadow: 0 0 5px var(--pending);
            }
        </style>
    </head>
    <body>
        <header>
            <a href="index.html" class="back-link">←</a>
            <span class="header-title">Scaruffi 1970s</span>
            <div class="dec-wrap">
                <button class="dec-btn" id="dec-btn" onclick="toggleDecDD()">
                    Decade: 1970s &#x25BE;
                </button>
            </div>
            <div class="controls">
                <button
                    class="filter-btn active"
                    id="btn-all"
                    onclick="setFilter('all')"
                >
                    All
                </button>
                <button
                    class="filter-btn"
                    id="btn-heard"
                    onclick="setFilter('heard')"
                >
                    Heard
                </button>
                <button
                    class="filter-btn"
                    id="btn-unheard"
                    onclick="setFilter('unheard')"
                >
                    Unheard
                </button>
                <input
                    class="search-box"
                    id="search"
                    placeholder="Search..."
                    oninput="applyFilters()"
                />
                <div class="genre-wrap">
                    <button
                        class="genre-btn"
                        id="genre-btn"
                        onclick="toggleGenreDD()"
                    >
                        Genre
                        <span
                            class="badge"
                            id="genre-badge"
                            style="display: none"
                            >0</span
                        >
                        v
                    </button>
                </div>
                <div class="user-wrap">
                    <button
                        class="user-btn"
                        id="user-btn"
                        onclick="toggleUserDD()"
                    >
                        <span class="u-name" id="user-btn-label"
                            >All users</span
                        >
                        &#x25BE;
                    </button>
                </div>
                <div class="rating-wrap" id="rating-btns"></div>
            </div>
        </header>
        <main id="main">
            <div class="count-bar">
                <span>Showing <b id="vis-count">572</b> of 572</span>
                <span><b id="vis-heard">0</b> heard</span>
            </div>
            <div id="grid"></div>
            <div id="empty">No albums match your filters.</div>
        </main>
        <aside id="panel">
            <div class="panel-topbar">
                <span class="panel-topbar-label">Album detail</span>
            </div>
            <div
                id="panel-cover-wrap"
                class="panel-cover"
                style="display: none"
            >
                <img id="p-cover" src="" alt="" />
                <span class="panel-cover-rating" id="p-rating"></span>
            </div>
            <div class="panel-body" id="panel-body">
                <div class="panel-empty">
                    <div class="panel-empty-icon">◉</div>
                    Click an album
                </div>
            </div>
        </aside>

            );

            function buildGenreList() {
                const list = document.getElementById("genre-list");
                list.innerHTML = "";
                GENRE_OPTS.forEach(([genre, count]) => {
                    const div = document.createElement("div");
                    div.className = "genre-item";
                    const id = "g-" + genre.replace(/[^a-z0-9]/g, "_");
                    div.innerHTML =
                        '<input type="checkbox" id="' +
                        id +
                        '" value="' +
                        genre +
                        '" onchange="toggleGenre(\'' +
                        genre +
                        '\',this.checked)"><label for="' +
                        id +
                        '">' +
                        genre +
                        "<span>" +
                        count +
                        "</span></label>";
                    list.appendChild(div);
                });
            }

            function toggleGenreDD() {
                const dd = document.getElementById("genre-dd");
                const btn = document.getElementById("genre-btn");
                const open = !dd.classList.contains("open");
                dd.classList.toggle("open", open);
                btn.classList.toggle("active", open || selectedGenres.size > 0);
                if (open) {
                    const r = btn.getBoundingClientRect();
                    dd.style.top = r.bottom + 4 + "px";
                    dd.style.left = Math.max(4, r.right - 200) + "px";
                }
            }

            function toggleGenre(g, checked) {
                if (checked) selectedGenres.add(g);
                else selectedGenres.delete(g);
                const badge = document.getElementById("genre-badge");
                const btn = document.getElementById("genre-btn");
                if (selectedGenres.size > 0) {
                    badge.textContent = selectedGenres.size;
                    badge.style.display = "";
                    btn.classList.add("active");
                } else {
                    badge.style.display = "none";
                    btn.classList.remove("active");
                }
                applyFilters();
            }

            function clearGenres() {
                selectedGenres.clear();
                document
                    .querySelectorAll("#genre-list input")
                    .forEach((i) => (i.checked = false));
                document.getElementById("genre-badge").style.display = "none";
                document.getElementById("genre-btn").classList.remove("active");
                applyFilters();
            }

            document.addEventListener("click", (e) => {
                if (!e.target.closest(".genre-wrap"))
                    document
                        .getElementById("genre-dd")
                        .classList.remove("open");
                if (!e.target.closest(".user-wrap"))
                    document.getElementById("user-dd").classList.remove("open");
                if (!e.target.closest(".dec-wrap"))
                    document.getElementById("dec-dd").classList.remove("open");
            });

            function toggleDecDD() {
                const dd = document.getElementById("dec-dd");
                const btn = document.getElementById("dec-btn");
                const open = !dd.classList.contains("open");
                dd.classList.toggle("open", open);
                if (open) {
                    const r = btn.getBoundingClientRect();
                    dd.style.top = r.bottom + 4 + "px";
                    dd.style.left = r.left + "px";
                }
            }

            function buildRatingBtns() {
                const ratings = [...new Set(ALBUMS.map((a) => a.rating))].sort(
                    (a, b) => b - a,
                );
                const wrap = document.getElementById("rating-btns");
                ratings.forEach((r) => {
                    const btn = document.createElement("button");
                    btn.className = "rating-btn";
                    btn.textContent = r;
                    btn.dataset.rating = r;
                    btn.onclick = () => {
                        if (selectedRating === r) {
                            selectedRating = null;
                            btn.classList.remove("active");
                        } else {
                            selectedRating = r;
                            document
                                .querySelectorAll(".rating-btn")
                                .forEach((b) => b.classList.remove("active"));
                            btn.classList.add("active");
                        }
                        applyFilters();
                    };
                    wrap.appendChild(btn);
                });
            }

            function buildUserList() {
                const list = document.getElementById("user-list");
                list.innerHTML = "";
                const allDiv = document.createElement("div");
                allDiv.className =
                    "user-item" + (!selectedUser ? " active" : "");
                allDiv.innerHTML = '<span class="u-dot"></span>All users';
                allDiv.onclick = () => setUser(null);
                list.appendChild(allDiv);
                USERS.forEach((u) => {
                    const div = document.createElement("div");
                    div.className =
                        "user-item" + (selectedUser === u ? " active" : "");
                    const n = ALBUMS.filter((a) =>
                        a.heard_by.includes(u),
                    ).length;
                    div.innerHTML =
                        '<span class="u-dot"></span>' +
                        u +
                        '<span style="color:var(--muted);font-size:.58rem;margin-left:auto">' +
                        n +
                        "</span>";
                    div.onclick = () => setUser(u);
                    list.appendChild(div);
                });
            }

            function toggleUserDD() {
                const dd = document.getElementById("user-dd");
                const btn = document.getElementById("user-btn");
                const open = !dd.classList.contains("open");
                dd.classList.toggle("open", open);
                if (open) {
                    const r = btn.getBoundingClientRect();
                    dd.style.top = r.bottom + 4 + "px";
                    dd.style.left = Math.max(4, r.right - 164) + "px";
                }
            }

            function setUser(u) {
                selectedUser = u;
                document.getElementById("user-btn-label").textContent =
                    u || "All users";
                document.getElementById("user-dd").classList.remove("open");
                buildUserList();
                document.querySelectorAll(".card").forEach((card) => {
                    const rank = parseInt(card.dataset.num);
                    const a = ALBUMS.find((x) => x.rank === rank);
                    if (!a) return;
                    const heard = isHeard(a);
                    card.dataset.heard = heard ? "1" : "0";
                    card.classList.remove("heard-user", "unheard-user");
                    card.classList.add(heard ? "heard-user" : "unheard-user");
                    let dot = card.querySelector(".heard-dot");
                    if (heard && !dot) {
                        dot = document.createElement("div");
                        dot.className = "heard-dot";
                        card.appendChild(dot);
                    } else if (!heard && dot) {
                        dot.remove();
                    }
                });
                applyFilters();
            }

            function buildGrid() {
                const grid = document.getElementById("grid");
                grid.innerHTML = "";
                ALBUMS.forEach((a) => {
                    const card = document.createElement("div");
                    const heard = isHeard(a);
                    card.className =
                        "card " + (heard ? "heard-user" : "unheard-user");
                    card.dataset.artist = a.artist.toLowerCase();
                    card.dataset.title = a.title.toLowerCase();
                    card.dataset.rating = a.rating;
                    card.dataset.genres = (a.genres || []).join(",");
                    card.dataset.heard = heard ? "1" : "0";
                    card.dataset.num = a.rank;
                    const coverSrc = a.cover || COVER_PH;
                    const img = document.createElement("img");
                    img.dataset.src = coverSrc;
                    img.src = COVER_PH;
                    img.alt = a.rank;
                    img.onerror = function () {
                        this.onerror = null;
                        this.src = COVER_PH;
                    };
                    card.appendChild(img);
                    if (heard) {
                        const dot = document.createElement("div");
                        dot.className = "heard-dot";
                        card.appendChild(dot);
                    }
                    card.insertAdjacentHTML(
                        "beforeend",
                        '<div class="card-overlay">' +
                            '<div class="card-rating">' +
                            a.rating +
                            "</div>" +
                            '<div class="card-title">' +
                            a.title +
                            "</div>" +
                            '<div class="card-artist">' +
                            a.artist +
                            (a.year ? " · " + a.year : "") +
                            "</div>" +
                            "</div>",
                    );
                    card.addEventListener("click", () => openPanel(a, card));
                    grid.appendChild(card);
                });
                document
                    .querySelectorAll("img[data-src]")
                    .forEach((img) => imgObs.observe(img));
                applyFilters();
            }

            function openPanel(a, cardEl) {
                document
                    .querySelectorAll(".card.active-card")
                    .forEach((c) => c.classList.remove("active-card"));
                cardEl.classList.add("active-card");

                const coverWrap = document.getElementById("panel-cover-wrap");
                coverWrap.style.display = "";
                const img = document.getElementById("p-cover");
                img.src = a.cover || COVER_PH;
                img.onerror = function () {
                    this.src = COVER_PH;
                };
                document.getElementById("p-rating").textContent =
                    a.rating + "/10";

                const links = [];
                if (a.youtube)
                    links.push(
                        '<a class="panel-link yt" href="' +
                            a.youtube +
                            '" target="_blank">YouTube</a>',
                    );
                if (a.spotify)
                    links.push(
                        '<a class="panel-link sp" href="' +
                            a.spotify +
                            '" target="_blank">Spotify</a>',
                    );
                if (a.bandcamp)
                    links.push(
                        '<a class="panel-link bc" href="' +
                            a.bandcamp +
                            '" target="_blank">Bandcamp</a>',
                    );
                if (a.soundcloud)
                    links.push(
                        '<a class="panel-link sc" href="' +
                            a.soundcloud +
                            '" target="_blank">SoundCloud</a>',
                    );
                if (a.rym)
                    links.push(
                        '<a class="panel-link rym" href="' +
                            a.rym +
                            '" target="_blank">RYM</a>',
                    );
                if (a.mbid)
                    links.push(
                        '<a class="panel-link" href="https://musicbrainz.org/release-group/' +
                            a.mbid +
                            '" target="_blank">MusicBrainz</a>',
                    );

                let ytBlock = "";
                if (a.yt_id) {
                    ytBlock =
                        '<iframe src="https://www.youtube.com/embed/' +
                        a.yt_id +
                        '" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
                } else if (a.youtube && a.youtube.includes("youtube")) {
                    const ytUrl = a.youtube
                        .replace("music.youtube.com", "www.youtube.com")
                        .replace("/playlist?", "/embed/videoseries?");
                    ytBlock =
                        '<iframe src="' +
                        ytUrl +
                        '" allow="autoplay;encrypted-media" allowfullscreen></iframe>';
                } else {
                    const q = encodeURIComponent(
                        a.artist + " " + a.title + " full album",
                    );
                    ytBlock =
                        '<div class="panel-yt-placeholder"><a href="https://www.youtube.com/results?search_query=' +
                        q +
                        '" target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a></div>';
                }

                const genreTags = (a.genres || [])
                    .map(
                        (g) => '<span class="panel-genre-tag">' + g + "</span>",
                    )
                    .join("");
                const heardLine =
                    a.heard_by.length > 0
                        ? '<div class="panel-heard-by">Heard by <b>' +
                          a.heard_by.join(", ") +
                          "</b></div>"
                        : "";
                const bioHtml =
                    a.desc && a.desc.length > 40
                        ? a.desc
                        : '<span style="color:var(--muted);font-style:italic">Loading…</span>';
                const noteHtml = a.note
                    ? '<div class="panel-note">' + a.note + "</div>"
                    : "";

                document.getElementById("panel-body").innerHTML =
                    '<div class="panel-title">' +
                    a.title +
                    "</div>" +
                    '<div class="panel-artist">' +
                    a.artist +
                    "</div>" +
                    '<div class="panel-year">' +
                    (a.year || "") +
                    "</div>" +
                    (genreTags
                        ? '<div class="panel-genres">' + genreTags + "</div>"
                        : "") +
                    heardLine +
                    '<div class="panel-links">' +
                    links.join("") +
                    "</div>" +
                    '<div class="panel-divider"></div>' +
                    '<div class="panel-section-label">Listen on YouTube</div>' +
                    '<div class="panel-yt-wrap">' +
                    ytBlock +
                    "</div>" +
                    '<div class="panel-divider"></div>' +
                    '<div class="panel-section-label">About</div>' +
                    '<div class="panel-bio" id="p-bio">' +
                    bioHtml +
                    "</div>" +
                    noteHtml;

                if (!a.desc || a.desc.length <= 40) fetchBio(a.artist, a.title);
            }

            async function fetchBio(artist, title) {
                const bioEl = document.getElementById("p-bio");
                if (!bioEl) return;
                const KEY = "c9b21e5a749e4f279b6cdce9d5b3a7b3";
                try {
                    const d = await fetch(
                        "https://ws.audioscrobbler.com/2.0/?method=album.getinfo&artist=" +
                            encodeURIComponent(artist) +
                            "&album=" +
                            encodeURIComponent(title) +
                            "&format=json&api_key=" +
                            KEY,
                    ).then((r) => r.json());
                    const wiki =
                        d?.album?.wiki?.summary ||
                        d?.album?.wiki?.content ||
                        "";
                    if (wiki && wiki.length > 40) {
                        bioEl.textContent = wiki
                            .replace(/<[^>]+>/g, "")
                            .replace(/ {2,}/g, " ")
                            .trim()
                            .slice(0, 800);
                        return;
                    }
                    const d2 = await fetch(
                        "https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=" +
                            encodeURIComponent(artist) +
                            "&format=json&api_key=" +
                            KEY,
                    ).then((r) => r.json());
                    const bio = d2?.artist?.bio?.summary || "";
                    if (bio && bio.length > 40) {
                        bioEl.textContent = bio
                            .replace(/<[^>]+>/g, "")
                            .replace(/ {2,}/g, " ")
                            .trim()
                            .slice(0, 800);
                        return;
                    }
                    const d3 = await fetch(
                        "https://en.wikipedia.org/api/rest_v1/page/summary/" +
                            encodeURIComponent(artist + " (album)"),
                    ).then((r) => r.json());
                    const ex = d3?.extract || "";
                    bioEl.textContent =
                        ex.length > 40
                            ? ex.slice(0, 800)
                            : "No info available.";
                } catch (e) {
                    if (bioEl) bioEl.textContent = "Could not load info.";
                }
            }

            function setFilter(f) {
                filter = f;
                ["all", "heard", "unheard"].forEach((x) => {
                    const btn = document.getElementById("btn-" + x);
                    if (!btn) return;
                    btn.classList.toggle("active", x === f);
                    if (x === "unheard") {
                        btn.style.borderColor =
                            f === "unheard" ? "var(--pending)" : "";
                        btn.style.color =
                            f === "unheard" ? "var(--pending)" : "";
                        btn.style.background =
                            f === "unheard" ? "rgba(255,71,71,.06)" : "";
                    }
                });
                applyFilters();
            }

            function applyFilters() {
                const q = document
                    .getElementById("search")
                    .value.toLowerCase()
                    .trim();
                let vis = 0,
                    visH = 0;
                document.querySelectorAll(".card").forEach((c) => {
                    const mf =
                        filter === "all" ||
                        (filter === "heard" && c.dataset.heard === "1") ||
                        (filter === "unheard" && c.dataset.heard === "0");
                    const ms =
                        !q ||
                        c.dataset.title.includes(q) ||
                        c.dataset.artist.includes(q);
                    const cg = c.dataset.genres
                        ? c.dataset.genres.split(",")
                        : [];
                    const mg =
                        selectedGenres.size === 0 ||
                        [...selectedGenres].some((g) => cg.includes(g));
                    const mr =
                        !selectedRating ||
                        parseFloat(c.dataset.rating) === selectedRating;
                    const show = mf && ms && mg && mr;
                    c.classList.toggle("hidden", !show);
                    if (show) {
                        vis++;
                        if (c.dataset.heard === "1") visH++;
                    }
                });
                document.getElementById("vis-count").textContent = vis;
                const uLabel = selectedUser ? " (" + selectedUser + ")" : "";
                document.getElementById("vis-heard").textContent =
                    visH + " heard" + uLabel;
                document.getElementById("empty").style.display =
                    vis === 0 ? "block" : "none";
            }

            buildGenreList();
            buildRatingBtns();
            buildUserList();
            buildGrid();
            setTimeout(() => {
                const first = document.querySelector(".card:not(.hidden)");
                if (first) {
                    const a = ALBUMS.find(
                        (x) => x.rank === parseInt(first.dataset.num),
                    );
                    if (a) openPanel(a, first);
                }
            }, 100);
        </script>
    </body>
</html>
