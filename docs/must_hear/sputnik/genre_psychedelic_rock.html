<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

st Steve Kille, and drummer Mark Laughlin.\n\nThe band members met in the DC punk/indie scene, though their music draws from more faraway sources. The band formed in the fall of 1998 from the ashes of local bands The Impossible Five and Colour, when singer-guitarist Jason Simon, bassist Steve Kille, and drummer"},{"n":25,"year":1997,"ar":"Spiritualized","ti":"Ladies and Gentlemen We Are Floating in Space","cv":"https://dn711205.ca.archive.org/0/items/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7-19716414556.jpg","rt":0.0,"sp":"","yt":"_eCGu2Te3ZA","gen":["psychedelic rock","alternative rock","art rock","space rock","neo-psychedelia","space rock revival"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Ladies and Gentlemen We Are Floating in Space is the third studio album by English space rock band Spiritualized, released on 16 June 1997. The album features guest appearances from the Balanescu Quartet, The London Community Gospel Choir and Dr. John. The title comes from the philosophical novel Sophie's World by Jostein Gaarder, the context being: “Only philosophers embark on this perilous expedition to the outermost reaches of language and existence. Some of them fall off, but others cling on desperately and yell at the people nestling deep in the snug softness, stuffing themselves with delicious food and drink. 'Ladies .","dar":"Spiritualized are an English rock band formed in 1990 in Rugby, Warwickshire, United Kingdom by Jason Pierce, who often goes by the alias J. Spaceman, after the spectacular demise of the Spacemen 3 outfit. The membership of Spiritualized changes from album to album, with Pierce being the only constant factor.\n\nThe first Spiritualized release was a space rock-esque cover of Any Way That You Want Me in 1990, a record which heralded the official split of Spacemen 3 following contractual wrangles over the band's name."},{"n":127,"year":1997,"ar":"Super Furry Animals","ti":"Radiator","cv":"https://dn711401.ca.archive.org/0/items/mbid-b9854978-60b5-4534-aea8-26cca7c469dc/mbid-b9854978-60b5-4534-aea8-26cca7c469dc-4137065045.jpg","rt":0.0,"sp":"","yt":"ydl8CwwdPDo","gen":["psychedelic rock","alternative rock","indie rock","Rock","Electronic","Pop"],"hb":[],"da":null,"dar":"Super Furry Animals is a Welsh rock band formed in Cardiff in 1993. The group’s long-term lineup consists of Gruff Rhys (lead vocals, guitar), Huw Bunford (lead guitar, vocals), Guto Pryce (bass guitar), Cian Ciaran (keyboards, synthesizers, electronics, occasional guitar, vocals), and Dafydd Ieuan (drums, vocals). An earlier version of the band featured actor Rhys Ifans as lead vocalist.\n\nThe band emerged as part of a wave of Welsh music in the 1990s"},{"n":141,"year":1996,"ar":"Bardo Pond","ti":"Amanita","cv":"https://dn710304.ca.archive.org/0/items/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3-12048716483.jpg","rt":0.0,"sp":"","yt":"YawEsEiIbqA","gen":["psychedelic rock","space rock","indie rock","shoegaze","dream pop","post-rock"],"hb":[],"da":null,"dar":"Bardo Pond are an American psychedelic rock band formed in Philadelphia, PA, United States in 1991. They are currently signed to London based label Fire Records. The current members are Michael Gibbons (guitar), John Gibbons (guitar), Isobel Sollenberger (flute and vocals), Clint Takeda (bass guitar), Jason Kourkonis (drums), and Aaron Igler (synth/electronics). Bardo Pond's drug-inspired music is often classified as space rock, acid rock, post-rock, shoegaze or noise rock."},{"n":13,"year":1994,"ar":"Soundgarden","ti":"Superunknown","cv":"https://dn720709.ca.archive.org/0/items/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c/mbid-d7b074fa-20da-3fb0-a8df-52751e14d96c-2236678397.jpg","rt":0.0,"sp":"","yt":"fELbXTDl5Ao","gen":["psychedelic rock","alternative rock","hard rock","stoner rock","grunge","alternative metal"],"hb":["Frikomid","Lonsonxd","sdecandelario"],"da":"Superunknown is the fourth album by the American grunge band Soundgarden. It was released on March 8, 1994 through A&M Records. The band began work on the album after touring in support of its previous album, Badmotorfinger. The resulting album captured the creativity and heaviness of the band's earlier releases while displaying a more diverse range of influences. The album was a critical and commercial success and became the band's breakout album. It peaked at number one on the Billboard 200 and reached high positions on charts worldwide. Five singles were released from the album: The Day I Tried to .","dar":"Soundgarden was an American rock band formed in Seattle, Washington, in 1984 by singer and drummer Chris Cornell, lead guitarist Kim Thayil, and bassist Hiro Yamamoto. Cornell switched to rhythm guitar in 1985, and the drum position was taken over first by Scott Sundquist and then by Matt Cameron in 1986. Yamamoto departed in 1989 and was replaced briefly by Jason Everman before Ben Shepherd joined later that year. Soundgarden disbanded in 1997 and reunited in 2010."},{"n":135,"year":1993,"ar":"Motorpsycho","ti":"Demon Box","cv":"https://dn711008.ca.archive.org/0/items/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6-15893454828.jpg","rt":0.0,"sp":"","yt":"A0DSVuYO274","gen":["psychedelic rock","alternative rock","hard rock","indie rock","rock","Rock"],"hb":[],"da":null,"dar":"Motorpsycho is a band from Trondheim in Norway, formed in 1989. Their music can generally be defined as psychedelic rock, but they also mix in elements from metal, jazz, rock, noise, pop and many other musical styles. The members of the band are Bent Sæther (bass/vocals) and Hans Magnus Ryan (guitar/vocals). Håkon Gebhardt (drums) left the band in March 2005 to concentrate on solo projects (as Gebhardt) and his other band HGH. \nDrummer Kenneth Kapstad joined Motorpsycho as a full member late in 2007."},{"n":155,"year":1993,"ar":"Mazzy Star","ti":"So Tonight That I Might See","cv":"https://ia803100.us.archive.org/29/items/mbid-f3686430-4792-4e0f-b105-45f68c459c64/mbid-f3686430-4792-4e0f-b105-45f68c459c64-37044044892.jpg","rt":0.0,"sp":"","yt":"gYbBL_3XLEM","gen":["psychedelic rock","alternative rock","psychedelic folk","shoegaze","dream pop","slowcore"],"hb":["Frikomid","paqueradejere","sdecandelario","verygooood"],"da":"So Tonight That I Might See is the second studio album by American alternative rock band Mazzy Star, released on October 5, 1993. The album's first track, \"Fade into You\", became the band's first and only single to make the Billboard Hot 100 chart, peaking at number 44 and charting at number 48 on the UK Singles Chart. In a highly positive review, Steve Hochman of the Los Angeles Times called So Tonight That I Might See \"far more narcotic and hypnotic than anything the whole techno-trance universe has digitally blipped up to date.\" NME described it as an \"even .","dar":"Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band"},{"n":96,"year":1991,"ar":"Mercury Rev","ti":"Yerself Is Steam","cv":"https://dn721607.ca.archive.org/0/items/mbid-7dd1e959-bb27-4a6d-8454-41ec80c3d0d9/mbid-7dd1e959-bb27-4a6d-8454-41ec80c3d0d9-15474284185.jpg","rt":0.0,"sp":"","yt":"820NtfymPhQ","gen":["avant-garde","psychedelic rock","art pop","art punk","neo-psychedelia","noise pop"],"hb":[],"da":null,"dar":"Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound"},{"n":165,"year":1991,"ar":"Mudhoney","ti":"Every Good Boy Deserves Fudge","cv":"https://dn710804.ca.archive.org/0/items/mbid-ec6d4409-a112-3f1f-a880-6d1c9d56746c/mbid-ec6d4409-a112-3f1f-a880-6d1c9d56746c-9637263179.jpg","rt":0.0,"sp":"","yt":"1tbJZoRiOWc","gen":["psychedelic rock","garage rock","grunge","pigfuck","garage punk","Punk"],"hb":[],"da":"Every Good Boy Deserves Fudge is the second studio album by the grunge band Mudhoney. It was recorded in 1991, at a time when the band was thinking of signing to a major record label, but decided to release the album on Sub Pop. Guitarist Steve Turner has said that the album is his \"favorite Mudhoney album as a whole\" and many critics agree that the band reached a peak on Every Good Boy Deserves Fudge. The album is named after a mnemonic used by music students to recall the notes (EGBDF) on the lines of the treble clef. Along .","dar":"Mudhoney is an American Grunge band formed in Seattle, Washington in 1988, following the demise of Green River. Mudhoney's members are singer and rhythm guitarist Mark Arm, lead guitarist Steve Turner, bassist Guy Maddison and drummer Dan Peters. Original bassist Matt Lukin left the band in 1999.\n\nMudhoney's early releases on the Sub Pop label, particularly their debut single \"Touch Me I'm Sick\" and the Superfuzz Bigmuff EP, were massively influential on the Seattle music scene."},{"n":178,"year":1990,"ar":"Royal Trux","ti":"Twin Infinitives","cv":"https://dn710603.ca.archive.org/0/items/mbid-a824e10e-671f-4a21-bb3e-1d8f7584587a/mbid-a824e10e-671f-4a21-bb3e-1d8f7584587a-6626502631.gif","rt":0.0,"sp":"","yt":"kpcwA2fJkAw","gen":["psychedelic rock","Rock","Alternative Rock"],"hb":[],"da":"Twin Infinitives is the second studio album by Royal Trux. It was released as a double LP in 1990 by Drag City, then reissued on CD and cassette in 1994. Twin Infinitives is the first full-length album released under Chicago independent label Drag City. Twin Infinitives is noted for its deconstructed arrangements, unorthodox vocals and dense production; all were extremes rarely visited to the same degrees on Royal Trux's later releases. Personnel: Neil Hagerty – vocals, guitar, percussion, production Jennifer Herrema – vocals, organ, percussion, production Greg Freeman – engineering Credits adapted from liner notes. .","dar":"Royal Trux was an American alternative rock band from 1987 to 2001, founded by Neil Hagerty (vocals, guitar) and Jennifer Herrema (vocals).\n\nWhile still a teenager, Hagerty joined Washington DC garage punk band Pussy Galore, led by Jon Spencer, and subsequently relocated to New York. During his time in Pussy Galore, Hagerty convinced his bandmates to release a cassette-only remake of the entire Rolling Stones album Exile on Main Street. While he gained underground notoriety for his work with Pussy Galore"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
