<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>
            EliasJ72 — Rolling Stone 500 Greatest Albums of All Time (2023
            Edition)
        </title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --bg: #0a0a0a;
                --surface: #111111;
                --border: #1e1e1e;
                --accent: #e8ff47;
                --heard: #e8ff47;
                --pending: #ff4747;
                --text: #e0e0e0;
                --muted: #555;
                --gap: 6px;
                --panel: 400px;
            }
            *,
            *::before,
            *::after {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }
            html {
                scroll-behavior: smooth;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font-family: "DM Sans", sans-serif;
                min-height: 100vh;
                overflow-x: hidden;
            }

            /* ── HEADER ── */
            header {
                position: sticky;
                top: 0;
                z-index: 100;
                background: rgba(10, 10, 10, 0.95);
                backdrop-filter: blur(12px);
                border-bottom: 1px solid var(--border);
                padding: 14px 28px;
                display: flex;
                align-items: center;
                gap: 24px;
                flex-wrap: wrap;
            }
            .header-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 2rem;
                letter-spacing: 0.08em;
                color: var(--accent);
                text-decoration: none;
                white-space: nowrap;
            }
            .header-sub {
                font-family: "DM Mono", monospace;
                font-size: 0.72rem;
                color: var(--muted);
                line-height: 1.5;
            }
            .header-sub strong {
                color: var(--text);
            }

            /* ── PROGRESS BAR ── */
            .progress-wrap {
                flex: 1;
                min-width: 160px;
            }
            .progress-bar {
                height: 4px;
                background: var(--border);
                border-radius: 2px;
                overflow: hidden;
            }
            .progress-fill {
                height: 100%;
                background: var(--accent);
                border-radius: 2px;
                transition: width 0.6s ease;
                width: 18.8%;
            }
            .progress-label {
                font-family: "DM Mono", monospace;
                font-size: 0.65rem;
                color: var(--muted);
                margin-top: 4px;
            }
            .progress-label span {
                color: var(--accent);
                font-weight: 500;
            }

            /* ── CONTROLS ── */
            .controls {
                display: flex;
                align-items: center;
                gap: 10px;
                margin-left: auto;
            }
            .filter-btn {
                font-family: "DM Mono", monospace;
                font-size: 0.72rem;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                padding: 6px 14px;
                border-radius: 3px;
                border: 1px solid var(--border);
                background: transparent;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
            }
            .filter-btn:hover {
                border-color: var(--muted);
                color: var(--text);
            }
            .filter-btn.active {
                border-color: var(--accent);
                color: var(--accent);
                background: rgba(232, 255, 71, 0.06);
            }
            .search-box {
                font-family: "DM Mono", monospace;
                font-size: 0.72rem;
                padding: 6px 12px;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 3px;
                color: var(--text);
                width: 200px;
                outline: none;
                transition: border-color 0.15s;
            }
            .search-box:focus {
                border-color: var(--accent);
            }
            .search-box::placeholder {
                color: var(--muted);
            }

            /* ── GRID SLIDER ── */
            .grid-sizer {
                display: flex;
                align-items: center;
                gap: 8px;
                padding: 0 2px;
            }
            .grid-sizer label {
                font-family: "DM Mono", monospace;
                font-size: 0.65rem;
                color: var(--muted);
                white-space: nowrap;
                min-width: 28px;
                text-align: right;
            }
            #grid-slider {
                -webkit-appearance: none;
                appearance: none;
                width: 90px;
                height: 3px;
                background: var(--border);
                border-radius: 2px;
                outline: none;
                cursor: pointer;
            }
            #grid-slider::-webkit-slider-thumb {
                -webkit-appearance: none;
                appearance: none;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--accent);
                cursor: pointer;
                transition: transform 0.1s;
            }
            #grid-slider::-webkit-slider-thumb:hover {
                transform: scale(1.3);
            }
            #grid-slider::-moz-range-thumb {
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: var(--accent);
                border: none;
                cursor: pointer;
            }

            /* ── GRID ── */
            main {
                padding: 20px 28px 60px;
                transition: margin-right 0.35s ease;
            }
            main.panel-open {
                margin-right: var(--panel);
            }
            .count-bar {
                font-family: "DM Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
                margin-bottom: 14px;
                display: flex;
                gap: 16px;
            }
            .count-bar b {
                color: var(--text);
            }
            #grid {
                display: grid;
                grid-template-columns: repeat(15, 1fr);
                gap: var(--gap);
            }

            /* ── CARD ── */
            .card {
                position: relative;
                aspect-ratio: 1;
                border-radius: 3px;
                overflow: hidden;
                cursor: pointer;
                transition:
                    transform 0.18s,
                    z-index 0s 0.18s;
            }
            .card:hover {
                transform: scale(1.06);
                z-index: 10;
                transition:
                    transform 0.18s,
                    z-index 0s;
            }
            .card.hidden {
                display: none;
            }
            .card.active-card {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
                z-index: 11;
            }
            .card img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
                background: var(--surface);
            }
            .card::before {
                content: "";
                position: absolute;
                top: 5px;
                right: 5px;
                width: 8px;
                height: 8px;
                border-radius: 50%;
                z-index: 3;
            }
            .card.heard::before {
                background: var(--heard);
                box-shadow: 0 0 6px var(--heard);
            }
            .card.pending::before {
                background: var(--pending);
                box-shadow: 0 0 6px var(--pending);
            }
            .card-overlay {
                position: absolute;
                inset: 0;
                background: linear-gradient(
                    0deg,
                    rgba(0, 0, 0, 0.88) 0%,
                    rgba(0, 0, 0, 0) 55%
                );
                opacity: 0;
                transition: opacity 0.2s;
                display: flex;
                flex-direction: column;
                justify-content: flex-end;
                padding: 8px;
                z-index: 2;
            }
            .card:hover .card-overlay {
                opacity: 1;
            }
            .card-num {
                font-family: "Bebas Neue", sans-serif;
                font-size: 0.9rem;
                color: var(--accent);
                line-height: 1;
            }
            .card-title {
                font-size: 0.62rem;
                font-weight: 500;
                color: #fff;
                line-height: 1.3;
                overflow: hidden;
                display: -webkit-box;
                -webkit-line-clamp: 2;
                -webkit-box-orient: vertical;
            }
            .card-artist {
                font-size: 0.58rem;
                color: var(--muted);
                margin-top: 2px;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            /* ── DETAIL PANEL ── */
            #panel {
                position: fixed;
                top: 0;
                right: 0;
                bottom: 0;
                width: var(--panel);
                background: #0d0d0d;
                border-left: 1px solid var(--border);
                transform: translateX(100%);
                transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
                z-index: 200;
                display: flex;
                flex-direction: column;
                overflow: hidden;
            }
            #panel.open {
                transform: translateX(0);
            }

            .panel-close {
                position: absolute;
                top: 14px;
                right: 14px;
                width: 28px;
                height: 28px;
                border-radius: 50%;
                background: var(--surface);
                border: 1px solid var(--border);
                color: var(--muted);
                font-size: 1rem;
                cursor: pointer;
                display: flex;
                align-items: center;
                justify-content: center;
                transition: all 0.15s;
                z-index: 10;
            }
            .panel-close:hover {
                background: var(--border);
                color: var(--text);
            }

            .panel-cover {
                width: 100%;
                aspect-ratio: 1;
                flex-shrink: 0;
                position: relative;
                background: var(--surface);
                max-height: 200px;
                overflow: hidden;
            }
            .panel-cover img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                display: block;
            }
            .panel-cover-status {
                position: absolute;
                bottom: 10px;
                left: 10px;
                font-family: "DM Mono", monospace;
                font-size: 0.65rem;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                padding: 3px 8px;
                border-radius: 2px;
            }
            .panel-cover-status.heard {
                background: var(--heard);
                color: #000;
            }
            .panel-cover-status.pending {
                background: var(--pending);
                color: #fff;
            }

            .panel-body {
                flex: 1;
                overflow-y: auto;
                padding: 20px;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
            .panel-body::-webkit-scrollbar {
                width: 4px;
            }
            .panel-body::-webkit-scrollbar-track {
                background: transparent;
            }
            .panel-body::-webkit-scrollbar-thumb {
                background: var(--border);
                border-radius: 2px;
            }

            .panel-num {
                font-family: "DM Mono", monospace;
                font-size: 0.65rem;
                color: var(--accent);
                letter-spacing: 0.15em;
                margin-bottom: 6px;
            }
            .panel-title {
                font-family: "Bebas Neue", sans-serif;
                font-size: 1.6rem;
                letter-spacing: 0.04em;
                color: var(--text);
                line-height: 1.05;
                margin-bottom: 4px;
            }
            .panel-artist {
                font-size: 0.85rem;
                color: var(--muted);
                margin-bottom: 2px;
            }
            .panel-year {
                font-family: "DM Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
                margin-bottom: 16px;
            }

            .panel-divider {
                height: 1px;
                background: var(--border);
                margin: 16px 0;
            }

            /* Info / bio */
            .panel-section-label {
                font-family: "DM Mono", monospace;
                font-size: 0.6rem;
                letter-spacing: 0.18em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 8px;
            }
            .panel-bio {
                font-size: 0.78rem;
                color: #aaa;
                line-height: 1.65;
                max-height: 160px;
                overflow-y: auto;
                scrollbar-width: thin;
                scrollbar-color: var(--border) transparent;
            }
            .panel-bio::-webkit-scrollbar {
                width: 3px;
            }
            .panel-bio::-webkit-scrollbar-thumb {
                background: var(--border);
            }
            .panel-bio-loading {
                font-family: "DM Mono", monospace;
                font-size: 0.72rem;
                color: var(--muted);
                font-style: italic;
            }

            /* Links row */
            .panel-links {
                display: flex;
                gap: 8px;
                flex-wrap: wrap;
                margin-top: 16px;
            }
            .panel-link {
                font-family: "DM Mono", monospace;
                font-size: 0.65rem;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 5px 12px;
                border-radius: 3px;
                border: 1px solid var(--border);
                color: var(--muted);
                text-decoration: none;
                transition: all 0.15s;
                cursor: pointer;
                background: transparent;
            }
            .panel-link:hover {
                border-color: var(--accent);
                color: var(--accent);
            }
            /* YouTube embed */
            .panel-yt-wrap {
                margin-top: 16px;
                border-radius: 4px;
                overflow: hidden;
                background: var(--surface);
                border: 1px solid var(--border);
                position: relative;
            }
            .panel-yt-wrap iframe {
                display: block;
                width: 100%;
                height: 160px;
                border: none;
            }
            .panel-yt-placeholder {
                height: 80px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-family: "DM Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
                cursor: pointer;
                transition: background 0.15s;
            }
            .panel-yt-placeholder:hover {
                background: var(--border);
            }

            /* ── OVERLAY BACKDROP ── */
            #backdrop {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.4);
                z-index: 190;
            }
            #backdrop.show {
                display: block;
            }

            /* ── MISC ── */
            .back-link {
                font-family: "DM Mono", monospace;
                font-size: 0.7rem;
                color: var(--muted);
                text-decoration: none;
                margin-right: 8px;
            }
            .back-link:hover {
                color: var(--text);
            }
            #empty {
                display: none;
                text-align: center;
                padding: 80px 0;
                font-family: "DM Mono", monospace;
                color: var(--muted);
                font-size: 0.8rem;
            }

            @media (max-width: 600px) {
                header {
                    padding: 10px 16px;
                }
                main {
                    padding: 14px 16px 40px;
                }
                :root {
                    --panel: 100vw;
                }
                main.panel-open {
                    margin-right: 0;
                }
            }
        </style>
    </head>
    <body>
        <header>
            <a href="index.html" class="back-link">← all users</a>
            <a href="#" class="header-title">EliasJ72</a>
            <div class="header-sub">
                <strong
                    >Rolling Stone 500 Greatest Albums of All Time (2023
                    Edition)</strong
                ><br />
                94 heard &middot; 406 pending
            </div>
            <div class="progress-wrap">
                <div class="progress-bar">
                    <div class="progress-fill" id="prog-fill"></div>
                </div>
                <div class="progress-label">
                    <span id="prog-pct">18.8%</span> complete
                </div>
            </div>
            <div class="controls">
                <button
                    class="filter-btn active"
                    id="btn-all"
                    onclick="setFilter('all')"
                >
                    All
                </button>
                <button
                    class="filter-btn"
                    id="btn-heard"
                    onclick="setFilter('heard')"
                >
                    Heard
                </button>
                <button
                    class="filter-btn"
                    id="btn-pending"
                    onclick="setFilter('pending')"
                >
                    Pending
                </button>
                <input
                    class="search-box"
                    id="search"
                    placeholder="Search…"
                    oninput="applyFilters()"
                />
                <div class="grid-sizer">
                    <label id="grid-label">5×5</label>
                    <input
                        type="range"
                        id="grid-slider"
                        min="3"
                        max="15"
                        value="5"
                        step="1"
                        oninput="setGridSize(this.value)"
                    />
                </div>
            </div>
        </header>

        <main id="main">
            <div class="count-bar">
                <span>Showing <b id="vis-count">500</b> of 500 albums</span>
                <span
                    ><b id="vis-heard">0</b> heard &middot;
                    <b id="vis-pending">0</b> pending</span
                >
            </div>
            <div id="grid"></div>
            <div id="empty">No albums match your filters.</div>
        </main>

        <!-- Detail panel -->
        <div id="backdrop" onclick="closePanel()"></div>
        <aside id="panel">
            <button class="panel-close" onclick="closePanel()">✕</button>
            <div class="panel-cover">
                <img id="p-cover" src="" alt="" />
                <span class="panel-cover-status" id="p-status"></span>
            </div>
            <div class="panel-body">
                <div class="panel-num" id="p-num"></div>
                <div class="panel-title" id="p-title"></div>
                <div class="panel-artist" id="p-artist"></div>
                <div class="panel-year" id="p-year"></div>

                <div class="panel-links" id="p-links"></div>

                <div class="panel-divider"></div>
                <div class="panel-section-label">About</div>
                <div class="panel-bio" id="p-bio">
                    <span class="panel-bio-loading">Loading info…</span>
                </div>

                <div class="panel-divider"></div>
                <div class="panel-section-label">Listen on YouTube</div>
                <div class="panel-yt-wrap" id="p-yt">
                    <div class="panel-yt-placeholder" id="p-yt-placeholder">
                        Loading…
                    </div>
                </div>
            </div>
        </aside>

        <script>
            let ALBUMS = [];
            let filter = "all";
            let gridCols = 5;
            let currentAlbum = null;
            let ytLoaded = false;

            // ── LAZY LOADING via IntersectionObserver ──
            const imgObserver = new IntersectionObserver(
                (entries) => {
                    entries.forEach((e) => {
                        if (e.isIntersecting) {
                            const img = e.target;
                            if (img.dataset.src) {
                                img.src = img.dataset.src;
                                img.removeAttribute("data-src");
                                imgObserver.unobserve(img);
                            }
                        }
                    });
                },
                { rootMargin: "200px" },
            );

            // ── GRID SIZE ──
            function setGridSize(val) {
                gridCols = parseInt(val);
                document.getElementById("grid-label").textContent =
                    val + "×" + val;
                document.getElementById("grid").style.gridTemplateColumns =
                    `repeat(${gridCols}, 1fr)`;
                try {
                    localStorage.setItem("grid-cols", val);
                } catch (e) {}
            }

            // ── GRID BUILD ──
            function buildGrid() {
                const grid = document.getElementById("grid");
                grid.innerHTML = "";
                ALBUMS.forEach((a) => {
                    const card = document.createElement("div");
                    card.className = `card ${a.heard ? "heard" : "pending"}`;
                    card.dataset.title = a.title.toLowerCase();
                    card.dataset.artist = a.artist.toLowerCase();
                    card.dataset.heard = a.heard ? "1" : "0";
                    card.dataset.num = a.n;
                    card.innerHTML = `
      <img data-src="${a.cover}" src="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22250%22%20height=%22250%22%20viewBox=%220%200%20250%20250%22%3E%3Crect%20width=%22250%22%20height=%22250%22%20fill=%22%23111%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%2260%22%20fill=%22none%22%20stroke=%22%23333%22%20stroke-width=%222%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%228%22%20fill=%22%23333%22/%3E%3C/svg%3E" alt="${a.n}"
           onerror="this.src='data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22250%22%20height=%22250%22%20viewBox=%220%200%20250%20250%22%3E%3Crect%20width=%22250%22%20height=%22250%22%20fill=%22%23111%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%2260%22%20fill=%22none%22%20stroke=%22%23333%22%20stroke-width=%222%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%228%22%20fill=%22%23333%22/%3E%3C/svg%3E'">
      <div class="card-overlay">
        <div class="card-num">#${a.n}</div>
        <div class="card-title">${a.title}</div>
        <div class="card-artist">${a.artist} · ${a.year ?? ""}</div>
      </div>`;
                    card.addEventListener("click", () => openPanel(a, card));
                    grid.appendChild(card);
                });
                // Observe all lazy images
                document
                    .querySelectorAll("img[data-src]")
                    .forEach((img) => imgObserver.observe(img));
                applyFilters();
            }

            // ── PANEL ──
            function openPanel(a, cardEl) {
                // Mark active card
                document
                    .querySelectorAll(".card.active-card")
                    .forEach((c) => c.classList.remove("active-card"));
                cardEl.classList.add("active-card");
                currentAlbum = a;
                ytLoaded = false;

                // Fill static info
                const cover = `https://coverartarchive.org/release-group/${a.mbid}/front-500`;
                document.getElementById("p-cover").src = cover;
                document.getElementById("p-cover").onerror = function () {
                    this.src =
                        "data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20width=%22250%22%20height=%22250%22%20viewBox=%220%200%20250%20250%22%3E%3Crect%20width=%22250%22%20height=%22250%22%20fill=%22%23111%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%2260%22%20fill=%22none%22%20stroke=%22%23333%22%20stroke-width=%222%22/%3E%3Ccircle%20cx=%22125%22%20cy=%22125%22%20r=%228%22%20fill=%22%23333%22/%3E%3C/svg%3E";
                };
                const statusEl = document.getElementById("p-status");
                statusEl.textContent = a.heard ? "Heard" : "Pending";
                statusEl.className =
                    "panel-cover-status " + (a.heard ? "heard" : "pending");
                document.getElementById("p-num").textContent = `#${a.n}`;
                document.getElementById("p-title").textContent = a.title;
                document.getElementById("p-artist").textContent = a.artist;
                document.getElementById("p-year").textContent = a.year ?? "";

                // Links
                const mbUrl = `https://musicbrainz.org/release-group/${a.mbid}`;
                const gen1001Url = a.spotify_id
                    ? `https://1001albumsgenerator.com/albums/${a.spotify_id}`
                    : "";
                document.getElementById("p-links").innerHTML = `
    <a class="panel-link" href="${mbUrl}" target="_blank">MusicBrainz</a>
    ${gen1001Url ? `<a class="panel-link" href="${gen1001Url}" target="_blank" style="border-color:#7b61ff;color:#7b61ff">1001gen</a>` : ""}
  `;

                // YouTube: use pre-fetched ID if available
                ytLoaded = false;
                const ytWrap = document.getElementById("p-yt");
                const ytSearchUrl = `https://www.youtube.com/results?search_query=${encodeURIComponent(a.artist + " " + a.title + " full album")}`;
                if (a.yt_id) {
                    ytWrap.innerHTML = `
      <iframe
        src="https://www.youtube.com/embed/${a.yt_id}"
        allow="autoplay; encrypted-media" allowfullscreen
        onerror="this.replaceWith(document.createTextNode('Video unavailable'))">
      </iframe>
      <div style="padding:6px 10px;font-family:'DM Mono',monospace;font-size:.6rem;color:var(--muted)">
        <a href="${ytSearchUrl}" target="_blank" style="color:var(--muted);text-decoration:none">
          ↗ Search YouTube if video is unavailable
        </a>
      </div>`;
                    ytLoaded = true;
                } else {
                    ytWrap.innerHTML = `
      <div class="panel-yt-placeholder">
        No video cached &mdash;
        <a href="${ytSearchUrl}"
           target="_blank" style="color:var(--accent);text-decoration:none">Search YouTube ↗</a>
      </div>`;
                }

                // Bio: reset + fetch
                const bioEl = document.getElementById("p-bio");
                if (a.desc && a.desc.length > 40) {
                    bioEl.textContent = a.desc;
                } else {
                    bioEl.innerHTML =
                        '<span class="panel-bio-loading">Loading info…</span>';
                    fetchBio(a.artist, a.title, a.mbid);
                }

                // Show panel
                document.getElementById("panel").classList.add("open");
                document.getElementById("backdrop").classList.add("show");
                document.getElementById("main").classList.add("panel-open");
            }

            function closePanel() {
                document.getElementById("panel").classList.remove("open");
                document.getElementById("backdrop").classList.remove("show");
                document.getElementById("main").classList.remove("panel-open");
                document
                    .querySelectorAll(".card.active-card")
                    .forEach((c) => c.classList.remove("active-card"));
                // Stop YT if playing
                const iframe = document.querySelector("#p-yt iframe");
                if (iframe) {
                    const s = iframe.src;
                    iframe.src = "";
                    iframe.src = s;
                }
                currentAlbum = null;
            }

            // ── BIO from Last.fm API (no key needed for basic info) + Wikipedia fallback ──
            async function fetchBio(artist, title, mbid) {
                const bioEl = document.getElementById("p-bio");
                try {
                    // Try Last.fm album.getinfo (no API key needed for public data via noembed proxy)
                    const lfmUrl = `https://ws.audioscrobbler.com/2.0/?method=album.getinfo&artist=${encodeURIComponent(artist)}&album=${encodeURIComponent(title)}&format=json&api_key=c9b21e5a749e4f279b6cdce9d5b3a7b3`;
                    const res = await fetch(lfmUrl);
                    const d = await res.json();
                    const wiki =
                        d?.album?.wiki?.summary ||
                        d?.album?.wiki?.content ||
                        "";
                    if (wiki && wiki.length > 40) {
                        // Strip Last.fm "read more" link at end
                        const clean = wiki
                            .replace(/<[^>]+>/g, "")
                            .replace(/[ ](2,)/g, " ")
                            .trim();
                        bioEl.textContent =
                            clean.length > 800
                                ? clean.slice(0, 800) + "…"
                                : clean;
                        return;
                    }
                    // Fallback: Last.fm artist.getinfo
                    const lfmArtist = `https://ws.audioscrobbler.com/2.0/?method=artist.getinfo&artist=${encodeURIComponent(artist)}&format=json&api_key=c9b21e5a749e4f279b6cdce9d5b3a7b3`;
                    const res2 = await fetch(lfmArtist);
                    const d2 = await res2.json();
                    const bio = d2?.artist?.bio?.summary || "";
                    if (bio && bio.length > 40) {
                        const clean = bio
                            .replace(/<[^>]+>/g, "")
                            .replace(/[ ](2,)/g, " ")
                            .trim();
                        bioEl.textContent =
                            clean.length > 800
                                ? clean.slice(0, 800) + "…"
                                : clean;
                        return;
                    }
                    // Fallback: Wikipedia summary via REST API
                    const wikiUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(artist + " (album)")}`;
                    const res3 = await fetch(wikiUrl);
                    const d3 = await res3.json();
                    const extract = d3?.extract || "";
                    if (extract && extract.length > 40) {
                        bioEl.textContent =
                            extract.length > 800
                                ? extract.slice(0, 800) + "…"
                                : extract;
                        return;
                    }
                    bioEl.textContent = "No info available.";
                } catch (e) {
                    bioEl.textContent = "Could not load info.";
                }
            }

            // ── FILTERS ──
            function setFilter(f) {
                filter = f;
                ["all", "heard", "pending"].forEach((x) => {
                    const btn = document.getElementById("btn-" + x);
                    btn.classList.toggle("active", x === f);
                    if (x === "pending") {
                        btn.style.borderColor =
                            f === "pending" ? "var(--pending)" : "";
                        btn.style.color =
                            f === "pending" ? "var(--pending)" : "";
                        btn.style.background =
                            f === "pending" ? "rgba(255,71,71,.06)" : "";
                    }
                });
                applyFilters();
            }

            function applyFilters() {
                const q = document
                    .getElementById("search")
                    .value.toLowerCase()
                    .trim();
                let vis = 0,
                    visH = 0,
                    visP = 0;
                document.querySelectorAll(".card").forEach((c) => {
                    const matchFilter =
                        filter === "all" ||
                        (filter === "heard" && c.dataset.heard === "1") ||
                        (filter === "pending" && c.dataset.heard === "0");
                    const matchSearch =
                        !q ||
                        c.dataset.title.includes(q) ||
                        c.dataset.artist.includes(q);
                    const show = matchFilter && matchSearch;
                    c.classList.toggle("hidden", !show);
                    if (show) {
                        vis++;
                        if (c.dataset.heard === "1") visH++;
                        else visP++;
                    }
                });
                document.getElementById("vis-count").textContent = vis;
                document.getElementById("vis-heard").textContent = visH;
                document.getElementById("vis-pending").textContent = visP;
                document.getElementById("empty").style.display =
                    vis === 0 ? "block" : "none";
                if (filter !== "all" || q) {
                    const pct = vis > 0 ? Math.round((visH / vis) * 100) : 0;
                    document.getElementById("prog-fill").style.width =
                        pct + "%";
                    document.getElementById("prog-pct").textContent = pct + "%";
                } else {
                    document.getElementById("prog-fill").style.width = "18.8%";
                    document.getElementById("prog-pct").textContent = "18.8%";
                }
            }

            // Keyboard: Escape closes panel
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closePanel();
            });

            // Restore grid size
            try {
                const saved = localStorage.getItem("grid-cols");
                if (saved) {
                    const v = Math.min(15, Math.max(3, parseInt(saved)));
                    document.getElementById("grid-slider").value = v;
                    setGridSize(v);
                } else {
                    setGridSize(5);
                }
            } catch (e) {
                setGridSize(5);
            }

            // Load album data from external JSON
            fetch("data/eliasj72.json")
                .then((r) => {
                    if (!r.ok) throw new Error("HTTP " + r.status);
                    return r.json();
                })
                .then((data) => {
                    ALBUMS = data;
                    buildGrid();
                    // Open panel on first album by default
                    setTimeout(() => {
                        const firstCard =
                            document.querySelector(".card:not(.hidden)");
                        if (firstCard) {
                            const album = ALBUMS.find(
                                (a) => a.n === parseInt(firstCard.dataset.num),
                            );
                            if (album) openPanel(album, firstCard);
                        }
                    }, 80);
                })
                .catch((err) => {
                    document.getElementById("grid").innerHTML =
                        '<div style="color:var(--muted);font-family:monospace;padding:40px">⚠ Could not load data: ' +
                        err.message +
                        "</div>";
                });
        </script>
    </body>
</html>
