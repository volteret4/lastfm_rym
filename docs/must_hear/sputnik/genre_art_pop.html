<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

lbum title is derived from a line in poet Etel Adnan's 2009 collection Master of the Eclipse. .","dar":"Julia Shammas Holter (born December 18, 1984) is an American experimental artist, singer, songwriter and multi-instrumentalist based in Los Angeles. A CalArts graduate, she released her first studio album, Tragedy, in 2011. A second album, Ekstasis, followed in 2012. Holter also collaborates with other musicians including Nite Jewel, Linda Perhacs, and Michael Pisaro. In 2013, she released her third album, Loud City Song to resounding critical acclaim."},{"n":178,"year":2017,"ar":"Lorde","ti":"Melodrama","cv":"https://dn711306.ca.archive.org/0/items/mbid-0024c5d8-8b54-459f-ab43-afeab54030a8/mbid-0024c5d8-8b54-459f-ab43-afeab54030a8-17054895075.png","rt":0.0,"sp":"","yt":"gp3T60xhvBw","gen":["art pop","synth-pop","electropop","indie pop","pop","Pop"],"hb":["Frikomid","GabredMared","alberto_gu","verygooood"],"da":"Melodrama is the second studio album by New Zealand singer Lorde, released on June 16, 2017, through Lava and Republic Records and distributed through Universal. Following the breakthrough success of her debut album Pure Heroine, Lorde retreated from the spotlight, and travelled between New Zealand and the United States to examine the world around her. Initially inspired by her disillusionment with fame, she wrote Melodrama to capture heartbreak and solitude after her first breakup. \"Melodrama\" has been described by critics as a loose concept album that explores the theme of solitude, in the framework of a single house party with the events and moods that entail it. Lorde wrote .","dar":"Ella Marija Lani Yelich-O'Connor, known professionally as Lorde (born 7 November 1996 in Takapuna, Auckland, New Zealand), is a New Zealand singer-songwriter. Taking inspiration from aristocracy for her stage name, she is known for her unconventional musical styles and introspective songwriting.\n\nLorde expressed interest in performing at local venues in her early teens. She signed with Universal Music Group (UMG) in 2009 and collaborated with producer Joel Little in 2011 to start recording music."},{"n":36,"year":2016,"ar":"Radiohead","ti":"A Moon Shaped Pool","cv":"https://cdn2.albumoftheyear.org/600x0/album/54767-a-moon-shaped-pool_090450.jpg","rt":0.0,"sp":"","yt":"0506r4BGs7M","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","ambient pop"],"hb":[],"da":"A Moon Shaped Pool is the ninth studio album by the English rock band Radiohead, released as a download on 8 May 2016. The album's first two singles were \"Burn the Witch\" and \"Daydreaming\". CD and LP editions will be released by XL Recordings on 17 June 2016, followed in September by a \"special edition\" containing additional artwork and two bonus tracks. The album was produced by Nigel Godrich. Radiohead began work on A Moon Shaped Pool intermittently after finishing the 2012 tour for their previous album, 2011's The King of Limbs. Several songs on the album date back to .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":44,"year":2016,"ar":"Frank Ocean","ti":"Blonde","cv":"https://dn710706.ca.archive.org/0/items/mbid-8294645a-f996-44b6-9060-7f189b9f59f3/mbid-8294645a-f996-44b6-9060-7f189b9f59f3-14420632959.jpg","rt":0.0,"sp":"","yt":"-tT32VTll5M","gen":["art pop","contemporary r&b","neo soul","alternative r&b","Hip-Hop","Pop"],"hb":[],"da":"Blonde is the second album by American singer Frank Ocean. It was released on August 20, 2016, exclusively on the iTunes Store and Apple Music along with a CD from the Boys Don't Cry Magazine which features an extra verse on \"Nikes\" by KOHH. Blonde features an abstract and experimental sound in comparison to Ocean's previous releases, encompassing styles such as R&B, pop, soul, avant-garde, indie rock, electronica, psychedelia, and hip-hop. Ocean also notably makes use of pitch shifted vocals. The Beach Boys' de facto leader Brian Wilson is recognized as a strong influence on the album's lush arrangements and .","dar":"Christopher Edwin Breaux, professionally known as Frank Ocean, is an American singer/songwriter and member of the gleefully hedonistic hip-hop collective OFWGKTA. He was born on October 28, 1987 and lived in Long Beach, California. He has helped pen tracks for Justin Bieber, John Legend, Brandy, and Beyoncé over the last few years. In 2011, Ocean released his debut mixtape, Nostalgia, Ultra, for free via his Tumblr..\n\nVenting about his decision to drop the record his own way, he took to Twitter on March 1, 2011:"},{"n":71,"year":2016,"ar":"Leonard Cohen","ti":"You Want It Darker","cv":"https://cdn2.albumoftheyear.org/600x0/album/62251-you-want-it-darker_162620.jpg","rt":0.0,"sp":"","yt":"XQOpeJ8YHrE","gen":["folk rock","chamber folk","pop rock","art pop","Rock"],"hb":["Frikomid","Nubis84","alberto_gu","paqueradejere"],"da":"You Want It Darker is the fourteenth studio album by Leonard Cohen, released on October 21, 2016, by Columbia Records, seventeen days before Cohen's death. The album was created towards the end of his life and focuses on death, God, and humor. .","dar":"Leonard Norman Cohen (September 21, 1934 – November 7, 2016) was a Canadian songwriter  poet, singer, and novelist. His work explored religion, politics, isolation, sexuality, and romantic relationships. Cohen was inducted into the Canadian Music Hall of Fame, the Canadian Songwriters Hall of Fame, and the Rock and Roll Hall of Fame. He was invested as a Companion of the Order of Canada, the nation's highest civilian honour. In 2011, Cohen received one of the Prince of Asturias Awards for literature and the ninth Glenn Gould Prize."},{"n":92,"year":2015,"ar":"Bjork","ti":"Vulnicura","cv":"https://ia801602.us.archive.org/30/items/mbid-45a2061b-675f-49f1-a5eb-63100b7ca8eb/mbid-45a2061b-675f-49f1-a5eb-63100b7ca8eb-9485372271.jpg","rt":0.0,"sp":"","yt":"bfrpAl7OB5g","gen":["art pop","chamber pop","ambient pop","glitch pop","Electronic"],"hb":[],"da":null,"dar":"Incorrect tag for Björk. Keep stats clean by fixing your ID3 tags, or easier still, leave auto-correction on."},{"n":167,"year":2011,"ar":"PJ Harvey","ti":"Let England Shake","cv":"https://cdn2.albumoftheyear.org/600x0/album/2087-let-england-shake_082511.jpg","rt":0.0,"sp":"","yt":"IaCsIvDLnBg","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","Nubis84","paqueradejere","sdecandelario"],"da":"Let England Shake is the eighth studio album by PJ Harvey. It was released on 14 February 2011 in the UK, and on 15 February 2011 in the US. Work on it began around the time of White Chalk's release in 2007, though it is a departure from the piano-driven introspective collection of that album. It was written between late 2007 and 2008, and recorded over a five-week period. .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":94,"year":2009,"ar":"Fever Ray","ti":"Fever Ray","cv":"https://dn710800.ca.archive.org/0/items/mbid-0672119e-e919-320d-be20-b47388891d93/mbid-0672119e-e919-320d-be20-b47388891d93-34189291904.jpg","rt":0.0,"sp":"","yt":"XHK3H2vsHd8","gen":["electro","art pop","synth-pop","electropop","ambient pop","future garage"],"hb":[],"da":"Fever Ray is the debut solo album from Fever Ray, an alias of Karin Dreijer of the electronic duo The Knife. At first, it's a little difficult to determine where the Knife ends and Fever Ray begins. On paper, it's clear -- the Knife is the project of Karin Dreijer and their brother Olof, while Fever Ray is Karin with co-producers Christoffer Berg, Van Rivers, and the Subliminal Kid -- but the differences aren't as distinct when listening to Fever Ray the first few times. Initially, the album's dark, frosty atmosphere feels like a continuation of the Knife's brilliant Silent .","dar":"Fever Ray is an alias of Swedish musician Karin Dreijer, formerly of The Knife. They debuted with the single \"If I Had A Heart\" (15 Dec 2008) under the alias, followed by the self-titled album Fever Ray (2009). Their second album, Plunge was released in October 2017 without prior announcement. Their vocal style is highly distinct - shrill and piercing, with a heavy Swedish accent and frequent use of pitch-shifting technology.\n\nDreijer was born on 7 April 1975 in Gothenburg, Sweden."},{"n":3,"year":2007,"ar":"Radiohead","ti":"In Rainbows","cv":"https://dn710801.ca.archive.org/0/items/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30-6689244510.jpg","rt":0.0,"sp":"","yt":"Al1o33CRXsU","gen":["alternative rock","art rock","krautrock","art pop","indie rock","dream pop"],"hb":[],"da":"In Rainbows is the seventh studio album by the English alternative rock band Radiohead. It was first released on October 10, 2007 as a digital download that customers could order for whatever price they saw fit, followed by a standard CD release in most countries during the last week of 2007. The album was released in North America on January 1, 2008. In Rainbows was Radiohead's first release after the end of their contract with EMI and the end of the longest gap between studio albums in their career. \"In Rainbows\" was recorded in London, Somerset, Wiltshire, and Oxfordshire with .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":10,"year":2004,"ar":"Arcade Fire","ti":"Funeral","cv":"https://dn711006.ca.archive.org/0/items/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1-31589070944.jpg","rt":0.0,"sp":"","yt":"qg7XMMAuCJo","gen":["art rock","baroque pop","art pop","chamber pop","indie rock","alternative punk"],"hb":[],"da":"Funeral is the debut full-length album by Canadian indie rock band Arcade Fire, released on September 14, 2004 in North America by Merge Records and on February 28, 2005 in Europe by Rough Trade Records. It was given its title because several band members had recently lost members of their families: Régine Chassagne's grandmother died in June 2003, Win and William Butler's grandfather (swing musician Alvino Rey) in March 2004, and Richard Reed Parry's aunt in April 2004. Preliminary recordings for Funeral were made during the course of a week in August 2003 at the Hotel2Tango in Montreal, Quebec, and .","dar":"Arcade Fire is a Canadian indie rock band formed in Montreal, Quebec, Canada in 2001. The band consists of Win Butler (vocals, guitar, piano), Régine Chassagne (vocals, accordion, keyboards, hurdy gurdy, drums), Richard Reed Parry (bass, guitar), Tim Kingsbury (bass), and Jeremy Gara (drums). Montreal percussionist Dane Mills performed on the EP and in early live shows.  Will Butler (keyboards, guitar) left the band in 2022 to focus on his solo career. The touring band includes horn players and violinists."},{"n":14,"year":2000,"ar":"The Avalanches","ti":"Since I Left You","cv":"https://dn710202.ca.archive.org/0/items/mbid-0fbb1443-86b4-4fd5-829a-4620386e1ff7/mbid-0fbb1443-86b4-4fd5-829a-4620386e1ff7-28243512694.jpg","rt":0.0,"sp":"","yt":"OyUBL2-Qifk","gen":["art pop","dance","electronica","alternative dance","plunderphonics","sampledelia"],"hb":["EliasJ72","Frikomid","GabredMared","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Since I Left You is the debut studio album by Australian electronic dance music group The Avalanches, which was released on 27 November 2000. Produced by The Avalanches' members Robbie Chater and Darren Seltmann (under the pseudonym Bobbydazzler), it was issued on Modular Recordings. The album was created in two separate near-identical studios by Chater and Seltmann, passing audio mixes of records they sampled. The album contains about 3500 vinyl samples of various genres of music. As it was not originally intended for international release, the duo did not worry about copyright restrictions nor attempt to keep track of which .","dar":"There are two artists who go by The Avalanches:\n\n1. The Avalanches are an electronic music collective from Melbourne, Australia. The band is known for the use of eclectic sampling, having created their debut album, Since I Left You (2000), entirely out of over 3,500 samples of obscure records, movies, and television shows. This is famously demonstrated on their hit single \"Frontier Psychiatrist\".\n\nBefore this, they were a hip-hop group with the single album, Rock City and the EP, El Producto."},{"n":114,"year":2000,"ar":"Goldfrapp","ti":"Felt Mountain","cv":"https://dn710906.ca.archive.org/0/items/mbid-d5b80206-c691-400d-95d7-830311451af9/mbid-d5b80206-c691-400d-95d7-830311451af9-2919147114.jpg","rt":0.0,"sp":"","yt":"iKAsuvwDP_Q","gen":["baroque pop","art pop","chamber pop","trip hop","ambient pop","alternative pop"],"hb":[],"da":"Felt Mountain is the debut album by English electronic duo Goldfrapp. It was released by Mute Records on 11 September 2000 in the United Kingdom. The album features Alison Goldfrapp's synthesized vocals in cinematic scope, and takes influence from a variety of music styles such as 1960s pop, cabaret, folk, and electronica. Felt Mountain was a top seventy-five album in Goldfrapp's native United Kingdom, and was certified gold in October 2001. It was generally well received by music critics, and it was described as \"simultaneously smarmy and seductive, yet elegant and graceful\". In 2001, the album was shortlisted for the .","dar":"Goldfrapp are an English electronic band from London, formed in 1999 which consists of Alison Goldfrapp (vocals, synthesizer) and Will Gregory (synthesizer). Despite favourable reviews and a short-listing for the Mercury Prize, the début studio album Felt Mountain did not chart highly. Goldfrapp's second album Black Cherry, which incorporated glam rock and synthpop sounds, was released in 2003. The album influenced the same dance-oriented sound of their third album Supernature."},{"n":20,"year":1999,"ar":"The Flaming Lips","ti":"The Soft Bulletin","cv":"https://dn721501.ca.archive.org/0/items/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa-23592292976.png","rt":0.0,"sp":"","yt":"MBH-169OHNg","gen":["alternative rock","psychedelic pop","art pop","chamber pop","indie rock","neo-psychedelia"],"hb":[],"da":"The Soft Bulletin is the ninth album released by The Flaming Lips on May 17, 1999 in the UK, with a US release following on June 22, 1999. It was released to wide critical acclaim and hailed by critics as a departure from their previous guitar-heavy alternative rock sound, into a more layered and intricately arranged work. The album was considered to mark a change in the course for the band, with more traditional catchy melodies and accessible-sounding music (their previous album, 1997's Zaireeka, was a quadruple album of experimental sounds meant to be played on four separate stereo systems .","dar":"The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals)."},{"n":57,"year":1997,"ar":"Janet Jackson","ti":"The Velvet Rope","cv":"https://dn710008.ca.archive.org/0/items/mbid-f1cf04bd-f968-4fad-9eb5-7faefe9cb430/mbid-f1cf04bd-f968-4fad-9eb5-7faefe9cb430-27271828673.jpg","rt":0.0,"sp":"","yt":"4fbSRlqdZbU","gen":["art pop","r&b","contemporary r&b","trip hop","neo soul","dance-pop"],"hb":[],"da":"The Velvet Rope is the sixth studio album by Janet Jackson, released on October 7, 1997, through Virgin Records. Prior to its release, she renegotiated her contract with Virgin for US$80 million, the largest recording contract in history at that time. Upon experiencing an emotional breakdown, Jackson began facing a long-term case of depression. She in turn developed her new record as a concept album, using introspection as its theme. Its title is a metaphor for emotional boundaries, as well as an allusion to an individual's need to feel special. Its lyrics address subject matter such as depression, self-worth, social .","dar":"Janet Damita Jo Jackson (born May 16, 1966) is an American singer, songwriter, actress, and dancer. She is recognized for her contributions to pop music, including socially conscious and provocative themes in her recordings, as well as her choreography and stage performances. Her work has been influential in the development of MTV and has contributed to breaking gender and racial barriers in the music industry. Jackson’s lyrics often address social issues and personal experiences, appealing to a broad youth audience."},{"n":92,"year":1996,"ar":"Aphex Twin","ti":"Richard D. James Album","cv":"https://cdn2.albumoftheyear.org/600x0/album/4013-richard-d-james-album_020556.jpg","rt":0.0,"sp":"","yt":"LAFazXZKZwQ","gen":["art pop","electronica","idm","jungle","drill and bass","Electronic"],"hb":[],"da":"Richard D. James Album is the eponymous fourth studio album by British electronic musician Richard D. James, under his pseudonym Aphex Twin. In the United Kingdom, the album was released on 4 November 1996 through Warp. In the United States, it was released on 28 January 1997 by Sire Records, with the Girl/Boy EP included as bonus tracks. A reissue on vinyl was released on 18 September 2012. Richard D. James Album was composed by James on his Macintosh computer, and took longer to complete than his previous efforts. The album features faster breakbeats and intricate drum programming which draw .","dar":"Richard David James (born 18 August 1971), known professionally as Aphex Twin, is a British musician, composer, and DJ who has been active in electronic music since 1988. His work incorporates a variety of styles, including techno, ambient, acid, and jungle. He is often associated with the intelligent dance music (IDM) genre. Several publications such as Mixmag, The New York Times, NME, Fact, Clash, and The Guardian have recognized him as an influential figure in contemporary electronic music."},{"n":138,"year":1996,"ar":"Stereolab","ti":"Emperor Tomato Ketchup","cv":"https://ia800301.us.archive.org/13/items/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de-24086681893.jpg","rt":0.0,"sp":"","yt":"GLYu0allKgs","gen":["experimental rock","art pop","indie rock","post-rock","indie pop","indietronica"],"hb":["Nubis84","verygooood"],"da":"Emperor Tomato Ketchup is the fourth studio album by English-French rock band Stereolab. It was released on 18 March 1996 and was issued by Duophonic Records and Elektra Records. The album is named after the 1971 experimental film Emperor Tomato Ketchup by Japanese author and director Shūji Terayama. Emperor Tomato Ketchup was released on 18 March 1996 in the United Kingdom by Duophonic Records, and on 9 April 1996 in the United States by Elektra Records. The artwork for the album was inspired by the LP cover sleeve of a 1964 recording of composer Béla Bartók's Concerto for Orchestra by .","dar":"Stereolab is an Anglo-French avant-pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements."},{"n":96,"year":1991,"ar":"Mercury Rev","ti":"Yerself Is Steam","cv":"https://dn721607.ca.archive.org/0/items/mbid-7dd1e959-bb27-4a6d-8454-41ec80c3d0d9/mbid-7dd1e959-bb27-4a6d-8454-41ec80c3d0d9-15474284185.jpg","rt":0.0,"sp":"","yt":"820NtfymPhQ","gen":["avant-garde","psychedelic rock","art pop","art punk","neo-psychedelia","noise pop"],"hb":[],"da":null,"dar":"Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
