<head>

<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":147,"year":2017,"ar":"Perfume Genius","ti":"No Shape","cv":"https://cdn2.albumoftheyear.org/600x0/album/2017/75587-no-shape.jpg","rt":0.0,"sp":"","yt":"U1sffNdzjPU","gen":["art rock","pop rock","indie rock","Alternative Rock"],"hb":[],"da":"No Shape is the fourth studio album by Perfume Genius. It was released on May, 5 2017 and produced by Blake Mills, who has worked with Ed Sheeran, Alabama Shakes, and John Legend. The album received critical acclaim and was preceded by the release of the lead single, “Slip Away” and promotional single “Go Ahead”. .","dar":"Perfume Genius is the alias of singer-songwriter Mike Hadreas. Born in Des Moines, Iowa,  Mike moved to Seattle when he was 6. Growing up, Hadreas was the only openly gay student at his school, and he received death threats that were ignored by the school administration. He dropped out of high school during his senior year. Two years after dropping out, he was attacked by several young men in his neighborhood. He moved to Williamsburg, Brooklyn, and worked as a doorman for a club in the East Village."},{"n":36,"year":2016,"ar":"Radiohead","ti":"A Moon Shaped Pool","cv":"https://cdn2.albumoftheyear.org/600x0/album/54767-a-moon-shaped-pool_090450.jpg","rt":0.0,"sp":"","yt":"0506r4BGs7M","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","ambient pop"],"hb":[],"da":"A Moon Shaped Pool is the ninth studio album by the English rock band Radiohead, released as a download on 8 May 2016. The album's first two singles were \"Burn the Witch\" and \"Daydreaming\". CD and LP editions will be released by XL Recordings on 17 June 2016, followed in September by a \"special edition\" containing additional artwork and two bonus tracks. The album was produced by Nigel Godrich. Radiohead began work on A Moon Shaped Pool intermittently after finishing the 2012 tour for their previous album, 2011's The King of Limbs. Several songs on the album date back to .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":105,"year":2011,"ar":"Destroyer","ti":"Kaputt","cv":"https://cdn2.albumoftheyear.org/600x0/album/2009-kaputt_053314.jpg","rt":0.0,"sp":"","yt":"qe4sbwI41-E","gen":["art rock","indie rock","indie pop","sophisti-pop"],"hb":[],"da":"Kaputt is the ninth album by Canadian indie rock band Destroyer. It was released on January 25, 2011 by Merge Records and Dead Oceans Records. The album was leaked towards the end of 2010. The vinyl edition of the album features bonus material on side three written largely by frequent Destroyer collaborator Ted Bois. This material is also included in the European CD version of the album credited as 'The Laziest River'. The album was named as a shortlisted (one of 10) nominee for the 2011 Polaris Music Prize award. Kaputt received widespread acclaim from music critics upon its release. .","dar":"Destroyer is a Canadian indie rock band from Vancouver, British Columbia fronted by singer-songwriter Dan Bejar and formed in 1995. Destroyer songs are characterized by abstract, poetic lyrics and idiosyncratic vocals. The band's discography draws on a variety of musical influences, resulting in albums that can sound markedly distinct from one another; in Bejar's words, \"That's kind of my goal: to start from scratch every time.\"\n\n1996–2001\nWe'll Build Them a Golden Bridge, Destroyer's 1996 debut, is made up of sixteen lo-fi home-recordings."},{"n":124,"year":2011,"ar":"St. Vincent","ti":"Strange Mercy","cv":"https://cdn2.albumoftheyear.org/600x0/album/2567-strange-mercy_184357.jpg","rt":0.0,"sp":"","yt":"5jv4lgFrL7U","gen":["art rock","baroque pop","indie rock","indie pop"],"hb":["Frikomid","paqueradejere"],"da":"Strange Mercy is the third studio album by musician St. Vincent. The album's cover art was designed by St. Vincent and was photographed by Tina Tyrell. The album peaked at #19 on the Billboard 200, making it St. Vincent's highest charting album yet, only to be surpassed by her next solo album, St. Vincent. In addition, Strange Mercy also received significant critical acclaim. .","dar":"A pseudonym of Annie Clark (b. 28 Sept 1982), a USA multi-instrumentalist singer-songwriter. She was a member of The Polyphonic Spree and Sufjan Stevens' touring band. Born in Tulsa, Oklahoma, she began playing the guitar at the age of 12 and as a teenager worked as the tour manager for her uncle's band Tuck & Patti. She grew up in Dallas and attended Lake Highlands High School, graduating in 2001. Following this, she went on to attend Berklee College of Music, dropping out 3 years later."},{"n":167,"year":2011,"ar":"PJ Harvey","ti":"Let England Shake","cv":"https://cdn2.albumoftheyear.org/600x0/album/2087-let-england-shake_082511.jpg","rt":0.0,"sp":"","yt":"IaCsIvDLnBg","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","Nubis84","paqueradejere","sdecandelario"],"da":"Let England Shake is the eighth studio album by PJ Harvey. It was released on 14 February 2011 in the UK, and on 15 February 2011 in the US. Work on it began around the time of White Chalk's release in 2007, though it is a departure from the piano-driven introspective collection of that album. It was written between late 2007 and 2008, and recorded over a five-week period. .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":3,"year":2007,"ar":"Radiohead","ti":"In Rainbows","cv":"https://dn710801.ca.archive.org/0/items/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30-6689244510.jpg","rt":0.0,"sp":"","yt":"Al1o33CRXsU","gen":["alternative rock","art rock","krautrock","art pop","indie rock","dream pop"],"hb":[],"da":"In Rainbows is the seventh studio album by the English alternative rock band Radiohead. It was first released on October 10, 2007 as a digital download that customers could order for whatever price they saw fit, followed by a standard CD release in most countries during the last week of 2007. The album was released in North America on January 1, 2008. In Rainbows was Radiohead's first release after the end of their contract with EMI and the end of the longest gap between studio albums in their career. \"In Rainbows\" was recorded in London, Somerset, Wiltshire, and Oxfordshire with .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":10,"year":2004,"ar":"Arcade Fire","ti":"Funeral","cv":"https://dn711006.ca.archive.org/0/items/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1-31589070944.jpg","rt":0.0,"sp":"","yt":"qg7XMMAuCJo","gen":["art rock","baroque pop","art pop","chamber pop","indie rock","alternative punk"],"hb":[],"da":"Funeral is the debut full-length album by Canadian indie rock band Arcade Fire, released on September 14, 2004 in North America by Merge Records and on February 28, 2005 in Europe by Rough Trade Records. It was given its title because several band members had recently lost members of their families: Régine Chassagne's grandmother died in June 2003, Win and William Butler's grandfather (swing musician Alvino Rey) in March 2004, and Richard Reed Parry's aunt in April 2004. Preliminary recordings for Funeral were made during the course of a week in August 2003 at the Hotel2Tango in Montreal, Quebec, and .","dar":"Arcade Fire is a Canadian indie rock band formed in Montreal, Quebec, Canada in 2001. The band consists of Win Butler (vocals, guitar, piano), Régine Chassagne (vocals, accordion, keyboards, hurdy gurdy, drums), Richard Reed Parry (bass, guitar), Tim Kingsbury (bass), and Jeremy Gara (drums). Montreal percussionist Dane Mills performed on the EP and in early live shows.  Will Butler (keyboards, guitar) left the band in 2022 to focus on his solo career. The touring band includes horn players and violinists."},{"n":2,"year":2000,"ar":"Radiohead","ti":"Kid A","cv":"https://dn710905.ca.archive.org/0/items/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5/mbid-0e8a1994-f0a7-481d-9be2-6c2f80e14de5-29475045164.png","rt":0.0,"sp":"","yt":"NUnXxh5U25Y","gen":["experimental rock","avant-garde","alternative rock","art rock","electronica","post-rock"],"hb":["BipolarMuzik","verygooood"],"da":"Kid A is the fourth studio album by the English rock band Radiohead, released on 2 October 2000 by Parlophone. On the verge of a breakdown after promoting Radiohead's 1997 album OK Computer, songwriter Thom Yorke envisioned a radical change in direction. Radiohead replaced their rock sound with synthesisers, drum machines, the ondes Martenot, string orchestras and brass instruments, incorporating influences from genres such as electronic music, krautrock, jazz, and 20th-century classical music. They recorded Kid A with OK Computer producer Nigel Godrich in Paris, Copenhagen, Gloucestershire and their hometown Oxford, England. The sessions produced over 20 tracks; Radiohead saved .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":1,"year":1997,"ar":"Radiohead","ti":"OK Computer","cv":"https://dn720706.ca.archive.org/0/items/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d-43287476628.png","rt":0.0,"sp":"","yt":"jNY_wLukVW0","gen":["experimental rock","alternative rock","art rock","indie rock","space rock revival","post-britpop"],"hb":[],"da":"OK Computer is the third album by the English rock band Radiohead, released in 1997. It reached #1 on the UK Albums Chart and marked Radiohead's highest entry into the American market at the time, where it debuted at #21. OK Computer expanded the band's worldwide popularity, becoming the last Radiohead album to have a delayed release outside of the United Kingdom. As of 2007, it has been certified triple platinum in the UK and double platinum in the US. OK Computer included the singles \"Paranoid Android\", \"Karma Police\" and \"No Surprises\". The album was recorded in rural Oxfordshire and .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":25,"year":1997,"ar":"Spiritualized","ti":"Ladies and Gentlemen We Are Floating in Space","cv":"https://dn711205.ca.archive.org/0/items/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7/mbid-a74bf5c1-7a8d-302b-9fe0-de4cd596a3e7-19716414556.jpg","rt":0.0,"sp":"","yt":"_eCGu2Te3ZA","gen":["psychedelic rock","alternative rock","art rock","space rock","neo-psychedelia","space rock revival"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Ladies and Gentlemen We Are Floating in Space is the third studio album by English space rock band Spiritualized, released on 16 June 1997. The album features guest appearances from the Balanescu Quartet, The London Community Gospel Choir and Dr. John. The title comes from the philosophical novel Sophie's World by Jostein Gaarder, the context being: “Only philosophers embark on this perilous expedition to the outermost reaches of language and existence. Some of them fall off, but others cling on desperately and yell at the people nestling deep in the snug softness, stuffing themselves with delicious food and drink. 'Ladies .","dar":"Spiritualized are an English rock band formed in 1990 in Rugby, Warwickshire, United Kingdom by Jason Pierce, who often goes by the alias J. Spaceman, after the spectacular demise of the Spacemen 3 outfit. The membership of Spiritualized changes from album to album, with Pierce being the only constant factor.\n\nThe first Spiritualized release was a space rock-esque cover of Any Way That You Want Me in 1990, a record which heralded the official split of Spacemen 3 following contractual wrangles over the band's name."},{"n":54,"year":1997,"ar":"Robert Wyatt","ti":"Shleep","cv":"https://dn711103.ca.archive.org/0/items/mbid-bcdf7dd5-a51f-4f11-a79e-ad467639ed2a/mbid-bcdf7dd5-a51f-4f11-a79e-ad467639ed2a-3186241592.jpg","rt":0.0,"sp":"","yt":"tl2MrVhsq4Q","gen":["avant-garde","art rock","progressive rock","canterbury scene","Rock","Jazz"],"hb":[],"da":"Robert Wyatt continues to follow his singular musical path with the lovely Shleep, delivering another album of considerable quirky charm and understated beauty; a less melancholy affair than much of his recent work, the record is informed by a hazy, dreamlike quality perfectly in keeping with the elements of subconsciousness implicit in the title. .","dar":"Robert Wyatt, born Robert Ellidge, in Bristol, UK on 28 January 1945, is an English musician, and a former member of the influential Canterbury scene band Soft Machine.\n\nAs a teenager, he lived with his parents in a fourteen-room Georgian guest-house, Wellington House, in Lydden near Canterbury. Here he was taught the drums by visiting American jazz drummer George Niedorf.\n\nIn 1962, Wyatt and Niedorf moved to Majorca where they stayed with the poet Robert Graves."},{"n":33,"year":1996,"ar":"Cardiacs","ti":"Sing to God","cv":"https://dn711203.ca.archive.org/0/items/mbid-80772eda-3097-34c2-87a4-78ad9ae87edb/mbid-80772eda-3097-34c2-87a4-78ad9ae87edb-19153390465.jpg","rt":0.0,"sp":"","yt":"ax9yT3t1jSI","gen":["experimental rock","avant-prog","alternative rock","art rock","progressive rock","art punk"],"hb":[],"da":"Sing to God is the fourth studio album by English rock band Cardiacs. Their first album with drummer Bob Leith and their second as a four-piece, it was recorded throughout 1995, breaking a hiatus by the band that had lasted since the band's previous album Heaven Born and Ever Bright (1992). During writing and recording, Jon Poole took a greater role than before, contributing to many songs written by band leader Tim Smith, and writing some of his own. The band decided to create a double album to encompass the great wealth of material written after their previous album. As .","dar":"Cardiacs, originally called Cardiac Arrest, were an English band formed in 1977 and led by Tim Smith (1961-2020). Noted for their complex, varied and intense compositional style and for their eccentric, theatrical stage shows, they have been hailed as an influence by many newer groups and artists.\n\nAs well as Smith, around 23 musicians were part of the Cardiacs over the years, including Smith's brother, Jim, and multi-instrumentalist, Sarah Cutts, who married Tim Smith in 1983."},{"n":4,"year":1994,"ar":"Nine Inch Nails","ti":"The Downward Spiral","cv":"https://ia601606.us.archive.org/7/items/mbid-2d410836-5add-3661-b0b0-168ba1696611/mbid-2d410836-5add-3661-b0b0-168ba1696611-2546761764.jpg","rt":0.0,"sp":"","yt":"fnw_UbJmmbY","gen":["alternative rock","art rock","industrial","industrial rock","industrial metal","alternative metal"],"hb":["BipolarMuzik","EliasJ72","Frikomid","GabredMared","Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"The Downward Spiral (also known as Halo 8) is Nine Inch Nails' second studio album, though it is largely considered the third major release after the Broken EP, which consisted of entirely new material. It was released on March 8, 1994. It is likely the most acclaimed and well-known of the band's discography, and is said to have brought \"industrial\" music to the mainstream. A collection featuring remixes from The Downward Spiral was released as Further Down The Spiral on June 1, 1995. Inspiration Trent Reznor has stated in various interviews some of the ideas and inspiration behind the album: .","dar":"Nine Inch Nails, commonly abbreviated as NIN (stylized as NIИ), is an American industrial rock band formed in 1988 in Cleveland, Ohio. Singer, songwriter, multi-instrumentalist, and producer Trent Reznor was the only permanent member of the band until the official addition of English musician Atticus Ross in 2016. \n\nReznor chose the name \"Nine Inch Nails\" because it \"abbreviated easily\" rather than for \"any literal meaning\". Other rumored explanations have circulated"},{"n":28,"year":1994,"ar":"Suede","ti":"Dog Man Star","cv":"https://dn710902.ca.archive.org/0/items/mbid-b71f964d-0727-48c7-b3c1-76e4be751450/mbid-b71f964d-0727-48c7-b3c1-76e4be751450-21198558492.jpg","rt":0.0,"sp":"","yt":"jF-_Wwouk9M","gen":["art rock","glam rock","britpop","Pop","Alternative Rock"],"hb":[],"da":"Dog Man Star is the second album by English alternative rock band Suede, released in October 1994 on Nude Records. It was the last Suede album to feature guitarist Bernard Butler, due to growing tensions between Butler and singer Brett Anderson ending with Butler leaving the band before the album was completed. Dog Man Star is more downbeat than their debut and chronicles Suede as they parted from the \"Britpop pack\". Although it did not sell on the same scale as their chart-topping debut Suede (1993), Dog Man Star reached number three on the UK Albums Chart. Released to a .","dar":"Suede, known as The London Suede in the United States, is an English rock band formed in London in 1989 by singer Brett Anderson, guitarist Justine Frischmann, and bassist Mat Osman. Drawing on glam rock and post-punk influences, the band gained early attention from the British music press and were labelled \"The Best New Band in Britain\" by Melody Maker in 1992. Their debut album, \"Suede\" (1993), reached number one on the UK Albums Chart, becoming the fastest-selling debut album in nearly a decade."},{"n":66,"year":1994,"ar":"Dream Theater","ti":"Awake","cv":"https://dn710702.ca.archive.org/0/items/mbid-7de6eb90-a8b2-4c00-80f7-c95e45929b27/mbid-7de6eb90-a8b2-4c00-80f7-c95e45929b27-1118674713.jpg","rt":0.0,"sp":"","yt":"5NwUSzllMpw","gen":["art rock","progressive rock","heavy metal","progressive metal","Metal","Rock"],"hb":["BipolarMuzik","Lonsonxd","Nubis84"],"da":"Awake is the third studio album by American progressive metal band Dream Theater, released in 1994. The record holds the distinction of being the last Dream Theater album to feature keyboardist Kevin Moore, and is the band's second-highest selling effort to date behind 1992's Images and Words. History After the relative commercial success of Images and Words, the band went back to the studio in 1994 with the first timetable and most pressure they had experienced going into recording. Shortly before the album's mixing, keyboardist Kevin Moore decided to quit the band to follow his own musical endeavors. Fans were .","dar":"Dream Theater is an American progressive metal band formed in 1985 under the name Majesty by John Petrucci, John Myung and Mike Portnoy while they attended Berklee College of Music in Boston, Massachusetts. They subsequently dropped out of their studies to concentrate further on the band that would eventually become Dream Theater. Their current lineup consists of Petrucci, Myung, vocalist James LaBrie, keyboardist Jordan Rudess and drummer Mike Portnoy."},{"n":188,"year":1994,"ar":"Brainiac","ti":"Bonsai Superstar","cv":"https://dn711100.ca.archive.org/0/items/mbid-5a4a1117-b788-4b28-8e71-c3059257352d/mbid-5a4a1117-b788-4b28-8e71-c3059257352d-19366521630.jpg","rt":0.0,"sp":"","yt":"kqXGMUxyD4A","gen":["alternative rock","art rock","indie rock","rock","Rock","Alternative Rock"],"hb":[],"da":"Bonsai Superstar is the second album from indie rock band, Brainiac, released on November 21, 1994. It is the first album on which guitarist John Schmersal appears, who remained as the band’s lead guitarist until their break-up in 1997. Originally released through Grass Records on LP and CD formats, the album is now out-of-print. Currently, the album’s copyright is owned by The Bicycle Music Company after Grass Records merged with Wind-Up Records and subsequently sold the copyrights to the band’s music. .","dar":"Brainiac (also stylized as 3RA1N1AC), is an American indie rock band from Dayton, Ohio. It was formed in January 1992 by Tim Taylor, Juan Monasterio (Monostereo), John Schmersal and Tyler Trent. They disbanded after the sudden death of lead singer Tim Taylor in a car accident on May 23, 1997.\n\nHistory\nFormation and early albums (1992–1997)\nBrainiac was formed in Dayton, Ohio, United States in January 1992 with vocalist, guitarist and keyboard player (particularly Moog synthesizers) Tim Taylor (July 20"},{"n":178,"year":1991,"ar":"Oxbow","ti":"King of the Jews","cv":"https://dn711005.ca.archive.org/0/items/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023/mbid-925bd09f-8a72-43b5-92c3-4e8a75be8023-4100308832.jpg","rt":0.0,"sp":"","yt":"EUfvCYLscro","gen":["avant-garde","art rock","noise rock","jazz","rock","Rock"],"hb":[],"da":null,"dar":"Oxbow is a long-lived avant-garde band formed in 1988 in San Francisco, California that is notable for their prolific touring and unique sound. Oxbow plays a blend of noise rock, avant-garde jazz, musique concrète (AMG), and blues, creating soundscapes caustic, or plangent, with overtones of paranoia, revulsion, exaltation.\n\nThe first album in 1989 combining the squall of bands like The Birthday Party with elements of free jazz and musique concrète from Oxbow"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
