ms/mbid-80f21ff3-e087-4792-b22f-dfcaf8f502b4/mbid-80f21ff3-e087-4792-b22f-dfcaf8f502b4-44147985609.jpg","rt":0.0,"sp":"","yt":"rY0vJHgWCDg","gen":["alternative rock","Pop","Alternative Rock"],"hb":["Frikomid","GabredMared","Nubis84"],"da":"Released in October 1994 by 4AD, Geek the Girl is widely considered Lisa Germano’s creative breakthrough and emotional masterpiece. A concept album of sorts, it captures a character—”the geek”—navigating the landscape of trauma, desire, vulnerability, and identity. It’s an unsettling yet beautiful descent into the interior of the female experience, delivered with haunting intimacy and uncompromising honesty. Germano’s use of fractured melodies, off-kilter arrangements, and whispery vocals creates a soundscape that feels like a private confession—one that listeners are almost intruding upon. From the booklet: \"Hi, this is the story of geek the girl, a girl who is confused about .","dar":"Lisa Germano is a multi-instrumentalist, singer, writer and arranger from Mishawaka, Indiana.\n\nAfter years playing violin as a session musician with the likes of John Mellencamp, Indigo Girls and Bob Dylan, Germano embarked on a solo career in 1991 with the understated but occasionally brilliant On The Way Down From The Moon Palace on her own label, which led to a deal with Capitol, who released her second album. Although Happiness was a massive step up in terms of confidence and songwriting"},{"n":131,"year":1994,"ar":"Stone Temple Pilots","ti":"Purple","cv":"https://dn721909.ca.archive.org/0/items/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016/mbid-1ff5ad06-1baa-45a1-a90c-72bd6df56016-24373460607.jpg","rt":0.0,"sp":"","yt":"6EM6Uk1BICc","gen":["alternative rock","hard rock","acoustic rock","grunge","rock","Rock"],"hb":[],"da":"Purple is the second album released by the American rock band Stone Temple Pilots, on June 7, 1994, by Atlantic Records. It contains several of the band's biggest hit songs, including \"Vasoline,\" \"Interstate Love Song,\" and \"Big Empty,\" which was also featured on The Crow soundtrack. The album was a big success for STP, debuting at #1 (for three weeks, longer than any stay at the top by Nirvana, Alice In Chains, or Soundgarden) and being certified 6x platinum. In 2006, the album was ranked number 73 on Guitar World magazine's list of the greatest 100 guitar albums of all .","dar":"Stone Temple Pilots (also known by STP) is an American grunge band from San Diego, California, that originally consisted of Scott Weiland (lead vocals), brothers Dean (guitar) and Robert DeLeo (bass, backing vocals), and Eric Kretz (drums). The band's lineup remained unchanged from its formation in 1989 until the firing of Weiland in February 2013. Linkin Park vocalist Chester Bennington joined the band in May 2013 but left amicably in November 2015."},{"n":155,"year":1994,"ar":"Blur","ti":"Parklife","cv":"https://dn721902.ca.archive.org/0/items/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd/mbid-83dc04ba-bb5a-41f6-8dd9-b06855cf84cd-27625936663.jpg","rt":0.0,"sp":"","yt":"LCp77Yf54_k","gen":["alternative rock","indie rock","britpop","rock","Pop","Alternative Rock"],"hb":["Nubis84","Rocky_stereo","alberto_gu","verygooood"],"da":"Parklife is the third studio album by the English alternative rock band blur, released on 25 April 1994 on Food Records. After disappointing sales for their previous album Modern Life is Rubbish (1993), Parklife returned Blur to prominence in the UK, helped by its four hit singles: Girls & Boys, End of a Century, Parklife and To the End. The album was certified quadruple platinum in the United Kingdom. .","dar":"Blur are an English rock band formed in London in 1988, consisting of singer Damon Albarn, guitarist Graham Coxon, bassist Alex James, and drummer Dave Rowntree. Their debut album, \"Leisure\" (1991), incorporated elements of Madchester and shoegaze. Following a stylistic change influenced by British guitar pop groups such as the Kinks, the Beatles, and XTC, Blur released \"Modern Life Is Rubbish\" (1993), \"Parklife\" (1994), and \"The Great Escape\" (1995)."},{"n":178,"year":1994,"ar":"Soul Coughing","ti":"Ruby Vroom","cv":"https://dn710309.ca.archive.org/0/items/mbid-abc49b59-0c11-4651-9262-7316bda4c158/mbid-abc49b59-0c11-4651-9262-7316bda4c158-9825046782.jpg","rt":0.0,"sp":"","yt":"cyVUsknYmJ4","gen":["alternative rock","blues","jazz","alternative hip hop","beat poetry","jazz poetry"],"hb":[],"da":null,"dar":"Soul Coughing were a New York-based alternative rock band. The band found modest mainstream success during the mid-to-late 90's. Soul Coughing developed a devout fanbase and have garnered largely positive response from critics. Steve Huey describes the band as \"one of the most unique cult bands of the '90s ... driven by frontman  M. Doughty's stream-of-consciousness poetry, Soul Coughing's sound was a willfully idiosyncratic mix of improvisational jazz grooves"},{"n":188,"year":1994,"ar":"Brainiac","ti":"Bonsai Superstar","cv":"https://dn711100.ca.archive.org/0/items/mbid-5a4a1117-b788-4b28-8e71-c3059257352d/mbid-5a4a1117-b788-4b28-8e71-c3059257352d-19366521630.jpg","rt":0.0,"sp":"","yt":"kqXGMUxyD4A","gen":["alternative rock","art rock","indie rock","rock","Rock","Alternative Rock"],"hb":[],"da":"Bonsai Superstar is the second album from indie rock band, Brainiac, released on November 21, 1994. It is the first album on which guitarist John Schmersal appears, who remained as the band’s lead guitarist until their break-up in 1997. Originally released through Grass Records on LP and CD formats, the album is now out-of-print. Currently, the album’s copyright is owned by The Bicycle Music Company after Grass Records merged with Wind-Up Records and subsequently sold the copyrights to the band’s music. .","dar":"Brainiac (also stylized as 3RA1N1AC), is an American indie rock band from Dayton, Ohio. It was formed in January 1992 by Tim Taylor, Juan Monasterio (Monostereo), John Schmersal and Tyler Trent. They disbanded after the sudden death of lead singer Tim Taylor in a car accident on May 23, 1997.\n\nHistory\nFormation and early albums (1992–1997)\nBrainiac was formed in Dayton, Ohio, United States in January 1992 with vocalist, guitarist and keyboard player (particularly Moog synthesizers) Tim Taylor (July 20"},{"n":5,"year":1993,"ar":"Slowdive","ti":"Souvlaki","cv":"https://dn710300.ca.archive.org/0/items/mbid-12694708-e437-4874-a5d4-c1ca0ec46313/mbid-12694708-e437-4874-a5d4-c1ca0ec46313-16656091378.jpg","rt":0.0,"sp":"","yt":"U6WnPceijEA","gen":["alternative rock","psychedelic","shoegaze","dream pop","rock","Pop"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Souvlaki is the second studio album by English shoegaze band Slowdive, released on June 1, 1993, via Creation Records. The album's title was taken from a skit by comedy duo The Jerky Boys, where one of the duo prank calls a hotel manager asking him to perform sexual acts on his wife. Upon learning the manager is Greek, the caller says: \"My wife loves that Greek shit... She'll suck your cock like souvlaki\". While touring Europe in early 1992, Slowdive began working on their next record, Souvlaki, writing and recording in mutiple sessions, a reported total of 40 songs were .","dar":"Slowdive is a dream pop/shoegaze band that formed in 1989 in Reading, England, United Kingdom. Signed to Creation Records in 1990 and initially championed by the British music press, the band scored a UK top forty entry with their debut album Just For a Day. \n\nThe band consists of Rachel Goswell (vocals/guitar), Neil Halstead  (vocals/guitar), Nick Chaplin (bass), Christian Savill (guitar), and Simon Scott (drums, 1990-1994, 2014-present); additionally, Ian McCutcheon replaced Scott from 1994-1995."},{"n":53,"year":1993,"ar":"Catherine Wheel","ti":"Chrome","cv":"https://ia801002.us.archive.org/2/items/mbid-d8813dc4-e085-41b2-ab9d-2a1dac1f2299/mbid-d8813dc4-e085-41b2-ab9d-2a1dac1f2299-28257501097.jpg","rt":0.0,"sp":"","yt":"G-db6KkaXwQ","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":["verygooood"],"da":"Chrome is the second studio album by English alternative rock band Catherine Wheel, released on 20 July 1993 by Fontana Records in the United Kingdom and Mercury Records in the United States. It was produced by Gil Norton, who would later go on to produce Catherine Wheel's next album, Happy Days. The lead single, \"Crank\", reached No. 5 on Billboard's Modern Rock Tracks chart. While not all that successful commercially, Chrome has been well received by critics and fans alike. Chrome was intended by the band to be a departure into more hard rock territory when compared to their debut, .","dar":"Catherine Wheel was a four-piece shoegaze band from Great Yarmouth, England. The band was active from 1990 to 2000, experiencing fluctuating levels of commercial success, and embarking on many lengthy tours.\n\nCatherine Wheel formed in 1990, comprising singer/guitarist Rob Dickinson (cousin of Iron Maiden legend Bruce Dickinson), guitarist Brian Futter, bassist Dave Hawes, and drummer Neil Sims. Hawes had previously played in a Joy Division-influenced band called Eternal."},{"n":59,"year":1993,"ar":"PJ Harvey","ti":"Rid of Me","cv":"https://dn721608.ca.archive.org/0/items/mbid-aad52d2a-9502-4644-af00-412e264ffec0/mbid-aad52d2a-9502-4644-af00-412e264ffec0-32841758505.jpg","rt":0.0,"sp":"","yt":"8PlaNe3mXl8","gen":["alternative rock","indie rock","rock","Rock","Alternative Rock"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"Rid of Me is the second studio album by English singer-songwriter and musician PJ Harvey. It was released on May 4, 1993, via Island Records. The album marked a departure from Harvey's previous songwriting, being more raw and aggressive than its predecessor. Rid of Me was met with critical acclaim and is cited as one of the greatest albums of all time, ranking at number 153 on the 2020 version of Rolling Stone's 500 Greatest Albums of All Time (up from 406 on the list's previous edition). .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":72,"year":1993,"ar":"The Afghan Whigs","ti":"Gentlemen","cv":"https://dn710609.ca.archive.org/0/items/mbid-bbf63d9c-7d8d-4ea2-827c-ff28c35c1657/mbid-bbf63d9c-7d8d-4ea2-827c-ff28c35c1657-15193525275.jpg","rt":0.0,"sp":"","yt":"fIAXN4iF7VQ","gen":["alternative rock","indie rock","Alternative Rock"],"hb":["Nubis84","sdecandelario"],"da":null,"dar":"American band The Afghan Whigs were a soul-influenced, alternative rock band that was mainly active in the 1990s. While achieving only moderate commercial success, the Afghan Whigs attracted ample critical acclaim and deeply loyal fans, Rolling Stone described the band as spending “the bulk of their career on the brink of stardom”, yet they’ve “never quite broken beyond a substantial legion of devotees enamored of their thinly veiled sleaze.”"},{"n":80,"year":1993,"ar":"Suede","ti":"Suede","cv":"https://dn721902.ca.archive.org/0/items/mbid-de944158-01ca-4270-8549-a9b8317264e5/mbid-de944158-01ca-4270-8549-a9b8317264e5-33797584686.jpg","rt":0.0,"sp":"","yt":"nzLUgakW-zQ","gen":["alternative rock","glam rock","neo-psychedelia","britpop","rock","Pop"],"hb":[],"da":"Suede is the debut album by English alternative rock band Suede, released in 1993 on Nude Records. At the time the fastest-selling debut album in British history, Suede debuted at the top of the UK Album Chart, won the 1993 Mercury Music Prize, and is often credited with starting the Britpop movement. The sound of the album has been compared to The Smiths and the early David Bowie era. .","dar":"Suede, known as The London Suede in the United States, is an English rock band formed in London in 1989 by singer Brett Anderson, guitarist Justine Frischmann, and bassist Mat Osman. Drawing on glam rock and post-punk influences, the band gained early attention from the British music press and were labelled \"The Best New Band in Britain\" by Melody Maker in 1992. Their debut album, \"Suede\" (1993), reached number one on the UK Albums Chart, becoming the fastest-selling debut album in nearly a decade."},{"n":96,"year":1993,"ar":"James","ti":"Laid","cv":"https://dn710603.ca.archive.org/0/items/mbid-bd3229d9-af7e-4a7b-a9ff-fc560e34eca5/mbid-bd3229d9-af7e-4a7b-a9ff-fc560e34eca5-3813580057.jpg","rt":0.0,"sp":"","yt":"0trh9Y598fM","gen":["alternative rock","indie pop","Pop","Alternative Rock"],"hb":["Frikomid","Lonsonxd","Nubis84","alberto_gu","sdecandelario","verygooood"],"da":"Laid is the fifth studio album by British alternative rock band James. It was released on 5 October 1993. It was the first of several collaborations between the group and Brian Eno, who produced all but one of the album's tracks – in Stuart Maconie's authorised biography of the group, Folklore, they admitted that Eno didn't like the song \"One of the Three\" so they recorded it when he took a day off. The sessions also resulted in the experimental Wah Wah album. .","dar":"There are several artists in this entry:\n\n1) a British alternative rock band formed in 1981 in Manchester\n2) the vocalist of popular Bangladeshi band Nagar Baul\n3) a Dutch rapper connected to the Fakkelteitgroep. \n4) James, South Korean Musician\n\n1) James is an indie rock band formed 1981 in Manchester, England\n\nThe band's sound is mostly defined by their lead singer Tim Booth's resonating vocals and emotional lyrics, as well as a spirit of experimentation that they held onto throughout their active career."},{"n":104,"year":1993,"ar":"Yo La Tengo","ti":"Painful","cv":"https://ia600809.us.archive.org/24/items/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd/mbid-e95cc14d-390a-3b85-a3e6-a9350f4feffd-21480189175.jpg","rt":0.0,"sp":"","yt":"dmvXdKXi-tk","gen":["alternative rock","indie rock","rock","Alternative Rock"],"hb":[],"da":"Painful is the sixth studio album by American indie rock band Yo La Tengo, released in 1993 by record label Matador, their first for the label. The album marked a creative shift from Yo La Tengo's previous work, blending atmospheric and ambient sounds with their famous noise jams. Painful features a much more melody-driven Yo La Tengo in its hazy, dream-like songwriting. Two versions of the track \"Big Day Coming\" are present on the album and display the range of musical stylings Yo La Tengo works with; the first version features a simple organ melody accompanied by a soft bass .","dar":"Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record."},{"n":117,"year":1993,"ar":"Grant Lee Buffalo","ti":"Fuzzy","cv":"https://dn711000.ca.archive.org/0/items/mbid-83b4d5b8-b812-4fb5-b9e0-29980162391b/mbid-83b4d5b8-b812-4fb5-b9e0-29980162391b-41018868125.jpg","rt":0.0,"sp":"","yt":"nfIaRchAdkc","gen":["alternative rock","indie rock","alternative country","Rock","Alternative Rock"],"hb":["Nubis84"],"da":null,"dar":"Grant Lee Buffalo was a Los Angeles-based rock band, consisting of Grant-Lee Phillips (vocals and guitar), Paul Kimble (bass) and Joey Peters (drums). All three were previously members of another LA band, Shiva Burlesque. As GLB, they released four albums:  Fuzzy (1993), Mighty Joe Moon  (1994), Copperopolis (1996) and Jubilee  (1998, without Kimble who had left the band the previous year). After the release of Jubilee, the band broke up and Phillips went on to pursue a solo career and is currently touring in 2025."},{"n":135,"year":1993,"ar":"Motorpsycho","ti":"Demon Box","cv":"https://dn711008.ca.archive.org/0/items/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6/mbid-b6026bfd-9cdc-406f-b012-506dacfceed6-15893454828.jpg","rt":0.0,"sp":"","yt":"A0DSVuYO274","gen":["psychedelic rock","alternative rock","hard rock","indie rock","rock","Rock"],"hb":[],"da":null,"dar":"Motorpsycho is a band from Trondheim in Norway, formed in 1989. Their music can generally be defined as psychedelic rock, but they also mix in elements from metal, jazz, rock, noise, pop and many other musical styles. The members of the band are Bent Sæther (bass/vocals) and Hans Magnus Ryan (guitar/vocals). Håkon Gebhardt (drums) left the band in March 2005 to concentrate on solo projects (as Gebhardt) and his other band HGH. \nDrummer Kenneth Kapstad joined Motorpsycho as a full member late in 2007."},{"n":138,"year":1993,"ar":"Sugar","ti":"Beaster","cv":"https://dn721906.ca.archive.org/0/items/mbid-7eae3f1f-4364-4692-9534-aca59485ea07/mbid-7eae3f1f-4364-4692-9534-aca59485ea07-29288008887.jpg","rt":0.0,"sp":"","yt":"1fPayXT6qYw","gen":["alternative rock","Alternative Rock"],"hb":[],"da":null,"dar":"There are several bands by the name of Sugar: \n\n(1) Project of former Hüsker Dü member Bob Mould. \n(2) A Korean girl-pop group.\n(3) A Japanese visual-kei group formed in 2005 and disbanded in 2009.\n(4) A Copenhagen producer, DJ and co-founder of Fast Forward Productions.\n(5) An Australian psy-trance producer/artist\n(6) A rockband from Den Bosch, The Netherlands.\n(7) A Japanese visual-kei group formed in 2024.\n\nSugar (1) was formed by Bob Mould after the breakup of Hüsker Dü"},{"n":146,"year":1993,"ar":"Girls Against Boys","ti":"Venus Luxure No. 1 Baby","cv":"https://dn710906.ca.archive.org/0/items/mbid-8a4781c1-2032-4897-a21c-037f4b4ff689/mbid-8a4781c1-2032-4897-a21c-037f4b4ff689-13364636275.jpg","rt":0.0,"sp":"","yt":"8CFiF4wY-3U","gen":["alternative rock","indie rock","post-hardcore","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Girls Against Boys are a post-hardcore band, originally forming in Washington DC in 1988 and currently based in New York City.\n\nThe group began as a side project of Eli Janney and Fugazi drummer Brendan Canty. Canty soon left the project and by 1991 Janney had gone on to recruit three former members of D.C. hardcore punk group Soulside - Scott McCloud, Johnny Temple, and Alexis Fleisig - to complete the line-up. Girls Against Boys are perhaps most notable for employing dual bass guitars"},{"n":155,"year":1993,"ar":"Mazzy Star","ti":"So Tonight That I Might See","cv":"https://ia803100.us.archive.org/29/items/mbid-f3686430-4792-4e0f-b105-45f68c459c64/mbid-f3686430-4792-4e0f-b105-45f68c459c64-37044044892.jpg","rt":0.0,"sp":"","yt":"gYbBL_3XLEM","gen":["psychedelic rock","alternative rock","psychedelic folk","shoegaze","dream pop","slowcore"],"hb":["Frikomid","paqueradejere","sdecandelario","verygooood"],"da":"So Tonight That I Might See is the second studio album by American alternative rock band Mazzy Star, released on October 5, 1993. The album's first track, \"Fade into You\", became the band's first and only single to make the Billboard Hot 100 chart, peaking at number 44 and charting at number 48 on the UK Singles Chart. In a highly positive review, Steve Hochman of the Los Angeles Times called So Tonight That I Might See \"far more narcotic and hypnotic than anything the whole techno-trance universe has digitally blipped up to date.\" NME described it as an \"even .","dar":"Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band"},{"n":171,"year":1993,"ar":"Primus","ti":"Pork Soda","cv":"https://dn710800.ca.archive.org/0/items/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d/mbid-ebcd119e-73be-35bb-8f1a-a506aa73b95d-28985005149.png","rt":0.0,"sp":"","yt":"K8WGVYxG5Ng","gen":["alternative rock","funk rock","heavy metal","alternative metal","funk metal","Alternative Rock"],"hb":[],"da":"Pork Soda is the third album by Primus. Released in 1993, \"Pork Soda\" is considerably darker than any of the band's earlier efforts, dealing with murder (\"My Name Is Mud\"), dissatisfaction with the human race (\"Nature Boy\", \"Welcome to This World\"), suicide (\"Bob\"), and inconvenient realities of life (\"DMV\"). It was a certified Gold record shortly after its release and is currently certified Platinum; it is Primus' largest seller to date. Track listing # Title Length 1. \"Pork Chop's Little Ditty\" 0:21 2. \"My Name Is Mud\" 4:48 3. \"Welcome to This World\" 3:40 4. \"Bob\" 4:40 5. \"DMV\" 4:58 .","dar":"Primus is a San Francisco-based alternative rock band formed in the mid-1980s by bassist Les Claypool and guitarist Todd Huth. Les (vocals and bass guitar) has been the only constant member. They have had two guitar players (although Larry has held onto the role for the past 30 years) and many different drummers (although Tim Alexander, Bryan Mantia and Jay Lane were the only ones who recorded with the band) in the past. \n\nTheir music has proven difficult to define; while usually considered by critics to be funk metal or alternative metal"},{"n":180,"year":1993,"ar":"Mercury Rev","ti":"Boces","cv":"https://dn710702.ca.archive.org/0/items/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e/mbid-ab9b8027-6ba6-4e70-8270-171b4288787e-16199489502.jpg","rt":0.0,"sp":"","yt":"dqcVhV8pCyA","gen":["alternative rock","blues","indie rock","dream pop","rock","Rock"],"hb":[],"da":null,"dar":"Mercury Rev is an American  rock music group, that formed in 1989 in Buffalo, New York. Original personnel were David Baker (vocals), Jonathan Donahue (vocals, guitars), Sean \"Grasshopper\" Mackowiak (guitars, clarinet), Suzanne Thorpe  (flute), Dave Fridmann (bass) and Jimy Chambers  (drums).\n\nWith their debut, Yerself Is Steam, the band gained an underground following, particularly in the UK. 1993's Boces was critically acclaimed for its alternative sound"},{"n":189,"year":1993,"ar":"Swervedriver","ti":"Mezcal Head","cv":"https://dn711109.ca.archive.org/0/items/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0/mbid-701a1f0d-3906-4173-abc3-254e2b69b9c0-12135644621.jpg","rt":0.0,"sp":"","yt":"b0DTBOQOdf4","gen":["alternative rock","indie rock","shoegaze","rock","Alternative Rock"],"hb":[],"da":"Mezcal Head is the second studio album by English alternative rock band Swervedriver. It was released on 27 September 1993 by Creation Records in the United Kingdom and on 5 October 1993 by A&M Records in the United States. .","dar":"Swervedriver is a British shoegaze band, however their heavier rock & roll style also related them to the grunge genre coming from the U.S. Pacific Northwest. Some music writers considered them to be Britain's answer to this sound. Regardless of labels, the band's mix of storming and swirling guitar experimentation often crossed into psychedelia, coupled with mystical lyrics that often praised the nihilism of sports cars, racing and the open road."},{"n":191,"year":1993,"ar":"Eric's Trip","ti":"Love Tara","cv":"https://dn721904.ca.archive.org/0/items/mbid-66f07db8-5eaa-4b09-9f0a-492852fa4060/mbid-66f07db8-5eaa-4b09-9f0a-492852fa4060-44556590426.png","rt":0.0,"sp":"","yt":"o4YDfjVin7E","gen":["alternative rock","indie rock","noise pop","indie folk","slacker rock","Alternative Rock"],"hb":[],"da":null,"dar":"Eric's Trip was a Canadian indie rock band hailing from Moncton, New Brunswick. Forming in 1990 when musicians Rick White and Christopher Thompson of The Forest joined  Julie Doiron and Ed Vaughan (who was later replaced by Mark Gaudet of Purple Knight), they took their name from a Sonic Youth song. They emulated the distorted guitar of Dinosaur Jr., the folk leanings of Neil Young, and the lo-fi aesthetic of Sebadoh. Rick White described their sound as \"sappy melodic pop music on top of thick distortion.\""},{"n":197,"year":1993,"ar":"Sarah McLachlan","ti":"Fumbling Towards Ecstasy","cv":"https://dn711309.ca.archive.org/0/items/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd/mbid-42500ccf-6e3c-39b8-ad17-2beb62b795fd-4534872028.jpg","rt":0.0,"sp":"","yt":"vf727y_HsOE","gen":["folk rock","alternative rock","pop rock","soft rock","dream pop","Rock"],"hb":[],"da":"Fumbling Towards Ecstasy is Sarah McLachlan's critically-acclaimed third studio album. It was produced by Pierre Marchand in Montreal, and released in 1993. The album was an immediate hit in Canada, where McLachlan was already an established star. Over the next two years, it became her breakthrough album internationally as well. However, in some countries, most notably the United States, the album was a steady seller that stayed in the middle ranges of the pop charts for almost two years, rather than the #1 smash that McLachlan would achieve with 1997's Surfacing. It is often considered by critics, though, her most .","dar":"Sarah McLachlan (born Sarah Ann McLachlan January 28, 1968 in Halifax, Nova Scotia, Canada) is a Grammy-winning musician, singer and songwriter. \n\nShe is known for the emotional sound of her ballads. Some of her most popular songs include \"Angel\", \"Building a Mystery\", \"Adia\", \"Possession\", \"Fallen\", \"I Will Remember You\", and \"World on Fire\". Her best-selling album to date is Surfacing, for which she won two Grammy Awards and four Juno Awards.\n\nHer first album Touch was released in September 28, 1988, recorded in 1987-1988, Vancouver, Canada."},{"n":200,"year":1993,"ar":"Cop Shoot Cop","ti":"Ask Questions Later","cv":"https://dn721601.ca.archive.org/0/items/mbid-8b3f08aa-06b9-4ca4-b779-56e6c893cf77/mbid-8b3f08aa-06b9-4ca4-b779-56e6c893cf77-42402071646.png","rt":0.0,"sp":"","yt":"nHiB-I2QAvw","gen":["alternative rock","punk","industrial","rock","Rock","Punk"],"hb":[],"da":null,"dar":"Cop Shoot Cop was a rock music group founded in New York, NY in 1987 and disbanded in 1996.\n\nThey were frequently classified as industrial rock, but were often quite different from many bands so dubbed. Tod A.'s lyrics were clever, snide and evocative (Art Black and David Sprague suggest that \"Black humor beats black metal any day\") and their \"weirdly catchy\" music which drew \"on hot jazz and swing as much as clanging rock, emphasizing the group's stand-apart attitude.\""},{"n":2,"year":1992,"ar":"Alice in Chains","ti":"Dirt","cv":"https://dn710800.ca.archive.org/0/items/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf-9835602113.jpg","rt":0.0,"sp":"","yt":"19CXYQhqVu0","gen":["alternative rock","hard rock","heavy metal","doom metal","metal","grunge"],"hb":["Lonsonxd","sdecandelario","verygooood"],"da":"Dirt is the second studio album by the American rock band Alice in Chains and was released on September 29, 1992 through Columbia Records. Peaking at number six on the Billboard 200, the album was well received by music critics and has since been certified four-times platinum by the RIAA. It is nowadays considered as one of the best grunge/heavy metal albums and is usually on many \"Must have\" lists. The album spawned five singles: \"Would?\", \"Them Bones\", \"Angry Chair\", \"Rooster\", and \"Down in a Hole\". The songs on the album focused on depression, drug use, war, death, and other .","dar":"Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style"},{"n":3,"year":1992,"ar":"Rage Against the Machine","ti":"Rage Against the Machine","cv":"https://dn710909.ca.archive.org/0/items/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7-33270800624.jpg","rt":0.0,"sp":"","yt":"MAnsR_7VYKQ","gen":["alternative rock","metal","alternative metal","funk metal","rap metal","political hip hop"],"hb":[],"da":"Rage Against the Machine is the debut album by rock band Rage Against the Machine, released November 3, 1992. The songs on Rage Against the Machine tend to feature political mantras with the vocals rapped. The album peaked at #1 on Billboard's Heatseekers chart, and at #45 on the Billboard Top 200 chart. Tom Morello's guitar soloing is somewhat traditional on this album, taking influence more from heavy metal music, in comparison to later releases where it is more experimental and geared toward emulation of DJs and hip hop. In 2001 Q magazine named Rage Against the Machine as one .","dar":"Rage Against the Machine was an American rock band from Los Angeles, California. Formed in 1991, the group consisted of vocalist Zack de la Rocha, bassist and backing vocalist Tim Commerford, guitarist Tom Morello, and drummer Brad Wilk. Their songs express revolutionary left-wing political views. As of 2010, they had sold over 16 million records worldwide. In 2023, the band was inducted into the Rock and Roll Hall of Fame.\n\nRage Against the Machine released its eponymous debut album in 1992 to commercial and critical success"},{"n":4,"year":1992,"ar":"Faith No More","ti":"Angel Dust","cv":"https://dn711100.ca.archive.org/0/items/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18/mbid-d7faa783-cf1c-3694-84e4-f626273ddd18-25332359916.jpg","rt":0.0,"sp":"","yt":"k0tUb-87kP8","gen":["experimental rock","alternative rock","hard rock","alternative metal","funk metal","avant-garde metal"],"hb":[],"da":"Angel Dust is the fourth studio album by American rock band Faith No More, first released through Slash on June 8, 1992 in Europe and the United States. It's the final studio album with long time guitarist Jim Martin and the second to feature Mike Patton on vocals however it is the first album in which he had an influence on the band's sound, as Patton hadn't previously had input on the musical composition of the albums predecessor, The Real Thing, as it had all been composed and recorded prior to his joining. It remains as Faith No More's highest-selling .","dar":"Faith No More was an American rock band from San Francisco, California, formed in 1979. Before September 1983, the band performed under the names Sharp Young Men and later Faith No Man. Bassist Billy Gould, keyboardist and rhythm guitarist Roddy Bottum, and drummer Mike Bordin were the longest-tenured members of the band, having been involved since its inception. The band underwent several lineup changes over the years. The final lineup consisted of Gould, Bordin, Bottum, lead guitarist Jon Hudson, and vocalist and lyricist Mike Patton."},{"n":22,"year":1992,"ar":"Kyuss","ti":"Blues For The Red Sun","cv":"https://dn720708.ca.archive.org/0/items/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be/mbid-d9febdc9-c13c-3a62-9abd-5e52cf4d99be-11039555984.jpg","rt":0.0,"sp":"","yt":"gZxPm06Dhn4","gen":["alternative rock","hard rock","heavy metal","stoner rock","alternative metal","stoner metal"],"hb":[],"da":null,"dar":"Kyuss  (pronounced /ˈkaɪ.əs/ KYE-əs) are the corner stone of what is known as stoner rock or desert rock. Although deriving influence from 60s-70s hard rock, Kyuss churned out a unique sound. This was primarily because guitarist Josh Homme often tuned to a low C, a major third below standard pitch, but also singer John Garcia's paint stripping vocals.\n\nThe band was originally formed in 1989 in Palm Desert, California under the name \"Sons of Kyuss\"."},{"n":29,"year":1992,"ar":"R.E.M.","ti":"Automatic for the People","cv":"https://dn711101.ca.archive.org/0/items/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17/mbid-0712fd61-a60e-42b8-ae88-d96f4f834d17-7646243169.jpg","rt":0.0,"sp":"","yt":"jBUjeOBzkIk","gen":["alternative rock","pop rock","acoustic rock","indie rock","jangle pop","Punk"],"hb":[],"da":"Automatic for the People is the eighth album by the American alternative rock band R.E.M., released in 1992 on Warner Bros. Records. While R.E.M. had intended to make a harder-rocking album after dealing primarily with acoustic based sounds on its previous record Out of Time (1991), the group eventually abandoned that goal and created an album that was musically subdued and dealt with mortality. Automatic for the People reached number two on the US album charts and yielded six singles. It was ranked #247 in Rolling Stone’s 500 Greatest Albums of All Time. After promotional duties for their previous album .","dar":"R.E.M. was an American alternative rock band from Athens, Georgia, formed in 1980 by drummer Bill Berry, guitarist  Peter Buck, bassist/backing vocalist  Mike Mills, and lead vocalist  Michael Stipe. One of the first alternative rock bands, R.E.M. was noted for Buck's ringing, arpeggiated guitar style, Stipe's distinctive vocal quality and obscure lyrics, Mills's melodic bass lines and backing vocals, and Berry's tight, economical style of drumming."},{"n":42,"year":1992,"ar":"Pavement","ti":"Slanted and Enchanted","cv":"https://dn720700.ca.archive.org/0/items/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf/mbid-547b6b75-d81d-4d9e-a3a5-c2115224edaf-36814960831.jpg","rt":0.0,"sp":"","yt":"skGqpC0WYSk","gen":["alternative rock","noise rock","indie rock","noise pop","Alternative Rock"],"hb":[],"da":"Slanted and Enchanted is the debut studio album by American indie rock band Pavement, released on April 20, 1992 by Matador Records. It is the only Pavement album to feature drummer Gary Young. The album received critical acclaim and is seen as a landmark for indie rock, with Rolling Stone ranking it 199th on its 2020 edition of The 500 Greatest Albums of All Time. As of 2007, the album had sold 150,000 copies. Slanted and Enchanted was distributed to critics as early as 1991, months before its official release; the original distribution did not feature the entire band, as .","dar":"Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s."},{"n":97,"year":1992,"ar":"Beastie Boys","ti":"Check Your Head","cv":"https://ia801803.us.archive.org/22/items/mbid-8df53a98-da10-4084-a5af-b9b3b64bcb33/mbid-8df53a98-da10-4084-a5af-b9b3b64bcb33-2433557710.jpg","rt":0.0,"sp":"","yt":"RSJmWKNsU2Q","gen":["alternative rock","punk rock","funk","hip hop","east coast hip hop","rap rock"],"hb":[],"da":"Check Your Head is the third album by the Beastie Boys, released on April 21, 1992. Three years elapsed between the release of Paul's Boutique (the band's second album) and their recording of this album. Check Your Head was recorded at the G-Son Studios in Atwater Village, California in 1991. The album features the popular hits \"So Whatcha Want\" and \"Pass the Mic\"; the music videos for both songs are available on the Criterion Collection Beastie Boys Video Anthology DVD set. The album was re-released in 2009 in a number of formats and featured 16 b-sides and rarities as well .","dar":"Beastie Boys were an American hip-hop trio from New York City, United States: Brooklyn and Manhattan. Originally formed as a four-piece hardcore punk band, The Young Aborigines, in 1978 by Michael Diamond (vocals), John Berry (guitar; died May 2016), Adam Yauch (bass) and Kate Schellenbach (drums), for the majority of its career the group consisted of Mike D (real name Michael Diamond),  Ad-Rock (Adam Horovitz) and, until his death in May 2012, MCA (Adam Yauch)."},{"n":102,"year":1992,"ar":"Ride","ti":"Going Blank Again","cv":"https://cdn2.albumoftheyear.org/600x0/album/7747-going-blank-again_222544.jpg","rt":0.0,"sp":"","yt":"01WWxRLRYhw","gen":["alternative rock","neo-psychedelia","shoegaze","dream pop","Rock","Pop"],"hb":["Frikomid","sdecandelario","verygooood"],"da":"Going Blank Again is the second studio album by British rock band Ride, released on 9 March 1992 on Creation Records. It was produced by Alan Moulder, and peaked at No. 5 in the UK Albums Chart. In October 2009 the album was certified gold by the British Phonographic Industry for sales of over 100,000 units. Following Ride's 1990 debut album Nowhere, Ride released Going Blank Again as their second full-length record, accompanied by the singles \"Leave Them All Behind\" (10 February 1992) and \"Twisterella\" (13 April 1992), the latter named in reference to a song in the 1963 kitchen .","dar":"Ride is a shoegaze band that formed in 1988 in Oxford, England, consisting of Andy Bell, Mark Gardener, Laurence Colbert, and Steve Queralt. The band were initially part of the shoegaze scene that emerged in England during the early 1990s. Their debut album Nowhere (1990) has been named one of the greatest albums of the genre. Ride has released five albums: \"Nowhere\" (1990), \"Going Blank Again\" (1992), \"Carnival of Light\" (1994), \"Tarantula\" (1996), and \"Weather Diaries\" (2017)."},{"n":143,"year":1992,"ar":"PJ Harvey","ti":"Dry","cv":"https://dn711009.ca.archive.org/0/items/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703/mbid-72c6b7bd-6999-48cb-9197-e2f8d0dc5703-16145595354.jpg","rt":0.0,"sp":"","yt":"lABPOmNiUqY","gen":["alternative rock","indie rock","grunge","Rock","Alternative Rock"],"hb":["GabredMared","paqueradejere","sdecandelario"],"da":"Dry is the debut studio album by the band PJ Harvey, fronted by English singer-songwriter and musician PJ Harvey, released on Too Pure Records on 30 March 1992. The album was recorded at The Icehouse, a local studio in Yeovil, United Kingdom. The first 5000 LPs and first 1000 CDs included demo versions of the album's tracks, being subsequently released in the United States on Indigo Records in the US. Both versions were released in 1992. Speaking to Filter magazine in 2004, Harvey said of her debut album: \"\"Dry\" is the first chance I ever had to make a record .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":146,"year":1992,"ar":"Pale Saints","ti":"In Ribbons","cv":"https://dn710701.ca.archive.org/0/items/mbid-d3b53717-51b6-34f8-8960-9fba6153b159/mbid-d3b53717-51b6-34f8-8960-9fba6153b159-19631884777.jpg","rt":0.0,"sp":"","yt":"EEaCIEP0yT4","gen":["alternative rock","shoegaze","Pop","Alternative Rock"],"hb":[],"da":"In Ribbons is the second studio album from the Pale Saints, released by 4AD on 23 March 1992. The album features the single \"Throwing Back the Apple\", and was preceded by the EPs Half-Life in October 1990 and Flesh Balloon in June 1991. .","dar":"Pale Saints was a British shoegaze band formed by Ian Masters (bass/vocals), Graeme Naysmith (guitar), and Chris Cooper (drums). They began as a three-piece   band based in Leeds, England, in 1987. The band was signed to 4AD records by 4AD chief Ivo after their first London show. They were amongst a number of groups in the nineties who were dubbed as shoegaze by the NME and Melody Maker. \n\nEarly band interviews showed them to be a fun-loving bunch in contrast to their dark, lyrically pessimistic pop music."},{"n":163,"year":1992,"ar":"Sugar","ti":"Copper Blue","cv":"https://dn710905.ca.archive.org/0/items/mbid-ba256aa9-9036-35e7-bbdc-31f431974985/mbid-ba256aa9-9036-35e7-bbdc-31f431974985-23521655880.png","rt":0.0,"sp":"","yt":"d4DJnmD2z7M","gen":["alternative rock","Alternative Rock"],"hb":[],"da":"Copper Blue is the debut studio album by American alternative rock band Sugar. It was voted 1992 Album of the Year by the NME. All of the songs were written by guitarist/vocalist Bob Mould, who also co-produced with Lou Giordano. Musically, the band continues the thick punk guitar of Mould's previous band, Hüsker Dü, while slowing the tempo and emphasizing melody even more. .","dar":"There are several bands by the name of Sugar: \n\n(1) Project of former Hüsker Dü member Bob Mould. \n(2) A Korean girl-pop group.\n(3) A Japanese visual-kei group formed in 2005 and disbanded in 2009.\n(4) A Copenhagen producer, DJ and co-founder of Fast Forward Productions.\n(5) An Australian psy-trance producer/artist\n(6) A rockband from Den Bosch, The Netherlands.\n(7) A Japanese visual-kei group formed in 2024.\n\nSugar (1) was formed by Bob Mould after the breakup of Hüsker Dü"},{"n":184,"year":1992,"ar":"Morrissey","ti":"Your Arsenal","cv":"https://dn710303.ca.archive.org/0/items/mbid-596071f9-a2ff-3185-a471-8fcb029625dd/mbid-596071f9-a2ff-3185-a471-8fcb029625dd-6618437694.jpg","rt":0.0,"sp":"","yt":"SX-da_xcbEQ","gen":["alternative rock","pop rock","glam rock","indie rock","indie pop","jangle pop"],"hb":[],"da":"Your Arsenal is the third studio album by English singer Morrissey, released on 27 July 1992 by record label HMV. The album received critical acclaim and reached number 4 on the UK Albums Chart. Morrissey had been rehearsing with a new band prior to the release of Your Arsenal, which was the first official album of this new line-up. Commencing with \"You're Gonna Need Someone on Your Side\", the album represents a clear change in direction for Morrissey from indie pop to a more muscular rock sound; with some elements of rockabilly. It also contains a glam rock influence, due .","dar":"Steven Patrick Morrissey, better known as Morrissey, is a British singer and lyricist of Irish descent born in Davyhulme, Manchester, United Kingdom on May 22, 1959.\n\nHe was the lead singer of The Smiths, one of the most influential alternative bands in the 1980s. The group split up in 1987 and Morrissey started a successful solo career.\n\nHis first solo album, Viva Hate was released only six months after The Smiths split, in March 1988. The album's first single \"Suedehead\" peaked at #5"},{"n":197,"year":1991,"ar":"Codeine","ti":"Frigid Stars","cv":"https://dn711200.ca.archive.org/0/items/mbid-01c518f7-7c3f-4679-9e0d-67252a737314/mbid-01c518f7-7c3f-4679-9e0d-67252a737314-15606984492.jpg","rt":0.0,"sp":"","yt":"LgdS7Lmn6_4","gen":["alternative rock","indie rock","slowcore","post-rock","rock","Alternative Rock"],"hb":[],"da":null,"dar":"American indie rock band formed in New York in 1989 by members Stephen Immerwahr (vocal, bass), Chris Brokaw (drums) and John Engle (guitar). Codeine pioneered the slowcore and sadcore subgenres of indie rock, but with a more experimental attitude than other bands in the genre, such as Low, Idaho and Red House Painters. The band's original tone, marked by slow tempos, Immerwahr's nasal and apathetic vocals, and Engle's ringing Telecaster, did not evolve much during their career."},{"n":2,"year":1991,"ar":"My Bloody Valentine","ti":"Loveless","cv":"https://dn710703.ca.archive.org/0/items/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06/mbid-cd32c6cf-f979-39e7-a4ec-157d3a560d06-25797196285.jpg","rt":0.0,"sp":"","yt":"4nzZeUUiG2c","gen":["alternative rock","noise rock","psychedelic","noise pop","shoegaze","dream pop"],"hb":["verygooood"],"da":"loveless is the second studio album by Irish shoegaze band my bloody valentine, released on 4 November 1991 by Creation Records. The album was recorded over a two-year period between 1989 and 1991. Vocalist and guitarist Kevin Shields dominated the arduous recording process; intent on achieving a particular sound, he experimented with guitar tremolo techniques and tuning systems, unorthodox production methods, obscured vocals, and sampled percussion and feedback. The group cycled through nineteen studios and a larger number of engineers during the album's two-year creation, with total recording costs rumoured to have reached £250,000. While loveless did not achieve great .","dar":"my bloody valentine is an Irish-English shoegaze band formed in 1983 in Dublin, Ireland. The band’s best known lineup is Kevin Shields (vocals, guitar), Bilinda Butcher (vocals, guitar), Debbie Googe (bass) and Colm Ó Cíosóig (drums). Their 1988 album Isn't Anything is generally regarded as one of the most influential records of the period, acting as an important precursor to the early '90s \"shoegazing\" scene. In 1991, the band released their second full length album Loveless, later declared one of the finest albums of the 1990s."},{"n":4,"year":1991,"ar":"Slint","ti":"Spiderland","cv":"https://dn711203.ca.archive.org/0/items/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e/mbid-2c8cba8b-a80a-4d7f-9a7f-22c922f1a42e-11175053947.jpg","rt":0.0,"sp":"","yt":"FAApF-FDkoY","gen":["alternative rock","post-hardcore","post-rock","math rock","Rock","Punk"],"hb":["alberto_gu"],"da":"Spiderland is the second and final studio album by the American rock band Slint. It contains six songs played over 40 minutes, and was released by Touch and Go Records on March 27, 1991. Slint's lineup at the time of recording comprised Brian McMahan on vocals and guitar, David Pajo on guitar, Todd Brashear on bass guitar and Britt Walford on drums. Spiderland was engineered by Brian Paulson and recorded over four days in August 1990. The music and vocal melodies were composed throughout the summer of 1990, while lyrics were written in-studio. Forming in 1986 in Louisville, Kentucky, Slint .","dar":"Slint was an American post-hardcore band consisting of Brian McMahan (guitar and vocals), David Pajo (guitar), Britt Walford (drums), Todd Brashear (bass on Spiderland) and Ethan Buckler (bass on Tweez). They formed in Louisville, Kentucky, United States in 1986. Though they disbanded circa 1991, they are considered to be a major influence on the post-hardcore, math rock, and post-rock scenes.\n\nSlint's first album Tweez was recorded by legendary sound"},{"n":9,"year":1991,"ar":"Pearl Jam","ti":"Ten","cv":"https://dn721905.ca.archive.org/0/items/mbid-4816047b-5a40-462a-81e7-2f6eb6687fda/mbid-4816047b-5a40-462a-81e7-2f6eb6687fda-26843414237.jpg","rt":0.0,"sp":"","yt":"JqYIwJDsinM","gen":["alternative rock","hard rock","grunge","Rock","Alternative Rock"],"hb":[],"da":"\"Ten\" is the debut album by the Pearl Jam, released on August 27, 1991 through Epic Records. Following the disbanding of bassist Jeff Ament and guitarist Stone Gossard's previous group Mother Love Bone, the two recruited vocalist Eddie Vedder, guitarist Mike McCready, and drummer Dave Krusen to form Pearl Jam in 1990. Most of the songs began as instrumental jams, to which Vedder added lyrics about topics such as depression, homelessness, and abuse. \"Ten\" was not an immediate success, but by late 1992 it had reached number two on the Billboard 200 chart. The album produced three hit singles: \"Alive\", .","dar":"Pearl Jam is an American grunge/alternative rock band formed in Seattle, Washington, in 1990. The band's lineup consists of founding members Jeff Ament (bass guitar), Stone Gossard (rhythm guitar), Mike McCready (lead guitar), and Eddie Vedder (lead vocals, guitar), as well as Matt Cameron (drums), who joined in 1998. Keyboardist Boom Gaspar has also been a touring/session member with the band since 2002. Drummers Jack Irons, Dave Krusen, Matt Chamberlain, and Dave Abbruzzese are former members of the band."},{"n":21,"year":1991,"ar":"Red Hot Chili Peppers","ti":"Blood Sugar Sex Magik","cv":"https://dn710804.ca.archive.org/0/items/mbid-23767d15-3b52-4298-9b6b-32a4a2684618/mbid-23767d15-3b52-4298-9b6b-32a4a2684618-15240926872.jpg","rt":0.0,"sp":"","yt":"kziGsq8reTc","gen":["alternative rock","funk","funk rock","heavy metal","funk metal","rap rock"],"hb":["Lonsonxd","sdecandelario"],"da":"Blood Sugar Sex Magik is the fifth studio album by American alternative rock band Red Hot Chili Peppers, released on September 24, 1991. Produced by Rick Rubin, it was the band's first record released on Warner Bros. Records. The musical styles of Blood Sugar Sex Magik differed notably from the techniques employed on the band's preceding album, Mother's Milk (1989), and featured little use of heavy metal guitar riffs. The album's subject matter incorporated sexual innuendos and references to drugs and death as well as themes of lust and exuberance. The album has sold over seven million copies in the .","dar":"Red Hot Chili Peppers is an American rock band formed in Los Angeles in 1982, consisting of Anthony Kiedis (vocals), Flea (bass), John Frusciante (guitar), and Chad Smith (drums). Their music blends elements of alternative rock, funk, punk rock, hard rock, hip hop, and psychedelic rock, and they have influenced genres such as funk metal, rap metal, rap rock, and nu metal. With over 120 million records sold worldwide, the Red Hot Chili Peppers are among the best-selling bands in history."},{"n":38,"year":1991,"ar":"Melvins","ti":"Bullhead","cv":"https://dn710709.ca.archive.org/0/items/mbid-67d450b3-9f16-43e7-a819-019e6e54e074/mbid-67d450b3-9f16-43e7-a819-019e6e54e074-12107471021.jpg","rt":0.0,"sp":"","yt":"8NUPV_LdJFM","gen":["alternative rock","sludge metal","rock","Metal","Rock"],"hb":[],"da":"The Melvins' third proper full-length. It features longer songs than their earlier releases and a more metallic, sludgy sound. .","dar":"Melvins is a sludge metal band that formed in Montesano, Washington, United States in 1983. The band currently consists of Buzz Osborne (vocals, guitar), Steven Shane McDonald (bass), and Dale Crover (drums). Osborne is the only remaining original member, although Crover has been a member since early in the band's career.\n\nIn the early days of their career. . . their dark, heavy, oppressively slow sound made them innovators of genres like sludge, grunge, and doom metal."},{"n":56,"year":1991,"ar":"U2","ti":"Achtung Baby","cv":"https://dn711103.ca.archive.org/0/items/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f/mbid-bde8784b-ae7e-4553-9dda-1c4a19d3a56f-16544589722.jpg","rt":0.0,"sp":"","yt":"tkoEGVAHpZg","gen":["alternative rock","pop rock","post-punk","indie rock","alternative dance","dance-rock"],"hb":[],"da":"Achtung Baby is the seventh studio album by Irish rock band U2, released on 19 November 1991. The album arrived nearly two years after lead vocalist Bono announced the band would have to \"go away and dream it all up again\", following the mixed response to 1988's Rattle and Hum. While recording Achtung Baby, there was a rift between band members over the direction of the band's sound. Tensions almost prompted U2 to break-up until the band rallied around the writing of the album's hit One. The album marks a dramatic change in the band's image and sound, with the .","dar":"U2 are an Irish rock band formed in Dublin in 1976. The group comprises Paul \"Bono\" Hewson (lead vocals and rhythm guitar), David \"the Edge\" Evans (lead guitar, keyboards, and backing vocals), Adam Clayton (bass guitar), and Larry Mullen Jr. (drums and percussion). Initially rooted in post-punk, U2's musical style has evolved throughout their career, yet has maintained an anthemic quality built on Bono's expressive vocals and the Edge's chiming, effects-based guitar sounds."},{"n":64,"year":1991,"ar":"Nirvana","ti":"Nevermind","cv":"https://dn721803.ca.archive.org/0/items/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b/mbid-c771f7fc-9e62-4349-a2e3-ceaf7122bf5b-30501372565.jpg","rt":0.0,"sp":"","yt":"V0hDhjO3AwM","gen":["alternative rock","punk rock","grunge","rock","censored album cover","Rock"],"hb":["BipolarMuzik","Lonsonxd","alberto_gu","verygooood"],"da":"Nevermind is the second studio album by the American grunge band Nirvana, released on September 24, 1991. Produced by Butch Vig, Nevermind was the group's first release on Geffen Records, which signaled its move away from Seattle-based independent record label Sub Pop. Front man Kurt Cobain sought to make music outside of the restrictive confines of the Seattle grunge scene, drawing influence from groups such as the Pixies and its use of loud/quiet song dynamics. Nevermind was a surprise success by late 1991, largely due to the success of its lead single \"Smells Like Teen Spirit\". By January 1992 it .","dar":"There are multiple artists tracked as \"Nirvana\" on Last.fm. Following are six, listed in order of prominence:\n\n1) Nirvana was a popular and highly influential American grunge band. The band formed in Aberdeen, Washington in 1987, and it was part of the Seattle grunge scene of the late 80s, alongside bands like Pearl Jam, Alice in Chains and Soundgarden. As their popularity rose, alternative rock became a dominant genre on American and Canadian radio and music television during the early-to-mid '90s."},{"n":75,"year":1991,"ar":"Massive Attack","ti":"Blue Lines","cv":"https://dn711308.ca.archive.org/0/items/mbid-3a25785e-50ec-383c-89cf-fd512181449c/mbid-3a25785e-50ec-383c-89cf-fd512181449c-2233107692.jpg","rt":0.0,"sp":"","yt":"W5UIf9CRXNI","gen":["alternative rock","dub","electronica","trip hop","hip hop","alternative dance"],"hb":["BipolarMuzik","GabredMared","Rocky_stereo","paqueradejere","sdecandelario","verygooood"],"da":"Blue Lines is the debut studio album by English electronic music group Massive Attack, released on April 8, 1991 by Wild Bunch and Virgin Records. Generally regarded as the first \"trip hop\" album, Blue Lines blended elements of hip hop (such as breakbeats, sampling and rapping) with dub, soul, reggae and electronic music. The recording was led by members Grantley \"Daddy G\" Marshall, Robert \"3D\" Del Naja, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles, with co-production by Jonny Dollar. It also features contributions by singers Shara Nelson and Horace Andy. Blue Lines was named the 21st greatest album of all .","dar":"Massive Attack is an English trip hop collective formed in 1988 in Bristol by Robert \"3D\" Del Naja, Grant \"Daddy G\" Marshall, Adrian \"Tricky\" Thaws and Andrew \"Mushroom\" Vowles. The group consists of Del Naja and Marshall.\n\nTheir debut album, \"Blue Lines\" (1991), is frequently cited as the first major work of the trip hop genre. The single \"Unfinished Sympathy\" achieved chart success in Europe, including reaching number one on the Dutch Top 40. Their second album"},{"n":76,"year":1991,"ar":"Crowded House","ti":"Woodface","cv":"https://dn721208.ca.archive.org/0/items/mbid-4ef05565-c3ed-3ab2-8330-679a1c293e13/mbid-4ef05565-c3ed-3ab2-8330-679a1c293e13-23737557295.jpg","rt":0.0,"sp":"","yt":"kM_rJt8CMFo","gen":["alternative rock","pop rock","Rock","Pop","Alternative Rock"],"hb":[],"da":"“Woodface” is the third studio album by Crowded House. The album was produced by Mitchell Froom and Neil Finn and was released by Capitol Records in July 1991. It features five singles: \"Chocolate Cake\", \"Fall at Your Feet\", \"It's Only Natural\", \"Weather with You\", and \"Four Seasons in One Day\". Woodface was a major hit in Australia and New Zealand as well as giving the band their first top ten hit album in the UK. It was listed at No. 3 in the book 100 Best Australian Albums in October 2010. It was voted number 80 in the third edition .","dar":"Crowded House are a rock group formed in 1985 in Melbourne, Australia and led by New Zealand musician and singer-songwriter Neil Finn. The band were originally active from 1986 to 1996 before deciding to split up. In 2007, the band reunited to record and tour again.\n\nNeil Finn and Paul Hester decided to form a new band during the Split Enz farewell tour 'Enz with a Bang'. Nick Seymour approached Finn during the after party for the Melbourne show and asked if he could try out for this new band."},{"n":81,"year":1991,"ar":"Primal Scream","ti":"Screamadelica","cv":"https://dn710702.ca.archive.org/0/items/mbid-3539ac79-92c2-3522-89c7-783c42625408/mbid-3539ac79-92c2-3522-89c7-783c42625408-4522124571.jpg","rt":0.0,"sp":"","yt":"Zjnf8mQ6BvM","gen":["alternative rock","dance","acid house","alternative dance","house","madchester"],"hb":[],"da":"Screamadelica is a 1991 album by Primal Scream and was their first to be a commercial success. In 1998 Q magazine readers voted it the 27th greatest album of all time. The album was a massive departure from the band's early indie rock sound, drawing inspiration from the house music scene (and associated drugs) that was becoming popular at the time of its production. The band enlisted house DJs Andrew Weatherall and Terry Farley on producing duties, although the album also contained a wide range of other influences including gospel and dub. The album's title track did not appear on .","dar":"Primal Scream is an alternative rock band from Glasgow, Scotland, originally formed in 1982 by Bobby Gillespie and Jim Beattie. The current lineup include Bobby Gillespie (vocals; former The Wake bassist and The Jesus & Mary Chain drummer), Andrew Innes (guitars), Simone Butler (bass) and Darrin Mooney (drums). Other important members were Robert \"Throb\" Young (guitars from 1985 to 2006), Gary \"Mani\" Mounfield (bass from 1996 to 2011; also former The Stone Roses bassist) and Martin Duffy (keyboards from 1989 until his death in 2022)."},{"n":85,"year":1991,"ar":"The Tragically Hip","ti":"Road Apples","cv":"https://dn721304.ca.archive.org/0/items/mbid-e51afa51-9f7d-4adc-aece-fae3a5be3c43/mbid-e51afa51-9f7d-4adc-aece-fae3a5be3c43-5312705242.jpg","rt":0.0,"sp":"","yt":"YQmaSIZIumw","gen":["alternative rock","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"The Tragically Hip's infectious songs, catchy melodies, inspired lyrics, and solid musicianship have secured their place as the kings of rock in Canada. Formed in the early '80s in Kingston, Ontario, they are a five-piece group of friends: Gordon Downie (primary lyricist and lead vocalist (February 6, 1963-October 17,2017), Paul Langlois and Rob Baker (guitars), Gord Sinclair (bass) and Johnny Fay (drums). For thirty years, The Tragically Hip has"},{"n":109,"year":1991,"ar":"Teenage Fanclub","ti":"Bandwagonesque","cv":"https://dn710706.ca.archive.org/0/items/mbid-b597adbc-71ab-44a1-b5a0-12c4ad252894/mbid-b597adbc-71ab-44a1-b5a0-12c4ad252894-11913142700.jpg","rt":0.0,"sp":"","yt":"rqYibZeafg8","gen":["alternative rock","indie rock","power pop","jangle pop","rock","Pop"],"hb":[],"da":"'Bandwagonesque' is the third album by Scottish alternative rock band Teenage Fanclub, released in November 1991 on Creation Records. The album gave the band substantial US success when the single 'Star Sign' reached number four on the Billboard Modern Rock Tracks chart, becoming their biggest hit in that country, with \"What You Do to Me\" and \"The Concept\" also becoming top 20 hits on that chart. 'Bandwagonesque' was voted 'album of the year' for 1991 by American music magazine Spin, famously beating Nirvana's landmark album 'Nevermind' and My Bloody Valentine's epic 'Loveless'. .","dar":"Teenage Fanclub is a Scottish power pop band formed in Bellshill, Scotland in 1989 and formerly known as the Boy Hairdressers. They have two generally known humorous nicknames: \"The Fannies\" and \"The Bellshill Beach Boys\". They're revered for their devotion to chiming, The Byrds-esque guitars and harmonic vocals. The band is perhaps best known for the 1991 masterpiece 'Bandwagonesque', which presaged the later Britpop and indie pop movements, and"},{"n":122,"year":1991,"ar":"Swervedriver","ti":"Raise","cv":"https://dn710808.ca.archive.org/0/items/mbid-ddb3ca7b-fe4e-41a7-b38c-20a10900672a/mbid-ddb3ca7b-fe4e-41a7-b38c-20a10900672a-6515733451.jpg","rt":0.0,"sp":"","yt":"O8n5pEQRm84","gen":["alternative rock","indie rock","shoegaze","Alternative Rock"],"hb":[],"da":"Raise is the debut studio album by English alternative rock band Swervedriver. It was released on 30 September 1991 by Creation Records. The album contained six new songs; \"Son of Mustang Ford\", \"Rave Down\" and \"Sandblasted\" had all appeared on earlier EPs and singles released by the band between 1990 and 1991. The album received very positive reviews. Early pressings of the UK LP came with a free 7\", which included the instrumental tracks \"Surf Twang\" (a 4-track version of \"Last Train to Satansville\") and \"Deep Twang\" (a 4-track version of \"Deep Seat\"). The album was reissued as a remastered .","dar":"Swervedriver is a British shoegaze band, however their heavier rock & roll style also related them to the grunge genre coming from the U.S. Pacific Northwest. Some music writers considered them to be Britain's answer to this sound. Regardless of labels, the band's mix of storming and swirling guitar experimentation often crossed into psychedelia, coupled with mystical lyrics that often praised the nihilism of sports cars, racing and the open road."},{"n":148,"year":1991,"ar":"Toad The Wet Sprocket","ti":"Fear","cv":"https://dn710305.ca.archive.org/0/items/mbid-6b12a43f-840e-4923-a1aa-b015790c5383/mbid-6b12a43f-840e-4923-a1aa-b015790c5383-43664852723.png","rt":0.0,"sp":"","yt":"HRDMJ4E7dW8","gen":["alternative rock","Pop","Alternative Rock"],"hb":[],"da":"Not only did Fear yield the Top 40 hit \"All I Want,\" but it also marked the emergence of a more refined Toad the Wet Sprocket. This album is full of smart and catchy songs brought to life by four great musicians. Be it a tale of boyhood mischief (\"Is It for Me\") or a question of faith (\"Pray Your Gods\"), Glen Phillips shows himself to be one of the most literate and complex singer/songwriters around, layers of hidden subtext pouring from both his pen and voice. The rest of the quartet -- drummer Randy Guss, bassist/keyboardist Dean Dinning, and .","dar":"Toad the Wet Sprocket is an American alternative rock band formed in Santa Barbara, California, in 1986. The original lineup consisted of vocalist and guitarist Glen Phillips, guitarist Todd Nichols, bassist Dean Dinning, and drummer Randy Guss. Guss stopped touring with the band in 2017 and officially departed in 2020. The band achieved commercial success in the 1990s with singles including \"Walk on the Ocean\", \"All I Want\", \"Something's Always Wrong\", \"Fall Down\", and \"Good Intentions\"."},{"n":27,"year":1991,"ar":"Tori Amos","ti":"Little Earthquakes","cv":"https://dn721809.ca.archive.org/0/items/mbid-d8074ae7-e163-4e20-b711-40b759198dfd/mbid-d8074ae7-e163-4e20-b711-40b759198dfd-38333421999.jpg","rt":0.0,"sp":"","yt":"dGBwsC0yJ8o","gen":["alternative rock","oldest release #1","woman on cover","Pop","Alternative Rock"],"hb":[],"da":"Little Earthquakes is the debut solo album of singer-songwriter Tori Amos, featuring the singles Silent All These Years, China, Winter and Crucify. The album was first released in the UK on January 13, 1992. Following the dissolution of her synth-pop band Y Kant Tori Read, Amos composed 12 songs, recorded them at Capitol Records in Los Angeles with Davitt Sigerson producing, and in June 1990 submitted them for copyright. Amos approached Atlantic Records in December 1990 with a 10-track demo tape, some being newer songs but mostly ones from June. The track listing consisted of Russia (later to become Take .","dar":"Tori Amos (born Myra Ellen Amos; August 22, 1963) is an American singer-songwriter and pianist. She is classically trained and has a mezzo-soprano vocal range. Amos began composing instrumental piano pieces at a young age and won a full scholarship to the Peabody Institute at Johns Hopkins University when she was five, becoming the youngest person admitted. She left the institute at eleven after her scholarship was discontinued.\n\nIn the 1980s, Amos"},{"n":10,"year":1990,"ar":"Cocteau Twins","ti":"Heaven or Las Vegas","cv":"https://dn710700.ca.archive.org/0/items/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e/mbid-f96df5d2-4ef9-3ef4-a4be-c743802b6f1e-7946180530.jpg","rt":0.0,"sp":"","yt":"PbbUeLkZt74","gen":["alternative rock","shoegaze","dream pop","ethereal wave","ambient pop","Punk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","sdecandelario","verygooood"],"da":"Heaven or Las Vegas is the sixth album by Scottish band Cocteau Twins, their last for the music label 4AD. In terms of chart positions, it was the most successful Cocteau Twins album, reaching No. 7 in the UK. Despite 4AD president Ivo Watts-Russell proclaiming it one of the best-ever releases on his label, he released the group from their contract at the end of 1990 because his relationship with the band had soured. The album is noteworthy for the musical evolution that the band displayed at the time. The lyrics of vocalist Elizabeth Fraser were more intelligible; many concerned .","dar":"Cocteau Twins was a Scottish rock band active from 1979 to 1997. The group was formed in Grangemouth, Scotland, by Robin Guthrie (guitar, drum machine) and Will Heggie (bass), with Elizabeth Fraser (vocals) joining in 1981. In 1983, Heggie was replaced by multi-instrumentalist Simon Raymonde, completing the lineup most associated with the band’s career. Cocteau Twins became known for their ethereal, heavily layered sound and Fraser’s distinctive soprano vocal style, often featuring lyrics that avoid conventional language."},{"n":12,"year":1990,"ar":"Primus","ti":"Frizzle Fry","cv":"https://dn721901.ca.archive.org/0/items/mbid-3330b3f4-06ff-3beb-9d89-d40294d8563b/mbid-3330b3f4-06ff-3beb-9d89-d40294d8563b-27029909293.jpg","rt":0.0,"sp":"","yt":"-zn5i_1xTlY","gen":["alternative rock","heavy metal","alternative metal","funk metal","Alternative Rock"],"hb":["EliasJ72","Nubis84"],"da":"Frizzle Fry is the first studio album recorded by the band Primus. Suck on This, a live album, preceded its release. Released in 1990 on Caroline Records, it features the band's first single and minor radio hit \"John the Fisherman\". It was remastered in 2002, after the original had been out of print for years, and was released on Prawn Song Records. The remaster includes an extra track, named \"Hello Skinny/Constantinople\", a cover of the tracks \"Hello Skinny\" and \"Constantinople\" by The Residents. \"You Can't Kill Michael Malloy\" is an excerpt from the Spent Poets song of the same name. .","dar":"Primus is a San Francisco-based alternative rock band formed in the mid-1980s by bassist Les Claypool and guitarist Todd Huth. Les (vocals and bass guitar) has been the only constant member. They have had two guitar players (although Larry has held onto the role for the past 30 years) and many different drummers (although Tim Alexander, Bryan Mantia and Jay Lane were the only ones who recorded with the band) in the past. \n\nTheir music has proven difficult to define; while usually considered by critics to be funk metal or alternative metal"},{"n":56,"year":1990,"ar":"Killing Joke","ti":"Extremities, Dirt & Various Repressed Emotions","cv":"https://dn711308.ca.archive.org/0/items/mbid-93d6d597-0288-3733-86be-d83524749934/mbid-93d6d597-0288-3733-86be-d83524749934-9578260118.jpg","rt":0.0,"sp":"","yt":"0qbGX8EIFEk","gen":["alternative rock","post-punk","industrial","industrial rock","Metal","Punk"],"hb":[],"da":null,"dar":"Killing Joke is an English post-punk group which formed in October 1978 in Notting Hill, London, England. Founding members Jaz Coleman (vocals, keyboards) and Geordie Walker (guitars) have been the only constant members, with Geordie having died on the 26th of November 2023 in Prague following a stroke 2 days earlier.\n\nA key influence on industrial rock, their early music was described by critics Stephen Thomas Erlewine and John Dougan as well as industrial metal and \"quasi-metal"},{"n":63,"year":1990,"ar":"They Might Be Giants","ti":"Flood","cv":"https://dn710600.ca.archive.org/0/items/mbid-cbae1727-1126-4281-8b0e-36f039bff450/mbid-cbae1727-1126-4281-8b0e-36f039bff450-13886730763.jpg","rt":0.0,"sp":"","yt":"ki1niksBxJE","gen":["alternative rock","blues","comedy rock","rock","Punk","Alternative Rock"],"hb":[],"da":"Flood is They Might Be Giants' third studio album, released in 1990. It was the band's first release on a major label; Elektra Records. Following the success of their second album, Lincoln, the band made the move from the independent label Bar/None Records. .","dar":"They Might Be Giants (TMBG) is an American alternative rock band formed in 1982 in Brooklyn, New York, United States by John Flansburgh (vocals, guitar) and John Linnell (vocals, keyboards, accordion, bass clarinet). During TMBG's early years Flansburgh and Linnell were frequently accompanied by a drum machine. In the early nineties, TMBG became a full band. Currently, the members of TMBG are Flansburgh, Linnell, Marty Beller, Dan Miller, and Danny Weinkauf."},{"n":75,"year":1990,"ar":"Jellyfish","ti":"Bellybutton","cv":"https://ia601006.us.archive.org/27/items/mbid-f659cee3-e3de-4646-95f2-0dfedf01c359/mbid-f659cee3-e3de-4646-95f2-0dfedf01c359-16457270855.jpg","rt":0.0,"sp":"","yt":"dTvNjPFjlNE","gen":["alternative rock","power pop","Rock","Pop"],"hb":[],"da":null,"dar":"Jellyfish were a short-lived  power pop band from San Francisco. The core members were drummer/singer/songwriter Andy Sturmer, keyboard player/multi-instrumentalist Roger Joseph Manning Jr., and guitarist/songwriter/vocalist Jason Falkner.\nSturmer and Roger Manning formed Jellyfish after the break-up of their previous band, Beatnik Beatch led by bassist / singer Chris Ketner. Prior to joining, Falkner had written and performed on songs from acclaimed Paisley Underground band The Three O'Clock's major-label debut, Vermillion."},{"n":133,"year":1990,"ar":"Sonic Youth","ti":"Goo","cv":"https://ia800309.us.archive.org/13/items/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060/mbid-3e095e00-39aa-4f8f-be4b-cf8da2661060-13523354678.jpg","rt":0.0,"sp":"","yt":"k_1rqDKM_0E","gen":["experimental rock","alternative rock","noise rock","no wave","new wave","indie rock"],"hb":[],"da":"Goo is the sixth full-length studio album by American alternative rock band Sonic Youth, released on June 26, 1990 by DGC Records. For this album, the band sought to expand upon its trademark alternating guitar arrangements and the layered sound of their previous album Daydream Nation (1988) with songwriting on that was more topical than past works, exploring themes of female empowerment and pop culture. Coming off the success of Daydream Nation, Nick Sansano returned to engineer Goo, but veteran producer Ron Saint Germain was chosen by Sonic Youth to finish mixing the album following Sansano's dismissal. Goo was a .","dar":"Sonic Youth was an influential American experimental rock band formed in New York City, New York, United States in 1981 and are currently on an indefinite hiatus. The last lineup consisted of Thurston Moore (vocals,  guitar), Kim Gordon (vocals, bass, guitar), Lee Ranaldo (vocals and guitar), Steve Shelley (drums) and Mark Ibold (bass).\n\nIn their early career, Sonic Youth was associated with the No Wave art and music scene in New York City. Part of the first wave of American noise rock groups"},{"n":156,"year":1990,"ar":"Cop Shoot Cop","ti":"Consumer Revolt","cv":"https://dn711204.ca.archive.org/0/items/mbid-efff648d-2083-42df-b081-8d610d6d7e9e/mbid-efff648d-2083-42df-b081-8d610d6d7e9e-22855152309.png","rt":0.0,"sp":"","yt":"O03w6HDAod0","gen":["alternative rock","noise rock","punk","indie rock","industrial rock","Rock"],"hb":["Nubis84"],"da":null,"dar":"Cop Shoot Cop was a rock music group founded in New York, NY in 1987 and disbanded in 1996.\n\nThey were frequently classified as industrial rock, but were often quite different from many bands so dubbed. Tod A.'s lyrics were clever, snide and evocative (Art Black and David Sprague suggest that \"Black humor beats black metal any day\") and their \"weirdly catchy\" music which drew \"on hot jazz and swing as much as clanging rock, emphasizing the group's stand-apart attitude.\""},{"n":162,"year":1990,"ar":"Mazzy Star","ti":"She Hangs Brightly","cv":"https://dn710905.ca.archive.org/0/items/mbid-d277c19d-71e9-4d70-892b-7a9fb1ff0b78/mbid-d277c19d-71e9-4d70-892b-7a9fb1ff0b78-17361517341.jpg","rt":0.0,"sp":"","yt":"5swItt732EM","gen":["alternative rock","dream pop","alternative country","Rock","Pop"],"hb":["Frikomid","GabredMared","Nubis84","Rocky_stereo","sdecandelario","verygooood"],"da":"She Hangs Brightly is the debut studio album by American alternative rock band Mazzy Star. It was released on May 21, 1990, by Rough Trade Records and re-released by Capitol Records later in the year. \"Blue Flower\" was released as a single and reached number 29 on the Billboard Alternative Songs chart. Four years later, \"Halah\" reached number 19 on the same chart after the success of \"Fade Into You\". The album cover is a shot of the interior of Hôtel Tassel in Brussels. .","dar":"Mazzy Star is an American alternative rock band formed in 1988 in Santa Monica, California, from remnants of the group Opal. Founding member David Roback's friend Hope Sandoval became the group's vocalist when Kendra Smith left Opal.\n\nMazzy Star is best known for the song \"Fade Into You\", which brought the band some success in the mid-1990s and was the group's biggest mainstream hit, earning extensive exposure on MTV, VH1 and radio airplay. Roback and Sandoval were the creative center of the band"},{"n":179,"year":1990,"ar":"Pixies","ti":"Bossanova","cv":"https://ia601509.us.archive.org/23/items/mbid-7cc0bcbf-eb04-479c-bbf5-ca237021c492/mbid-7cc0bcbf-eb04-479c-bbf5-ca237021c492-33166933465.png","rt":0.0,"sp":"","yt":"V27ISDEbZ_Y","gen":["alternative rock","indie rock","surf rock","Rock","Alternative Rock"],"hb":[],"da":"Bossanova is the third album by the American alternative rock band Pixies, released in August 1990 on the English independent record label 4AD. All of Bossanova's original material was written by the band's frontman Black Francis; it marked the point where his artistic control over the band became absolute. The album's sound, inspired by surf and space rock, complements its lyrical focus on outer space, which references subjects such as aliens and unidentified flying objects. Because of 4AD's independent status, major label Elektra Records handled distribution in the United States; however, Bossanova only reached #70 on the Billboard 200. It .","dar":"Pixies is an American alternative rock band which formed in Boston, Massachusetts, United States in 1986. The band consists of Charles (Black Francis) Thompson IV (vocals, guitar; also known as ''Frank Black''), Joey Santiago (lead guitar),   David Lovering (drums) and Emma Richardson (bass, vocals). Until 2013, the band also featured  Kim Deal on bass and vocals. From 2016 until 2024 the band also featured Paz Lechantin on bass and vocals.   The band officially split in 1993  and reunited in 2004."},{"n":193,"year":1990,"ar":"Blues Traveler","ti":"Blues Traveler","cv":"https://dn721607.ca.archive.org/0/items/mbid-2ee91bd5-80ab-4450-80a3-3cbf2645dd24/mbid-2ee91bd5-80ab-4450-80a3-3cbf2645dd24-31536636542.jpg","rt":0.0,"sp":"","yt":"CWeemCwFtQ4","gen":["blues rock","alternative rock","Rock"],"hb":[],"da":null,"dar":"Blues Traveler is a rock band, formed in Princeton, New Jersey in 1987. The band's music covers a variety of genres, including blues rock, psychedelic rock, folk rock, soul, and Southern rock. \n   Currently, the group comprises singer and harmonica player John Popper, guitarist Chan Kinchla, drummer Brendan Hill, bassist Tad Kinchla and keyboardist Ben Wilson. Tad Kinchla and Ben Wilson joined the band following the death of original bassist Bobby Sheehan in 1999."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
