<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

r states that .","dar":"Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass."},{"n":13,"year":2019,"ar":"Weyes Blood","ti":"Titanic Rising","cv":"https://cdn2.albumoftheyear.org/600x0/album/2019/139513-titanic-rising.jpg","rt":0.0,"sp":"","yt":"gLMG0AMQn3U","gen":["baroque pop","art pop","chamber pop","indie rock","soft rock","ballad"],"hb":["Frikomid","GabredMared","Lonsonxd","Rocky_stereo","alberto_gu","paqueradejere","verygooood"],"da":"\"Titanic Rising\" is the fourth studio album by American musician Weyes Blood, released on April 5, 2019 by Sub Pop. On January 17, 2019, Weyes Blood released the album's first single, \"Andromeda\". A second single, \"Everyday\", was released along with an accompanying self-directed music video on February 12, 2019. The album received universal acclaim from critics, garnering an aggregate score of 91 out of 100 on Metacritic praising its powerful ambient and vulnerable lyrics. Recording Following the release of Front Row Seat to Earth, Natalie Mering signed with Sub Pop in 2017. Titanic Rising was recorded in 2018 over a .","dar":"Weyes Blood (aka Weyes Bluhd and Weyes Blood and the Dark Juices) is Natalie Mering, a musician from Philadelphia, PA, United States, and ex Jackie-O Motherfucker bass player.\n\nHer solo work is raga-inspired, psychedelic music, using guitar strings as basic sound material and sound effects as an instrument. Home-made one string bass stick used to produce low bell-like sounds out of an horror movie. Most tracks have vocals, usually strangely deformed through effect pedals."},{"n":16,"year":2019,"ar":"Purple Mountains","ti":"Purple Mountains","cv":"https://cdn2.albumoftheyear.org/600x0/album/2019/155745-purple-mountains.jpg","rt":0.0,"sp":"","yt":"IoyA5i-xuQo","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":[],"da":"In 2019, ten years after retiring Silver Jews and retreating from public life, David Berman triumphantly returned as Purple Mountains .","dar":"Purple Mountains was the creation of American musician, singer, poet and cartoonist David Cloud Berman (born David Craig Berman on 4 January 1967; died August 7, 2019). \n\nIn 2019, 10 years since retiring Silver Jews and retreating from public life, Berman returned as Purple Mountains with the eponymous album released on 12 July 2019 on the Drag City label.\n\nBerman is best remembered for his work with indie-rock band the Silver Jews. Although the band primarily existed as a recording project for most of its existence"},{"n":69,"year":2018,"ar":"Low","ti":"Double Negative","cv":"https://cdn2.albumoftheyear.org/600x0/album/113645-double-negative.jpg","rt":0.0,"sp":"","yt":"8bNQ1kWA3CU","gen":["indie rock","post-industrial","dark ambient","ambient pop","glitch pop","glitch"],"hb":[],"da":"Double Negative is the twelfth studio album by Low, released on September 14, 2018. .","dar":"There are at least seven artists with this name:\n1) Low is an American indie rock/slowcore band from Duluth.\n2) Low is a German industrial punk rock band from Berlin.\n3)  Low is a Danish rapper.\n4) Low is a Spanish hip hop artist.\n5)  low is a doujin artist.\n6) Low (White Leaves)is a Japanese artist.\n7) Low is a member of CLOSER.\n\n1)  Low was a slowcore band formed in Duluth, Minnesota, United States in 1993, by Alan Sparhawk (guitar and vocals), Mimi Parker (drums and vocals) and original bassist John Nichols (bass guitar)."},{"n":6,"year":2017,"ar":"Gang of Youths","ti":"Go Farther in Lightness","cv":"https://dn711106.ca.archive.org/0/items/mbid-05a13538-a9c8-45cc-87b1-6fe51bce08f7/mbid-05a13538-a9c8-45cc-87b1-6fe51bce08f7-20244359129.jpg","rt":0.0,"sp":"","yt":"quv_XFtVJ3A","gen":["alternative rock","post-punk","indie rock","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Gang of Youths are an Australian rock band based out of Sydney, New South Wales. The band is the brainchild of vocalist/guitarist/lyricist David Le'aupepe, who formed the band in 2012. Their debut album, The Positions, was released in 2015."},{"n":147,"year":2017,"ar":"Perfume Genius","ti":"No Shape","cv":"https://cdn2.albumoftheyear.org/600x0/album/2017/75587-no-shape.jpg","rt":0.0,"sp":"","yt":"U1sffNdzjPU","gen":["art rock","pop rock","indie rock","Alternative Rock"],"hb":[],"da":"No Shape is the fourth studio album by Perfume Genius. It was released on May, 5 2017 and produced by Blake Mills, who has worked with Ed Sheeran, Alabama Shakes, and John Legend. The album received critical acclaim and was preceded by the release of the lead single, “Slip Away” and promotional single “Go Ahead”. .","dar":"Perfume Genius is the alias of singer-songwriter Mike Hadreas. Born in Des Moines, Iowa,  Mike moved to Seattle when he was 6. Growing up, Hadreas was the only openly gay student at his school, and he received death threats that were ignored by the school administration. He dropped out of high school during his senior year. Two years after dropping out, he was attacked by several young men in his neighborhood. He moved to Williamsburg, Brooklyn, and worked as a doorman for a club in the East Village."},{"n":36,"year":2016,"ar":"Radiohead","ti":"A Moon Shaped Pool","cv":"https://cdn2.albumoftheyear.org/600x0/album/54767-a-moon-shaped-pool_090450.jpg","rt":0.0,"sp":"","yt":"0506r4BGs7M","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","ambient pop"],"hb":[],"da":"A Moon Shaped Pool is the ninth studio album by the English rock band Radiohead, released as a download on 8 May 2016. The album's first two singles were \"Burn the Witch\" and \"Daydreaming\". CD and LP editions will be released by XL Recordings on 17 June 2016, followed in September by a \"special edition\" containing additional artwork and two bonus tracks. The album was produced by Nigel Godrich. Radiohead began work on A Moon Shaped Pool intermittently after finishing the 2012 tour for their previous album, 2011's The King of Limbs. Several songs on the album date back to .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":60,"year":2016,"ar":"Car Seat Headrest","ti":"Teens of Denial","cv":"https://cdn2.albumoftheyear.org/600x0/album/52315-teens-of-denial_172003.jpg","rt":0.0,"sp":"","yt":"FCBBXQBN8ow","gen":["indie rock","power pop","Alternative Rock"],"hb":[],"da":"With Teens of Denial, his first real “studio” album with an actual band, Will Toledo moves from bedroom pop to something approaching classic rock grandeur and huge (if detailed and personal) narrative ambitions, with nods to the Cars, Pavement, Jonathan Richman, Wire, and William Onyeabor. Teens of Denial refracts Toledo’s particular, personal story of one difficult year through cultural touchstones such as the biography of Frank Sinatra, the evolution of the Me Generation as seen in Mad Men and elsewhere, plus elements of eastern and western theology. The whole thing flaunts a kind of conceptual, lyrical, and musical ambition that .","dar":"Car Seat Headrest is an American indie rock band formed in Leesburg, Virginia, and currently located in Seattle, Washington. The band consists of Will Toledo (vocals, guitar, piano, and synthesizers), Ethan Ives (guitar, bass, backing vocals), Seth Dalby (bass), and Andrew Katz (drums, percussion).\n\nBeginning as a solo recording project by Toledo in 2010, Car Seat Headrest self-released 12 albums on the music platform Bandcamp, before signing to Matador Records in 2015. Car Seat Headrest would begin touring as a full band the following year."},{"n":101,"year":2015,"ar":"Father John Misty","ti":"I Love You, Honeybear","cv":"https://cdn2.albumoftheyear.org/600x0/album/2015/22669-i-love-you-honeybear.jpg","rt":0.0,"sp":"","yt":"caMfvhKIgBo","gen":["folk rock","alternative rock","indie rock","indie folk","Rock","Alternative Rock"],"hb":["Frikomid","sdecandelario"],"da":"I Love You, Honeybear is the second studio album by American folk musician Josh Tillman under his pseudonym Father John Misty. It was released on February 9, 2015, in the United Kingdom and Europe by Bella Union, and in the rest of the world on February 10, 2015, by Sub Pop. Produced by both Tillman and Jonathan Wilson, this is Tillman's second studio album since his departure from Fleet Foxes. The album was also mixed by Phil Ek, and mastered by Greg Calbi at Sterling Sound. According to Tillman, the release is a concept album. I Love You, Honeybear received .","dar":"Father John Misty, or J. Tillman, has been recording/releasing solo albums since 2003. Josh also played drums for Seattle’s Fleet Foxes from 2008-2011.\n\nOn January 31st 2012, he released the first single, 'Hollywood Forever Cemetery Sings', for his debut album under the Father John Misty moniker, \"Fear Fun\". The Phil Ek mixed and Jonathan Wilson produced LP was released on May 1st 2012 through Sub Pop (U.S.) and Bella Union (U.K.)\n\nTo date, Father John Misty has released 6 studio albums: Fear Fun (2012)"},{"n":137,"year":2015,"ar":"Hop Along","ti":"Painted Shut","cv":"https://cdn2.albumoftheyear.org/600x0/album/2015/29100-painted-shut.jpg","rt":0.0,"sp":"","yt":"9gTRzFmwy-8","gen":["folk","indie rock","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Hop Along are an American rock band from Philadelphia, Pennsylvania, formerly known as Hop Along, Queen Ansleis. \n\nThe band began as an acoustic freak-folk solo project Hop Along, Queen Ansleis in 2004, during Frances Quinlan's senior year in high school. The album Freshman Year was released in the summer of 2005. Three years later, in 2008, drummer Mark Quinlan (Frances Quinlan's brother) joined the project, followed by bassist Tyler Long in 2009."},{"n":54,"year":2014,"ar":"Bent Knee","ti":"Shiny Eyed Babies","cv":"https://dn711004.ca.archive.org/0/items/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0-12550985966.jpg","rt":0.0,"sp":"","yt":"o2aBQclnk0M","gen":["experimental rock","avant-garde","alternative rock","synth-pop","indie rock","Rock"],"hb":[],"da":null,"dar":"Bent Knee is an American art rock band formed in Boston, Massachusetts in 2009. The band performs in multiple genres and draws from multiple influences, including pop, industrial rock, hip hop, and avant-garde. The band is known for unpredictable dynamic contrast and the wide vocal range of singer Courtney Swain."},{"n":118,"year":2012,"ar":"Tame Impala","ti":"Lonerism","cv":"https://cdn2.albumoftheyear.org/600x0/album/3879-lonerism_113038.jpg","rt":0.0,"sp":"","yt":"wPUEO9mlNkI","gen":["psychedelic rock","psychedelic pop","indie rock","neo-psychedelia","shoegaze","space rock revival"],"hb":[],"da":"Lonerism is the second album by Australian psychedelic rock band Tame Impala, released by Modular Recordings on 5 October 2012. Like their previous album Innerspeaker, most of the recording was undertaken by Kevin Parker. Kevin Parker started writing and recording new material for Lonerism almost immediately after releasing Innerspeaker, saying \"I started writing songs straight after Innerspeaker, but I told myself I wouldn't get hung up with the pressure, so I kinda pretended they were for some other weird project that wasn't going to have as much consequence\". While Innerspeaker was recorded in a very structured manner with a designated .","dar":"Tame Impala is the psychedelic music project of Australian multi-instrumentalist Kevin Parker, blending rock, pop, and electronic sounds with lush production and introspective lyrics. Their discography includes Innerspeaker (2010), Lonerism (2012), Currents (2015), The Slow Rush (2020), and Deadbeat (2025). As a touring act, Tame Impala consists of Parker (guitar, vocals), Dominic Simper (guitar, synthesiser), Jay Watson (synthesiser, vocals, guitar), Cam Avery (bass guitar, vocals), and Julien Barbagallo (drums, vocals)."},{"n":191,"year":2012,"ar":"Beach House","ti":"Bloom","cv":"https://dn721808.ca.archive.org/0/items/mbid-37cfdc1a-2a7a-4e5c-b8e3-83e2b0e8093b/mbid-37cfdc1a-2a7a-4e5c-b8e3-83e2b0e8093b-40091714027.jpg","rt":0.0,"sp":"","yt":"-3frA_rj918","gen":["indie rock","shoegaze","dream pop","indie pop","Pop","Alternative Rock"],"hb":[],"da":"Bloom is the fourth studio album Beach House. It was released on May 15, 2012, through Sub Pop Records. The entire album was arranged and performed by the duo, with Daniel Franz handling live drums and percussion, and lead vocalist Victoria Legrand handling the songwriting on all of the tracks. Alongside the duo, the album was produced by Chris Coady, who works with them for the second time, following his contributions on their third studio album, Teen Dream (2010), which had been considered as their breakthrough album. The album was written in a period of two years of touring and .","dar":"Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":43,"year":2011,"ar":"Fleet Foxes","ti":"Helplessness Blues","cv":"https://cdn2.albumoftheyear.org/600x0/album/helplessness-blues-1.jpg","rt":0.0,"sp":"","yt":"NwfQDYKd4gE","gen":["folk rock","indie rock","indie folk"],"hb":["Frikomid","Nubis84"],"da":"Helplessness Blues is the second studio album by Seattle-based folk band Fleet Foxes (release: May 02, 2011 on Bella Union) - leaked almost six weeks prior to the release). Initially, Robin Pecknold had stated he would like the album to be released in 2009; however, the band's touring schedule had caused them some setbacks. They got together to rehearse new songs in February 2009 in a rented house outside Seattle, but the sessions were mostly scrapped. As a result of those wasted sessions, the band lost $60,000 of their own money. After their tour in support of the 2008 releases .","dar":"Fleet Foxes is an American indie folk band formed in Seattle, Washington in 2006. The band consists of Robin Pecknold (vocals, guitar), Skyler Skjelset (guitar, mandolin, backing vocals), Casey Wescott (keyboards, mandolin, backing vocals), Christian Wargo (bass, guitar, backing vocals) and Morgan Henderson (upright bass, guitar, woodwinds, violin, percussion, saxophone).\n\nLed by singer-songwriter Robin Pecknold, the band came to prominence in 2008 with the release of their second EP Sun Giant and their debut album Fleet Foxes on Sub Pop."},{"n":105,"year":2011,"ar":"Destroyer","ti":"Kaputt","cv":"https://cdn2.albumoftheyear.org/600x0/album/2009-kaputt_053314.jpg","rt":0.0,"sp":"","yt":"qe4sbwI41-E","gen":["art rock","indie rock","indie pop","sophisti-pop"],"hb":[],"da":"Kaputt is the ninth album by Canadian indie rock band Destroyer. It was released on January 25, 2011 by Merge Records and Dead Oceans Records. The album was leaked towards the end of 2010. The vinyl edition of the album features bonus material on side three written largely by frequent Destroyer collaborator Ted Bois. This material is also included in the European CD version of the album credited as 'The Laziest River'. The album was named as a shortlisted (one of 10) nominee for the 2011 Polaris Music Prize award. Kaputt received widespread acclaim from music critics upon its release. .","dar":"Destroyer is a Canadian indie rock band from Vancouver, British Columbia fronted by singer-songwriter Dan Bejar and formed in 1995. Destroyer songs are characterized by abstract, poetic lyrics and idiosyncratic vocals. The band's discography draws on a variety of musical influences, resulting in albums that can sound markedly distinct from one another; in Bejar's words, \"That's kind of my goal: to start from scratch every time.\"\n\n1996–2001\nWe'll Build Them a Golden Bridge, Destroyer's 1996 debut, is made up of sixteen lo-fi home-recordings."},{"n":116,"year":2011,"ar":"Bon Iver","ti":"Bon Iver, Bon Iver","cv":"https://cdn2.albumoftheyear.org/600x0/album/2479-bon-iver-bon-iver_013505.jpg","rt":0.0,"sp":"","yt":"8bIALq5Wi-I","gen":["folk rock","folk","baroque pop","indie rock","indie folk"],"hb":[],"da":"The name ‘Bon Iver’ is derived from the French for ‘good winter.’ The album was recorded in Justin Vernon’s home town of Eau Claire in Wisconsin, where the temperature rarely rises above freezing in winter. The Calgary Songfacts reports that Vernon told UK newspaper The Sun naming it Bon Iver shows he’s accepting winter is a big part of the album. .","dar":"Bon Iver is a Grammy Award winning  folk band from Eau Claire, Wisconsin, United States, and one of Justin Vernon's current and most notable music projects to date. The band also consists of Mike Noyce, Sean Carey and Matt MacCaughan. \n\nThe name 'Bon Iver' (pronounced \"bon ee-VAIR\") is a play on the French phrase 'bon hiver' meaning 'good winter'. Vernon independently released Bon Iver's debut album For Emma, Forever Ago in 2007, most of which was recorded during a four-month stay in a remote cabin in Wisconsin."},{"n":124,"year":2011,"ar":"St. Vincent","ti":"Strange Mercy","cv":"https://cdn2.albumoftheyear.org/600x0/album/2567-strange-mercy_184357.jpg","rt":0.0,"sp":"","yt":"5jv4lgFrL7U","gen":["art rock","baroque pop","indie rock","indie pop"],"hb":["Frikomid","paqueradejere"],"da":"Strange Mercy is the third studio album by musician St. Vincent. The album's cover art was designed by St. Vincent and was photographed by Tina Tyrell. The album peaked at #19 on the Billboard 200, making it St. Vincent's highest charting album yet, only to be surpassed by her next solo album, St. Vincent. In addition, Strange Mercy also received significant critical acclaim. .","dar":"A pseudonym of Annie Clark (b. 28 Sept 1982), a USA multi-instrumentalist singer-songwriter. She was a member of The Polyphonic Spree and Sufjan Stevens' touring band. Born in Tulsa, Oklahoma, she began playing the guitar at the age of 12 and as a teenager worked as the tour manager for her uncle's band Tuck & Patti. She grew up in Dallas and attended Lake Highlands High School, graduating in 2001. Following this, she went on to attend Berklee College of Music, dropping out 3 years later."},{"n":167,"year":2011,"ar":"PJ Harvey","ti":"Let England Shake","cv":"https://cdn2.albumoftheyear.org/600x0/album/2087-let-england-shake_082511.jpg","rt":0.0,"sp":"","yt":"IaCsIvDLnBg","gen":["alternative rock","art rock","art pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","Nubis84","paqueradejere","sdecandelario"],"da":"Let England Shake is the eighth studio album by PJ Harvey. It was released on 14 February 2011 in the UK, and on 15 February 2011 in the US. Work on it began around the time of White Chalk's release in 2007, though it is a departure from the piano-driven introspective collection of that album. It was written between late 2007 and 2008, and recorded over a five-week period. .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":6,"year":2010,"ar":"The National","ti":"High Violet","cv":"https://cdn2.albumoftheyear.org/600x0/album/1638-high-violet_034451.jpg","rt":0.0,"sp":"","yt":"3U-xCmXddf0","gen":["chamber pop","indie rock","post-punk revival"],"hb":[],"da":"High Violet is the fifth studio album by The National, which was released on May 10, 2010 in Europe and on May 11, 2010 in North America via 4AD. The band produced the album themselves, assisted by Peter Katis with whom they worked on their previous albums Alligator and Boxer at their own studio in Brooklyn, New York, and at Katis' Tarquin Studios in Bridgeport, Connecticut. The sculpture on the album cover was created by artist Mark Fox, and is called The Binding Force. .","dar":"The National is an American indie rock band formed in Brooklyn, New York in 1999, by friends from Cincinnati, Ohio. The band's lyrics are written and sung by Matt Berninger in a distinctive, deep baritone. The rest of the band is composed of two pairs of brothers: Aaron Dessner (guitar, bass, keyboards), Bryce Dessner (guitar), Scott Devendorf (bass, guitar) and Bryan Devendorf (drums). \n\nTheir self-titled debut album\"The National\" (Brassland 2001) was recorded and released before they had played even a single show."},{"n":51,"year":2010,"ar":"Deerhunter","ti":"Halcyon Digest","cv":"https://dn711300.ca.archive.org/0/items/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c/mbid-66d28946-e8fb-414b-b149-25d23ba3fa7c-2094844395.jpg","rt":0.0,"sp":"","yt":"Lx57to-9mGw","gen":["alternative rock","indie rock","dream pop","rock"],"hb":[],"da":"Halcyon Digest is the fourth studio album by American indie rock band Deerhunter. It was released September 28, 2010 to very enthusiastic reviews. It was the band's first album distributed exclusively by 4AD worldwide (previously 4AD only handled overseas distribution while Kranky Records handled it within the U.S) The album was self-produced with assistance from Ben Allen and was recorded at Chase Park Transduction studios in Athens, Georgia. The final track, \"He Would Have Laughed\" was recorded separately by Bradford Cox at Notown Sound in Marietta, GA and is a tribute to the late Jay Reatard. Writing on his Facebook .","dar":"Deerhunter is an American indie rock band formed in 2001 in Atlanta, Georgia, United States. The band consists of Bradford Cox (vocals, guitar, piano), Moses Archuleta (drums, synths), Lockett Pundt (guitar, organ, vocals), and Josh McKay (bass, vocals).\n\nThe group began with the ambition of fusing the lulling hypnotic states induced by ambient and minimalist music with the klang and propulsion of garage rock. The band has weathered chaotic line-up changes and the death of a member."},{"n":189,"year":2010,"ar":"Beach House","ti":"Teen Dream","cv":"https://dn710701.ca.archive.org/0/items/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8/mbid-a92f8b5e-76a7-48a8-88d0-17e67f0714c8-41237078188.png","rt":0.0,"sp":"","yt":"_4mLcQl-45Q","gen":["indie rock","dream pop","indie pop","rock"],"hb":[],"da":"Teen Dream is the third studio album by American dream pop duo Beach House. It was released on January 27, 2010 as the band's debut album on the record label Sub Pop. Internationally, the album was released by Bella Union in Europe, Mistletone Records in Australia, and Arts & Crafts in Mexico. The album was produced by the band and Chris Coady. The album received universal acclaim from music critics, who hailed it as one of the best albums of 2010. NME included it in their 2013 edition of the 500 Greatest Albums of All Time. The album was also .","dar":"Beach House is an American dream pop band originating from Baltimore, Maryland, United States. The group was formed in 2004 by Victoria Legrand  (vocals, organ), who is the niece of French composer Michel Legrand, Alex Scally (backing vocals, guitar), As of 2022, James Barone (drums, percussion, bass guitar) has been listed as the official third member of the band. Since their formation, the group has released eight studio albums: Beach House (2006)"},{"n":3,"year":2007,"ar":"Radiohead","ti":"In Rainbows","cv":"https://dn710801.ca.archive.org/0/items/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30/mbid-d4e08a8b-375d-474d-b960-9aaad7c04d30-6689244510.jpg","rt":0.0,"sp":"","yt":"Al1o33CRXsU","gen":["alternative rock","art rock","krautrock","art pop","indie rock","dream pop"],"hb":[],"da":"In Rainbows is the seventh studio album by the English alternative rock band Radiohead. It was first released on October 10, 2007 as a digital download that customers could order for whatever price they saw fit, followed by a standard CD release in most countries during the last week of 2007. The album was released in North America on January 1, 2008. In Rainbows was Radiohead's first release after the end of their contract with EMI and the end of the longest gap between studio albums in their career. \"In Rainbows\" was recorded in London, Somerset, Wiltshire, and Oxfordshire with .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":118,"year":2006,"ar":"John Mayer","ti":"Continuum","cv":"https://dn721902.ca.archive.org/0/items/mbid-763e1543-64eb-41be-87bf-4239a07a3627/mbid-763e1543-64eb-41be-87bf-4239a07a3627-29227495127.jpg","rt":0.0,"sp":"","yt":"pquX7Ya4-wE","gen":["blues rock","alternative rock","pop rock","blues","indie rock","Rock"],"hb":[],"da":"Continuum is the third studio album by American musician John Mayer, released September 12, 2006 on Columbia Records. Recording sessions for the album took place during November 2005 to September 2006 at The Village Recorder in Los Angeles, California, Avatar Studios and Right Track/Sound on Sound in New York City, and Royal Studios in Memphis, Tennessee. Production was handled primarily by Mayer and Steve Jordan. It marked a change in Mayer's musical style, and incorporated musical elements of blues and soul more heavily than in his previous work with pop-rock. The album debuted at number 2 on the U.S. Billboard .","dar":"John Clayton Mayer was born October 16, 1977, in Fairfield, Connecticut, USA, and started playing guitar at 13 after being inspired by a Stevie Ray Vaughan tape his neighbor gave him. In 1998 he moved to Atlanta, Georgia where he refined his skills and gained a following.\n\nIn 2003, he won the Grammy Award for Best Male Pop Vocal Performance for the 2002 single \"Your Body Is a Wonderland\" from the album Room for Squares.\n\nIn February 2005, he was awarded the Song of the Year Grammy for his song Daughters"},{"n":6,"year":2005,"ar":"Sufjan Stevens","ti":"Illinois","cv":"https://dn710206.ca.archive.org/0/items/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1-26865127077.jpg","rt":0.0,"sp":"","yt":"ovIh2WVhbPs","gen":["folk rock","chamber folk","baroque pop","chamber pop","indie rock","indie folk"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","verygooood"],"da":"Illinois (or \"Sufjan Stevens Invites You To: Come On Feel The Illinoise\") is the second album in the so-called 50 States Project, which later turned out to be a stunt. The album focuses on Illinois and includes some things from Sufjan’s past as well. The artwork for the album originally included Superman but was eventually replaced (or, on some albums, flat-out removed). Contrary to popular belief, this is not because DC Comics filed a cease and desist. Rather, Asthmatic Kitty’s lawyers advised against this copyright infringement and a sticker of balloons was placed over it. They had also made other .","dar":"Sufjan Stevens (Born July 1, 1975) is an American musician, songwriter, and multi-instrumentalist from Petoskey, Michigan. He is known for his lyrically focused and instrumentally rich songs that often relate to faith and family. He has enjoyed wide critical success in the United States. He is considered part of the folk revival through indie pop, but his influences are very broad, including experimental electronic music, the jazz of Vince Guaraldi, and the academic minimalism of Steve Reich and Philip Glass."},{"n":73,"year":2005,"ar":"Okkervil River","ti":"Black Sheep Boy","cv":"https://dn711008.ca.archive.org/0/items/mbid-17d85952-34a0-47f7-9276-8ef9612ca5e4/mbid-17d85952-34a0-47f7-9276-8ef9612ca5e4-21759592538.jpg","rt":0.0,"sp":"","yt":"eEJY8Ciq7gA","gen":["indie rock","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"Okkervil River is an indie/folk rock band from Austin, Texas USA.  Formed in 1998, the band takes its name from a short story by Russian author Tatyana Tolstaya. The band currently consists of Will Sheff (vocals, guitar), Will Graefe (guitar), Sarah K. Pedinotti (keyboards), Benjamin Lazar Davis (bass) and Cully Symington (drums).\n\nThe band self-released their first album, Stars Too Small to Use, which led them to the South by Southwest music festival."},{"n":180,"year":2005,"ar":"Andrew Bird","ti":"The Mysterious Production Of Eggs","cv":"https://dn710706.ca.archive.org/0/items/mbid-14ef3f91-7994-44a5-a55d-60f512ed7641/mbid-14ef3f91-7994-44a5-a55d-60f512ed7641-12985446912.jpg","rt":0.0,"sp":"","yt":"sUakffHAZh0","gen":["baroque pop","chamber pop","indie rock","neofolk","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"Andrew Bird (born July 11, 1973) is an American musician. He was born in Lake Bluff, Illinois but currently resides in the Los Angeles area. Bird is a singer, a violinist and, since 2004, a guitarist. He is also an accomplished whistler.\n\nHis early work, which echoed gypsy jazz and traditional folk, has led into his current sound, which mixes rock with more broad compositions. His years of solo song-craft have now enabled him to produce a sound that is uniquely his own."},{"n":10,"year":2004,"ar":"Arcade Fire","ti":"Funeral","cv":"https://dn711006.ca.archive.org/0/items/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1-31589070944.jpg","rt":0.0,"sp":"","yt":"qg7XMMAuCJo","gen":["art rock","baroque pop","art pop","chamber pop","indie rock","alternative punk"],"hb":[],"da":"Funeral is the debut full-length album by Canadian indie rock band Arcade Fire, released on September 14, 2004 in North America by Merge Records and on February 28, 2005 in Europe by Rough Trade Records. It was given its title because several band members had recently lost members of their families: Régine Chassagne's grandmother died in June 2003, Win and William Butler's grandfather (swing musician Alvino Rey) in March 2004, and Richard Reed Parry's aunt in April 2004. Preliminary recordings for Funeral were made during the course of a week in August 2003 at the Hotel2Tango in Montreal, Quebec, and .","dar":"Arcade Fire is a Canadian indie rock band formed in Montreal, Quebec, Canada in 2001. The band consists of Win Butler (vocals, guitar, piano), Régine Chassagne (vocals, accordion, keyboards, hurdy gurdy, drums), Richard Reed Parry (bass, guitar), Tim Kingsbury (bass), and Jeremy Gara (drums). Montreal percussionist Dane Mills performed on the EP and in early live shows.  Will Butler (keyboards, guitar) left the band in 2022 to focus on his solo career. The touring band includes horn players and violinists."},{"n":165,"year":2004,"ar":"Dead Meadow","ti":"Feathers","cv":"https://ia800703.us.archive.org/33/items/mbid-2d16e351-34ae-4722-9166-bc8512d5907a/mbid-2d16e351-34ae-4722-9166-bc8512d5907a-19351955710.jpg","rt":0.0,"sp":"","yt":"IGoTfJ2ae5k","gen":["psychedelic rock","alternative rock","indie rock","stoner rock","neo-psychedelia","Rock"],"hb":[],"da":null,"dar":"Dead Meadow is an American stoner rock band, formed in Washington, D.C. in 1998 and currently composed of vocalist and guitarist Jason Simon, bassist Steve Kille, and drummer Mark Laughlin.\n\nThe band members met in the DC punk/indie scene, though their music draws from more faraway sources. The band formed in the fall of 1998 from the ashes of local bands The Impossible Five and Colour, when singer-guitarist Jason Simon, bassist Steve Kille, and drummer"},{"n":12,"year":2002,"ar":"Interpol","ti":"Turn on the Bright Lights","cv":"https://dn711202.ca.archive.org/0/items/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30/mbid-b08906fd-9e76-3ba0-bf07-23e0a59bbd30-2981501643.jpg","rt":0.0,"sp":"","yt":"3QiQZj6cfDM","gen":["alternative rock","post-punk","indie rock","post-punk revival","rock","Punk"],"hb":["Frikomid","sdecandelario"],"da":"Turn On the Bright Lights is the debut album of New York City rock band Interpol. It was released in 2002 on Matador Records to a great deal of critical acclaim and sold exceptionally well for an indie release; it has sold 499,000 copies in the U.S. so far. It was also ranked highly on the yearly lists of many music critics, and has to date sold 86,000 in the UK despite only charting as high as #101. Musically, many have pointed out the similarities between Turn On the Bright Lights and the bands Joy Division and The Chameleons. \"PDA\", .","dar":"Interpol is an American post-punk band formed in Manhattan, New York, in 1997. They played an important part in the post-punk revival of the 2000s. The band consists of Paul Banks (vocals and guitar), Sam Fogarino (drums), and Daniel Kessler (guitar and backing vocals).\n\nThe band's sound is generally a mix of staccato bass and rhythmic, harmonized guitar, with a snare heavy mix, drawing comparisons to post-punk bands such as Joy Division and The Chameleons."},{"n":36,"year":2002,"ar":"Broken Social Scene","ti":"You Forgot It in People","cv":"https://dn711301.ca.archive.org/0/items/mbid-f461c619-5c8e-4263-8dbb-2c005d6d25fb/mbid-f461c619-5c8e-4263-8dbb-2c005d6d25fb-34299338672.jpg","rt":0.0,"sp":"","yt":"V6BLuIm872I","gen":["indie rock","post-rock","Alternative Rock"],"hb":[],"da":"You Forgot It in People is a 2002 album by Broken Social Scene. It won the Alternative Album of the Year Juno Award in 2003. It followed Feel Good Lost, and was the band's commercial and artistic breakthrough. Many of the songs that didn't make it onto the album were featured in a B-sides compilation titled Bee Hives released in 2004. You Forgot It in People features intricate, experimental production techniques and a large number of instruments coinciding with the band's vastly expanded size. Music videos were made for a number of tracks, including singles \"Stars and Sons\", \"Almost Crimes\", .","dar":"Broken Social Scene are a Canadian indie rock collective formed in 1999 in Toronto, Ontario. The band's core members were Kevin Drew and Brendan Canning. This duo recorded and released the band's ambient debut album Feel Good Lost, in 2001, with contributions from Ohad Benchetrit (also known as Years), Evan Cranley, Leslie Feist, Justin Peroff, Bill Priddle, and Charles Spearin. All of these musicians would emerge as key members of Broken Social Scene in future endeavors."},{"n":112,"year":2002,"ar":"Neko Case","ti":"Blacklisted","cv":"https://dn710607.ca.archive.org/0/items/mbid-42dc5167-670f-4454-bfdb-709264c7e1c2/mbid-42dc5167-670f-4454-bfdb-709264c7e1c2-19556935488.png","rt":0.0,"sp":"","yt":"Dlg_yXziyLU","gen":["folk","country rock","alternative rock","country","indie rock","Rock"],"hb":[],"da":null,"dar":"Neko Case (born September 8, 1970, in Alexandria, Virginia) is an American singer and songwriter, best known for her solo career and her contributions as a member of the Canadian indie rock group The New Pornographers.\n\nCase moved around often as a child, spending the largest part of her youth in Tacoma, Washington. She left her parents at age 15 and three years later she started playing drums for several bands around the Northwest's punk rock scene."},{"n":141,"year":2002,"ar":"Beck","ti":"Sea Change","cv":"https://dn710605.ca.archive.org/0/items/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006-990718896.jpg","rt":0.0,"sp":"","yt":"JB2CvfMY6SM","gen":["folk rock","alternative rock","contemporary folk","chamber pop","indie rock","alternative country"],"hb":[],"da":"Beck has always been known for his ever-changing moods -- particularly since they often arrived one after another on one album, sometimes within one song -- yet the shift between the neon glitz of Midnite Vultures and the lush, somber Sea Change is startling, and not just because it finds him in full-on singer/songwriter mode, abandoning all of the postmodern pranksterism of its predecessor. What's startling about Sea Change is how it brings everything that's run beneath the surface of Beck's music to the forefront, as if he's unafraid to not just reveal emotions, but to elliptically examine them in .","dar":"Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist)."},{"n":65,"year":2000,"ar":"Songs: Ohia","ti":"Ghost Tropic","cv":"https://dn710703.ca.archive.org/0/items/mbid-1410098b-da04-4123-ae3f-8f61670ecf49/mbid-1410098b-da04-4123-ae3f-8f61670ecf49-25341755472.jpg","rt":0.0,"sp":"","yt":"Z4-IT5C8HbI","gen":["contemporary folk","indie rock","slowcore","Rock"],"hb":["Frikomid"],"da":null,"dar":"Songs: Ohia was largely a solo project for singer-songwriter Jason Molina (December 30, 1973 – March 16, 2013). Critics and fans alike have found considerable difficulty in trying to define the band's sound, usually settling on more general labels such as indie rock and folk-rock. Most are quick to draw comparisons to Neil Young and Will Oldham, (the latter of which Molina has collaborated with, alongside Alasdair Roberts, as the Amalgamated Sons of Rest)."},{"n":68,"year":2000,"ar":"Elliott Smith","ti":"Figure 8","cv":"https://dn710605.ca.archive.org/0/items/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae-18782213344.png","rt":0.0,"sp":"","yt":"B6sYRE65QIc","gen":["folk rock","chamber pop","indie rock","indie folk","indie pop","rock"],"hb":[],"da":"Figure 8 is the fifth studio album by American singer-songwriter Elliott Smith. Released by DreamWorks Records on April 18, 2000, it became Smith's second release on a major label and the last album he would complete before his death. It was recorded at Sunset Sound in Hollywood, Sonora Studios in Los Angeles, Capitol Studios in Hollywood, and Abbey Road Studios in London (\"Stupidity Tries\", \"In the Lost and Found (Honky Bach)\" and \"Pretty Mary K\"). The album was also released on double vinyl 12\" on Bong Load Custom Records, and later rereleased by Plain Records in 2008. It is also .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":76,"year":2000,"ar":"Cursive","ti":"Domestica","cv":"https://dn721304.ca.archive.org/0/items/mbid-e973d272-3f35-4b02-82e3-aa43f83031b2/mbid-e973d272-3f35-4b02-82e3-aa43f83031b2-19933342206.jpg","rt":0.0,"sp":"","yt":"Zefbpl38ZC0","gen":["indie rock","emo","Punk","Alternative Rock"],"hb":[],"da":null,"dar":"Cursive is an indie rock band from Omaha, Nebraska, USA, formed in 1995. Musically described as emo and post-hardcore, the band has released ten studio albums and a mix of singles and EPs since 1997, released on record labels 15 Passenger and Saddle Creek.\n\nBand members:\nTim Kasher – lead vocals, guitars, organ\nMatt Maginn – bass, backing vocals\nClint Schnase – drums, percussion \nTed Stevens – guitars, backing vocals \nPatrick Newbery – miscellaneous instruments"},{"n":20,"year":1999,"ar":"The Flaming Lips","ti":"The Soft Bulletin","cv":"https://dn721501.ca.archive.org/0/items/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa-23592292976.png","rt":0.0,"sp":"","yt":"MBH-169OHNg","gen":["alternative rock","psychedelic pop","art pop","chamber pop","indie rock","neo-psychedelia"],"hb":[],"da":"The Soft Bulletin is the ninth album released by The Flaming Lips on May 17, 1999 in the UK, with a US release following on June 22, 1999. It was released to wide critical acclaim and hailed by critics as a departure from their previous guitar-heavy alternative rock sound, into a more layered and intricately arranged work. The album was considered to mark a change in the course for the band, with more traditional catchy melodies and accessible-sounding music (their previous album, 1997's Zaireeka, was a quadruple album of experimental sounds meant to be played on four separate stereo systems .","dar":"The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals)."},{"n":96,"year":1999,"ar":"Wilco","ti":"Summerteeth","cv":"https://cdn2.albumoftheyear.org/600x0/album/summerteeth-1.jpg","rt":0.0,"sp":"","yt":"-XRLxtmGzxk","gen":["alternative rock","pop rock","chamber pop","indie rock","Rock","Alternative Rock"],"hb":["Frikomid","Nubis84"],"da":"Summerteeth is the third studio album by Chicago alternative rock band Wilco. Released through Reprise Records on March 9, 1999, the album was heavily influenced lyrically by twentieth century literature, as well as singer Jeff Tweedy's marital problems. Unlike previous albums, Summerteeth was heavily overdubbed in the studio with Pro Tools. Tweedy and Jay Bennett created most of the album in the studio, a contrast to the band's previous albums, which were rehearsed live and recorded almost at once. Despite critical acclaim from numerous outlets, including Allmusic, The Chicago Tribune, and The Village Voice, Summerteeth sold approximately 200,000 copies—a modest .","dar":"Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche."},{"n":164,"year":1999,"ar":"Yume Bitsu","ti":"Yume Bitsu","cv":"https://dn710305.ca.archive.org/0/items/mbid-c89b6132-20c7-42c8-8989-71f464095adb/mbid-c89b6132-20c7-42c8-8989-71f464095adb-21700318951.jpg","rt":0.0,"sp":"","yt":"gfOSvunYXc0","gen":["space rock","indie rock","post-rock","Rock","Alternative Rock"],"hb":[],"da":null,"dar":"Yume Bitsu (meaning \"dream beats\" in Japanese), is a psychedelic rock band. Most of the band members live along the Pacific Coast in California and Oregon. Vocalist/guitarist Adam Forkner is active as White Rainbow and is also part of Surface of Eceon, a supergroup that also features members of Landing, an ambient, psychedelic rock unit and has moonlighted as a guitarist for Devendra Banhart and Jackie-O Motherfucker.\n\nAccording to Forkner, the band's name is pronounced \"YOU may BEET suu.\""},{"n":7,"year":1998,"ar":"Modest Mouse","ti":"The Lonesome Crowded West","cv":"https://dn710703.ca.archive.org/0/items/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f/mbid-2a6d8f7c-8cca-4fb1-9f8c-0de137837f0f-33419350946.jpg","rt":0.0,"sp":"","yt":"G33AcZzZ0pM","gen":["alternative rock","indie rock","post-hardcore","midwest emo","Alternative Rock"],"hb":[],"da":"The Lonesome Crowded West is the third album recorded by American indie rock band Modest Mouse (the second released, but Sad Sappy Sucker was recorded before The Lonesome Crowded West and This Is a Long Drive for Someone with Nothing to Think About). The album was released on Up Records on November 18, 1997, on both compact disc and vinyl LP. Many consider the album to be one of the best indie rock albums of the 90s: Pitchfork Media ranked it #29 in their list 100 Greatest Albums of the 1990s, and the song \"Trailer Trash\" number 63 in their .","dar":"Modest Mouse is an American alternative rock band which formed in 1993 in Issaquah, Washington, United States. The band's original lineup consisted of guitarist Isaac Brock, drummer Jeremiah Green and bassist Eric Judy. Since being signed to Sony's Epic Records in 2000, Modest Mouse has attained significant popular success with songs such as \"Float On\" and \"Dashboard.\"\n\nThe band's current configuration is Isaac Brock (vocals, guitar), Tom Peloso (strings, horns, bass, keyboards), Jim Fairchild (guitar), and Eric Judy (bass))."},{"n":7,"year":1998,"ar":"Neutral Milk Hotel","ti":"In the Aeroplane Over the Sea","cv":"https://dn710607.ca.archive.org/0/items/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e/mbid-023fcf90-dca7-4a4e-a4e2-ed0eaba78f9e-8579764982.jpg","rt":0.0,"sp":"","yt":"hy0B4uBZaOs","gen":["folk rock","alternative rock","indie rock","noise pop","indie folk","brass band"],"hb":["Frikomid","GabredMared","Lonsonxd","Nubis84","Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"In the Aeroplane Over the Sea is the second and final studio album by the American indie rock band Neutral Milk Hotel. It was released in the United States on February 10, 1998 on Merge Records and May 1998 on Blue Rose Records in the United Kingdom. Jeff Mangum moved from Athens, Georgia to Denver, Colorado to prepare the bulk of the album's material with producer Robert Schneider, this time at Schneider's newly created Pet Sounds Studio at the home of Jim McIntyre. The album was the sixth-best-selling vinyl album in 2008. NME named it the 98th greatest album of .","dar":"Neutral Milk Hotel was an American alternative rock band formed by singer, guitarist, and songwriter Jeff Mangum in 1989 in Ruston, Louisiana. On the band's full-length albums, Mangum played with a number of other musicians, notably Jeremy Barnes (drums), Scott Spillane (horns), Julian Koster (musical saw/banjo/accordion/bass guitar) and producer-instrumentalist Robert Schneider. Neutral Milk Hotel were one of the original members of the Elephant Six Collective, based in Athens, Georgia."},{"n":63,"year":1998,"ar":"Silver Jews","ti":"American Water","cv":"https://cdn2.albumoftheyear.org/600x0/album/american-water-1.jpg","rt":0.0,"sp":"","yt":"CvdpFcNUnKc","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":[],"da":"American Water is the third full-length studio album by indie rock group Silver Jews. Released in 1998 as an LP and CD on Drag City (DC149) in America and Domino (WIG56) in Europe, American Water was recorded at The Rare Book Room in Brooklyn and mastered at Abbey Road Studios. The album features musicians Tim Barnes, David Berman, Mike Fellows, Stephen Malkmus, Chris Stroffolino, and artwork by Chris Kysor. Berman was struggling with drug addiction during the recording of American Water. Lyrically, this is expressed in a sense of solidarity with the downtrodden. He described the album's sessions saying: \"I .","dar":"Silver Jews were an American indie rock band formed in Hoboken, New Jersey, in 1989. The band's earliest incarnation was the college band Ectoslavia, formed by future Pavement founders Bob Nastanovich, Stephen Malkmus and frontman David Berman at the University of Virginia in 1985. An exercise in joyous noise, the band disbanded after graduation and the three friends moved to New York to take up various jobs - Nastanovich, a bus driver, and Berman and Malkmus, art museum security guards."},{"n":77,"year":1998,"ar":"Sunny Day Real Estate","ti":"How It Feels To Be Something On","cv":"https://ia801901.us.archive.org/30/items/mbid-d28b1565-137e-475b-b554-a4a9cde3810b/mbid-d28b1565-137e-475b-b554-a4a9cde3810b-15145525545.jpg","rt":0.0,"sp":"","yt":"BjVTp9aPvog","gen":["alternative rock","indie rock","emo","Punk","Alternative Rock"],"hb":["Frikomid","sdecandelario"],"da":"How It Feels to Be Something On is the third studio album by American emo band Sunny Day Real Estate, and the first since their 1997 comeback. It was released September 8, 1998. .","dar":"Sunny Day Real Estate is an American alternative rock band formed in Seattle, Washington in 1992. The band helped bring the emo subgenre from an underground musical phenomenon to a wider audience. The band's lineup is Jeremy Enigk (vocals, guitars), Dan Hoerner (guitar), Nate Mendel (bass) and William Goldsmith (drums).\n\nThe core of Sunny Day Real Estate formed in 1992, originally under the name Empty Set. Empty Set consisted of Dan Hoerner (guitar, vocals), Nate Mendel (bass), and William Goldsmith (drums)."},{"n":82,"year":1998,"ar":"Sparklehorse","ti":"Good Morning Spider","cv":"https://dn710008.ca.archive.org/0/items/mbid-726bbe45-8dee-45da-823a-fe999a151b22/mbid-726bbe45-8dee-45da-823a-fe999a151b22-27684278459.jpg","rt":0.0,"sp":"","yt":"XqD_mqGiWFQ","gen":["alternative rock","indie rock","Rock","Alternative Rock"],"hb":[],"da":"Good Morning Spider is the second album by Sparklehorse. The album’s title came from a sound that Sparklehorse singer-songwriter Mark Linkous once heard from an old pump organ that reminded him of a spider building a web. He was later told about an old folk superstition in which seeing a spider in the morning is an omen for a sad day. Following the release of its first album Vivadixiesubmarinetransmissionplot, Sparklehorse embarked on a European tour opening for Radiohead, who praised Sparklehorse as their favorite new band.It was during this tour in 1996 that Mark Linkous suffered a near-fatal overdose that .","dar":"Sparklehorse was an American indie rock band formed in 1995 in Richmond, Virginia and led by Mark Linkous (September 9, 1962 - March 6, 2010), a Richmond, Virginia native and last of a long line of southern coalminers. Linkous recorded much of Sparklehorse's material in his home studio, and his Southern Gothic vision guided Sparklehorse. Drummer and multi-instrumentalist Scott Minor was a frequent collaborator.\n\nBefore his suicide in March 2010, Linkous"},{"n":1,"year":1997,"ar":"Radiohead","ti":"OK Computer","cv":"https://dn720706.ca.archive.org/0/items/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d/mbid-30702389-5c67-4438-9ea0-2351c8de0f1d-43287476628.png","rt":0.0,"sp":"","yt":"jNY_wLukVW0","gen":["experimental rock","alternative rock","art rock","indie rock","space rock revival","post-britpop"],"hb":[],"da":"OK Computer is the third album by the English rock band Radiohead, released in 1997. It reached #1 on the UK Albums Chart and marked Radiohead's highest entry into the American market at the time, where it debuted at #21. OK Computer expanded the band's worldwide popularity, becoming the last Radiohead album to have a delayed release outside of the United Kingdom. As of 2007, it has been certified triple platinum in the UK and double platinum in the US. OK Computer included the singles \"Paranoid Android\", \"Karma Police\" and \"No Surprises\". The album was recorded in rural Oxfordshire and .","dar":"Radiohead are an English rock band formed in Abingdon, Oxfordshire, in 1985. The band consists of Thom Yorke (vocals, guitar, piano, keyboards); brothers Jonny Greenwood (guitar, keyboards, other instruments) and Colin Greenwood (bass); Ed O'Brien (guitar, backing vocals); and Philip Selway (drums, percussion). Since 1994, they have frequently collaborated with producer Nigel Godrich and cover artist Stanley Donwood. Radiohead are noted for their experimental approach, which has influenced the development of alternative rock."},{"n":4,"year":1997,"ar":"Elliott Smith","ti":"Either/Or","cv":"https://dn710706.ca.archive.org/0/items/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e/mbid-0a5aa565-8158-4e81-9776-af8044f6cc1e-18047694847.png","rt":0.0,"sp":"","yt":"UuizNQUOFCI","gen":["folk rock","indie rock","indie folk","indie pop","Rock","Alternative Rock"],"hb":[],"da":"Either/Or is the third studio album by American singer-songwriter Elliott Smith. Either/Or was recorded in several locations, mostly in Portland, Oregon – while Smith was still a member of Heatmiser – and was produced by Smith, Tom Rothrock, and Rob Schnapf. It was released on February 25, 1997, through Kill Rock Stars record label, following Heatmiser's dissolution. Book-ended by its two singles, Speed Trials and Ballad of Big Nothing, \"Either/Or\" did not chart in the US, but was acclaimed by critics. It has been described as \"a bridge between the lo-fi darkness of Roman Candle and Elliott Smith and the .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":33,"year":1997,"ar":"Yo La Tengo","ti":"I Can Hear the Heart Beating as One","cv":"https://dn710607.ca.archive.org/0/items/mbid-dc5ee2df-7e5b-4a43-b67b-b9551e65c361/mbid-dc5ee2df-7e5b-4a43-b67b-b9551e65c361-3592364273.jpg","rt":0.0,"sp":"","yt":"Jp1MDdMDCno","gen":["indie rock","rock","Alternative Rock"],"hb":[],"da":"I Can Hear the Heart Beating as One is an album by Yo La Tengo released on Matador in 1997. It was recorded in Nashville, Tennessee and mixed in New York City. The album's sound is a blend of various genres, such as folk (\"One PM Again\"), rock (\"Moby Octopad\"), shoegazing (\"Deeper Into Movies\"), noise pop (\"Sugarcube\"), long noise jams (\"Spec Bebop\"), ambient (\"Green Arrow\"), and bossa nova (\"Center of Gravity\"), with a few songs showing electronic music influences (\"Autumn Sweater\"). The album also contains two cover songs: \"Little Honda,\" a Beach Boys tune by Brian Wilson and Mike Love, .","dar":"Yo La Tengo is an American indie rock band formed in Hoboken, New Jersey in 1984. Since 1992, the lineup has consisted of Ira Kaplan (guitars, vocals), Georgia Hubley (drums, vocals), and James McNew (bass, vocals).\n\nDespite achieving limited mainstream success, Yo La Tengo has been called \"the quintessential critics' band\" and maintain a strong cult following. Additionally, the band is renowned for its encyclopedic repertoire of cover songs both in live performance and on record."},{"n":85,"year":1997,"ar":"The Verve","ti":"Urban Hymns","cv":"https://dn710203.ca.archive.org/0/items/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034-29045897897.jpg","rt":0.0,"sp":"","yt":"GQNxSTFf6zQ","gen":["alternative rock","chamber pop","indie rock","neo-psychedelia","britpop","post-britpop"],"hb":[],"da":"Urban Hymns is the third album by English rock band The Verve, released on 29 September 1997. It earned nearly unanimous critical praise upon its release and went on to become the band's best-selling release and one of the biggest-selling albums of the year. The album received nearly unanimous critical praise upon its release, with Melody Maker naming Urban Hymns as the number-one album of 1997 in its year-end list. The album is featured in the book \"1001 Albums You Must Hear Before You Die\". In the years following its release, Urban Hymns received much acclaim. In 1998, it won .","dar":"The Verve were an English rock band formed in Wigan in 1990 by lead vocalist Richard Ashcroft, guitarist Nick McCabe, bass guitarist Simon Jones, and drummer Peter Salisbury. Guitarist and keyboardist Simon Tong joined the band during its first reunion.\n\nThe band initially developed a psychedelic and shoegaze sound, showcased on their debut album \"A Storm in Heaven.\" By 1997, The Verve had released three EPs and three studio albums. Throughout their career"},{"n":127,"year":1997,"ar":"Super Furry Animals","ti":"Radiator","cv":"https://dn711401.ca.archive.org/0/items/mbid-b9854978-60b5-4534-aea8-26cca7c469dc/mbid-b9854978-60b5-4534-aea8-26cca7c469dc-4137065045.jpg","rt":0.0,"sp":"","yt":"ydl8CwwdPDo","gen":["psychedelic rock","alternative rock","indie rock","Rock","Electronic","Pop"],"hb":[],"da":null,"dar":"Super Furry Animals is a Welsh rock band formed in Cardiff in 1993. The group’s long-term lineup consists of Gruff Rhys (lead vocals, guitar), Huw Bunford (lead guitar, vocals), Guto Pryce (bass guitar), Cian Ciaran (keyboards, synthesizers, electronics, occasional guitar, vocals), and Dafydd Ieuan (drums, vocals). An earlier version of the band featured actor Rhys Ifans as lead vocalist.\n\nThe band emerged as part of a wave of Welsh music in the 1990s"},{"n":137,"year":1997,"ar":"Mansun","ti":"Attack of the Grey Lantern","cv":"https://dn710900.ca.archive.org/0/items/mbid-d21961df-2426-4315-82bb-8ae0dcfb4bbe/mbid-d21961df-2426-4315-82bb-8ae0dcfb4bbe-41069271574.jpg","rt":0.0,"sp":"","yt":"K5lcV6tMQds","gen":["indie rock","britpop","Rock","Pop","Alternative Rock"],"hb":[],"da":null,"dar":"Mansun was formed in Chester in 1995 by vocalist/rhythm guitarist Paul Draper, lead guitarist/ backing vocalist Dominic Chad, bassist Stove King and drummer Andie Rathbone. Arriving on the Britpop-dominated scene as a beat-driven art rock band, Mansun liberally mixed progressive rock, psychedelia, art pop, shoegaze, 80's noir and electronic elements; instead of singles releasing numerous multi-format EPs bookended by concept albums, often changing their style (and peculiar uniforms) each release."},{"n":153,"year":1997,"ar":"Lungfish","ti":"Indivisible","cv":"https://dn711200.ca.archive.org/0/items/mbid-69446457-af5d-429a-966a-88100370447c/mbid-69446457-af5d-429a-966a-88100370447c-18975811993.jpg","rt":0.0,"sp":"","yt":"G6CJ5x6YMCw","gen":["alternative rock","indie rock","post-hardcore","rock","Rock","Punk"],"hb":[],"da":null,"dar":"Lungfish is a post-hardcore band formed in 1987 in Baltimore, Maryland, United States. All of their music has been released by the Washington, D.C. punk label Dischord except for their first LP, Necklace of Heads which was released by Simple Machines (it was later added to the CD release of Talking Songs for Walking by Dischord).\n\nTheir lineup as of 2005 consists of Daniel Higgs (vocals), Asa Osborne (guitars and vocals), Sean Meadows (bass guitar), and Mitchell Feldstein (drums). Previous bass guitar players are John Chriest and Nathan Bell."},{"n":40,"year":1996,"ar":"The Divine Comedy","ti":"Casanova","cv":"https://ia800806.us.archive.org/13/items/mbid-cc4082a7-e79a-4c05-a6aa-f74695f2081c/mbid-cc4082a7-e79a-4c05-a6aa-f74695f2081c-41225734673.jpg","rt":0.0,"sp":"","yt":"I4J0gOonfh8","gen":["baroque pop","chamber pop","indie rock","britpop","lounge","cocktail nation"],"hb":[],"da":"Casanova is The Divine Comedy's fourth album. It was the band's commercial breakthrough. It was released on Setanta and certified gold in the UK in July 1997. This was helped by the release of The Divine Comedy's first single \"Something for the Weekend\" which reached number 13 on the charts. There were two other singles released from the album \"Becoming More Like Alfie\" and \"The Frog Princess\" which charted at 27 and 15 respectively. The album is also less classical sounding than Promenade and adopts more of a Britpop feel. An instrumental version of \"Songs of Love\" was used as .","dar":"The Divine Comedy is a baroque pop band now based in Dublin, Ireland, fronted by Neil Hannon.\n\nNeil Hannon, Originally from Derry, has been the only ever-present member of the band, being its founder in 1989 when he was joined by John McCullagh and Kevin Traynor. Their first album, the heavily R.E.M.-influenced and now-deleted Fanfare for the Comic Muse, enjoyed little success though. A couple of equally unsuccessful EPs - Timewatch (1991); Europop (1992) - were to follow"},{"n":82,"year":1996,"ar":"Beck","ti":"Odelay","cv":"https://dn710302.ca.archive.org/0/items/mbid-804b7f78-0bbc-3479-887a-ab28390357d4/mbid-804b7f78-0bbc-3479-887a-ab28390357d4-4507123240.jpg","rt":0.0,"sp":"","yt":"RQ6EnfFGDiM","gen":["alternative rock","contemporary folk","indie rock","neo-psychedelia","hip hop","alternative country"],"hb":[],"da":"Odelay is the second major-label studio album (and fourth album overall) recorded by alternative rock artist Beck, originally released June 18, 1996. It was produced by the Dust Brothers. After the mainstream success of \"Loser\", Odelay featured several hit singles, including \"Where It's At\", \"Devils Haircut,\" and \"The New Pollution.\" The album peaked at #16 on the Billboard 200 chart and eventually sold over 2 million copies in the United States. It was also Beck's first hit album in the United Kingdom, making #17; it has since gone platinum in the UK. On January 29, 2008, Odelay was reissued as .","dar":"Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist)."},{"n":125,"year":1996,"ar":"Belle and Sebastian","ti":"Tigermilk","cv":"https://dn710909.ca.archive.org/0/items/mbid-ae871d82-4914-4338-b2db-f91d723f9b18/mbid-ae871d82-4914-4338-b2db-f91d723f9b18-6748490069.png","rt":0.0,"sp":"","yt":"soMbZ7eLKlM","gen":["chamber pop","indie rock","indie pop","twee pop","Alternative Rock"],"hb":[],"da":"Tigermilk is the 1996 debut album from Scottish pop group Belle & Sebastian. Originally given a limited release (1,000 copies) by Electric Honey, the album was subsequently re-released in 1999 by Jeepster Records. The cover photograph was taken by Stuart Murdoch, and features Joanne Kenney - the same model who appeared on the cover of the Dog on Wheels EP. The album is named after a song that didn't end up making the cut – an instrumental that was later performed numerous times on Belle & Sebastian's early tours. All of the songs on the album were written by Stuart .","dar":"Belle and Sebastian are a Scottish indie pop band that formed in 1994 in Glasgow, Scotland. Led by guitarist/vocalist Stuart Murdoch, the seven-piece band have an intimate, majestic sound that is equal parts folk-rock and '60s pop. Murdoch has a gift not only for whimsy and surrealism, but also for odd, unsettling lyrical detail which keeps the songs grounded in a tangible reality. \n\nBelle and Sebastian released their first two albums in 1996: Tigermilk"},{"n":138,"year":1996,"ar":"Stereolab","ti":"Emperor Tomato Ketchup","cv":"https://ia800301.us.archive.org/13/items/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de/mbid-11da3dfb-ee12-4b94-a88f-cb2bdc0c90de-24086681893.jpg","rt":0.0,"sp":"","yt":"GLYu0allKgs","gen":["experimental rock","art pop","indie rock","post-rock","indie pop","indietronica"],"hb":["Nubis84","verygooood"],"da":"Emperor Tomato Ketchup is the fourth studio album by English-French rock band Stereolab. It was released on 18 March 1996 and was issued by Duophonic Records and Elektra Records. The album is named after the 1971 experimental film Emperor Tomato Ketchup by Japanese author and director Shūji Terayama. Emperor Tomato Ketchup was released on 18 March 1996 in the United Kingdom by Duophonic Records, and on 9 April 1996 in the United States by Elektra Records. The artwork for the album was inspired by the LP cover sleeve of a 1964 recording of composer Béla Bartók's Concerto for Orchestra by .","dar":"Stereolab is an Anglo-French avant-pop band formed in London in 1990. The group is led by the songwriting duo of Tim Gane and Lætitia Sadier. Their music combines repetitive motorik rhythms with vintage electronic keyboards and female vocals in English and French, drawing on influences from krautrock, funk, jazz, 1960s French pop, and Brazilian music. Their lyrics often explore political and philosophical themes inspired by the Surrealist and Situationist art movements."},{"n":141,"year":1996,"ar":"Bardo Pond","ti":"Amanita","cv":"https://dn710304.ca.archive.org/0/items/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3/mbid-38e7816b-6909-47cc-8933-2e47fb2010c3-12048716483.jpg","rt":0.0,"sp":"","yt":"YawEsEiIbqA","gen":["psychedelic rock","space rock","indie rock","shoegaze","dream pop","post-rock"],"hb":[],"da":null,"dar":"Bardo Pond are an American psychedelic rock band formed in Philadelphia, PA, United States in 1991. They are currently signed to London based label Fire Records. The current members are Michael Gibbons (guitar), John Gibbons (guitar), Isobel Sollenberger (flute and vocals), Clint Takeda (bass guitar), Jason Kourkonis (drums), and Aaron Igler (synth/electronics). Bardo Pond's drug-inspired music is often classified as space rock, acid rock, post-rock, shoegaze or noise rock."},{"n":156,"year":1996,"ar":"Polvo","ti":"Exploded Drawing","cv":"https://dn721807.ca.archive.org/0/items/mbid-a958cbed-4b67-4b6d-8d67-771ad7cf1a99/mbid-a958cbed-4b67-4b6d-8d67-771ad7cf1a99-27224994207.jpg","rt":0.0,"sp":"","yt":"nXO0upZzdbs","gen":["indie rock","rock","Rock","Punk"],"hb":[],"da":"Exploded Drawing is the third studio album by American indie rock band Polvo. It was released in 1996 as a CD and double-LP on Touch and Go Records. The album was engineered by Bob Weston. In 1999, Pitchfork ranked it at #68 on their original “Top 100 Favorite Records of the 1990s” list, though it was later excluded from the updated version published in 2003. In the years following the band’s reunion, the album has been viewed in a much more positive light, and has often been called their best. The Line of Best Fit called it a “sprawling double .","dar":"Polvo are an American indie rock band formed in Chapel Hill, North Carolina, in 1990. The band was fronted by guitarists/vocalists Ash Bowie and Dave Brylawski. Eddie Watkins played drums, and Steve Popson played bass guitar.  The band reformed in 2008 with Brian Quast assuming drum duties. Their sound, foreshadowing math rock and post-rock, is defined by angular post-punk songwriting, complex and dissonant guitar harmonies and driving rhythms, complementing cryptic lyrics. The band's name means \"dust\" in Spanish, or \"octopus\" in Portuguese."},{"n":192,"year":1996,"ar":"Bedhead","ti":"Beheaded","cv":"https://dn720707.ca.archive.org/0/items/mbid-2a62fb20-7603-47c9-8ea1-44d99fcb9533/mbid-2a62fb20-7603-47c9-8ea1-44d99fcb9533-7794055195.jpg","rt":0.0,"sp":"","yt":"U6Cg-mg5LnA","gen":["indie rock","slowcore","Alternative Rock"],"hb":[],"da":null,"dar":"Bedhead was a slowcore band from Dallas, Texas active in the 1990s (1991-1998). Their first album, WhatFunLifeWas, is often cited on critics' lists as one of the best indie albums of the 1990s. Bedhead's music was generally subdued, with a polyphonic sound based on the interlocking of single-line melodies played by three electric guitars and one electric bass guitar (often played with a capo), nearly always using clean (undistorted) tones. The group's"},{"n":19,"year":1994,"ar":"Pavement","ti":"Crooked Rain, Crooked Rain","cv":"https://ia800607.us.archive.org/5/items/mbid-8684f971-08a2-3551-8e5c-a87440408725/mbid-8684f971-08a2-3551-8e5c-a87440408725-23540686482.jpg","rt":0.0,"sp":"","yt":"4IED3Q5VLeg","gen":["alternative rock","indie rock","noise pop","rock","Alternative Rock"],"hb":[],"da":"Crooked Rain, Crooked Rain is an album released by Pavement in 1994. With this album, the band abandoned the lo-fi sound displayed on Slanted and Enchanted (as well as their drummer, Gary Young). During the tour for Slanted, the band added percussionist Bob Nastanovich and bassist Mark Ibold; partway through this album's recording sessions, Gary Young was replaced by Steve West. The album featured the band at its most easily accessible, and the single \"Cut Your Hair\" was the band's closest brush with mainstream success. As of 2007, the album has sold almost 500,000 copies and was a UK Top .","dar":"Pavement is an American indie rock band formed in Stockton, California, in 1989. For most of the period to 1999, the band consisted of Stephen Malkmus (vocals, guitar), Scott \"Spiral Stairs\" Kannberg (guitar, vocals), Mark Ibold (bass), Steve West (drums) and Bob Nastanovich (percussion, vocals). During that period, and since, they have frequently been described as one of the most influential bands to emerge from the American underground of the '90s."},{"n":37,"year":1994,"ar":"Sunny Day Real Estate","ti":"Diary","cv":"https://ia802906.us.archive.org/16/items/mbid-d4ab95e8-c07e-479b-8d6d-dadad2819195/mbid-d4ab95e8-c07e-479b-8d6d-dadad2819195-30781295626.jpg","rt":0.0,"sp":"","yt":"4FRFcE-jsQo","gen":["alternative rock","indie rock","midwest emo","emo","Punk","Alternative Rock"],"hb":[],"da":"Diary is the debut studio album by American rock band Sunny Day Real Estate, released on May 10, 1994. The album is considered by many to be a defining emo album of the second wave, and key in the development of its subgenre, Midwest emo. It has also been called the \"missing link\" between post-hardcore and the nascent emo genre. .","dar":"Sunny Day Real Estate is an American alternative rock band formed in Seattle, Washington in 1992. The band helped bring the emo subgenre from an underground musical phenomenon to a wider audience. The band's lineup is Jeremy Enigk (vocals, guitars), Dan Hoerner (guitar), Nate Mendel (bass) and William Goldsmith (drums).\n\nThe core of Sunny Day Real Estate formed in 1992, originally under the name Empty Set. Empty Set consisted of Dan Hoerner (guitar, vocals), Nate Mendel (bass), and William Goldsmith (drums)."},{"n":80,"year":1994,"ar":"Elliott Smith","ti":"Roman Candle","cv":"https://dn710602.ca.archive.org/0/items/mbid-2a3dbf29-e1d5-40c6-85d5-4c9611da9c9b/mbid-2a3dbf29-e1d5-40c6-85d5-4c9611da9c9b-5003037508.jpg","rt":0.0,"sp":"","yt":"DCZbnvzRUjQ","gen":["indie rock","rock","Rock","Alternative Rock"],"hb":[],"da":"Roman Candle was Elliott Smith's debut album as a solo artist, even though he was still a singer and guitarist for the band Heatmiser. The album has a raw, homemade sound (see Lo-fi music), with Smith playing each instrument and recording it on his four-track recorder. Kid Tulsa (Pete Krebs) played snare and cymbal on tracks \"No Name #1\" and \"Kiwi Maddog 20/20\". According to the Elliott Smith biography, Elliott Smith and the Big Nothing, Elliott recorded the album in the basement of the home of then-girlfriend and Heatmiser manager J.J. Gonson. The album was never intended for release, as .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":99,"year":1994,"ar":"Shellac","ti":"At Action Park","cv":"https://dn711004.ca.archive.org/0/items/mbid-13cb27a3-a149-4aa3-93e3-47b2cc6e0ab7/mbid-13cb27a3-a149-4aa3-93e3-47b2cc6e0ab7-26663400234.jpg","rt":0.0,"sp":"","yt":"AC7Pkwmllow","gen":["alternative rock","noise rock","industrial","indie rock","math rock","Rock"],"hb":[],"da":"At Action Park is the debut studio album by American rock band Shellac, released on October 24th, 1994 via Touch and Go Records. .","dar":"Shellac (sometimes referred to as 'Shellac of North America') was an American rock music group formed in Chicago, Illinois, in 1992 by Steve Albini (guitar and vocals), Bob Weston (bass guitar vocals) and Todd Trainer (drums). They have been classified as post-hardcore, noise rock and math rock. Albini has claimed they refer to themselves as 'Shellac of North America', \"when we're being pretentious.\"\n\nThey have a distinctive, minimalist sound based on unusual and urgent time signatures"},{"n":101,"year":1994,"ar":"Rodan","ti":"Rusty","cv":"https://dn710705.ca.archive.org/0/
