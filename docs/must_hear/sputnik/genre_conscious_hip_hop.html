<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

“a combination of what’s going on right now in the world” and films by the famous Japanese director Akira Kurosawa. After admitting to his fans that he doesn’t feel the same when rapping anymore, it’s clear that the album will be a reinvention of Curry’s sound and feature more singing and softer sounds than past albums. On the album, he was also inspired by genres such as traditional hip-hop, jazz, poetry, neo-soul, .","dar":"Denzel Rae Don Curry (born February 16, 1995) is an American rapper raised in Carol City, Florida. Curry started rapping while in sixth grade and on September 24, 2011, at age 16, released his first mixtape, titled King Remembered Underground Tape 1991–1995. Following the release of Curry's first mixtape, he became a member of SpaceGhostPurrp's hip-hop collective, Raider Klan, and frequent collaborator of Miami hip-hop group Metro Zu.\n\nCurry left Raider Klan in 2013"},{"n":66,"year":2022,"ar":"Little Simz","ti":"No Thank You","cv":"https://ia601505.us.archive.org/7/items/mbid-f8d3ed4c-6bd1-429e-a740-2ea4e644cb98/mbid-f8d3ed4c-6bd1-429e-a740-2ea4e644cb98-34526044405.jpg","rt":0.0,"sp":"","yt":"GqwOCq0MXPU","gen":["hip hop","neo soul","jazz rap","conscious hip hop","gospel","orchestral"],"hb":[],"da":"NO THANK YOU is the fifth studio album by Little Simz. It was released on 12 December 2022 through the independent label Forever Living Originals after being announced less than a week prior. NO THANK YOU is a hip hop album containing elements of gospel, soul, funk, and electronic music. The songs on NO THANK YOU contain subtle rhythms with orchestral instrumentation, featuring Simz rapping about her music industry experiences, intrapersonal communication, and spiritual revelations. Simz worked with longtime collaborators Inflo (for production) and Cleo Sol (for background vocals) to create this project. Simz released a ten-minute short film on .","dar":"Simbiatu \"Simbi\" Abisola Abiola Ajikawo, better known by her stage name Little Simz, is a British rapper, singer and actress. She rose to prominence with the independent release of her first three albums, namely A Curious Tale of Trials + Persons (2015), Stillness in Wonderland (2016) and Grey Area (2019), the latter of which was shortlisted for the Mercury Prize and won the awards for Best Album at both the Ivor Novello Awards and the NME Awards."},{"n":2,"year":2015,"ar":"Kendrick Lamar","ti":"To Pimp a Butterfly","cv":"https://ia802300.us.archive.org/17/items/mbid-b4d6e526-4195-49bc-b660-b6df4c27686e/mbid-b4d6e526-4195-49bc-b660-b6df4c27686e-9896943304.jpg","rt":0.0,"sp":"","yt":"l9fN-8NjrvI","gen":["hip hop","neo soul","jazz rap","conscious hip hop","west coast hip hop","political hip hop"],"hb":[],"da":"To Pimp a Butterfly is the third studio album by American hip-hop artist, Kendrick Lamar. The album was released on March 16, 2015, by Top Dawg Entertainment, Aftermath Entertainment, and distributed by Interscope Records. Upon its release, \"To Pimp a Butterfly\" received rave reviews from music critics. Lamar has described the album, which incorporates elements of funk, spoken word poetry and jazz, as \"honest, fearful and unapologetic.\" In an interview with Rolling Stone magazine, Kendrick indicated that the title was a play on Harper Lee's novel \"To Kill a Mockingbird\". He was quoted as saying, \"Just putting the word 'pimp' .","dar":"Kendrick Lamar Duckworth (born June 17, 1987) is an American rapper. Regarded as one of the most influential hip-hop artists of his generation, he was awarded the 2018 Pulitzer Prize for Music, becoming the first musician outside of the classical and jazz genres to receive the honor.\n\nBorn in Compton, California, Lamar began releasing music under the stage name K.Dot while attending high school. He signed with Top Dawg Entertainment (TDE) in 2005, and co-founded the hip hop supergroup Black Hippy there."},{"n":1,"year":2012,"ar":"Kendrick Lamar","ti":"good kid, m.A.A.d city","cv":"https://dn710809.ca.archive.org/ illy woods, the Zimbabwean-Jamaican-by-way-of-Brooklyn rapper, who delivers a fragmentation grenade of an album. An explosive riot of bitter invective, evocative lyricism, and daisycutter beats, \"History Will Absolve Me\" is a solid hour of hardboiled anti-nostalgia. The album features guest appearances by established stars like Roc Marciano, Vordul Mega (Cannibal Ox), MarQ Spekt, and Masai Bey, but also features up-and-coming talents Elucid and junclassic. Willie Green, A.M. Breakups, Marmaduke, Nasa (Def Jux/Uncommon Music), and Man Mantis handle the beats and provide a backdrop that matches the intensity of woods’ labyrinthine .","dar":"Born in Washington, DC, Billy Woods (stylized as billy woods) is a rapper based out of New York City. He has also lived in Zimbabwe, Jamaica, and Maryland. Billy Woods is a member of the Super Chron Flight Brothers with Priviledge, Armand Hammer with Elucid, and The Reavers supergroup.\n\nHis mother was an English literature professor from Jamaica. His father was a Ph.D. Marxist writer, active in the Zimbabwe War of Liberation and then a member of the government in Zimbabwe."},{"n":50,"year":2011,"ar":"Danny Brown","ti":"XXX","cv":"https://dn710702.ca.archive.org/0/items/mbid-560d74eb-0cc2-4a02-81e6-ba0f09b298c1/mbid-560d74eb-0cc2-4a02-81e6-ba0f09b298c1-4410464955.jpg","rt":0.0,"sp":"","yt":"cVx4f9swtTQ","gen":["alternative hip hop","hip hop","experimental hip hop","conscious hip hop","hardcore hip hop"],"hb":["EliasJ72","alberto_gu"],"da":"XXX (pronounced \"triple x\" or \"30\") is the second studio album by American rapper Danny Brown. It was released on August 15, 2011, by Fool's Gold Records. The album's production was handled by Frank Dukes, Brandun DeShay, Skywlkr, Nick Speed, Quelle, Paul White, Squadda Bambino, and DJ House Shoes. The album's only guest appearances come from Brown's Bruiser Brigade cohorts Chips and Dopehead. XXX was released as a free download by Brooklyn, New York-based record label Fool's Gold Records. Brown cited XXX as his attempt at \"experimenting and seeing how far could push listeners\" with his music. Brown explains that .","dar":"Daniel Dewan Sewell (born March 16, 1981), best known by his stage name Danny Brown, is a hip-hop artist from the Dexter-Linwood area of Detroit, Michigan. He has been described by MTV as \"one of rap's most unique figures in recent memory\". Danny is an unconventional hip-hop artist who employs multiple flows and cadences, thus the moniker “The Hybrid”. His style varies from low pitched gravelly tones to a manic, high-pitched squawk. His lyrics often deal with the truth of living in Detroit: poverty, drug abuse, desperate circumstances, etc."},{"n":194,"year":2005,"ar":"Kanye West","ti":"Late Registration","cv":"https://dn710902.ca.archive.org/0/items/mbid-d6f9a7a4-d291-44a5-be15-66101e094190/mbid-d6f9a7a4-d291-44a5-be15-66101e094190-5638377094.jpg","rt":0.0,"sp":"","yt":"Gbsn6BcmXZo","gen":["hip hop","conscious hip hop","pop rap","Hip-Hop","Pop"],"hb":["alberto_gu"],"da":"Late Registration is the second studio album by American hip-hop artist Kanye West, released on August 30, 2005, by Roc-A-Fella Records and Def Jam Recordings. The album marked a significant artistic leap for West, showcasing a more ambitious and musically complex sound. Recording sessions were held over a year at several high-profile studios, including Record Plant, Chalice Recording Studios, and Grandmaster Recording Studios in Hollywood, as well as Sony Music Studios in New York City. To expand the sonic palette beyond his signature \"chipmunk soul\" sound, West enlisted film composer and producer Jon Brion, known for his work in orchestral .","dar":"Ye, born Kanye Omari West on June 8, 1977, is an American rapper, singer, songwriter, record producer, and fashion designer. He is one of the most prominent figures in hip hop, known for his diverse musical style and polarizing cultural and political commentary. After dropping out of college to pursue a career in music, West began producing for regional artists in the Chicago area. As an in-house producer for Roc-A-Fella Records, he co-produced albums including Jay-Z's The Blueprint (2001) before signing with the label as a recording artist."},{"n":100,"year":2004,"ar":"Kanye West","ti":"The College Dropout","cv":"https://dn721904.ca.archive.org/0/items/mbid-99a96bf6-8166-3b7c-97ed-ea525f13ec65/mbid-99a96bf6-8166-3b7c-97ed-ea525f13ec65-34245157344.jpg","rt":0.0,"sp":"","yt":"OTZzjAU0Kg0","gen":["hip hop","neo soul","conscious hip hop","pop rap","chipmunk soul","Hip-Hop"],"hb":[],"da":"\"The College Dropout\" is the debut studio album by American rapper Kanye West. It was released on February 10, 2004, through Roc-A-Fella Records and Def Jam Recordings. Prior to its release, West had gained recognition as a producer for artists such as Jay-Z and Talib Kweli, though he encountered resistance within the music industry to being accepted as a recording artist. After signing with Roc-A-Fella Records, he recorded the album over several years, beginning in 1999. Production on \"The College Dropout\" was primarily handled by West and reflects his early production style, often described as \"chipmunk soul\", characterized by sped-up .","dar":"Ye, born Kanye Omari West on June 8, 1977, is an American rapper, singer, songwriter, record producer, and fashion designer. He is one of the most prominent figures in hip hop, known for his diverse musical style and polarizing cultural and political commentary. After dropping out of college to pursue a career in music, West began producing for regional artists in the Chicago area. As an in-house producer for Roc-A-Fella Records, he co-produced albums including Jay-Z's The Blueprint (2001) before signing with the label as a recording artist."},{"n":78,"year":2004,"ar":"Dalek","ti":"Absence","cv":"https://dn721607.ca.archive.org/0/items/mbid-9f5a5b67-41d4-4671-8ee2-c2be2742aace/mbid-9f5a5b67-41d4-4671-8ee2-c2be2742aace-36796348316.jpg","rt":0.0,"sp":"","yt":"tXgM9T4mFbQ","gen":["industrial","dark ambient","hip hop","experimental hip hop","conscious hip hop","industrial hip hop"],"hb":[],"da":null,"dar":"This is an incorrect tag for Dälek. If this non-artist appears in your tags, please fix them."},{"n":98,"year":2000,"ar":"Common","ti":"Like Water for Chocolate","cv":"https://dn711307.ca.archive.org/0/items/mbid-0eaf3a43-f00e-4416-8ea3-759d1841e3c9/mbid-0eaf3a43-f00e-4416-8ea3-759d1841e3c9-4402657853.jpg","rt":0.0,"sp":"","yt":"ss5daRk7cMY","gen":["alternative hip hop","hip hop","neo soul","jazz rap","conscious hip hop","political hip hop"],"hb":[],"da":"Like Water for Chocolate is the fourth studio album by American hip hop rapper Common, released March 28, 2000 on MCA Records. It was a considerable critical and commercial breakthrough for Common, receiving generally favorable reviews from major magazine publications and selling 70,000 copies in its first week. The album was certified Gold on August 11, 2000 by the Recording Industry Association of America. According to Nielsen SoundScan, the album has sold 748,000 copies by March 2005. The video for \"The Light\" was frequently shown on MTV, adding to Common's exposure. The album also formally marked the formation of the .","dar":"Lonnie Rashid Lynn, Jr. (born March 13, 1972 in Chicago, Illinois), better known by his stage name Common (previously Common Sense), is a Grammy award winning rapper, author and actor known for lyrics that focus on love and spirituality. Many people describe him as being a conscious hip hop artist who makes songs that send a message. He debuted in 1992 with the album Can I Borrow a Dollar? and maintained a significant underground following into the late 90s"},{"n":22,"year":1999,"ar":"Mos Def","ti":"Black on Both Sides","cv":"https://dn721508.ca.archive.org/0/items/mbid-c53be6c2-1a17-4a4a-97e3-d40f61630236/mbid-c53be6c2-1a17-4a4a-97e3-d40f61630236-22927827729.png","rt":0.0,"sp":"","yt":"7e1wFEJx7PM","gen":["hip hop","east coast hip hop","conscious hip hop","Hip-Hop"],"hb":[],"da":"Black on Both Sides is the debut solo album of American rapper Mos Def, released October 12, 1999 on Rawkus Records. Black on Both Sides features an emphasis on live instrumentation and socially-conscious lyrics. On February 2, 2000, the album was certified Gold in sales by the Recording Industry Association of America (RIAA), following sales in excess of 500,000 copies. Talib Kweli (one-half of Black Star with Mos Def) and Busta Rhymes are the only main rappers to be featured on the album. Kweli raps the second and final verse of \"Know That\", while Busta goes back and forth with .","dar":"Dante Terrell Smith (born December 11, 1973 in Brooklyn, New York, United States), now known by the stage name Yasiin Bey (formerly Mos Def), is a Grammy Award-nominated rapper and actor. He now works under the nom de plum Yasiin Bey, and has performed under the aliases Mighty Mos Def, The Freaky Night Watchman, Boogie Man, Black Dante and Pretty Flaco. He began rapping in a group called Urban Thermo Dynamics in 1994, and then formed the duo Black Star with Talib Kweli in 1998."},{"n":10,"year":1996,"ar":"OutKast","ti":"ATLiens","cv":"https://cdn2.albumoftheyear.org/600x0/album/atliens-1.jpg","rt":0.0,"sp":"","yt":"CplOmO_lGco","gen":["alternative hip hop","hip hop","conscious hip hop","dirty south","abstract hip hop","southern hip hop"],"hb":["EliasJ72","Rocky_stereo","alberto_gu","sdecandelario"],"da":"ATLiens is the second studio album by American hip-hop duo OutKast, released on August 27, 1996, by LaFace Records. The duo sought to improve on their 1994 debut album Southernplayalisticadillacmuzik and gain respect for their burgeoning Southern hip-hop scene. ATLiens has been listed by several magazines and critics as one of the greatest hip-hop albums of all time. OutKast recorded ATLiens in sessions at several Atlanta studios—Bosstown Recording Studios, Doppler Recording Studios, PatchWerk Recording Studio, Purple Dragon Studios, and Studio LaCoCo—as well as Chung King Recording Studio and Sound On Sound Recording in New York City. The record features outer .","dar":"OutKast is an American hip-hop duo from Atlanta, Georgia, United States.  The duo is one of the most successful hip-hop groups of all time, having received six Grammy Awards.   Over 25 million copies have been sold of Outkast's seven releases: six studio albums—including one double album—and a greatest hits release. \n\nThe group's original musical style was a mixture of Dirty South and G-Funk.  Since then funk, soul, pop, electronic music, rock, spoken word poetry, jazz, and blues have been added to the group's musical palette."},{"n":66,"year":1996,"ar":"Ghostface Killah","ti":"Ironman","cv":"https://cdn2.albumoftheyear.org/600x0/album/7984-ironman_172609.jpg","rt":0.0,"sp":"","yt":"a74LEdZawLo","gen":["hip hop","east coast hip hop","conscious hip hop","boom bap","hardcore hip hop","abstract hip hop"],"hb":[],"da":"Ironman is the solo debut album by American hip hop artist and Wu-Tang Clan member Ghostface Killah, released October 29, 1996, on Epic Records. Though mainly produced by fellow group member RZA, the LP is slightly different to that of other first generation solo Wu-Tang albums, owing much of its thematic scope, mythology and samples from classic 1960s and 1970s blaxploitation films, as well as a wider range of soul samples. It is also notable for being considerably more open in its references to the Nation of Gods and Earths and the group's beliefs. Upon its release, Ironman debuted at .","dar":"Dennis Coles (born May 9, 1970), better known by his stage name Ghostface Killah, is an American rapper  and member of the Wu-Tang Clan. After the group achieved breakthrough success with their 1993 debut, Enter the Wu-Tang (36 Chambers) , the members went on to pursue solo careers to varying levels of success. Ghostface Killah debuted his solo-career in 1996 with Ironman, which was well received by music critics. He would continue his career, creating additional award-winning albums over the following years such as Supreme Clientele"},{"n":1,"year":1994,"ar":"Nas","ti":"Illmatic","cv":"https://dn710902.ca.archive.org/0/items/mbid-f00af81c-9249-49d0-b3f5-8b6725bd1900/mbid-f00af81c-9249-49d0-b3f5-8b6725bd1900-28008351580.jpg","rt":0.0,"sp":"","yt":"Ufc81wjxOyE","gen":["hip hop","jazz rap","east coast hip hop","conscious hip hop","boom bap","hardcore hip hop"],"hb":[],"da":"\"Illmatic\" is the debut studio album by American rapper Nas, released on April 19, 1994, through Columbia Records. Nas signed with the label with the assistance of MC Serch and recorded the album in 1992 and 1993 at Chung King Studios, D&D Recording, Battery Studios, and Unique Recording Studios in New York City. Production was handled by DJ Premier, Large Professor, Pete Rock, Q-Tip, L.E.S., and Nas himself. The album is characterized as a hardcore hip-hop record, featuring multi-syllabic internal rhymes and narratives inspired by Nas’ upbringing in the Queensbridge Houses in Queens, New York. Nas began writing lyrics for .","dar":"Nasir bin Olu Dara Jones, more commonly known as Nas (formerly Nasty Nas and Escobar), born September 14, 1973 in Crown Heights, Brooklyn, New York, is a prominent American MC. The son of jazz musician Olu Dara, he was raised in the infamous Queensbridge housing projects in Queensbridge, New York. According to the Nasty Songfacts, as a teenager rapper, Nasir  first went by the nickname Kid Wave before adopting his more commonly known alias of Nasty Nas."},{"n":4,"year":1993,"ar":"A Tribe Called Quest","ti":"Midnight Marauders","cv":"https://dn710707.ca.archive.org/0/items/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c/mbid-f2ab0d46-23e4-4fd4-a6f9-0e64508acf9c-9900302771.jpg","rt":0.0,"sp":"","yt":"CVKrrs5K9v0","gen":["alternative hip hop","hip hop","jazz rap","east coast hip hop","conscious hip hop","boom bap"],"hb":["Rocky_stereo","alberto_gu","paqueradejere","sdecandelario","verygooood"],"da":"Midnight Marauders is the third studio album by American hip hop group A Tribe Called Quest, released on November 9, 1993, by Jive Records. It had major commercial success and is regarded as one of the greatest albums in hip hop, as well as one of the the group's best. Recording sessions for the album occurred at Battery Studios, Platinum Island Studios and Scorcerer Sound in New York City. Its production was mainly handled by Q-Tip, with contributions from Skeff Anselm, Large Professor and the group's DJ, Ali Shaheed Muhammad. .","dar":"A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998"},{"n":84,"year":1992,"ar":"Ice Cube","ti":"The Predator","cv":"https://dn721606.ca.archive.org/0/items/mbid-c9950c2d-0f35-48cc-8a59-afa7933d0ddf/mbid-c9950c2d-0f35-48cc-8a59-afa7933d0ddf-10031621370.jpg","rt":0.0,"sp":"","yt":"bZP7ssNDsHY","gen":["hip hop","conscious hip hop","west coast hip hop","gangsta rap","hardcore hip hop","political hip hop"],"hb":[],"da":"The Predator is the third studio album by Ice Cube. Released within months of the 1992 Los Angeles riots, many songs comment on the racial tensions. The title is in part reference to the movie Predator 2, and the album itself includes samples from the film. Though not his most critically successful album, commercially The Predator is Ice Cube's most successful album, reaching double platinum status in the United States, and it contains his most well-known single, \"It Was a Good Day.\" The Predator is his only number one album on the Billboard 200 to date, selling 193,000 copies in .","dar":"O'Shea Jackson Sr. (born June 15, 1969), known professionally as Ice Cube, is an American rapper and actor. He began his career as a member of the hip-hop group C.I.A. and later joined the seminal rap group N.W.A (Niggaz Wit Attitudes). After leaving N.W.A in December 1989, he began both a successful solo music career and an acting career which included roles in films such as Boyz n the Hood (1991), Friday (1995), for which he also co-wrote the screenplay, and Barbershop (2002)."},{"n":5,"year":1991,"ar":"A Tribe Called Quest","ti":"The Low End Theory","cv":"https://dn710805.ca.archive.org/0/items/mbid-69959f4a-29fd-4867-83ec-bfb4036b30d1/mbid-69959f4a-29fd-4867-83ec-bfb4036b30d1-1672879787.jpg","rt":0.0,"sp":"","yt":"WyPwEm_lrHY","gen":["hip hop","jazz rap","east coast hip hop","conscious hip hop","boom bap","Jazz"],"hb":[],"da":"The Low End Theory is the classic second album by American hip-hop group A Tribe Called Quest. Released on September 24, 1991 through Jive Records, the album produced three singles; \"Check the Rhime\", \"Jazz (We've Got)\", and \"Scenario\", and stands as one of hip-hop’s greatest and most influential albums of all time. After A Tribe Called Quest's debut album People's Instinctive Travels and the Paths of Rhythm, Jarobi White left the group to study culinary art. Phife Dawg learned that he was diabetic a month after the album's release and after a discussion with fellow member Q-Tip, they agreed to .","dar":"A Tribe Called Quest was an American hip-hop group formed in St. Albans, Queens, New York, in 1985, originally composed of rapper and main producer Q-Tip, rapper Phife Dawg, DJ and co-producer Ali Shaheed Muhammad, and rapper Jarobi White. The group is regarded as a pioneer of alternative hip hop music.\n\nIn 1991, the group released its jazz-influenced second album, The Low End Theory, regarded for helping shape alternative hip hop in the 1990s. In 1998"},{"n":40,"year":1991,"ar":"De La Soul","ti":"De La Soul Is Dead","cv":"https://dn710309.ca.arc const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
