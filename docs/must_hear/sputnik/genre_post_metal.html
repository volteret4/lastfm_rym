<!DOCTYPE html>

<head>

<title>post-metal — Sputnikmusic Best Albums</title>
<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":181,"year":2023,"ar":"Svalbard","ti":"The Weight of the Mask","cv":"https://dn721600.ca.archive.org/0/items/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb-36919906357.jpg","rt":0.0,"sp":"","yt":"3wHl7suYkAM","gen":["metal","post-hardcore","shoegaze","post-rock","post-metal","Metal"],"hb":[],"da":null,"dar":"There are several bands called Svalbard.\n\n1)  An English hardcore punk band from Bristol, formed in 2011\n2) a metal band from Silesia, Poland\n3) a martial/darkwave band from Homel, Belarus.\n\n1] Svalbard are an English hardcore punk band from Bristol, formed in 2011. Following early material (compiled on the album Discography 2012–2014) they have released four studio albums: One Day All This Will End (2015), It's Hard to Have Hope (2018), When I Die, Will I Get Better? (2020), The Weight of The Mask (2023)."},{"n":28,"year":2022,"ar":"Rolo Tomassi","ti":"Where Myth Becomes Memory","cv":"https://dn710109.ca.archive.org/0/items/mbid-aef4d4df-0f18-45c6-aea0-0d70fb91743f/mbid-aef4d4df-0f18-45c6-aea0-0d70fb91743f-31903332283.jpg","rt":0.0,"sp":"","yt":"yL4VHwXI7_I","gen":["progressive rock","instrumental rock","math rock","post-metal","mathcore","Metal"],"hb":[],"da":null,"dar":"Rolo Tomassi is a British experimental mathcore band from Stocksbridge, Sheffield.\n\nFormed in 2005, they set their local scene alight by playing a synth-driven technical mix of styles and genres difficult to define in a single word. The band's name was taken from the movie L.A. Confidential. They are known for their strong DIY ethic and chaotic live performances. \n\nThe band is currently signed to MNRK Heavy. They released two albums on Hassle Records: Hysterics (2008) and the Diplo-produced Cosmology (2010)."},{"n":49,"year":2013,"ar":"Deafheaven","ti":"Sunbather","cv":"https://dn710105.ca.archive.org/0/items/mbid-22f1d5cc-61a7-4976-975b-bf123e685fb9/mbid-22f1d5cc-61a7-4976-975b-bf123e685fb9-6186723462.jpg","rt":0.0,"sp":"","yt":"GfbLWHT7vUU","gen":["shoegaze","post-rock","post-metal","blackgaze","screamo","Metal"],"hb":["EliasJ72","Frikomid","Nubis84","Rocky_stereo","paqueradejere","sdecandelario","verygooood"],"da":"'Sunbather' is the second studio album by the American Blackgaze band Deafheaven. The Jack Shirley-produced album was released on June 11, 2013 through Deathwish Inc. 'Sunbather' was recorded in January 2013. The cover artwork for 'Sunbather' was designed by Nick Steinhardt of Touché Amoré who also designed the band's 2011 debut album Roads to Judah. The pink and orange colors on the cover are meant to resemble the color seen on the inside of one's eyelids when laying in the sun. The inspiration to have the title \"Sunbather\" written out in a simple, block formation was drawn from Pulp's 2001 .","dar":"Deafheaven are an American Blackgaze band formed in 2010. Originally based in San Francisco, the group began as a two-piece with singer George Clarke and guitarist Kerry McCoy, who recorded and self-released a demo album together. Following its release, Deafheaven recruited three new members and began to tour. Before the end of 2010, the band signed to Deathwish Inc. and later released their debut album Roads to Judah, in April 2011. They established a unique style blending black metal, shoegaze, and post-rock, among other influences."},{"n":78,"year":2011,"ar":"Ulcerate","ti":"The Destroyers of All","cv":"https://dn711004.ca.archive.org/0/items/mbid-a3ab579d-62b8-4470-9695-b81b3b7fffb1/mbid-a3ab579d-62b8-4470-9695-b81b3b7fffb1-23172077075.jpg","rt":0.0,"sp":"","yt":"LO_kjQnJtfo","gen":["atmospheric sludge metal","post-metal","sludge metal","death metal","technical death metal","dissonant death metal"],"hb":[],"da":"The Destroyers of All is the third full-length album by New Zealand death metal band Ulcerate. The album received positive reviews from critics. Allmusic's Phil Freeman described Ulcerate's approach as \"very adventurous\", calling The Destroyers of All \"an album fans of progressive, forward-looking metal will find very satisfying indeed\" in his review, awarding the album four out of a possible five stars. Freeman also argued that, though the band primarily play death metal, they owe \"more to Isis and Meshuggah than Morbid Angel or Cannibal Corpse\". .","dar":"Auckland, New Zealand-based unorthodox death metal act Ulcerate was formed by guitarist Michael Hoggard and drummer Jamie Saint Merat in 2000, with the aim of creating dark oppressive death metal.  This focus has since developed and metamorphosed into a far more dynamic approach with a fully realised sense of atmosphere and mood, while furthering their foray into the darker end of the genre’s spectrum.  The band has remained DIY where possible, handling all facets of album production and visual design."},{"n":7,"year":2006,"ar":"Cult of Luna","ti":"Somewhere Along the Highway","cv":"https://dn721200.ca.archive.org/0/items/mbid-1fde8540-59cf-4c8d-8429-eb076d03fb05/mbid-1fde8540-59cf-4c8d-8429-eb076d03fb05-21557052063.png","rt":0.0,"sp":"","yt":"5eqnHb1XEHM","gen":["atmospheric sludge metal","post-metal","sludge metal","rock","Metal"],"hb":[],"da":null,"dar":"Cult of Luna is an atmospheric sludge/doom metal/post-metal/post-hardcore band formed in 1998 in Umeå, Sweden by guitarist/vocalist Johannes Persson and vocalist Klas Rydberg, after the Swedish hardcore band Eclipse broke up. It began as a traditional sludge band and has slowly integrated greater degrees of post-rock into its sound.  After some member hunting and rehearsals CoL had its first line-up consisting of: Klas Rydberg, Johannes Persson, Magnus Lindberg, Erik Olofsson and Fredrik Renstrom."},{"n":8,"year":2006,"ar":"Agalloch","ti":"Ashes Against the Grain","cv":"https://dn721806.ca.archive.org/0/items/mbid-1dd278bb-11ca-32ee-8ba5-711ddaf871a1/mbid-1dd278bb-11ca-32ee-8ba5-711ddaf871a1-1122863191.jpg","rt":0.0,"sp":"","yt":"B1x8q64NXxA","gen":["doom metal","post-metal","black metal","atmospheric black metal","dark folk","folk metal"],"hb":[],"da":"Ashes Against the Grain is an album by American metal band Agalloch under the Brooklyn, New York-based label, The End Records. It is Agalloch's third full-length release, four years after the critically acclaimed The Mantle. Before the release, the track \"Falling Snow\" was made available in its entirety on the label's website and on the band's MySpace page. Reports indicate a version of the album was leaked on the web in May 2006. A pre-release review in the July 2006 issue of Toronto-based Exclaim! magazine described the new album as a \"departure and an extension\" from the band's previous work: .","dar":"Agalloch is an American folk doom metal band formed in Portland, Oregon, United States in 1995.\n\nAfter two demo releases in the late 1990’s the band released three full-length albums: Pale Folklore (1999), The Mantle (2002), and Ashes Against the Grain (2006). “The Mantle” has since been heralded as a classic for having been one of the first albums to combine elements from black metal, neo-folk, progressive rock, post-rock, and ambient music. The influence of this record can be heard in the music of multiple “post-black metal” bands."},{"n":4,"year":2005,"ar":"Rosetta","ti":"The Galilean Satellites","cv":"https://dn711007.ca.archive.org/0/items/mbid-fb40f9a6-7175-4405-86fc-8f528907db14/mbid-fb40f9a6-7175-4405-86fc-8f528907db14-18650273725.png","rt":0.0,"sp":"","yt":"rzl3Os4jw2E","gen":["atmospheric sludge metal","post-metal","Metal"],"hb":[],"da":null,"dar":"Philadelphia quartet Rosetta push the boundaries between post-hardcore, sludge, post-metal, progressive rock, post-rock, ambient, drone, noise, shoegaze and space rock, with influences as diverse as Neurosis, Isis, My Bloody Valentine, Frodus, and Stars of the Lid. The band somewhat humorously self-describes its music as \"metal for astronauts\", and its members are very interested in astronomy and space travel. Their first album (The Galilean Satellites"},{"n":2,"year":2002,"ar":"Agalloch","ti":"The Mantle","cv":"https://dn721505.ca.archive.org/0/items/mbid-a590708e-1907-47ee-814b-8a3745d7b6fc/mbid-a590708e-1907-47ee-814b-8a3745d7b6fc-1122743860.jpg","rt":0.0,"sp":"","yt":"INgo0xmYBeg","gen":["doom metal","post-metal","black metal","atmospheric black metal","dark folk","folk metal"],"hb":[],"da":"The Mantle is Agalloch's second full-length album. It was recorded between November 2001 and April 2002, and released by The End Records in August of 2002. \"Trudging Through Deep Snow\" sample created by Aaron Sholes and Neta Smollack. The cover art is a picture of the Thompson Elk sculpture in Portland, Oregon. .","dar":"Agalloch is an American folk doom metal band formed in Portland, Oregon, United States in 1995.\n\nAfter two demo releases in the late 1990’s the band released three full-length albums: Pale Folklore (1999), The Mantle (2002), and Ashes Against the Grain (2006). “The Mantle” has since been heralded as a classic for having been one of the first albums to combine elements from black metal, neo-folk, progressive rock, post-rock, and ambient music. The influence of this record can be heard in the music of multiple “post-black metal” bands."},{"n":5,"year":2000,"ar":"Deftones","ti":"White Pony","cv":"https://dn721900.ca.archive.org/0/items/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679-18321083736.png","rt":0.0,"sp":"","yt":"v1npHeOskdQ","gen":["metal","post-hardcore","shoegaze","alternative metal","post-metal","nu metal"],"hb":[],"da":"White Pony is the third studio album by American alternative metal band Deftones, released on June 20, 2000, through Maverick Records. It was produced by Terry Date, who produced the band's first two albums, Adrenaline and Around the Fur. Recording sessions took place between August and December 1999 at Larrabee Sound Studios in West Hollywood and The Plant Recording Studios in Sausalito, California. The album marked a significant growth in the band's sound, incorporating influences from post-hardcore, trip-hop, shoegaze, progressive rock, and post-rock into the alternative metal sound which they had become known for. White Pony was also the first .","dar":"Deftones is an American metal band from Sacramento, California, formed in 1988, consisting of Chino Moreno (lead vocals and guitar), Stephen Carpenter (guitar), Frank Delgado (keyboards and turntables), and Abe Cunningham (drums and percussion). Vega (formerly of Quicksand) took on bass duties from mid-2009 to ca. 2021 in substitution for Chi Cheng, who was seriously injured in an automobile accident in Santa Clara, California on November 4, 2008."},{"n":92,"year":1992,"ar":"Godflesh","ti":"Pure","cv":"https://dn721804.ca.archive.org/0/items/mbid-93ad6ea1-6be8-4541-8d1d-524c83fc7aeb/mbid-93ad6ea1-6be8-4541-8d1d-524c83fc7aeb-32957764185.jpg","rt":0.0,"sp":"","yt":"oYA_eDX4Bbs","gen":["industrial","industrial metal","post-metal","sludge metal","dark ambient","rock"],"hb":["paqueradejere","sdecandelario"],"da":null,"dar":"Godflesh is an industrial metal band from Birmingham, England, formed in 1988 by Justin Karl Broadrick (guitar, vocals, and programming) and G. C. Green (bass). They are highly regarded as one of the founders of industrial metal. The group disbanded in 2002 but reformed in 2010, appearing in few festivals and starting to produce a new studio album.\n\nIn 1988, Broadrick contacted Green about reforming Fall of Because, who fell apart in 1987. Justin decided to take over on guitars"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
