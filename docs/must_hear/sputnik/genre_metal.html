<head>

<title>metal — Sputnikmusic Best Albums</title>
<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":47,"year":2025,"ar":"Imperial Triumphant","ti":"Goldstar","cv":"https://dn710604.ca.archive.org/0/items/mbid-c42777f4-2c44-4a18-b6be-ff309888107b/mbid-c42777f4-2c44-4a18-b6be-ff309888107b-40959655508.jpg","rt":0.0,"sp":"","yt":"v9cDvwwbj6A","gen":["metal","avant-garde metal","dissonant death metal","Metal","Jazz"],"hb":[],"da":"Goldstar is the sixth studio album by American experimental metal band Imperial Triumphant. It was released on March 21, 2025 through Century Media Records. In 2024, Imperial Triumphant released the album's first two singles, “Eye of Mars” on September 19 and “Hotel Sphinx” on November 13. The release of “Hotel Sphinx” coincided with the announcement of their sixth album, Goldstar, which would be released in March 2025. On January 16, 2025, the band released the third single “Lexington Delirium”, featuring Tomas Haake of Meshuggah, along with revealing more details about Goldstar. “Pleasuredome”, featuring Dave Lombardo and Meshuggah’s Tomas Haake, was .","dar":"Born in the metropolis: Imperial Triumphant embodies the sounds of New York. The chaos, the menagerie, the perils and majesty of the greatest city on earth. We portray this great juxtaposition between high society homoeroticism coexisting with absolute filth and urban decay. Our city is like the corpse of a giant. What was once so bright, grand and spectacular, is now filled with greedy maggots writhing towards their share of 'success'. We don't support it nor are we against. We only play the sounds of the New York City as we hear them."},{"n":2,"year":2024,"ar":"Blood Incantation","ti":"Absolute Elsewhere","cv":"https://cdn2.albumoftheyear.org/600x0/album/997344-absolute-elsewhere_141614.jpg","rt":0.0,"sp":"","yt":"xVs7Id74Y7s","gen":["metal","progressive metal","death metal","Metal"],"hb":[],"da":"Absolute Elsewhere is the fourth studio album by Blood Incantation, released on October 4, 2024. It was recorded during the summer of 2023 at Hansa Tonstudio in Berlin. .", on a world tour from the month of the album's release. \"Invincible Shield\" track listing: 01. Panic Attack 02. The Serpent And The King 03. Invincible Shield 04. Devil In Disguise 05. Gates Of Hell 06. Crown Of Horns 07. As God Is My Witness 08. Trial By Fire 09. Escape From Reality .","dar":"Judas Priest is an English heavy metal band formed in Birmingham in 1969. They have sold over 50 million albums and are considered a significant influence within the heavy metal genre. The band has been associated with the new wave of British heavy metal movement and has influenced various metal subgenres, including speed metal, thrash metal, and power metal, as well as aspects of the hard rock and glam metal scenes of the 1980s. Despite producing innovative music in the latter half of the 1970s"},{"n":181,"year":2023,"ar":"Svalbard","ti":"The Weight of the Mask","cv":"https://dn721600.ca.archive.org/0/items/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb/mbid-2d9b3237-313a-49ca-8260-73daaf7c65eb-36919906357.jpg","rt":0.0,"sp":"","yt":"3wHl7suYkAM","gen":["metal","post-hardcore","shoegaze","post-rock","post-metal","Metal"],"hb":[],"da":null,"dar":"There are several bands called Svalbard.\n\n1)  An English hardcore punk band from Bristol, formed in 2011\n2) a metal band from Silesia, Poland\n3) a martial/darkwave band from Homel, Belarus.\n\n1] Svalbard are an English hardcore punk band from Bristol, formed in 2011. Following early material (compiled on the album Discography 2012–2014) they have released four studio albums: One Day All This Will End (2015), It's Hard to Have Hope (2018), When I Die, Will I Get Better? (2020), The Weight of The Mask (2023)."},{"n":29,"year":2022,"ar":"Chat Pile","ti":"God's Country","cv":"https://dn710109.ca.archive.org/0/items/mbid-79517f7a-3219-4b44-8b9b-312f97c49fdd/mbid-79517f7a-3219-4b44-8b9b-312f97c49fdd-33185469465.jpg","rt":0.0,"sp":"","yt":"E0YQ2F_ejnY","gen":["noise rock","post-punk","metal","post-hardcore","industrial metal","pigfuck"],"hb":[],"da":"God's Country is the debut studio album by American sludge metal band Chat Pile. The album was released on July 29, 2022 through The Flenser Records. The album peaked at No. 21 on the Apple Music Chart and was tagged as a \"Best New Music\" album by Pitchfork. .","dar":"Chat Pile is a sludgy noise rock band from Oklahoma, formed in February of 2019. The band members are Raygun Busch (vocals), Luther Manhole (Guitars), Stin (Bass), and Captain Ron (Drums)."},{"n":109,"year":2022,"ar":"Scarcity","ti":"Aveilut","cv":"https://ia801402.us.archive.org/20/items/mbid-de89761e-1b7f-40fd-8973-7038d0c828f6/mbid-de89761e-1b7f-40fd-8973-7038d0c828f6-33285912304.jpg","rt":0.0,"sp":"","yt":"JvgCwibMdQI","gen":["drone","metal","black metal","atmospheric black metal","avant-garde metal","dissonant black metal"],"hb":[],"da":null,"dar":"Scarcity is an experimental black metal project from composer/guitarist Brendon Randall-Myers and vocalist Doug Moore."},{"n":4,"year":2016,"ar":"Vektor","ti":"Terminal Redux","cv":"https://dn711000.ca.archive.org/0/items/mbid-655c7505-eef3-462c-b39e-13d8a9b619df/mbid-655c7505-eef3-462c-b39e-13d8a9b619df-44538383065.jpg","rt":0.0,"sp":"","yt":"qMCsv-zj56s","gen":["metal","progressive metal","technical thrash metal","thrash metal","rock","Metal"],"hb":[],"da":"Terminal Redux is the third album by the American progressive thrash metal band Vektor, released on May 6, 2016. It is the band's first album released on Earache Records. .","dar":"Vektor is a progressive thrash metal band, originally formed in Arizona in 2004 but relocated to Philadelphia in mid-2012 and currently based there. They released their debut full length \"Black Future\" in November 2009, and the follow up \"Outer Isolation\" in December 2011 (both on Heavy Artillery Records, now defunct). These albums were re-released when the band joined Earache Records, and the band continued sporadically performing and touring in 2012 and 2013 with the likes of Napalm Death"},{"n":63,"year":2014,"ar":"Thou","ti":"Heathen","cv":"https://dn711200.ca.archive.org/0/items/mbid-1499ebc5-37da-4fcd-a97b-ad925b326fea/mbid-1499ebc5-37da-4fcd-a97b-ad925b326fea-27952413825.jpg","rt":0.0,"sp":"","yt":"J9FPhpuNrwg","gen":["punk","doom metal","metal","sludge metal","Metal"],"hb":[],"da":null,"dar":"Thou is a doom/sludge/drone metal band from Baton Rouge and New Orleans, Louisiana, USA. Their lyrics deal mostly with social decay, death and general despair.  All of their recorded music, after a period of time, is posted for free on Bandcamp or here \n\nDespite having only released six full-lengths —  Tyrant, Peasant, Summit, Heathen, Magus, and Umbilical — Thou have an extensive and varied discography. The band have released several EPs, including"},{"n":45,"year":2005,"ar":"Corrupted","ti":"El Mundo Frio","cv":"https://dn711002.ca.archive.org/0/items/mbid-78abaae9-0305-4239-b27c-b0dba4ddb6b6/mbid-78abaae9-0305-4239-b27c-b0dba4ddb6b6-27838608221.jpg","rt":0.0,"sp":"","yt":"ODJdbxihGhg","gen":["doom metal","metal","drone metal","sludge metal","Metal"],"hb":[],"da":null,"dar":"There are at least two bands named Corrupted:\n\n1) Corrupted is a sludge / drone doom metal band formed in 1994 in Osaka, Japan. Their sound is characterized by incredibly downtuned guitars and bass playing slow, minimalist riffs under deep layers of feedback. The vocals are harsh guttural grunts, and the music alternates between long instrumental sections and sections with vocals which go for long periods of time without rest. They are considered by most familiar with the genre to be one of the heaviest and darkest doom metal bands of all."},{"n":45,"year":2004,"ar":"Meshuggah","ti":"I","cv":"https://dn710809.ca.archive.org/0/items/mbid-4960ba68-776f-4597-8f1f-91c9914ddaa6/mbid-4960ba68-776f-4597-8f1f-91c9914ddaa6-34748543865.jpg","rt":0.0,"sp":"","yt":"7m7AGT80VQk","gen":["metal","alternative metal","progressive metal","death metal","djent","Metal"],"hb":["BipolarMuzik"],"da":"I is the one-song-EP which runs for 21 minutes. Meshuggah followed up I with Catch Thirty-Three which is also a single song (this time clocking in at over 45 minutes) but separated into 13 different tracks. The song can be split into three definite sections, each representing a different style of Meshuggah’s past playing. The use of breakdowns separates the song into heavier and less heavy parts. By using this method the song can change style very often. .","dar":"Meshuggah is a Swedish extreme metal band formed in Umeå in 1987. Since 2004, the lineup has consisted of founding members Jens Kidman (lead vocals) and Fredrik Thordendal (lead guitar), alongside Mårten Hagström (rhythm guitar), Tomas Haake (drums), and Dick Lövgren (bass). The band has released nine studio albums, six EPs, and eight music videos, with their most recent studio album, \"Immutable,\" released in April 2022 via Atomic Fire Records."},{"n":110,"year":2002,"ar":"Nile","ti":"In Their Darkened Shrines","cv":"https://dn710704.ca.archive.org/0/items/mbid-7759d78d-8f40-4197-b602-1297e1ffeea1/mbid-7759d78d-8f40-4197-b602-1297e1ffeea1-9692575203.jpg","rt":0.0,"sp":"","yt":"pLTwEUAKY2Y","gen":["metal","death metal","technical death metal","Metal"],"hb":[],"da":"In Their Darkened Shrines is the third studio album by American death metal band Nile. It was released on August 20, 2002 through Relapse Records. The lyrics to In Their Darkened Shrines IV: Ruins are borrowed from the H. P. Lovecraft short story, \"The Nameless City\". These lyrics are not actually spoken in the song, as it is an instrumental. Along with In Their Darkened Shrines I: Hall of Saurian Entombment, the lyrics are supplementary to the theme of the instrumental. The two main melodies of Unas Slayer Of The Gods are a tribute to Gothic Stone/The Well of Souls .","dar":"There are multiple artists with this name;\n\n1) Nile is an American technical death metal band from Greenville, South Carolina, United States, formed in 1993. Their music and lyrics are inspired by Ancient Egyptian and Near Eastern mysticism, history, religion, and ancient art, as well as the works of H.P. Lovecraft. Nile formed in their hometown of Greenville in 1993, from the ashes of a previous band, Morriah, in which Karl Sanders played since the 1980s."},{"n":3,"year":2000,"ar":"Immolation","ti":"Close to a World Below","cv":"https://dn721908.ca.archive.org/0/items/mbid-cc408040-36b1-3379-9ebf-32cf13966267/mbid-cc408040-36b1-3379-9ebf-32cf13966267-33742460910.jpg","rt":0.0,"sp":"","yt":"vqUUA1I25aw","gen":["metal","death metal","rock","Metal"],"hb":["Lonsonxd"],"da":"Close to a World Below is the fourth album by Immolation. It was released via Metal Blade Records in 2000. Since its release, Close to a World Below has received universal acclaim. Todd Nief of AllMusic gave the Close to a World Below four and a half stars, calling the album a late-career classic. He stated that with Close to a World Below, Immolation released one of the most profound and creative death metal albums of the 2000s which gave a new voice to a genre deluged with cookie-cutter clones. Metal Storm gave Close to a World Below a near-perfect .","dar":"Immolation is a death metal band from Yonkers, New York. They were formed in 1986 as Rigor Mortis. The name was changed to Immolation in late 1987, between the \"Warriors of Doom\" demo which was done as Rigor Mortis and \"Demo I\" which was done as Immolation. The band recorded 4 songs on the \"Demo II\" 1989 sessions, but only 3 were finally released: \"Internal decadence\", \"Burial Ground\" and \"Despondent Souls\". The remaining song is \"Infectious Blood\" (later re-named \"Fall in Disease\" on the \"Dawn of Possession\" Album)."},{"n":5,"year":2000,"ar":"Deftones","ti":"White Pony","cv":"https://dn721900.ca.archive.org/0/items/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679/mbid-3e6f3668-2f0d-440e-a32b-954c7bf22679-18321083736.png","rt":0.0,"sp":"","yt":"v1npHeOskdQ","gen":["metal","post-hardcore","shoegaze","alternative metal","post-metal","nu metal"],"hb":[],"da":"White Pony is the third studio album by American alternative metal band Deftones, released on June 20, 2000, through Maverick Records. It was produced by Terry Date, who produced the band's first two albums, Adrenaline and Around the Fur. Recording sessions took place between August and December 1999 at Larrabee Sound Studios in West Hollywood and The Plant Recording Studios in Sausalito, California. The album marked a significant growth in the band's sound, incorporating influences from post-hardcore, trip-hop, shoegaze, progressive rock, and post-rock into the alternative metal sound which they had become known for. White Pony was also the first .","dar":"Deftones is an American metal band from Sacramento, California, formed in 1988, consisting of Chino Moreno (lead vocals and guitar), Stephen Carpenter (guitar), Frank Delgado (keyboards and turntables), and Abe Cunningham (drums and percussion). Vega (formerly of Quicksand) took on bass duties from mid-2009 to ca. 2021 in substitution for Chi Cheng, who was seriously injured in an automobile accident in Santa Clara, California on November 4, 2008."},{"n":111,"year":1997,"ar":"Corrupted","ti":"Paso Inferior","cv":"https://dn710906.ca.archive.org/0/items/mbid-22ba1f22-ce79-43f6-8d01-703ae5f08feb/mbid-22ba1f22-ce79-43f6-8d01-703ae5f08feb-3927438701.jpg","rt":0.0,"sp":"","yt":"JOhMSqhCxNU","gen":["drone","metal","drone metal","sludge metal","Metal"],"hb":[],"da":null,"dar":"There are at least two bands named Corrupted:\n\n1) Corrupted is a sludge / drone doom metal band formed in 1994 in Osaka, Japan. Their sound is characterized by incredibly downtuned guitars and bass playing slow, minimalist riffs under deep layers of feedback. The vocals are harsh guttural grunts, and the music alternates between long instrumental sections and sections with vocals which go for long periods of time without rest. They are considered by most familiar with the genre to be one of the heaviest and darkest doom metal bands of all."},{"n":17,"year":1994,"ar":"Burzum","ti":"Hvis Lyset Tar Oss","cv":"https://dn710608.ca.archive.org/0/items/mbid-68554dfc-2560-46a0-888a-97171661c935/mbid-68554dfc-2560-46a0-888a-97171661c935-7002464164.jpg","rt":0.0,"sp":"","yt":"Z2TlkRa-N1Q","gen":["metal","dark ambient","black metal","atmospheric black metal","dungeon synth","Metal"],"hb":["Frikomid","Nubis84","alberto_gu","sdecandelario"],"da":"\"Hvis lyset tar oss\" (Norwegian for \"if the light takes us\") is the third studio album by the Norwegian black metal artist Burzum. It was recorded in September 1992, but not released until May 1994. This album is considered a classic in the black metal scene. The album cover features a drawing by 19th century artist Theodor Kittelsen titled \"Fattigmannen\" (The Pauper). Promotional copies sent around to fanzines had a slightly different tracklisting. The song \"Et hvitt lys over skogen\" (\"a white light over the forest\") was replaced by \"Tomhet\" (\"emptiness\") on the final release. .","dar":"Burzum was a Norwegian black metal music project founded by Varg Vikernes in 1991. Although Burzum never played live performances, it became a part of the early Norwegian black metal scene and is considered one of the most influential acts in black metal's history. Vikernes has also released four dark ambient and neofolk albums. The word \"burzum\" means \"darkness\" in the black speech, a fictional language crafted by The Lord of the Rings writer J. R."},{"n":17,"year":1992,"ar":"Sepultura","ti":"Arise","cv":"https://dn710907.ca.archive.org/0/items/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057/mbid-2f50a496-9417-4e65-9f96-1d1758f6a057-19192586880.jpg","rt":0.0,"sp":"","yt":"XLaArdvo9-U","gen":["heavy metal","metal","alternative metal","progressive metal","death metal","thrash metal"],"hb":["Lonsonxd","sdecandelario"],"da":"Arise is the fourth studio album by Brazilian thrash metal band Sepultura, released in 1991 through Roadrunner Records. Upon its release, the album received top reviews from heavy metal magazines such as Rock Hard, Kerrang! and Metal Forces. Arise is considered Sepultura's finest hour among longtime fans. While the music on Arise was mostly in the same death/thrash style as their previous album, Beneath the Remains, it was clear that the Sepultura sound was acquiring an experimental edge. The album presented their first incursions with industrial music, hardcore punk and latin percussion. The tour (1990-1992) that supports the album has .","dar":"Sepultura (Portuguese word for \"Grave\") is a Brazilian metal band from Belo Horizonte. Formed in 1984 by brothers Max and Igor Cavalera, the band was a major force in the groove metal, thrash metal, and death metal genres during the late 1980s and early 1990s, with their later experiments drawing influence from alternative metal, world music, nu metal, hardcore punk, and industrial metal. Sepultura has also been credited as one of the second wave of thrash metal acts from the late 1980s and early-to-mid 1990s."},{"n":2,"year":1992,"ar":"Alice in Chains","ti":"Dirt","cv":"https://dn710800.ca.archive.org/0/items/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf-9835602113.jpg","rt":0.0,"sp":"","yt":"19CXYQhqVu0","gen":["alternative rock","hard rock","heavy metal","doom metal","metal","grunge"],"hb":["Lonsonxd","sdecandelario","verygooood"],"da":"Dirt is the second studio album by the American rock band Alice in Chains and was released on September 29, 1992 through Columbia Records. Peaking at number six on the Billboard 200, the album was well received by music critics and has since been certified four-times platinum by the RIAA. It is nowadays considered as one of the best grunge/heavy metal albums and is usually on many \"Must have\" lists. The album spawned five singles: \"Would?\", \"Them Bones\", \"Angry Chair\", \"Rooster\", and \"Down in a Hole\". The songs on the album focused on depression, drug use, war, death, and other .","dar":"Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style"},{"n":3,"year":1992,"ar":"Rage Against the Machine","ti":"Rage Against the Machine","cv":"https://dn710909.ca.archive.org/0/items/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7/mbid-389a60bf-e586-4dc3-b995-fe196c5cf0f7-33270800624.jpg","rt":0.0,"sp":"","yt":"MAnsR_7VYKQ","gen":["alternative rock","metal","alternative metal","funk metal","rap metal","political hip hop"],"hb":[],"da":"Rage Against the Machine is the debut album by rock band Rage Against the Machine, released November 3, 1992. The songs on Rage Against the Machine tend to feature political mantras with the vocals rapped. The album peaked at #1 on Billboard's Heatseekers chart, and at #45 on the Billboard Top 200 chart. Tom Morello's guitar soloing is somewhat traditional on this album, taking influence more from heavy metal music, in comparison to later releases where it is more experimental and geared toward emulation of DJs and hip hop. In 2001 Q magazine named Rage Against the Machine as one .","dar":"Rage Against the Machine was an American rock band from Los Angeles, California. Formed in 1991, the group consisted of vocalist Zack de la Rocha, bassist and backing vocalist Tim Commerford, guitarist Tom Morello, and drummer Brad Wilk. Their songs express revolutionary left-wing political views. As of 2010, they had sold over 16 million records worldwide. In 2023, the band was inducted into the Rock and Roll Hall of Fame.\n\nRage Against the Machine released its eponymous debut album in 1992 to commercial and critical success"},{"n":55,"year":1992,"ar":"Pantera","ti":"Vulgar Display of Power","cv":"https://dn710300.ca.archive.org/0/items/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5/mbid-ffcec0de-d12e-3677-9607-4ece6d5c97a5-7967409791.jpg","rt":0.0,"sp":"","yt":"8hu6xDPcNlE","gen":["heavy metal","metal","alternative metal","groove metal","thrash metal","rock"],"hb":[],"da":"Vulgar Display of Power is the sixth studio album by the American heavy metal band Pantera, released on February 25, 1992 through Atco Records. One of the most influential heavy metal albums of the 1990s, Vulgar Display of Power has been described as \"one of the defining albums of the groove-metal genre.\" Several songs from this release have become some of the band's best known, such as \"Mouth for War,\" \"A New Level,\" \"Walk,\" \"Fucking Hostile,\" \"This Love,\" and \"No Good (Attack the Radical).\" Background: The band's 1990 major label debut, Cowboys from Hell, demonstrated a change in their musical .","dar":"Pantera is an American heavy metal band from Arlington, Texas, formed in 1981 and active until 2003. Two members from the band's best-known lineup, vocalist Phil Anselmo and bassist Rex Brown, revived the band with touring musicians Zakk Wylde and Charlie Benante beginning in 2022. The group was founded by the Abbott brothers (drummer Vinnie Paul and guitarist Dimebag Darrell). Brown and Anselmo joined in 1982 and 1986 respectively. In addition to their development and popularization of the groove metal subgenre"},{"n":1,"year":1991,"ar":"Death","ti":"Human","cv":"https://dn721602.ca.archive.org/0/items/mbid-3101ec0b-94c8-4cc2-8079-ae786ba5e838/mbid-3101ec0b-94c8-4cc2-8079-ae786ba5e838-31324237474.jpg","rt":0.0,"sp":"","yt":"EzvtfbqJeIY","gen":["metal","progressive metal","death metal","technical death metal","Metal"],"hb":["Lonsonxd","Nubis84","sdecandelario"],"da":"This album, released in 1991, was a major step up for this rapidly evolving death metal outfit. Rich with complicated riffs and beats Human's emphasis is really on technique. Paul Masvidal (guitar) and Sean Reinert (drums) from Cynic surely helped on creating the unique sound of this album. .","dar":"There are multiple artists sharing the name Death; \n\n1) A pioneering death metal band from Altamonte Springs, Florida, U.S. \n2) A protopunk band from Detroit, Michigan, U.S. \n3) A horrorcore rapper from New Orleans, Louisiana, U.S. \n4) A hard techno producer from Germany. \n\n1)  Death was an American death metal band formed in Altamonte Springs, Florida in 1984 by guitarist and vocalist Chuck Schuldiner. Death is considered to be among the most influential"},{"n":1,"year":1990,"ar":"Megadeth","ti":"Rust in Peace","cv":"https://dn710907.ca.archive.org/0/items/mbid-e68c6a5e-0773-4b5c-bb66-b6f032bb2db4/mbid-e68c6a5e-0773-4b5c-bb66-b6f032bb2db4-12663594543.jpg","rt":0.0,"sp":"","yt":"Ti_imhKBjXA","gen":["heavy metal","metal","technical thrash metal","thrash metal","Metal"],"hb":["Lonsonxd","Nubis84","sdecandelario"],"da":"Rust in Peace is the fourth studio album by American thrash metal band Megadeth. It was released by Capitol Records in 1990. A remixed and remastered version, featuring several bonus tracks, was released in 2004. Singles featured on the album include \"Holy Wars...The Punishment Due\", and \"Hangar 18\", both of which were made into music videos. This was the first Megadeth album to feature Marty Friedman and Nick Menza. Production After being released from a twelve-step program, Megadeth frontman Dave Mustaine had hired drummer Nick Menza and guitarist Marty Friedman to record Rust in Peace, creating what would become the .","dar":"Megadeth is an American thrash metal band formed in Los Angeles in 1983 by vocalist and guitarist Dave Mustaine. The group is known for complex guitar work and precise musicianship and is regarded as one of the big four bands of American thrash metal along with Slayer, Anthrax and Metallica. Its music features fast rhythm sections, dual lead guitars and lyrics addressing topics such as war, politics, religion, mortality and personal relationships."},{"n":26,"year":1990,"ar":"Bathory","ti":"Hammerheart","cv":"https://dn710908.ca.archive.org/0/items/mbid-d6dbc518-3ad6-39a5-ab01-1b24f87e2e45/mbid-d6dbc518-3ad6-39a5-ab01-1b24f87e2e45-19434936368.jpg","rt":0.0,"sp":"","yt":"dvCHHYwGjfY","gen":["heavy metal","metal","viking metal","Metal","Rock"],"hb":[],"da":"Hammerheart is the fifth album released by Bathory. It continued Blood Fire Death's transition away from black metal to what would become recognized as viking metal, and is considered a cornerstone work of the genre. .","dar":"Bathory was a Swedish black metal band formed in Vällingby in 1983 and named after the infamous Hungarian countess Elizabeth Báthory. The band's frontman and main songwriter was Quorthon (Tomas Forsberg). Bathory's first four albums were \"the blueprint for Scandinavian black metal\". The band departed from this style on their fifth album, Hammerheart (1990), which is often cited as the first Viking metal album. Bathory continued in the Viking metal style throughout the 1990s and early 2000s"},{"n":155,"year":1990,"ar":"Helmet","ti":"Strap It On","cv":"https://dn721604.ca.archive.org/0/items/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e/mbid-100d84ff-9751-4409-9a7d-52a8c344b87e-31574430576.jpg","rt":0.0,"sp":"","yt":"_IE0TrzBYzY","gen":["hard rock","indie rock","heavy metal","metal","post-hardcore","alternative metal"],"hb":[],"da":"Strap It On is the first album by Helmet. Originally released in 1990 through Amphetamine Reptile Records, it was subsequently rereleased by Interscope in November 1991. Critics considered the album innovative for its explosive, propulsive, and often staccato riff style which greatly exploited drop D tuning. It has since become a cult classic in underground metal/ post-hardcore. The moody, atmospheric \"Sinatra\" differed from most of the fast-paced, metal-influenced songs on the album; its lyrics featured a paraphrasing of Dean Martin's famous line about the crooner, \"It's Sinatra's world/ We just live in it.\" Accolades Year ↓ Publication ↓ Country ↓ .","dar":"Helmet is an alternative metal band hailing from New York City, with its roots dating back to 1989 when vocalist and lead guitarist Page Hamilton established the group. Throughout its existence, Helmet has undergone numerous lineup changes, yet Hamilton remains the sole consistent member. Since 2010, the band has been comprised of Hamilton, drummer Kyle Stevenson, guitarist Dan Beeman, and bassist Dave Case.\n\nThe discography of Helmet boasts eight studio albums and two compilation albums."}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
