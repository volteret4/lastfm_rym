<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

<script>
const A = [{"n":26,"year":2024,"ar":"Chelsea Wolfe","ti":"She Reaches Out to She Reaches Out to She","cv":"https://cdn2.albumoftheyear.org/600x0/album/778140-she-reaches-out-to-she-reaches-out-to-she_1020.jpg","rt":0.0,"sp":"","yt":"RkPx5yyD570","gen":["alternative rock","doom metal","dark wave","post-industrial","Rock"],"hb":[],"da":"Chelsea Wolfe’s latest album, She Reaches Out To She Reaches Out To She, is a rebirth in process. It’s a powerfully cathartic statement about cutting ties, as well as an important reminder that healing is cyclical and circular, and not a simple linear process. released February 9, 2024 .","dar":"Chelsea Wolfe (born Chelsea Joy Wolfe on November 14, 1983) is an American singer-songwriter and musician from Roseville, California. Her work blends elements of gothic rock, doom metal, folk, and darkwave, often described as \"doom folk\" and \"drone-metal-art-folk.\" Growing up in Northern California with a country musician father who owned a home studio, Wolfe began writing poetry at age 7 and recording songs by age 9, which she later described as \"basically Casio-based gothy R&B songs.\""},{"n":173,"year":2017,"ar":"Bell Witch","ti":"Mirror Reaper","cv":"https://dn710706.ca.archive.org/0/items/mbid-5a69dd22-6431-40ea-8a2e-b52b3973a60f/mbid-5a69dd22-6431-40ea-8a2e-b52b3973a60f-40973844770.jpg","rt":0.0,"sp":"","yt":"2_NjbmKGTi8","gen":["doom metal","funeral doom metal","Metal"],"hb":[],"da":"\"Mirror Reaper\" is the third full-length album by Seattle funeral doom metal band Bell Witch. The album is composed of a single 83-minute song, though the CD and vinyl versions of the album are divided into two halves due to constraints of the mediums. The album is dedicated to the memory of former drummer/vocalist Adrian Guerra, who passed away in 2016 at the age of 36. \"Mirror Reaper\" was produced and recorded by Billy Anderson with artwork by Mariusz Lewandowski. .","dar":"Bell Witch was formed in Seattle in 2010 by drummer Adrian Guerra (also of Sod Hauler and Lethe), and bassist Dylan Desmond (also of Samothrace). The duo released two albums, Longing in 2012 and Four Phantoms in 2015, before Guerra left the band due to health reasons. He later died in 2016. \nIn 2017, with new drummer Jesse Shreibman, Bell Witch released Mirror Reaper, a single 83 minute long song, to critical acclaim. It was dedicated to the memory of Guerra."},{"n":63,"year":2014,"ar":"Thou","ti":"Heathen","cv":"https://dn711200.ca.archive.org/0/items/mbid-1499ebc5-37da-4fcd-a97b-ad925b326fea/mbid-1499ebc5-37da-4fcd-a97b-ad925b326fea-27952413825.jpg","rt":0.0,"sp":"","yt":"J9FPhpuNrwg","gen":["punk","doom metal","metal","sludge metal","Metal"],"hb":[],"da":null,"dar":"Thou is a doom/sludge/drone metal band from Baton Rouge and New Orleans, Louisiana, USA. Their lyrics deal mostly with social decay, death and general despair.  All of their recorded music, after a period of time, is posted for free on Bandcamp or here \n\nDespite having only released six full-lengths —  Tyrant, Peasant, Summit, Heathen, Magus, and Umbilical — Thou have an extensive and varied discography. The band have released several EPs, including"},{"n":105,"year":2014,"ar":"Pallbearer","ti":"Foundations of Burden","cv":"https://cdn2.albumoftheyear.org/600x0/album/2014/16539-foundations-of-burden.jpg","rt":0.0,"sp":"","yt":"N99KPZ2RsoM","gen":["doom metal","Metal","Rock"],"hb":["BipolarMuzik"],"da":null,"dar":"Pallbearer is a doom metal band from Little Rock, Arkansas, United States. The band features two members of the psychedelic drone band SPORTS, as well as members of Soophie Nun Squad and Placid Eclipse.\n\nPallbearer released their debut album \"Sorrow and Extinction\" in February 2012 via Profound Lore Records to much critical acclaim.\n\nThe current line-up is:\nBrett Campbell - vocals, guitar\nDevin Holt - guitar\nJoseph D. Rowland - bass\nMark Lierly - drums"},{"n":154,"year":2007,"ar":"Nadja","ti":"Thaumogenesis","cv":"https://ia803200.us.archive.org/27/items/mbid-bd860305-eaee-4903-930a-8f79dd2134af/mbid-bd860305-eaee-4903-930a-8f79dd2134af-26623106393.jpg","rt":0.0,"sp":"","yt":"hgl3AK8php8","gen":["doom metal","shoegaze","drone metal","Metal","Alternative Rock"],"hb":[],"da":null,"dar":"There are multiple artists named Nadja:\n\n1) Nadja is a Canadian drone doom duo featuring multi-instrumentalist Aidan Baker and bassist/vocalist Leah Buckareff. Originally formed in 2003 in Toronto, Canada as a Baker solo project, Buckareff joined in 2005 to bring the project out of the studio and into live settings. The duo combines soundscape, electronics and atmospheric vocals with slow, epic riffs and dirge-like percussion, creating a slowly moving grand wall of music that has been described as drone, ambient-doom, and shoegazer-metal."},{"n":8,"year":2006,"ar":"Agalloch","ti":"Ashes Against the Grain","cv":"https://dn721806.ca.archive.org/0/items/mbid-1dd278bb-11ca-32ee-8ba5-711ddaf871a1/mbid-1dd278bb-11ca-32ee-8ba5-711ddaf871a1-1122863191.jpg","rt":0.0,"sp":"","yt":"B1x8q64NXxA","gen":["doom metal","post-metal","black metal","atmospheric black metal","dark folk","folk metal"],"hb":[],"da":"Ashes Against the Grain is an album by American metal band Agalloch under the Brooklyn, New York-based label, The End Records. It is Agalloch's third full-length release, four years after the critically acclaimed The Mantle. Before the release, the track \"Falling Snow\" was made available in its entirety on the label's website and on the band's MySpace page. Reports indicate a version of the album was leaked on the web in May 2006. A pre-release review in the July 2006 issue of Toronto-based Exclaim! magazine described the new album as a \"departure and an extension\" from the band's previous work: .","dar":"Agalloch is an American folk doom metal band formed in Portland, Oregon, United States in 1995.\n\nAfter two demo releases in the late 1990’s the band released three full-length albums: Pale Folklore (1999), The Mantle (2002), and Ashes Against the Grain (2006). “The Mantle” has since been heralded as a classic for having been one of the first albums to combine elements from black metal, neo-folk, progressive rock, post-rock, and ambient music. The influence of this record can be heard in the music of multiple “post-black metal” bands."},{"n":45,"year":2005,"ar":"Corrupted","ti":"El Mundo Frio","cv":"https://dn711002.ca.archive.org/0/items/mbid-78abaae9-0305-4239-b27c-b0dba4ddb6b6/mbid-78abaae9-0305-4239-b27c-b0dba4ddb6b6-27838608221.jpg","rt":0.0,"sp":"","yt":"ODJdbxihGhg","gen":["doom metal","metal","drone metal","sludge metal","Metal"],"hb":[],"da":null,"dar":"There are at least two bands named Corrupted:\n\n1) Corrupted is a sludge / drone doom metal band formed in 1994 in Osaka, Japan. Their sound is characterized by incredibly downtuned guitars and bass playing slow, minimalist riffs under deep layers of feedback. The vocals are harsh guttural grunts, and the music alternates between long instrumental sections and sections with vocals which go for long periods of time without rest. They are considered by most familiar with the genre to be one of the heaviest and darkest doom metal bands of all."},{"n":27,"year":2004,"ar":"Mastodon","ti":"Leviathan","cv":"https://dn710904.ca.archive.org/0/items/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0/mbid-9a5820c8-dbc6-34eb-97dd-401d3c421dd0-25054292616.png","rt":0.0,"sp":"","yt":"4Kp0LxKTZhk","gen":["heavy metal","doom metal","progressive metal","sludge metal","rock","Metal"],"hb":[],"da":"Leviathan is the sophomore full-length studio album by American metal band Mastodon. It was released on August 31, 2004 via Relapse Records. Leviathan was conceived as a concept album based on Herman Melville's 1851 novel Moby-Dick; or, the Whale, with the tracks \"Iron Tusk\", \"Blood and Thunder\" and \"Seabeast\" released as singles. Magazines Revolver, Kerrang! and Terrorizer awarded the record with \"Album of the Year\" in 2004. Leviathan was also released with an audio DVD in a limited edition set with a black and gold slipcase. The album brought Mastodon great critical acclaim and, thanks to the ensuing tour, a .","dar":"Mastodon is an American heavy metal band from Atlanta, Georgia, formed in 2000. The lineup consisted of Troy Sanders (bass and vocals), Brent Hinds (lead guitar and vocals), Bill Kelliher (rhythm guitar and backing vocals), and Brann Dailor (drums and vocals) until Hinds’s departure in March 2025. The band has released eight studio albums along with several other releases.\n\nTheir 2002 debut album, \"Remission\", received critical acclaim for its distinctive sound."},{"n":2,"year":2002,"ar":"Agalloch","ti":"The Mantle","cv":"https://dn721505.ca.archive.org/0/items/mbid-a590708e-1907-47ee-814b-8a3745d7b6fc/mbid-a590708e-1907-47ee-814b-8a3745d7b6fc-1122743860.jpg","rt":0.0,"sp":"","yt":"INgo0xmYBeg","gen":["doom metal","post-metal","black metal","atmospheric black metal","dark folk","folk metal"],"hb":[],"da":"The Mantle is Agalloch's second full-length album. It was recorded between November 2001 and April 2002, and released by The End Records in August of 2002. \"Trudging Through Deep Snow\" sample created by Aaron Sholes and Neta Smollack. The cover art is a picture of the Thompson Elk sculpture in Portland, Oregon. .","dar":"Agalloch is an American folk doom metal band formed in Portland, Oregon, United States in 1995.\n\nAfter two demo releases in the late 1990’s the band released three full-length albums: Pale Folklore (1999), The Mantle (2002), and Ashes Against the Grain (2006). “The Mantle” has since been heralded as a classic for having been one of the first albums to combine elements from black metal, neo-folk, progressive rock, post-rock, and ambient music. The influence of this record can be heard in the music of multiple “post-black metal” bands."},{"n":11,"year":2000,"ar":"Electric Wizard","ti":"Dopethrone","cv":"https://dn710302.ca.archive.org/0/items/mbid-aec7ca73-36ff-41aa-9ad1-57b2d4cc41bb/mbid-aec7ca73-36ff-41aa-9ad1-57b2d4cc41bb-10614867040.png","rt":0.0,"sp":"","yt":"eaMbKZPBruU","gen":["doom metal","stoner rock","rock","Metal","Rock"],"hb":["Lonsonxd","Nubis84","paqueradejere","sdecandelario"],"da":"Dopethrone is the third studio album by English doom metal band Electric Wizard. It was released on 28 November 2000 through Rise Above Records and re-released by the same label in 2004 and 2007 with an extra song. Jus Oborn late spoke about the development of Dopethrone as being part of trilogy with Come My Fanatics…, and Supercoven, noting that he looked upon these albums with fondness and that \"With those albums, I believe we really found our mark as a band. When we did our first album, none of us had ever been into the studio before – and .","dar":"Electric Wizard is a band from Dorset, UK. They have a distinct, yet traditional doom metal sound that incorporates stoner and sludge traits, with lyrics typically involving the occult, witchcraft, H.P. Lovecraft, horror films and marijuana. During 2003, founding members Tim Bagshaw and Mark Greening left to form the band Ramesses, leaving guitarist/vocalist Jus Oborn the only remaining founding member.\n\nThe oblivion and ecstasy of crushing doom and high grade marijuana"},{"n":42,"year":1996,"ar":"Eyehategod","ti":"Dopesick","cv":"https://dn710602.ca.archive.org/0/items/mbid-72e57b50-67a3-4689-ac55-342e4341f697/mbid-72e57b50-67a3-4689-ac55-342e4341f697-19427677722.jpg","rt":0.0,"sp":"","yt":"tN-kUW39jWM","gen":["punk","heavy metal","doom metal","alternative metal","sludge metal","Metal"],"hb":[],"da":"Dopesick is the third studio album by New Orleans sludgecore band Eyehategod, released on April 2, 1996. It was reissued in 2006 as part of Century Media's 20th Anniversary series with three bonus tracks that were recorded during the original Dopesick recording sessions. The recording sessions were infamously chaotic, and involved the studio owner reportedly calling Century Media to ask if the band was mentally unstable, and threatening to kick them out. This particular incident occurred after Mike Williams had attempted to record the sound of smashing glass for the introduction to the album, by smashing a bottle on the .","dar":"Eyehategod (also abbreviated and often referred to as EHG) is an American sludge band from New Orleans, Louisiana, which formed in 1988.  The band is known for their dark, sludgy riffs combined with equally dark lyrics. Along with Melvins and Crowbar they are often considered one of the pioneers of the sludge metal genre.\n\nEyehategod have noted Melvins, Black Sabbath, Black Flag, Saint Vitus, Carnivore, Swans and Flipper as key influences to their sound."},{"n":2,"year":1992,"ar":"Alice in Chains","ti":"Dirt","cv":"https://dn710800.ca.archive.org/0/items/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf/mbid-47f3efa5-137c-40e8-ab1b-42d57f5cfbbf-9835602113.jpg","rt":0.0,"sp":"","yt":"19CXYQhqVu0","gen":["alternative rock","hard rock","heavy metal","doom metal","metal","grunge"],"hb":["Lonsonxd","sdecandelario","verygooood"],"da":"Dirt is the second studio album by the American rock band Alice in Chains and was released on September 29, 1992 through Columbia Records. Peaking at number six on the Billboard 200, the album was well received by music critics and has since been certified four-times platinum by the RIAA. It is nowadays considered as one of the best grunge/heavy metal albums and is usually on many \"Must have\" lists. The album spawned five singles: \"Would?\", \"Them Bones\", \"Angry Chair\", \"Rooster\", and \"Down in a Hole\". The songs on the album focused on depression, drug use, war, death, and other .","dar":"Alice in Chains (often abbreviated as AiC) is an American rock band formed in Seattle in 1987. Since 2006, the band's lineup has consisted of vocalist/guitarists Jerry Cantrell and William DuVall, bassist Mike Inez, and drummer Sean Kinney. Vocalist Layne Staley and bassist Mike Starr are former members of the band. While often associated with grunge music, Alice in Chains' sound and style is rooted in heavy metal. The band is recognized for its distinctive vocal style"},{"n":146,"year":1991,"ar":"Cathedral","ti":"Forest Of Equilibrium","cv":"https://ia600505.us.archive.org/17/items/mbid-9e05c979-f5b0-4629-93f9-f21955e82dcb/mbid-9e05c979-f5b0-4629-93f9-f21955e82dcb-7731721936.jpg","rt":0.0,"sp":"","yt":"EZkufellkew","gen":["doom metal","rock","Metal","Rock"],"hb":["Nubis84"],"da":"Forest of Equilibrium is the debut studio album by British doom metal band Cathedral, released on 14 October 1991 through Earache Records. It is considered a classic of its genre, doom metal. Forest of Equilibrium was notably inducted into Decibel magazine's Hall of Fame in February 2006 being the 12th inductee for the Decibel Hall of Fame. In 2009, Earache Records reissued the album along with four \"bonus\" songs that comprise the long-out-of-print 1992 Soul Sacrifice EP. This deluxe digipak reissue also includes a poster of Dave Patchett's cover art and a new 40-minute documentary entitled \"Return to the Forest\" .","dar":"There is more than one artist with this name.\n\n1) Doom metal band from Coventry, England. The group was formed in 1989 by Lee Dorrian (formerly vocalist of Napalm Death), Mark 'Griff' Griffiths (a Carcass roadie) and Gary 'Gaz' Jennings (previously a member of UK thrashers Acid Reign). The band forged a link between early doom metal and a 1990s extreme metal aesthetic, making doom slower and heavier. Their debut album, Forest Of Equilibrium, is considered a classic of the genre"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
