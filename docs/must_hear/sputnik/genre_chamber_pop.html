<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

tten between late 2007 and 2008, and recorded over a five-week period. .","dar":"Polly Jean \"PJ\" Harvey, born 9 October 1969, is an English singer-songwriter. She is known primarily as a vocalist and guitarist, and is skilled in playing multiple instruments.\n\nHarvey started her music career in 1988 by joining the local band Automatic Dlamini as a vocalist, guitarist, and saxophonist. John Parish, the band's frontman, has remained a long-term collaborator with her. In 1991, she formed a trio called PJ Harvey, marking the beginning of her career under that name."},{"n":6,"year":2010,"ar":"The National","ti":"High Violet","cv":"https://cdn2.albumoftheyear.org/600x0/album/1638-high-violet_034451.jpg","rt":0.0,"sp":"","yt":"3U-xCmXddf0","gen":["chamber pop","indie rock","post-punk revival"],"hb":[],"da":"High Violet is the fifth studio album by The National, which was released on May 10, 2010 in Europe and on May 11, 2010 in North America via 4AD. The band produced the album themselves, assisted by Peter Katis with whom they worked on their previous albums Alligator and Boxer at their own studio in Brooklyn, New York, and at Katis' Tarquin Studios in Bridgeport, Connecticut. The sculpture on the album cover was created by artist Mark Fox, and is called The Binding Force. .","dar":"The National is an American indie rock band formed in Brooklyn, New York in 1999, by friends from Cincinnati, Ohio. The band's lyrics are written and sung by Matt Berninger in a distinctive, deep baritone. The rest of the band is composed of two pairs of brothers: Aaron Dessner (guitar, bass, keyboards), Bryce Dessner (guitar), Scott Devendorf (bass, guitar) and Bryan Devendorf (drums). \n\nTheir self-titled debut album\"The National\" (Brassland 2001) was recorded and released before they had played even a single show."},{"n":6,"year":2005,"ar":"Sufjan Stevens","ti":"Illinois","cv":"https://dn710206.ca.archive.org/0/items/mbid-b14f3252-4973-3fe0-a4da-af5d39626cc1/mbid-b14f3252-4973-3fe0-a4 ch echoed gypsy jazz and traditional folk, has led into his current sound, which mixes rock with more broad compositions. His years of solo song-craft have now enabled him to produce a sound that is uniquely his own."},{"n":10,"year":2004,"ar":"Arcade Fire","ti":"Funeral","cv":"https://dn711006.ca.archive.org/0/items/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1/mbid-58c07638-4343-4ad7-ac37-da79f6aeb8e1-31589070944.jpg","rt":0.0,"sp":"","yt":"qg7XMMAuCJo","gen":["art rock","baroque pop","art pop","chamber pop","indie rock","alternative punk"],"hb":[],"da":"Funeral is the debut full-length album by Canadian indie rock band Arcade Fire, released on September 14, 2004 in North America by Merge Records and on February 28, 2005 in Europe by Rough Trade Records. It was given its title because several band members had recently lost members of their families: Régine Chassagne's grandmother died in June 2003, Win and William Butler's grandfather (swing musician Alvino Rey) in March 2004, and Richard Reed Parry's aunt in April 2004. Preliminary recordings for Funeral were made during the course of a week in August 2003 at the Hotel2Tango in Montreal, Quebec, and .","dar":"Arcade Fire is a Canadian indie rock band formed in Montreal, Quebec, Canada in 2001. The band consists of Win Butler (vocals, guitar, piano), Régine Chassagne (vocals, accordion, keyboards, hurdy gurdy, drums), Richard Reed Parry (bass, guitar), Tim Kingsbury (bass), and Jeremy Gara (drums). Montreal percussionist Dane Mills performed on the EP and in early live shows.  Will Butler (keyboards, guitar) left the band in 2022 to focus on his solo career. The touring band includes horn players and violinists."},{"n":141,"year":2002,"ar":"Beck","ti":"Sea Change","cv":"https://dn710605.ca.archive.org/0/items/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006/mbid-69dbac5b-43ce-4d69-afc4-f3f0559e3006-990718896.jpg","rt":0.0,"sp":"","yt":"JB2CvfMY6SM","gen":["folk rock","alternative rock","contemporary folk","chamber pop","indie rock","alternative country"],"hb":[],"da":"Beck has always been known for his ever-changing moods -- particularly since they often arrived one after another on one album, sometimes within one song -- yet the shift between the neon glitz of Midnite Vultures and the lush, somber Sea Change is startling, and not just because it finds him in full-on singer/songwriter mode, abandoning all of the postmodern pranksterism of its predecessor. What's startling about Sea Change is how it brings everything that's run beneath the surface of Beck's music to the forefront, as if he's unafraid to not just reveal emotions, but to elliptically examine them in .","dar":"Beck Hansen (born Bek David Campbell, July 8, 1970) is an American musician, singer-songwriter, and multi-instrumentalist.  Beck's music is known for its pop-junk culture collage of musical styles, ironic lyrics, samples, drum machines, live instrumentation and heady sound effects.\n\nBeck was born in Los Angeles, California, to David Campbell (a musician and son of a Presbyterian minister) and Bibbe Hansen (a former dancer for The Velvet Underground, founding member of the satirical band Black Fag, and visual artist)."},{"n":68,"year":2000,"ar":"Elliott Smith","ti":"Figure 8","cv":"https://dn710605.ca.archive.org/0/items/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae/mbid-05c38a1d-9acb-3cf3-ae1a-b8367f88b3ae-18782213344.png","rt":0.0,"sp":"","yt":"B6sYRE65QIc","gen":["folk rock","chamber pop","indie rock","indie folk","indie pop","rock"],"hb":[],"da":"Figure 8 is the fifth studio album by American singer-songwriter Elliott Smith. Released by DreamWorks Records on April 18, 2000, it became Smith's second release on a major label and the last album he would complete before his death. It was recorded at Sunset Sound in Hollywood, Sonora Studios in Los Angeles, Capitol Studios in Hollywood, and Abbey Road Studios in London (\"Stupidity Tries\", \"In the Lost and Found (Honky Bach)\" and \"Pretty Mary K\"). The album was also released on double vinyl 12\" on Bong Load Custom Records, and later rereleased by Plain Records in 2008. It is also .","dar":"Steven Paul \"Elliott\" Smith (August 6, 1969 – October 21, 2003) was an American songwriter and musician. Smith was born in Omaha, Nebraska, raised primarily in Texas, and resided for a significant portion of his life in Portland, Oregon, where he first gained popularity. His primary instrument was the guitar, but he was also proficient at piano, clarinet, bass, drums and harmonica. Smith had a distinctive vocal style characterized by his \"whispery, spiderweb-thin delivery\" and use of multi-tracking to create vocal harmonies."},{"n":114,"year":2000,"ar":"Goldfrapp","ti":"Felt Mountain","cv":"https://dn710906.ca.archive.org/0/items/mbid-d5b80206-c691-400d-95d7-830311451af9/mbid-d5b80206-c691-400d-95d7-830311451af9-2919147114.jpg","rt":0.0,"sp":"","yt":"iKAsuvwDP_Q","gen":["baroque pop","art pop","chamber pop","trip hop","ambient pop","alternative pop"],"hb":[],"da":"Felt Mountain is the debut album by English electronic duo Goldfrapp. It was released by Mute Records on 11 September 2000 in the United Kingdom. The album features Alison Goldfrapp's synthesized vocals in cinematic scope, and takes influence from a variety of music styles such as 1960s pop, cabaret, folk, and electronica. Felt Mountain was a top seventy-five album in Goldfrapp's native United Kingdom, and was certified gold in October 2001. It was generally well received by music critics, and it was described as \"simultaneously smarmy and seductive, yet elegant and graceful\". In 2001, the album was shortlisted for the .","dar":"Goldfrapp are an English electronic band from London, formed in 1999 which consists of Alison Goldfrapp (vocals, synthesizer) and Will Gregory (synthesizer). Despite favourable reviews and a short-listing for the Mercury Prize, the début studio album Felt Mountain did not chart highly. Goldfrapp's second album Black Cherry, which incorporated glam rock and synthpop sounds, was released in 2003. The album influenced the same dance-oriented sound of their third album Supernature."},{"n":20,"year":1999,"ar":"The Flaming Lips","ti":"The Soft Bulletin","cv":"https://dn721501.ca.archive.org/0/items/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa/mbid-8549ce34-2349-42e0-bf28-1a773b35bcaa-23592292976.png","rt":0.0,"sp":"","yt":"MBH-169OHNg","gen":["alternative rock","psychedelic pop","art pop","chamber pop","indie rock","neo-psychedelia"],"hb":[],"da":"The Soft Bulletin is the ninth album released by The Flaming Lips on May 17, 1999 in the UK, with a US release following on June 22, 1999. It was released to wide critical acclaim and hailed by critics as a departure from their previous guitar-heavy alternative rock sound, into a more layered and intricately arranged work. The album was considered to mark a change in the course for the band, with more traditional catchy melodies and accessible-sounding music (their previous album, 1997's Zaireeka, was a quadruple album of experimental sounds meant to be played on four separate stereo systems .","dar":"The Flaming Lips is an American neo-psychedelic band, formed in Oklahoma City, Oklahoma, United States in 1983. Throughout their career, band members have come and gone, but currently The Flaming Lips consist of original members Wayne Coyne (lead vocals, guitar, keyboards) and Michael Ivins (bass, keyboards, backing vocals), along with members Steven Drozd (drums, guitar, keyboards, backing vocals), and Derek Brown (guitar, keyboards, backing vocals)."},{"n":49,"year":1999,"ar":"The Magnetic Fields","ti":"69 Love Songs","cv":"https://dn710705.ca.archive.org/0/items/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d-7440735207.jpg","rt":0.0,"sp":"","yt":"5VO4R98Ti6I","gen":["synth-pop","chamber pop","indie folk","indie pop","twee pop","Alternative Rock"],"hb":[],"da":null,"dar":"The Magnetic Fields is an American indie pop band that formed in Boston, MA in 1988 by Stephin Merritt. Albums released under the name \"The Magnetic Fields\" often consist of synth-pop music in a 1980s style underlying clever lyrics which are usually heavily ironic. While synth-pop often forms the foundation of their music, The Magnetic Fields' music borrows from many other styles, notably country, folk and indie pop.\n\nThe band was originally formed in Cambridge"},{"n":96,"year":1999,"ar":"Wilco","ti":"Summerteeth","cv":"https://cdn2.albumoftheyear.org/600x0/album/summerteeth-1.jpg","rt":0.0,"sp":"","yt":"-XRLxtmGzxk","gen":["alternative rock","pop rock","chamber pop","indie rock","Rock","Alternative Rock"],"hb":["Frikomid","Nubis84"],"da":"Summerteeth is the third studio album by Chicago alternative rock band Wilco. Released through Reprise Records on March 9, 1999, the album was heavily influenced lyrically by twentieth century literature, as well as singer Jeff Tweedy's marital problems. Unlike previous albums, Summerteeth was heavily overdubbed in the studio with Pro Tools. Tweedy and Jay Bennett created most of the album in the studio, a contrast to the band's previous albums, which were rehearsed live and recorded almost at once. Despite critical acclaim from numerous outlets, including Allmusic, The Chicago Tribune, and The Village Voice, Summerteeth sold approximately 200,000 copies—a modest .","dar":"Wilco is an American indie rock band which formed in 1994 in Chicago, Illinois, United States by the remaining members of alternative country group Uncle Tupelo following singer Jay Farrar's departure from that group. Wilco's lineup has changed frequently, with only singer Jeff Tweedy and bassist John Stirratt remaining from the original incarnation. The other current members are guitarist Nels Cline, multi-instrumentalists Pat Sansone and Mikael Jorgensen, and drummer Glenn Kotche."},{"n":85,"year":1997,"ar":"The Verve","ti":"Urban Hymns","cv":"https://dn710203.ca.archive.org/0/items/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034/mbid-51c91d25-78ab-4dd5-aa6d-b168ba4f2034-29045897897.jpg","rt":0.0,"sp":"","yt":"GQNxSTFf6zQ","gen":["alternative rock","chamber pop","indie rock","neo-psychedelia","britpop","post-britpop"],"hb":[],"da":"Urban Hymns is the third album by English rock band The Verve, released on 29 September 1997. It earned nearly unanimous critical praise upon its release and went on to become the band's best-selling release and one of the biggest-selling albums of the year. The album received nearly unanimous critical praise upon its release, with Melody Maker naming Urban Hymns as the number-one album of 1997 in its year-end list. The album is featured in the book \"1001 Albums You Must Hear Before You Die\". In the years following its release, Urban Hymns received much acclaim. In 1998, it won .","dar":"The Verve were an English rock band formed in Wigan in 1990 by lead vocalist Richard Ashcroft, guitarist Nick McCabe, bass guitarist Simon Jones, and drummer Peter Salisbury. Guitarist and keyboardist Simon Tong joined the band during its first reunion.\n\nThe band initially developed a psychedelic and shoegaze sound, showcased on their debut album \"A Storm in Heaven.\" By 1997, The Verve had released three EPs and three studio albums. Throughout their career"},{"n":40,"year":1996,"ar":"The Divine Comedy","ti":"Casanova","cv":"https://ia800806.us.archive.org/13/items/mbid-cc4082a7-e79a-4c05-a6aa-f74695f2081c/mbid-cc4082a7-e79a-4c05-a6aa-f74695f2081c-41225734673.jpg","rt":0.0,"sp":"","yt":"I4J0gOonfh8","gen":["baroque pop","chamber pop","indie rock","britpop","lounge","cocktail nation"],"hb":[],"da":"Casanova is The Divine Comedy's fourth album. It was the band's commercial breakthrough. It was released on Setanta and certified gold in the UK in July 1997. This was helped by the release of The Divine Comedy's first single \"Something for the Weekend\" which reached number 13 on the charts. There were two other singles released from the album \"Becoming More Like Alfie\" and \"The Frog Princess\" which charted at 27 and 15 respectively. The album is also less classical sounding than Promenade and adopts more of a Britpop feel. An instrumental version of \"Songs of Love\" was used as .","dar":"The Divine Comedy is a baroque pop band now based in Dublin, Ireland, fronted by Neil Hannon.\n\nNeil Hannon, Originally from Derry, has been the only ever-present member of the band, being its founder in 1989 when he was joined by John McCullagh and Kevin Traynor. Their first album, the heavily R.E.M.-influenced and now-deleted Fanfare for the Comic Muse, enjoyed little success though. A couple of equally unsuccessful EPs - Timewatch (1991); Europop (1992) - were to follow"},{"n":125,"year":1996,"ar":"Belle and Sebastian","ti":"Tigermilk","cv":"https://dn710909.ca.archive.org/0/items/mbid-ae871d82-4914-4338-b2db-f91d723f9b18/mbid-ae871d82-4914-4338-b2db-f91d723f9b18-6748490069.png","rt":0.0,"sp":"","yt":"soMbZ7eLKlM","gen":["chamber pop","indie rock","indie pop","twee pop","Alternative Rock"],"hb":[],"da":"Tigermilk is the 1996 debut album from Scottish pop group Belle & Sebastian. Originally given a limited release (1,000 copies) by Electric Honey, the album was subsequently re-released in 1999 by Jeepster Records. The cover photograph was taken by Stuart Murdoch, and features Joanne Kenney - the same model who appeared on the cover of the Dog on Wheels EP. The album is named after a song that didn't end up making the cut – an instrumental that was later performed numerous times on Belle & Sebastian's early tours. All of the songs on the album were written by Stuart .","dar":"Belle and Sebastian are a Scottish indie pop band that formed in 1994 in Glasgow, Scotland. Led by guitarist/vocalist Stuart Murdoch, the seven-piece band have an intimate, majestic sound that is equal parts folk-rock and '60s pop. Murdoch has a gift not only for whimsy and surrealism, but also for odd, unsettling lyrical detail which keeps the songs grounded in a tangible reality. \n\nBelle and Sebastian released their first two albums in 1996: Tigermilk"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
