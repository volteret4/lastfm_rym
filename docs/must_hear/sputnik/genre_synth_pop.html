<style>:root{--bg:#0d0d0d;--bg2:#1a1a1a;--bg3:#242424;--border:#333;--text:#e0e0e0;
      --muted:#777;--accent:#e8a020;--green:#4caf50}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
select,input{background:var(--bg3);color:var(--text);border:1px solid var(--border);
             border-radius:4px;padding:5px 10px;font-size:.88em;cursor:pointer}
/* header */
.hdr{position:sticky;top:0;z-index:200;background:var(--bg2);
     border-bottom:1px solid var(--border);padding:10px 16px;
     display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.hdr-title{font-size:1.15em;font-weight:700;color:var(--accent)}
.hdr-back{color:var(--muted);font-size:.85em}
.hdr-back:hover{color:var(--text)}
.hdr-stats{font-size:.82em;color:var(--muted);margin-left:auto}
.search-box{width:170px}
/* year sections */
.year-block{padding:18px 16px 0}
.year-heading{font-size:.95em;font-weight:700;color:var(--muted);letter-spacing:.06em;
              border-bottom:1px solid var(--border);padding-bottom:6px;margin-bottom:10px}
.album-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
/* card */
.card{width:120px;cursor:pointer;position:relative;flex-shrink:0;border-radius:3px;overflow:hidden}
.card-img{width:120px;height:120px;object-fit:cover;background:var(--bg3);display:block}
.card-rating{position:absolute;top:3px;right:3px;background:rgba(0,0,0,.78);
             color:#fff;font-size:.72em;font-weight:700;padding:2px 5px;border-radius:2px}
.card-info{padding:4px 3px 0;font-size:.7em;line-height:1.3;
           background:linear-gradient(transparent,var(--bg))}
.card-artist{color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-title{color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.heard{outline:2px solid var(--green);outline-offset:1px}
.card.heard .card-img{filter:brightness(.62)}
.card.heard::after{content:'✓';position:absolute;top:3px;left:5px;color:var(--green);
                   font-size:1.05em;font-weight:900;text-shadow:0 0 5px #000}
/* panel */
.panel{position:fixed;right:0;top:0;height:100vh;width:350px;background:var(--bg2);
       border-left:1px solid var(--border);overflow-y:auto;z-index:300;
       transform:translateX(100%);transition:transform .18s ease}
.panel.open{transform:none}
.panel-close{position:sticky;top:0;background:var(--bg2);border-bottom:1px solid var(--border);
             padding:8px 12px;cursor:pointer;display:flex;justify-content:flex-end;
             font-size:1.2em;color:var(--muted)}
.panel-close:hover{color:var(--text)}
.panel-cover{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--bg3)}
.panel-body{padding:12px}
.panel-title{font-size:1.05em;font-weight:700;margin-bottom:3px}
.panel-artist{color:var(--muted);font-size:.88em;margin-bottom:8px}
.panel-meta{font-size:.78em;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.panel-rating{color:var(--accent);font-weight:700}
.panel-genres{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.panel-genre{background:var(--bg3);border:1px solid var(--border);border-radius:10px;
             padding:2px 8px;font-size:.72em}
.panel-heard{font-size:.78em;margin-bottom:9px}
.heard-label{color:var(--muted);margin-right:5px}
.heard-user{display:inline-block;background:rgba(76,175,80,.2);border:1px solid var(--green);
            color:var(--green);border-radius:3px;padding:1px 6px;font-size:.85em;margin:2px}
.panel-links{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:10px}
.panel-link{font-size:.78em;background:var(--bg3);border:1px solid var(--border);
            border-radius:4px;padding:3px 9px}
.panel-desc{font-size:.78em;color:#999;line-height:1.5;max-height:180px;overflow-y:auto;
            border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.yt-wrap{margin-top:10px}
.yt-wrap iframe{width:100%;aspect-ratio:16/9;border:0;border-radius:4px}
/* index genre grid */
.genre-grid{display:flex;flex-wrap:wrap;gap:10px;padding:18px 16px}
.genre-card{background:var(--bg2);border:1px solid var(--border);border-radius:5px;
            padding:12px 14px;width:190px;transition:border-color .15s;color:inherit}
.genre-card:hover{border-color:var(--accent);text-decoration:none}
.genre-name{font-size:.97em;font-weight:700;color:var(--accent);margin-bottom:5px}
.genre-count{font-size:.78em;color:var(--muted);margin-bottom:7px}
.pbar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-bottom:4px}
.pfill{height:100%;background:var(--green);border-radius:2px;transition:width .3s}
.genre-pct{font-size:.72em;color:var(--muted)}
.summary{padding:12px 16px;font-size:.85em;color:var(--muted);
         border-bottom:1px solid var(--border)}</style>
</head>

const A = [{"n":36,"year":2024,"ar":"Magdalena Bay","ti":"Imaginal Disk","cv":"https://cdn2.albumoftheyear.org/600x0/album/1012480-imaginal-disk_115432.jpg","rt":0.0,"sp":"","yt":"OPe7tn_Hju4","gen":["synth-pop","electropop","neo-psychedelia","alternative dance","dance-pop","chillwave"],"hb":[],"da":"Imaginal Disk is the second studio album by American duo Magdalena Bay, released on August 23, 2024, through Mom + Pop Music. The title shares its name with imaginal discs, the structures within the body of insect larvae that form part of their adult bodies. For the album, Magdalena Bay reimagined the term as a CD-shaped object created by aliens that, once inserted into the brain, gives the being \"upgraded consciousness\". In the story, the technology was inserted into the brains of apes to make humans. .","dar":"Magdalena Bay is an American alternative pop duo from Miami, Florida, based in Los Angeles, California. The duo consists of couple Mica Tenenbaum and Matthew Lewin, who write and produce together. They have released two studio albums, three EPs, and three mixtapes. The mixtapes are called Mini Mixes and are composed of short songs with accompanying homemade green screen music videos.\n\nThe duo released their debut studio album, Mercurial World, on October 8, 2021."},{"n":178,"year":2017,"ar":"Lorde","ti":"Melodrama","cv":"https://dn711306.ca.archive.org/0/items/mbid-0024c5d8-8b54-459f-ab43-afeab54030a8/mbid-0024c5d8-8b54-459f-ab43-afeab54030a8-17054895075.png","rt":0.0,"sp":"","yt":"gp3T60xhvBw","gen":["art pop","synth-pop","electropop","indie pop","pop","Pop"],"hb":["Frikomid","GabredMared","alberto_gu","verygooood"],"da":"Melodrama is the second studio album by New Zealand singer Lorde, released on June 16, 2017, through Lava and Republic Records and distributed through Universal. Following the breakthrough success of her debut album Pure Heroine, Lorde retreated from the spotlight, and travelled between New Zealand and the United States to examine the world around her. Initially inspired by her disillusionment with fame, she wrote Melodrama to capture heartbreak and solitude after her first breakup. \"Melodrama\" has been described by critics as a loose concept album that explores the theme of solitude, in the framework of a single house party with the events and moods that entail it. Lorde wrote .","dar":"Ella Marija Lani Yelich-O'Connor, known professionally as Lorde (born 7 November 1996 in Takapuna, Auckland, New Zealand), is a New Zealand singer-songwriter. Taking inspiration from aristocracy for her stage name, she is known for her unconventional musical styles and introspective songwriting.\n\nLorde expressed interest in performing at local venues in her early teens. She signed with Universal Music Group (UMG) in 2009 and collaborated with producer Joel Little in 2011 to start recording music."},{"n":54,"year":2014,"ar":"Bent Knee","ti":"Shiny Eyed Babies","cv":"https://dn711004.ca.archive.org/0/items/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0/mbid-2ee8fc5e-cd3b-4db8-8b6f-136d784e32c0-12550985966.jpg","rt":0.0,"sp":"","yt":"o2aBQclnk0M","gen":["experimental rock","avant-garde","alternative rock","synth-pop","indie rock","Rock"],"hb":[],"da":null,"dar":"Bent Knee is an American art rock band formed in Boston, Massachusetts in 2009. The band performs in multiple genres and draws from multiple influences, including pop, industrial rock, hip hop, and avant-garde. The band is known for unpredictable dynamic contrast and the wide vocal range of singer Courtney Swain."},{"n":94,"year":2009,"ar":"Fever Ray","ti":"Fever Ray","cv":"https://dn710800.ca.archive.org/0/items/mbid-0672119e-e919-320d-be20-b47388891d93/mbid-0672119e-e919-320d-be20-b47388891d93-34189291904.jpg","rt":0.0,"sp":"","yt":"XHK3H2vsHd8","gen":["electro","art pop","synth-pop","electropop","ambient pop","future garage"],"hb":[],"da":"Fever Ray is the debut solo album from Fever Ray, an alias of Karin Dreijer of the electronic duo The Knife. At first, it's a little difficult to determine where the Knife ends and Fever Ray begins. On paper, it's clear -- the Knife is the project of Karin Dreijer and their brother Olof, while Fever Ray is Karin with co-producers Christoffer Berg, Van Rivers, and the Subliminal Kid -- but the differences aren't as distinct when listening to Fever Ray the first few times. Initially, the album's dark, frosty atmosphere feels like a continuation of the Knife's brilliant Silent .","dar":"Fever Ray is an alias of Swedish musician Karin Dreijer, formerly of The Knife. They debuted with the single \"If I Had A Heart\" (15 Dec 2008) under the alias, followed by the self-titled album Fever Ray (2009). Their second album, Plunge was released in October 2017 without prior announcement. Their vocal style is highly distinct - shrill and piercing, with a heavy Swedish accent and frequent use of pitch-shifting technology.\n\nDreijer was born on 7 April 1975 in Gothenburg, Sweden."},{"n":41,"year":2006,"ar":"The Knife","ti":"Silent Shout","cv":"https://cdn2.albumoftheyear.org/600x0/album/silent-shout-1.jpg","rt":0.0,"sp":"","yt":"SDdVVPOcLhM","gen":["electro","synth-pop","electropop","techno","Electronic"],"hb":["Frikomid","Nubis84","alberto_gu","sdecandelario"],"da":null,"dar":"The Knife was an electronic duo from Gothenburg, Sweden formed in 1999. The band consisted of siblings Karin Dreijer (formerly of Honey is Cool, now Fever Ray) and Olof Dreijer (Oni Ayhun) - who also run their own record company, Rabid Records. Their lyrics were often political and left-leaning, involving strong critique of capitalism, colonialism and discrimination, and expressing support for causes including but not limited to queer rights, feminism and gender politics."},{"n":49,"year":1999,"ar":"The Magnetic Fields","ti":"69 Love Songs","cv":"https://dn710705.ca.archive.org/0/items/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d/mbid-3404f020-f022-4afa-bc03-d1a11f30fd2d-7440735207.jpg","rt":0.0,"sp":"","yt":"5VO4R98Ti6I","gen":["synth-pop","chamber pop","indie folk","indie pop","twee pop","Alternative Rock"],"hb":[],"da":null,"dar":"The Magnetic Fields is an American indie pop band that formed in Boston, MA in 1988 by Stephin Merritt. Albums released under the name \"The Magnetic Fields\" often consist of synth-pop music in a 1980s style underlying clever lyrics which are usually heavily ironic. While synth-pop often forms the foundation of their music, The Magnetic Fields' music borrows from many other styles, notably country, folk and indie pop.\n\nThe band was originally formed in Cambridge"},{"n":134,"year":1993,"ar":"Pet Shop Boys","ti":"Very","cv":"https://dn721900.ca.archive.org/0/items/mbid-1f69a919-94ca-40d0-9303-f1971c74405f/mbid-1f69a919-94ca-40d0-9303-f1971c74405f-15462084340.jpg","rt":0.0,"sp":"","yt":"5bOOzUGr2Ho","gen":["synth-pop","techno","alternative dance","euro house","dance-pop","dance-rock"],"hb":[],"da":"Very is the fifth studio album by English electronic duo Pet Shop Boys. It was released in September 1993, after nearly two and a half years from the duo's previous studio album, Behaviour, and the compilation album Discography: The Complete Singles Collection. Very has sold more than five million copies worldwide, and contains five UK singles. Very exhibits one of many turning points the Pet Shop Boys would make to their music, shifting from the subdued electronic pop of Behaviour to richly-instrumented dance arrangements. The content and lyrics led to Very being called their \"coming-out\" album, since it was during .","dar":"Pet Shop Boys is a British synthpop/dance music duo, consisting of Neil Tennant and Chris Lowe and were formed in London, UK in 1981.\n\nPost-modern ironists cloaked behind a veil of buoyantly melodic and lushly romantic synth pop confections, Pet Shop Boys offer wry yet strangely affecting cultural commentary communicated by the Morse code of synth washes and drum machine rhythms. After first emerging in the mid-'80s with \"West End Girls\" and \"Opportunities (Let's Make Lots of Money)"},{"n":141,"year":1993,"ar":"Saint Etienne","ti":"So Tough","cv":"https://dn710709.ca.archive.org/0/items/mbid-f407323c-2332-3168-bf36-3b810cec0624/mbid-f407323c-2332-3168-bf36-3b810cec0624-3475192363.jpg","rt":0.0,"sp":"","yt":"j21pUaInxWo","gen":["synth-pop","indie pop","alternative dance","house","Electronic","Alternative Rock"],"hb":[],"da":"So Tough is the second studio album by British band Saint Etienne, released on Heavenly in 1993. It is their highest-charting album to date, reaching No. 7 on the UK Album Chart. So Tough is the first Saint Etienne album to feature Sarah Cracknell as an official member of the band. It was originally intended as a concept album which starts at \"Mario's Cafe\" in London then travels around the world, but it ultimately came to be viewed as a solely London album. One of the distinctive features of the album is the use of samples between the songs. The .","dar":"Saint Etienne is an indie dance/indie pop trio which formed in Croydon, England in 1990. The band was founded by journalist Bob Stanley (born December 25, 1964) and Pete Wiggs (born May 15, 1966) in Croydon, UK, January 1990. After recording 2 singles with guest singers, Sarah Cracknell (born April 12, 1967, Chelmsford, Essex) joined as a full member. The band is named after a French football team.\n\nSaint Etienne are one of the bands who defined the early 90s indie dance genre"},{"n":5,"year":1990,"ar":"Depeche Mode","ti":"Violator","cv":"https://dn710309.ca.archive.org/0/items/mbid-5454efa9-445a-4b73-8d16-e9fdbf022119/mbid-5454efa9-445a-4b73-8d16-e9fdbf022119-18529866710.jpg","rt":0.0,"sp":"","yt":"NF9Pc2FvgQU","gen":["synth-pop","alternative dance"],"hb":[],"da":"Violator is the seventh album by the English synthpop group Depeche Mode, released by Mute in 1990. Preceded by the hit singles Personal Jesus and Enjoy the Silence (a Top 10 hit on both sides of the Atlantic), Violator propelled the band into international stardom. The album yielded two further hit singles, Policy of Truth and World in My Eyes. This album is the first of the band to achieve the Top 10 on the Billboard 200 (number seven) and stand 74 weeks in the chart. In 2003, the album was ranked number 342 on Rolling Stone magazine's list of .","dar":"Depeche Mode is an English synthpop band formed in Basildon, Essex in 1980. The original lineup included Dave Gahan, Martin Gore, Andy Fletcher, and Vince Clarke. The current lineup consists of Gahan and Gore.\n\nWith Clarke as their primary songwriter, Depeche Mode released their debut album \"Speak & Spell\" in 1981 during the British new wave movement. Clarke left the band at the end of 1981 and later formed the groups Yazoo and Erasure. Following his departure"},{"n":18,"year":1990,"ar":"Prefab Sprout","ti":"Jordan: The Comeback","cv":"https://dn721601.ca.archive.org/0/items/mbid-43f87b31-88ab-4ce2-b43b-ef00c845240b/mbid-43f87b31-88ab-4ce2-b43b-ef00c845240b-27014615934.jpg","rt":0.0,"sp":"","yt":"QPbaYJpK_sw","gen":["pop rock","synth-pop","Pop","Alternative Rock"],"hb":[],"da":"Jordan: The Comeback is the fifth album by Prefab Sprout, released in August 1990. The album showed Prefab Sprout continuing their musical evolution from the prickly jangle guitars of Swoon, their debut. The use of synths is more prominent, lending the album a poppier feel, and Paddy McAloon explores other genres on some songs, from samba to doo-wop. The album was critically acclaimed: it was nominated for Best Album at the BRIT Awards, and reached #7 on the charts in the UK. It was - by Prefab Sprout's admittedly modest standards - a commercial success. Their next album, 1997's Andromeda .","dar":"Prefab Sprout are an English pop band from Witton Gilbert, County Durham formed in 1976, who rose to fame during the 1980s. Though critically acclaimed, and considered by many to have released some of the best pop albums of the decade, the band never matched this acclaim with commercial success. The band's best known lineup comprised Paddy McAloon (vocals, guitar, keyboard), Wendy Smith (vocals, guitar, keyboard), Martin McAloon (bass), and Neil Conti (drums)."},{"n":89,"year":1990,"ar":"Pet Shop Boys","ti":"Behaviour","cv":"https://dn721201.ca.archive.org/0/items/mbid-30a9bbd6-e456-3478-9a35-1cf958cf9637/mbid-30a9bbd6-e456-3478-9a35-1cf958cf9637-15279604002.jpg","rt":0.0,"sp":"","yt":"iQAiRNeZMYg","gen":["synth-pop","dance-pop","deep house","sophisti-pop","Electronic","Pop"],"hb":[],"da":"Behaviour (Behavior in the original US pressing) is the fifth album, the fourth of entirely new music, by the UK electronic music group Pet Shop Boys. It was first released on October 22, 1990. It was also released in Japan with an additional CD3. Although a popular album among fans, in the context of Pet Shop Boys' other albums, Behaviour differs in production value. Harold Faltermeyer was hired on to produce the album at his \"Red Deer\" studio in Munich, Germany. Because they were dissatisfied with the available digital synthesisers and samples, Pet Shop Boys wanted to use analogue synthesisers. .","dar":"Pet Shop Boys is a British synthpop/dance music duo, consisting of Neil Tennant and Chris Lowe and were formed in London, UK in 1981.\n\nPost-modern ironists cloaked behind a veil of buoyantly melodic and lushly romantic synth pop confections, Pet Shop Boys offer wry yet strangely affecting cultural commentary communicated by the Morse code of synth washes and drum machine rhythms. After first emerging in the mid-'80s with \"West End Girls\" and \"Opportunities (Let's Make Lots of Money)"}];
const U = ["BipolarMuzik", "EliasJ72", "Frikomid", "GabredMared", "Lonsonxd", "Nubis84", "Rocky_stereo", "alberto_gu", "paqueradejere", "sdecandelario", "verygooood"];
let cu = localStorage.getItem('sp_user') || '';
let ci = null;

const obs = new IntersectionObserver(es => {
  es.forEach(e => {
    if (e.isIntersecting) {
      const i = e.target;
      i.src = i.dataset.src;
      delete i.dataset.src;
      obs.unobserve(i);
    }
  });
}, {rootMargin: '200px'});

const sel = document.getElementById('usel');
if (cu) sel.value = cu;

function setUser(u) {
  cu = u;
  localStorage.setItem('sp_user', u);
  render();
  if (ci !== null) openPanel(ci);
}

function heard(a) {
  return cu ? a.hb.includes(cu) : false;
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase();
  const filtered = q
    ? A.filter(a => a.ar.toLowerCase().includes(q) || a.ti.toLowerCase().includes(q))
    : A;

  const byYear = {};
  filtered.forEach(a => {
    (byYear[a.year] = byYear[a.year] || []).push(a);
  });
  const years = Object.keys(byYear).map(Number).sort((a, b) => b - a);

  const hc = filtered.filter(heard).length;
  const pct = filtered.length ? Math.round(hc / filtered.length * 100) : 0;
  document.getElementById('stats').textContent =
    filtered.length + ' álbumes' +
    (cu ? ' · ' + hc + ' escuchados (' + pct + '%)' : '');

  document.getElementById('content').innerHTML = years.map(yr => {
    const yAlb = byYear[yr];
    const yHc  = yAlb.filter(heard).length;
    const cards = yAlb.map(a => {
      const idx = A.indexOf(a);
      const h   = heard(a);
      return '<div class="card' + (h ? ' heard' : '') + '" onclick="openPanel(' + idx + ')">' +
        (a.cv
          ? '<img class="card-img" data-src="' + a.cv + '" src="" alt="">'
          : '<div class="card-img"></div>') +
        (a.rt ? '<span class="card-rating">' + a.rt.toFixed(2) + '</span>' : '') +
        '<div class="card-info">' +
          '<div class="card-artist">' + a.ar + '</div>' +
          '<div class="card-title">'  + a.ti + '</div>' +
        '</div></div>';
    }).join('');
    return '<div class="year-block">' +
      '<div class="year-heading">' + yr +
        '<small style="font-weight:400;color:#555;margin-left:8px">(' +
          yAlb.length + ' álbumes' +
          (cu ? ' · ' + yHc + ' escuchados' : '') +
        ')</small></div>' +
      '<div class="album-grid">' + cards + '</div>' +
      '</div>';
  }).join('') || '<p style="padding:40px;color:#555">Sin resultados.</p>';

  document.querySelectorAll('.card-img[data-src]').forEach(i => obs.observe(i));
}

function openPanel(idx) {
  ci = idx;
  const a = A[idx];
  document.getElementById('pcv').src = a.cv || '';
  document.getElementById('pti').textContent = a.ti;
  document.getElementById('par').textContent = a.ar;
  document.getElementById('pyr').textContent = a.year;
  document.getElementById('prt').textContent = a.rt ? '★ ' + a.rt.toFixed(2) : '';
  document.getElementById('pgen').innerHTML =
    (a.gen || []).map(g => '<span class="panel-genre">' + g + '</span>').join('');
  document.getElementById('phb').innerHTML = a.hb.length
    ? '<span class="heard-label">Escuchado por:</span>' +
      a.hb.map(u => '<span class="heard-user">' + u + '</span>').join('')
    : (cu ? '<span style="color:#555">No escuchado</span>' : '');
  const links = [];
  if (a.sp) links.push('<a class="panel-link" href="' + a.sp + '" target="_blank">Sputnikmusic</a>');
  document.getElementById('plk').innerHTML = links.join('');
  document.getElementById('pyt').innerHTML = a.yt
    ? '<iframe src="https://www.youtube.com/embed/' + a.yt + '" allowfullscreen></iframe>' : '';
  const desc = [a.da, a.dar].filter(Boolean).join('<hr style="margin:7px 0;border-color:#2a2a2a">');
  document.getElementById('pds').innerHTML = desc;
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
  ci = null;
}

document.addEventListener('keydown', e => { if (e.key === 'Escape') closePanel(); });
render();
</script>
